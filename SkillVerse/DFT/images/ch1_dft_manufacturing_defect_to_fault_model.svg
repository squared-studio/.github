<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDft1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowDft1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="500" fill="url(#bgGradDft1)"/>

  <!-- Title -->
  <text x="450" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle">Physical Silicon Defects to Logical Fault Models</text>
  <text x="450" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Translating Nanometer Fabrication Impurities into Testable Digital Mathematical Models</text>

  <!-- 3 Stages Grid -->
  <!-- 1. Physical Domain -->
  <g transform="translate(30, 90)">
    <rect width="255" height="375" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" filter="url(#shadowDft1)"/>
    <rect width="255" height="38" rx="10" fill="#7f1d1d"/>
    <text x="127" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fee2e2" text-anchor="middle">1. Physical Defects (Silicon)</text>

    <!-- Defect Visual -->
    <g transform="translate(18, 55)">
      <rect width="219" height="135" rx="6" fill="#131d33" stroke="#1e293b"/>
      <text x="12" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f87171">Wafer Fab Imperfections</text>

      <!-- Metal traces -->
      <line x1="25" y1="50" x2="195" y2="50" stroke="#64748b" stroke-width="6"/>
      <line x1="25" y1="95" x2="195" y2="95" stroke="#64748b" stroke-width="6"/>

      <!-- Particle bridge -->
      <ellipse cx="110" cy="72" rx="14" ry="26" fill="#ef4444" fill-opacity="0.8"/>
      <text x="135" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5">Short (Bridge)</text>

      <!-- Broken via -->
      <circle cx="50" cy="95" r="8" fill="#080c14" stroke="#f87171" stroke-width="2"/>
      <text x="65" y="122" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">Open Via / Void</text>
    </g>

    <!-- Explanations -->
    <g transform="translate(18, 205)">
      <text x="5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">• Airborne airborne dust</text>
      <text x="5" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Particles short metal lines</text>
      <text x="5" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">• Lithography Misalignment</text>
      <text x="5" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Sub-10nm line pinch-off / open</text>
      <text x="5" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">• Oxide Breakdown</text>
      <text x="5" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Gate leakage &amp; dielectric wear</text>
      <text x="5" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#f87171">Infinite physical varieties!</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <text x="300" y="275" font-family="'Segoe UI', sans-serif" font-size="24" fill="#38bdf8">→</text>

  <!-- 2. Electrical Circuit Domain -->
  <g transform="translate(325, 90)">
    <rect width="255" height="375" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowDft1)"/>
    <rect width="255" height="38" rx="10" fill="#78350f"/>
    <text x="127" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">2. Circuit Electrical Level</text>

    <!-- Circuit Schematics Visual -->
    <g transform="translate(18, 55)">
      <rect width="219" height="135" rx="6" fill="#131d33" stroke="#1e293b"/>
      <text x="12" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fcd34d">SPICE / Transistor Behaviors</text>

      <!-- Gate representation -->
      <path d="M 40 55 L 75 55 A 25 25 0 0 1 100 80 A 25 25 0 0 1 75 105 L 40 105 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <line x1="20" y1="68" x2="40" y2="68" stroke="#38bdf8" stroke-width="2"/>
      <line x1="20" y1="92" x2="40" y2="92" stroke="#38bdf8" stroke-width="2"/>
      <line x1="100" y1="80" x2="135" y2="80" stroke="#38bdf8" stroke-width="2"/>

      <!-- Resistor / short to VDD -->
      <line x1="135" y1="80" x2="135" y2="40" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="135" y="32" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">VDD</text>
      <text x="145" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fcd34d">R_short &lt; 50Ω</text>
    </g>

    <!-- Explanations -->
    <g transform="translate(18, 205)">
      <text x="5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde68a">• Voltage Clamping</text>
      <text x="5" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Node forced to power/ground</text>
      <text x="5" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde68a">• RC Interconnect Delay</text>
      <text x="5" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">High-resistance via slows edges</text>
      <text x="5" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fde68a">• Elevated Quiescent Current</text>
      <text x="5" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Direct path from VDD to GND (IDDQ)</text>
      <text x="5" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#fcd34d">Continuous analog parameters</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <text x="595" y="275" font-family="'Segoe UI', sans-serif" font-size="24" fill="#38bdf8">→</text>

  <!-- 3. Logical DFT Fault Model Domain -->
  <g transform="translate(620, 90)">
    <rect width="250" height="375" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadowDft1)"/>
    <rect width="250" height="38" rx="10" fill="#065f46"/>
    <text x="125" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#d1fae5" text-anchor="middle">3. Logical Fault Models (DFT)</text>

    <!-- Logical Model Box -->
    <g transform="translate(15, 55)">
      <rect width="220" height="135" rx="6" fill="#131d33" stroke="#1e293b"/>
      <text x="12" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#34d399">Standardized ATPG Targets</text>

      <rect x="15" y="36" width="190" height="26" rx="4" fill="#064e3b"/>
      <text x="110" y="53" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">Stuck-At (SA0 / SA1)</text>

      <rect x="15" y="68" width="190" height="26" rx="4" fill="#064e3b"/>
      <text x="110" y="85" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Transition Delay (TDF)</text>

      <rect x="15" y="100" width="190" height="26" rx="4" fill="#064e3b"/>
      <text x="110" y="117" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Path Delay / Bridging</text>
    </g>

    <!-- Explanations -->
    <g transform="translate(15, 205)">
      <text x="5" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">• Discrete Boolean Logic</text>
      <text x="5" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Lines permanently stuck at '0' or '1'</text>
      <text x="5" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">• Two-Pattern Timing Tests</text>
      <text x="5" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Slow-to-rise / slow-to-fall (At-Speed)</text>
      <text x="5" y="106" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">• ATPG Automation</text>
      <text x="5" y="126" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Algorithms generate test patterns</text>
      <text x="5" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#34d399">Enables 99.5%+ test coverage!</text>
    </g>
  </g>
</svg>
