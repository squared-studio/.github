<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDft4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowDft4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="520" fill="url(#bgGradDft4)"/>

  <!-- Title -->
  <text x="460" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle">Memory BIST (MBIST) &amp; Redundancy Repair Architecture</text>
  <text x="460" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">At-Speed March Pattern Generation, Fault Diagnosis, and eFuse Redundancy Re-mapping</text>

  <!-- Left: MBIST Controller Engine -->
  <g transform="translate(35, 85)">
    <rect width="360" height="400" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" filter="url(#shadowDft4)"/>
    <rect width="360" height="38" rx="10" fill="#0369a1"/>
    <text x="180" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#f0f9ff" text-anchor="middle">MBIST Controller (At-Speed)</text>

    <!-- March Sequencer FSM -->
    <g transform="translate(20, 55)">
      <rect width="320" height="75" rx="6" fill="#131d33" stroke="#0284c7"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">March Algorithm Sequencer</text>
      <text x="15" y="44" font-family="'Courier New', monospace" font-size="11" fill="#cbd5e1">March C-: ⇑(w0) ⇑(r0,w1) ⇑(r1,w0) ⇓(r0,w1) ⇓(r1,w0) ⇑(r0)</text>
      <text x="15" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">Detects: Stuck-At, Transition, Coupling (CF), Retention Faults</text>
    </g>

    <!-- Address & Data Generator -->
    <g transform="translate(20, 140)">
      <rect width="150" height="85" rx="6" fill="#131d33" stroke="#1e293b"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Address Generator</text>
      <text x="15" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Up / Down Counting</text>
      <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Fast-Row / Fast-Col</text>
      <text x="15" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Checkerboard / Diagonal</text>
    </g>

    <g transform="translate(190, 140)">
      <rect width="150" height="85" rx="6" fill="#131d33" stroke="#1e293b"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">Data Generator</text>
      <text x="15" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Solid: 0000 / FFFF</text>
      <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Checkerboard: 55/AA</text>
      <text x="15" y="76" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#cbd5e1">• Pseudorandom PRBS</text>
    </g>

    <!-- High Speed Comparator -->
    <g transform="translate(20, 235)">
      <rect width="320" height="65" rx="6" fill="#131d33" stroke="#10b981"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">At-Speed Comparator &amp; Error Trap</text>
      <text x="15" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Compares SRAM Q data vs. Expected Data at 1–2 GHz</text>
    </g>

    <!-- Result / Status -->
    <g transform="translate(20, 310)">
      <rect width="320" height="70" rx="6" fill="#0c1222" stroke="#1e293b"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">Interface &amp; Test Pins:</text>
      <text x="15" y="44" font-family="'Courier New', monospace" font-size="10" fill="#cbd5e1">BIST_START, BIST_DONE, BIST_FAIL</text>
      <text x="15" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">BIST runs autonomously without ATE vector memory</text>
    </g>
  </g>

  <!-- Arrow Controller -> SRAM -->
  <line x1="395" y1="210" x2="435" y2="210" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="430,206 438,210 430,214" fill="#38bdf8"/>
  <text x="415" y="198" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">Test MUX</text>

  <!-- Right: Embedded Memory Array & BIRA / eFuse -->
  <g transform="translate(445, 85)">
    <rect width="440" height="400" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadowDft4)"/>
    <rect width="440" height="38" rx="10" fill="#065f46"/>
    <text x="220" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ecfdf5" text-anchor="middle">SRAM Array &amp; Redundancy Repair</text>

    <!-- SRAM Matrix Representation -->
    <g transform="translate(25, 55)">
      <rect width="250" height="150" rx="6" fill="#131d33" stroke="#38bdf8"/>
      <text x="125" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Standard Memory Core (e.g. 1MB)</text>

      <!-- Bad cell marked in red -->
      <circle cx="95" cy="80" r="10" fill="#ef4444" fill-opacity="0.8"/>
      <text x="95" y="84" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">X</text>
      <text x="110" y="84" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#f87171"> Defect (Row 42)</text>

      <!-- Spare Row and Spare Column -->
      <rect x="0" y="125" width="250" height="25" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b"/>
      <text x="125" y="142" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle">Redundant Spare Rows</text>
    </g>

    <!-- Spare Column Side -->
    <g transform="translate(280, 55)">
      <rect width="60" height="150" rx="4" fill="#a855f7" fill-opacity="0.25" stroke="#a855f7"/>
      <text x="30" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#d8b4fe" text-anchor="middle">Spare</text>
      <text x="30" y="80" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#d8b4fe" text-anchor="middle">Columns</text>
    </g>

    <!-- BIRA / Redundancy Box -->
    <g transform="translate(25, 225)">
      <rect width="390" height="150" rx="8" fill="#131d33" stroke="#34d399"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Built-In Redundancy Analysis (BIRA) &amp; eFuse Repair</text>

      <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">1. BIRA logs failing bit addresses in fault registers.</text>
      <text x="15" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">2. Allocation algorithm maps defective Row 42 to Spare Row 0.</text>
      <text x="15" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">3. Non-volatile <tspan fill="#f59e0b" font-weight="700">eFuse Box</tspan> permanently burns laser/electrical fuses.</text>
      <text x="15" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">4. At power-on boot, repair fuse register automatically redirects Row 42.</text>
      <text x="15" y="136" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#34d399">Outcome: Recovers 100% chip yield on memories with silicon defects!</text>
    </g>
  </g>
</svg>
