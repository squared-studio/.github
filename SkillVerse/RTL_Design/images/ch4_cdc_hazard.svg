<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Clock Domain Crossing (CDC) Metastability Hazard</text>

  <rect x="40" y="65" width="160" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="95" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Domain A (clk_a)</text>
  <text x="120" y="115" font-size="10" fill="#2563eb" text-anchor="middle">Launch Flip-Flop</text>
  <text x="120" y="140" font-size="10" fill="#64748b" text-anchor="middle">e.g. 100 MHz</text>

  <line x1="200" y1="115" x2="284" y2="115" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="290" y="65" width="140" height="100" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" filter="url(#shadow)"/>
  <text x="360" y="95" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">CDC Boundary</text>
  <text x="360" y="115" font-size="10" fill="#b91c1c" text-anchor="middle">Setup/Hold Violation</text>
  <text x="360" y="140" font-size="9.5" font-weight="700" fill="#ef4444" text-anchor="middle">METASTABILITY RISK</text>

  <line x1="430" y1="115" x2="514" y2="115" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="520" y="65" width="160" height="100" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="95" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Domain B (clk_b)</text>
  <text x="600" y="115" font-size="10" fill="#059669" text-anchor="middle">Capture Flip-Flop</text>
  <text x="600" y="140" font-size="10" fill="#64748b" text-anchor="middle">e.g. 148.5 MHz</text>

</svg>