<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="670" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">SystemVerilog Stratified Event Queue Execution Order</text>

  <!-- Pipeline of regions -->
  <rect x="35" y="65" width="115" height="70" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="92" y="95" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">1. Preponed</text>
  <text x="92" y="115" font-size="9" fill="#475569" text-anchor="middle">Sample for SVA</text>

  <line x1="150" y1="100" x2="169" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>

  <rect x="175" y="65" width="115" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="232" y="95" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">2. Active</text>
  <text x="232" y="115" font-size="9" fill="#2563eb" text-anchor="middle">Comb logic &amp; (=)</text>

  <line x1="290" y1="100" x2="309" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="315" y="65" width="115" height="70" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="372" y="95" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">3. NBA</text>
  <text x="372" y="115" font-size="9" fill="#047857" text-anchor="middle">DFF updates (&lt;=)</text>

  <line x1="430" y1="100" x2="449" y2="100" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="455" y="65" width="115" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="512" y="95" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">4. Observed</text>
  <text x="512" y="115" font-size="9" fill="#78350f" text-anchor="middle">Evaluate Assertions</text>

  <line x1="570" y1="100" x2="589" y2="100" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="595" y="65" width="90" height="70" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="640" y="95" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">5. Postponed</text>
  <text x="640" y="115" font-size="9" fill="#64748b" text-anchor="middle">Waveform dump</text>

</svg>