<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Layered Self-Checking Testbench Architecture</text>

  <!-- Stimulus Generator -->
  <rect x="40" y="65" width="125" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="95" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Stimulus Generator</text>
  <text x="102" y="115" font-size="9" fill="#2563eb" text-anchor="middle">Random / Directed</text>

  <line x1="165" y1="100" x2="204" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Driver -->
  <rect x="210" y="65" width="105" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="262" y="95" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Driver</text>
  <text x="262" y="115" font-size="9" fill="#2563eb" text-anchor="middle">Pin wiggling</text>

  <line x1="315" y1="100" x2="354" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- DUT -->
  <rect x="360" y="55" width="130" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="425" y="92" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">RTL DUT</text>
  <text x="425" y="112" font-size="10" fill="#047857" text-anchor="middle">Design Under Test</text>

  <line x1="490" y1="100" x2="529" y2="100" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Monitor -->
  <rect x="535" y="65" width="105" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="587" y="95" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Monitor</text>
  <text x="587" y="115" font-size="9" fill="#78350f" text-anchor="middle">Passive sampler</text>

  <!-- Scoreboard -->
  <rect x="260" y="160" width="330" height="45" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="425" y="187" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Scoreboard &amp; Golden Model (Self-Checking)</text>

  <polyline points="102,135 102,180 254,180" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <polyline points="587,135 587,180 596,180" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>

</svg>