<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Synchronous FIFO Architecture</text>

  <!-- Dual Port RAM Core -->
  <rect x="250" y="60" width="220" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="88" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Dual-Port Memory Core</text>
  <text x="360" y="108" font-size="10" fill="#2563eb" text-anchor="middle">Depth = 2^N Words</text>
  
  <text x="260" y="135" font-size="10" fill="#64748b">wr_addr</text>
  <text x="260" y="155" font-size="10" fill="#64748b">wr_data</text>
  <text x="420" y="135" font-size="10" fill="#64748b">rd_addr</text>
  <text x="420" y="155" font-size="10" fill="#64748b">rd_data</text>

  <!-- Write Pointer -->
  <rect x="40" y="60" width="140" height="65" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="85" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Write Pointer [N:0]</text>
  <text x="110" y="103" font-size="9" fill="#047857" text-anchor="middle">Includes Wrap Bit</text>

  <!-- Read Pointer -->
  <rect x="40" y="140" width="140" height="65" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="110" y="165" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Read Pointer [N:0]</text>
  <text x="110" y="183" font-size="9" fill="#047857" text-anchor="middle">Includes Wrap Bit</text>

  <!-- Routing pointers to RAM -->
  <line x1="180" y1="90" x2="244" y2="130" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="180" y1="170" x2="244" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Full/Empty Logic -->
  <rect x="540" y="70" width="160" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="95" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Status Comparison</text>
  <text x="620" y="120" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">empty: wr_ptr == rd_ptr</text>
  <text x="620" y="145" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">full: MSB differs &amp; addr eq</text>
  <line x1="470" y1="150" x2="534" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

</svg>