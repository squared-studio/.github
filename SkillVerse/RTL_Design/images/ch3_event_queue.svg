<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="670" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Event Scheduler: Blocking (=) vs Non-Blocking (&lt;=)</text>

  <rect x="35" y="60" width="280" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="85" font-size="12" font-weight="700" fill="#1e3a8a">Active Region: Blocking (=)</text>
  <text x="50" y="105" font-size="10.5" fill="#1e40af">- Evaluates RHS &amp; updates LHS immediately</text>
  <text x="50" y="122" font-size="10.5" fill="#1e40af">- Next line sees new value in zero simulation time</text>
  <text x="50" y="139" font-size="10" font-weight="700" fill="#2563eb">Required for combinational always_comb</text>

  <line x1="325" y1="105" x2="354" y2="105" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-slate)"/>

  <rect x="365" y="60" width="300" height="90" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="380" y="85" font-size="12" font-weight="700" fill="#5b21b6">NBA Region: Non-Blocking (&lt;=)</text>
  <text x="380" y="105" font-size="10.5" fill="#7c3aed">- RHS evaluated in Active; update deferred to NBA</text>
  <text x="380" y="122" font-size="10.5" fill="#7c3aed">- All registers update concurrently on clock edge</text>
  <text x="380" y="139" font-size="10" font-weight="700" fill="#6d28d9">Eliminates race conditions between flip-flops</text>

</svg>