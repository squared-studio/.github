<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Moore State Machine Architecture</text>

  <text x="35" y="85" font-size="11" font-weight="600" fill="#1e293b">Inputs</text>
  <line x1="75" y1="80" x2="114" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="120" y="55" width="130" height="70" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="85" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Next-State Logic</text>
  <text x="185" y="105" font-size="9" fill="#047857" text-anchor="middle">Combinational</text>

  <line x1="250" y1="80" x2="294" y2="80" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="300" y="55" width="110" height="70" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="355" y="85" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">State Register</text>
  <text x="355" y="105" font-size="9" fill="#2563eb" text-anchor="middle">(Flip-Flops)</text>

  <line x1="410" y1="80" x2="474" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="440" cy="80" r="3" fill="#2563eb"/>

  <rect x="480" y="55" width="130" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="545" y="85" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Output Logic</text>
  <text x="545" y="105" font-size="9" fill="#2563eb" text-anchor="middle">Function of State ONLY</text>

  <line x1="610" y1="80" x2="674" y2="80" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="640" y="70" font-size="11" font-weight="700" fill="#1e3a8a">Outputs</text>

  <!-- State Feedback -->
  <polyline points="440,80 440,150 185,150 185,129" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="315" y="165" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">Current State Feedback</text>

</svg>