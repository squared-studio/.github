<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" width="700" height="180" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="670" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">State Encoding Techniques Comparison</text>

  <rect x="35" y="60" width="195" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="132" y="85" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Binary Encoding</text>
  <text x="132" y="105" font-size="10" fill="#1e40af" text-anchor="middle">- Min flip-flops: ceil(log2 N)</text>
  <text x="132" y="122" font-size="10" fill="#1e40af" text-anchor="middle">- Multiple bits toggle per state</text>
  <text x="132" y="139" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">Best for ASICs (Area saving)</text>

  <rect x="250" y="60" width="195" height="90" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="347" y="85" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Gray Encoding</text>
  <text x="347" y="105" font-size="10" fill="#047857" text-anchor="middle">- Exactly 1 bit toggles</text>
  <text x="347" y="122" font-size="10" fill="#047857" text-anchor="middle">- Minimizes switching power</text>
  <text x="347" y="140" font-size="10" font-weight="700" fill="#059669" text-anchor="middle">Best for Low Power &amp; CDC</text>

  <rect x="465" y="60" width="195" height="90" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="562" y="85" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">One-Hot Encoding</text>
  <text x="562" y="105" font-size="10" fill="#7c3aed" text-anchor="middle">- 1 flip-flop per state (N FFs)</text>
  <text x="562" y="122" font-size="10" fill="#7c3aed" text-anchor="middle">- Single gate next-state decoding</text>
  <text x="562" y="140" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">Best for FPGAs (Max Speed)</text>

</svg>