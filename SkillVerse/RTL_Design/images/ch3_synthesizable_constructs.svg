<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">SystemVerilog: Synthesizable RTL vs Verification Constructs</text>
  
  <rect x="35" y="60" width="315" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="85" font-size="13" font-weight="700" fill="#1e3a8a">Synthesizable RTL Subset</text>
  <text x="50" y="105" font-size="10.5" fill="#1e40af">- Maps to gates, flip-flops, LUTs, DSPs, BRAMs</text>
  <text x="50" y="122" font-size="10.5" fill="#1e40af">- always_comb, always_ff, assign</text>
  <text x="50" y="139" font-size="10.5" fill="#1e40af">- if-else, case, bounded loops, operators</text>
  <text x="50" y="156" font-size="10.5" fill="#1e40af">- parameters, generate, packed structs, enums</text>
  <text x="50" y="173" font-size="10" font-weight="700" fill="#2563eb">Target: Silicon ASIC &amp; FPGA Implementation</text>

  <rect x="370" y="60" width="315" height="130" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="385" y="85" font-size="13" font-weight="700" fill="#991b1b">Simulation-Only Constructs (Testbench)</text>
  <text x="385" y="105" font-size="10.5" fill="#b91c1c">- initial blocks, fork-join, wait</text>
  <text x="385" y="122" font-size="10.5" fill="#b91c1c">- #delays (e.g., #10ns) - NO physical meaning</text>
  <text x="385" y="139" font-size="10.5" fill="#b91c1c">- Classes, mailboxes, semaphores, queues</text>
  <text x="385" y="156" font-size="10.5" fill="#b91c1c">- $display, $finish, $fopen file I/O</text>
  <text x="385" y="173" font-size="10" font-weight="700" fill="#dc2626">Target: EDA Simulator Only (Ignored by Synthesis)</text>

</svg>