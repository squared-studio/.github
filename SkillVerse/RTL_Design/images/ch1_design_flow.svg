<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 190" width="780" height="190" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="750" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Modern RTL ASIC &amp; FPGA Design Flow</text>

  <rect x="35" y="60" width="95" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="82" y="87" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">1. Specification</text>
  <text x="82" y="105" font-size="9" fill="#64748b" text-anchor="middle">Arch &amp; Protocols</text>

  <line x1="130" y1="90" x2="156" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate)"/>

  <rect x="160" y="60" width="105" height="60" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="212" y="87" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">2. RTL Coding</text>
  <text x="212" y="105" font-size="9" fill="#2563eb" text-anchor="middle">SystemVerilog</text>

  <line x1="265" y1="90" x2="291" y2="90" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="295" y="60" width="115" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="352" y="87" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">3. Verification</text>
  <text x="352" y="105" font-size="9" fill="#b45309" text-anchor="middle">Sim &amp; Assertions</text>

  <line x1="410" y1="90" x2="436" y2="90" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="440" y="60" width="110" height="60" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="495" y="87" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">4. Synthesis</text>
  <text x="495" y="105" font-size="9" fill="#047857" text-anchor="middle">Netlist &amp; SDC</text>

  <line x1="550" y1="90" x2="576" y2="90" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="580" y="60" width="145" height="60" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="652" y="87" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">5. Implementation</text>
  <text x="652" y="105" font-size="9" fill="#7c3aed" text-anchor="middle">P&amp;R / Bitstream / GDSII</text>

  <path d="M 352 120 Q 352 152 212 152 Q 212 152 212 124" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="282" y="147" font-size="9" font-weight="600" fill="#ef4444" text-anchor="middle">Fix Functional Bugs</text>

</svg>