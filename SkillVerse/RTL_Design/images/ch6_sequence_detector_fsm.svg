<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">State Transition Diagram: Sequence Detector ("1011" with Overlap)</text>

  <!-- States -->
  <circle cx="80" cy="100" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="80" y="104" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">S_IDLE</text>

  <circle cx="250" cy="100" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="104" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">S_1</text>

  <circle cx="430" cy="100" r="30" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="104" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">S_10</text>

  <circle cx="610" cy="100" r="30" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="610" y="104" font-size="11" font-weight="800" fill="#92400e" text-anchor="middle">S_101</text>

  <!-- Forward transitions -->
  <line x1="110" y1="100" x2="216" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="165" y="92" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">1 / 0</text>

  <line x1="280" y1="100" x2="396" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="340" y="92" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">0 / 0</text>

  <line x1="460" y1="100" x2="576" y2="100" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="520" y="92" font-size="10" font-weight="700" fill="#2563eb" text-anchor="middle">1 / 0</text>

  <!-- Overlap match back to S_1 -->
  <path d="M 610 70 Q 430 20 250 68" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="430" y="32" font-size="11" font-weight="800" fill="#065f46" text-anchor="middle">1 / DETECTED! (Overlap)</text>

</svg>