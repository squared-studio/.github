<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="180" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Reset Synchronizer: Asynchronous Assert, Synchronous De-assert</text>

  <text x="40" y="85" font-size="11" font-weight="700" fill="#1e293b">1'b1 (VDD)</text>
  <line x1="100" y1="80" x2="144" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="150" y="55" width="110" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="205" y="80" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">FF 1</text>
  <text x="160" y="85" font-size="10" fill="#64748b">D</text>
  <text x="250" y="85" font-size="10" fill="#64748b">Q</text>
  <path d="M 150 105 L 160 112 L 150 119 Z" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <line x1="260" y1="80" x2="334" y2="80" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="340" y="55" width="110" height="80" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="395" y="80" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">FF 2</text>
  <text x="350" y="85" font-size="10" fill="#64748b">D</text>
  <text x="440" y="85" font-size="10" fill="#64748b">Q</text>
  <path d="M 340 105 L 350 112 L 340 119 Z" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <line x1="450" y1="80" x2="524" y2="80" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="535" y="85" font-size="11" font-weight="700" fill="#065f46">sync_rst_n_o</text>

  <!-- Asynchronous Clear line -->
  <line x1="40" y1="160" x2="400" y2="160" stroke="#ef4444" stroke-width="2"/>
  <polyline points="205,160 205,135" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <polyline points="395,160 395,135" fill="none" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="40" y="180" font-size="10.5" font-weight="700" fill="#dc2626">async_rst_n_i (Asserts asynchronously immediately)</text>

  <line x1="480" y1="160" x2="580" y2="160" stroke="#8b5cf6" stroke-width="2"/>
  <text x="590" y="165" font-size="11" font-weight="700" fill="#6d28d9">clk (Sync release)</text>

</svg>