<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="650" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">SystemVerilog Procedural Blocks: Combinational vs Sequential</text>

  <rect x="35" y="60" width="295" height="110" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="85" font-size="13" font-weight="700" fill="#065f46">always_comb</text>
  <text x="50" y="105" font-size="10.5" fill="#047857">- Pure combinational logic</text>
  <text x="50" y="122" font-size="10.5" fill="#047857">- Implicit complete sensitivity list</text>
  <text x="50" y="139" font-size="10.5" fill="#047857">- Checks for unintentional latches</text>
  <text x="50" y="156" font-size="11" font-weight="700" fill="#059669">RULE: Use BLOCKING assignments (=)</text>

  <rect x="350" y="60" width="295" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="85" font-size="13" font-weight="700" fill="#1e3a8a">always_ff @(posedge clk)</text>
  <text x="365" y="105" font-size="10.5" fill="#1e40af">- Edge-triggered sequential logic</text>
  <text x="365" y="122" font-size="10.5" fill="#1e40af">- Infers D Flip-Flops &amp; registers</text>
  <text x="365" y="139" font-size="10.5" fill="#1e40af">- Explicit clock and optional async reset edge</text>
  <text x="365" y="156" font-size="11" font-weight="700" fill="#2563eb">RULE: Use NON-BLOCKING assignments (&lt;=)</text>

</svg>