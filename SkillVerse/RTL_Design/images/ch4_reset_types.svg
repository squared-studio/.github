<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="650" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Reset Architecture: Synchronous vs Asynchronous</text>

  <rect x="35" y="60" width="295" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="85" font-size="12" font-weight="700" fill="#1e3a8a">Synchronous Reset</text>
  <text x="50" y="105" font-size="10" fill="#1e40af">- Reset sampled ONLY on clock edge</text>
  <text x="50" y="122" font-size="10" fill="#1e40af">- Glitch-free; STA analyzes path normally</text>
  <text x="50" y="139" font-size="10" font-weight="700" fill="#2563eb">Requires a running clock</text>

  <rect x="350" y="60" width="295" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="365" y="85" font-size="12" font-weight="700" fill="#991b1b">Asynchronous Reset</text>
  <text x="365" y="105" font-size="10" fill="#b91c1c">- Direct clear; acts even if clock is stopped</text>
  <text x="365" y="122" font-size="10" fill="#b91c1c">- Glitch-sensitive; release causes metastability</text>
  <text x="365" y="139" font-size="10" font-weight="700" fill="#dc2626">Requires Recovery &amp; Removal timing checks</text>

</svg>