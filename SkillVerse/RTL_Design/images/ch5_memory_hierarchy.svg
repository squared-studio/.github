<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Digital Memory Hierarchy</text>

  <!-- Pyramid blocks -->
  <rect x="220" y="60" width="280" height="32" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="81" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Registers (Flip-Flops): &lt; 1 ns | Lowest Density</text>

  <rect x="180" y="98" width="360" height="32" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="119" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">On-Chip SRAM / L1-L2 Cache: 1-3 ns | Moderate</text>

  <rect x="140" y="136" width="440" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="157" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Embedded Block RAM (BRAM / UltraRAM): 2-5 ns | High</text>

  <rect x="100" y="174" width="520" height="32" rx="6" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
  <text x="360" y="195" font-size="11" font-weight="700" fill="#9d174d" text-anchor="middle">External Main Memory (DDR4 / DDR5): 20-50 ns | Very High</text>

  <rect x="60" y="212" width="600" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="229" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Non-Volatile Storage (NAND Flash / SSD / ROM): &gt; 10 us | Extreme Density</text>

</svg>