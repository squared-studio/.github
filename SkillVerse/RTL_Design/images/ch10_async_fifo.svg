<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Dual-Clock Asynchronous FIFO with Gray-Code CDC</text>

  <!-- Write Domain -->
  <rect x="35" y="60" width="220" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="145" y="85" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Write Domain (wr_clk)</text>
  <rect x="50" y="100" width="190" height="40" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="145" y="125" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Binary Write Pointer -&gt; Gray</text>

  <!-- Storage RAM -->
  <rect x="295" y="60" width="150" height="145" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="370" y="90" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Dual-Port RAM</text>
  <text x="370" y="115" font-size="10" fill="#64748b" text-anchor="middle">Asynchronous Storage</text>
  <text x="370" y="140" font-size="10" fill="#64748b" text-anchor="middle">wr_clk &amp; rd_clk</text>

  <!-- Read Domain -->
  <rect x="485" y="60" width="220" height="145" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="595" y="85" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Read Domain (rd_clk)</text>
  <rect x="500" y="100" width="190" height="40" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="595" y="125" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Binary Read Pointer -&gt; Gray</text>

  <!-- Cross Domain 2FF Synchronizers -->
  <path d="M 240 120 Q 370 20 500 120" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <rect x="320" y="30" width="100" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="370" y="44" font-size="9" font-weight="700" fill="#1d4ed8" text-anchor="middle">wr_ptr_gray (2-FF Sync)</text>

  <path d="M 500 135 Q 370 215 240 135" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <rect x="320" y="195" width="100" height="20" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="370" y="209" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">rd_ptr_gray (2-FF Sync)</text>

</svg>