<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="590" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Unintended Transparent Latch Inference Hazard</text>

  <polygon points="180,60 250,90 180,120 110,90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="180" y="88" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">if (enable)</text>
  <text x="180" y="100" font-size="9" fill="#78350f" text-anchor="middle">Condition</text>

  <line x1="250" y1="90" x2="320" y2="90" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="285" y="82" font-size="10" font-weight="700" fill="#059669">True</text>

  <rect x="330" y="70" width="100" height="40" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="380" y="94" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">q = d;</text>

  <line x1="180" y1="120" x2="180" y2="140" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="195" y="135" font-size="10" font-weight="700" fill="#dc2626">False</text>

  <rect x="60" y="145" width="240" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="180" y="165" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">Missing 'else' -> INFERRED LATCH!</text>

  <rect x="330" y="125" width="250" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="455" y="145" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">The Safe Remedy:</text>
  <text x="455" y="162" font-size="9.5" fill="#1e40af" text-anchor="middle">Assign default values at top of always_comb!</text>

</svg>