<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="740" height="220" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Unpipelined vs 3-Stage Pipelined Throughput Comparison</text>

  <!-- Unpipelined -->
  <rect x="35" y="60" width="670" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="50" y="87" font-size="11" font-weight="700" fill="#991b1b">Unpipelined (1 Stage):</text>
  <rect x="190" y="68" width="380" height="28" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="380" y="87" font-size="10" fill="#7f1d1d" text-anchor="middle">Long Combinational Logic Cloud (t_comb = 12 ns)</text>
  <text x="590" y="87" font-size="11" font-weight="700" fill="#b91c1c">f_max = 80 MHz</text>

  <!-- Pipelined -->
  <rect x="35" y="120" width="670" height="65" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="50" y="157" font-size="11" font-weight="700" fill="#065f46">3-Stage Pipelined:</text>

  <rect x="190" y="130" width="110" height="42" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="245" y="150" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Stage 1</text>
  <text x="245" y="164" font-size="9" fill="#166534" text-anchor="middle">4 ns</text>

  <rect x="310" y="130" width="20" height="42" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="155" font-size="8" fill="#1e3a8a" text-anchor="middle">R1</text>

  <rect x="340" y="130" width="110" height="42" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="395" y="150" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Stage 2</text>
  <text x="395" y="164" font-size="9" fill="#166534" text-anchor="middle">4 ns</text>

  <rect x="460" y="130" width="20" height="42" rx="2" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="470" y="155" font-size="8" fill="#1e3a8a" text-anchor="middle">R2</text>

  <rect x="490" y="130" width="110" height="42" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="545" y="150" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Stage 3</text>
  <text x="545" y="164" font-size="9" fill="#166534" text-anchor="middle">4 ns</text>

  <text x="615" y="157" font-size="11" font-weight="700" fill="#047857">f_max = 220 MHz (2.75x Speedup!)</text>

</svg>