<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="730" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Logic Synthesis Stages: RTL to Gate Netlist</text>

  <rect x="35" y="65" width="145" height="65" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="107" y="92" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">1. Elaboration</text>
  <text x="107" y="110" font-size="9" fill="#2563eb" text-anchor="middle">Syntax &amp; Generic gates</text>

  <line x1="180" y1="97" x2="209" y2="97" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="215" y="65" width="155" height="65" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="292" y="92" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">2. Optimization</text>
  <text x="292" y="110" font-size="9" fill="#047857" text-anchor="middle">Boolean minimization</text>

  <line x1="370" y1="97" x2="399" y2="97" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="405" y="65" width="165" height="65" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="487" y="92" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">3. Tech Mapping</text>
  <text x="487" y="110" font-size="9" fill="#78350f" text-anchor="middle">Map to target Standard Cells</text>

  <line x1="570" y1="97" x2="599" y2="97" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>

  <rect x="605" y="65" width="140" height="65" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="675" y="92" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Gate Netlist (.v)</text>
  <text x="675" y="110" font-size="9" fill="#7c3aed" text-anchor="middle">+ Timing Reports</text>

  <!-- Input inputs -->
  <text x="487" y="160" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">Guided by: Target Cell Library (.lib) &amp; Timing Constraints (.sdc)</text>

</svg>