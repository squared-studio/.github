<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="42" font-size="14" font-weight="700" fill="#0f172a">Microarchitecture: Control Unit vs Datapath</text>
  
  <rect x="45" y="65" width="220" height="140" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="95" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Control Unit</text>
  <text x="155" y="120" font-size="11" fill="#78350f" text-anchor="middle">- Finite State Machine (FSM)</text>
  <text x="155" y="140" font-size="11" fill="#78350f" text-anchor="middle">- Instruction Decoder</text>
  <text x="155" y="160" font-size="11" fill="#78350f" text-anchor="middle">- Sequence &amp; Branch Logic</text>

  <rect x="455" y="65" width="220" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="565" y="95" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Datapath Unit</text>
  <text x="565" y="120" font-size="11" fill="#1e40af" text-anchor="middle">- Register Files &amp; Counters</text>
  <text x="565" y="140" font-size="11" fill="#1e40af" text-anchor="middle">- Arithmetic Logic Unit (ALU)</text>
  <text x="565" y="160" font-size="11" fill="#1e40af" text-anchor="middle">- Shifters &amp; Multiplexers</text>

  <line x1="265" y1="105" x2="451" y2="105" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <rect x="285" y="88" width="145" height="18" rx="4" fill="#ffffff" stroke="#fcd34d" stroke-width="1"/>
  <text x="357" y="101" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Enables, Opcodes, Mux Sel</text>

  <line x1="455" y1="165" x2="269" y2="165" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="285" y="148" width="145" height="18" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="357" y="161" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Zero, Carry, Overflow, Match</text>

</svg>