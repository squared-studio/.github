<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Physical Backend Implementation: FPGA vs ASIC</text>

  <rect x="35" y="65" width="305" height="100" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="50" y="90" font-size="12" font-weight="700" fill="#1e3a8a">FPGA Backend Implementation</text>
  <text x="50" y="112" font-size="10.5" fill="#1e40af">1. Logic Synthesis -&gt; Technology Map</text>
  <text x="50" y="130" font-size="10.5" fill="#1e40af">2. Placement into Configurable Logic Blocks (CLBs)</text>
  <text x="50" y="148" font-size="10.5" fill="#1e40af">3. Routing on programmable switch matrix -&gt; Bitstream</text>

  <rect x="360" y="65" width="320" height="100" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="375" y="90" font-size="12" font-weight="700" fill="#5b21b6">ASIC Physical Implementation</text>
  <text x="375" y="112" font-size="10.5" fill="#7c3aed">1. Floorplanning &amp; Power Grid Synthesis</text>
  <text x="375" y="130" font-size="10.5" fill="#7c3aed">2. Standard Cell Placement &amp; Clock Tree Synthesis (CTS)</text>
  <text x="375" y="148" font-size="10.5" fill="#7c3aed">3. Metal Layer Routing &amp; DRC/LVS Tapeout (GDSII)</text>

</svg>