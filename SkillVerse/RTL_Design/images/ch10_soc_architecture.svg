<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Modern System-on-Chip (SoC) Interconnect Architecture</text>

  <!-- Compute Complex -->
  <rect x="35" y="60" width="180" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="85" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Compute Cluster</text>
  <rect x="45" y="95" width="75" height="40" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="82" y="119" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">CPU Core 0</text>
  <rect x="130" y="95" width="75" height="40" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="167" y="119" font-size="10" font-weight="600" fill="#1d4ed8" text-anchor="middle">CPU Core 1</text>
  <rect x="45" y="145" width="160" height="45" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="125" y="172" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Shared L2 Cache</text>

  <!-- Crossbar Interconnect -->
  <rect x="250" y="60" width="220" height="145" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="95" font-size="13" font-weight="800" fill="#5b21b6" text-anchor="middle">AXI4 Interconnect</text>
  <text x="360" y="120" font-size="11" fill="#7c3aed" text-anchor="middle">High-Speed Crossbar / NoC</text>
  <text x="360" y="145" font-size="10" fill="#6d28d9" text-anchor="middle">Arbitration &amp; Routing</text>

  <line x1="205" y1="167" x2="244" y2="167" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Peripherals Subsystem -->
  <rect x="505" y="60" width="200" height="145" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="605" y="85" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Peripherals &amp; Memory</text>
  <rect x="515" y="95" width="180" height="28" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="605" y="113" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">DDR5 Memory Controller</text>
  <rect x="515" y="130" width="180" height="28" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="605" y="148" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">PCIe Gen5 / DMA Engine</text>
  <rect x="515" y="165" width="180" height="28" rx="4" fill="#ffffff" stroke="#86efac"/>
  <text x="605" y="183" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">APB Bus (UART, SPI, I2C)</text>

  <line x1="470" y1="110" x2="509" y2="110" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="470" y1="145" x2="509" y2="145" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="470" y1="180" x2="509" y2="180" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>

</svg>