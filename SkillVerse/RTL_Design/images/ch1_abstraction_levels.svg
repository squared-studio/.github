<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 320" width="740" height="320" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="290" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="42" font-size="14" font-weight="700" fill="#0f172a">Digital Design Abstraction Levels</text>

  <rect x="45" y="60" width="650" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="65" y="84" font-size="12" font-weight="700" fill="#0f172a">1. System Level</text>
  <text x="180" y="84" font-size="11" fill="#475569">C++, SystemC, Python | Transaction-Level Modeling (TLM), Architecture Exploration</text>

  <rect x="45" y="108" width="650" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="65" y="132" font-size="12" font-weight="700" fill="#0f172a">2. Algorithmic Level</text>
  <text x="180" y="132" font-size="11" fill="#475569">Flowcharts, Mathematical Specs, Pseudocode | High-Level algorithmic procedures</text>

  <rect x="45" y="156" width="650" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="600" y="164" width="85" height="16" rx="4" fill="#3b82f6"/>
  <text x="642" y="176" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">PRIMARY FOCUS</text>
  <text x="65" y="180" font-size="12" font-weight="800" fill="#1e3a8a">3. Register-Transfer Level (RTL)</text>
  <text x="65" y="194" font-size="10" font-weight="600" fill="#2563eb">SystemVerilog, VHDL | Cycle-accurate data transfers between registers; input to Logic Synthesis</text>

  <rect x="45" y="212" width="650" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="65" y="236" font-size="12" font-weight="700" fill="#065f46">4. Gate Level (Netlist)</text>
  <text x="180" y="236" font-size="11" fill="#047857">Interconnected Standard Cells (AND, OR, DFF, Mux) | Synthesized output from RTL</text>

  <rect x="45" y="260" width="650" height="38" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="65" y="284" font-size="12" font-weight="700" fill="#991b1b">5. Physical / Layout Level</text>
  <text x="180" y="284" font-size="11" fill="#b91c1c">Transistors, Vias, Metal Layers (GDSII) or FPGA Bitstream | Place &amp; Route output</text>

</svg>