<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="740" height="220" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">Industry-Standard Two-Flip-Flop (2-FF) Synchronizer</text>

  <text x="35" y="95" font-size="11" font-weight="600" fill="#64748b">async_din</text>
  <line x1="90" y1="90" x2="144" y2="90" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Stage 1 FF -->
  <rect x="150" y="55" width="130" height="90" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="215" y="85" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Stage 1 FF</text>
  <text x="215" y="105" font-size="9" fill="#dc2626" text-anchor="middle">May go metastable</text>
  <path d="M 150 120 L 160 127 L 150 134 Z" fill="none" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Interconnect -->
  <line x1="280" y1="90" x2="384" y2="90" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="332" y="80" font-size="9" fill="#b45309" text-anchor="middle">Resolves in cycle</text>

  <!-- Stage 2 FF -->
  <rect x="390" y="55" width="130" height="90" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="455" y="85" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Stage 2 FF</text>
  <text x="455" y="105" font-size="9" fill="#059669" text-anchor="middle">Clean, stable output</text>
  <path d="M 390 120 L 400 127 L 390 134 Z" fill="none" stroke="#10b981" stroke-width="1.5"/>

  <!-- Output -->
  <line x1="520" y1="90" x2="594" y2="90" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="605" y="95" font-size="11" font-weight="700" fill="#065f46">sync_dout</text>

  <!-- Clock Net -->
  <line x1="100" y1="180" x2="480" y2="180" stroke="#8b5cf6" stroke-width="2"/>
  <polyline points="200,180 200,127 150,127" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <polyline points="440,180 440,127 390,127" fill="none" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="545" y="184" font-size="11" font-weight="700" fill="#6d28d9">clk_b (Destination Clock)</text>

</svg>