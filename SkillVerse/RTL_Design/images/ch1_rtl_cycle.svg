<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="42" font-size="14" font-weight="700" fill="#0f172a">Synchronous Register-Transfer Cycle</text>
  
  <rect x="45" y="70" width="140" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="105" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Source Register</text>
  <text x="115" y="125" font-size="11" fill="#3b82f6" text-anchor="middle">(Flip-Flop)</text>
  <path d="M 45 150 L 60 160 L 45 170 Z" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="105" font-size="11" fill="#64748b">D</text>
  <text x="170" y="105" font-size="11" fill="#64748b">Q</text>

  <rect x="280" y="65" width="180" height="120" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
  <text x="370" y="105" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">Combinational Logic</text>
  <text x="370" y="125" font-size="11" fill="#047857" text-anchor="middle">ALU, Muxes, Decoders</text>
  <text x="370" y="145" font-size="10" fill="#64748b" text-anchor="middle">Evaluates during cycle</text>

  <rect x="550" y="70" width="140" height="110" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="105" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Destination Reg</text>
  <text x="620" y="125" font-size="11" fill="#3b82f6" text-anchor="middle">(Flip-Flop)</text>
  <path d="M 550 150 L 565 160 L 550 170 Z" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="565" y="105" font-size="11" fill="#64748b">D</text>
  <text x="675" y="105" font-size="11" fill="#64748b">Q</text>

  <line x1="185" y1="110" x2="276" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="230" y="102" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">Launched Data</text>

  <line x1="460" y1="110" x2="546" y2="110" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="503" y="102" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">Next State</text>

  <line x1="30" y1="200" x2="680" y2="200" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4"/>
  <polyline points="95,200 95,160 45,160" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <polyline points="600,200 600,160 550,160" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>
  <circle cx="95" cy="200" r="3.5" fill="#8b5cf6"/>
  <circle cx="600" cy="200" r="3.5" fill="#8b5cf6"/>
  <text x="350" y="218" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">Global Clock (posedge clk - samples on active edge)</text>

</svg>