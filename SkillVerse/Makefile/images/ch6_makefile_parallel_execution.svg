<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .lane-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .lane-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .job-task { fill: #1e293b; stroke-width: 1.5; rx: 6; }
    </style>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">GNU Make Parallel Execution Architecture (make -j)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Multi-core build concurrency, DAG task distribution, and race condition prevention</text>

  <!-- Left: Serial Execution (make -j1) (x = 40, width = 420, height = 240) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="420" height="240" class="lane-box" style="stroke:#f43f5e; fill:#240c14;"/>
    <text x="20" y="28" class="lane-title" style="fill:#f43f5e;">SERIAL BUILD: make -j1 (Slow)</text>
    <text x="20" y="46" class="desc-txt" style="font-size:11px; fill:#94a3b8;">Single CPU Core: Tasks wait sequentially on a linear timeline</text>

    <!-- Timeline sequential blocks -->
    <g transform="translate(20, 65)">
      <!-- Task 1 -->
      <rect x="0" y="0" width="85" height="40" class="job-task" style="stroke:#38bdf8; fill:#0c1f36;"/>
      <text x="42" y="24" text-anchor="middle" class="code-key" style="fill:#7dd3fc; font-size:11px;">main.o</text>

      <line x1="85" y1="20" x2="95" y2="20" stroke="#64748b" stroke-width="2"/>

      <!-- Task 2 -->
      <rect x="95" y="0" width="85" height="40" class="job-task" style="stroke:#38bdf8; fill:#0c1f36;"/>
      <text x="137" y="24" text-anchor="middle" class="code-key" style="fill:#7dd3fc; font-size:11px;">utils.o</text>

      <line x1="180" y1="20" x2="190" y2="20" stroke="#64748b" stroke-width="2"/>

      <!-- Task 3 -->
      <rect x="190" y="0" width="85" height="40" class="job-task" style="stroke:#38bdf8; fill:#0c1f36;"/>
      <text x="232" y="24" text-anchor="middle" class="code-key" style="fill:#7dd3fc; font-size:11px;">parser.o</text>

      <line x1="275" y1="20" x2="285" y2="20" stroke="#64748b" stroke-width="2"/>

      <!-- Task 4 (Link) -->
      <rect x="285" y="0" width="90" height="40" class="job-task" style="stroke:#f59e0b; fill:#1c150b;"/>
      <text x="330" y="24" text-anchor="middle" class="code-key" style="fill:#fcd34d; font-size:11px;">Link program</text>
    </g>

    <text x="20" y="135" class="desc-txt">• Total Build Time: <tspan class="code-key" style="fill:#fca5a5;">T(main) + T(utils) + T(parser) + T(link)</tspan></text>
    <text x="20" y="155" class="desc-txt">• CPU Utilization: 12.5% on an 8-core machine (7 cores idle!)</text>
    <text x="20" y="175" class="desc-txt">• Zero risk of missing dependency race conditions.</text>
    <text x="20" y="215" class="code-key" style="fill:#94a3b8; font-size:11px;">Total wall clock time: ~45 seconds</text>
  </g>

  <!-- Right: Parallel Execution (make -j4) (x = 500, width = 420, height = 240) -->
  <g transform="translate(500, 75)">
    <rect x="0" y="0" width="420" height="240" class="lane-box" style="stroke:#34d399; fill:#0c241c;"/>
    <text x="20" y="28" class="lane-title" style="fill:#34d399;">PARALLEL BUILD: make -j$(nproc)</text>
    <text x="20" y="46" class="desc-txt" style="font-size:11px; fill:#94a3b8;">Multi-Core DAG Concurrency via GNU Make Jobserver</text>

    <!-- Parallel core lanes -->
    <g transform="translate(20, 60)">
      <!-- Core 1 -->
      <rect x="0" y="0" width="120" height="28" class="job-task" style="stroke:#34d399; fill:#0f172a;"/>
      <text x="60" y="18" text-anchor="middle" class="code-key" style="fill:#6ee7b7; font-size:10px;">Core 1: main.o</text>

      <!-- Core 2 -->
      <rect x="0" y="34" width="120" height="28" class="job-task" style="stroke:#34d399; fill:#0f172a;"/>
      <text x="60" y="52" text-anchor="middle" class="code-key" style="fill:#6ee7b7; font-size:10px;">Core 2: utils.o</text>

      <!-- Core 3 -->
      <rect x="0" y="68" width="120" height="28" class="job-task" style="stroke:#34d399; fill:#0f172a;"/>
      <text x="60" y="86" text-anchor="middle" class="code-key" style="fill:#6ee7b7; font-size:10px;">Core 3: parser.o</text>

      <!-- Barrier sync line -->
      <line x1="145" y1="0" x2="145" y2="96" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      <text x="145" y="112" text-anchor="middle" class="desc-txt" style="font-size:9px; fill:#38bdf8;">Sync Barrier</text>

      <!-- Link Stage -->
      <rect x="180" y="34" width="180" height="32" class="job-task" style="stroke:#f59e0b; fill:#1c150b;"/>
      <text x="270" y="54" text-anchor="middle" class="code-key" style="fill:#fcd34d; font-size:11px;">Link program</text>
    </g>

    <text x="20" y="195" class="desc-txt">• Total Build Time: <tspan class="code-key" style="fill:#34d399;">max(T(objs)) + T(link)</tspan></text>
    <text x="20" y="215" class="code-key" style="fill:#34d399; font-size:11px;">Total wall clock time: ~8 seconds (4-8x faster!)</text>
  </g>

  <!-- Bottom: The Parallel Race Condition Trap (y = 330 to 455) -->
  <g transform="translate(40, 330)">
    <rect x="0" y="0" width="880" height="135" class="card" style="stroke:#f59e0b;"/>
    <text x="25" y="26" class="title" style="font-size:14px; fill:#f59e0b;">The Parallel Race Condition &amp; The Order-Only Cure</text>

    <g transform="translate(25, 42)">
      <text x="0" y="18" class="desc-txt">In parallel builds, Make executes all independent DAG leaves concurrently. If a rule relies on a folder (e.g. `build/`) without declaring it as an</text>
      <text x="0" y="38" class="desc-txt"><tspan class="code-key" style="fill:#fcd34d;">order-only prerequisite</tspan>, GCC may attempt to compile `build/main.o` before `mkdir -p build` completes on another core!</text>
      <text x="0" y="58" class="desc-txt">Result: Random, non-deterministic build failures that vanish when running serially.</text>
      <text x="0" y="78" class="code-key" style="fill:#34d399;">The Fix: $(OBJS): build/%.o: src/%.c | build   (Guarantees build directory exists before any compilation begins!)</text>
    </g>
  </g>
</svg>
