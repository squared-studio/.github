<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 14px; fill: #e2e8f0; }
      .tag-inner { fill: #38bdf8; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; }
      .tag-around { fill: #f43f5e; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; }
      .bracket-hi { fill: #f59e0b; font-weight: 700; font-family: 'JetBrains Mono', Consolas, monospace; }
      .box-inner { fill: rgba(56, 189, 248, 0.15); stroke: #38bdf8; stroke-width: 2; rx: 4; }
      .box-around { fill: rgba(244, 63, 94, 0.12); stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4,4; rx: 6; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .header-col { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">Vim Text Objects Anatomy: Inner vs. Around</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">The critical distinction between target contents (i) and target contents plus delimiters/whitespace (a)</text>

  <!-- Legend (Placed at x = 580, y = 20) -->
  <g transform="translate(600, 20)">
    <rect x="0" y="0" width="16" height="16" class="box-inner"/>
    <text x="24" y="13" class="desc-txt"><tspan class="tag-inner">i</tspan> = Inner (Content only)</text>
    <rect x="170" y="0" width="16" height="16" class="box-around"/>
    <text x="194" y="13" class="desc-txt"><tspan class="tag-around">a</tspan> = Around (Bounds included)</text>
  </g>

  <!-- Example 1: Double Quotes (y = 75 to 160) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="880" height="85" class="card"/>
    <text x="20" y="24" class="header-col">1. String Literals (`i"` vs `a"`)</text>
    <g transform="translate(20, 36)">
      <text x="0" y="22" class="code-txt">const msg = </text>
      <!-- around box encompasses quotes -->
      <rect x="100" y="4" width="225" height="26" class="box-around"/>
      <!-- inner box encompasses inside text -->
      <rect x="111" y="7" width="202" height="20" class="box-inner"/>
      <text x="102" y="22" class="code-txt"><tspan class="bracket-hi">"</tspan>Connection timeout!<tspan class="bracket-hi">"</tspan>;</text>
      <text x="350" y="15" class="desc-txt"><tspan class="tag-inner">ci"</tspan> → Clears inner text, preserves quotes: <tspan class="code-txt" style="font-size:12px; fill:#38bdf8;">const msg = "";</tspan></text>
      <text x="350" y="33" class="desc-txt"><tspan class="tag-around">da"</tspan> → Deletes string AND the quotation marks: <tspan class="code-txt" style="font-size:12px; fill:#f43f5e;">const msg = ;</tspan></text>
    </g>
  </g>

  <!-- Example 2: Parentheses / Arguments (y = 175 to 260) -->
  <g transform="translate(40, 175)">
    <rect x="0" y="0" width="880" height="85" class="card"/>
    <text x="20" y="24" class="header-col">2. Parentheses &amp; Function Calls (`i(` vs `a(` or `ib` vs `ab`)</text>
    <g transform="translate(20, 36)">
      <text x="0" y="22" class="code-txt">send_packet</text>
      <!-- around box -->
      <rect x="94" y="4" width="220" height="26" class="box-around"/>
      <!-- inner box -->
      <rect x="104" y="7" width="198" height="20" class="box-inner"/>
      <text x="96" y="22" class="code-txt"><tspan class="bracket-hi">(</tspan>dev_id, payload, 64<tspan class="bracket-hi">)</tspan>;</text>
      <text x="350" y="15" class="desc-txt"><tspan class="tag-inner">ci(</tspan> → Replaces arguments inside parens: <tspan class="code-txt" style="font-size:12px; fill:#38bdf8;">send_packet();</tspan></text>
      <text x="350" y="33" class="desc-txt"><tspan class="tag-around">da(</tspan> → Deletes parentheses and all arguments: <tspan class="code-txt" style="font-size:12px; fill:#f43f5e;">send_packet;</tspan></text>
    </g>
  </g>

  <!-- Example 3: Word and Whitespace (y = 275 to 360) -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="880" height="85" class="card"/>
    <text x="20" y="24" class="header-col">3. Word Boundaries &amp; Whitespace Collapse (`iw` vs `aw`)</text>
    <g transform="translate(20, 36)">
      <text x="0" y="22" class="code-txt">int total = </text>
      <!-- around box includes trailing space -->
      <rect x="100" y="4" width="105" height="26" class="box-around"/>
      <!-- inner box only word -->
      <rect x="103" y="7" width="82" height="20" class="box-inner"/>
      <text x="104" y="22" class="code-txt">offset + 10;</text>
      <text x="350" y="15" class="desc-txt"><tspan class="tag-inner">diw</tspan> → Deletes word only, leaves double spacing: <tspan class="code-txt" style="font-size:12px; fill:#38bdf8;">int total =   + 10;</tspan></text>
      <text x="350" y="33" class="desc-txt"><tspan class="tag-around">daw</tspan> → Deletes word AND trailing whitespace: <tspan class="code-txt" style="font-size:12px; fill:#f43f5e;">int total = + 10;</tspan></text>
    </g>
  </g>

  <!-- Example 4: XML/HTML Tags (y = 375 to 460) -->
  <g transform="translate(40, 375)">
    <rect x="0" y="0" width="880" height="85" class="card"/>
    <text x="20" y="24" class="header-col">4. XML / HTML Markup Tags (`it` vs `at`)</text>
    <g transform="translate(20, 36)">
      <!-- around box encompasses whole tag pair -->
      <rect x="0" y="4" width="315" height="26" class="box-around"/>
      <!-- inner box encompasses text between tags -->
      <rect x="85" y="7" width="145" height="20" class="box-inner"/>
      <text x="5" y="22" class="code-txt">&lt;div class="badge"&gt;<tspan style="fill:#38bdf8;">Status: Active</tspan>&lt;/div&gt;</text>
      <text x="350" y="15" class="desc-txt"><tspan class="tag-inner">cit</tspan> → Clears inner content, preserves tags: <tspan class="code-txt" style="font-size:12px; fill:#38bdf8;">&lt;div class="badge"&gt;&lt;/div&gt;</tspan></text>
      <text x="350" y="33" class="desc-txt"><tspan class="tag-around">dat</tspan> → Deletes opening tag, inner content, and closing tag completely.</text>
    </g>
  </g>
</svg>
