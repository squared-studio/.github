<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .step-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .step-num { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; }
      .step-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; fill: #f8fafc; }
      .step-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 13px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .wire-macro { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arr-mac" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="490" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">Vim Automation Pipeline: Macro Recording &amp; Batch Execution</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Capturing keystrokes into registers and executing mass transformations with zero latency</text>

  <!-- Step 1: Record (x = 40, width = 190) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="190" height="155" class="step-box" style="stroke: #f59e0b; fill: #1c180e;"/>
    <text x="15" y="24" class="step-num" style="fill:#f59e0b;">PHASE 1</text>
    <text x="15" y="44" class="step-title">Start Recording</text>
    <text x="15" y="62" class="step-sub">Select target register</text>
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="160" height="32" class="card" style="fill:#2e1f06; stroke:#f59e0b;"/>
      <text x="80" y="21" text-anchor="middle" class="code-key" style="fill:#fbbf24;">qa</text>
    </g>
    <text x="15" y="128" class="desc-txt" style="font-size:11px;">Status line displays:</text>
    <text x="15" y="144" class="code-key" style="font-size:11px; fill:#fbbf24;">recording @a</text>
  </g>

  <!-- Wire 1 -> 2 -->
  <path d="M 230 152 L 265 152" class="wire-macro" marker-end="url(#arr-mac)"/>

  <!-- Step 2: Perform Keystrokes (x = 275, width = 200) -->
  <g transform="translate(275, 75)">
    <rect x="0" y="0" width="200" height="155" class="step-box" style="stroke: #38bdf8; fill: #0d1e33;"/>
    <text x="15" y="24" class="step-num" style="fill:#38bdf8;">PHASE 2</text>
    <text x="15" y="44" class="step-title">Execute Actions</text>
    <text x="15" y="62" class="step-sub">Perform edits on Line 1</text>
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="170" height="32" class="card" style="fill:#0c2847; stroke:#38bdf8;"/>
      <text x="85" y="21" text-anchor="middle" class="code-key" style="fill:#7dd3fc;">^, I, A, dw, j0 ...</text>
    </g>
    <text x="15" y="128" class="desc-txt" style="font-size:11px; fill:#93c5fd;">*Crucial: End with <tspan class="code-key" style="fill:#34d399;">j0</tspan></text>
    <text x="15" y="144" class="desc-txt" style="font-size:11px; fill:#93c5fd;">to prime next iteration</text>
  </g>

  <!-- Wire 2 -> 3 -->
  <path d="M 475 152 L 510 152" class="wire-macro" marker-end="url(#arr-mac)"/>

  <!-- Step 3: Stop Recording (x = 520, width = 170) -->
  <g transform="translate(520, 75)">
    <rect x="0" y="0" width="170" height="155" class="step-box" style="stroke: #f43f5e; fill: #240c14;"/>
    <text x="15" y="24" class="step-num" style="fill:#f43f5e;">PHASE 3</text>
    <text x="15" y="44" class="step-title">Stop Recording</text>
    <text x="15" y="62" class="step-sub">Close register stream</text>
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="140" height="32" class="card" style="fill:#3b111d; stroke:#f43f5e;"/>
      <text x="70" y="21" text-anchor="middle" class="code-key" style="fill:#fb7185;">q</text>
    </g>
    <text x="15" y="128" class="desc-txt" style="font-size:11px;">Macro stored inside</text>
    <text x="15" y="144" class="code-key" style="font-size:11px; fill:#fda4af;">Register "a</text>
  </g>

  <!-- Wire 3 -> 4 -->
  <path d="M 690 152 L 725 152" class="wire-macro" marker-end="url(#arr-mac)"/>

  <!-- Step 4: Storage (x = 735, width = 185) -->
  <g transform="translate(735, 75)">
    <rect x="0" y="0" width="185" height="155" class="step-box" style="stroke: #34d399; fill: #0b1f1a;"/>
    <text x="15" y="24" class="step-num" style="fill:#34d399;">PHASE 4</text>
    <text x="15" y="44" class="step-title">In-Memory Register</text>
    <text x="15" y="62" class="step-sub">Raw macro string</text>
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="155" height="32" class="card" style="fill:#093026; stroke:#34d399;"/>
      <text x="77" y="21" text-anchor="middle" class="code-key" style="fill:#6ee7b7; font-size:11px;">"a = ^Iconst ^[A;^[j0</text>
    </g>
    <text x="15" y="128" class="desc-txt" style="font-size:11px;">Viewable with <tspan class="code-key">:reg a</tspan></text>
    <text x="15" y="144" class="desc-txt" style="font-size:11px;">Editable like regular text!</text>
  </g>

  <!-- Bottom: Batch Execution Dispatcher (y = 255 to 465) -->
  <g transform="translate(40, 255)">
    <rect x="0" y="0" width="880" height="205" class="card" style="stroke:#a855f7;"/>
    <text x="25" y="28" class="step-title" style="fill:#c084fc; font-size:16px;">Replay Strategies: Single, Sequential Loop &amp; Parallel Execution</text>

    <!-- Strategy 1 -->
    <g transform="translate(25, 45)">
      <rect x="0" y="0" width="250" height="135" class="step-box" style="fill:#1a102e; stroke:#a855f7;"/>
      <text x="15" y="24" class="code-key" style="fill:#d8b4fe;">@a  /  @@</text>
      <text x="15" y="46" class="step-title" style="font-size:13px;">Single / Last Replay</text>
      <text x="15" y="70" class="desc-txt" style="font-size:11px;"><tspan class="code-key">@a</tspan> executes macro once.</text>
      <text x="15" y="92" class="desc-txt" style="font-size:11px;"><tspan class="code-key">@@</tspan> repeats last executed macro</text>
      <text x="15" y="112" class="desc-txt" style="font-size:11px; fill:#94a3b8;">with minimal keystroke friction.</text>
    </g>

    <!-- Strategy 2 -->
    <g transform="translate(295, 45)">
      <rect x="0" y="0" width="260" height="135" class="step-box" style="fill:#1a102e; stroke:#a855f7;"/>
      <text x="15" y="24" class="code-key" style="fill:#d8b4fe;">100@a</text>
      <text x="15" y="46" class="step-title" style="font-size:13px;">Sequential Counted Loop</text>
      <text x="15" y="70" class="desc-txt" style="font-size:11px;">Runs macro 100 times in sequence.</text>
      <text x="15" y="94" class="desc-txt" style="font-size:11px; fill:#fca5a5;">Stops automatically if an operation</text>
      <text x="15" y="114" class="desc-txt" style="font-size:11px; fill:#fca5a5;">fails on any single line (e.g. EOF).</text>
    </g>

    <!-- Strategy 3 -->
    <g transform="translate(575, 45)">
      <rect x="0" y="0" width="280" height="135" class="step-box" style="fill:#1a102e; stroke:#a855f7;"/>
      <text x="15" y="24" class="code-key" style="fill:#d8b4fe;">:'&lt;,'&gt;normal @a</text>
      <text x="15" y="46" class="step-title" style="font-size:13px;">Parallel Visual Selection</text>
      <text x="15" y="70" class="desc-txt" style="font-size:11px;">Highlight lines in Visual mode (<tspan class="code-key">V</tspan>).</text>
      <text x="15" y="94" class="desc-txt" style="font-size:11px; fill:#34d399;">Runs independently on every line:</text>
      <text x="15" y="114" class="desc-txt" style="font-size:11px; fill:#34d399;">Failure on one line does not halt rest!</text>
    </g>
  </g>
</svg>
