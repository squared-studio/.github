<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="750" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="38" font-size="14" font-weight="700" fill="#0f172a">APB Write Transfer (No Wait States - Basic 2-Cycle)</text>

  <!-- Cycle Headers -->
  <text x="140" y="62" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">T0 (IDLE)</text>
  <text x="290" y="62" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">T1 (SETUP)</text>
  <text x="440" y="62" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">T2 (ACCESS)</text>
  <text x="590" y="62" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">T3 (IDLE)</text>

  <!-- Vertical Grid Lines -->
  <line x1="215" y1="50" x2="215" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="365" y1="50" x2="365" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="515" y1="50" x2="515" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="665" y1="50" x2="665" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- PCLK -->
  <text x="35" y="88" font-size="11" font-weight="700" fill="#1e293b">PCLK</text>
  <polyline points="90,95 140,95 140,75 215,75 215,95 290,95 290,75 365,75 365,95 440,95 440,75 515,75 515,95 590,95 590,75 665,75 665,95 720,95" fill="none" stroke="#475569" stroke-width="1.8"/>

  <!-- PADDR -->
  <text x="35" y="123" font-size="11" font-weight="700" fill="#1e293b">PADDR</text>
  <line x1="90" y1="120" x2="215" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="215,120 225,110 505,110 515,120 505,130 225,130" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="365" y="124" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Address (0x4000_0010)</text>
  <line x1="515" y1="120" x2="720" y2="120" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- PWRITE -->
  <text x="35" y="153" font-size="11" font-weight="700" fill="#1e293b">PWRITE</text>
  <polyline points="90,155 215,155 215,140 515,140 515,155 720,155" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="365" y="148" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">HIGH (Write)</text>

  <!-- PSELx -->
  <text x="35" y="183" font-size="11" font-weight="700" fill="#1e293b">PSELx</text>
  <polyline points="90,185 215,185 215,170 515,170 515,185 720,185" fill="none" stroke="#f59e0b" stroke-width="2"/>

  <!-- PENABLE -->
  <text x="35" y="213" font-size="11" font-weight="700" fill="#1e293b">PENABLE</text>
  <polyline points="90,215 365,215 365,200 515,200 515,215 720,215" fill="none" stroke="#10b981" stroke-width="2"/>

  <!-- PWDATA -->
  <text x="35" y="243" font-size="11" font-weight="700" fill="#1e293b">PWDATA</text>
  <line x1="90" y1="240" x2="215" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="215,240 225,230 505,230 515,240 505,250 225,250" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="365" y="244" font-size="10" font-weight="700" fill="#065f46" text-anchor="middle">Write Data (0xDEADBEEF)</text>
  <line x1="515" y1="240" x2="720" y2="240" stroke="#94a3b8" stroke-width="1.5"/>

</svg>