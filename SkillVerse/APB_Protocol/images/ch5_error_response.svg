<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">APB3 Error Response (PSLVERR Assertion Rules)</text>

  <rect x="35" y="65" width="300" height="95" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="50" y="90" font-size="12" font-weight="700" fill="#991b1b">PSLVERR Sampling Rule</text>
  <text x="50" y="110" font-size="10.5" fill="#b91c1c">- Valid ONLY when: PSEL=1 &amp;&amp; PENABLE=1 &amp;&amp; PREADY=1</text>
  <text x="50" y="128" font-size="10.5" fill="#b91c1c">- Ignored during wait states (when PREADY=0)</text>
  <text x="50" y="145" font-size="10" font-weight="700" fill="#dc2626">Signifies invalid address, privilege violation, or bus fault</text>

  <rect x="355" y="65" width="315" height="95" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="370" y="90" font-size="12" font-weight="700" fill="#1e3a8a">Bridge Action on Error</text>
  <text x="370" y="110" font-size="10.5" fill="#1e40af">- AXI-to-APB bridge maps PSLVERR to SLVERR or DECERR</text>
  <text x="370" y="128" font-size="10.5" fill="#1e40af">- Read data on PRDATA is discarded</text>
  <text x="370" y="145" font-size="10" font-weight="700" fill="#2563eb">Interrupt or CPU bus fault exception triggered</text>

</svg>