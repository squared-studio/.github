<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 310" width="740" height="310" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="710" height="280" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="42" font-size="14" font-weight="700" fill="#0f172a">APB4 Master-to-Slave Interface Signals</text>

  <!-- Master Box -->
  <rect x="40" y="65" width="160" height="210" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="120" y="95" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">APB Master</text>
  <text x="120" y="115" font-size="10.5" fill="#2563eb" text-anchor="middle">(Bridge)</text>

  <!-- Slave Box -->
  <rect x="540" y="65" width="160" height="210" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="95" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">APB Slave</text>
  <text x="620" y="115" font-size="10.5" fill="#059669" text-anchor="middle">(Peripheral)</text>

  <!-- Signals list -->
  <!-- Clock & Reset -->
  <line x1="200" y1="80" x2="534" y2="80" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="370" y="75" font-size="10" font-weight="700" fill="#6d28d9" text-anchor="middle">PCLK (Clock) &amp; PRESETn (Active-low Reset)</text>

  <!-- Address -->
  <line x1="200" y1="110" x2="534" y2="110" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="370" y="105" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">PADDR[31:0] (Byte Address)</text>

  <!-- Control -->
  <line x1="200" y1="140" x2="534" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="370" y="135" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">PSELx (Select), PENABLE (Phase Enable), PWRITE (1=W, 0=R)</text>

  <!-- Write Data & Strobes -->
  <line x1="200" y1="170" x2="534" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="370" y="165" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">PWDATA[31:0] (Write Data) &amp; PSTRB[3:0] (Byte Strobes)</text>

  <!-- Protection -->
  <line x1="200" y1="200" x2="534" y2="200" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="370" y="195" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">PPROT[2:0] (Privilege, Security, Data/Instr)</text>

  <!-- Slave Response Signals (From Slave to Master) -->
  <line x1="540" y1="230" x2="206" y2="230" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="370" y="225" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">PRDATA[31:0] (Read Data)</text>

  <line x1="540" y1="260" x2="206" y2="260" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="370" y="255" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">PREADY (Wait states) &amp; PSLVERR (Error flag)</text>

</svg>