<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="750" height="260" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="38" font-size="14" font-weight="700" fill="#0f172a">APB3 Write Transfer with Wait States (PREADY Low)</text>

  <!-- Cycle Headers -->
  <text x="120" y="62" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">T1 (SETUP)</text>
  <text x="240" y="62" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">T2 (WAIT 1)</text>
  <text x="360" y="62" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">T3 (WAIT 2)</text>
  <text x="480" y="62" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">T4 (READY)</text>
  <text x="600" y="62" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">T5 (NEXT)</text>

  <!-- Grid -->
  <line x1="180" y1="50" x2="180" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="50" x2="300" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="420" y1="50" x2="420" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="50" x2="540" y2="255" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- PCLK -->
  <polyline points="60,90 120,90 120,70 180,70 180,90 240,90 240,70 300,70 300,90 360,90 360,70 420,70 420,90 480,90 480,70 540,70 540,90 600,90" fill="none" stroke="#475569" stroke-width="1.8"/>

  <!-- PADDR (held stable) -->
  <polygon points="60,120 70,110 530,110 540,120 530,130 70,130" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="300" y="124" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">PADDR held stable across all wait states</text>

  <!-- PSEL -->
  <polyline points="60,155 540,155 540,170 660,170" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="30" y="160" font-size="10" font-weight="700" fill="#1e293b">PSEL</text>

  <!-- PENABLE -->
  <polyline points="60,200 180,200 180,185 540,185 540,200 660,200" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="30" y="195" font-size="10" font-weight="700" fill="#1e293b">PENABLE</text>

  <!-- PREADY -->
  <text x="30" y="235" font-size="10" font-weight="700" fill="#dc2626">PREADY</text>
  <polyline points="60,240 420,240 420,225 540,225 540,240 660,240" fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <text x="300" y="250" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">Slave holds PREADY LOW (Wait States)</text>
  <text x="480" y="220" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">READY!</text>

</svg>