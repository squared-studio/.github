<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="720" height="180" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="150" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">APB Two-Phase Handshake Mechanism</text>

  <rect x="35" y="65" width="200" height="75" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="90" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Phase 1: Setup Phase</text>
  <text x="135" y="110" font-size="10" fill="#78350f" text-anchor="middle">- PSEL asserted (1)</text>
  <text x="135" y="125" font-size="10" fill="#78350f" text-anchor="middle">- PENABLE de-asserted (0)</text>

  <line x1="235" y1="102" x2="279" y2="102" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr-amber)"/>

  <rect x="285" y="65" width="200" height="75" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="385" y="90" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">Phase 2: Access Phase</text>
  <text x="385" y="110" font-size="10" fill="#047857" text-anchor="middle">- PENABLE asserted (1)</text>
  <text x="385" y="125" font-size="10" fill="#047857" text-anchor="middle">- Slave sampled / drives</text>

  <line x1="485" y1="102" x2="529" y2="102" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="535" y="65" width="170" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="620" y="90" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Transfer Completed</text>
  <text x="620" y="110" font-size="10" fill="#1e40af" text-anchor="middle">When PREADY == 1</text>
  <text x="620" y="125" font-size="10" fill="#1e40af" text-anchor="middle">Data latched / sampled</text>

</svg>