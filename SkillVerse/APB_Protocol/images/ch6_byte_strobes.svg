<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="690" height="190" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">APB4 Byte Write Strobes (PSTRB[3:0] Mapping)</text>

  <!-- PWDATA Byte Lanes -->
  <rect x="40" y="70" width="150" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="115" y="92" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">PWDATA[31:24]</text>
  <text x="115" y="107" font-size="9" fill="#2563eb" text-anchor="middle">Byte 3</text>

  <rect x="200" y="70" width="150" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="275" y="92" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">PWDATA[23:16]</text>
  <text x="275" y="107" font-size="9" fill="#2563eb" text-anchor="middle">Byte 2</text>

  <rect x="360" y="70" width="150" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="435" y="92" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">PWDATA[15:8]</text>
  <text x="435" y="107" font-size="9" fill="#2563eb" text-anchor="middle">Byte 1</text>

  <rect x="520" y="70" width="150" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="595" y="92" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">PWDATA[7:0]</text>
  <text x="595" y="107" font-size="9" fill="#2563eb" text-anchor="middle">Byte 0</text>

  <!-- Strobe control -->
  <rect x="40" y="130" width="150" height="35" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="152" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">PSTRB[3]</text>

  <rect x="200" y="130" width="150" height="35" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="275" y="152" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">PSTRB[2]</text>

  <rect x="360" y="130" width="150" height="35" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="435" y="152" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">PSTRB[1]</text>

  <rect x="520" y="130" width="150" height="35" rx="4" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="595" y="152" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">PSTRB[0]</text>

  <text x="355" y="185" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">Enables writing single bytes without expensive Read-Modify-Write cycles!</text>

</svg>