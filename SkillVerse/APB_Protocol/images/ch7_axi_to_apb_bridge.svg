<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 240" width="750" height="240" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="720" height="210" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="40" font-size="14" font-weight="700" fill="#0f172a">AXI4-to-APB4 Bridge Architecture</text>

  <!-- AXI Slave Port -->
  <rect x="35" y="65" width="160" height="145" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="90" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">AXI4 Slave Interface</text>
  <text x="115" y="110" font-size="10" fill="#2563eb" text-anchor="middle">AW, W, B, AR, R channels</text>
  <text x="115" y="130" font-size="9.5" fill="#64748b" text-anchor="middle">Fast Clock (e.g. 400 MHz)</text>
  <text x="115" y="150" font-size="9.5" fill="#64748b" text-anchor="middle">Buffers burst requests</text>

  <!-- CDC / Synchronizer -->
  <rect x="235" y="65" width="120" height="145" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="295" y="95" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Clock Domain</text>
  <text x="295" y="112" font-size="11" font-weight="700" fill="#5b21b6" text-anchor="middle">Crossing (CDC)</text>
  <text x="295" y="135" font-size="9" fill="#7c3aed" text-anchor="middle">Async FIFO /</text>
  <text x="295" y="150" font-size="9" fill="#7c3aed" text-anchor="middle">Handshake Sync</text>

  <line x1="195" y1="135" x2="229" y2="135" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- APB State Machine & Master -->
  <rect x="395" y="65" width="160" height="145" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="90" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">APB Controller</text>
  <text x="475" y="110" font-size="10" fill="#78350f" text-anchor="middle">FSM (Idle/Setup/Access)</text>
  <text x="475" y="130" font-size="9.5" fill="#78350f" text-anchor="middle">Slow Clock (e.g. 50 MHz)</text>
  <text x="475" y="150" font-size="9.5" fill="#78350f" text-anchor="middle">Address Decoder</text>

  <line x1="355" y1="135" x2="389" y2="135" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr-purple)"/>

  <!-- APB Bus Output -->
  <rect x="595" y="65" width="125" height="145" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="657" y="95" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">APB Slaves</text>
  <text x="657" y="115" font-size="9.5" fill="#047857" text-anchor="middle">PADDR, PSEL</text>
  <text x="657" y="135" font-size="9.5" fill="#047857" text-anchor="middle">PENABLE</text>
  <text x="657" y="155" font-size="9.5" fill="#047857" text-anchor="middle">PWDATA / PRDATA</text>

  <line x1="555" y1="135" x2="589" y2="135" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>

</svg>