<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="15" y="15" width="750" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="35" y="42" font-size="14" font-weight="700" fill="#0f172a">AMBA SoC Interconnect Architecture: The Role of APB</text>

  <!-- High performance master -->
  <rect x="35" y="65" width="140" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="93" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">CPU Core / DMA</text>
  <text x="105" y="112" font-size="10" fill="#2563eb" text-anchor="middle">High Performance</text>

  <!-- High speed interconnect -->
  <rect x="220" y="65" width="180" height="155" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="310" y="92" font-size="13" font-weight="800" fill="#5b21b6" text-anchor="middle">AXI4 / AHB Backbone</text>
  <text x="310" y="112" font-size="10" fill="#7c3aed" text-anchor="middle">High Bandwidth Crossbar</text>
  <text x="310" y="132" font-size="10" fill="#7c3aed" text-anchor="middle">Pipelined, Multi-channel</text>
  <text x="310" y="152" font-size="10" fill="#6d28d9" text-anchor="middle">Burst Transfers</text>

  <line x1="175" y1="97" x2="214" y2="97" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="197" y="88" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">AXI</text>

  <!-- Memory -->
  <rect x="35" y="155" width="140" height="65" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="183" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">DDR Controller</text>
  <text x="105" y="202" font-size="10" fill="#059669" text-anchor="middle">High Speed Memory</text>

  <line x1="220" y1="187" x2="181" y2="187" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="200" y="178" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">AXI</text>

  <!-- AXI-to-APB Bridge -->
  <rect x="445" y="65" width="130" height="155" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="510" y="95" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">AXI-to-APB</text>
  <text x="510" y="115" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">Bridge</text>
  <text x="510" y="145" font-size="9.5" fill="#78350f" text-anchor="middle">- Protocol Converter</text>
  <text x="510" y="165" font-size="9.5" fill="#78350f" text-anchor="middle">- Clock Domain Bridge</text>
  <text x="510" y="185" font-size="9.5" fill="#78350f" text-anchor="middle">- Address Decoding</text>

  <line x1="400" y1="142" x2="439" y2="142" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <text x="420" y="132" font-size="9" font-weight="600" fill="#7c3aed" text-anchor="middle">AXI</text>

  <!-- APB Peripherals -->
  <rect x="620" y="60" width="130" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="685" y="82" font-size="10.5" font-weight="600" fill="#1e293b" text-anchor="middle">UART Controller</text>

  <rect x="620" y="102" width="130" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="685" y="124" font-size="10.5" font-weight="600" fill="#1e293b" text-anchor="middle">SPI Master</text>

  <rect x="620" y="144" width="130" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="685" y="166" font-size="10.5" font-weight="600" fill="#1e293b" text-anchor="middle">Timer / Watchdog</text>

  <rect x="620" y="186" width="130" height="34" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="685" y="208" font-size="10.5" font-weight="600" fill="#1e293b" text-anchor="middle">GPIO / I2C</text>

  <line x1="575" y1="77" x2="614" y2="77" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <line x1="575" y1="119" x2="614" y2="119" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <line x1="575" y1="161" x2="614" y2="161" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <line x1="575" y1="203" x2="614" y2="203" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <text x="595" y="138" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">APB</text>

</svg>