<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .res-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 3; }
      .led-sym { fill: #ef4444; stroke: #ef4444; stroke-width: 1.5; }
    </style>
    <marker id="arr-glow" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">LED Driver Topologies: Ballast Resistor, Parallel Arrays &amp; Transistor PWM</text>

  <!-- Panel 1: Single LED Ballast Resistor -->
  <g transform="translate(25, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">1. Ballast Resistor Calculation</text>

    <!-- Schematic -->
    <g transform="translate(90, 48)">
      <!-- Vcc -->
      <circle cx="40" cy="15" r="4" fill="#f43f5e"/>
      <text x="40" y="5" text-anchor="middle" class="code-txt" fill="#f43f5e">V_CC (+5V)</text>
      <line x1="40" y1="19" x2="40" y2="45" class="wire"/>

      <!-- Resistor -->
      <rect x="22" y="45" width="36" height="42" class="res-box"/>
      <text x="40" y="70" text-anchor="middle" class="sublabel" fill="#fff">R_lim</text>
      <line x1="40" y1="87" x2="40" y2="115" class="wire"/>

      <!-- LED -->
      <polygon points="25,115 55,115 40,140" class="led-sym"/>
      <line x1="25" y1="140" x2="55" y2="140" stroke="#ef4444" stroke-width="2.5"/>
      <line x1="52" y1="120" x2="68" y2="110" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-glow)"/>
      <line x1="56" y1="130" x2="72" y2="120" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-glow)"/>
      <text x="75" y="140" class="sublabel" fill="#ef4444">V_F ≈ 2.0V</text>

      <line x1="40" y1="140" x2="40" y2="185" class="wire"/>
      <line x1="25" y1="185" x2="55" y2="185" class="wire"/>
    </g>

    <!-- Calculation Box -->
    <rect x="15" y="240" width="255" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">R = (V_CC - V_F) / I_F</text>
    <text x="25" y="284" class="code-txt" style="font-size:11px; fill:#fbbf24;">R = (5V - 2.0V) / 0.02A = 150 Ω</text>
    <text x="25" y="306" class="sublabel">Resistor Power: P = I²·R</text>
    <text x="25" y="322" class="sublabel">P = (0.02)² · 150 = 60 mW (&lt; 1/4W OK)</text>
  </g>

  <!-- Panel 2: Parallel Strings Rule -->
  <g transform="translate(330, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">2. Parallel Branch Balancing</text>

    <!-- Bad vs Good Schematic -->
    <g transform="translate(25, 48)">
      <text x="10" y="16" class="sublabel" fill="#f43f5e" font-weight="bold">WRONG: Shared Single Resistor</text>
      <text x="10" y="30" class="sublabel" style="font-size:10px;">Thermal runaway! LED with lowest V_F</text>
      <text x="10" y="42" class="sublabel" style="font-size:10px;">hogs all current and burns out.</text>

      <line x1="0" y1="55" x2="240" y2="55" stroke="#1e293b"/>

      <text x="10" y="75" class="sublabel" fill="#34d399" font-weight="bold">CORRECT: Dedicated Resistor Per Branch</text>
      <!-- Branch 1 -->
      <line x1="50" y1="90" x2="50" y2="105" class="wire"/>
      <rect x="42" y="105" width="16" height="22" class="res-box"/>
      <line x1="50" y1="127" x2="50" y2="140" class="wire"/>
      <polygon points="40,140 60,140 50,155" class="led-sym"/>
      <line x1="40" y1="155" x2="60" y2="155" stroke="#ef4444" stroke-width="2"/>
      <line x1="50" y1="155" x2="50" y2="175" class="wire"/>

      <!-- Branch 2 -->
      <line x1="120" y1="90" x2="120" y2="105" class="wire"/>
      <rect x="112" y="105" width="16" height="22" class="res-box"/>
      <line x1="120" y1="127" x2="120" y2="140" class="wire"/>
      <polygon points="110,140 130,140 120,155" class="led-sym"/>
      <line x1="110" y1="155" x2="130" y2="155" stroke="#ef4444" stroke-width="2"/>
      <line x1="120" y1="155" x2="120" y2="175" class="wire"/>

      <!-- Branch 3 -->
      <line x1="190" y1="90" x2="190" y2="105" class="wire"/>
      <rect x="182" y="105" width="16" height="22" class="res-box"/>
      <line x1="190" y1="127" x2="190" y2="140" class="wire"/>
      <polygon points="180,140 200,140 190,155" class="led-sym"/>
      <line x1="180" y1="155" x2="200" y2="155" stroke="#ef4444" stroke-width="2"/>
      <line x1="190" y1="155" x2="190" y2="175" class="wire"/>

      <!-- Bus bars -->
      <line x1="50" y1="90" x2="190" y2="90" class="wire-hi"/>
      <line x1="50" y1="175" x2="190" y2="175" class="wire"/>
    </g>

    <rect x="15" y="240" width="255" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">Independent I_F Regulation</text>
    <text x="25" y="284" class="sublabel">Guarantees identical brightness across</text>
    <text x="25" y="300" class="sublabel">all LEDs despite semiconductor batch</text>
    <text x="25" y="316" class="sublabel">V_F process variations.</text>
  </g>

  <!-- Panel 3: Transistor / PWM Microcontroller Driver -->
  <g transform="translate(635, 55)">
    <rect width="300" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">3. Transistor / MOSFET PWM Driver</text>

    <!-- Schematic: Low side switch -->
    <g transform="translate(40, 48)">
      <!-- Vcc -->
      <circle cx="90" cy="10" r="3.5" fill="#f43f5e"/>
      <text x="90" y="3" text-anchor="middle" class="sublabel" fill="#f43f5e">+12V High-Power String</text>
      <line x1="90" y1="14" x2="90" y2="35" class="wire"/>

      <!-- LED string -->
      <polygon points="80,35 100,35 90,50" class="led-sym"/>
      <line x1="80" y1="50" x2="100" y2="50" stroke="#ef4444" stroke-width="2"/>
      <line x1="90" y1="50" x2="90" y2="65" class="wire"/>
      <polygon points="80,65 100,65 90,80" class="led-sym"/>
      <line x1="80" y1="80" x2="100" y2="80" stroke="#ef4444" stroke-width="2"/>
      <line x1="90" y1="80" x2="90" y2="100" class="wire"/>

      <!-- Ballast Resistor -->
      <rect x="82" y="100" width="16" height="25" class="res-box"/>
      <line x1="90" y1="125" x2="90" y2="140" class="wire"/>

      <!-- N-channel MOSFET Low-Side Switch -->
      <line x1="90" y1="140" x2="90" y2="152" class="wire"/>
      <!-- Drain / Source bar -->
      <line x1="85" y1="152" x2="95" y2="152" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="85" y1="168" x2="95" y2="168" stroke="#38bdf8" stroke-width="2.5"/>
      <!-- Gate -->
      <line x1="78" y1="150" x2="78" y2="170" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="50" y1="160" x2="78" y2="160" class="wire-hi"/>
      <text x="45" y="164" text-anchor="end" class="code-txt" fill="#38bdf8">MCU PWM</text>

      <!-- Source to GND -->
      <line x1="90" y1="168" x2="90" y2="185" class="wire"/>
      <line x1="80" y1="185" x2="100" y2="185" class="wire"/>
    </g>

    <!-- Info Box -->
    <rect x="15" y="240" width="270" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">Duty Cycle Brightness Dimming</text>
    <text x="25" y="284" class="sublabel">PWM frequency &gt; 1 kHz avoids visual flicker.</text>
    <text x="25" y="302" class="sublabel">Preserves LED color spectrum &amp; CRI</text>
    <text x="25" y="320" class="sublabel">unlike analog variable-current dimming.</text>
  </g>
</svg>