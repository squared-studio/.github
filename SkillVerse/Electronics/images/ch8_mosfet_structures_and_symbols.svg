<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">MOSFET Fundamentals: Physical Structure, Dielectric Gate &amp; Symbols</text>

  <!-- Panel 1: Physical MOS Cross-Section -->
  <g transform="translate(25, 55)">
    <rect width="320" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">N-Channel Enhancement Cross-Section</text>

    <!-- Semiconductor Substrate -->
    <g transform="translate(35, 50)">
      <!-- P-Substrate Body -->
      <rect x="0" y="40" width="250" height="95" rx="3" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="125" y="115" text-anchor="middle" class="sublabel" style="fill:#f43f5e; font-weight:bold;">P-type Substrate (Body / Bulk)</text>

      <!-- Source N+ Well -->
      <rect x="15" y="40" width="55" height="35" rx="2" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="42" y="62" text-anchor="middle" class="code-txt" fill="#38bdf8">N+</text>
      <!-- Drain N+ Well -->
      <rect x="180" y="40" width="55" height="35" rx="2" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1.8"/>
      <text x="207" y="62" text-anchor="middle" class="code-txt" fill="#38bdf8">N+</text>

      <!-- Inversion Channel (Electrons) under Gate -->
      <rect x="70" y="40" width="110" height="12" fill="#34d399" fill-opacity="0.4" stroke="#34d399" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="125" y="50" text-anchor="middle" class="sublabel" style="font-size:9px; fill:#34d399;">N-Channel Inversion</text>

      <!-- SiO2 Dielectric Oxide -->
      <rect x="70" y="28" width="110" height="12" fill="#fbbf24" fill-opacity="0.3" stroke="#d97706" stroke-width="1.2"/>
      <text x="125" y="24" text-anchor="middle" class="sublabel" style="font-size:9px; fill:#fbbf24;">SiO₂ Oxide (Insulator)</text>

      <!-- Polysilicon/Metal Gate -->
      <rect x="70" y="10" width="110" height="18" rx="2" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="125" y="23" text-anchor="middle" class="sublabel" fill="#fff" font-weight="bold">Gate Electrode</text>

      <!-- Terminal Wires -->
      <line x1="125" y1="10" x2="125" y2="-15" class="wire-hi"/>
      <text x="135" y="-5" class="code-txt" fill="#fbbf24">G</text>

      <line x1="42" y1="40" x2="42" y2="10" class="wire"/>
      <line x1="42" y1="10" x2="15" y2="10" class="wire"/>
      <text x="5" y="14" class="code-txt" fill="#38bdf8">S</text>

      <line x1="207" y1="40" x2="207" y2="10" class="wire"/>
      <line x1="207" y1="10" x2="235" y2="10" class="wire"/>
      <text x="240" y="14" class="code-txt" fill="#38bdf8">D</text>
    </g>

    <!-- Info Box -->
    <rect x="15" y="215" width="290" height="125" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="238" class="label" font-weight="bold">Zero Gate DC Current</text>
    <text x="25" y="258" class="sublabel">SiO₂ dielectric completely isolates the gate;</text>
    <text x="25" y="274" class="sublabel">input resistance exceeds 10¹² Ω (Tera-ohms!).</text>
    <text x="25" y="294" class="sublabel">Conduction requires V_GS &gt; V_th to attract</text>
    <text x="25" y="310" class="sublabel">minority electrons into the surface channel.</text>
    <text x="25" y="330" class="sublabel" style="fill:#f43f5e;">Caution: Thin oxide vulnerable to ESD rupture!</text>
  </g>

  <!-- Panel 2: Schematic Symbols -->
  <g transform="translate(365, 55)">
    <rect width="280" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Schematic Symbols</text>

    <!-- NMOS Enhancement -->
    <g transform="translate(45, 50)">
      <circle cx="75" cy="50" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Gate plate -->
      <line x1="55" y1="32" x2="55" y2="68" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="20" y1="50" x2="55" y2="50" class="wire"/>
      <text x="10" y="54" class="code-txt" fill="#fbbf24">G</text>

      <!-- Broken channel segments (Enhancement = Normally OFF) -->
      <line x1="65" y1="32" x2="65" y2="42" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="65" y1="46" x2="65" y2="54" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="65" y1="58" x2="65" y2="68" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Drain -->
      <line x1="65" y1="36" x2="95" y2="36" class="wire"/>
      <line x1="95" y1="36" x2="95" y2="20" class="wire"/>
      <text x="105" y="24" class="code-txt" fill="#38bdf8">D</text>

      <!-- Source & Body (tied together) -->
      <line x1="65" y1="64" x2="95" y2="64" class="wire"/>
      <line x1="95" y1="64" x2="95" y2="80" class="wire"/>
      <text x="105" y="84" class="code-txt" fill="#38bdf8">S</text>
      <!-- Substrate arrow pointing IN -->
      <line x1="65" y1="50" x2="85" y2="50" class="wire"/>
      <polygon points="75,46 65,50 75,54" fill="#38bdf8"/>
      <line x1="85" y1="50" x2="85" y2="64" class="wire"/>

      <text x="75" y="102" text-anchor="middle" class="code-txt" fill="#38bdf8">N-Channel Enhancement</text>
      <text x="75" y="116" text-anchor="middle" class="sublabel">Normally OFF (Dashed channel)</text>
    </g>

    <!-- PMOS Enhancement -->
    <g transform="translate(45, 190)">
      <circle cx="75" cy="50" r="32" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8"/>
      <!-- Gate with Inversion Bubble -->
      <line x1="20" y1="50" x2="48" y2="50" class="wire"/>
      <circle cx="51" cy="50" r="3" fill="none" stroke="#f43f5e" stroke-width="1.5"/>
      <line x1="57" y1="32" x2="57" y2="68" stroke="#cbd5e1" stroke-width="2.5"/>
      <text x="10" y="54" class="code-txt" fill="#fbbf24">G</text>

      <!-- Dashed channel -->
      <line x1="67" y1="32" x2="67" y2="42" stroke="#f43f5e" stroke-width="2.5"/>
      <line x1="67" y1="46" x2="67" y2="54" stroke="#f43f5e" stroke-width="2.5"/>
      <line x1="67" y1="58" x2="67" y2="68" stroke="#f43f5e" stroke-width="2.5"/>

      <!-- Source at top for PMOS -->
      <line x1="67" y1="36" x2="95" y2="36" class="wire"/>
      <line x1="95" y1="36" x2="95" y2="20" class="wire"/>
      <text x="105" y="24" class="code-txt" fill="#f43f5e">S</text>

      <line x1="67" y1="64" x2="95" y2="64" class="wire"/>
      <line x1="95" y1="64" x2="95" y2="80" class="wire"/>
      <text x="105" y="84" class="code-txt" fill="#f43f5e">D</text>

      <text x="75" y="102" text-anchor="middle" class="code-txt" fill="#f43f5e">P-Channel Enhancement</text>
      <text x="75" y="116" text-anchor="middle" class="sublabel">Gate Bubble / Arrow points OUT</text>
    </g>
  </g>

  <!-- Panel 3: Operating Regions & Equations -->
  <g transform="translate(665, 55)">
    <rect width="270" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Operating Regions</text>

    <rect x="15" y="48" width="240" height="290" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <g transform="translate(25, 72)">
      <text x="0" y="0" class="code-txt" fill="#f43f5e">1. Cutoff (OFF):</text>
      <text x="0" y="20" class="code-txt">V_GS &lt; V_th  →  I_D ≈ 0</text>
      <text x="0" y="36" class="sublabel">Subthreshold leakage &lt; 1 nA</text>

      <line x1="0" y1="52" x2="220" y2="52" stroke="#1e293b"/>

      <text x="0" y="72" class="code-txt" fill="#38bdf8">2. Triode / Linear (Ohmic):</text>
      <text x="0" y="92" class="code-txt">V_DS &lt; V_GS - V_th</text>
      <text x="0" y="110" class="sublabel">I_D ≈ k · [ (V_GS - V_th)V_DS - ½V_DS² ]</text>
      <text x="0" y="128" class="code-txt" style="font-size:11px; fill:#34d399;">R_DS(on) ≈ 1 / [k · (V_GS - V_th)]</text>
      <text x="0" y="144" class="sublabel">Power switches reach &lt; 5 mΩ!</text>

      <line x1="0" y1="160" x2="220" y2="160" stroke="#1e293b"/>

      <text x="0" y="180" class="code-txt" fill="#fbbf24">3. Saturation (Active):</text>
      <text x="0" y="200" class="code-txt">V_DS ≥ V_GS - V_th</text>
      <text x="0" y="222" class="code-txt" style="font-size:11px; fill:#34d399;">I_D = ½ · k · (V_GS - V_th)²</text>
      <text x="0" y="240" class="sublabel">Current depends purely on gate V_GS</text>
    </g>
  </g>
</svg>