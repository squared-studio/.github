<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .section-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .accent-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #fbbf24; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .resistor-body { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 3; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Resistor Fundamentals, Schematics &amp; Network Rules</text>

  <!-- Panel 1: Ohm's Law & Power -->
  <g transform="translate(25, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="section-title">Ohm's Law &amp; Power Relations</text>

    <!-- Triangle -->
    <polygon points="142,55 72,150 212,150" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="97" y1="110" x2="187" y2="110" stroke="#38bdf8" stroke-width="2"/>
    <line x1="142" y1="110" x2="142" y2="150" stroke="#38bdf8" stroke-width="2"/>
    <text x="142" y="95" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f43f5e">V</text>
    <text x="117" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8">I</text>
    <text x="167" y="137" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#34d399">R</text>

    <!-- Ohm's Law Equations Box -->
    <rect x="20" y="168" width="245" height="85" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="32" y="192" class="code-txt">V = I · R     [Volts (V)]</text>
    <text x="32" y="214" class="code-txt">I = V / R     [Amperes (A)]</text>
    <text x="32" y="236" class="code-txt">R = V / I     [Ohms (Ω)]</text>

    <!-- Power Equations -->
    <text x="20" y="280" class="section-title" style="font-size:12px; fill:#fbbf24;">Joule's Power Dissipation (Heat)</text>
    <rect x="20" y="292" width="245" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="32" y="315" class="accent-txt">P = V · I = I²·R = V² / R</text>
    <text x="32" y="338" class="sublabel">Power Ratings: 1/8W, 1/4W, 1/2W, 1W, 5W+</text>
  </g>

  <!-- Panel 2: Schematic Symbols -->
  <g transform="translate(330, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="section-title">Standard Schematic Symbols</text>

    <!-- ANSI Symbol -->
    <text x="20" y="60" class="label" font-weight="bold">Fixed Resistor (US / ANSI)</text>
    <path d="M 25,90 L 55,90 L 65,77 L 80,103 L 95,77 L 110,103 L 125,77 L 140,103 L 150,90 L 180,90" class="wire-hi"/>
    <text x="195" y="94" class="code-txt">R [ANSI]</text>

    <!-- IEC Symbol -->
    <text x="20" y="132" class="label" font-weight="bold">Fixed Resistor (IEC / Europe)</text>
    <line x1="25" y1="160" x2="60" y2="160" class="wire"/>
    <rect x="60" y="150" width="85" height="20" class="resistor-body"/>
    <line x1="145" y1="160" x2="180" y2="160" class="wire"/>
    <text x="195" y="164" class="code-txt">R [IEC]</text>

    <!-- Potentiometer -->
    <text x="20" y="205" class="label" font-weight="bold">Potentiometer (Variable 3-Pin)</text>
    <path d="M 25,240 L 55,240 L 65,227 L 80,253 L 95,227 L 110,253 L 125,227 L 140,253 L 150,240 L 180,240" class="wire-hi"/>
    <line x1="102" y1="280" x2="102" y2="248" class="wire" stroke="#fbbf24" marker-end="url(#arr-amber)"/>
    <text x="195" y="244" class="code-txt">Wiper</text>

    <!-- Photoresistor LDR -->
    <text x="20" y="305" class="label" font-weight="bold">LDR (Photoresistor / Sensor)</text>
    <circle cx="102" cy="330" r="22" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="75" y="322" width="55" height="16" class="resistor-body"/>
    <line x1="25" y1="330" x2="75" y2="330" class="wire"/>
    <line x1="130" y1="330" x2="180" y2="330" class="wire"/>
    <line x1="62" y1="300" x2="78" y2="315" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)"/>
    <line x1="72" y1="295" x2="88" y2="310" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arr-amber)"/>
    <text x="195" y="334" class="sublabel">Light Sensitive</text>
  </g>

  <!-- Panel 3: Series vs Parallel Networks -->
  <g transform="translate(635, 55)">
    <rect width="300" height="360" class="card"/>
    <text x="20" y="30" class="section-title">Series vs Parallel Combinations</text>

    <!-- Series Block -->
    <text x="20" y="58" class="label" font-weight="bold">Series Circuit (Single Path)</text>
    <g transform="translate(15, 68)">
      <circle cx="10" cy="18" r="3.5" fill="#38bdf8"/>
      <line x1="14" y1="18" x2="35" y2="18" class="wire"/>
      <rect x="35" y="10" width="40" height="16" class="resistor-body"/>
      <text x="55" y="22" text-anchor="middle" class="sublabel" fill="#fff">R1</text>
      <line x1="75" y1="18" x2="105" y2="18" class="wire"/>
      <rect x="105" y="10" width="40" height="16" class="resistor-body"/>
      <text x="125" y="22" text-anchor="middle" class="sublabel" fill="#fff">R2</text>
      <line x1="145" y1="18" x2="175" y2="18" class="wire"/>
      <rect x="175" y="10" width="40" height="16" class="resistor-body"/>
      <text x="195" y="22" text-anchor="middle" class="sublabel" fill="#fff">R3</text>
      <line x1="215" y1="18" x2="250" y2="18" class="wire"/>
      <circle cx="250" cy="18" r="3.5" fill="#38bdf8"/>
    </g>
    <rect x="20" y="112" width="260" height="50" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="132" class="code-txt">R_total = R1 + R2 + ... + Rn</text>
    <text x="30" y="150" class="sublabel">Current I is equal; Voltages add: V = Σ V_k</text>

    <!-- Parallel Block -->
    <text x="20" y="190" class="label" font-weight="bold">Parallel Circuit (Common Nodes)</text>
    <g transform="translate(25, 202)">
      <circle cx="10" cy="38" r="3.5" fill="#38bdf8"/>
      <line x1="14" y1="38" x2="45" y2="38" class="wire"/>
      <line x1="45" y1="12" x2="45" y2="64" class="wire"/>

      <line x1="45" y1="12" x2="75" y2="12" class="wire"/>
      <rect x="75" y="4" width="48" height="16" class="resistor-body"/>
      <text x="99" y="16" text-anchor="middle" class="sublabel" fill="#fff">R1</text>
      <line x1="123" y1="12" x2="155" y2="12" class="wire"/>

      <line x1="45" y1="64" x2="75" y2="64" class="wire"/>
      <rect x="75" y="56" width="48" height="16" class="resistor-body"/>
      <text x="99" y="68" text-anchor="middle" class="sublabel" fill="#fff">R2</text>
      <line x1="123" y1="64" x2="155" y2="64" class="wire"/>

      <line x1="155" y1="12" x2="155" y2="64" class="wire"/>
      <line x1="155" y1="38" x2="195" y2="38" class="wire"/>
      <circle cx="195" cy="38" r="3.5" fill="#38bdf8"/>
    </g>
    <rect x="20" y="295" width="260" height="60" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="315" class="code-txt">1/R_total = 1/R1 + 1/R2 + ...</text>
    <text x="30" y="333" class="code-txt" style="font-size:11px; fill:#38bdf8;">Two Resistors: R_eq = (R1·R2)/(R1+R2)</text>
    <text x="30" y="347" class="sublabel">Voltage V is equal; Currents add: I = Σ I_k</text>
  </g>
</svg>