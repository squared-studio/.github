<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .quartz-crystal { fill: #38bdf8; fill-opacity: 0.15; stroke: #38bdf8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Piezoelectric Quartz Crystals: Physics, AT-Cut &amp; 32.768 kHz Tuning Forks</text>

  <!-- Panel 1: Direct vs Inverse Piezoelectric Effect -->
  <g transform="translate(25, 55)">
    <rect width="320" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Piezoelectric Transduction Mechanism</text>

    <!-- Crystal Block under stress -->
    <g transform="translate(45, 50)">
      <!-- Top compression force -->
      <polygon points="115,5 105,-10 125,-10" fill="#f43f5e"/>
      <text x="115" y="-15" text-anchor="middle" class="sublabel" fill="#f43f5e" font-weight="bold">Mechanical Stress F</text>

      <!-- Quartz Wafer -->
      <rect x="30" y="25" width="170" height="70" rx="4" class="quartz-crystal"/>
      <!-- Metal Electrodes -->
      <rect x="50" y="20" width="130" height="7" fill="#cbd5e1" stroke="#94a3b8"/>
      <rect x="50" y="93" width="130" height="7" fill="#cbd5e1" stroke="#94a3b8"/>

      <text x="115" y="58" text-anchor="middle" class="code-txt" fill="#38bdf8">Quartz Crystal (SiO₂)</text>
      <text x="115" y="75" text-anchor="middle" class="sublabel">Non-centrosymmetric Lattice</text>

      <!-- Terminal leads with generated voltage -->
      <line x1="115" y1="20" x2="115" y2="5" class="wire"/>
      <line x1="115" y1="100" x2="115" y2="115" class="wire"/>
      <polygon points="115,130 105,145 125,145" fill="#f43f5e"/>

      <!-- Polarity charges -->
      <text x="65" y="16" class="code-txt" fill="#f43f5e" style="font-size:11px;">+ + + +</text>
      <text x="65" y="114" class="code-txt" fill="#38bdf8" style="font-size:11px;">- - - -</text>
    </g>

    <!-- Formula Box -->
    <rect x="15" y="210" width="290" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="234" class="label" font-weight="bold">Bidirectional Coupling</text>
    <text x="25" y="256" class="sublabel">• Direct Effect: Force deform lattice</text>
    <text x="35" y="272" class="sublabel">→ Displaces ion centers → Generates Voltage</text>
    <text x="25" y="294" class="sublabel">• Inverse Effect: Voltage across plates</text>
    <text x="35" y="310" class="sublabel">→ Induces physical mechanical deformation</text>
    <text x="25" y="330" class="code-txt" style="font-size:11px;">Creates ultra-stable acoustic resonance!</text>
  </g>

  <!-- Panel 2: AT-Cut Crystal Wafer -->
  <g transform="translate(365, 55)">
    <rect width="280" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">AT-Cut Thickness Shear Mode</text>

    <!-- Angle slice drawing -->
    <g transform="translate(40, 50)">
      <!-- Z-axis line -->
      <line x1="50" y1="110" x2="50" y2="10" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3,3"/>
      <text x="45" y="8" text-anchor="end" class="sublabel">Optical Z-Axis</text>

      <!-- AT Cut plate tilted at 35°15' -->
      <g transform="rotate(35.25, 50, 60)">
        <rect x="0" y="50" width="120" height="20" rx="2" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
        <text x="60" y="64" text-anchor="middle" class="sublabel" style="font-size:9px; fill:#fff;">AT-Cut Slice</text>
      </g>
      <!-- Angle Arc -->
      <path d="M 50,35 A 25,25 0 0,1 66,42" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="75" y="32" class="code-txt" fill="#fbbf24">35° 15'</text>
    </g>

    <!-- Info Box -->
    <rect x="15" y="210" width="250" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="234" class="label" font-weight="bold">Zero Temperature Drift at 25°C</text>
    <text x="25" y="256" class="sublabel">• Operates in thickness-shear mode</text>
    <text x="25" y="274" class="sublabel">• Resonant frequency 1 MHz to 50+ MHz</text>
    <text x="25" y="292" class="sublabel">• Inflection point calibrated to room temp,</text>
    <text x="25" y="310" class="sublabel">  holding stability within ±10 to ±30 ppm.</text>
    <text x="25" y="330" class="code-txt" style="font-size:11px;">Standard in MCUs, CPUs, PCIe &amp; USB.</text>
  </g>

  <!-- Panel 3: 32.768 kHz Tuning Fork RTC Crystal -->
  <g transform="translate(665, 55)">
    <rect width="270" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">32.768 kHz RTC Tuning Fork</text>

    <!-- Tuning Fork Drawing -->
    <g transform="translate(85, 45)">
      <!-- Fork Prongs -->
      <path d="M 25,10 L 25,75 Q 25,95 45,95 Q 65,95 65,75 L 65,10" stroke="#34d399" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- Base handle -->
      <line x1="45" y1="95" x2="45" y2="135" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>

      <!-- Flexural vibration arrows -->
      <path d="M 15,25 Q 25,20 35,25" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <path d="M 55,25 Q 65,20 75,25" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <text x="45" y="-5" text-anchor="middle" class="code-txt" fill="#34d399">Flexural Mode</text>
    </g>

    <!-- RTC calculation box -->
    <rect x="15" y="210" width="240" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="234" class="label" font-weight="bold">Why 32,768 Hz?</text>
    <text x="25" y="256" class="code-txt" fill="#38bdf8">32,768 = 2¹⁵</text>
    <text x="25" y="278" class="sublabel">A simple 15-stage binary flip-flop</text>
    <text x="25" y="294" class="sublabel">divider yields exactly 1.000 Hz</text>
    <text x="25" y="310" class="sublabel">(1 pulse/sec) for real-time clocks</text>
    <text x="25" y="330" class="code-txt" style="font-size:11px; fill:#fbbf24;">Consumes &lt; 1 μA in sleep modes!</text>
  </g>
</svg>