<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .res-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 2; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Essential BJT Circuit Topologies: Saturated Switch &amp; Linear Amplifier</text>

  <!-- Panel 1: Saturated Transistor Switch -->
  <g transform="translate(25, 55)">
    <rect width="450" height="360" class="card"/>
    <text x="25" y="30" class="sec-title">1. Saturated BJT Switch (GPIO Load Driver)</text>

    <!-- Switch Schematic -->
    <g transform="translate(60, 50)">
      <!-- Vcc rail -->
      <circle cx="160" cy="15" r="3.5" fill="#f43f5e"/>
      <text x="160" y="5" text-anchor="middle" class="sublabel" fill="#f43f5e">+12V Load Rail</text>
      <line x1="160" y1="19" x2="160" y2="40" class="wire"/>

      <!-- Load (e.g. Relay / Motor / High power LED) -->
      <rect x="140" y="40" width="40" height="35" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <text x="160" y="62" text-anchor="middle" class="sublabel" fill="#fff" font-weight="bold">LOAD</text>
      <line x1="160" y1="75" x2="160" y2="95" class="wire"/>

      <!-- NPN Transistor -->
      <circle cx="150" cy="115" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Base bar -->
      <line x1="140" y1="102" x2="140" y2="128" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="140" y1="107" x2="160" y2="95" stroke="#38bdf8" stroke-width="2"/> <!-- Collector -->
      <line x1="140" y1="123" x2="160" y2="135" stroke="#38bdf8" stroke-width="2"/> <!-- Emitter -->
      <polygon points="152,129 162,137 155,138" fill="#38bdf8"/>

      <!-- Base resistor R_B -->
      <line x1="50" y1="115" x2="80" y2="115" class="wire"/>
      <rect x="80" y="106" width="36" height="18" class="res-box"/>
      <text x="98" y="119" text-anchor="middle" class="sublabel" fill="#fff">R_B</text>
      <line x1="116" y1="115" x2="140" y2="115" class="wire"/>

      <!-- MCU Control Pin -->
      <circle cx="50" cy="115" r="3.5" fill="#34d399"/>
      <text x="45" y="102" text-anchor="end" class="code-txt">MCU (3.3V/0V)</text>

      <!-- Emitter to GND -->
      <line x1="160" y1="135" x2="160" y2="160" class="wire"/>
      <line x1="150" y1="160" x2="170" y2="160" class="wire"/>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="240" width="410" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="262" class="code-txt">R_B = (V_GPIO - 0.7V) / I_B</text>
    <text x="30" y="284" class="label">Forced Beta / Overdrive Rule: I_B = I_C / 10</text>
    <text x="30" y="304" class="sublabel">Ensures hard saturation: V_CE(sat) &lt; 0.2V,</text>
    <text x="30" y="322" class="sublabel">minimizing transistor heat dissipation P = I_C · V_CE.</text>
  </g>

  <!-- Panel 2: Common-Emitter AC Voltage Amplifier -->
  <g transform="translate(485, 55)">
    <rect width="450" height="360" class="card"/>
    <text x="25" y="30" class="sec-title">2. Common-Emitter Voltage Amplifier</text>

    <!-- Amplifier Schematic -->
    <g transform="translate(70, 48)">
      <!-- Vcc -->
      <circle cx="100" cy="12" r="3.5" fill="#f43f5e"/>
      <text x="100" y="3" text-anchor="middle" class="sublabel" fill="#f43f5e">+V_CC (12V)</text>
      <line x1="100" y1="15" x2="100" y2="30" class="wire"/>

      <line x1="50" y1="30" x2="150" y2="30" class="wire-hi"/>

      <!-- R1 & RC -->
      <rect x="42" y="30" width="16" height="30" class="res-box"/>
      <text x="30" y="48" class="sublabel">R1</text>
      <rect x="142" y="30" width="16" height="30" class="res-box"/>
      <text x="168" y="48" class="sublabel">R_C</text>

      <line x1="50" y1="60" x2="50" y2="90" class="wire"/>
      <line x1="50" y1="90" x2="100" y2="90" class="wire"/>
      <!-- AC Input capacitor C_in -->
      <circle cx="10" cy="90" r="3" fill="#38bdf8"/>
      <line x1="13" y1="90" x2="30" y2="90" class="wire"/>
      <line x1="30" y1="83" x2="30" y2="97" stroke="#38bdf8" stroke-width="2"/>
      <line x1="34" y1="83" x2="34" y2="97" stroke="#38bdf8" stroke-width="2"/>
      <line x1="34" y1="90" x2="50" y2="90" class="wire"/>
      <text x="8" y="80" class="sublabel" fill="#38bdf8">V_in</text>

      <!-- Transistor -->
      <line x1="100" y1="90" x2="115" y2="90" class="wire"/>
      <circle cx="125" cy="90" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <line x1="118" y1="80" x2="118" y2="100" stroke="#cbd5e1" stroke-width="2"/>
      <line x1="118" y1="84" x2="135" y2="72" stroke="#38bdf8" stroke-width="1.8"/> <!-- C -->
      <line x1="118" y1="96" x2="135" y2="108" stroke="#38bdf8" stroke-width="1.8"/> <!-- E -->

      <line x1="150" y1="60" x2="150" y2="72" class="wire"/>
      <line x1="135" y1="72" x2="150" y2="72" class="wire"/>

      <!-- Output Cap C_out -->
      <line x1="150" y1="72" x2="185" y2="72" class="wire-hi"/>
      <line x1="185" y1="65" x2="185" y2="79" stroke="#38bdf8" stroke-width="2"/>
      <line x1="189" y1="65" x2="189" y2="79" stroke="#38bdf8" stroke-width="2"/>
      <line x1="189" y1="72" x2="215" y2="72" class="wire-hi"/>
      <text x="220" y="76" class="code-txt" fill="#34d399">V_out</text>

      <!-- R2 & RE -->
      <line x1="50" y1="90" x2="50" y2="110" class="wire"/>
      <rect x="42" y="110" width="16" height="30" class="res-box"/>
      <text x="30" y="128" class="sublabel">R2</text>
      <line x1="50" y1="140" x2="50" y2="165" class="wire"/>

      <line x1="135" y1="108" x2="135" y2="120" class="wire"/>
      <rect x="127" y="120" width="16" height="25" class="res-box"/>
      <text x="110" y="135" class="sublabel">R_E</text>
      <line x1="135" y1="145" x2="135" y2="165" class="wire"/>

      <!-- GND bus -->
      <line x1="40" y1="165" x2="160" y2="165" class="wire"/>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="240" width="410" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="262" class="code-txt">Voltage Gain: A_v ≈ -R_C / r_e   (180° Inverted)</text>
    <text x="30" y="284" class="label">Voltage Divider Bias Stability</text>
    <text x="30" y="304" class="sublabel">R1/R2 set immune base voltage V_B.</text>
    <text x="30" y="322" class="sublabel">R_E provides negative feedback against thermal runaway.</text>
  </g>
</svg>