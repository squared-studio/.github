<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .res-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 2; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Essential JFET Circuit Topologies: Self-Biased Amplifier &amp; Constant Current Source</text>

  <!-- Panel 1: Self-Biased Common-Source Amp -->
  <g transform="translate(25, 55)">
    <rect width="450" height="360" class="card"/>
    <text x="25" y="30" class="sec-title">1. Common-Source Self-Biased Amplifier</text>

    <!-- Schematic -->
    <g transform="translate(60, 48)">
      <!-- VDD rail -->
      <circle cx="160" cy="15" r="3.5" fill="#f43f5e"/>
      <text x="160" y="5" text-anchor="middle" class="sublabel" fill="#f43f5e">+V_DD (15V)</text>
      <line x1="160" y1="19" x2="160" y2="40" class="wire"/>

      <!-- Drain resistor RD -->
      <rect x="152" y="40" width="16" height="32" class="res-box"/>
      <text x="178" y="58" class="sublabel">R_D</text>
      <line x1="160" y1="72" x2="160" y2="88" class="wire"/>

      <!-- Output Coupling -->
      <line x1="160" y1="88" x2="200" y2="88" class="wire-hi"/>
      <line x1="200" y1="80" x2="200" y2="96" stroke="#38bdf8" stroke-width="2"/>
      <line x1="204" y1="80" x2="204" y2="96" stroke="#38bdf8" stroke-width="2"/>
      <line x1="204" y1="88" x2="230" y2="88" class="wire-hi"/>
      <text x="235" y="92" class="code-txt" fill="#34d399">V_out</text>

      <!-- JFET symbol -->
      <circle cx="145" cy="100" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="145" y1="85" x2="145" y2="115" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="145" y1="88" x2="160" y2="88" stroke="#38bdf8" stroke-width="2"/> <!-- Drain -->
      <line x1="145" y1="112" x2="160" y2="112" stroke="#38bdf8" stroke-width="2"/> <!-- Source -->
      <!-- Gate -->
      <line x1="100" y1="100" x2="145" y2="100" class="wire"/>
      <polygon points="125,95 137,100 125,105" fill="#38bdf8"/>

      <!-- Gate Input & RG resistor to ground -->
      <circle cx="40" cy="100" r="3" fill="#38bdf8"/>
      <line x1="43" y1="100" x2="70" y2="100" class="wire"/>
      <line x1="70" y1="92" x2="70" y2="108" stroke="#38bdf8" stroke-width="2"/>
      <line x1="74" y1="92" x2="74" y2="108" stroke="#38bdf8" stroke-width="2"/>
      <line x1="74" y1="100" x2="100" y2="100" class="wire"/>
      <text x="35" y="90" class="sublabel" fill="#38bdf8">V_in</text>

      <!-- R_G (1M - 10M) -->
      <line x1="100" y1="100" x2="100" y2="125" class="wire"/>
      <rect x="92" y="125" width="16" height="30" class="res-box"/>
      <text x="75" y="142" class="sublabel">R_G</text>
      <line x1="100" y1="155" x2="100" y2="175" class="wire"/>

      <!-- Source Resistor R_S and Bypass Cap C_S -->
      <line x1="160" y1="112" x2="160" y2="125" class="wire"/>
      <rect x="152" y="125" width="16" height="30" class="res-box"/>
      <text x="178" y="142" class="sublabel">R_S</text>
      <line x1="160" y1="155" x2="160" y2="175" class="wire"/>

      <!-- GND rail -->
      <line x1="90" y1="175" x2="180" y2="175" class="wire"/>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="245" width="410" height="100" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="268" class="code-txt">Self-Bias: V_GS = -I_D · R_S</text>
    <text x="30" y="288" class="label">Zero Gate Current (I_G ≈ 0):</text>
    <text x="30" y="306" class="sublabel">High R_G (1MΩ to 10MΩ) prevents signal source loading;</text>
    <text x="30" y="324" class="sublabel">ideal for guitar pickups, hydrophones &amp; photodetectors.</text>
  </g>

  <!-- Panel 2: Constant Current Diode Source -->
  <g transform="translate(485, 55)">
    <rect width="450" height="360" class="card"/>
    <text x="25" y="30" class="sec-title">2. 2-Terminal Constant Current Source (CCS)</text>

    <!-- CCS Schematic -->
    <g transform="translate(140, 50)">
      <!-- Anode / Top Rail -->
      <line x1="50" y1="15" x2="50" y2="40" class="wire-hi"/>
      <circle cx="50" cy="15" r="3.5" fill="#38bdf8"/>
      <text x="50" y="5" text-anchor="middle" class="code-txt" fill="#38bdf8">V_in &gt; |V_P|</text>

      <!-- JFET -->
      <circle cx="45" cy="65" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="45" y1="48" x2="45" y2="82" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="45" y1="52" x2="50" y2="40" class="wire"/> <!-- Drain -->
      <line x1="45" y1="78" x2="50" y2="95" class="wire"/> <!-- Source -->

      <!-- Gate connected directly to Source! (V_GS = 0) -->
      <line x1="10" y1="65" x2="45" y2="65" class="wire"/>
      <polygon points="25,60 37,65 25,70" fill="#38bdf8"/>
      <path d="M 10,65 L 0,65 L 0,95 L 50,95" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="50" cy="95" r="3" fill="#38bdf8"/>

      <!-- Output Current -->
      <line x1="50" y1="95" x2="50" y2="140" class="wire-hi"/>
      <polygon points="46,130 54,130 50,140" fill="#34d399"/>
      <text x="70" y="125" class="code-txt" fill="#34d399">I_out = I_DSS</text>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="245" width="410" height="100" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="268" class="code-txt">V_GS = 0V  →  I_D = I_DSS (Self-Regulated)</text>
    <text x="30" y="290" class="label">Current Limiting Diode (CLD)</text>
    <text x="30" y="308" class="sublabel">Maintains constant current regardless of supply voltage</text>
    <text x="30" y="326" class="sublabel">as long as V_DS exceeds pinch-off voltage |V_P|.</text>
  </g>
</svg>