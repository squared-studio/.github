<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .epoxy { fill: #38bdf8; fill-opacity: 0.12; stroke: #38bdf8; stroke-width: 2; }
      .lead { stroke: #94a3b8; stroke-width: 4; stroke-linecap: round; }
    </style>
    <marker id="arr-photon" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">LED Physical Construction &amp; Photon Electroluminescence Mechanism</text>

  <!-- Panel 1: Through-Hole LED Anatomy -->
  <g transform="translate(25, 55)">
    <rect width="320" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Through-Hole LED Construction</text>

    <!-- LED drawing -->
    <g transform="translate(50, 48)">
      <!-- Epoxy Lens Dome -->
      <path d="M 50,20 C 50,-5 150,-5 150,20 L 150,110 L 40,110 L 40,105 L 50,105 Z" class="epoxy"/>
      <text x="100" y="25" text-anchor="middle" class="sublabel" style="fill:#38bdf8;">Epoxy Lens</text>

      <!-- Anvil (Cathode) -->
      <path d="M 68,60 L 92,60 L 85,85 L 85,170" stroke="#cbd5e1" stroke-width="4" fill="none"/>
      <!-- Reflector cup -->
      <polygon points="68,55 92,55 86,63 74,63" fill="#cbd5e1"/>
      <!-- Semiconductor Die in cup -->
      <rect x="77" y="56" width="6" height="5" fill="#f43f5e"/>
      <text x="50" y="80" class="sublabel" fill="#cbd5e1">Anvil</text>

      <!-- Post (Anode) -->
      <line x1="115" y1="65" x2="115" y2="190" stroke="#cbd5e1" stroke-width="4"/>
      <!-- Wire bond from die to post -->
      <path d="M 80,56 Q 98,40 115,65" stroke="#fbbf24" stroke-width="1.5" fill="none"/>
      <text x="140" y="80" class="sublabel" fill="#cbd5e1">Post</text>

      <!-- Flat Spot on Rim (Cathode indicator) -->
      <line x1="38" y1="105" x2="38" y2="115" stroke="#f43f5e" stroke-width="3"/>
      <text x="5" y="105" class="sublabel" fill="#f43f5e">Flat Spot</text>

      <!-- Lead labels -->
      <text x="85" y="210" text-anchor="middle" class="code-txt" fill="#38bdf8">Cathode (-)</text>
      <text x="85" y="224" text-anchor="middle" class="sublabel">Shorter Lead</text>

      <text x="140" y="210" text-anchor="middle" class="code-txt" fill="#f43f5e">Anode (+)</text>
      <text x="140" y="224" text-anchor="middle" class="sublabel">Longer Lead</text>
    </g>
  </g>

  <!-- Panel 2: Bandgap Photon Emission Physics -->
  <g transform="translate(360, 55)">
    <rect width="320" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Quantum Bandgap Electroluminescence</text>

    <!-- Energy Band Diagram -->
    <g transform="translate(35, 55)">
      <!-- Conduction Band -->
      <rect x="10" y="10" width="230" height="35" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="125" y="32" text-anchor="middle" class="code-txt" fill="#38bdf8">Conduction Band (E_c)</text>
      <!-- Free electron -->
      <circle cx="70" cy="27" r="5" fill="#38bdf8"/>
      <text x="70" y="22" text-anchor="middle" class="sublabel" style="font-size:9px;">e⁻</text>

      <!-- Bandgap Energy Gap (Eg) -->
      <line x1="70" y1="45" x2="70" y2="105" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Radiative recombination arrow -->
      <path d="M 70,35 Q 90,70 70,105" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
      <text x="140" y="75" class="code-txt" fill="#fbbf24">Direct Bandgap E_g</text>

      <!-- Valence Band -->
      <rect x="10" y="105" width="230" height="35" rx="4" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1.5"/>
      <text x="125" y="127" text-anchor="middle" class="code-txt" fill="#34d399">Valence Band (E_v)</text>
      <!-- Hole -->
      <circle cx="70" cy="122" r="5" fill="none" stroke="#34d399" stroke-width="2"/>
      <text x="70" y="117" text-anchor="middle" class="sublabel" style="font-size:9px;">h⁺</text>

      <!-- Emitted Photon Wave -->
      <path d="M 85,70 Q 95,60 105,70 Q 115,80 125,70 Q 135,60 145,70" stroke="#fbbf24" stroke-width="2.5" fill="none" marker-end="url(#arr-photon)"/>
      <text x="160" y="73" class="code-txt" fill="#fbbf24">Photon (h·ν)</text>
    </g>

    <!-- Formula Box -->
    <rect x="15" y="215" width="290" height="125" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="238" class="code-txt">E_g = h · ν = (h · c) / λ</text>
    <text x="25" y="260" class="code-txt" style="font-size:11px; fill:#fbbf24;">λ [nm] ≈ 1240 / E_g [eV]</text>
    <text x="25" y="285" class="sublabel">Higher bandgap energy produces shorter</text>
    <text x="25" y="302" class="sublabel">wavelengths (Blue/UV); lower produces Red/IR.</text>
    <text x="25" y="322" class="sublabel">Requires Direct Bandgap (GaAs, InGaN).</text>
  </g>

  <!-- Panel 3: Schematic Symbol -->
  <g transform="translate(695, 55)">
    <rect width="240" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Schematic Symbol</text>

    <!-- Symbol Schematic -->
    <g transform="translate(50, 60)">
      <!-- Anode Lead -->
      <line x1="70" y1="10" x2="70" y2="40" class="wire"/>
      <text x="70" y="0" text-anchor="middle" class="code-txt" fill="#f43f5e">Anode (+)</text>

      <!-- Triangle & Bar -->
      <polygon points="45,40 95,40 70,75" fill="#f43f5e" stroke="#f43f5e" stroke-width="2"/>
      <line x1="45" y1="75" x2="95" y2="75" stroke="#f43f5e" stroke-width="3"/>

      <!-- Light Photons -->
      <line x1="88" y1="46" x2="115" y2="30" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-photon)"/>
      <line x1="95" y1="58" x2="122" y2="42" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-photon)"/>

      <!-- Cathode Lead -->
      <line x1="70" y1="75" x2="70" y2="110" class="wire"/>
      <text x="70" y="130" text-anchor="middle" class="code-txt" fill="#38bdf8">Cathode (-)</text>
    </g>

    <!-- Info Box -->
    <rect x="15" y="215" width="210" height="125" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="20" y="238" class="label" font-weight="bold">Polarity Summary</text>
    <text x="20" y="260" class="sublabel">• Longer pin = Anode (+)</text>
    <text x="20" y="280" class="sublabel">• Shorter pin = Cathode (-)</text>
    <text x="20" y="300" class="sublabel">• Flat notch = Cathode (-)</text>
    <text x="20" y="320" class="sublabel">• Larger anvil inside = Cathode</text>
  </g>
</svg>