<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .plate { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.5; }
      .dielectric { fill: #f59e0b; fill-opacity: 0.18; stroke: #d97706; stroke-dasharray: 3,3; stroke-width: 1.5; }
      .efield { stroke: #ec4899; stroke-width: 1.5; stroke-dasharray: 4,3; }
    </style>
    <marker id="efield-arr" viewBox="0 0 8 8" refX="5" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#ec4899" />
    </marker>
    <marker id="arr-cap" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Capacitor Fundamentals: Physics, Schematics &amp; Combinations</text>

  <!-- Panel 1: Physical Model -->
  <g transform="translate(25, 55)">
    <rect width="295" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Physical Structure &amp; Electric Field</text>

    <!-- Capacitor Plate Diagram -->
    <g transform="translate(45, 52)">
      <!-- Left plate (+Q) -->
      <rect x="25" y="10" width="16" height="120" rx="3" class="plate"/>
      <line x1="0" y1="70" x2="25" y2="70" class="wire-hi"/>
      <text x="12" y="60" class="code-txt" fill="#f43f5e">+Q</text>
      <text x="33" y="35" class="code-txt" style="font-size:10px; fill:#fff;">+</text>
      <text x="33" y="65" class="code-txt" style="font-size:10px; fill:#fff;">+</text>
      <text x="33" y="95" class="code-txt" style="font-size:10px; fill:#fff;">+</text>

      <!-- Dielectric layer -->
      <rect x="41" y="10" width="78" height="120" rx="2" class="dielectric"/>
      <text x="80" y="74" text-anchor="middle" class="sublabel" style="fill:#f59e0b; font-weight:600;">Dielectric (ε)</text>

      <!-- E-field lines -->
      <line x1="42" y1="35" x2="115" y2="35" class="efield" marker-end="url(#efield-arr)"/>
      <line x1="42" y1="70" x2="115" y2="70" class="efield" marker-end="url(#efield-arr)"/>
      <line x1="42" y1="105" x2="115" y2="105" class="efield" marker-end="url(#efield-arr)"/>

      <!-- Right plate (-Q) -->
      <rect x="119" y="10" width="16" height="120" rx="3" class="plate" fill="#64748b" stroke="#475569"/>
      <line x1="135" y1="70" x2="160" y2="70" class="wire"/>
      <text x="165" y="60" class="code-txt" fill="#38bdf8">-Q</text>
      <text x="127" y="35" class="code-txt" style="font-size:10px; fill:#fff;">-</text>
      <text x="127" y="65" class="code-txt" style="font-size:10px; fill:#fff;">-</text>
      <text x="127" y="95" class="code-txt" style="font-size:10px; fill:#fff;">-</text>

      <!-- Distance marker -->
      <line x1="41" y1="140" x2="119" y2="140" stroke="#94a3b8" stroke-width="1.2"/>
      <text x="80" y="153" text-anchor="middle" class="sublabel">Plate Spacing (d)</text>
    </g>

    <!-- Formula Box -->
    <rect x="15" y="225" width="265" height="115" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="248" class="code-txt">Q = C · V        [Coulombs = F·V]</text>
    <text x="25" y="272" class="code-txt">C = (ε₀ · εᵣ · A) / d</text>
    <text x="25" y="296" class="code-txt" style="fill:#fbbf24;">E_stored = ½ · C · V²  [Joules]</text>
    <text x="25" y="322" class="sublabel">Units: 1 Farad (F) is massive; practical: μF, nF, pF</text>
  </g>

  <!-- Panel 2: Schematic Symbols -->
  <g transform="translate(335, 55)">
    <rect width="280" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Standard Schematic Symbols</text>

    <!-- Non-Polarized -->
    <text x="20" y="60" class="label" font-weight="bold">Non-Polarized (Ceramic / Film)</text>
    <g transform="translate(40, 75)">
      <line x1="0" y1="20" x2="35" y2="20" class="wire"/>
      <line x1="35" y1="5" x2="35" y2="35" stroke="#38bdf8" stroke-width="3"/>
      <line x1="45" y1="5" x2="45" y2="35" stroke="#38bdf8" stroke-width="3"/>
      <line x1="45" y1="20" x2="80" y2="20" class="wire"/>
      <text x="95" y="24" class="code-txt">C (Bi-directional)</text>
    </g>

    <!-- Polarized / Electrolytic -->
    <text x="20" y="145" class="label" font-weight="bold">Polarized (Electrolytic / Tantalum)</text>
    <g transform="translate(40, 160)">
      <line x1="0" y1="20" x2="35" y2="20" class="wire"/>
      <line x1="35" y1="5" x2="35" y2="35" stroke="#38bdf8" stroke-width="3"/>
      <!-- Curved negative plate -->
      <path d="M 47,5 Q 43,20 47,35" stroke="#94a3b8" stroke-width="3" fill="none"/>
      <line x1="45" y1="20" x2="80" y2="20" class="wire"/>
      <text x="20" y="12" class="code-txt" fill="#f43f5e" style="font-size:14px;">+</text>
      <text x="95" y="24" class="code-txt">Anode (+) / Cathode (-)</text>
    </g>
    <text x="20" y="218" class="sublabel" style="fill:#f43f5e;">Caution: Reverse bias causes explosion/failure!</text>

    <!-- Variable Capacitor -->
    <text x="20" y="255" class="label" font-weight="bold">Variable / Trimmer Capacitor</text>
    <g transform="translate(40, 270)">
      <line x1="0" y1="20" x2="35" y2="20" class="wire"/>
      <line x1="35" y1="5" x2="35" y2="35" stroke="#38bdf8" stroke-width="3"/>
      <line x1="45" y1="5" x2="45" y2="35" stroke="#38bdf8" stroke-width="3"/>
      <line x1="45" y1="20" x2="80" y2="20" class="wire"/>
      <line x1="20" y1="36" x2="60" y2="4" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr-cap)"/>
      <text x="95" y="24" class="code-txt">Adjustable Tuning</text>
    </g>
  </g>

  <!-- Panel 3: Combining Capacitors -->
  <g transform="translate(630, 55)">
    <rect width="305" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Parallel vs Series Capacitance</text>

    <!-- Parallel Connection -->
    <text x="20" y="58" class="label" font-weight="bold">Parallel: Capacitances Add (+)</text>
    <g transform="translate(25, 70)">
      <circle cx="10" cy="35" r="3.5" fill="#38bdf8"/>
      <line x1="14" y1="35" x2="45" y2="35" class="wire"/>
      <line x1="45" y1="12" x2="45" y2="58" class="wire"/>
      
      <!-- Top Cap -->
      <line x1="45" y1="12" x2="70" y2="12" class="wire"/>
      <line x1="70" y1="2" x2="70" y2="22" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="77" y1="2" x2="77" y2="22" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="77" y1="12" x2="105" y2="12" class="wire"/>

      <!-- Bottom Cap -->
      <line x1="45" y1="58" x2="70" y2="58" class="wire"/>
      <line x1="70" y1="48" x2="70" y2="68" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="77" y1="48" x2="77" y2="68" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="77" y1="58" x2="105" y2="58" class="wire"/>

      <line x1="105" y1="12" x2="105" y2="58" class="wire"/>
      <line x1="105" y1="35" x2="140" y2="35" class="wire"/>
      <circle cx="140" cy="35" r="3.5" fill="#38bdf8"/>
      <text x="150" y="39" class="code-txt">C_total</text>
    </g>
    <rect x="20" y="152" width="265" height="42" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="172" class="code-txt">C_total = C1 + C2 + ... + Cn</text>
    <text x="30" y="186" class="sublabel">Area expands: total charge Q = Σ Q_k</text>

    <!-- Series Connection -->
    <text x="20" y="222" class="label" font-weight="bold">Series: Reciprocal Formula</text>
    <g transform="translate(25, 235)">
      <circle cx="10" cy="18" r="3.5" fill="#38bdf8"/>
      <line x1="14" y1="18" x2="40" y2="18" class="wire"/>
      <line x1="40" y1="8" x2="40" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="47" y1="8" x2="47" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="47" y1="18" x2="80" y2="18" class="wire"/>
      <line x1="80" y1="8" x2="80" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="87" y1="8" x2="87" y2="28" stroke="#38bdf8" stroke-width="2.5"/>
      <line x1="87" y1="18" x2="120" y2="18" class="wire"/>
      <circle cx="120" cy="18" r="3.5" fill="#38bdf8"/>
      <text x="130" y="22" class="code-txt">C_total &lt; min(Ci)</text>
    </g>
    <rect x="20" y="285" width="265" height="60" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="306" class="code-txt">1/C_total = 1/C1 + 1/C2 + ...</text>
    <text x="30" y="324" class="code-txt" style="font-size:11px; fill:#38bdf8;">Two: C_total = (C1 · C2) / (C1 + C2)</text>
    <text x="30" y="338" class="sublabel">Distance increases; higher total voltage rating.</text>
  </g>
</svg>