<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .n-channel { fill: #38bdf8; fill-opacity: 0.18; stroke: #38bdf8; stroke-width: 2; }
      .p-gate { fill: #f43f5e; fill-opacity: 0.25; stroke: #f43f5e; stroke-width: 1.5; }
      .dep-layer { fill: #fbbf24; fill-opacity: 0.22; stroke: #fbbf24; stroke-width: 1.2; stroke-dasharray: 2,2; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Junction Field-Effect Transistor (JFET): Structure &amp; Depletion Control</text>

  <!-- Panel 1: Physical N-Channel JFET Bar -->
  <g transform="translate(25, 55)">
    <rect width="320" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Physical Conduction Channel</text>

    <!-- Semiconductor Channel -->
    <g transform="translate(85, 45)">
      <!-- Drain contact & wire -->
      <line x1="75" y1="0" x2="75" y2="20" class="wire-hi"/>
      <rect x="55" y="16" width="40" height="8" fill="#64748b"/>
      <text x="105" y="14" class="code-txt" fill="#38bdf8">Drain (D)</text>

      <!-- Main N-Channel Bar -->
      <rect x="40" y="24" width="70" height="110" class="n-channel"/>
      <text x="75" y="44" text-anchor="middle" class="sublabel" style="fill:#38bdf8; font-weight:bold;">N Channel</text>

      <!-- Left P+ Gate & Depletion -->
      <rect x="20" y="55" width="20" height="45" class="p-gate"/>
      <rect x="40" y="55" width="18" height="45" class="dep-layer"/>
      <line x1="0" y1="77" x2="20" y2="77" class="wire"/>
      <text x="-5" y="70" class="code-txt" fill="#f43f5e">G</text>

      <!-- Right P+ Gate & Depletion -->
      <rect x="110" y="55" width="20" height="45" class="p-gate"/>
      <rect x="92" y="55" width="18" height="45" class="dep-layer"/>
      <line x1="130" y1="77" x2="150" y2="77" class="wire"/>

      <!-- Gate interconnect -->
      <path d="M 0,77 L -10,77 L -10,140 L 160,140 L 160,77 L 150,77" fill="none" stroke="#64748b" stroke-width="1.5"/>

      <!-- Constricted Conduction Path -->
      <path d="M 75,30 L 75,130" stroke="#34d399" stroke-width="2.5" stroke-dasharray="3,3"/>
      <text x="75" y="82" text-anchor="middle" class="sublabel" style="fill:#34d399; font-size:10px;">I_D</text>

      <!-- Source contact & wire -->
      <rect x="55" y="134" width="40" height="8" fill="#64748b"/>
      <line x1="75" y1="142" x2="75" y2="165" class="wire-hi"/>
      <text x="105" y="162" class="code-txt" fill="#38bdf8">Source (S)</text>
    </g>

    <!-- Summary Box -->
    <rect x="15" y="235" width="290" height="110" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="258" class="label" font-weight="bold">Voltage-Controlled Resistor</text>
    <text x="25" y="278" class="sublabel">Reverse gate voltage V_GS expands</text>
    <text x="25" y="294" class="sublabel">P-N depletion regions, constricting the</text>
    <text x="25" y="310" class="sublabel">electron path until pinched off completely.</text>
    <text x="25" y="330" class="sublabel" style="fill:#fbbf24;">Ultra-high input resistance &gt; 10¹⁰ Ω!</text>
  </g>

  <!-- Panel 2: Schematic Symbols: N-Channel vs P-Channel -->
  <g transform="translate(365, 55)">
    <rect width="280" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Schematic Symbols</text>

    <!-- N-Channel Symbol -->
    <g transform="translate(45, 50)">
      <circle cx="75" cy="50" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Channel bar -->
      <line x1="75" y1="28" x2="75" y2="72" stroke="#38bdf8" stroke-width="3"/>
      <!-- Drain -->
      <line x1="75" y1="34" x2="110" y2="20" stroke="#38bdf8" stroke-width="2"/>
      <line x1="110" y1="20" x2="135" y2="20" class="wire"/>
      <text x="140" y="24" class="code-txt" fill="#38bdf8">D</text>

      <!-- Source -->
      <line x1="75" y1="66" x2="110" y2="80" stroke="#38bdf8" stroke-width="2"/>
      <line x1="110" y1="80" x2="135" y2="80" class="wire"/>
      <text x="140" y="84" class="code-txt" fill="#38bdf8">S</text>

      <!-- Gate with Inward Arrow -->
      <line x1="15" y1="50" x2="75" y2="50" class="wire"/>
      <polygon points="50,44 65,50 50,56" fill="#38bdf8"/>
      <text x="5" y="54" class="code-txt" fill="#f43f5e">G</text>

      <text x="75" y="102" text-anchor="middle" class="code-txt" fill="#38bdf8">N-Channel JFET</text>
      <text x="75" y="116" text-anchor="middle" class="sublabel">Arrow points IN to channel</text>
    </g>

    <!-- P-Channel Symbol -->
    <g transform="translate(45, 190)">
      <circle cx="75" cy="50" r="32" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8"/>
      <line x1="75" y1="28" x2="75" y2="72" stroke="#f43f5e" stroke-width="3"/>
      <line x1="75" y1="34" x2="110" y2="20" stroke="#f43f5e" stroke-width="2"/>
      <line x1="110" y1="20" x2="135" y2="20" class="wire"/>
      <text x="140" y="24" class="code-txt" fill="#f43f5e">D</text>

      <line x1="75" y1="66" x2="110" y2="80" stroke="#f43f5e" stroke-width="2"/>
      <line x1="110" y1="80" x2="135" y2="80" class="wire"/>
      <text x="140" y="84" class="code-txt" fill="#f43f5e">S</text>

      <!-- Gate with Outward Arrow -->
      <line x1="15" y1="50" x2="75" y2="50" class="wire"/>
      <polygon points="58,44 43,50 58,56" fill="#f43f5e"/>
      <text x="5" y="54" class="code-txt" fill="#f43f5e">G</text>

      <text x="75" y="102" text-anchor="middle" class="code-txt" fill="#f43f5e">P-Channel JFET</text>
      <text x="75" y="116" text-anchor="middle" class="sublabel">Arrow points OUT of channel</text>
    </g>
  </g>

  <!-- Panel 3: Shockley's JFET Equation -->
  <g transform="translate(665, 55)">
    <rect width="270" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">Shockley's Equation</text>

    <rect x="15" y="50" width="240" height="285" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <g transform="translate(25, 75)">
      <text x="0" y="0" class="code-txt" fill="#fbbf24">Transfer Characteristic:</text>
      <text x="0" y="25" class="code-txt" style="font-size:13px; fill:#34d399;">I_D = I_DSS · (1 - V_GS/V_P)²</text>
      
      <line x1="0" y1="45" x2="220" y2="45" stroke="#1e293b"/>

      <text x="0" y="65" class="code-txt" fill="#38bdf8">Key Parameters:</text>
      <text x="0" y="87" class="code-txt">• I_DSS: Max drain current</text>
      <text x="12" y="103" class="sublabel">measured at V_GS = 0V</text>

      <text x="0" y="127" class="code-txt">• V_P (V_GS(off)): Pinch-off</text>
      <text x="12" y="143" class="sublabel">threshold voltage (e.g. -4V)</text>

      <line x1="0" y1="160" x2="220" y2="160" stroke="#1e293b"/>

      <text x="0" y="180" class="code-txt" fill="#f43f5e">Transconductance (g_m):</text>
      <text x="0" y="202" class="code-txt">g_m = (2·I_DSS / |V_P|) · (1 - V_GS/V_P)</text>
      <text x="0" y="222" class="sublabel">Defines AC voltage gain A_v ≈ -g_m·R_D</text>
    </g>
  </g>
</svg>