<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .res-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 2; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Essential MOSFET Circuit Topologies: Power Switch, CMOS Inverter &amp; Level Shifter</text>

  <!-- Panel 1: Power NMOS Low-Side Switch -->
  <g transform="translate(25, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">1. High-Current Power Switch</text>

    <!-- Schematic -->
    <g transform="translate(50, 48)">
      <!-- V_load rail -->
      <circle cx="100" cy="15" r="3.5" fill="#f43f5e"/>
      <text x="100" y="5" text-anchor="middle" class="sublabel" fill="#f43f5e">+24V Motor Rail</text>
      <line x1="100" y1="19" x2="100" y2="40" class="wire"/>

      <!-- Motor Load + Flyback Diode -->
      <rect x="80" y="40" width="40" height="30" rx="4" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <text x="100" y="60" text-anchor="middle" class="sublabel" fill="#fff" font-weight="bold">MOTOR</text>
      <line x1="100" y1="70" x2="100" y2="90" class="wire"/>

      <!-- NMOS Symbol -->
      <circle cx="90" cy="110" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="78" y1="96" x2="78" y2="124" stroke="#cbd5e1" stroke-width="2.5"/>
      <line x1="86" y1="96" x2="86" y2="124" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="3,3"/>
      <line x1="86" y1="98" x2="100" y2="90" class="wire"/>
      <line x1="86" y1="122" x2="100" y2="130" class="wire"/>

      <!-- Gate Drive & Pull-down Resistor -->
      <line x1="20" y1="110" x2="50" y2="110" class="wire"/>
      <rect x="50" y="103" width="20" height="14" class="res-box"/>
      <text x="60" y="114" text-anchor="middle" class="sublabel" style="font-size:9px;">100Ω</text>
      <line x1="70" y1="110" x2="78" y2="110" class="wire"/>
      <text x="10" y="114" class="code-txt" fill="#34d399">MCU</text>

      <!-- 10k pulldown to GND -->
      <line x1="45" y1="110" x2="45" y2="130" class="wire"/>
      <rect x="38" y="130" width="14" height="24" class="res-box"/>
      <text x="25" y="145" class="sublabel">10k</text>
      <line x1="45" y1="154" x2="45" y2="168" class="wire"/>

      <!-- Source to GND -->
      <line x1="100" y1="130" x2="100" y2="168" class="wire"/>
      <line x1="40" y1="168" x2="110" y2="168" class="wire"/>
    </g>

    <!-- Formula Box -->
    <rect x="15" y="240" width="255" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">P_loss = I_D² · R_DS(on)</text>
    <text x="25" y="284" class="label">Minimal Heat Dissipation</text>
    <text x="25" y="304" class="sublabel">At 10A and 5mΩ: P = only 0.5 Watts!</text>
    <text x="25" y="322" class="sublabel">10k pulldown prevents floating gate latchup.</text>
  </g>

  <!-- Panel 2: CMOS Inverter -->
  <g transform="translate(330, 55)">
    <rect width="285" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">2. CMOS Inverter (VLSI Building Block)</text>

    <!-- CMOS Schematic -->
    <g transform="translate(75, 48)">
      <!-- VDD rail -->
      <circle cx="70" cy="12" r="3.5" fill="#f43f5e"/>
      <text x="70" y="3" text-anchor="middle" class="sublabel" fill="#f43f5e">+V_DD (3.3V)</text>
      <line x1="70" y1="16" x2="70" y2="35" class="wire"/>

      <!-- PMOS Top Transistor -->
      <circle cx="70" cy="55" r="18" fill="#1e293b" stroke="#f43f5e" stroke-width="1.8"/>
      <circle cx="48" cy="55" r="2.5" fill="none" stroke="#f43f5e"/>
      <line x1="70" y1="35" x2="70" y2="42" class="wire"/>
      <line x1="70" y1="68" x2="70" y2="85" class="wire"/>
      <text x="100" y="58" class="sublabel" fill="#f43f5e">PMOS (Pull-Up)</text>

      <!-- Shared Output Node -->
      <circle cx="70" cy="85" r="3.5" fill="#38bdf8"/>
      <line x1="70" y1="85" x2="115" y2="85" class="wire-hi"/>
      <text x="120" y="89" class="code-txt" fill="#34d399">V_out</text>

      <!-- NMOS Bottom Transistor -->
      <line x1="70" y1="85" x2="70" y2="102" class="wire"/>
      <circle cx="70" cy="115" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <line x1="70" y1="128" x2="70" y2="155" class="wire"/>
      <text x="100" y="118" class="sublabel" fill="#38bdf8">NMOS (Pull-Down)</text>

      <!-- Common Input Gate -->
      <line x1="15" y1="85" x2="40" y2="85" class="wire"/>
      <circle cx="15" cy="85" r="3" fill="#fbbf24"/>
      <text x="8" y="75" class="code-txt" fill="#fbbf24">V_in</text>
      <line x1="40" y1="55" x2="45" y2="55" class="wire"/>
      <line x1="40" y1="115" x2="52" y2="115" class="wire"/>
      <line x1="40" y1="55" x2="40" y2="115" class="wire"/>

      <!-- GND -->
      <line x1="55" y1="155" x2="85" y2="155" class="wire"/>
    </g>

    <!-- Formula Box -->
    <rect x="15" y="240" width="255" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">Zero Static Power Dissipation</text>
    <text x="25" y="284" class="sublabel">Vin = HIGH → NMOS ON, PMOS OFF (Vout=0V)</text>
    <text x="25" y="302" class="sublabel">Vin = LOW  → PMOS ON, NMOS OFF (Vout=VDD)</text>
    <text x="25" y="322" class="sublabel">Power consumed ONLY during switching!</text>
  </g>

  <!-- Panel 3: Bidirectional I2C Level Shifter -->
  <g transform="translate(635, 55)">
    <rect width="300" height="360" class="card"/>
    <text x="20" y="30" class="sec-title">3. Bidirectional I2C Level Shifter</text>

    <!-- Level Shifter schematic -->
    <g transform="translate(30, 48)">
      <!-- 3.3V rail & pullup -->
      <text x="20" y="15" class="sublabel" fill="#38bdf8">3.3V Side</text>
      <rect x="25" y="30" width="14" height="25" class="res-box"/>
      <text x="10" y="45" class="sublabel">10k</text>

      <!-- 5V rail & pullup -->
      <text x="180" y="15" class="sublabel" fill="#f43f5e">5V Side</text>
      <rect x="185" y="30" width="14" height="25" class="res-box"/>
      <text x="205" y="45" class="sublabel">10k</text>

      <!-- Discrete NMOS (BSS138) in center -->
      <circle cx="115" cy="85" r="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
      <!-- Gate tied to 3.3V -->
      <line x1="115" y1="65" x2="115" y2="25" class="wire-hi"/>
      <text x="120" y="22" class="code-txt" fill="#38bdf8">+3.3V</text>

      <!-- Source on 3.3V bus -->
      <line x1="32" y1="85" x2="100" y2="85" class="wire-hi"/>
      <text x="0" y="89" class="code-txt" fill="#38bdf8">SDA_3V</text>

      <!-- Drain on 5V bus -->
      <line x1="130" y1="85" x2="192" y2="85" class="wire-hi"/>
      <text x="200" y="89" class="code-txt" fill="#f43f5e">SDA_5V</text>

      <line x1="32" y1="55" x2="32" y2="85" class="wire"/>
      <line x1="192" y1="55" x2="192" y2="85" class="wire"/>
    </g>

    <!-- Info Box -->
    <rect x="15" y="240" width="270" height="105" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="262" class="code-txt">Safe 3.3V &lt;--&gt; 5V Bus Interfacing</text>
    <text x="25" y="284" class="sublabel">Uses body diode &amp; channel conduction to</text>
    <text x="25" y="302" class="sublabel">allow either side to pull bus LOW safely</text>
    <text x="25" y="320" class="sublabel">without overvolting low-voltage 3.3V ICs.</text>
  </g>
</svg>