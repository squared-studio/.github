<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="simCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="formalCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8" text-anchor="middle">Dynamic Simulation vs. Mathematical Formal Verification</text>
  <text x="450" y="62" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Empirical Incomplete Sampling vs. Exhaustive Mathematical State-Space Proof</text>

  <!-- Left: Dynamic Simulation Panel -->
  <g transform="translate(30, 85)">
    <rect width="405" height="385" rx="12" fill="url(#simCard)" stroke="#4338ca" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="405" height="42" rx="12" fill="#312e81"/>
    <text x="202" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#a5b4fc" text-anchor="middle">Dynamic Simulation (Directed / UVM)</text>

    <!-- State Space Box -->
    <rect x="25" y="60" width="355" height="150" rx="8" fill="#131d33" stroke="#3730a3" stroke-width="1"/>
    <text x="40" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">Design State Space (2^N Combinations)</text>
    
    <!-- Sampled paths -->
    <path d="M 50 140 Q 120 95, 180 150 T 320 110" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="50" cy="140" r="4" fill="#38bdf8"/>
    <circle cx="320" cy="110" r="4" fill="#38bdf8"/>
    <text x="330" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Test #1</text>

    <path d="M 50 170 Q 140 190, 220 140 T 300 175" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="4 2"/>
    <circle cx="50" cy="170" r="4" fill="#a78bfa"/>
    <circle cx="300" cy="175" r="4" fill="#a78bfa"/>
    <text x="310" y="179" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a78bfa">Test #2</text>

    <!-- Bug Hidden in Corner -->
    <circle cx="270" cy="90" r="14" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="270" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">BUG</text>
    <text x="200" y="196" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#94a3b8">Corner cases remain unreached by stimulus</text>

    <!-- Simulation Attributes -->
    <g transform="translate(25, 225)">
      <rect width="355" height="135" rx="6" fill="#0c1222" stroke="#1e293b"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f43f5e">Method: Stimulus Generation + Checker</text>
      <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Exercises isolated execution traces</text>
      <text x="15" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Coverage is metric-driven (not 100% complete)</text>
      <text x="15" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Cannot prove the complete absence of bugs</text>
      <text x="15" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f87171">• Bug latency: Weeks/Months into verification</text>
    </g>
  </g>

  <!-- Right: Formal Verification Panel -->
  <g transform="translate(465, 85)">
    <rect width="405" height="385" rx="12" fill="url(#formalCard)" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="405" height="42" rx="12" fill="#065f46"/>
    <text x="202" y="27" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#6ee7b7" text-anchor="middle">Formal Verification (Model Checking / SVA)</text>

    <!-- State Space Box -->
    <rect x="25" y="60" width="355" height="150" rx="8" fill="#131d33" stroke="#047857" stroke-width="1"/>
    <rect x="35" y="75" width="335" height="120" rx="6" fill="#047857" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2 2"/>
    <text x="45" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">Exhaustive Mathematical Exploration</text>

    <text x="45" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Explores ALL reachable states concurrently</text>
    <text x="45" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">under specified environment assumptions (SVA)</text>

    <!-- Proof or Counterexample -->
    <rect x="45" y="160" width="155" height="26" rx="4" fill="#065f46"/>
    <text x="122" y="177" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">PROVEN: Math Guarantee</text>

    <rect x="210" y="160" width="150" height="26" rx="4" fill="#7f1d1d"/>
    <text x="285" y="177" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">FAIL: Counterexample Trace</text>

    <!-- Formal Attributes -->
    <g transform="translate(25, 225)">
      <rect width="355" height="135" rx="6" fill="#0c1222" stroke="#1e293b"/>
      <text x="15" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#10b981">Method: SAT/SMT Solver + Temporal Logic</text>
      <text x="15" y="48" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Zero testbenches or stimulus vectors required</text>
      <text x="15" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• 100% state coverage within bounded depth / proof</text>
      <text x="15" y="92" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#cbd5e1">• Discovers complex multi-cycle corner cases instantly</text>
      <text x="15" y="114" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">• Bug latency: Hours at block/subsystem level</text>
    </g>
  </g>
</svg>
