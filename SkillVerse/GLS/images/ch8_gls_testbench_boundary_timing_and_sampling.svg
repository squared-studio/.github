<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="920" height="380">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .grid { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.3px; fill: #94a3b8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="380" />
  <text class="title" x="460" y="28">Testbench Input Skewing &amp; Output Sampling Under Gate-Level SDF Timing</text>
  <text class="subtitle" x="460" y="48">Preventing Spurious Boundary Hold Violations and Mid-Cycle Glitch Sampling When Connecting UVM Agents to Gate Netlists</text>

  <!-- Waveform Panel -->
  <rect class="panel" x="20" y="64" width="880" height="178" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="88" fill="#38bdf8">DUT Primary I/O Timing Diagram (Why #0 Driver Changes Break Hold)</text>

  <line class="grid" x1="200" y1="98" x2="200" y2="232" />
  <line class="grid" x1="310" y1="98" x2="310" y2="232" />
  <line class="grid" x1="650" y1="98" x2="650" y2="232" />

  <text class="mono" x="36" y="122" fill="#38bdf8">pad_clk</text>
  <path d="M130,126 L200,126 L200,104 L420,104 L420,126 L650,126 L650,104 L860,104" fill="none" stroke="#38bdf8" stroke-width="2" />

  <text class="mono" x="36" y="152" fill="#94a3b8">leaf_clk (+1.2ns)</text>
  <path d="M130,156 L310,156 L310,134 L530,134 L530,156 L760,156 L760,134 L860,134" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,3" />

  <text class="mono" x="36" y="184" fill="#f87171">TB Drive (#0 BAD)</text>
  <path d="M130,188 L200,188 L210,168 L650,168" fill="none" stroke="#f87171" stroke-width="2" />
  <text class="note" x="425" y="182" fill="#fca5a5">Switches 1.2ns BEFORE leaf_clk arrives -&gt; Holds FAIL / Setup VIOL!</text>

  <text class="mono" x="36" y="216" fill="#34d399">TB Skew (#2ns OK)</text>
  <path d="M130,220 L380,220 L390,200 L820,200" fill="none" stroke="#34d399" stroke-width="2" />
  <text class="note" x="405" y="214" fill="#6ee7b7">Matches SDC set_input_delay -&gt; Clean setup before Edge 2 (760ns)!</text>

  <!-- Bottom Two Cards -->
  <rect class="panel" x="20" y="254" width="430" height="112" stroke="#34d399" />
  <text class="ptitle" x="36" y="278" fill="#34d399">1. Use Clocking Block `output #t_skew`</text>
  <rect class="box" x="36" y="290" width="398" height="64" />
  <text class="mono" x="48" y="309" fill="#6ee7b7">clocking drv_cb @(posedge clk);</text>
  <text class="mono" x="48" y="326">  default input #1step output #2ns;</text>
  <text class="mono" x="48" y="343">endclocking // Matches physical PCB + CTS offset!</text>

  <rect class="panel" x="470" y="254" width="430" height="112" stroke="#f59e0b" />
  <text class="ptitle" x="486" y="278" fill="#f59e0b">2. Fix Output Sampling (`input #1step`)</text>
  <text class="note" x="486" y="298">With SDF `CK-&gt;Q` + output wire delay, `dut_out` updates several</text>
  <text class="note" x="486" y="314">nanoseconds AFTER `pad_clk` (and combinational pads glitch mid-cycle).</text>
  <text class="note" x="486" y="334" fill="#fcd34d">Always sample DUT outputs via `default input #1step` (Preponed</text>
  <text class="note" x="486" y="350" fill="#fcd34d">region just before next `posedge clk`)—never mid-cycle combinational!</text>
</svg>
