<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.3px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">SPEF Extraction to STA SDF Generation &amp; Back-Annotation Pipeline</text>
  <text class="subtitle" x="460" y="48">Generating Sign-Off Max/Min Standard Delay Format Files in PrimeTime/Tempus and Loading via $sdf_annotate</text>

  <!-- Left: Inputs -->
  <rect class="panel" x="20" y="64" width="218" height="308" stroke="#38bdf8" />
  <text class="ptitle" x="34" y="88" fill="#38bdf8">1. P&amp;R Physical Data</text>

  <rect class="box" x="34" y="104" width="190" height="76" />
  <text class="badge" x="129" y="124" fill="#7dd3fc">Post-P&amp;R Netlist</text>
  <text class="note" x="44" y="142">Routed Verilog (.v)</text>
  <text class="note" x="44" y="158">Contains CTS buffers,</text>
  <text class="note" x="44" y="172">tie/ISO/ELS cells</text>

  <rect class="box" x="34" y="190" width="190" height="80" stroke="#f59e0b" />
  <text class="badge" x="129" y="210" fill="#fcd34d">SPEF Parasitics</text>
  <text class="note" x="44" y="228">StarRC / Quantus RC</text>
  <text class="note" x="44" y="244">Coupling caps + metal</text>
  <text class="note" x="44" y="260">resistance per net</text>

  <rect class="box" x="34" y="280" width="190" height="78" stroke="#a78bfa" />
  <text class="badge" x="129" y="300" fill="#c4b5fd">Liberty (.db / .lib)</text>
  <text class="note" x="44" y="318">SS Slow &amp; FF Fast</text>
  <text class="note" x="44" y="334">NLDM / CCS timing +</text>
  <text class="note" x="44" y="348">crosstalk noise</text>

  <line x1="238" y1="215" x2="266" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSky)" />

  <!-- Center: STA SDF Engine -->
  <rect class="panel" x="270" y="64" width="320" height="308" stroke="#a78bfa" />
  <text class="ptitle" x="286" y="88" fill="#a78bfa">2. Sign-Off STA (write_sdf)</text>

  <rect class="box" x="286" y="104" width="288" height="106" stroke="#f87171" />
  <text class="badge" x="430" y="124" fill="#fca5a5">Corner 1: Slow-Slow (MAX SDF)</text>
  <text class="note" x="296" y="144">SS process, Vmin, Worst Temp (wc / wcl)</text>
  <text class="mono" x="296" y="164">write_sdf -context verilog \</text>
  <text class="mono" x="296" y="180">  -include {SETUPHOLD RECREM} max.sdf</text>
  <text class="note" x="296" y="199" fill="#fcd34d">Validates Setup, Recovery &amp; Max Freq!</text>

  <rect class="box" x="286" y="224" width="288" height="134" stroke="#34d399" />
  <text class="badge" x="430" y="244" fill="#6ee7b7">Corner 2: Fast-Fast (MIN SDF)</text>
  <text class="note" x="296" y="264">FF process, Vmax, Best/Cold Temp (bc)</text>
  <text class="mono" x="296" y="284">write_sdf -context verilog \</text>
  <text class="mono" x="296" y="300">  -version 3.0 min.sdf</text>
  <text class="note" x="296" y="320" fill="#7dd3fc">Validates Hold, Removal, &amp; Pulse Glitches!</text>
  <text class="note" x="296" y="340" fill="#fca5a5">Note: Separate SDF runs per corner!</text>

  <line x1="590" y1="215" x2="618" y2="215" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" />

  <!-- Right: GLS Simulator Annotation -->
  <rect class="panel" x="622" y="64" width="278" height="308" stroke="#34d399" />
  <text class="ptitle" x="636" y="88" fill="#34d399">3. GLS Back-Annotation</text>

  <rect class="box" x="636" y="104" width="250" height="132" />
  <text class="mono" x="646" y="123" fill="#6ee7b7">initial begin</text>
  <text class="mono" x="646" y="140">  $sdf_annotate(</text>
  <text class="mono" x="646" y="156">    "soc_max.sdf",</text>
  <text class="mono" x="646" y="172">    tb.dut, ,</text>
  <text class="mono" x="646" y="188">    "sdf.log",</text>
  <text class="mono" x="646" y="204">    "MAXIMUM");</text>
  <text class="mono" x="646" y="220">end</text>

  <rect class="box" x="636" y="248" width="250" height="110" stroke="#f59e0b" />
  <text class="badge" x="761" y="268" fill="#fcd34d">Audit `sdf.log` Errors!</text>
  <text class="note" x="646" y="288">Check 0 FAILED annotations</text>
  <text class="note" x="646" y="304">(instance hierarchy mismatch</text>
  <text class="note" x="646" y="320">means gates fall back silently</text>
  <text class="note" x="646" y="336">to wrong default lib delays!)</text>
</svg>
