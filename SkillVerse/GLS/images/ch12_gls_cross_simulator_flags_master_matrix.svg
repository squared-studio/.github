<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .hdr { fill: #172554; stroke: #38bdf8; stroke-width: 1; }
      .row { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .colh { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.2px; font-weight: 700; fill: #7dd3fc; }
      .cat { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #fcd34d; }
      .vcs { font-family: Consolas, 'Courier New', monospace; font-size: 10.2px; fill: #6ee7b7; }
      .xcl { font-family: Consolas, 'Courier New', monospace; font-size: 10.2px; fill: #c4b5fd; }
      .qst { font-family: Consolas, 'Courier New', monospace; font-size: 10.2px; fill: #7dd3fc; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="440" />
  <text class="title" x="480" y="28">Cross-Simulator GLS Command-Line Flag Reference (VCS / Xcelium / Questa)</text>
  <text class="subtitle" x="480" y="48">Side-by-Side Invocation Options for Delay Modes, Negative Timing Checks, Pulse Control, Init, and Tfile Masking</text>

  <rect class="panel" x="20" y="64" width="920" height="356" stroke="#38bdf8" />

  <rect class="hdr" x="34" y="78" width="892" height="32" rx="4" />
  <text class="colh" x="46" y="99">GLS Capability</text>
  <text class="colh" x="220" y="99">Synopsys VCS</text>
  <text class="colh" x="468" y="99">Cadence Xcelium (xrun)</text>
  <text class="colh" x="716" y="99">Siemens Questa (vopt/vsim)</text>

  <rect class="row" x="34" y="114" width="892" height="38" />
  <text class="cat" x="46" y="137">Zero Delay Mode</text>
  <text class="vcs" x="220" y="137">+delay_mode_zero</text>
  <text class="xcl" x="468" y="137">-delay_mode zero</text>
  <text class="qst" x="716" y="137">+delay_mode_zero</text>

  <rect class="row" x="34" y="154" width="892" height="38" />
  <text class="cat" x="46" y="177">CTS Delta Race Fix</text>
  <text class="vcs" x="220" y="177">+race=all / +nba / #1 DFF</text>
  <text class="xcl" x="468" y="177">-seq_udp_delay 1ps</text>
  <text class="qst" x="716" y="177">+delay_mode_unit / -hazards</text>

  <rect class="row" x="34" y="194" width="892" height="38" />
  <text class="cat" x="46" y="217">Negative Hold/Setup</text>
  <text class="vcs" x="220" y="217">+neg_tchk</text>
  <text class="xcl" x="468" y="217">-neg_tchk (or -ntc_verbose)</text>
  <text class="qst" x="716" y="217">+neg_tchk (or -vopt)</text>

  <rect class="row" x="34" y="234" width="892" height="38" />
  <text class="cat" x="46" y="257">SDF Corner Select</text>
  <text class="vcs" x="220" y="257">+maxdelays / +mindelays</text>
  <text class="xcl" x="468" y="257">-maxdelays / -mindelays</text>
  <text class="qst" x="716" y="257">+maxdelays / +mindelays</text>

  <rect class="row" x="34" y="274" width="892" height="38" />
  <text class="cat" x="46" y="297">Pulse Reject / Error</text>
  <text class="vcs" x="220" y="297">+pulse_r/30 +pulse_e/70</text>
  <text class="xcl" x="468" y="297">-pulse_r 30 -pulse_e 70</text>
  <text class="qst" x="716" y="297">+pulse_r/30 +pulse_e/70</text>

  <rect class="row" x="34" y="314" width="892" height="38" />
  <text class="cat" x="46" y="337">Selective Notifier Off</text>
  <text class="vcs" x="220" y="337">+optconfigfile+cdc.tfile</text>
  <text class="xcl" x="468" y="337">-tfile cdc.tfile</text>
  <text class="qst" x="716" y="337">-sdfnoerror + tcheck disable</text>

  <rect class="row" x="34" y="354" width="892" height="38" />
  <text class="cat" x="46" y="377">Flop Initialization</text>
  <text class="vcs" x="220" y="377">+vcs+initreg+config+file</text>
  <text class="xcl" x="468" y="377">-xprop / -initmem0 / tcl</text>
  <text class="qst" x="716" y="377">force / initreg script</text>

  <text class="cat" x="46" y="408" fill="#fca5a5">Important: Never pass +notimingchecks or +no_notifier globally on full-timing SDF regressions—always isolate CDC syncs via tfile!</text>
</svg>
