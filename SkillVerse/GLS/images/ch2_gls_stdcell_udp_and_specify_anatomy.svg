<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.3px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">Standard Cell Flip-Flop Verilog Wrapper, UDP Primitive &amp; specify Block</text>
  <text class="subtitle" x="460" y="48">Inside a Foundry Library Cell: celldefine, Delayed Wires, Negative Timing Checks, Notifier Reg, and UDP Truth Table</text>

  <!-- Left Panel: Internal DFF Architecture -->
  <rect class="panel" x="20" y="64" width="465" height="316" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="88" fill="#38bdf8">`celldefine` DFFQ_X1 Structural Model</text>

  <text class="mono" x="36" y="138" fill="#7dd3fc">D  --&gt;</text>
  <text class="mono" x="36" y="170" fill="#7dd3fc">CK --&gt;</text>

  <!-- Specify Input Delays Box -->
  <rect class="box" x="86" y="114" width="108" height="78" stroke="#a78bfa" />
  <text class="badge" x="140" y="134" fill="#c4b5fd">Specify Delay</text>
  <text class="mono" x="140" y="154" text-anchor="middle">D_d, CK_d</text>
  <text class="note" x="140" y="172" text-anchor="middle">(for -tchk!)</text>

  <line x1="194" y1="138" x2="238" y2="138" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrSky)" />
  <line x1="194" y1="168" x2="238" y2="168" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrSky)" />

  <!-- UDP Core -->
  <rect class="box" x="242" y="114" width="136" height="96" stroke="#34d399" />
  <text class="badge" x="310" y="134" fill="#6ee7b7">UDP_DFF Primitive</text>
  <text class="note" x="310" y="152" text-anchor="middle">Inputs:</text>
  <text class="mono" x="310" y="170" text-anchor="middle">CK_d, D_d, CDN,</text>
  <text class="mono" x="310" y="186" text-anchor="middle" fill="#f87171">notifier_reg</text>

  <line x1="378" y1="160" x2="412" y2="160" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrSky)" />
  <rect class="box" x="416" y="132" width="54" height="56" stroke="#38bdf8" />
  <text class="badge" x="443" y="155" fill="#7dd3fc">buf</text>
  <text class="mono" x="443" y="173" text-anchor="middle">Q</text>

  <!-- Notifier Loop Bottom -->
  <rect class="box" x="86" y="226" width="384" height="140" stroke="#f59e0b" />
  <text class="mono" x="98" y="246" fill="#fcd34d">specify Block Checks &amp; IOPATH Arcs:</text>
  <text class="mono" x="98" y="266">(posedge CK =&gt; (Q +: D)) = (0.08, 0.09);</text>
  <text class="mono" x="98" y="284">$setuphold(posedge CK, posedge D,</text>
  <text class="mono" x="98" y="301">           t_su, t_h, notifier,,, CK_d, D_d);</text>
  <text class="mono" x="98" y="320">$recrem(posedge CDN, posedge CK,</text>
  <text class="mono" x="98" y="337">        t_rec, t_rem, notifier,,, CDN_d, CK_d);</text>
  <text class="note" x="98" y="356" fill="#fca5a5">On violation: system task toggles `notifier` (0&lt;-&gt;1) -&gt; UDP forces Q='X'!</text>

  <!-- Right Panel: UDP & Negative Delayed Wires -->
  <rect class="panel" x="502" y="64" width="398" height="316" stroke="#a78bfa" />
  <text class="ptitle" x="518" y="88" fill="#a78bfa">Sequential UDP Table &amp; Delayed Wires</text>

  <rect class="box" x="518" y="102" width="366" height="144" />
  <text class="mono" x="530" y="122" fill="#c4b5fd">primitive udp_dff (Q, CK, D, CDN, NOTIFIER);</text>
  <text class="mono" x="530" y="140">  table</text>
  <text class="mono" x="530" y="157" fill="#6ee7b7">  // CK  D   CDN NOTIF : Q_cur : Q_next</text>
  <text class="mono" x="530" y="174">     r   0    1    ?   :   ?   :   0;</text>
  <text class="mono" x="530" y="191">     r   1    1    ?   :   ?   :   1;</text>
  <text class="mono" x="530" y="208">     ?   ?    0    ?   :   ?   :   0; // Async clr</text>
  <text class="mono" x="530" y="226" fill="#f87171">     ?   ?    ?    *   :   ?   :   x; // VIOL!</text>
  <text class="mono" x="530" y="240">  endtable endprimitive</text>

  <rect class="box" x="518" y="256" width="366" height="110" stroke="#34d399" />
  <text class="mono" x="530" y="275" fill="#6ee7b7">Why `CK_d` &amp; `D_d` Exist (+neg_tchk):</text>
  <text class="note" x="530" y="294">Foundry hold times can be negative (e.g. hold = -15ps) due to</text>
  <text class="note" x="530" y="310">internal cell buffer skew! Simulators shift `D_d`/`CK_d` internally</text>
  <text class="note" x="530" y="326">only when `+neg_tchk` is passed—otherwise negative limits clamp</text>
  <text class="note" x="530" y="342" fill="#fca5a5">to 0 and corrupt simulation timing accuracy!</text>
</svg>
