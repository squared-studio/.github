<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.3px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">Netlist Evolution Pipeline &amp; GLS Verification Modes</text>
  <text class="subtitle" x="460" y="48">Progressing From Early Zero-Delay Synthesis Sanity Through Full-Timing Multi-Corner Post-P&amp;R Sign-Off</text>

  <!-- Pipeline Row -->
  <rect class="panel" x="20" y="64" width="880" height="156" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="88" fill="#38bdf8">ASIC Tape-Out Progression Across GLS Milestones</text>

  <rect class="box" x="36" y="102" width="180" height="98" stroke="#64748b" />
  <text class="badge" x="126" y="122" fill="#cbd5e1">1. RTL Baseline</text>
  <text class="note" x="46" y="142">Pure SystemVerilog</text>
  <text class="note" x="46" y="158">UVM scoreboards &amp;</text>
  <text class="note" x="46" y="174">golden behavioral checks</text>

  <line x1="216" y1="151" x2="246" y2="151" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSky)" />

  <rect class="box" x="250" y="102" width="194" height="98" stroke="#f59e0b" />
  <text class="badge" x="347" y="122" fill="#fcd34d">2. Pre-Layout Synth</text>
  <text class="note" x="260" y="142">Logical netlist (no CTS)</text>
  <text class="mono" x="260" y="160" fill="#fcd34d">Mode: Zero / Unit Delay</text>
  <text class="note" x="260" y="178">Catches reset, X-prop &amp;</text>
  <text class="note" x="260" y="192">init bugs early!</text>

  <line x1="444" y1="151" x2="474" y2="151" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSky)" />

  <rect class="box" x="478" y="102" width="194" height="98" stroke="#a78bfa" />
  <text class="badge" x="575" y="122" fill="#c4b5fd">3. Post-P&amp;R (SPEF+STA)</text>
  <text class="note" x="488" y="142">Routed CTS + PG + DFT</text>
  <text class="mono" x="488" y="160" fill="#c4b5fd">Emits SS MAX &amp; FF MIN SDF</text>
  <text class="note" x="488" y="178">Real wire RC parasitics</text>
  <text class="note" x="488" y="192">+ clock tree skew!</text>

  <line x1="672" y1="151" x2="702" y2="151" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" />

  <rect class="box" x="706" y="102" width="178" height="98" stroke="#34d399" />
  <text class="badge" x="795" y="122" fill="#6ee7b7">4. Timing GLS</text>
  <text class="mono" x="716" y="142" fill="#34d399">SDF +neg_tchk</text>
  <text class="note" x="716" y="160">SS-Max (Setup/Recov)</text>
  <text class="note" x="716" y="176">FF-Min (Hold/Remov)</text>
  <text class="note" x="716" y="192">UPF'' PG + ATPG vectors</text>

  <!-- Bottom Two Mode Cards -->
  <rect class="panel" x="20" y="234" width="430" height="140" stroke="#f59e0b" />
  <text class="ptitle" x="36" y="258" fill="#f59e0b">Zero-Delay vs. Unit-Delay GLS</text>
  <text class="note" x="36" y="278">- Zero-Delay (+delay_mode_zero): Fastest gate sim; wipes out specify</text>
  <text class="note" x="36" y="294">  IOPATHs &amp; disables $setuphold. Vulnerable to clock delta-cycle races!</text>
  <text class="note" x="36" y="314" fill="#6ee7b7">- Unit-Delay / #1 Flop Delay: Gives 1ps-1ns per cell/FF to break CTS</text>
  <text class="note" x="36" y="330" fill="#6ee7b7">  delta skew while validating reset X-propagation &amp; functional logic.</text>
  <text class="note" x="36" y="354" fill="#fcd34d">Rule: Never declare tape-out sign-off cleanly on Zero-Delay GLS alone!</text>

  <rect class="panel" x="470" y="234" width="430" height="140" stroke="#34d399" />
  <text class="ptitle" x="486" y="258" fill="#34d399">Full-Timing SDF Corners (Max &amp; Min)</text>
  <text class="note" x="486" y="278">- MAX SDF (Slow-Slow, Low Vdd, High/Low Temp): Stress-tests critical</text>
  <text class="note" x="486" y="294">  paths against setup ($setuphold) &amp; broken false-path exceptions.</text>
  <text class="note" x="486" y="314" fill="#7dd3fc">- MIN SDF (Fast-Fast, High Vdd, Cold/Hot): Stress-tests short paths</text>
  <text class="note" x="486" y="330" fill="#7dd3fc">  for hold violations, scan-shift races, and narrow glitch propagation.</text>
  <text class="note" x="486" y="354" fill="#fca5a5">Must enable +neg_tchk when SDF contains negative hold/setup limits!</text>
</svg>
