<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh2B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh2B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrCyan2B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrEmerald2B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="14" fill="url(#bgGradCh2B)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">The module Construct: Top-Level Testbench vs. Hardware DUT</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Encapsulation hierarchy, internal testbench wiring, and identifier naming rules</text>

  <!-- Left Card: Hierarchical Encapsulation -->
  <g transform="translate(24, 78)">
    <rect width="466" height="318" rx="10" fill="#0c1524" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#shadowCh2B)"/>
    <rect width="466" height="38" rx="10" fill="#075985"/>
    <rect x="0" y="26" width="466" height="12" fill="#075985"/>
    <text x="18" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#e0f2fe">module testbench; // Portless Top-Level</text>

    <!-- Internal signals label -->
    <rect x="20" y="52" width="426" height="34" rx="6" fill="#131d33" stroke="#1e3a5f"/>
    <text x="34" y="73" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#7dd3fc">logic clk, rst_n, req;   logic [7:0] data_out;</text>

    <!-- Stimulus initial block -->
    <g transform="translate(20, 102)">
      <rect width="128" height="150" rx="8" fill="#171b2e" stroke="#a855f7" stroke-width="1.5"/>
      <text x="64" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#c084fc" text-anchor="middle">initial / always</text>
      <text x="64" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Stimulus Driver</text>
      <text x="64" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Drives internal</text>
      <text x="64" y="90" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">signals into</text>
      <text x="64" y="106" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">DUT input ports</text>
      <text x="64" y="134" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#d8b4fe" text-anchor="middle">clk, rst_n, req</text>
    </g>

    <!-- Arrows Stimulus -> DUT -->
    <line x1="148" y1="140" x2="176" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan2B)"/>
    <line x1="148" y1="176" x2="176" y2="176" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan2B)"/>
    <line x1="148" y1="212" x2="176" y2="212" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan2B)"/>

    <!-- DUT Instance -->
    <g transform="translate(182, 102)">
      <rect width="122" height="150" rx="8" fill="#231222" stroke="#f43f5e" stroke-width="1.8"/>
      <text x="61" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af" text-anchor="middle">dut u_dut (...)</text>
      <text x="61" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#ffe4e6" text-anchor="middle">Hardware Module</text>
      <text x="10" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#7dd3fc">clk →</text>
      <text x="10" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#7dd3fc">rst →</text>
      <text x="10" y="140" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#7dd3fc">req →</text>
      <text x="112" y="96" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#6ee7b7" text-anchor="end">→ ack</text>
      <text x="112" y="130" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#6ee7b7" text-anchor="end">→ data</text>
    </g>

    <!-- Arrows DUT -> Monitor -->
    <line x1="304" y1="160" x2="332" y2="160" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald2B)"/>
    <line x1="304" y1="205" x2="332" y2="205" stroke="#34d399" stroke-width="2" marker-end="url(#arrEmerald2B)"/>

    <!-- Observer / Log -->
    <g transform="translate(338, 102)">
      <rect width="108" height="150" rx="8" fill="#072c22" stroke="#34d399" stroke-width="1.5"/>
      <text x="54" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">$display / check</text>
      <text x="54" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#d1fae5" text-anchor="middle">Observer</text>
      <text x="54" y="78" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Monitors DUT</text>
      <text x="54" y="94" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">outputs &amp; ends</text>
      <text x="54" y="110" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">with $finish;</text>
    </g>

    <!-- Bottom Note -->
    <text x="233" y="282" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">No external ports needed: top-level testbench owns all stimulus and clocks</text>
    <text x="18" y="304" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">endmodule</text>
  </g>

  <!-- Right Card: Identifier Naming Rules -->
  <g transform="translate(510, 78)">
    <rect width="386" height="318" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh2B)"/>
    <rect width="386" height="38" rx="10" fill="#78350f"/>
    <rect x="0" y="26" width="386" height="12" fill="#78350f"/>
    <text x="193" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#fef3c7" text-anchor="middle">Identifier &amp; Module Naming Rules</text>

    <!-- Rules list -->
    <g transform="translate(16, 52)">
      <rect width="354" height="84" rx="8" fill="#131d33" stroke="#1e293b"/>
      <text x="12" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Core Syntax Rules</text>
      <text x="12" y="42" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">1. First char: letter [a-zA-Z] or underscore (_)</text>
      <text x="12" y="59" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">2. Body chars: [a-zA-Z0-9_$] (avoid $ in names)</text>
      <text x="12" y="76" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">3. Case-sensitive; cannot match a reserved keyword</text>
    </g>

    <!-- Valid Examples -->
    <g transform="translate(16, 148)">
      <rect width="354" height="72" rx="8" fill="#072c22" stroke="#34d399" stroke-width="1.2"/>
      <text x="12" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Valid Identifiers</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">my_testbench    top_tb    _clock_gen</text>
      <text x="12" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">ProcessorTB     begin_test (not a keyword)</text>
    </g>

    <!-- Invalid Examples -->
    <g transform="translate(16, 232)">
      <rect width="354" height="72" rx="8" fill="#2c0b16" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="12" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fb7185">Invalid Identifiers (Compile Error)</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">1st_test     <tspan font-family="'Inter', system-ui, sans-serif" fill="#cbd5e1">(starts with digit)</tspan></text>
      <text x="12" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fecdd3">$my_mod      <tspan font-family="'Inter', system-ui, sans-serif" fill="#cbd5e1">(starts with $)  |  </tspan>module <tspan font-family="'Inter', system-ui, sans-serif" fill="#cbd5e1">(keyword)</tspan></text>
    </g>
  </g>
</svg>
