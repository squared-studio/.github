<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh4B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh4B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrCyan4B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrRose4B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrAmber4B" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="14" fill="url(#bgGradCh4B)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Single-Driver Variables vs. Multi-Driver Net Resolution</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">How logic enforces single-driver safety while wire, tri0, tri1, wand, and wor resolve multiple drivers</text>

  <!-- Left Card: logic Single-Driver Rule -->
  <g transform="translate(24, 78)">
    <rect width="318" height="288" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh4B)"/>
    <rect width="318" height="38" rx="10" fill="#075985"/>
    <rect x="0" y="26" width="318" height="12" fill="#075985"/>
    <text x="159" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle">logic Variable (Single Driver)</text>

    <!-- Valid Single Driver -->
    <rect x="16" y="52" width="286" height="96" rx="8" fill="#0c1e35" stroke="#34d399" stroke-width="1.3"/>
    <text x="28" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">LEGAL: One Procedural or assign Driver</text>
    <rect x="28" y="84" width="96" height="34" rx="5" fill="#064e3b" stroke="#34d399"/>
    <text x="76" y="105" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d1fae5" text-anchor="middle">always_ff</text>
    <line x1="124" y1="101" x2="188" y2="101" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan4B)"/>
    <rect x="194" y="84" width="94" height="34" rx="5" fill="#082f49" stroke="#38bdf8"/>
    <text x="241" y="105" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">logic sig</text>
    <text x="159" y="138" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Clean, unambiguous hardware ownership</text>

    <!-- Error Multi Driver -->
    <rect x="16" y="162" width="286" height="110" rx="8" fill="#2c0b16" stroke="#f43f5e" stroke-width="1.3"/>
    <text x="28" y="182" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fb7185">ERROR: Multiple Drivers on logic</text>
    <rect x="28" y="194" width="84" height="24" rx="4" fill="#4c0519" stroke="#f43f5e"/>
    <text x="70" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#fecdd3" text-anchor="middle">assign 1</text>
    <rect x="28" y="226" width="84" height="24" rx="4" fill="#4c0519" stroke="#f43f5e"/>
    <text x="70" y="242" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#fecdd3" text-anchor="middle">assign 2</text>
    <line x1="112" y1="206" x2="176" y2="220" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRose4B)"/>
    <line x1="112" y1="238" x2="176" y2="224" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrRose4B)"/>
    <rect x="182" y="204" width="106" height="36" rx="5" fill="#4c0519" stroke="#f43f5e"/>
    <text x="235" y="226" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fecdd3" text-anchor="middle">Compile Error!</text>
    <text x="159" y="264" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fda4af" text-anchor="middle">Catches accidental wiring conflicts early</text>
  </g>

  <!-- Right Card: Multi-Driver Net Resolution Table -->
  <g transform="translate(362, 78)">
    <rect width="534" height="288" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh4B)"/>
    <rect width="534" height="38" rx="10" fill="#78350f"/>
    <rect x="0" y="26" width="534" height="12" fill="#78350f"/>
    <text x="267" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#fef3c7" text-anchor="middle">Multi-Driver Net Types (Driver A + Driver B Resolution)</text>

    <!-- Table Header -->
    <rect x="16" y="50" width="502" height="30" rx="5" fill="#1e293b"/>
    <g font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">
      <text x="30" y="69">Net Type</text>
      <text x="148" y="69" text-anchor="middle">(0, Z)</text>
      <text x="224" y="69" text-anchor="middle">(1, Z)</text>
      <text x="306" y="69" text-anchor="middle">(Z, Z) Undriven</text>
      <text x="418" y="69" text-anchor="middle">(0, 1) Contention</text>
    </g>

    <!-- Row 1: wire / tri -->
    <rect x="16" y="86" width="502" height="34" rx="5" fill="#0c1524" stroke="#1e293b"/>
    <text x="30" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">wire / tri</text>
    <text x="148" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="224" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="306" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle">Z</text>
    <text x="418" y="107" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">X (Contention)</text>

    <!-- Row 2: tri0 -->
    <rect x="16" y="126" width="502" height="34" rx="5" fill="#131d33" stroke="#1e293b"/>
    <text x="30" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#a855f7">tri0 (pull-dn)</text>
    <text x="148" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="224" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="306" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">0 (Pull-down)</text>
    <text x="418" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">X (Contention)</text>

    <!-- Row 3: tri1 -->
    <rect x="16" y="166" width="502" height="34" rx="5" fill="#0c1524" stroke="#1e293b"/>
    <text x="30" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#a855f7">tri1 (pull-up)</text>
    <text x="148" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="224" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="306" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#c084fc" text-anchor="middle">1 (Pull-up)</text>
    <text x="418" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#f43f5e" text-anchor="middle">X (Contention)</text>

    <!-- Row 4: wand -->
    <rect x="16" y="206" width="502" height="34" rx="5" fill="#131d33" stroke="#1e293b"/>
    <text x="30" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">wand (AND)</text>
    <text x="148" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="224" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="306" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle">Z</text>
    <text x="418" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">0 (Dominant 0)</text>

    <!-- Row 5: wor -->
    <rect x="16" y="246" width="502" height="34" rx="5" fill="#0c1524" stroke="#1e293b"/>
    <text x="30" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">wor (OR)</text>
    <text x="148" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">0</text>
    <text x="224" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">1</text>
    <text x="306" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#fbbf24" text-anchor="middle">Z</text>
    <text x="418" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">1 (Dominant 1)</text>
  </g>
</svg>
