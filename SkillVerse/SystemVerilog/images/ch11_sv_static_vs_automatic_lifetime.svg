<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh11C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh11C" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowRoseC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowGreenC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="920" height="410" rx="14" fill="url(#bgGradCh11C)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Subroutine Storage Lifetimes: static (Shared) vs. automatic (Per-Call Stack)</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Module routines default to static; add 'automatic' for concurrent calls, reentrancy, and recursion</text>

  <!-- Left Panel: static -->
  <g transform="translate(24, 78)">
    <rect width="424" height="308" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8" filter="url(#shadowCh11C)"/>
    <rect width="424" height="38" rx="10" fill="#881337"/>
    <rect x="0" y="26" width="424" height="12" fill="#881337"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">static Storage (Default in Modules — Shared!)</text>

    <!-- Two concurrent callers -->
    <rect x="20" y="54" width="168" height="48" rx="6" fill="#2a0a14" stroke="#fb7185"/>
    <text x="104" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af" text-anchor="middle">fork Call #1</text>
    <text x="104" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0" text-anchor="middle">Reads &amp; writes count</text>

    <rect x="236" y="54" width="168" height="48" rx="6" fill="#2a0a14" stroke="#fb7185"/>
    <text x="320" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fda4af" text-anchor="middle">fork Call #2</text>
    <text x="320" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0" text-anchor="middle">Reads &amp; writes count</text>

    <!-- Arrows colliding onto ONE slot -->
    <line x1="104" y1="104" x2="188" y2="148" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRoseC)"/>
    <line x1="320" y1="104" x2="236" y2="148" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRoseC)"/>

    <rect x="92" y="152" width="240" height="58" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.8"/>
    <text x="212" y="176" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#ffe4e6" text-anchor="middle">ONE Shared Slot: call_count</text>
    <text x="212" y="196" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fda4af" text-anchor="middle">Persists across calls — Race Hazard!</text>

    <rect x="14" y="226" width="396" height="68" rx="6" fill="#091526" stroke="#1e3a5f"/>
    <text x="26" y="247" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb7185">Consequences:</text>
    <text x="26" y="266" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Concurrent fork calls overwrite each other's locals.</text>
    <text x="26" y="283" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">• Recursion fails because deeper calls clobber arguments.</text>
  </g>

  <!-- Right Panel: automatic -->
  <g transform="translate(472, 78)">
    <rect width="424" height="308" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh11C)"/>
    <rect width="424" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="424" height="12" fill="#065f46"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#d1fae5" text-anchor="middle">automatic Storage (Default in Classes — Reentrant!)</text>

    <!-- Two concurrent callers -->
    <rect x="20" y="54" width="168" height="48" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="104" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="middle">fork Call #1</text>
    <text x="104" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0" text-anchor="middle">Isolated frame</text>

    <rect x="236" y="54" width="168" height="48" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="320" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="middle">fork Call #2</text>
    <text x="320" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0" text-anchor="middle">Isolated frame</text>

    <!-- Separate arrows to separate stack frames -->
    <line x1="104" y1="104" x2="104" y2="148" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreenC)"/>
    <line x1="320" y1="104" x2="320" y2="148" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreenC)"/>

    <rect x="20" y="152" width="168" height="58" rx="8" fill="#064e3b" stroke="#34d399"/>
    <text x="104" y="174" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">Frame #1</text>
    <text x="104" y="194" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d1fae5" text-anchor="middle">call_count = 1</text>

    <rect x="236" y="152" width="168" height="58" rx="8" fill="#064e3b" stroke="#34d399"/>
    <text x="320" y="174" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">Frame #2</text>
    <text x="320" y="194" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d1fae5" text-anchor="middle">call_count = 1</text>

    <rect x="14" y="226" width="396" height="68" rx="6" fill="#091526" stroke="#1e3a5f"/>
    <text x="26" y="247" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Benefits:</text>
    <text x="26" y="266" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• Fresh locals created on every entry, freed on exit.</text>
    <text x="26" y="283" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0">• Safe for concurrent tasks, recursion, and 'ref' arguments.</text>
  </g>
</svg>