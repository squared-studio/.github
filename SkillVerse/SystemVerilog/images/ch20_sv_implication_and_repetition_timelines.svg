<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh20B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh20B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="14" fill="url(#bgGradCh20B)"/>

  <!-- Title -->
  <text x="460" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SVA Implication (|-&gt; vs. |=&gt;) &amp; Repetition Operators ([*n], [-&gt;n], [=n])</text>
  <text x="460" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Cycle-by-cycle evaluation timing for overlapping/non-overlapping implications and repetitions</text>

  <!-- Top Section: Implication Timing -->
  <g transform="translate(24, 68)">
    <rect width="872" height="162" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadowCh20B)"/>
    <rect width="872" height="32" rx="10" fill="#075985"/>
    <rect x="0" y="20" width="872" height="12" fill="#075985"/>
    <text x="436" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">Implication Timing Across Clock Edges (T0 - T5)</text>

    <!-- Grid guidelines -->
    <line x1="250" y1="36" x2="250" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="350" y1="36" x2="350" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="450" y1="36" x2="450" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="550" y1="36" x2="550" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="650" y1="36" x2="650" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>
    <line x1="750" y1="36" x2="750" y2="152" stroke="#1e293b" stroke-dasharray="3,3"/>

    <!-- Cycle labels -->
    <text x="250" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">T0</text>
    <text x="350" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">T1</text>
    <text x="450" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8" font-weight="700" text-anchor="middle">T2</text>
    <text x="550" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34d399" font-weight="700" text-anchor="middle">T3</text>
    <text x="650" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">T4</text>
    <text x="750" y="50" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">T5</text>

    <!-- req waveform -->
    <text x="20" y="79" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#e2e8f0">req (antecedent)</text>
    <path d="M 210 84 L 400 84 L 400 62 L 500 62 L 500 84 L 830 84" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="450" cy="62" r="4.5" fill="#38bdf8"/>

    <!-- req |-> gnt -->
    <text x="20" y="114" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#7dd3fc">req |-&gt; gnt</text>
    <rect x="415" y="96" width="70" height="24" rx="4" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="450" y="112" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">Check T2</text>
    <text x="530" y="112" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Overlapping: consequent starts SAME cycle (T2)</text>

    <!-- req |=> gnt -->
    <text x="20" y="145" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7">req |=&gt; gnt</text>
    <rect x="515" y="128" width="70" height="24" rx="4" fill="#072c22" stroke="#10b981"/>
    <text x="550" y="144" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Check T3</text>
    <text x="615" y="144" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Non-overlapping: equivalent to req |-&gt; ##1 gnt</text>
  </g>

  <!-- Bottom Section: Repetition Operators -->
  <g transform="translate(24, 244)">
    <rect width="872" height="154" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.6" filter="url(#shadowCh20B)"/>
    <rect width="872" height="32" rx="10" fill="#065f46"/>
    <rect x="0" y="20" width="872" height="12" fill="#065f46"/>
    <text x="436" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#d1fae5" text-anchor="middle">Repetition Operators Comparison ([*n] vs. [-&gt;n] vs. [=n])</text>

    <!-- Card 1: [*3] -->
    <rect x="14" y="44" width="272" height="96" rx="7" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="26" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">valid [*3] ##1 done</text>
    <text x="26" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Consecutive Repetition</text>
    <text x="26" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#bae6fd">T1:valid T2:valid T3:valid</text>
    <text x="26" y="122" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#34d399">T4:done (must be back-to-back)</text>

    <!-- Card 2: [->2] -->
    <rect x="300" y="44" width="272" height="96" rx="7" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="312" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#c7d2fe">rdy [-&gt;2] ##1 done</text>
    <text x="312" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e0e7ff">Goto Repetition (exact end)</text>
    <text x="312" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#c7d2fe">!rdy rdy !rdy rdy &lt;- seq ends</text>
    <text x="312" y="122" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#34d399">done REQUIRED next cycle!</text>

    <!-- Card 3: [=2] -->
    <rect x="586" y="44" width="272" height="96" rx="7" fill="#1e1b18" stroke="#f59e0b"/>
    <text x="598" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#fbbf24">rdy [=2] ##1 done</text>
    <text x="598" y="84" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fde68a">Non-Consecutive Repetition</text>
    <text x="598" y="104" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fcd34d">!rdy rdy !rdy rdy [!rdy*]</text>
    <text x="598" y="122" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#34d399">done may wait after trailing !rdy</text>
  </g>
</svg>
