<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh7D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh7D" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="430" rx="14" fill="url(#bgGradCh7D)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SystemVerilog Operator Precedence Hierarchy &amp; Classic Traps</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Addition binds tighter than shifts, and equality binds tighter than bitwise AND—always use parentheses ()</text>

  <!-- Left Panel: Precedence Ladder -->
  <g transform="translate(24, 78)">
    <rect width="418" height="328" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh7D)"/>
    <rect width="418" height="36" rx="10" fill="#075985"/>
    <rect x="0" y="24" width="418" height="12" fill="#075985"/>
    <text x="209" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">Precedence Ladder (1 = Highest ──▶ 10 = Lowest)</text>

    <g transform="translate(14, 46)" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11">
      <rect x="0" y="0" width="390" height="24" rx="4" fill="#0c1e35"/>
      <text x="10" y="16" font-weight="700" fill="#38bdf8">1. Grouping / Select / Scope</text>
      <text x="380" y="16" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">()  []  .  ::</text>

      <rect x="0" y="27" width="390" height="24" rx="4" fill="#091526"/>
      <text x="10" y="43" font-weight="700" fill="#38bdf8">2. Unary &amp; Reduction</text>
      <text x="380" y="43" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">!  ~  +  -  &amp;  |  ^</text>

      <rect x="0" y="54" width="390" height="24" rx="4" fill="#0c1e35"/>
      <text x="10" y="70" font-weight="700" fill="#34d399">3. Power &amp; Multiplicative</text>
      <text x="380" y="70" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">**   *   /   %</text>

      <rect x="0" y="81" width="390" height="24" rx="4" fill="#172554" stroke="#fbbf24"/>
      <text x="10" y="97" font-weight="700" fill="#fbbf24">4. Additive (Higher than Shifts!)</text>
      <text x="380" y="97" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#fde68a" text-anchor="end">+   -</text>

      <rect x="0" y="108" width="390" height="24" rx="4" fill="#172554" stroke="#fbbf24"/>
      <text x="10" y="124" font-weight="700" fill="#fbbf24">5. Shift Operators</text>
      <text x="380" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#fde68a" text-anchor="end">&lt;&lt;  &gt;&gt;  &lt;&lt;&lt;  &gt;&gt;&gt;</text>

      <rect x="0" y="135" width="390" height="24" rx="4" fill="#091526"/>
      <text x="10" y="151" font-weight="700" fill="#a5b4fc">6. Relational</text>
      <text x="380" y="151" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">&lt;   &lt;=   &gt;   &gt;=</text>

      <rect x="0" y="162" width="390" height="24" rx="4" fill="#2a0a14" stroke="#f43f5e"/>
      <text x="10" y="178" font-weight="700" fill="#fb7185">7. Equality (Higher than Bitwise!)</text>
      <text x="380" y="178" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#fda4af" text-anchor="end">==  !=  ===  ==?</text>

      <rect x="0" y="189" width="390" height="24" rx="4" fill="#2a0a14" stroke="#f43f5e"/>
      <text x="10" y="205" font-weight="700" fill="#fb7185">8. Bitwise AND / XOR / OR</text>
      <text x="380" y="205" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" fill="#fda4af" text-anchor="end">&amp;  ──▶  ^  ──▶  |</text>

      <rect x="0" y="216" width="390" height="24" rx="4" fill="#091526"/>
      <text x="10" y="232" font-weight="700" fill="#cbd5e1">9. Logical AND / OR</text>
      <text x="380" y="232" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">&amp;&amp;  ──▶  ||</text>

      <rect x="0" y="243" width="390" height="24" rx="4" fill="#0c1e35"/>
      <text x="10" y="259" font-weight="700" fill="#94a3b8">10. Conditional (Ternary)</text>
      <text x="380" y="259" font-family="'JetBrains Mono', Consolas, monospace" fill="#cbd5e1" text-anchor="end">cond ? a : b</text>
    </g>
  </g>

  <!-- Right Panel: 3 Classic Precedence Traps -->
  <g transform="translate(460, 78)">
    <rect width="436" height="328" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh7D)"/>
    <rect width="436" height="36" rx="10" fill="#78350f"/>
    <rect x="0" y="24" width="436" height="12" fill="#78350f"/>
    <text x="218" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#fef3c7" text-anchor="middle">3 Classic Precedence Traps Solved by ()</text>

    <!-- Trap 1 -->
    <g transform="translate(14, 50)">
      <rect width="408" height="82" rx="6" fill="#181208" stroke="#f59e0b"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Trap 1: Shift + Addition (+ binds tighter than &lt;&lt;)</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fda4af">3 + 4 &lt;&lt; 2   ≡  (3 + 4) &lt;&lt; 2  =  28  (surprise!)</text>
      <text x="12" y="64" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">3 + (4 &lt;&lt; 2)  =  3 + 16       =  19  (explicit)</text>
    </g>

    <!-- Trap 2 -->
    <g transform="translate(14, 142)">
      <rect width="408" height="82" rx="6" fill="#2a0a14" stroke="#f43f5e"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb7185">Trap 2: Bitwise Mask + Equality (== tighter than &amp;)</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fda4af">flags &amp; MASK == 0  ≡  flags &amp; (MASK == 0)  (BUG!)</text>
      <text x="12" y="64" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">(flags &amp; MASK) == 0  (checks masked bits properly)</text>
    </g>

    <!-- Trap 3 -->
    <g transform="translate(14, 234)">
      <rect width="408" height="80" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Trap 3: Right Shift + Offset (+ tighter than &gt;&gt;)</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fda4af">8 &gt;&gt; 2 + 1   ≡  8 &gt;&gt; (2 + 1)  =  8 &gt;&gt; 3  =  1</text>
      <text x="12" y="63" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">(8 &gt;&gt; 2) + 1  =  2 + 1         =  3  (explicit)</text>
    </g>
  </g>
</svg>