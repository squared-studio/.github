<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh21B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh21B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh21B)"/>

  <!-- Title -->
  <text x="460" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">RTL Code Coverage Metrics: Statement, Branch, Condition &amp; Toggle/FSM</text>
  <text x="460" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Structural coverage dimensions collected automatically by SystemVerilog simulators</text>

  <!-- Card 1: Statement / Line -->
  <g transform="translate(24, 72)">
    <rect width="424" height="148" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh21B)"/>
    <rect width="424" height="32" rx="10" fill="#075985"/>
    <rect x="0" y="20" width="424" height="12" fill="#075985"/>
    <text x="212" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">1. Statement (Line) Coverage</text>
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34d399">[HIT]  if (en &amp;&amp; !stall) count &lt;= count + 1;</text>
    <text x="16" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fda4af">[MISS] else if (clr)     count &lt;= '0;</text>
    <text x="16" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Tracks which executable RTL lines ran at least once.</text>
    <text x="16" y="118" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Coarse check: single hit marks the entire line as covered.</text>
  </g>

  <!-- Card 2: Branch Coverage -->
  <g transform="translate(472, 72)">
    <rect width="424" height="148" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.8" filter="url(#shadowCh21B)"/>
    <rect width="424" height="32" rx="10" fill="#4c1d95"/>
    <rect x="0" y="20" width="424" height="12" fill="#4c1d95"/>
    <text x="212" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ede9fe" text-anchor="middle">2. Branch Coverage</text>
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34d399">[HIT]  case (state) 2'b00: ...</text>
    <text x="16" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34d399">[HIT]  2'b01: ...  |  [MISS] default: ...</text>
    <text x="16" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Measures TRUE/FALSE arms of if, case, ?: ternary decisions.</text>
    <text x="16" y="118" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Catches missing else or unexercised case/default branches.</text>
  </g>

  <!-- Card 3: Condition / Expression Coverage -->
  <g transform="translate(24, 234)">
    <rect width="424" height="144" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh21B)"/>
    <rect width="424" height="32" rx="10" fill="#78350f"/>
    <rect x="0" y="20" width="424" height="12" fill="#78350f"/>
    <text x="212" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fef3c7" text-anchor="middle">3. Condition / Expression Coverage</text>
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fbbf24">assign grant = (req_a || req_b) &amp;&amp; !busy;</text>
    <text x="16" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fde68a">Sub-terms: req_a={0,1}  req_b={0,1}  busy={0,1}</text>
    <text x="16" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Checks that every boolean sub-expression independently</text>
    <text x="16" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">controls the outcome (e.g., FEC / MC/DC style truth coverage).</text>
  </g>

  <!-- Card 4: Toggle & FSM Coverage -->
  <g transform="translate(472, 234)">
    <rect width="424" height="144" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh21B)"/>
    <rect width="424" height="32" rx="10" fill="#065f46"/>
    <rect x="0" y="20" width="424" height="12" fill="#065f46"/>
    <text x="212" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#d1fae5" text-anchor="middle">4. Toggle &amp; FSM State/Arc Coverage</text>
    <text x="16" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#34d399">Toggle: every bit observed 0 -&gt; 1 AND 1 -&gt; 0</text>
    <text x="16" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">FSM:    states visited &amp; state -&gt; next_state arcs</text>
    <text x="16" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Finds stuck-at signals, unwired bus bits, and deadlocked FSM</text>
    <text x="16" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">arcs across module hierarchy boundaries.</text>
  </g>
</svg>
