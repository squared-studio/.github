<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh9A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh9A" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCh9A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh9A)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Simulation Lifecycle of Procedural Blocks: initial, always &amp; final</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">When each procedural block executes across simulation startup, active cycles, and termination</text>

  <!-- Timeline Bar at top -->
  <g transform="translate(24, 76)">
    <line x1="20" y1="22" x2="852" y2="22" stroke="#475569" stroke-width="3" marker-end="url(#arrowCh9A)"/>
    <circle cx="90" cy="22" r="8" fill="#38bdf8"/>
    <text x="90" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">t = 0</text>
    <circle cx="436" cy="22" r="8" fill="#10b981"/>
    <text x="436" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">t = 0 .. T_end (Cycles &amp; Events)</text>
    <circle cx="782" cy="22" r="8" fill="#a855f7"/>
    <text x="782" y="10" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">$finish</text>
  </g>

  <!-- Phase 1: initial -->
  <g transform="translate(24, 118)">
    <rect width="276" height="258" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh9A)"/>
    <rect width="276" height="38" rx="10" fill="#075985"/>
    <rect x="0" y="26" width="276" height="12" fill="#075985"/>
    <text x="138" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#e0f2fe" text-anchor="middle">initial begin ... end</text>

    <text x="14" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">1. Runs ONCE at t = 0</text>
    <text x="14" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• Multiple initial blocks start in parallel</text>
    <text x="14" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• May pause on #, @, or wait statements</text>
    <text x="14" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">• Primarily TB (limited FPGA RAM/FF init)</text>

    <rect x="12" y="134" width="252" height="110" rx="6" fill="#0c1e35" stroke="#0284c7"/>
    <text x="22" y="155" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#7dd3fc">initial begin</text>
    <text x="32" y="173" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">rst_n = 1'b0;</text>
    <text x="32" y="191" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">#20 rst_n = 1'b1;</text>
    <text x="32" y="209" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">#1000 $finish;</text>
    <text x="22" y="227" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#7dd3fc">end</text>
  </g>

  <!-- Phase 2: always family -->
  <g transform="translate(322, 118)">
    <rect width="276" height="258" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh9A)"/>
    <rect width="276" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="276" height="12" fill="#065f46"/>
    <text x="138" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#d1fae5" text-anchor="middle">always / _comb / _ff</text>

    <text x="14" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">2. Repeats Continuously</text>
    <text x="14" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• Triggered by clock edges or signal changes</text>
    <text x="14" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• always_comb also runs once at t = 0</text>
    <text x="14" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0">• Core behavioral engine for RTL &amp; clocks</text>

    <rect x="12" y="134" width="252" height="110" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="22" y="155" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">always #5 clk = ~clk;  // TB</text>
    <text x="22" y="177" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">always_ff @(posedge clk)</text>
    <text x="32" y="195" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">q &lt;= d;            // RTL FF</text>
    <text x="22" y="217" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6ee7b7">always_comb y = a + b;</text>
  </g>

  <!-- Phase 3: final -->
  <g transform="translate(620, 118)">
    <rect width="276" height="258" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8" filter="url(#shadowCh9A)"/>
    <rect width="276" height="38" rx="10" fill="#581c87"/>
    <rect x="0" y="26" width="276" height="12" fill="#581c87"/>
    <text x="138" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#f3e8ff" text-anchor="middle">final begin ... end</text>

    <text x="14" y="60" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#d8b4fe">3. Runs ONCE at Termination</text>
    <text x="14" y="80" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">• Triggered when $finish terminates sim</text>
    <text x="14" y="98" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fda4af">• Zero-time only: NO #, @, or wait allowed!</text>
    <text x="14" y="116" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">• Non-synthesizable (summary &amp; cleanup)</text>

    <rect x="12" y="134" width="252" height="110" rx="6" fill="#2e1065" stroke="#a855f7"/>
    <text x="22" y="155" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d8b4fe">final begin</text>
    <text x="32" y="175" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">$display("Errors: %0d", err);</text>
    <text x="32" y="195" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">$fclose(log_fd);</text>
    <text x="22" y="215" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d8b4fe">end</text>
  </g>
</svg>