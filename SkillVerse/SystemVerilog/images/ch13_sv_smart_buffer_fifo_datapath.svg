<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh13B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh13B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan13B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen13B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh13B)"/>

  <!-- Title -->
  <text x="460" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Parameterized Module Architecture: Configurable Synchronous FIFO (smart_buffer_module)</text>
  <text x="460" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">DATA_WIDTH and BUFFER_DEPTH parameterize storage geometry, pointers, and full/empty flow control</text>

  <!-- Left Panel: Write Side -->
  <g transform="translate(24, 78)">
    <rect width="262" height="296" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh13B)"/>
    <rect width="262" height="36" rx="10" fill="#075985"/>
    <rect x="0" y="24" width="262" height="12" fill="#075985"/>
    <text x="131" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle">Write Control &amp; Pointer</text>

    <g transform="translate(12, 50)">
      <rect width="238" height="62" rx="7" fill="#0c1c2e" stroke="#0284c7"/>
      <text x="10" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">write_data_in [DATA_WIDTH-1:0]</text>
      <text x="10" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">write_enable (input logic)</text>
      <text x="10" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Width scales with DATA_WIDTH</text>
    </g>

    <g transform="translate(12, 124)">
      <rect width="238" height="68" rx="7" fill="#091526" stroke="#38bdf8"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">Overflow Protection Gate:</text>
      <text x="10" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">do_write = write_enable</text>
      <text x="78" y="57" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">&amp;&amp; !buffer_full;</text>
    </g>

    <g transform="translate(12, 204)">
      <rect width="238" height="78" rx="7" fill="#0c1c2e" stroke="#0369a1"/>
      <text x="10" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">write_pointer (always_ff)</text>
      <text x="10" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Increments on posedge clk when</text>
      <text x="10" y="55" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">do_write == 1; wraps back to 0</text>
      <text x="10" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#fde68a">at BUFFER_DEPTH - 1</text>
    </g>
  </g>

  <line x1="288" y1="200" x2="322" y2="200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan13B)"/>

  <!-- Center Panel: Storage Array & Occupancy Counter -->
  <g transform="translate(326, 78)">
    <rect width="268" height="296" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh13B)"/>
    <rect width="268" height="36" rx="10" fill="#78350f"/>
    <rect x="0" y="24" width="268" height="12" fill="#78350f"/>
    <text x="134" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#fef3c7" text-anchor="middle">data_buffer [0:BUFFER_DEPTH-1]</text>

    <!-- Memory Entries -->
    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="236" height="28" rx="5" fill="#181208" stroke="#b45309"/>
      <text x="118" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fde68a" text-anchor="middle">Entry [0]  (&lt;- read_pointer)</text>

      <rect x="0" y="34" width="236" height="28" rx="5" fill="#181208" stroke="#b45309"/>
      <text x="118" y="52" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0" text-anchor="middle">Entry [1]  (DATA_WIDTH bits)</text>

      <rect x="0" y="68" width="236" height="28" rx="5" fill="#181208" stroke="#d97706"/>
      <text x="118" y="86" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8" text-anchor="middle">Entry [2]  (&lt;- write_pointer)</text>

      <rect x="0" y="102" width="236" height="28" rx="5" fill="#091526" stroke="#334155" stroke-dasharray="4,2"/>
      <text x="118" y="120" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#64748b" text-anchor="middle">... up to [BUFFER_DEPTH - 1]</text>
    </g>

    <!-- Counter Case Block -->
    <g transform="translate(16, 190)">
      <rect width="236" height="92" rx="7" fill="#181208" stroke="#f59e0b"/>
      <text x="118" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="middle">Occupancy Tracker: current_count</text>
      <text x="14" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">2'b10 (wr only): count + 1</text>
      <text x="14" y="57" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#7dd3fc">2'b01 (rd only): count - 1</text>
      <text x="14" y="74" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#cbd5e1">2'b00 / 2'b11  : count unchanged</text>
    </g>
  </g>

  <line x1="596" y1="200" x2="630" y2="200" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen13B)"/>

  <!-- Right Panel: Read Side & Status Flags -->
  <g transform="translate(634, 78)">
    <rect width="262" height="296" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh13B)"/>
    <rect width="262" height="36" rx="10" fill="#065f46"/>
    <rect x="0" y="24" width="262" height="12" fill="#065f46"/>
    <text x="131" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">Read Output &amp; Status Flags</text>

    <g transform="translate(12, 50)">
      <rect width="238" height="68" rx="7" fill="#072c22" stroke="#10b981"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Underflow Protection Gate:</text>
      <text x="10" y="40" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">do_read = read_enable</text>
      <text x="72" y="57" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">&amp;&amp; !buffer_empty;</text>
    </g>

    <g transform="translate(12, 130)">
      <rect width="238" height="66" rx="7" fill="#091526" stroke="#10b981"/>
      <text x="10" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">read_data_out [DATA_WIDTH-1:0]</text>
      <text x="10" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Registered on posedge clk when</text>
      <text x="10" y="55" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a7f3d0">do_read == 1; 0 on !rst_n</text>
    </g>

    <g transform="translate(12, 208)">
      <rect width="238" height="74" rx="7" fill="#072c22" stroke="#059669"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Combinational Status (always_comb):</text>
      <text x="10" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fda4af">buffer_full  = (cnt == DEPTH);</text>
      <text x="10" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#7dd3fc">buffer_empty = (cnt == 0);</text>
    </g>
  </g>
</svg>