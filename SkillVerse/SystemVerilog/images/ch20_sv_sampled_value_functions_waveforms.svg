<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh20C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh20C" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="390" rx="14" fill="url(#bgGradCh20C)"/>

  <!-- Title -->
  <text x="460" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SVA Sampled-Value &amp; Bit-Vector System Functions</text>
  <text x="460" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Detect edge transitions, cycle history, one-hot encoding, and X/Z unknowns directly inside properties</text>

  <!-- Left Card: Temporal Sampled-Value Functions -->
  <g transform="translate(24, 72)">
    <rect width="450" height="294" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh20C)"/>
    <rect width="450" height="36" rx="10" fill="#075985"/>
    <rect x="0" y="24" width="450" height="12" fill="#075985"/>
    <text x="225" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle">Clocked Edge &amp; History Functions</text>

    <!-- Clock tick headers -->
    <text x="115" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94a3b8" text-anchor="middle">T0</text>
    <text x="195" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#38bdf8" font-weight="700" text-anchor="middle">T1</text>
    <text x="275" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a78bfa" font-weight="700" text-anchor="middle">T2</text>
    <text x="355" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#f43f5e" font-weight="700" text-anchor="middle">T3</text>

    <!-- Signal sig waveform -->
    <text x="16" y="88" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#e2e8f0">sig</text>
    <path d="M 85 95 L 155 95 L 155 70 L 315 70 L 315 95 L 415 95" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="115" cy="95" r="4" fill="#94a3b8"/>
    <circle cx="195" cy="70" r="4.5" fill="#34d399"/>
    <circle cx="275" cy="70" r="4.5" fill="#a78bfa"/>
    <circle cx="355" cy="95" r="4.5" fill="#f43f5e"/>

    <!-- Descriptions -->
    <rect x="14" y="114" width="422" height="40" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="24" y="132" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">$rose(sig)</text>
    <text x="145" y="132" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#d1fae5">True at T1 (LSB transitioned 0/X/Z -&gt; 1)</text>
    <text x="24" y="147" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#6ee7b7">$fell(sig)  True at T3 (LSB transitioned 1/X/Z -&gt; 0)</text>

    <rect x="14" y="162" width="422" height="40" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="24" y="180" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#c7d2fe">$stable(sig)</text>
    <text x="145" y="180" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e0e7ff">True at T2 (sig(T2) === sig(T1) == 1)</text>
    <text x="24" y="195" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a5b4fc">$changed(sig) True whenever current != previous sample</text>

    <rect x="14" y="210" width="422" height="68" rx="6" fill="#0c1c2e" stroke="#1e3a5f"/>
    <text x="24" y="230" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">$past(expr, N)</text>
    <text x="24" y="249" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Returns Preponed sampled value of expr from N cycles ago.</text>
    <text x="24" y="266" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#7dd3fc">At T3: $past(sig, 1) == 1'b1  |  $past(sig, 3) == 1'b0</text>
  </g>

  <!-- Right Card: Bit-Vector & Integrity Functions -->
  <g transform="translate(494, 72)">
    <rect width="402" height="294" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.8" filter="url(#shadowCh20C)"/>
    <rect width="402" height="36" rx="10" fill="#4c1d95"/>
    <rect x="0" y="24" width="402" height="12" fill="#4c1d95"/>
    <text x="201" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ede9fe" text-anchor="middle">Bit-Vector &amp; Unknown Check Functions</text>

    <rect x="14" y="50" width="374" height="52" rx="6" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="24" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">$onehot(grant)</text>
    <text x="24" y="90" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Returns 1 iff exactly ONE bit is 1 (e.g. 4'b0100).</text>

    <rect x="14" y="110" width="374" height="52" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="24" y="130" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#c7d2fe">$onehot0(grant)</text>
    <text x="24" y="150" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e0e7ff">Returns 1 iff AT MOST one bit is 1 (0 or 1 active grant).</text>

    <rect x="14" y="170" width="374" height="52" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="24" y="190" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">$countones(mask)</text>
    <text x="24" y="210" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#d1fae5">Returns integer count of '1' bits (ignores 0, X, Z).</text>

    <rect x="14" y="230" width="374" height="52" rx="6" fill="#4c0519" stroke="#f43f5e"/>
    <text x="24" y="250" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fecdd3">!$isunknown(bus)</text>
    <text x="24" y="270" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fda4af">Detects any X or Z bit on control/address buses!</text>
  </g>
</svg>
