<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh11A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh11A" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="420" rx="14" fill="url(#bgGradCh11A)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SystemVerilog Tasks vs. Functions: Execution Time, Call Graph &amp; Domain</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Choose tasks for time-consuming sequences and functions for zero-time combinational logic &amp; utilities</text>

  <!-- Left Panel: Task -->
  <g transform="translate(24, 78)">
    <rect width="424" height="318" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh11A)"/>
    <rect width="424" height="38" rx="10" fill="#78350f"/>
    <rect x="0" y="26" width="424" height="12" fill="#78350f"/>
    <text x="212" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">task  (Time-Consuming Sequential Procedure)</text>

    <g transform="translate(14, 52)">
      <rect width="396" height="50" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Timing Control: Allowed (#, @, wait)</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">May pause across clock edges or simulation delays</text>
    </g>

    <g transform="translate(14, 110)">
      <rect width="396" height="50" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Return Value: None (Uses output / inout / ref)</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Returns results via arguments; supports early 'return;'</text>
    </g>

    <g transform="translate(14, 168)">
      <rect width="396" height="50" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Call Hierarchy: Tasks AND Functions</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Freely calls both timed sub-tasks and helper functions</text>
    </g>

    <g transform="translate(14, 226)">
      <rect width="396" height="76" rx="6" fill="#091526" stroke="#1e3a5f"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fde68a">Domain: Testbench Drivers &amp; Bus Sequences</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">task automatic send_pkt(input pkt_t p);</text>
      <text x="24" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a7f3d0">@(posedge clk); drive(p);</text>
    </g>
  </g>

  <!-- Right Panel: Function -->
  <g transform="translate(472, 78)">
    <rect width="424" height="318" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh11A)"/>
    <rect width="424" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="424" height="12" fill="#065f46"/>
    <text x="212" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#d1fae5" text-anchor="middle">function  (Zero-Time Combinational / Utility)</text>

    <g transform="translate(14, 52)">
      <rect width="396" height="50" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Timing Control: Prohibited (Zero Time Only)</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Cannot contain #, @, or wait (executes instantaneously)</text>
    </g>

    <g transform="translate(14, 110)">
      <rect width="396" height="50" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Return Value: Typed Value OR void</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Returns single typed value (or 'void' for TB side effects)</text>
    </g>

    <g transform="translate(14, 168)">
      <rect width="396" height="50" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Call Hierarchy: Functions ONLY</text>
      <text x="12" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Cannot call time-consuming tasks (except via fork...join_none)</text>
    </g>

    <g transform="translate(14, 226)">
      <rect width="396" height="76" rx="6" fill="#091526" stroke="#1e3a5f"/>
      <text x="12" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#6ee7b7">Domain: Synthesizable RTL Logic &amp; Math</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">function automatic logic parity(logic [7:0] d);</text>
      <text x="24" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#7dd3fc">return ~^d;  // Usable inside 'assign' or always_comb</text>
    </g>
  </g>
</svg>