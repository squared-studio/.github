<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh5E" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh5E" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreenE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrowRoseE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fb7185" />
    </marker>
    <marker id="arrowAmberE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
  </defs>

  <rect width="920" height="410" rx="14" fill="url(#bgGradCh5E)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SystemVerilog Queue [$] Operations: Front, Back &amp; Indexed Manipulation</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Auto-resizing double-ended list indexed from 0 (front) to $ (back = size()-1)</text>

  <!-- Main Queue Diagram Card -->
  <g transform="translate(24, 78)">
    <rect width="872" height="190" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8" filter="url(#shadowCh5E)"/>
    <text x="436" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#e9d5ff" text-anchor="middle">int transaction_q [$] = '{ 5, 10, 15, 20 };</text>

    <!-- Front Operations (Left) -->
    <g transform="translate(18, 52)">
      <rect width="176" height="40" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.3"/>
      <text x="88" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">push_front(item)</text>
      <text x="88" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Inserts at index 0</text>
      <line x1="176" y1="20" x2="220" y2="34" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowGreenE)"/>

      <rect y="56" width="176" height="40" rx="6" fill="#4c0519" stroke="#fb7185" stroke-width="1.3"/>
      <text x="88" y="73" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">pop_front()</text>
      <text x="88" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fecdd3" text-anchor="middle">Removes &amp; returns q[0]</text>
      <line x1="224" y1="62" x2="178" y2="76" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrowRoseE)"/>
    </g>

    <!-- Queue Elements Center -->
    <g transform="translate(244, 68)">
      <!-- q[0] -->
      <rect x="0" y="0" width="88" height="66" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.6"/>
      <text x="44" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d8b4fe" text-anchor="middle">q[0] (Front)</text>
      <text x="44" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">5</text>

      <!-- q[1] -->
      <rect x="98" y="0" width="88" height="66" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="142" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a5b4fc" text-anchor="middle">q[1]</text>
      <text x="142" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">10</text>

      <!-- q[2] -->
      <rect x="196" y="0" width="88" height="66" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="240" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a5b4fc" text-anchor="middle">q[2]</text>
      <text x="240" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">15</text>

      <!-- q[3] / q[$] -->
      <rect x="294" y="0" width="90" height="66" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.6"/>
      <text x="339" y="18" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d8b4fe" text-anchor="middle">q[$] (Back)</text>
      <text x="339" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle">20</text>
    </g>

    <!-- Middle insert / delete arrows -->
    <line x1="386" y1="36" x2="386" y2="66" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrowAmberE)"/>
    <text x="386" y="49" dx="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#fbbf24">insert(1, val)</text>

    <line x1="484" y1="136" x2="484" y2="164" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrowRoseE)"/>
    <text x="484" y="177" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="700" fill="#fda4af" text-anchor="middle">delete(2)  /  delete()</text>

    <!-- Back Operations (Right) -->
    <g transform="translate(678, 52)">
      <rect width="176" height="40" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.3"/>
      <text x="88" y="17" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">push_back(item)</text>
      <text x="88" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Appends at index $</text>
      <line x1="0" y1="20" x2="-48" y2="34" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowGreenE)"/>

      <rect y="56" width="176" height="40" rx="6" fill="#4c0519" stroke="#fb7185" stroke-width="1.3"/>
      <text x="88" y="73" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fda4af" text-anchor="middle">pop_back()</text>
      <text x="88" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fecdd3" text-anchor="middle">Removes &amp; returns q[$]</text>
      <line x1="-50" y1="62" x2="-2" y2="76" stroke="#fb7185" stroke-width="1.8" marker-end="url(#arrowRoseE)"/>
    </g>
  </g>

  <!-- Bottom 3 Cards -->
  <g transform="translate(24, 286)">
    <!-- Card 1: FIFO -->
    <rect width="278" height="104" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadowCh5E)"/>
    <text x="16" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">FIFO Pattern (Scoreboard)</text>
    <text x="16" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">q.push_back(txn);</text>
    <text x="16" y="66" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">if (q.size() &gt; 0) x = q.pop_front();</text>
    <text x="16" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Preserves arrival order (First-In, First-Out)</text>

    <!-- Card 2: LIFO -->
    <rect x="297" width="278" height="104" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#shadowCh5E)"/>
    <text x="313" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">LIFO Pattern (Stack)</text>
    <text x="313" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">q.push_back(item);</text>
    <text x="313" y="66" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">if (q.size() &gt; 0) x = q.pop_back();</text>
    <text x="313" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Most recent item popped first (Last-In, First-Out)</text>

    <!-- Card 3: Bounded Queue -->
    <rect x="594" width="278" height="104" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowCh5E)"/>
    <text x="610" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Bounded Queue [$:N]</text>
    <text x="610" y="48" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fde68a">int bq [$:255];  // Max 256 items</text>
    <text x="610" y="68" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Check size before push when bounded;</text>
    <text x="610" y="86" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">overflows drop elements with a warning</text>
  </g>
</svg>