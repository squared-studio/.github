<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowLoop" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrCyanL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrEmeraldL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrAmberL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrPurpleL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a855f7"/>
    </marker>
    <marker id="arrRoseL" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <rect width="920" height="470" rx="14" fill="url(#bgGradLoop)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">The Closed-Loop Verification Mental Model</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">How specification, stimulus, DUT, assertions, scoreboards, and coverage work together</text>

  <!-- Step 1: Top Specification & Verification Plan -->
  <g transform="translate(220, 74)">
    <rect width="480" height="68" rx="10" fill="#171b2e" stroke="#a855f7" stroke-width="1.8" filter="url(#shadowLoop)"/>
    <text x="240" y="25" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">1. Specification &amp; Verification Plan</text>
    <text x="240" y="45" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e2e8f0" text-anchor="middle">Defines intended behavior, legal/illegal boundaries, protocol rules &amp; exit criteria</text>
  </g>

  <!-- Step 2: Stimulus & Driver (Left) -->
  <g transform="translate(32, 184)">
    <rect width="236" height="136" rx="10" fill="#0c1e35" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowLoop)"/>
    <rect width="236" height="34" rx="10" fill="#075985"/>
    <rect x="0" y="24" width="236" height="10" fill="#075985"/>
    <text x="118" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle">2. Stimulus &amp; Driver</text>
    <text x="16" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Directed &amp; constrained-random</text>
    <text x="16" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Normal, boundary &amp; error inputs</text>
    <text x="16" y="94" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Drives clk, rst_n &amp; bus pins</text>
    <text x="16" y="116" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#7dd3fc">rand / constraint / interface</text>
  </g>

  <!-- Center: DUT + SVA Assertions -->
  <g transform="translate(330, 184)">
    <rect width="260" height="136" rx="10" fill="#231222" stroke="#f43f5e" stroke-width="2" filter="url(#shadowLoop)"/>
    <rect width="260" height="34" rx="10" fill="#881337"/>
    <rect x="0" y="24" width="260" height="10" fill="#881337"/>
    <text x="130" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffe4e6" text-anchor="middle">Design Under Test (DUT)</text>
    <text x="130" y="55" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">Synthesizable RTL Logic</text>
    <text x="130" y="73" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Modules, FSMs, Datapaths &amp; Registers</text>

    <!-- Embedded SVA Box -->
    <rect x="16" y="86" width="228" height="38" rx="6" fill="#1a121b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="130" y="102" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">SVA: assert / assume / cover</text>
    <text x="130" y="117" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fde68a" text-anchor="middle">Protocol &amp; invariant checks on pins</text>
  </g>

  <!-- Step 3: Passive Monitor & Scoreboard (Right) -->
  <g transform="translate(652, 184)">
    <rect width="236" height="136" rx="10" fill="#072c22" stroke="#34d399" stroke-width="1.8" filter="url(#shadowLoop)"/>
    <rect width="236" height="34" rx="10" fill="#065f46"/>
    <rect x="0" y="24" width="236" height="10" fill="#065f46"/>
    <text x="118" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">3. Monitor &amp; Scoreboard</text>
    <text x="16" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Observes DUT without driving</text>
    <text x="16" y="74" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Golden reference prediction</text>
    <text x="16" y="94" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">• Flags mismatches immediately</text>
    <text x="16" y="116" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">mailbox / queue / $error()</text>
  </g>

  <!-- Step 4: Coverage Collector (Bottom Right) -->
  <g transform="translate(490, 366)">
    <rect width="340" height="78" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowLoop)"/>
    <text x="170" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">4. Coverage Evidence Collector</text>
    <text x="170" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Functional (covergroup), Code &amp; Assertion Coverage</text>
    <text x="170" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">Shows what was exercised — never replaces checkers</text>
  </g>

  <!-- Step 5: Debug & Review (Bottom Left) -->
  <g transform="translate(90, 366)">
    <rect width="340" height="78" rx="10" fill="#131d33" stroke="#a855f7" stroke-width="1.8" filter="url(#shadowLoop)"/>
    <text x="170" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">5. Debug, Waiver Review &amp; Refinement</text>
    <text x="170" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle">Analyze failures, justify exclusions &amp; residual risks</text>
    <text x="170" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#d8b4fe" text-anchor="middle">Refine constraints &amp; RTL until sign-off criteria hold</text>
  </g>

  <!-- Arrows -->
  <!-- Spec -> Stimulus -->
  <path d="M 220 108 L 150 108 L 150 176" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrPurpleL)"/>
  <!-- Spec -> Scoreboard -->
  <path d="M 700 108 L 770 108 L 770 176" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrPurpleL)"/>
  <text x="782" y="138" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#d8b4fe">Expected rules</text>
  <!-- Spec -> SVA -->
  <line x1="460" y1="142" x2="460" y2="176" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrPurpleL)"/>

  <!-- Stimulus -> DUT -->
  <line x1="268" y1="252" x2="322" y2="252" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrCyanL)"/>
  <text x="295" y="242" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#7dd3fc" text-anchor="middle">Drive</text>

  <!-- DUT -> Monitor -->
  <line x1="590" y1="252" x2="644" y2="252" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrEmeraldL)"/>
  <text x="617" y="242" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#6ee7b7" text-anchor="middle">Observe</text>

  <!-- Monitor -> Coverage -->
  <path d="M 770 320 L 770 358" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmberL)"/>

  <!-- Coverage -> Debug -->
  <line x1="490" y1="405" x2="438" y2="405" stroke="#f59e0b" stroke-width="2.2" marker-end="url(#arrAmberL)"/>

  <!-- Debug -> Stimulus feedback -->
  <path d="M 90 405 L 54 405 L 54 328" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrPurpleL)"/>
</svg>
