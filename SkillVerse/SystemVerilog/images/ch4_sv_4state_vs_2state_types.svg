<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh4A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh4A" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="440" rx="14" fill="url(#bgGradCh4A)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SystemVerilog Built-In Data Types: 4-State vs. 2-State &amp; Signedness</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Comparing hardware-accurate 4-state types (0, 1, X, Z) with simulation-optimized 2-state types (0, 1)</text>

  <!-- Left Card: 4-State Types -->
  <g transform="translate(24, 78)">
    <rect width="424" height="264" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh4A)"/>
    <rect width="424" height="38" rx="10" fill="#075985"/>
    <rect x="0" y="26" width="424" height="12" fill="#075985"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">4-State Types (0, 1, X, Z) — Default Init: 'x</text>

    <!-- Row 1: logic / reg -->
    <g transform="translate(14, 52)">
      <rect width="396" height="58" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#38bdf8">logic / reg [N-1:0]</text>
      <rect x="256" y="8" width="128" height="20" rx="4" fill="#082f49"/>
      <text x="320" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">Unsigned by default</text>
      <text x="12" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">Exposes uninitialized flip-flops ('x) and floating nets ('z)</text>
    </g>

    <!-- Row 2: integer -->
    <g transform="translate(14, 120)">
      <rect width="396" height="58" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#38bdf8">integer</text>
      <rect x="256" y="8" width="128" height="20" rx="4" fill="#082f49"/>
      <text x="320" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">32-bit Signed</text>
      <text x="12" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">Legacy 4-state signed integer for loop counters &amp; indices</text>
    </g>

    <!-- Row 3: time -->
    <g transform="translate(14, 188)">
      <rect width="396" height="58" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12.5" font-weight="700" fill="#38bdf8">time</text>
      <rect x="256" y="8" width="128" height="20" rx="4" fill="#082f49"/>
      <text x="320" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">64-bit Unsigned</text>
      <text x="12" y="44" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">Stores 4-state simulation timestamps returned by $time</text>
    </g>
  </g>

  <!-- Right Card: 2-State Types -->
  <g transform="translate(472, 78)">
    <rect width="424" height="264" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.8" filter="url(#shadowCh4A)"/>
    <rect width="424" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="424" height="12" fill="#065f46"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#d1fae5" text-anchor="middle">2-State Types (0, 1) — Default Init: '0</text>

    <!-- Row 1: bit -->
    <g transform="translate(14, 52)">
      <rect width="396" height="44" rx="6" fill="#072c22" stroke="#065f46"/>
      <text x="12" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">bit [N-1:0]</text>
      <text x="145" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">1+ bits, Unsigned</text>
      <text x="384" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="end">Flags &amp; vectors</text>
    </g>

    <!-- Row 2: byte & shortint -->
    <g transform="translate(14, 102)">
      <rect width="396" height="44" rx="6" fill="#072c22" stroke="#065f46"/>
      <text x="12" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">byte / shortint</text>
      <text x="145" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">8-bit / 16-bit Signed</text>
      <text x="384" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="end">Payloads &amp; offsets</text>
    </g>

    <!-- Row 3: int & longint -->
    <g transform="translate(14, 152)">
      <rect width="396" height="44" rx="6" fill="#072c22" stroke="#065f46"/>
      <text x="12" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">int / longint</text>
      <text x="145" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">32-bit / 64-bit Signed</text>
      <text x="384" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="end">TB counters &amp; addrs</text>
    </g>

    <!-- Row 4: shortreal / real / realtime -->
    <g transform="translate(14, 202)">
      <rect width="396" height="44" rx="6" fill="#072c22" stroke="#065f46"/>
      <text x="12" y="27" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">shortreal / real</text>
      <text x="145" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#e2e8f0">32-bit / 64-bit Float</text>
      <text x="384" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fca5a5" text-anchor="end">X/Z becomes 0!</text>
    </g>
  </g>

  <!-- Bottom Banner: Signed vs Unsigned Bit Interpretation -->
  <g transform="translate(24, 358)">
    <rect width="872" height="62" rx="10" fill="#131d33" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadowCh4A)"/>
    <text x="20" y="26" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#fbbf24">Signedness Changes Numeric Interpretation of Identical Bits:</text>
    <text x="20" y="47" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">8'b1111_1111 (8'hFF)  ──▶  <tspan fill="#38bdf8" font-weight="700">logic [7:0]</tspan> (unsigned) = <tspan fill="#7dd3fc" font-weight="700">255</tspan>   |   <tspan fill="#34d399" font-weight="700">logic signed [7:0] / byte</tspan> = <tspan fill="#6ee7b7" font-weight="700">-1</tspan></text>
  </g>
</svg>
