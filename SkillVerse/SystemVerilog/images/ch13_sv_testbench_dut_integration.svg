<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh13D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh13D" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan13D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen13D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh13D)"/>

  <!-- Title -->
  <text x="460" y="32" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Testbench-to-DUT Integration: Clock/Reset Drivers, Polarity Adaptation &amp; Checkers</text>
  <text x="460" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Top-level portless testbench module encapsulates simulation-only drivers and instantiates the synthesizable DUT</text>

  <!-- Outer Testbench Container -->
  <g transform="translate(24, 72)">
    <rect width="872" height="306" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.8" stroke-dasharray="6,3" filter="url(#shadowCh13D)"/>
    <rect width="872" height="34" rx="12" fill="#581c87"/>
    <rect x="0" y="22" width="872" height="12" fill="#581c87"/>
    <text x="436" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#f3e8ff" text-anchor="middle">module sensor_subsystem_tb;  (Portless Simulation Environment | timeunit 1ns / 1ps)</text>

    <!-- Left: Testbench Stimulus Drivers -->
    <g transform="translate(18, 50)">
      <rect width="268" height="238" rx="9" fill="#1e1035" stroke="#9333ea"/>
      <text x="134" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e9d5ff" text-anchor="middle">Simulation-Only Drivers (initial)</text>

      <rect x="12" y="36" width="244" height="58" rx="6" fill="#091526" stroke="#38bdf8"/>
      <text x="22" y="54" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1. Clock Generator (100 MHz)</text>
      <text x="22" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#e2e8f0">tb_clk_100MHz = 0;</text>
      <text x="22" y="86" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#7dd3fc">forever #5 tb_clk = ~tb_clk;</text>

      <rect x="12" y="102" width="244" height="64" rx="6" fill="#091526" stroke="#f59e0b"/>
      <text x="22" y="120" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">2. Reset Polarity Adaptation</text>
      <text x="22" y="138" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#fde68a">tb_system_reset = 1; #20 = 0;</text>
      <text x="22" y="155" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a7f3d0">.system_reset_n(~tb_reset)</text>

      <rect x="12" y="174" width="244" height="52" rx="6" fill="#091526" stroke="#10b981"/>
      <text x="22" y="192" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">3. ADC Stimulus + $finish</text>
      <text x="22" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#e2e8f0">tb_adc_in = 16'h1234; #200 $finish;</text>
    </g>

    <!-- Arrows TB Drivers -> DUT -->
    <line x1="288" y1="120" x2="328" y2="120" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan13D)"/>
    <line x1="288" y1="170" x2="328" y2="170" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan13D)"/>
    <line x1="288" y1="220" x2="328" y2="220" stroke="#38bdf8" stroke-width="2.2" marker-end="url(#arrowCyan13D)"/>

    <!-- Center: Synthesizable DUT -->
    <g transform="translate(332, 68)">
      <rect width="232" height="196" rx="9" fill="#0c1c2e" stroke="#38bdf8" stroke-width="2"/>
      <rect width="232" height="34" rx="9" fill="#075985"/>
      <rect x="0" y="22" width="232" height="12" fill="#075985"/>
      <text x="116" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">sensor_subsystem_module dut</text>

      <text x="16" y="58" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#7dd3fc">.core_system_clk(tb_clk_100MHz)</text>
      <text x="16" y="84" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fde68a">.system_reset_n(~tb_system_reset)</text>
      <text x="16" y="110" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#e2e8f0">.analog_sensor_adc_data(...)</text>
      <text x="16" y="138" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">.processed_sensor_data_output(...)</text>

      <rect x="16" y="154" width="200" height="28" rx="5" fill="#072c22" stroke="#10b981"/>
      <text x="116" y="172" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">Synthesizable RTL Boundary</text>
    </g>

    <!-- Arrow DUT -> Checker -->
    <line x1="566" y1="168" x2="606" y2="168" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen13D)"/>

    <!-- Right: Verification & Checkers -->
    <g transform="translate(610, 50)">
      <rect width="244" height="238" rx="9" fill="#072c22" stroke="#10b981"/>
      <text x="122" y="22" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#d1fae5" text-anchor="middle">Verification &amp; Self-Checking</text>

      <rect x="12" y="38" width="220" height="58" rx="6" fill="#091526" stroke="#10b981"/>
      <text x="22" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Display &amp; Waveforms</text>
      <text x="22" y="76" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#e2e8f0">$display("[%0t] Out=%h", ...);</text>

      <rect x="12" y="106" width="220" height="58" rx="6" fill="#091526" stroke="#38bdf8"/>
      <text x="22" y="124" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Scoreboard / Ref Model</text>
      <text x="22" y="144" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#e2e8f0">Compare actual vs expected queue</text>

      <rect x="12" y="174" width="220" height="52" rx="6" fill="#091526" stroke="#a855f7"/>
      <text x="22" y="192" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Assertions &amp; Pass/Fail</text>
      <text x="22" y="212" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#f3e8ff">assert (actual == expected);</text>
    </g>
  </g>
</svg>