<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh10D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh10D" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="410" rx="14" fill="url(#bgGradCh10D)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">The join_none Loop Variable Trap vs. Per-Iteration Automatic Capture</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Children spawned with join_none wait until the parent blocks — after the loop counter has already reached 3</text>

  <!-- Left Panel: Buggy Shared Loop Variable -->
  <g transform="translate(24, 78)">
    <rect width="424" height="308" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.8" filter="url(#shadowCh10D)"/>
    <rect width="424" height="38" rx="10" fill="#881337"/>
    <rect x="0" y="26" width="424" height="12" fill="#881337"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#ffe4e6" text-anchor="middle">✗ Buggy: All Children Read Shared Loop Variable 'i'</text>

    <rect x="14" y="50" width="396" height="106" rx="6" fill="#2a0a14" stroke="#e11d48"/>
    <text x="24" y="70" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">for (int i = 0; i &lt; 3; i++) begin</text>
    <text x="36" y="88" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#fda4af">fork</text>
    <text x="48" y="106" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fb7185">#1 $display("Worker %0d", i);  // Reads shared i!</text>
    <text x="36" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#fda4af">join_none</text>
    <text x="24" y="142" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">end</text>

    <!-- Execution Trace -->
    <rect x="14" y="168" width="396" height="126" rx="6" fill="#091526" stroke="#1e3a5f"/>
    <text x="24" y="189" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fb7185">Why It Fails at Runtime:</text>
    <text x="24" y="209" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">1. Loop finishes all 3 passes in 0 time (<tspan font-family="'JetBrains Mono', Consolas, monospace" fill="#fda4af">i</tspan> becomes <tspan font-weight="700" fill="#fb7185">3</tspan>).</text>
    <text x="24" y="227" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">2. Parent hits 'wait fork;', letting all 3 children start.</text>
    <text x="24" y="245" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">3. All 3 threads reference the SAME variable 'i' == 3.</text>
    <rect x="24" y="258" width="376" height="26" rx="4" fill="#4c0519"/>
    <text x="212" y="275" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fecdd3" text-anchor="middle">Output: Worker 3   Worker 3   Worker 3</text>
  </g>

  <!-- Right Panel: Automatic Capture -->
  <g transform="translate(472, 78)">
    <rect width="424" height="308" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh10D)"/>
    <rect width="424" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="424" height="12" fill="#065f46"/>
    <text x="212" y="24" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#d1fae5" text-anchor="middle">✓ Safe: Per-Iteration 'automatic' Variable Capture</text>

    <rect x="14" y="50" width="396" height="114" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="24" y="69" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">for (int i = 0; i &lt; 3; i++) begin</text>
    <text x="36" y="87" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">automatic int idx = i;  // Private copy per pass</text>
    <text x="36" y="105" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#a7f3d0">fork</text>
    <text x="48" y="123" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">#1 $display("Worker %0d", idx);</text>
    <text x="36" y="141" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#a7f3d0">join_none</text>
    <text x="24" y="156" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0">end</text>

    <!-- Execution Trace -->
    <rect x="14" y="176" width="396" height="118" rx="6" fill="#091526" stroke="#1e3a5f"/>
    <text x="24" y="197" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Why It Works:</text>
    <text x="24" y="217" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Each iteration allocates its own automatic variable 'idx'.</text>
    <text x="24" y="235" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">• Child 0 captures idx=0, Child 1 gets idx=1, Child 2 gets idx=2.</text>
    <rect x="24" y="250" width="376" height="26" rx="4" fill="#064e3b"/>
    <text x="212" y="267" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#d1fae5" text-anchor="middle">Output: Worker 0   Worker 1   Worker 2</text>
  </g>
</svg>