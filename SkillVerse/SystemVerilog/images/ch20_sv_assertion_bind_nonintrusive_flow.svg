<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh20D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh20D" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen20D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowCyan20D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="390" rx="14" fill="url(#bgGradCh20D)"/>

  <!-- Title -->
  <text x="460" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Non-Intrusive Assertion Injection with SystemVerilog bind</text>
  <text x="460" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Attach protocol checkers to frozen RTL modules or specific instances without editing RTL files</text>

  <!-- Left Box: Design Under Test (Untouched RTL) -->
  <g transform="translate(24, 74)">
    <rect width="384" height="222" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh20D)"/>
    <rect width="384" height="36" rx="10" fill="#78350f"/>
    <rect x="0" y="24" width="384" height="12" fill="#78350f"/>
    <text x="192" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">Target RTL Scope (Unmodified IP)</text>

    <rect x="18" y="52" width="348" height="152" rx="8" fill="#1e1b18" stroke="#d97706"/>
    <text x="30" y="75" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#fbbf24">module fifo #(DEPTH = 16) (...);</text>
    <text x="30" y="98" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fde68a">  // Internal &amp; port signals:</text>
    <text x="30" y="118" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">  clk, rst_n, wr_en, rd_en</text>
    <text x="30" y="136" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#e2e8f0">  full, empty, ptr_count</text>
    <text x="30" y="162" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Instance inside top_module:</text>
    <text x="30" y="182" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#fcd34d">  top_module.fifo_instance</text>
  </g>

  <!-- Right Box: External Assertion Module -->
  <g transform="translate(496, 74)">
    <rect width="400" height="222" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh20D)"/>
    <rect width="400" height="36" rx="10" fill="#065f46"/>
    <rect x="0" y="24" width="400" height="12" fill="#065f46"/>
    <text x="200" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">Standalone Checker Module (SVA IP)</text>

    <rect x="18" y="52" width="364" height="152" rx="8" fill="#072c22" stroke="#10b981"/>
    <text x="30" y="75" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">module fifo_assertions #(DEPTH_ASSERT) (...);</text>
    <text x="30" y="98" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d1fae5">  // Input-only checker ports</text>
    <text x="30" y="120" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a7f3d0">  assert property (@(posedge clk)</text>
    <text x="30" y="138" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#a7f3d0">    disable iff (!rst_n) !(wr_en &amp;&amp; full));</text>
    <text x="30" y="166" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#6ee7b7">Can also observe internal RTL signals</text>
    <text x="30" y="184" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#6ee7b7">(e.g. ptr_count) when bound to target scope!</text>
  </g>

  <!-- Arrow connecting RTL scope to Checker -->
  <path d="M 408 185 L 490 185" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen20D)"/>
  <text x="449" y="174" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Injects</text>

  <!-- Bottom Banner: bind Statement Forms -->
  <g transform="translate(24, 312)">
    <rect width="872" height="58" rx="9" fill="#0c1c2e" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadowCh20D)"/>
    <text x="20" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">Target ONE instance:  bind fifo : top_module.fifo_instance fifo_assertions #(.DEPTH_ASSERT(16)) chk (.*);</text>
    <text x="20" y="45" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">Target ALL instances: bind fifo                        fifo_assertions #(.DEPTH_ASSERT(16)) chk (.*);</text>
  </g>
</svg>
