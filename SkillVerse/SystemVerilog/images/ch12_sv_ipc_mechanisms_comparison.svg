<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh12D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh12D" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh12D)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Choosing the Right SystemVerilog IPC Primitive: Mailbox vs. Semaphore vs. Event</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Select the simplest IPC mechanism that satisfies your data-transfer, resource-locking, or signaling requirement</text>

  <!-- Column 1: Mailbox -->
  <g transform="translate(24, 80)">
    <rect width="278" height="296" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh12D)"/>
    <rect width="278" height="38" rx="10" fill="#075985"/>
    <rect x="0" y="26" width="278" height="12" fill="#075985"/>
    <text x="139" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#e0f2fe" text-anchor="middle">mailbox #(T)</text>

    <g transform="translate(12, 52)">
      <rect width="254" height="58" rx="6" fill="#0c1c2e" stroke="#0284c7"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Core Role: Data + Sync FIFO</text>
      <text x="10" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Transfers typed transactions in order.</text>
    </g>

    <g transform="translate(12, 120)">
      <rect width="254" height="82" rx="6" fill="#091526" stroke="#1e3a5f"/>
      <text x="10" y="19" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">IEEE 1800 Methods:</text>
      <text x="10" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fbbf24">Blocking: put, get, peek</text>
      <text x="10" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">Non-block: try_put, try_get,</text>
      <text x="74" y="72" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">try_peek, num</text>
    </g>

    <g transform="translate(12, 212)">
      <rect width="254" height="70" rx="6" fill="#0c1c2e" stroke="#0369a1"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Best Verification Fit:</text>
      <text x="10" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Generator -&gt; Driver pipelines,</text>
      <text x="10" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Monitor -&gt; Scoreboard streams</text>
    </g>
  </g>

  <!-- Column 2: Semaphore -->
  <g transform="translate(321, 80)">
    <rect width="278" height="296" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.8" filter="url(#shadowCh12D)"/>
    <rect width="278" height="38" rx="10" fill="#581c87"/>
    <rect x="0" y="26" width="278" height="12" fill="#581c87"/>
    <text x="139" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#f3e8ff" text-anchor="middle">semaphore</text>

    <g transform="translate(12, 52)">
      <rect width="254" height="58" rx="6" fill="#1e1035" stroke="#9333ea"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#d8b4fe">Core Role: Key / Mutex Pool</text>
      <text x="10" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Arbitrates N shared access permits.</text>
    </g>

    <g transform="translate(12, 120)">
      <rect width="254" height="82" rx="6" fill="#091526" stroke="#3b0764"/>
      <text x="10" y="19" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff">IEEE 1800 Methods:</text>
      <text x="10" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fbbf24">Blocking: get(keyCount=1)</text>
      <text x="10" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">Non-block: try_get, put</text>
      <text x="10" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fda4af">(No built-in .num() method)</text>
    </g>

    <g transform="translate(12, 212)">
      <rect width="254" height="70" rx="6" fill="#1e1035" stroke="#7e22ce"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">Best Verification Fit:</text>
      <text x="10" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Shared bus/memory port mutexes,</text>
      <text x="10" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">throttling N parallel worker slots</text>
    </g>
  </g>

  <!-- Column 3: Event -->
  <g transform="translate(618, 80)">
    <rect width="278" height="296" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh12D)"/>
    <rect width="278" height="38" rx="10" fill="#065f46"/>
    <rect x="0" y="26" width="278" height="12" fill="#065f46"/>
    <text x="139" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#d1fae5" text-anchor="middle">event</text>

    <g transform="translate(12, 52)">
      <rect width="254" height="58" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Core Role: Zero-Data Trigger</text>
      <text x="10" y="40" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Signals phase or handshake timing.</text>
    </g>

    <g transform="translate(12, 120)">
      <rect width="254" height="82" rx="6" fill="#091526" stroke="#065f46"/>
      <text x="10" y="19" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">IEEE 1800 Operations:</text>
      <text x="10" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fbbf24">Wait: @(ev), wait(ev.triggered)</text>
      <text x="10" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#6ee7b7">Trigger: -&gt; ev, -&gt;&gt; ev (NBA)</text>
      <text x="10" y="72" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fde68a">.triggered valid in trigger slot only</text>
    </g>

    <g transform="translate(12, 212)">
      <rect width="254" height="70" rx="6" fill="#072c22" stroke="#059669"/>
      <text x="10" y="20" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Best Verification Fit:</text>
      <text x="10" y="39" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Reset/config done notifications,</text>
      <text x="10" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">barrier handshakes between blocks</text>
    </g>
  </g>
</svg>