<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh6B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh6B" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="430" rx="14" fill="url(#bgGradCh6B)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">SystemVerilog Array Manipulation Methods: Return Types &amp; Side Effects</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Know whether a method returns a new queue [$], mutates the array in place, or returns a scalar value</text>

  <!-- Column 1: Locator & Filter Methods -->
  <g transform="translate(24, 78)">
    <rect width="278" height="328" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh6B)"/>
    <rect width="278" height="44" rx="10" fill="#075985"/>
    <rect x="0" y="30" width="278" height="14" fill="#075985"/>
    <text x="139" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">1. Locator &amp; Filter Methods</text>
    <text x="139" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#bae6fd" text-anchor="middle">Return Queue [$]  •  Source Unchanged</text>

    <g transform="translate(12, 56)">
      <rect width="254" height="62" rx="6" fill="#0c1e35" stroke="#0284c7"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">.find() / .find_first() / .find_last()</text>
      <text x="10" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Returns queue of matching elements</text>
      <text x="10" y="53" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">(Empty queue if no element satisfies with)</text>
    </g>

    <g transform="translate(12, 126)">
      <rect width="254" height="58" rx="6" fill="#0c1e35" stroke="#0284c7"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">.find_index() / _first_index / _last</text>
      <text x="10" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Returns queue of matching indices</text>
      <text x="10" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Works on string/key indices in assoc.</text>
    </g>

    <g transform="translate(12, 192)">
      <rect width="254" height="58" rx="6" fill="#0c1e35" stroke="#0284c7"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38bdf8">.min() / .max() / .unique()</text>
      <text x="10" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Return queue [$] (even .min() &amp; .max()!)</text>
      <text x="10" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">.unique_index() returns first-seen indices</text>
    </g>

    <rect x="12" y="262" width="254" height="54" rx="6" fill="#091526" stroke="#1e3a5f"/>
    <text x="139" y="282" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="middle">Supported Array Kinds</text>
    <text x="139" y="301" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Fixed-Size • Dynamic • Queue • Associative</text>
  </g>

  <!-- Column 2: Ordering Methods -->
  <g transform="translate(321, 78)">
    <rect width="278" height="328" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh6B)"/>
    <rect width="278" height="44" rx="10" fill="#78350f"/>
    <rect x="0" y="30" width="278" height="14" fill="#78350f"/>
    <text x="139" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#fef3c7" text-anchor="middle">2. Ordering Methods</text>
    <text x="139" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fde68a" text-anchor="middle">Mutate In-Place (void)  •  No Copy</text>

    <g transform="translate(12, 56)">
      <rect width="254" height="68" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24">.sort(x) with (key_expr)</text>
      <text x="10" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Sorts ascending by element or key expr</text>
      <text x="10" y="55" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#fde68a">e.g. names.sort(x) with (x.len());</text>
    </g>

    <g transform="translate(12, 132)">
      <rect width="254" height="58" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24">.rsort(x) with (key_expr)</text>
      <text x="10" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Sorts descending by element or key expr</text>
      <text x="10" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">Default iterator name is 'item' if omitted</text>
    </g>

    <g transform="translate(12, 198)">
      <rect width="254" height="52" rx="6" fill="#181208" stroke="#b45309"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24">.reverse()  /  .shuffle()</text>
      <text x="10" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Reverses or randomly permutes in place</text>
    </g>

    <rect x="12" y="262" width="254" height="54" rx="6" fill="#2a1505" stroke="#92400e"/>
    <text x="139" y="282" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Supported Array Kinds</text>
    <text x="139" y="301" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fda4af" text-anchor="middle">Fixed • Dynamic • Queue  (NOT Assoc.)</text>
  </g>

  <!-- Column 3: Reduction Methods -->
  <g transform="translate(618, 78)">
    <rect width="278" height="328" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh6B)"/>
    <rect width="278" height="44" rx="10" fill="#065f46"/>
    <rect x="0" y="30" width="278" height="14" fill="#065f46"/>
    <text x="139" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#d1fae5" text-anchor="middle">3. Reduction Methods</text>
    <text x="139" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#a7f3d0" text-anchor="middle">Return Scalar Value  •  Source Unchanged</text>

    <g transform="translate(12, 56)">
      <rect width="254" height="68" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34d399">.sum()  /  .product()</text>
      <text x="10" y="38" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Sums or multiplies all array elements</text>
      <text x="10" y="55" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a7f3d0">Widen: arr.sum(x) with (int'(x))</text>
    </g>

    <g transform="translate(12, 132)">
      <rect width="254" height="64" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="10" y="19" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34d399">.and()  /  .or()  /  .xor()</text>
      <text x="10" y="37" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e2e8f0">Element-wise bitwise reduction</text>
      <text x="10" y="53" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#a7f3d0">arr[0] ^ arr[1] ^ ... ^ arr[N-1]</text>
    </g>

    <g transform="translate(12, 204)">
      <rect width="254" height="46" rx="6" fill="#072c22" stroke="#10b981"/>
      <text x="10" y="19" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Chainable after Locators:</text>
      <text x="10" y="37" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#e2e8f0">arr.unique().sum();  // Queue -> int</text>
    </g>

    <rect x="12" y="262" width="254" height="54" rx="6" fill="#052e23" stroke="#047857"/>
    <text x="139" y="282" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Supported Array Kinds</text>
    <text x="139" y="301" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1" text-anchor="middle">Fixed-Size • Dynamic • Queue • Associative</text>
  </g>
</svg>