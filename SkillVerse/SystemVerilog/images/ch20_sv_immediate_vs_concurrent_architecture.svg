<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh20A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh20A" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCyan20A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen20A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="920" height="410" rx="14" fill="url(#bgGradCh20A)"/>

  <!-- Title -->
  <text x="460" y="30" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Immediate vs. Concurrent SVA Architecture &amp; Scheduling Regions</text>
  <text x="460" y="50" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Compare procedural snapshot assertions with clock-sampled temporal SVA verification</text>

  <!-- Left Panel: Immediate & Deferred Assertions -->
  <g transform="translate(24, 72)">
    <rect width="416" height="314" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh20A)"/>
    <rect width="416" height="36" rx="10" fill="#78350f"/>
    <rect x="0" y="24" width="416" height="12" fill="#78350f"/>
    <text x="208" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#fef3c7" text-anchor="middle">Immediate &amp; Deferred Assertions (Procedural)</text>

    <rect x="14" y="48" width="388" height="72" rx="7" fill="#1e1b18" stroke="#d97706"/>
    <text x="24" y="68" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#fbbf24">Simple Immediate: assert (expr)</text>
    <text x="24" y="88" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#fde68a">Evaluated immediately at execution in Active region.</text>
    <text x="24" y="106" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#fda4af">Caution: can false-fire on transient zero-time combinational glitches.</text>

    <rect x="14" y="132" width="388" height="84" rx="7" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="24" y="152" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#38bdf8">Observed Deferred: assert #0 (expr)</text>
    <text x="24" y="172" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#e0f2fe">Condition evaluated inline, action deferred to Observed/Reactive</text>
    <text x="24" y="188" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#7dd3fc">and flushed if re-triggered within the same time step (glitch-free).</text>
    <text x="24" y="205" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#94a3b8">Final Deferred: assert final (expr) -&gt; Postponed region</text>

    <rect x="14" y="228" width="388" height="72" rx="7" fill="#0f172a" stroke="#475569"/>
    <text x="24" y="248" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0">Allowed Context:</text>
    <text x="24" y="266" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#cbd5e1">always_comb, always_ff, initial, task, function</text>
    <text x="24" y="286" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#94a3b8">No temporal operators (##n, |->) allowed inside immediate assertions.</text>
  </g>

  <!-- Right Panel: Concurrent Assertions -->
  <g transform="translate(460, 72)">
    <rect width="436" height="314" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh20A)"/>
    <rect width="436" height="36" rx="10" fill="#065f46"/>
    <rect x="0" y="24" width="436" height="12" fill="#065f46"/>
    <text x="218" y="23" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">Concurrent Assertions (Clocked &amp; Race-Free)</text>

    <!-- 4-layer stack -->
    <text x="218" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">4-Layer Abstraction Hierarchy</text>

    <rect x="34" y="66" width="368" height="30" rx="5" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="218" y="85" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#e0f2fe" text-anchor="middle">1. Boolean Layer: req &amp;&amp; !stall, $rose(valid)</text>

    <rect x="34" y="102" width="368" height="30" rx="5" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="218" y="121" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#e0e7ff" text-anchor="middle">2. Sequence Layer: seq s_hs; req ##[1:3] ack; endsequence</text>

    <rect x="34" y="138" width="368" height="30" rx="5" fill="#27172b" stroke="#ec4899"/>
    <text x="218" y="157" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fbcfe8" text-anchor="middle">3. Property Layer: @(posedge clk) disable iff(!rst_n) ...</text>

    <rect x="34" y="174" width="368" height="30" rx="5" fill="#072c22" stroke="#34d399"/>
    <text x="218" y="193" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#d1fae5" text-anchor="middle">4. Verification Directive: assert / assume / cover property</text>

    <!-- Scheduling Regions -->
    <text x="218" y="224" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">IEEE 1800 Race-Free Evaluation Regions</text>

    <rect x="16" y="236" width="124" height="64" rx="6" fill="#0c1c2e" stroke="#38bdf8"/>
    <text x="78" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Preponed</text>
    <text x="78" y="274" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#bae6fd" text-anchor="middle">Sample inputs BEFORE</text>
    <text x="78" y="289" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#bae6fd" text-anchor="middle">RTL Active/NBA runs</text>

    <path d="M 140 268 L 154 268" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen20A)"/>

    <rect x="158" y="236" width="120" height="64" rx="6" fill="#072c22" stroke="#10b981"/>
    <text x="218" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">Observed</text>
    <text x="218" y="274" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Evaluate sequences</text>
    <text x="218" y="289" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">&amp; property state</text>

    <path d="M 278 268 L 292 268" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen20A)"/>

    <rect x="296" y="236" width="124" height="64" rx="6" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="358" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#c7d2fe" text-anchor="middle">Reactive</text>
    <text x="358" y="274" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">Execute pass / fail</text>
    <text x="358" y="289" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">action blocks safely</text>
  </g>
</svg>
