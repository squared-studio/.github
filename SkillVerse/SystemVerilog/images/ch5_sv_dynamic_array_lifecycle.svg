<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh5C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh5C" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowCh5C" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#818cf8" />
    </marker>
  </defs>

  <rect width="920" height="400" rx="14" fill="url(#bgGradCh5C)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">Dynamic Array Runtime Lifecycle: Declare, Allocate, Resize &amp; Delete</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Memory is managed explicitly at simulation time using new[], copy-resize constructors, and .delete()</text>

  <!-- Stage 1: Declare -->
  <g transform="translate(24, 82)">
    <rect width="422" height="128" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.6" filter="url(#shadowCh5C)"/>
    <rect width="422" height="32" rx="10" fill="#1e293b"/>
    <rect x="0" y="20" width="422" height="12" fill="#1e293b"/>
    <text x="16" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">1. Declare (Unallocated)</text>
    <text x="406" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="end">size() == 0</text>

    <rect x="14" y="44" width="394" height="28" rx="5" fill="#09111e" stroke="#334155"/>
    <text x="24" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#cbd5e1">int packet_buffer [];</text>

    <rect x="14" y="82" width="120" height="32" rx="5" fill="#020617" stroke="#475569" stroke-dasharray="4,3"/>
    <text x="74" y="102" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">[ null / empty ]</text>
    <text x="146" y="96" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">No storage allocated yet.</text>
    <text x="146" y="112" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fca5a5">Indexing before new[] is out-of-bounds!</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="448" y1="146" x2="470" y2="146" stroke="#818cf8" stroke-width="2.2" marker-end="url(#arrowCh5C)"/>

  <!-- Stage 2: Allocate -->
  <g transform="translate(474, 82)">
    <rect width="422" height="128" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6" filter="url(#shadowCh5C)"/>
    <rect width="422" height="32" rx="10" fill="#075985"/>
    <rect x="0" y="20" width="422" height="12" fill="#075985"/>
    <text x="16" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#e0f2fe">2. Initial Allocation via new[]</text>
    <text x="406" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#7dd3fc" text-anchor="end">size() == 4</text>

    <rect x="14" y="44" width="394" height="28" rx="5" fill="#0c1e35" stroke="#0284c7"/>
    <text x="24" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">packet_buffer = new[4];  // '{10, 20, 30, 40}</text>

    <!-- 4 slots -->
    <g transform="translate(14, 82)">
      <rect x="0" y="0" width="68" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="34" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[0]</text>
      <text x="34" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">10</text>

      <rect x="74" y="0" width="68" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="108" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[1]</text>
      <text x="108" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">20</text>

      <rect x="148" y="0" width="68" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="182" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[2]</text>
      <text x="182" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">30</text>

      <rect x="222" y="0" width="68" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="256" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[3]</text>
      <text x="256" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">40</text>

      <text x="302" y="14" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Default init</text>
      <text x="302" y="29" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">is 0 (int) / 'x</text>
    </g>
  </g>

  <!-- Vertical flow arrow 2 -> 3 -->
  <path d="M 685 212 L 685 224 L 235 224 L 235 236" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowCh5C)"/>

  <!-- Stage 3: Copy & Resize -->
  <g transform="translate(24, 240)">
    <rect width="496" height="136" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadowCh5C)"/>
    <rect width="496" height="32" rx="10" fill="#065f46"/>
    <rect x="0" y="20" width="496" height="12" fill="#065f46"/>
    <text x="16" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#d1fae5">3. Preserve &amp; Resize via new[M](old_arr)</text>
    <text x="480" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="end">size() == 6</text>

    <rect x="14" y="42" width="468" height="28" rx="5" fill="#072c22" stroke="#10b981"/>
    <text x="24" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">packet_buffer = new[6](packet_buffer);  // Copies [0..3]</text>

    <!-- 6 slots: 4 copied + 2 new -->
    <g transform="translate(14, 78)">
      <rect x="0" y="0" width="72" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="36" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[0]</text>
      <text x="36" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">10</text>

      <rect x="78" y="0" width="72" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="114" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[1]</text>
      <text x="114" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">20</text>

      <rect x="156" y="0" width="72" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="192" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[2]</text>
      <text x="192" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">30</text>

      <rect x="234" y="0" width="72" height="34" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="270" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#7dd3fc" text-anchor="middle">[3]</text>
      <text x="270" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#f8fafc" text-anchor="middle">40</text>

      <rect x="312" y="0" width="72" height="34" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="348" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#6ee7b7" text-anchor="middle">[4] new</text>
      <text x="348" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">0</text>

      <rect x="390" y="0" width="72" height="34" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="426" y="13" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#6ee7b7" text-anchor="middle">[5] new</text>
      <text x="426" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#a7f3d0" text-anchor="middle">0</text>
    </g>
    <text x="14" y="127" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Note: Plain <tspan font-family="'JetBrains Mono', Consolas, monospace" fill="#fbbf24">new[6]</tspan> without <tspan font-family="'JetBrains Mono', Consolas, monospace" fill="#fbbf24">(packet_buffer)</tspan> discards old contents!</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="522" y1="308" x2="544" y2="308" stroke="#818cf8" stroke-width="2.2" marker-end="url(#arrowCh5C)"/>

  <!-- Stage 4: Delete -->
  <g transform="translate(548, 240)">
    <rect width="348" height="136" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.6" filter="url(#shadowCh5C)"/>
    <rect width="348" height="32" rx="10" fill="#881337"/>
    <rect x="0" y="20" width="348" height="12" fill="#881337"/>
    <text x="16" y="21" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#ffe4e6">4. Deallocate Memory</text>
    <text x="332" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fda4af" text-anchor="end">size() == 0</text>

    <rect x="14" y="42" width="320" height="28" rx="5" fill="#2a0a14" stroke="#e11d48"/>
    <text x="24" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#fb7185">packet_buffer.delete();</text>

    <text x="14" y="92" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e2e8f0">• Frees simulation heap memory</text>
    <text x="14" y="110" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#e2e8f0">• Equivalent to <tspan font-family="'JetBrains Mono', Consolas, monospace" fill="#fda4af">packet_buffer = '{};</tspan></text>
    <text x="14" y="128" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#94a3b8">Can be re-allocated later with new[K]</text>
  </g>
</svg>