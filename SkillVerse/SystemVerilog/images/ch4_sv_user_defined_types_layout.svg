<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCh4C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadowCh4C" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="920" height="430" rx="14" fill="url(#bgGradCh4C)"/>

  <!-- Title -->
  <text x="460" y="34" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">User-Defined Types: enum, struct packed &amp; union packed</text>
  <text x="460" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Type-safe state encodings, contiguous composite bit vectors, and shared-memory overlays</text>

  <!-- Column 1: enum -->
  <g transform="translate(24, 78)">
    <rect width="276" height="328" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadowCh4C)"/>
    <rect width="276" height="40" rx="10" fill="#075985"/>
    <rect x="0" y="28" width="276" height="12" fill="#075985"/>
    <text x="138" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#e0f2fe" text-anchor="middle">typedef enum logic [2:0]</text>

    <!-- Named State List -->
    <g transform="translate(14, 54)">
      <rect width="248" height="36" rx="6" fill="#0c1e35" stroke="#38bdf8"/>
      <text x="12" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">STATE_IDLE</text>
      <text x="236" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0" text-anchor="end">3'b000</text>
    </g>
    <g transform="translate(14, 98)">
      <rect width="248" height="36" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">STATE_FETCH</text>
      <text x="236" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0" text-anchor="end">3'b001</text>
    </g>
    <g transform="translate(14, 142)">
      <rect width="248" height="36" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">STATE_DECODE</text>
      <text x="236" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0" text-anchor="end">3'b010</text>
    </g>
    <g transform="translate(14, 186)">
      <rect width="248" height="36" rx="6" fill="#0c1e35" stroke="#1e3a5f"/>
      <text x="12" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">STATE_EXECUTE</text>
      <text x="236" y="23" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#e2e8f0" text-anchor="end">3'b011</text>
    </g>

    <rect x="14" y="236" width="248" height="78" rx="6" fill="#080d18" stroke="#1e293b"/>
    <text x="24" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#38bdf8">Key Benefits</text>
    <text x="24" y="276" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Blocks raw integer assignments</text>
    <text x="24" y="294" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• .name(), .next(), .first() helpers</text>
  </g>

  <!-- Column 2: struct packed -->
  <g transform="translate(322, 78)">
    <rect width="276" height="328" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.8" filter="url(#shadowCh4C)"/>
    <rect width="276" height="40" rx="10" fill="#065f46"/>
    <rect x="0" y="28" width="276" height="12" fill="#065f46"/>
    <text x="138" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#d1fae5" text-anchor="middle">typedef struct packed</text>

    <text x="138" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">Contiguous 41-Bit Hardware Vector [40:0]</text>

    <!-- Field 1: address -->
    <g transform="translate(14, 74)">
      <rect width="248" height="44" rx="6" fill="#072c22" stroke="#34d399"/>
      <text x="12" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">address</text>
      <text x="236" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d1fae5" text-anchor="end">Bits [40:33] (8b)</text>
      <text x="12" y="36" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94a3b8">logic [7:0] address;</text>
    </g>

    <!-- Field 2: data -->
    <g transform="translate(14, 124)">
      <rect width="248" height="54" rx="6" fill="#072c22" stroke="#34d399"/>
      <text x="12" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">data</text>
      <text x="236" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d1fae5" text-anchor="end">Bits [32:1] (32b)</text>
      <text x="12" y="42" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#94a3b8">logic [31:0] data;</text>
    </g>

    <!-- Field 3: read_write -->
    <g transform="translate(14, 184)">
      <rect width="248" height="38" rx="6" fill="#072c22" stroke="#34d399"/>
      <text x="12" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" font-weight="700" fill="#34d399">read_write</text>
      <text x="236" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#d1fae5" text-anchor="end">Bit [0] (1b)</text>
    </g>

    <rect x="14" y="236" width="248" height="78" rx="6" fill="#080d18" stroke="#1e293b"/>
    <text x="24" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#34d399">Key Benefits</text>
    <text x="24" y="276" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Dot access: tx.address = 8'h40;</text>
    <text x="24" y="294" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Bit-sliceable &amp; port-friendly</text>
  </g>

  <!-- Column 3: union packed -->
  <g transform="translate(620, 78)">
    <rect width="276" height="328" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadowCh4C)"/>
    <rect width="276" height="40" rx="10" fill="#78350f"/>
    <rect x="0" y="28" width="276" height="12" fill="#78350f"/>
    <text x="138" y="25" font-family="'JetBrains Mono', Consolas, monospace" font-size="13.5" font-weight="700" fill="#fef3c7" text-anchor="middle">typedef union packed</text>

    <text x="138" y="62" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Shared 32-Bit Storage Overlay [31:0]</text>

    <!-- Shared Memory Block -->
    <rect x="14" y="74" width="248" height="148" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-dasharray="5 3"/>

    <rect x="24" y="86" width="228" height="36" rx="5" fill="#451a03" stroke="#fbbf24"/>
    <text x="34" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fde68a">int integer_val</text>
    <text x="242" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fcd34d" text-anchor="end">[31:0]</text>

    <rect x="24" y="130" width="228" height="36" rx="5" fill="#451a03" stroke="#fbbf24"/>
    <text x="34" y="152" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fde68a">shortreal float_val</text>
    <text x="242" y="152" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fcd34d" text-anchor="end">[31:0]</text>

    <rect x="24" y="174" width="228" height="36" rx="5" fill="#451a03" stroke="#fbbf24"/>
    <text x="34" y="196" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#fde68a">logic [31:0] bit_pat</text>
    <text x="242" y="196" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#fcd34d" text-anchor="end">[31:0]</text>

    <rect x="14" y="236" width="248" height="78" rx="6" fill="#080d18" stroke="#1e293b"/>
    <text x="24" y="256" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fbbf24">Caution &amp; Usage</text>
    <text x="24" y="276" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#cbd5e1">• All members share the SAME bits</text>
    <text x="24" y="294" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fca5a5">• Writing one overwrites the others</text>
  </g>
</svg>
