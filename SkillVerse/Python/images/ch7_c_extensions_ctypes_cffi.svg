<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Interfacing Python with Native C / Shared Libraries (FFI)</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Bridging high-level scripts to high-performance C algorithms, drivers, and EDA simulators</text>

  <!-- Left: Python Runtime -->
  <g transform="translate(60, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#0369a1"/>
    <text x="125" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Python High-Level Environment</text>

    <!-- Code Block -->
    <rect x="15" y="48" width="220" height="95" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="68" fill="#38bdf8" font-size="10" font-family="monospace">import ctypes</text>
    <text x="25" y="86" fill="#f8fafc" font-size="10" font-family="monospace">lib = ctypes.CDLL("./driver.so")</text>
    <text x="25" y="104" fill="#94a3b8" font-size="10" font-family="monospace">lib.read_reg.argtypes = [...]</text>
    <text x="25" y="122" fill="#34d399" font-size="10" font-family="monospace">val = lib.read_reg(0x4000)</text>

    <text x="125" y="170" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle">Foreign Function Interface (FFI)</text>
    <text x="125" y="190" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Automatic argument marshalling</text>
    <text x="125" y="205" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">(PyLong -&gt; uint32_t)</text>
  </g>

  <!-- Middle: Bridging Technologies -->
  <g transform="translate(345, 100)">
    <rect width="270" height="230" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="270" height="32" rx="8" fill="#b45309"/>
    <text x="135" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">FFI Bridge Mechanisms</text>

    <rect x="15" y="45" width="240" height="48" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="25" y="65" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">1. ctypes (Built-in Standard Lib)</text>
    <text x="25" y="82" fill="#94a3b8" font-size="9" font-family="sans-serif">Pure dynamic loading via libffi / dlsym</text>

    <rect x="15" y="102" width="240" height="48" rx="4" fill="#0f172a" stroke="#34d399"/>
    <text x="25" y="122" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">2. cffi (C Foreign Function Interface)</text>
    <text x="25" y="139" fill="#94a3b8" font-size="9" font-family="sans-serif">Parses C headers directly; JIT-compiled speed</text>

    <rect x="15" y="160" width="240" height="58" rx="4" fill="#0f172a" stroke="#f43f5e"/>
    <text x="25" y="180" fill="#fda4af" font-size="11" font-weight="bold" font-family="sans-serif">3. Python C-API / pybind11</text>
    <text x="25" y="196" fill="#94a3b8" font-size="9" font-family="sans-serif">Direct native C/C++ extension modules;</text>
    <text x="25" y="209" fill="#94a3b8" font-size="9" font-family="sans-serif">zero-overhead pointer dereferencing</text>
  </g>

  <!-- Right: Native Shared Library -->
  <g transform="translate(650, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#047857"/>
    <text x="125" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Native Shared Object (.so / .dll)</text>

    <rect x="15" y="48" width="220" height="95" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="25" y="68" fill="#a7f3d0" font-size="10" font-family="monospace">uint32_t read_reg(uint32_t addr) {</text>
    <text x="35" y="86" fill="#fde047" font-size="10" font-family="monospace">volatile uint32_t *p = ...;</text>
    <text x="35" y="104" fill="#fde047" font-size="10" font-family="monospace">return *p; // 0 GIL overhead</text>
    <text x="25" y="122" fill="#a7f3d0" font-size="10" font-family="monospace">}</text>

    <text x="125" y="170" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Full Bare-Metal Speed</text>
    <text x="125" y="190" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle">SIMD vectorization, MMIO pointers,</text>
    <text x="125" y="205" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">and hardware register access</text>
  </g>

  <!-- Connectors -->
  <path d="M 310 215 L 340 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 615 215 L 645 215" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Releasing the GIL during Long-Running Native Computations:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Inside C extensions, wrap compute-heavy loops in <tspan font-family="monospace" fill="#34d399">Py_BEGIN_ALLOW_THREADS</tspan> and <tspan font-family="monospace" fill="#34d399">Py_END_ALLOW_THREADS</tspan>.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• This releases the GIL, allowing other Python threads to execute concurrently on other CPU cores while C executes at native speed.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Crucial pattern in hardware verification tools (e.g. Verilator C++ simulations controlled by Python).</text>
  </g>
</svg>
