<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Python List Dynamic Over-Allocation &amp; Growth Pattern</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Amortized O(1) appends via CPython overallocation formula: new_allocated = (size >> 3) + (size &lt; 9 ? 3 : 6) + size</text>

  <!-- Formula Callout -->
  <rect x="50" y="90" width="860" height="52" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="113" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">CPython Growth Rule (listobject.c):</text>
  <text x="70" y="131" fill="#f8fafc" font-size="12" font-family="monospace">new_allocated = (newsize &gt;&gt; 3) + (newsize &lt; 9 ? 3 : 6) + newsize;</text>
  <text x="640" y="122" fill="#34d399" font-size="12" font-family="sans-serif" font-weight="bold">Growth Factor ≈ 1.125x</text>

  <!-- Growth Stages Table / Diagram -->
  <g transform="translate(50, 165)">
    <!-- Header Row -->
    <rect width="860" height="30" fill="#0f172a" rx="4"/>
    <text x="50" y="20" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Elements (len)</text>
    <text x="170" y="20" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Allocated Slots</text>
    <text x="300" y="20" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Unused Slots</text>
    <text x="580" y="20" fill="#94a3b8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Contiguous Heap Pointer Buffer</text>

    <!-- Row 1: len 1 -->
    <g transform="translate(0, 38)">
      <rect width="860" height="32" fill="#1e293b" rx="4"/>
      <text x="50" y="21" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">1</text>
      <text x="170" y="21" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">4</text>
      <text x="300" y="21" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">3</text>
      <!-- Slots -->
      <g transform="translate(420, 5)">
        <rect x="0" y="0" width="30" height="22" fill="#0284c7" stroke="#38bdf8" rx="2"/>
        <text x="15" y="15" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">P0</text>
        <rect x="35" y="0" width="30" height="22" fill="#334155" stroke="#475569" rx="2"/>
        <rect x="70" y="0" width="30" height="22" fill="#334155" stroke="#475569" rx="2"/>
        <rect x="105" y="0" width="30" height="22" fill="#334155" stroke="#475569" rx="2"/>
      </g>
    </g>

    <!-- Row 2: len 5 -->
    <g transform="translate(0, 78)">
      <rect width="860" height="32" fill="#1e293b" rx="4"/>
      <text x="50" y="21" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">5</text>
      <text x="170" y="21" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">8</text>
      <text x="300" y="21" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">3</text>
      <g transform="translate(420, 5)">
        <rect x="0" y="0" width="150" height="22" fill="#0284c7" stroke="#38bdf8" rx="2"/>
        <text x="75" y="15" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">Used: 5 ptrs</text>
        <rect x="155" y="0" width="85" height="22" fill="#334155" stroke="#475569" rx="2"/>
        <text x="197" y="15" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Free: 3</text>
      </g>
    </g>

    <!-- Row 3: len 9 -->
    <g transform="translate(0, 118)">
      <rect width="860" height="32" fill="#1e293b" rx="4"/>
      <text x="50" y="21" fill="#ffffff" font-size="12" font-family="monospace" text-anchor="middle">9</text>
      <text x="170" y="21" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold" text-anchor="middle">16</text>
      <text x="300" y="21" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="middle">7</text>
      <g transform="translate(420, 5)">
        <rect x="0" y="0" width="220" height="22" fill="#0284c7" stroke="#38bdf8" rx="2"/>
        <text x="110" y="15" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">Used: 9 ptrs</text>
        <rect x="225" y="0" width="150" height="22" fill="#334155" stroke="#475569" rx="2"/>
        <text x="300" y="15" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Free: 7 slots</text>
      </g>
    </g>
  </g>

  <!-- Bottom Insight Box -->
  <g transform="translate(50, 345)">
    <rect width="860" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="28" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Performance Engineering Implications:</text>
    <text x="25" y="52" fill="#cbd5e1" font-size="12" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">append() is Amortized O(1)</tspan>: Most appends simply store a pointer into an already-allocated slot. When capacity exhausts, <tspan font-family="monospace">realloc()</tspan> doubles/scales the buffer.</text>
    <text x="25" y="74" fill="#cbd5e1" font-size="12" font-family="sans-serif">• <tspan fill="#f43f5e" font-weight="bold">insert(0, val) is O(N)</tspan>: Inserting at the beginning forces every pointer in the contiguous buffer to shift forward by 8 bytes (memmove).</text>
    <text x="25" y="94" fill="#cbd5e1" font-size="12" font-family="sans-serif">• For high-speed double-ended queues or FIFO buffers, always use <tspan font-family="monospace" fill="#38bdf8">collections.deque</tspan> ($O(1)$ push/pop at both ends).</text>
  </g>
</svg>
