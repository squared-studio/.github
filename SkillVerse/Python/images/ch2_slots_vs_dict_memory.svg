<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Memory Optimization: Default __dict__ vs. __slots__</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Optimizing million-instance classes (such as hardware register nodes or RTL AST tokens)</text>

  <!-- Left: Standard Class with __dict__ -->
  <g transform="translate(60, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="390" height="34" rx="8" fill="#9f1239"/>
    <text x="195" y="23" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Standard Class (Default Dynamic __dict__)</text>

    <text x="20" y="60" fill="#fda4af" font-size="11" font-family="monospace">class Packet:</text>
    <text x="35" y="76" fill="#fda4af" font-size="11" font-family="monospace">def __init__(self, addr, data):</text>
    <text x="50" y="92" fill="#fda4af" font-size="11" font-family="monospace">self.addr = addr; self.data = data</text>

    <!-- Instance Box -->
    <rect x="20" y="110" width="160" height="110" rx="6" fill="#0f172a" stroke="#f43f5e"/>
    <text x="100" y="130" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Instance Object</text>
    <text x="30" y="152" fill="#94a3b8" font-size="10" font-family="monospace">ob_refcnt (8B)</text>
    <text x="30" y="170" fill="#94a3b8" font-size="10" font-family="monospace">ob_type (8B)</text>
    <text x="30" y="195" fill="#f43f5e" font-size="10" font-family="monospace" font-weight="bold">PyObject* __dict__</text>

    <!-- Arrow -->
    <path d="M 180 190 L 220 190" stroke="#f43f5e" stroke-width="2"/>

    <!-- Dict Box -->
    <rect x="225" y="110" width="145" height="110" rx="6" fill="#4c0519" stroke="#f43f5e"/>
    <text x="297" y="130" fill="#fca5a5" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">PyDictObject</text>
    <text x="235" y="152" fill="#fda4af" font-size="9" font-family="monospace">{'addr': 0x10,</text>
    <text x="240" y="168" fill="#fda4af" font-size="9" font-family="monospace"> 'data': 0xFF}</text>
    <text x="297" y="195" fill="#fecdd3" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">~112+ Bytes RAM</text>
    <text x="297" y="210" fill="#fda4af" font-size="9" font-family="sans-serif" text-anchor="middle">Total: ~152 Bytes / obj</text>
  </g>

  <!-- Right: Optimized with __slots__ -->
  <g transform="translate(510, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="390" height="34" rx="8" fill="#047857"/>
    <text x="195" y="23" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Optimized Class (__slots__ Array Layout)</text>

    <text x="20" y="60" fill="#a7f3d0" font-size="11" font-family="monospace">class FastPacket:</text>
    <text x="35" y="76" fill="#a7f3d0" font-size="11" font-family="monospace">__slots__ = ('addr', 'data')</text>
    <text x="35" y="92" fill="#a7f3d0" font-size="11" font-family="monospace">def __init__(self, addr, data): ...</text>

    <!-- Instance Box -->
    <rect x="50" y="110" width="290" height="110" rx="6" fill="#064e3b" stroke="#34d399"/>
    <text x="195" y="130" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Direct C-Style Struct Instance (No __dict__)</text>
    <text x="70" y="152" fill="#a7f3d0" font-size="10" font-family="monospace">ob_refcnt (8 Bytes)</text>
    <text x="70" y="170" fill="#a7f3d0" font-size="10" font-family="monospace">ob_type   (8 Bytes)</text>
    <text x="70" y="188" fill="#34d399" font-size="10" font-family="monospace" font-weight="bold">PyObject* addr (8 Bytes, direct pointer)</text>
    <text x="70" y="206" fill="#34d399" font-size="10" font-family="monospace" font-weight="bold">PyObject* data (8 Bytes, direct pointer)</text>

    <text x="310" y="175" fill="#6ee7b7" font-size="14" font-weight="bold" font-family="sans-serif">48 Bytes</text>
    <text x="310" y="195" fill="#a7f3d0" font-size="10" font-family="sans-serif">68% Savings!</text>
  </g>

  <!-- Bottom Metric Box -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Benchmark Comparison for 10,000,000 Hardware Objects:</text>
    <text x="25" y="48" fill="#fda4af" font-size="12" font-family="sans-serif">• <tspan font-weight="bold">Standard __dict__</tspan>: 10M instances = <tspan font-weight="bold" fill="#f43f5e">~1.52 GB</tspan> RAM consumed. High GC traversal overhead.</text>
    <text x="25" y="68" fill="#a7f3d0" font-size="12" font-family="sans-serif">• <tspan font-weight="bold">With __slots__</tspan>: 10M instances = <tspan font-weight="bold" fill="#34d399">~480 MB</tspan> RAM consumed. Fast direct array indexing descriptor access.</text>
    <text x="25" y="88" fill="#e2e8f0" font-size="11" font-family="sans-serif">• Tradeoff: Classes with <tspan font-family="monospace">__slots__</tspan> cannot have arbitrary runtime attributes dynamically attached unless <tspan font-family="monospace">'__dict__'</tspan> is added to slots.</text>
  </g>
</svg>
