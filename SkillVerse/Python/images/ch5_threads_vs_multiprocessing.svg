<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Concurrency Architectures: Multi-Threading vs. Multi-Processing</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Comparing memory models, GIL boundaries, IPC overhead, and core scalability</text>

  <!-- Left: Multithreading -->
  <g transform="translate(60, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="390" height="32" rx="8" fill="#0369a1"/>
    <text x="195" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">threading (Single OS Process)</text>

    <!-- Process Box -->
    <rect x="20" y="48" width="350" height="70" rx="6" fill="#082f49" stroke="#38bdf8"/>
    <text x="195" y="68" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Shared Virtual Memory Heap</text>
    <text x="195" y="86" fill="#bae6fd" font-size="10" font-family="monospace" text-anchor="middle">Global Variables, PyObjects, Cache</text>
    <rect x="70" y="93" width="250" height="18" rx="3" fill="#be123c"/>
    <text x="195" y="106" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Single Global Interpreter Lock (GIL)</text>

    <!-- Threads inside -->
    <g transform="translate(30, 130)">
      <rect x="0" y="0" width="150" height="50" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="75" y="20" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Thread 1</text>
      <text x="75" y="38" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Private Stack</text>

      <rect x="180" y="0" width="150" height="50" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="255" y="20" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Thread 2</text>
      <text x="255" y="38" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">Private Stack</text>
    </g>

    <text x="195" y="205" fill="#38bdf8" font-size="11" font-family="sans-serif" text-anchor="middle">Communication: Direct memory pointer access</text>
    <text x="195" y="222" fill="#f43f5e" font-size="10" font-family="sans-serif" text-anchor="middle">Hazard: Race conditions, lock contention</text>
  </g>

  <!-- Right: Multiprocessing -->
  <g transform="translate(510, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="390" height="32" rx="8" fill="#047857"/>
    <text x="195" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">multiprocessing (Separate OS Processes)</text>

    <!-- Process 1 -->
    <g transform="translate(20, 48)">
      <rect width="165" height="110" rx="6" fill="#064e3b" stroke="#34d399"/>
      <text x="82" y="22" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Process 1 (PID 101)</text>
      <text x="82" y="42" fill="#a7f3d0" font-size="9" font-family="monospace" text-anchor="middle">Private Memory Heap</text>
      <rect x="20" y="55" width="125" height="18" rx="2" fill="#059669"/>
      <text x="82" y="68" fill="#fff" font-size="9" font-family="sans-serif" text-anchor="middle">Own GIL (100% Core 0)</text>
      <text x="82" y="95" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">Independent CPython VM</text>
    </g>

    <!-- Process 2 -->
    <g transform="translate(205, 48)">
      <rect width="165" height="110" rx="6" fill="#064e3b" stroke="#34d399"/>
      <text x="82" y="22" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Process 2 (PID 102)</text>
      <text x="82" y="42" fill="#a7f3d0" font-size="9" font-family="monospace" text-anchor="middle">Private Memory Heap</text>
      <rect x="20" y="55" width="125" height="18" rx="2" fill="#059669"/>
      <text x="82" y="68" fill="#fff" font-size="9" font-family="sans-serif" text-anchor="middle">Own GIL (100% Core 1)</text>
      <text x="82" y="95" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">Independent CPython VM</text>
    </g>

    <!-- IPC Bridge -->
    <rect x="50" y="170" width="290" height="32" rx="4" fill="#0f172a" stroke="#fbbf24"/>
    <text x="195" y="190" fill="#fbbf24" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">IPC: Queue, Pipe, SharedMemory, or Pickle</text>
    <text x="195" y="222" fill="#34d399" font-size="10" font-family="sans-serif" text-anchor="middle">True parallel CPU multi-core execution (Nx speedup)</text>
  </g>

  <!-- Bottom Metric Box -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Architectural Comparison Summary:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#38bdf8" font-weight="bold">Memory Overhead</tspan>: Threads share memory (~zero incremental heap). Multiprocessing duplicates CPython runtime (~15–30MB per process).</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">Data Serialization Cost</tspan>: Inter-process queues require <tspan font-family="monospace" fill="#fbbf24">pickle</tspan> serialization unless using <tspan font-family="monospace" fill="#34d399">multiprocessing.shared_memory</tspan>.</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#f43f5e" font-weight="bold">Crash Isolation</tspan>: A segmentation fault in one thread crashes the entire process; in multiprocessing, worker faults are cleanly trapped.</text>
  </g>
</svg>
