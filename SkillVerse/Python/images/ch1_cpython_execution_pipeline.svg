<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">CPython Execution Pipeline &amp; Virtual Machine Architecture</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">From Source Code (.py) through Tokenization, AST, Bytecode (.pyc) to CEval Stack Machine</text>

  <!-- Stage 1: Source Code -->
  <g transform="translate(40, 110)">
    <rect width="140" height="180" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <rect width="140" height="32" rx="6" fill="#0369a1"/>
    <text x="70" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Source File (.py)</text>
    <text x="15" y="60" fill="#94a3b8" font-size="11" font-family="monospace">def calc(a, b):</text>
    <text x="30" y="80" fill="#38bdf8" font-size="11" font-family="monospace">res = a + b</text>
    <text x="30" y="100" fill="#38bdf8" font-size="11" font-family="monospace">return res</text>
    <text x="15" y="130" fill="#94a3b8" font-size="11" font-family="monospace">print(calc(2, 3))</text>
    <rect x="15" y="148" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="163" fill="#38bdf8" font-size="10" font-family="sans-serif" text-anchor="middle">UTF-8 Text Stream</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 200 L 220 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="190" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Tokenizer</text>

  <!-- Stage 2: Tokens & Parse Tree -->
  <g transform="translate(225, 110)">
    <rect width="140" height="180" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="140" height="32" rx="6" fill="#4338ca"/>
    <text x="70" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Lexer &amp; Parser</text>
    <text x="15" y="58" fill="#a5b4fc" font-size="10" font-family="monospace">NAME 'def'</text>
    <text x="15" y="76" fill="#a5b4fc" font-size="10" font-family="monospace">NAME 'calc'</text>
    <text x="15" y="94" fill="#a5b4fc" font-size="10" font-family="monospace">LPAR '('</text>
    <text x="15" y="112" fill="#a5b4fc" font-size="10" font-family="monospace">NAME 'a', COMMA</text>
    <text x="15" y="130" fill="#cbd5e1" font-size="10" font-family="sans-serif">PEG Parser (Python 3.9+)</text>
    <rect x="15" y="148" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="163" fill="#a5b4fc" font-size="10" font-family="sans-serif" text-anchor="middle">CST / Tokens</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 365 200 L 405 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="385" y="190" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">AST Gen</text>

  <!-- Stage 3: Abstract Syntax Tree -->
  <g transform="translate(410, 110)">
    <rect width="140" height="180" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="140" height="32" rx="6" fill="#b45309"/>
    <text x="70" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">AST (ast module)</text>
    <text x="15" y="58" fill="#fde047" font-size="10" font-family="monospace">FunctionDef(calc)</text>
    <text x="25" y="76" fill="#fde047" font-size="10" font-family="monospace">- args: a, b</text>
    <text x="25" y="94" fill="#fde047" font-size="10" font-family="monospace">- body: Assign</text>
    <text x="35" y="112" fill="#fde047" font-size="10" font-family="monospace">BinOp(Add)</text>
    <text x="15" y="130" fill="#cbd5e1" font-size="10" font-family="sans-serif">Semantic Verification</text>
    <rect x="15" y="148" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="163" fill="#fde047" font-size="10" font-family="sans-serif" text-anchor="middle">AST Nodes Tree</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 550 200 L 590 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="190" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Compiler</text>

  <!-- Stage 4: Bytecode -->
  <g transform="translate(595, 110)">
    <rect width="140" height="180" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="140" height="32" rx="6" fill="#047857"/>
    <text x="70" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Bytecode (.pyc)</text>
    <text x="15" y="58" fill="#6ee7b7" font-size="10" font-family="monospace">LOAD_FAST 0 (a)</text>
    <text x="15" y="76" fill="#6ee7b7" font-size="10" font-family="monospace">LOAD_FAST 1 (b)</text>
    <text x="15" y="94" fill="#6ee7b7" font-size="10" font-family="monospace">BINARY_OP 0 (+)</text>
    <text x="15" y="112" fill="#6ee7b7" font-size="10" font-family="monospace">STORE_FAST 2 (res)</text>
    <text x="15" y="130" fill="#6ee7b7" font-size="10" font-family="monospace">RETURN_VALUE</text>
    <rect x="15" y="148" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="163" fill="#34d399" font-size="10" font-family="sans-serif" text-anchor="middle">Code Object (co_code)</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 735 200 L 775 200" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="755" y="190" fill="#34d399" font-size="10" font-family="sans-serif" text-anchor="middle">VM Eval</text>

  <!-- Stage 5: Virtual Machine -->
  <g transform="translate(780, 110)">
    <rect width="140" height="180" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="140" height="32" rx="6" fill="#be123c"/>
    <text x="70" y="21" fill="#ffffff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">CPython VM (CEval)</text>
    <text x="15" y="58" fill="#fda4af" font-size="10" font-family="sans-serif">_PyEval_EvalFrame</text>
    <text x="15" y="76" fill="#94a3b8" font-size="10" font-family="monospace">Value Stack:</text>
    <rect x="25" y="85" width="90" height="16" fill="#334155" rx="3"/>
    <text x="70" y="97" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle">[ b: 3 ]</text>
    <rect x="25" y="103" width="90" height="16" fill="#334155" rx="3"/>
    <text x="70" y="115" fill="#ffffff" font-size="9" font-family="monospace" text-anchor="middle">[ a: 2 ]</text>
    <text x="15" y="135" fill="#cbd5e1" font-size="10" font-family="sans-serif">Host CPU / OS</text>
    <rect x="15" y="148" width="110" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="70" y="163" fill="#fda4af" font-size="10" font-family="sans-serif" text-anchor="middle">Machine Execution</text>
  </g>

  <!-- Bottom Flow Summary Banner -->
  <rect x="40" y="325" width="880" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="352" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">Key Takeaways for Systems &amp; Performance Engineers:</text>
  <text x="60" y="378" fill="#e2e8f0" font-size="12" font-family="sans-serif">• <tspan fill="#fbbf24" font-weight="bold">No Direct Native Compilation</tspan>: Unlike C (source -> machine assembly), Python targets an emulated software stack machine.</text>
  <text x="60" y="400" fill="#e2e8f0" font-size="12" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">Bytecode Caching</tspan>: Bytecode is serialized into <tspan font-family="monospace">__pycache__/*.pyc</tspan> with a magic number and source timestamp check to skip compilation.</text>
  <text x="60" y="422" fill="#e2e8f0" font-size="12" font-family="sans-serif">• <tspan fill="#f43f5e" font-weight="bold">Interpreter Loop Overhead</tspan>: Every opcode in the eval loop incurs dispatch branch penalties and dynamic object unboxing costs.</text>
</svg>
