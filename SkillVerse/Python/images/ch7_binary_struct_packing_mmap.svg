<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Binary Struct Serialization &amp; Zero-Copy Memory-Mapped Files</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">High-throughput binary protocol parsing and gigabyte-scale waveform/log processing</text>

  <!-- Left: struct.pack / unpack -->
  <g transform="translate(60, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="390" height="30" rx="8" fill="#0369a1"/>
    <text x="195" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Binary Serialization (struct module)</text>

    <text x="15" y="55" fill="#38bdf8" font-size="11" font-family="monospace">fmt = "&gt;IHBB"  # Big-Endian</text>
    <text x="15" y="72" fill="#94a3b8" font-size="10" font-family="sans-serif">• &gt; : Big-endian (Network byte order)</text>
    <text x="15" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">• I : uint32_t (4B), H: uint16_t (2B), B: uint8_t (1B)</text>

    <!-- Visual Memory Layout -->
    <g transform="translate(20, 105)">
      <rect x="0" y="0" width="140" height="35" rx="3" fill="#0284c7" stroke="#38bdf8"/>
      <text x="70" y="18" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">addr (4B)</text>
      <text x="70" y="30" fill="#bae6fd" font-size="8" font-family="monospace" text-anchor="middle">0x00..0x03</text>

      <rect x="145" y="0" width="80" height="35" rx="3" fill="#047857" stroke="#34d399"/>
      <text x="185" y="18" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">len (2B)</text>
      <text x="185" y="30" fill="#a7f3d0" font-size="8" font-family="monospace" text-anchor="middle">0x04..0x05</text>

      <rect x="230" y="0" width="55" height="35" rx="3" fill="#b45309" stroke="#fbbf24"/>
      <text x="257" y="18" fill="#fff" font-size="9" font-family="monospace" text-anchor="middle">cmd</text>
      <text x="257" y="30" fill="#fde047" font-size="8" font-family="monospace" text-anchor="middle">0x06</text>

      <rect x="290" y="0" width="55" height="35" rx="3" fill="#b45309" stroke="#fbbf24"/>
      <text x="317" y="18" fill="#fff" font-size="9" font-family="monospace" text-anchor="middle">flags</text>
      <text x="317" y="30" fill="#fde047" font-size="8" font-family="monospace" text-anchor="middle">0x07</text>
    </g>

    <text x="195" y="165" fill="#f8fafc" font-size="10" font-family="monospace" text-anchor="middle">raw_bytes = struct.pack(fmt, 0x1000, 512, 1, 0)</text>
    <text x="195" y="195" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Total: Exactly 8 Bytes (Packed with No Padding)</text>
    <text x="195" y="215" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Direct hardware peripheral / socket transmission</text>
  </g>

  <!-- Right: Zero-Copy mmap -->
  <g transform="translate(510, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect width="390" height="30" rx="8" fill="#047857"/>
    <text x="195" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Zero-Copy Memory-Mapped Files (mmap)</text>

    <!-- Code Block -->
    <rect x="15" y="45" width="360" height="65" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="62" fill="#34d399" font-size="10" font-family="monospace">with open("waveform.vcd", "r+b") as f:</text>
    <text x="35" y="78" fill="#a7f3d0" font-size="10" font-family="monospace">mm = mmap.mmap(f.fileno(), 0)</text>
    <text x="35" y="94" fill="#fde047" font-size="10" font-family="monospace">slice = mm[0x1000 : 0x2000] # Zero user copy!</text>

    <!-- Kernel Diagram -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="165" height="55" rx="4" fill="#082f49" stroke="#38bdf8"/>
      <text x="82" y="22" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Python Process Address Space</text>
      <text x="82" y="42" fill="#cbd5e1" font-size="9" font-family="monospace" text-anchor="middle">Virtual Memory Pointer</text>

      <path d="M 165 28 L 195 28" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

      <rect x="200" y="0" width="150" height="55" rx="4" fill="#064e3b" stroke="#34d399"/>
      <text x="275" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">OS Page Cache / Disk</text>
      <text x="275" y="42" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">Direct Hardware DMA</text>
    </g>

    <text x="195" y="198" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Bypasses read() / write() System Call Overhead</text>
    <text x="195" y="218" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Processes 50GB VCD waveform files in sub-seconds</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Memoryview &amp; Buffer Protocol:</text>
    <text x="25" y="48" fill="#e2e8f0" font-size="11" font-family="sans-serif">• Combining <tspan font-family="monospace" fill="#38bdf8">memoryview</tspan> with <tspan font-family="monospace" fill="#34d399">mmap</tspan> allows slicing gigabyte buffers without allocating ANY new Python string/bytes objects.</text>
    <text x="25" y="68" fill="#e2e8f0" font-size="11" font-family="sans-serif">• <tspan font-family="monospace" fill="#fbbf24">struct.unpack_from(fmt, mm, offset)</tspan> parses headers directly at specific byte offsets in the memory-mapped file.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Essential for writing high-performance digital logic packet decoders and hardware trace analyzers.</text>
  </g>
</svg>
