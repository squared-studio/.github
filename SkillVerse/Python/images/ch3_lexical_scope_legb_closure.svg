<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">LEGB Scope Resolution Hierarchy &amp; Closure Cell Binding</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">How CPython resolves identifier lookups and preserves free variables in closures</text>

  <!-- Left: Concentric LEGB Hierarchy -->
  <g transform="translate(60, 95)">
    <!-- Built-in -->
    <rect x="0" y="0" width="380" height="240" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="25" y="25" fill="#818cf8" font-size="12" font-weight="bold" font-family="sans-serif">Built-in Scope (B): len, range, print, Exception</text>

    <!-- Global -->
    <rect x="25" y="38" width="330" height="185" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="45" y="60" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">Global / Module Scope (G): global variables, imports</text>

    <!-- Enclosing -->
    <rect x="50" y="75" width="280" height="135" rx="8" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="97" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">Enclosing Scope (E): Outer function / nonlocal</text>

    <!-- Local -->
    <rect x="75" y="112" width="230" height="85" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="95" y="134" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">Local Scope (L): Function block</text>
    <text x="95" y="154" fill="#fde047" font-size="10" font-family="monospace">x = 10 (Fast LOAD_FAST)</text>
    <text x="95" y="172" fill="#cbd5e1" font-size="9" font-family="sans-serif">First lookup target; falls back outwards</text>
  </g>

  <!-- Right: Closure Cell Architecture -->
  <g transform="translate(480, 95)">
    <rect width="420" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="25" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Closure Cell Binding (__closure__)</text>

    <!-- Code Block -->
    <rect x="20" y="42" width="380" height="75" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="30" y="60" fill="#94a3b8" font-size="10" font-family="monospace">def make_multiplier(factor):</text>
    <text x="45" y="76" fill="#94a3b8" font-size="10" font-family="monospace">def mult(val): return val * factor</text>
    <text x="45" y="92" fill="#38bdf8" font-size="10" font-family="monospace">return mult</text>
    <text x="30" y="108" fill="#34d399" font-size="10" font-family="monospace">fn = make_multiplier(5) # factor survives stack exit!</text>

    <!-- Cell Object Box -->
    <rect x="30" y="132" width="160" height="85" rx="6" fill="#0369a1" stroke="#38bdf8"/>
    <text x="110" y="152" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Function Object 'fn'</text>
    <text x="40" y="172" fill="#e0f2fe" font-size="9" font-family="monospace">__code__: co_code</text>
    <text x="40" y="190" fill="#e0f2fe" font-size="9" font-family="monospace">__closure__: (cell,)</text>

    <!-- Cell struct -->
    <path d="M 190 185 L 240 185" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="245" y="132" width="155" height="85" rx="6" fill="#047857" stroke="#34d399"/>
    <text x="322" y="152" fill="#ffffff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">PyCellObject</text>
    <text x="255" y="172" fill="#d1fae5" font-size="9" font-family="monospace">ob_refcnt: 2</text>
    <text x="255" y="190" fill="#d1fae5" font-size="9" font-family="monospace">ob_ref: int(5)</text>
    <text x="322" y="208" fill="#a7f3d0" font-size="8" font-family="sans-serif" text-anchor="middle">Heap-persisted variable</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Key Architectural Concepts:</text>
    <text x="25" y="48" fill="#e2e8f0" font-size="11" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">Why Closures Don't Crash on Stack Return</tspan>: When an inner function references an enclosing variable, CPython allocates a <tspan font-family="monospace" fill="#34d399">PyCellObject</tspan> on the heap rather than on the temporary C call stack frame.</text>
    <text x="25" y="68" fill="#e2e8f0" font-size="11" font-family="sans-serif">• <tspan fill="#38bdf8" font-weight="bold">Bytecode Instructions</tspan>: Local variables are loaded with zero-overhead indexed <tspan font-family="monospace">LOAD_FAST</tspan>; closure variables use <tspan font-family="monospace">LOAD_DEREF</tspan>; globals use hash-lookup <tspan font-family="monospace">LOAD_GLOBAL</tspan>.</text>
    <text x="25" y="88" fill="#e2e8f0" font-size="11" font-family="sans-serif">• <tspan fill="#f43f5e" font-weight="bold">The nonlocal keyword</tspan>: Required when rebinding enclosing variables inside inner functions to prevent accidental local shadowing.</text>
  </g>
</svg>
