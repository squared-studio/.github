<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Performance Profiling: Deterministic Metrics vs. Flame Graphs</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Diagnosing CPU execution bottlenecks using cProfile and call-stack sampling</text>

  <!-- Left: cProfile Table Output -->
  <g transform="translate(50, 95)">
    <rect width="410" height="235" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="410" height="30" rx="8" fill="#0369a1"/>
    <text x="205" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">cProfile Deterministic Statistics Table</text>

    <!-- Table Header -->
    <g transform="translate(15, 42)">
      <rect width="380" height="22" fill="#0f172a" rx="3"/>
      <text x="10" y="15" fill="#38bdf8" font-size="9" font-family="monospace">ncalls</text>
      <text x="65" y="15" fill="#38bdf8" font-size="9" font-family="monospace">tottime</text>
      <text x="125" y="15" fill="#38bdf8" font-size="9" font-family="monospace">percall</text>
      <text x="185" y="15" fill="#38bdf8" font-size="9" font-family="monospace">cumtime</text>
      <text x="250" y="15" fill="#38bdf8" font-size="9" font-family="monospace">function_name</text>
    </g>

    <!-- Row 1 -->
    <g transform="translate(15, 70)">
      <rect width="380" height="24" fill="#082f49" rx="2"/>
      <text x="10" y="16" fill="#fff" font-size="9" font-family="monospace">1</text>
      <text x="65" y="16" fill="#f43f5e" font-size="9" font-family="monospace">4.821s</text>
      <text x="125" y="16" fill="#94a3b8" font-size="9" font-family="monospace">4.821s</text>
      <text x="185" y="16" fill="#f43f5e" font-size="9" font-family="monospace">6.120s</text>
      <text x="250" y="16" fill="#6ee7b7" font-size="9" font-family="monospace">run_sim_cycles</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(15, 98)">
      <rect width="380" height="24" fill="#0f172a" rx="2"/>
      <text x="10" y="16" fill="#fff" font-size="9" font-family="monospace">100000</text>
      <text x="65" y="16" fill="#fde047" font-size="9" font-family="monospace">0.840s</text>
      <text x="125" y="16" fill="#94a3b8" font-size="9" font-family="monospace">0.000s</text>
      <text x="185" y="16" fill="#fde047" font-size="9" font-family="monospace">0.840s</text>
      <text x="250" y="16" fill="#6ee7b7" font-size="9" font-family="monospace">parse_bus_packet</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(15, 126)">
      <rect width="380" height="24" fill="#0f172a" rx="2"/>
      <text x="10" y="16" fill="#fff" font-size="9" font-family="monospace">500000</text>
      <text x="65" y="16" fill="#94a3b8" font-size="9" font-family="monospace">0.459s</text>
      <text x="125" y="16" fill="#94a3b8" font-size="9" font-family="monospace">0.000s</text>
      <text x="185" y="16" fill="#94a3b8" font-size="9" font-family="monospace">0.459s</text>
      <text x="250" y="16" fill="#6ee7b7" font-size="9" font-family="monospace">calc_crc32</text>
    </g>

    <text x="205" y="180" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle"><tspan font-weight="bold">tottime</tspan>: Total time spent exclusively in function</text>
    <text x="205" y="200" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle"><tspan font-weight="bold">cumtime</tspan>: Cumulative time including all sub-calls</text>
    <text x="205" y="222" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">python -m cProfile -s tottime sim.py</text>
  </g>

  <!-- Right: Flame Graph Visualization -->
  <g transform="translate(490, 95)">
    <rect width="420" height="235" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <rect width="420" height="30" rx="8" fill="#b45309"/>
    <text x="210" y="20" fill="#ffffff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Flame Graph (X: % Total CPU | Y: Call Stack Depth)</text>

    <!-- Flame Bars -->
    <!-- Base: main -->
    <rect x="25" y="185" width="370" height="26" fill="#b45309" stroke="#fbbf24" rx="2"/>
    <text x="210" y="202" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">main() [100%]</text>

    <!-- Level 1: run_simulation -->
    <rect x="25" y="155" width="300" height="26" fill="#c2410c" stroke="#f97316" rx="2"/>
    <text x="175" y="172" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">run_simulation() [80%]</text>

    <rect x="330" y="155" width="65" height="26" fill="#047857" stroke="#34d399" rx="2"/>
    <text x="362" y="172" fill="#fff" font-size="8" font-family="monospace" text-anchor="middle">init()</text>

    <!-- Level 2: Sub functions -->
    <rect x="25" y="125" width="200" height="26" fill="#dc2626" stroke="#f87171" rx="2"/>
    <text x="125" y="142" fill="#fff" font-size="9" font-family="monospace" text-anchor="middle">step_clock() [54%]</text>

    <rect x="230" y="125" width="95" height="26" fill="#eab308" stroke="#fde047" rx="2"/>
    <text x="277" y="142" fill="#000" font-size="8" font-family="monospace" text-anchor="middle">parse_packet()</text>

    <!-- Level 3: Deepest hotspot -->
    <rect x="25" y="95" width="130" height="26" fill="#991b1b" stroke="#fca5a5" rx="2"/>
    <text x="90" y="112" fill="#fff" font-size="8" font-family="monospace" text-anchor="middle">crc_lookup() [35% Hotspot]</text>

    <text x="210" y="224" fill="#fbbf24" font-size="10" font-family="sans-serif" text-anchor="middle">Wide bars indicate CPU bottlenecks (Flamegraph Hotspots)</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 350)">
    <rect width="860" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Tooling Recommendations for Systems Python:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#fbbf24" font-weight="bold">py-spy</tspan>: Zero-overhead sampling profiler that attaches to running Python processes without code modification.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">line_profiler</tspan>: Measures execution time line-by-line within individual high-frequency loops.</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#38bdf8" font-weight="bold">tracemalloc</tspan>: Tracks heap memory allocations to catch memory leaks in long-running test suites.</text>
  </g>
</svg>
