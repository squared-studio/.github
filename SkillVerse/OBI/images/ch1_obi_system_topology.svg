<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#0f172a" rx="10"/>
  <rect x="15" y="15" width="870" height="390" fill="none" stroke="#1e293b" stroke-width="2" rx="8"/>
  <text x="450" y="45" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">Open Bus Interface (OBI) in RISC-V SoC Topology</text>
  
  <!-- CORE-V RISC-V Processor Core -->
  <rect x="40" y="80" width="220" height="300" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="150" y="115" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">CORE-V CPU Core</text>
  <text x="150" y="135" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(e.g. CV32E40P / CVA6)</text>

  <rect x="60" y="155" width="180" height="85" fill="#0f172a" stroke="#4ade80" rx="5"/>
  <text x="150" y="180" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Instruction Fetch Unit</text>
  <text x="150" y="205" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">OBI Instruction Master</text>
  <text x="150" y="225" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(I-OBI Interface)</text>

  <rect x="60" y="265" width="180" height="85" fill="#0f172a" stroke="#facc15" rx="5"/>
  <text x="150" y="290" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Load / Store Unit (LSU)</text>
  <text x="150" y="315" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">OBI Data Master</text>
  <text x="150" y="335" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(D-OBI Interface)</text>

  <!-- OBI Interconnect Fabric -->
  <rect x="330" y="80" width="220" height="300" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="8"/>
  <text x="440" y="115" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Interconnect</text>
  <text x="440" y="135" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">2-to-3 Crossbar Switch</text>

  <rect x="350" y="160" width="180" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="190" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Address Decoders</text>
  <rect x="350" y="225" width="180" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="255" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">N-to-1 Arbiters</text>
  <rect x="350" y="290" width="180" height="65" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="315" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Response Routers</text>
  <text x="440" y="335" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">(In-flight ID Tracking)</text>

  <!-- Master to Interconnect Lines -->
  <line x1="240" y1="200" x2="330" y2="200" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="325,195 335,200 325,205" fill="#4ade80"/>
  <text x="285" y="190" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">I-OBI</text>

  <line x1="240" y1="310" x2="330" y2="310" stroke="#facc15" stroke-width="2.5"/>
  <polygon points="325,305 335,310 325,315" fill="#facc15"/>
  <text x="285" y="300" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">D-OBI</text>

  <!-- Slaves -->
  <!-- Slave 1: Instruction SRAM -->
  <rect x="630" y="80" width="220" height="85" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="6"/>
  <text x="740" y="115" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Instruction SRAM</text>
  <text x="740" y="140" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Single-Cycle Low-Latency</text>
  <line x1="550" y1="120" x2="630" y2="120" stroke="#4ade80" stroke-width="2"/>

  <!-- Slave 2: Data SRAM -->
  <rect x="630" y="185" width="220" height="85" fill="#1e293b" stroke="#facc15" stroke-width="1.5" rx="6"/>
  <text x="740" y="220" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Data SRAM (TCDM)</text>
  <text x="740" y="245" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Multi-Banked RAM</text>
  <line x1="550" y1="230" x2="630" y2="230" stroke="#facc15" stroke-width="2"/>

  <!-- Slave 3: OBI-to-APB / AXI Bridge -->
  <rect x="630" y="290" width="220" height="90" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="740" y="320" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI-to-APB / AXI Bridge</text>
  <text x="740" y="345" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Peripherals &amp; System DDR</text>
  <line x1="550" y1="335" x2="630" y2="335" stroke="#38bdf8" stroke-width="2"/>
</svg>