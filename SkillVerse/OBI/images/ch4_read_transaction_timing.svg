<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Pipelined Read Transaction (1-Cycle Memory Latency)</text>

  <g font-family="monospace" font-size="12">
    <!-- Cycles -->
    <text x="50" y="80" fill="#64748b">Cycle :</text>
    <text x="170" y="80" fill="#94a3b8">C1</text>
    <text x="310" y="80" fill="#94a3b8">C2</text>
    <text x="450" y="80" fill="#94a3b8">C3</text>
    <text x="590" y="80" fill="#94a3b8">C4</text>
    <text x="730" y="80" fill="#94a3b8">C5</text>

    <!-- CLK -->
    <text x="50" y="115" fill="#64748b">clk   :</text>
    <path d="M 140 120 L 210 120 L 210 100 L 280 100 L 280 120 L 350 120 L 350 100 L 420 100 L 420 120 L 490 120 L 490 100 L 560 100 L 560 120 L 630 120 L 630 100 L 700 100 L 700 120 L 770 120" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- req -->
    <text x="50" y="150" fill="#38bdf8">req   :</text>
    <path d="M 140 160 L 210 160 L 210 140 L 350 140 L 350 160 L 770 160" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- gnt -->
    <text x="50" y="185" fill="#4ade80">gnt   :</text>
    <path d="M 140 195 L 210 195 L 210 175 L 350 175 L 350 195 L 770 195" fill="none" stroke="#4ade80" stroke-width="2.5"/>

    <!-- addr -->
    <text x="50" y="220" fill="#cbd5e1">addr  :</text>
    <rect x="210" y="205" width="140" height="20" fill="#334155" rx="3"/>
    <text x="280" y="220" fill="#f8fafc" text-anchor="middle">0x1000</text>

    <!-- we -->
    <text x="50" y="255" fill="#cbd5e1">we    :</text>
    <text x="280" y="255" fill="#94a3b8" text-anchor="middle">0 (Read)</text>

    <!-- rvalid -->
    <text x="50" y="290" fill="#c084fc">rvalid:</text>
    <path d="M 140 300 L 490 300 L 490 280 L 630 280 L 630 300 L 770 300" fill="none" stroke="#c084fc" stroke-width="2.5"/>

    <!-- rdata -->
    <text x="50" y="325" fill="#c084fc">rdata :</text>
    <rect x="490" y="310" width="140" height="20" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" rx="3"/>
    <text x="560" y="325" fill="#c084fc" text-anchor="middle">RD_DATA</text>
  </g>

  <!-- Markers -->
  <line x1="350" y1="90" x2="350" y2="230" stroke="#4ade80" stroke-dasharray="3"/>
  <text x="350" y="245" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">Address Accepted</text>

  <line x1="630" y1="90" x2="630" y2="330" stroke="#c084fc" stroke-dasharray="3"/>
  <text x="630" y="270" fill="#c084fc" font-size="10" text-anchor="middle" font-family="sans-serif">Data Sampled</text>
</svg>