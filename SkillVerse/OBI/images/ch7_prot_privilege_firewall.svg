<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Protection Attributes (prot[2:0]) &amp; Hardware Firewall</text>

  <!-- prot[2:0] definitions -->
  <rect x="50" y="70" width="360" height="190" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="230" y="100" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">prot[2:0] Attribute Encoding</text>
  <text x="70" y="135" fill="#cbd5e1" font-size="11" font-family="sans-serif">prot[0] : 0 = User Mode  |  1 = Privileged Mode</text>
  <text x="70" y="170" fill="#cbd5e1" font-size="11" font-family="sans-serif">prot[1] : 0 = Secure     |  1 = Non-Secure</text>
  <text x="70" y="205" fill="#cbd5e1" font-size="11" font-family="sans-serif">prot[2] : 0 = Data Fetch |  1 = Instruction Fetch</text>

  <!-- Hardware Firewall Gate -->
  <rect x="470" y="70" width="360" height="190" fill="#1e293b" stroke="#f87171" rx="6"/>
  <text x="650" y="100" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Hardware PMP / Firewall Gate</text>
  <rect x="490" y="125" width="320" height="50" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="650" y="145" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Access Violation Intercepted!</text>
  <text x="650" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">User mode access targeting Machine-Mode CSRs</text>
  <text x="650" y="210" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Blocks write, returns rvalid=1 with err=1</text>
  <text x="650" y="235" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Core traps to mtvec with Load/Store Fault</text>
</svg>