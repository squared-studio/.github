<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Error Signaling (err=1) and Protocol Completion</text>

  <g font-family="monospace" font-size="12">
    <!-- Cycles -->
    <text x="50" y="80" fill="#64748b">Cycle :</text>
    <text x="180" y="80" fill="#94a3b8">C1 (Request)</text>
    <text x="360" y="80" fill="#94a3b8">C2 (Grant)</text>
    <text x="540" y="80" fill="#f87171">C3 (Error Return)</text>

    <!-- req -->
    <text x="50" y="125" fill="#38bdf8">req   :</text>
    <path d="M 140 135 L 210 135 L 210 115 L 390 115 L 390 135 L 770 135" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- gnt -->
    <text x="50" y="165" fill="#4ade80">gnt   :</text>
    <path d="M 140 175 L 210 175 L 210 155 L 390 155 L 390 175 L 770 175" fill="none" stroke="#4ade80" stroke-width="2.5"/>

    <!-- rvalid -->
    <text x="50" y="205" fill="#c084fc">rvalid:</text>
    <path d="M 140 215 L 480 215 L 480 195 L 660 195 L 660 215 L 770 215" fill="none" stroke="#c084fc" stroke-width="2.5"/>

    <!-- err -->
    <text x="50" y="245" fill="#f87171">err   :</text>
    <path d="M 140 255 L 480 255 L 480 235 L 660 235 L 660 255 L 770 255" fill="none" stroke="#f87171" stroke-width="3"/>

    <!-- rdata -->
    <text x="50" y="285" fill="#64748b">rdata :</text>
    <text x="570" y="285" fill="#f87171" text-anchor="middle">CORRUPT / INVALID (Discarded)</text>
  </g>

  <!-- Note -->
  <text x="450" y="305" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">The response phase MUST always complete with rvalid=1, even during an error condition.</text>
</svg>