<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Signal Dictionary and Reset Conventions</text>

  <!-- Header -->
  <rect x="40" y="60" width="820" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
  <text x="100" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Signal</text>
  <text x="180" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Direction</text>
  <text x="260" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Width</text>
  <text x="350" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Reset Value</text>
  <text x="610" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Functional Description</text>

  <!-- req -->
  <rect x="40" y="100" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="120" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">req</text>
  <text x="180" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">M $ightarrow$ S</text>
  <text x="260" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 bit</text>
  <text x="350" y="120" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">1'b0 (Mandatory)</text>
  <text x="610" y="120" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Request active; master initiates memory transfer</text>

  <!-- gnt -->
  <rect x="40" y="135" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="155" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">gnt</text>
  <text x="180" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">S $ightarrow$ M</text>
  <text x="260" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 bit</text>
  <text x="350" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Undefined (0 typ)</text>
  <text x="610" y="155" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Grant; slave accepts address and control payload</text>

  <!-- addr, we, be, wdata -->
  <rect x="40" y="170" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="190" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">addr, wdata</text>
  <text x="180" y="190" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">M $ightarrow$ S</text>
  <text x="260" y="190" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">32 / 64 bits</text>
  <text x="350" y="190" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Don't-Care</text>
  <text x="610" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Transfer address and write data; stable while req=1</text>

  <!-- be, we -->
  <rect x="40" y="205" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="225" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">be, we</text>
  <text x="180" y="225" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">M $ightarrow$ S</text>
  <text x="260" y="225" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">4 bits, 1 bit</text>
  <text x="350" y="225" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Don't-Care</text>
  <text x="610" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Byte lane mask (partial write) &amp; write enable (1=write, 0=read)</text>

  <!-- rvalid -->
  <rect x="40" y="240" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="100" y="260" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">rvalid</text>
  <text x="180" y="260" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">S $ightarrow$ M</text>
  <text x="260" y="260" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 bit</text>
  <text x="350" y="260" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">1'b0 (Mandatory)</text>
  <text x="610" y="260" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Response valid; transfer completed in this clock cycle</text>

  <!-- rdata, err -->
  <rect x="40" y="275" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="295" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">rdata, err</text>
  <text x="180" y="295" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">S $ightarrow$ M</text>
  <text x="260" y="295" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">32b, 1 bit</text>
  <text x="350" y="295" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Don't-Care</text>
  <text x="610" y="295" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Read data payload (valid on reads) &amp; response error status</text>
</svg>