<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Master-Side In-Flight Transaction Tracking Logic</text>

  <!-- Credit Counter -->
  <rect x="60" y="80" width="220" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="170" y="110" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Outstanding Counter</text>
  <rect x="80" y="130" width="180" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="170" y="155" fill="#facc15" font-size="12" text-anchor="middle" font-family="sans-serif">cnt &lt;= cnt + req_gnt - rvalid</text>
  <text x="170" y="200" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Tracks active requests</text>
  <text x="170" y="225" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Blocks req if cnt == MAX_MOT</text>

  <!-- In-flight Order Queue -->
  <rect x="340" y="80" width="480" height="180" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="6"/>
  <text x="580" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Transaction FIFO Order Queue</text>
  
  <rect x="360" y="130" width="100" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="410" y="155" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Entry 0</text>
  <text x="410" y="175" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Reg Dest: x5</text>

  <rect x="470" y="130" width="100" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="520" y="155" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Entry 1</text>
  <text x="520" y="175" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Reg Dest: x8</text>

  <rect x="580" y="130" width="100" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="630" y="155" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Entry 2</text>
  <text x="630" y="175" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Reg Dest: x12</text>

  <rect x="690" y="130" width="110" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="745" y="155" fill="#f8fafc" font-size="11" text-anchor="middle" font-family="sans-serif">Entry 3</text>
  <text x="745" y="175" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Reg Dest: x1</text>

  <text x="580" y="235" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Pops entry on each rvalid to route read data directly into CPU register file</text>
</svg>