<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Handshake Dependencies &amp; Deadlock Prevention</text>

  <!-- Legal Box -->
  <rect x="40" y="65" width="380" height="230" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/>
  <text x="230" y="95" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Permitted Dependencies (LEGAL)</text>

  <rect x="60" y="120" width="340" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="230" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1. Slave may wait for req before asserting gnt</text>

  <rect x="60" y="170" width="340" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="230" y="195" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">2. Slave gnt may be asserted proactively (gnt=1)</text>

  <rect x="60" y="220" width="340" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="230" y="245" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">3. rvalid can only follow an accepted request</text>

  <!-- Forbidden Box -->
  <rect x="460" y="65" width="380" height="230" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8"/>
  <text x="650" y="95" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Forbidden Dependencies (DEADLOCK)</text>

  <rect x="480" y="120" width="340" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="650" y="145" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Master must NEVER wait for gnt to assert req</text>

  <rect x="480" y="170" width="340" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="650" y="195" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Master must NOT deassert req before gnt</text>

  <rect x="480" y="220" width="340" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="650" y="245" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">rvalid must NEVER depend combinatorially on gnt</text>
</svg>