<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Inter-ID Out-of-Order Response Completion</text>

  <!-- Timeline -->
  <text x="50" y="80" fill="#cbd5e1" font-size="12" font-family="sans-serif">Cycle 1: Core issues Read A (to Slow DDR, rid=1)</text>
  <text x="50" y="110" fill="#cbd5e1" font-size="12" font-family="sans-serif">Cycle 2: Core issues Read B (to Fast SRAM, rid=2)</text>

  <rect x="50" y="140" width="780" height="70" fill="#1e293b" stroke="#facc15" rx="6"/>
  <text x="440" y="165" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">SRAM completes in Cycle 3 (rvalid=1, rid=2) $ightarrow$ OVERTAKES DDR!</text>
  <text x="440" y="190" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">DDR completes later in Cycle 10 (rvalid=1, rid=1)</text>

  <text x="440" y="260" fill="#4ade80" font-size="12" text-anchor="middle" font-family="sans-serif">Result: Fast on-chip memory access is never blocked behind slow external DRAM.</text>
</svg>