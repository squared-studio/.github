<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="100%">
  <rect width="880" height="280" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Hardware Error to RISC-V Architectural Trap Flow</text>

  <!-- Step 1 -->
  <rect x="40" y="80" width="170" height="150" fill="#1e293b" stroke="#f87171" rx="6"/>
  <text x="125" y="110" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">1. OBI Slave Error</text>
  <text x="125" y="145" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">rvalid = 1</text>
  <text x="125" y="170" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">err = 1</text>
  <text x="125" y="200" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">ECC error / Unmapped</text>

  <line x1="210" y1="155" x2="260" y2="155" stroke="#f87171" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="260" y="80" width="220" height="150" fill="#1e293b" stroke="#facc15" rx="6"/>
  <text x="370" y="110" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">2. CPU Core Decode</text>
  <text x="370" y="140" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">I-OBI Error $ightarrow$ Insn Access Fault</text>
  <text x="370" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">D-OBI Read $ightarrow$ Load Access Fault</text>
  <text x="370" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">D-OBI Write $ightarrow$ Store Access Fault</text>

  <line x1="480" y1="155" x2="530" y2="155" stroke="#facc15" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="530" y="80" width="310" height="150" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="685" y="110" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">3. RISC-V CSR Trap Update</text>
  <text x="685" y="140" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mepc &lt;= Faulting PC</text>
  <text x="685" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mtval &lt;= Faulting Address</text>
  <text x="685" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mcause &lt;= Exception Code (1, 5, or 7)</text>
  <text x="685" y="215" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Jump to mtvec Trap Handler</text>
</svg>