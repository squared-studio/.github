<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Master ID (mid) and Response ID (rid) Routing</text>

  <!-- Master 0 & 1 -->
  <rect x="50" y="80" width="140" height="80" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="120" y="115" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 (mid=0)</text>

  <rect x="50" y="200" width="140" height="80" fill="#1e293b" stroke="#facc15" rx="6"/>
  <text x="120" y="235" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 1 (mid=1)</text>

  <!-- Crossbar Switch -->
  <rect x="270" y="70" width="360" height="230" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="8"/>
  <text x="450" y="105" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Crossbar Matrix</text>

  <rect x="300" y="130" width="300" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="450" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Request Path: Stores {mid, aid} in Pending Table</text>

  <rect x="300" y="200" width="300" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="450" y="230" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Response Path: Demuxes rvalid based on rid</text>

  <!-- Slave -->
  <rect x="710" y="140" width="140" height="90" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="780" y="175" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared Slave</text>
  <text x="780" y="195" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Returns rid with rvalid</text>

  <!-- Lines -->
  <line x1="190" y1="120" x2="270" y2="120" stroke="#38bdf8" stroke-width="2"/>
  <line x1="190" y1="240" x2="270" y2="240" stroke="#facc15" stroke-width="2"/>
  <line x1="630" y1="185" x2="710" y2="185" stroke="#4ade80" stroke-width="2"/>
</svg>