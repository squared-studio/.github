<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Request Handshake: Immediate Grant vs. Wait States</text>

  <!-- Scenario A: Immediate Grant (Zero Wait States) -->
  <rect x="40" y="60" width="390" height="250" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/>
  <text x="235" y="90" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Case 1: Single-Cycle Immediate Grant</text>
  
  <text x="60" y="130" fill="#94a3b8" font-size="11" font-family="monospace">CLK  : _/-\_/-\_/-\_</text>
  <text x="60" y="160" fill="#38bdf8" font-size="11" font-family="monospace">req  : __/-----\____</text>
  <text x="60" y="190" fill="#4ade80" font-size="11" font-family="monospace">gnt  : __/-----\____</text>
  <text x="60" y="220" fill="#cbd5e1" font-size="11" font-family="monospace">addr : ==[A0]==X====</text>

  <rect x="150" y="145" width="60" height="85" fill="#4ade80" fill-opacity="0.15" stroke="#4ade80" stroke-dasharray="2"/>
  <text x="235" y="255" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Handshake Complete in Cycle 1</text>
  <text x="235" y="275" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Slave is immediately ready (no stalls)</text>

  <!-- Scenario B: Delayed Grant (Wait States) -->
  <rect x="470" y="60" width="390" height="250" fill="#1e293b" stroke="#facc15" stroke-width="1.5" rx="8"/>
  <text x="665" y="90" fill="#facc15" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Case 2: Delayed Grant (2 Wait States)</text>

  <text x="490" y="130" fill="#94a3b8" font-size="11" font-family="monospace">CLK  : _/-\_/-\_/-\_/-\_</text>
  <text x="490" y="160" fill="#38bdf8" font-size="11" font-family="monospace">req  : __/-------------\</text>
  <text x="490" y="190" fill="#facc15" font-size="11" font-family="monospace">gnt  : __________/-----\</text>
  <text x="490" y="220" fill="#cbd5e1" font-size="11" font-family="monospace">addr : ==[A0 Stable====]</text>

  <rect x="670" y="145" width="70" height="85" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-dasharray="2"/>
  <text x="665" y="255" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Handshake Occurs in Cycle 3</text>
  <text x="665" y="275" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Master keeps addr/wdata stable until gnt=1</text>
</svg>