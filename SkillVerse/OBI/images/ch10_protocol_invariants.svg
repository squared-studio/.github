<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Fundamental OBI Formal Protocol Invariants</text>

  <!-- Rule 1 -->
  <rect x="40" y="65" width="390" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="235" y="90" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rule 1: Request Payload Stability</text>
  <text x="235" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Once req is asserted, addr, we, be, wdata</text>
  <text x="235" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">MUST remain completely stable until gnt = 1.</text>
  <text x="235" y="155" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Deasserting req early is strictly illegal!</text>

  <!-- Rule 2 -->
  <rect x="470" y="65" width="390" height="110" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="6"/>
  <text x="665" y="90" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rule 2: Grant Independence</text>
  <text x="665" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">req generation must NEVER wait for gnt.</text>
  <text x="665" y="135" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">A slave is permitted to wait for req,</text>
  <text x="665" y="155" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">or drive gnt proactively.</text>

  <!-- Rule 3 -->
  <rect x="40" y="190" width="390" height="110" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="6"/>
  <text x="235" y="215" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rule 3: Response Validity Conservation</text>
  <text x="235" y="240" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Every accepted request (req &amp;&amp; gnt)</text>
  <text x="235" y="260" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">MUST produce exactly ONE response (rvalid).</text>
  <text x="235" y="280" fill="#c084fc" font-size="10" text-anchor="middle" font-family="sans-serif">Zero spurious or lost completions permitted.</text>

  <!-- Rule 4 -->
  <rect x="470" y="190" width="390" height="110" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="6"/>
  <text x="665" y="215" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rule 4: Reset Deassertion Cleanliness</text>
  <text x="665" y="240" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">During reset, req and rvalid must be 0.</text>
  <text x="665" y="260" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Earliest req assertion is first rising clock edge</text>
  <text x="665" y="280" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">AFTER reset deassertion.</text>
</svg>