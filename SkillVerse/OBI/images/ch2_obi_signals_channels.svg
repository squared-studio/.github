<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Open Bus Interface (OBI) Channel Decomposition</text>

  <!-- Master Node -->
  <rect x="50" y="70" width="180" height="260" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="140" y="105" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Master</text>
  <text x="140" y="125" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(CPU LSU / Fetch)</text>

  <!-- Slave Node -->
  <rect x="670" y="70" width="180" height="260" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="760" y="105" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Slave</text>
  <text x="760" y="125" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(SRAM / Interconnect)</text>

  <!-- Request Channel Box -->
  <rect x="270" y="70" width="360" height="150" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="450" y="95" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Request Channel (Transfer Initiation)</text>

  <line x1="230" y1="115" x2="670" y2="115" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="665,110 675,115 665,120" fill="#38bdf8"/>
  <text x="450" y="110" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="sans-serif">req (Request Valid)</text>

  <line x1="670" y1="145" x2="230" y2="145" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="235,140 225,145 235,150" fill="#4ade80"/>
  <text x="450" y="140" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">gnt (Grant Accept)</text>

  <line x1="230" y1="175" x2="670" y2="175" stroke="#cbd5e1" stroke-width="2"/>
  <text x="450" y="170" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">addr[31:0], we, be[3:0], wdata[31:0]</text>

  <line x1="230" y1="205" x2="670" y2="205" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3"/>
  <text x="450" y="200" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Optional: atop[5:0], prot[2:0], dbg, aid[N:0]</text>

  <!-- Response Channel Box -->
  <rect x="270" y="235" width="360" height="95" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
  <text x="450" y="255" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Response Channel (Transfer Completion)</text>

  <line x1="670" y1="280" x2="230" y2="280" stroke="#c084fc" stroke-width="2.5"/>
  <polygon points="235,275 225,280 235,285" fill="#c084fc"/>
  <text x="450" y="275" fill="#c084fc" font-size="11" text-anchor="middle" font-family="sans-serif">rvalid (Response Valid) &amp; rdata[31:0]</text>

  <line x1="670" y1="310" x2="230" y2="310" stroke="#f87171" stroke-width="2"/>
  <polygon points="235,305 225,310 235,315" fill="#f87171"/>
  <text x="450" y="305" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">err (Error Status) &amp; rid[N:0]</text>
</svg>