<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Atomic Operations (atop[5:0]) Encoding Matrix</text>

  <rect x="40" y="60" width="820" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
  <text x="110" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">atop[5:0]</text>
  <text x="230" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Operation</text>
  <text x="440" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Memory-Side ALU Execution</text>
  <text x="730" y="83" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">rdata Return</text>

  <!-- None -->
  <rect x="40" y="100" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="120" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">6'b00_0000</text>
  <text x="230" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">None (Normal)</text>
  <text x="440" y="120" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Standard Read / Write Access</text>
  <text x="730" y="120" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Read data (or ignored for write)</text>

  <!-- AMOSWAP -->
  <rect x="40" y="135" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="155" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">6'b11_0000</text>
  <text x="230" y="155" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">AMOSWAP</text>
  <text x="440" y="155" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mem[addr] &lt;= wdata</text>
  <text x="730" y="155" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Original mem[addr] value</text>

  <!-- AMOADD -->
  <rect x="40" y="170" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="190" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">6'b11_0001</text>
  <text x="230" y="190" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">AMOADD</text>
  <text x="440" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mem[addr] &lt;= mem[addr] + wdata</text>
  <text x="730" y="190" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Original mem[addr] value</text>

  <!-- AMOAND / AMOOR / AMOXOR -->
  <rect x="40" y="205" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="225" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">6'b11_0010..4</text>
  <text x="230" y="225" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">AMOAND/OR/XOR</text>
  <text x="440" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mem[addr] &lt;= mem[addr] [op] wdata (Bitwise)</text>
  <text x="730" y="225" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Original mem[addr] value</text>

  <!-- AMOMIN / AMOMAX -->
  <rect x="40" y="240" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="260" fill="#c084fc" font-size="11" text-anchor="middle" font-family="sans-serif">6'b11_0101..8</text>
  <text x="230" y="260" fill="#c084fc" font-size="11" text-anchor="middle" font-family="sans-serif">AMOMIN/MAX(U)</text>
  <text x="440" y="260" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">mem[addr] &lt;= min/max(mem[addr], wdata)</text>
  <text x="730" y="260" fill="#c084fc" font-size="10" text-anchor="middle" font-family="sans-serif">Original mem[addr] value</text>

  <text x="450" y="315" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Enables atomic lock-free shared-memory multiprocessing for RISC-V Linux.</text>
</svg>