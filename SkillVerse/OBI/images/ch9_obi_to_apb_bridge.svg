<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI-to-APB4 Protocol Translation Bridge</text>

  <!-- OBI Master Interface -->
  <rect x="50" y="80" width="200" height="180" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="150" y="110" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">OBI Slave Port</text>
  <text x="150" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Accepts req, grants gnt</text>
  <text x="150" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Buffers addr, wdata, we</text>
  <text x="150" y="215" fill="#c084fc" font-size="11" text-anchor="middle" font-family="sans-serif">Returns rvalid, rdata, err</text>

  <!-- Bridge Translation FSM -->
  <rect x="310" y="70" width="260" height="200" fill="#1e293b" stroke="#facc15" stroke-width="2" rx="8"/>
  <text x="440" y="100" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bridge Translation FSM</text>
  
  <rect x="330" y="120" width="220" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="142" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">IDLE: Awaiting OBI req</text>

  <rect x="330" y="165" width="220" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="187" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">SETUP: Assert PSEL, PWRITE, PADDR</text>

  <rect x="330" y="210" width="220" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="440" y="232" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">ACCESS: Assert PENABLE; sample PREADY</text>

  <!-- APB Interface -->
  <rect x="630" y="80" width="200" height="180" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="730" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">APB Master Port</text>
  <text x="730" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Drives PSEL, PENABLE</text>
  <text x="730" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Samples PREADY, PRDATA</text>
  <text x="730" y="215" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">Maps PSLVERR $ightarrow$ err</text>
</svg>