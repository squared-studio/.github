<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">FPGA Clock Management (MMCM/PLL), Global Buffers &amp; Clock Regions</text>
  <text class="sub" x="460" y="48">From Dedicated Clock-Capable I/O Pins Through VCO Synthesis, Deskew Feedback, BUFGCE/BUFGCTRL, and H-Tree Spines</text>

  <!-- Top Flow Panel -->
  <rect class="panel" x="20" y="64" width="880" height="196" stroke="#38bdf8" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. Dedicated Low-Skew Hardware Clock Distribution Pipeline</text>

  <rect class="box" x="34" y="106" width="122" height="78" stroke="#f59e0b" />
  <text class="mono" x="95" y="128" fill="#fcd34d" text-anchor="middle">GCIO / CCIO Pin</text>
  <text class="mono" x="95" y="148" fill="#e2e8f0" text-anchor="middle">IBUFDS (LVDS)</text>
  <text class="note" x="95" y="168" text-anchor="middle">Clock-Capable Pin!</text>

  <line x1="156" y1="145" x2="188" y2="145" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="190" y="100" width="242" height="122" stroke="#a78bfa" />
  <text class="mono" x="311" y="122" fill="#c4b5fd" text-anchor="middle">MMCM / PLL Tile</text>
  <text class="mono" x="311" y="142" fill="#e2e8f0" text-anchor="middle">f_VCO = f_in * M / D (600-1600 MHz)</text>
  <text class="mono" x="311" y="160" fill="#6ee7b7" text-anchor="middle">CLKOUT0..6 (/ O_i, Fine Phase Shift)</text>
  <text class="mono" x="311" y="180" fill="#fcd34d" text-anchor="middle">LOCKED flag + CLKFBOUT -&gt; BUFG Deskew</text>
  <text class="note" x="311" y="204" text-anchor="middle">Always hold reset until LOCKED == 1!</text>

  <line x1="432" y1="138" x2="466" y2="138" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />

  <rect class="box" x="468" y="102" width="170" height="90" stroke="#34d399" />
  <text class="mono" x="553" y="124" fill="#6ee7b7" text-anchor="middle">Global Clock Buffers</text>
  <text class="mono" x="553" y="144" fill="#e2e8f0" text-anchor="middle">BUFGCE (Gated)</text>
  <text class="mono" x="553" y="162" fill="#e2e8f0" text-anchor="middle">BUFGCTRL (Glitchless</text>
  <text class="mono" x="553" y="178" fill="#e2e8f0" text-anchor="middle">2:1 Clock MUX!)</text>

  <line x1="638" y1="145" x2="672" y2="145" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />

  <rect class="box" x="674" y="100" width="210" height="122" stroke="#38bdf8" />
  <text class="mono" x="779" y="122" fill="#7dd3fc" text-anchor="middle">Horizontal Spine + Leaf</text>
  <text class="note" x="779" y="144" text-anchor="middle">Balanced H-Tree Routing to</text>
  <text class="note" x="779" y="162" text-anchor="middle">CLB FDRE, BRAM &amp; DSP CK pins</text>
  <text class="mono" x="779" y="184" fill="#6ee7b7" text-anchor="middle">Clock Skew &lt; 100-150 ps</text>
  <text class="mono" x="779" y="206" fill="#fcd34d" text-anchor="middle">(vs ~1-2ns on fabric wires!)</text>

  <!-- Bottom Panels: Clock Regions + Rules -->
  <rect class="panel" x="20" y="274" width="430" height="118" stroke="#f59e0b" />
  <text class="hdr" x="38" y="298" fill="#f59e0b">2. Clock Regions &amp; Buffer Limits (e.g., 24 Globals/Bank)</text>
  <text class="note" x="38" y="320">- FPGA die splits into rectangular Clock Regions (`X0Y0`..`X3Y5`).</text>
  <text class="note" x="38" y="338">- UltraScale+ supports max ~24 unique global clocks per region.</text>
  <text class="note" x="38" y="356">- Use `BUFGCE_DIV` (matched divider) for `clk` vs `clk/2` synchronous</text>
  <text class="note" x="38" y="373">  siblings placed inside the same Clock Root (`CLOCK_DELAY_GROUP`)!</text>

  <rect class="panel" x="466" y="274" width="434" height="118" stroke="#f87171" />
  <text class="hdr" x="484" y="298" fill="#f87171">3. Critical FPGA Clocking Mistakes to Avoid</text>
  <text class="note" x="484" y="320">- NEVER assign a non-clock IO pin to drive an MMCM (`CLOCK_DEDICATED_ROUTE` error!).</text>
  <text class="note" x="484" y="338">- NEVER generate clocks via Verilog toggles (`always @(posedge clk) clk_div2 &lt;= ~clk_div2;`)!</text>
  <text class="note" x="484" y="356">- NEVER multiplex two unrelated clocks using a plain LUT 2:1 MUX (causes glitches!).</text>
  <text class="note" x="484" y="373">- Always use MMCM outputs OR `BUFGCE` / `BUFGCTRL` + `CE` pulses cleanly!</text>
</svg>
