<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">FPGA vs. ASIC Economics &amp; Programmable Routing Delay Dominance</text>
  <text class="sub" x="460" y="48">Zero-NRE Volume Break-Even Curve Alongside FPGA Critical-Path Logic (~25%) vs. Routing (~75%) Breakdown</text>

  <!-- Left Panel: Total Cost vs Production Volume Break-Even -->
  <rect class="panel" x="20" y="64" width="430" height="318" stroke="#38bdf8" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. Total Cost vs. Shipped Units (NRE vs. Unit Cost)</text>
  <rect class="box" x="34" y="100" width="402" height="206" />

  <line x1="74" y1="116" x2="74" y2="280" stroke="#64748b" stroke-width="1.3" />
  <line x1="74" y1="280" x2="416" y2="280" stroke="#64748b" stroke-width="1.3" />
  <text class="mono" x="245" y="298" text-anchor="middle">Production Volume (Units Log Scale)</text>
  <text class="mono" x="46" y="198" transform="rotate(-90 46 198)" text-anchor="middle">Total Cost ($)</text>

  <!-- ASIC high NRE intercept, shallow slope -->
  <line x1="74" y1="158" x2="404" y2="188" stroke="#a78bfa" stroke-width="2.6" />
  <text class="mono" x="84" y="148" fill="#c4b5fd" font-size="9.5">ASIC ($2M-$50M Mask NRE)</text>

  <!-- FPGA ~0 NRE intercept, steeper per-unit slope -->
  <line x1="74" y1="278" x2="404" y2="122" stroke="#34d399" stroke-width="2.6" />
  <text class="mono" x="148" y="264" fill="#6ee7b7" font-size="9.5">FPGA (~$0 NRE, High Unit Cost)</text>

  <!-- Break-even Intersection -->
  <circle cx="272" cy="177" r="5" fill="#f59e0b" />
  <line x1="272" y1="177" x2="272" y2="280" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4,3" />
  <text class="mono" x="272" y="162" fill="#fcd34d" text-anchor="middle">Break-Even (~10k-100k units)</text>

  <rect class="box" x="34" y="314" width="402" height="54" />
  <text class="mono" x="46" y="334" fill="#6ee7b7">Time-to-Market: FPGA ships in weeks; ASIC takes 12-24 mos</text>
  <text class="note" x="46" y="352">Plus FPGA field-reprogrammability vs. 3-4x lower ASIC area/power</text>

  <!-- Right Panel: Delay Budget (ASIC vs FPGA) -->
  <rect class="panel" x="466" y="64" width="434" height="318" stroke="#f59e0b" />
  <text class="hdr" x="484" y="88" fill="#f59e0b">2. Why Interconnect Routing Dominates FPGA Timing</text>

  <!-- Stacked Comparison Bars -->
  <rect class="box" x="480" y="100" width="406" height="146" />
  <text class="mono" x="494" y="124" fill="#cbd5e1">ASIC Standard-Cell Path (~1.0 ns total):</text>
  <rect x="494" y="134" width="230" height="28" fill="#0c4a6e" stroke="#38bdf8" rx="4" />
  <text class="mono" x="609" y="152" fill="#7dd3fc" text-anchor="middle">Cell Delay (~70%)</text>
  <rect x="726" y="134" width="104" height="28" fill="#334155" stroke="#94a3b8" rx="4" />
  <text class="mono" x="778" y="152" fill="#e2e8f0" text-anchor="middle">Wire (~30%)</text>

  <text class="mono" x="494" y="186" fill="#fcd34d">FPGA Programmable Path (~3.0 ns total):</text>
  <rect x="494" y="196" width="90" height="32" fill="#0c4a6e" stroke="#38bdf8" rx="4" />
  <text class="mono" x="539" y="216" fill="#7dd3fc" text-anchor="middle">LUT (~25%)</text>
  <rect x="586" y="196" width="286" height="32" fill="#7f1d1d" stroke="#f87171" rx="4" />
  <text class="mono" x="729" y="216" fill="#fca5a5" text-anchor="middle">Switch Boxes + Pass Gates (~75%!)</text>

  <rect class="box" x="480" y="254" width="406" height="114" />
  <text class="mono" x="494" y="274" fill="#6ee7b7">Three Golden FPGA Architecture Consequences:</text>
  <text class="note" x="494" y="294">1. Flip-flops are nearly FREE (2 per LUT) -> pipeline aggressively!</text>
  <text class="note" x="494" y="313">2. Fewer LUT levels (2-4 max for 400+ MHz) cuts switch-box hops!</text>
  <text class="note" x="494" y="332">3. Multiplexers &amp; wide OR buses cost far more routing than in ASIC.</text>
  <text class="note" x="494" y="351">4. Hard macros (DSP48, BRAM, PCIe) bypass programmable routing!</text>
</svg>
