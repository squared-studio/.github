<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">FPGA Static Timing Analysis: Anatomy of Setup Slack (WNS) &amp; Hold Slack (WHS)</text>
  <text class="sub" x="460" y="48">Visualizing Data Arrival vs. Clock Required Time, LUT Levels, Interconnect Net Delay, and Clock Uncertainty</text>

  <!-- Top Diagram: Launch -> Data Path -> Capture -->
  <rect class="panel" x="20" y="64" width="880" height="122" stroke="#38bdf8" />
  <text class="hdr" x="38" y="86" fill="#38bdf8">1. Physical Synchronous Timing Path in Fabric</text>

  <rect class="box" x="38" y="100" width="110" height="66" stroke="#34d399" />
  <text class="mono" x="93" y="122" fill="#6ee7b7" text-anchor="middle">Launch FF1</text>
  <text class="mono" x="93" y="142" fill="#94a3b8" text-anchor="middle">t_clk1 + t_CO</text>

  <line x1="148" y1="133" x2="210" y2="133" stroke="#f87171" stroke-width="2" />
  <text class="mono" x="179" y="125" fill="#fca5a5" text-anchor="middle" font-size="9">Net 0</text>
  <rect class="box" x="212" y="106" width="82" height="54" stroke="#38bdf8" />
  <text class="mono" x="253" y="137" fill="#7dd3fc" text-anchor="middle">LUT6_1</text>

  <line x1="294" y1="133" x2="356" y2="133" stroke="#f87171" stroke-width="2" />
  <text class="mono" x="325" y="125" fill="#fca5a5" text-anchor="middle" font-size="9">Net 1</text>
  <rect class="box" x="358" y="106" width="82" height="54" stroke="#38bdf8" />
  <text class="mono" x="399" y="137" fill="#7dd3fc" text-anchor="middle">LUT6_2</text>

  <line x1="440" y1="133" x2="502" y2="133" stroke="#f87171" stroke-width="2" />
  <text class="mono" x="471" y="125" fill="#fca5a5" text-anchor="middle" font-size="9">Net 2</text>
  <rect class="box" x="504" y="106" width="82" height="54" stroke="#38bdf8" />
  <text class="mono" x="545" y="137" fill="#7dd3fc" text-anchor="middle">LUT6_3</text>

  <line x1="586" y1="133" x2="668" y2="133" stroke="#f87171" stroke-width="2" />
  <text class="mono" x="627" y="125" fill="#fca5a5" text-anchor="middle" font-size="9">Net 3 (Long!)</text>

  <rect class="box" x="670" y="100" width="120" height="66" stroke="#f59e0b" />
  <text class="mono" x="730" y="122" fill="#fcd34d" text-anchor="middle">Capture FF2</text>
  <text class="mono" x="730" y="142" fill="#94a3b8" text-anchor="middle">t_setup / t_hold</text>

  <text class="mono" x="845" y="124" fill="#e2e8f0" text-anchor="middle">3 Logic</text>
  <text class="mono" x="845" y="142" fill="#e2e8f0" text-anchor="middle">Levels</text>

  <!-- Bottom Left: Waterfall Breakdown -->
  <rect class="panel" x="20" y="198" width="466" height="186" stroke="#f59e0b" />
  <text class="hdr" x="38" y="220" fill="#f59e0b">2. Setup Slack Waterfall (Example T_clk = 3.33 ns / 300 MHz)</text>
  <rect class="box" x="34" y="232" width="438" height="138" />

  <!-- Required vs Arrival Bars -->
  <text class="mono" x="46" y="254" fill="#6ee7b7">Required:</text>
  <rect x="122" y="240" width="286" height="22" fill="#064e3b" stroke="#34d399" rx="3" />
  <text class="mono" x="265" y="255" fill="#6ee7b7" text-anchor="middle">T_clk + t_clk2 - t_setup - Uncert = 3.12 ns</text>

  <text class="mono" x="46" y="294" fill="#38bdf8">Arrival:</text>
  <rect x="122" y="280" width="52" height="24" fill="#0c4a6e" stroke="#38bdf8" rx="3" />
  <text class="mono" x="148" y="296" font-size="9" text-anchor="middle">t_CO</text>
  <rect x="176" y="280" width="76" height="24" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="214" y="296" font-size="9" text-anchor="middle">3x LUT</text>
  <rect x="254" y="280" width="188" height="24" fill="#7f1d1d" stroke="#f87171" rx="3" />
  <text class="mono" x="348" y="296" fill="#fca5a5" font-size="9" text-anchor="middle">Net Routing (~2.1 ns!)</text>

  <line x1="408" y1="264" x2="408" y2="322" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,2" />
  <line x1="442" y1="304" x2="442" y2="322" stroke="#f87171" stroke-width="1.2" stroke-dasharray="3,2" />
  <text class="mono" x="425" y="336" fill="#fca5a5" text-anchor="middle">WNS = -0.35 ns VIOLATION!</text>
  <text class="note" x="46" y="358">Arrival (3.47 ns) exceeds Required (3.12 ns) because Net Routing ate ~60% of period!</text>

  <!-- Bottom Right: Setup & Hold Sign-Off Formulas -->
  <rect class="panel" x="502" y="198" width="398" height="186" stroke="#34d399" />
  <text class="hdr" x="520" y="220" fill="#34d399">3. Four Sign-Off Slack Numbers (`0` Violations Goal)</text>
  <rect class="box" x="516" y="232" width="370" height="138" />
  <text class="mono" x="528" y="252" fill="#7dd3fc">Setup Slack = T_req - T_arr &gt;= 0</text>
  <text class="note" x="528" y="270">- WNS (Worst Negative Slack) &amp; TNS (Total Negative Slack)</text>
  <text class="mono" x="528" y="292" fill="#6ee7b7">Hold Slack  = T_arr_fast - T_req_hold &gt;= 0</text>
  <text class="note" x="528" y="310">- WHS (Worst Hold Slack) — router fixes hold AFTER place!</text>
  <text class="mono" x="528" y="332" fill="#fcd34d">Wait: Hold Violation (`WHS &lt; 0`) NEVER fixes by slowing clk!</text>
  <text class="note" x="528" y="352">Setup bugs = run slower or pipeline; Hold bugs = dead silicon!</text>
</svg>
