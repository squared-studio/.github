<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">Reset Strategy Impact on DSP48, BRAM, and SRL32 Resource Packing</text>
  <text class="sub" x="460" y="48">Why Blanket Asynchronous Resets Break Hard Primitive Inference and Double LUT/FF Fabric Utilization</text>

  <!-- Left Panel: Anti-Pattern (Async Reset Everywhere) -->
  <rect class="panel" x="20" y="64" width="430" height="318" stroke="#f87171" />
  <text class="hdr" x="38" y="88" fill="#f87171">1. Anti-Pattern: Blanket Async `negedge rst_n`</text>

  <rect class="box" x="34" y="102" width="402" height="128" stroke="#f87171" />
  <text class="mono" x="48" y="122" fill="#fca5a5">16-Deep Delay Pipe With Async Reset:</text>
  <rect x="48" y="136" width="60" height="36" fill="#1e293b" stroke="#f87171" rx="4" />
  <text class="mono" x="78" y="158" text-anchor="middle">FDCE 0</text>
  <line x1="108" y1="154" x2="132" y2="154" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
  <rect x="134" y="136" width="60" height="36" fill="#1e293b" stroke="#f87171" rx="4" />
  <text class="mono" x="164" y="158" text-anchor="middle">FDCE 1</text>
  <line x1="194" y1="154" x2="220" y2="154" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
  <text class="mono" x="242" y="158" fill="#94a3b8">. . .</text>
  <line x1="264" y1="154" x2="290" y2="154" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr-r)" />
  <rect x="292" y="136" width="66" height="36" fill="#1e293b" stroke="#f87171" rx="4" />
  <text class="mono" x="325" y="158" text-anchor="middle">FDCE 15</text>
  <text class="mono" x="48" y="196" fill="#fca5a5">x 32-bit bus = 512 Flip-Flops + Huge Reset Net!</text>
  <text class="note" x="48" y="216">SRL32 hardware has NO reset pin -&gt; blocked completely!</text>

  <rect class="box" x="34" y="240" width="402" height="128" stroke="#f87171" />
  <text class="mono" x="48" y="260" fill="#fca5a5">Async Reset on BRAM / DSP48 Output:</text>
  <text class="note" x="48" y="282">- Hard `DSP48E2` &amp; `BRAM` internal regs ONLY support</text>
  <text class="note" x="48" y="298">  ACTIVE-HIGH SYNCHRONOUS Reset (`RSTM`, `RSTP`, `RSTA`)!</text>
  <text class="note" x="48" y="318">- `negedge rst_n` forces synthesis to pull registers OUT</text>
  <text class="note" x="48" y="334">  into soft CLB `FDCE`s -&gt; loses DSP Fmax &amp; burns routing!</text>
  <text class="mono" x="48" y="354" fill="#fca5a5">- Worse: 1 async + 1 sync FF split Control Sets (2x CLBs)!</text>

  <!-- Right Panel: Best Practice (Reset-Free Datapath + Sync Active-High Reset) -->
  <rect class="panel" x="466" y="64" width="434" height="318" stroke="#34d399" />
  <text class="hdr" x="484" y="88" fill="#34d399">2. Optimal FPGA Pattern: Reset-Free Pipe &amp; Sync Reset</text>

  <rect class="box" x="480" y="102" width="406" height="128" stroke="#34d399" />
  <text class="mono" x="494" y="122" fill="#6ee7b7">Reset-Free 16-Deep Delay Pipe -&gt; Packs into 1 SRL32E!</text>
  <rect x="494" y="138" width="214" height="44" fill="#064e3b" stroke="#34d399" rx="5" />
  <text class="mono" x="601" y="156" fill="#6ee7b7" text-anchor="middle">SRL32E (Uses ONLY 1 LUT6!)</text>
  <text class="mono" x="601" y="172" fill="#e2e8f0" text-anchor="middle">A[4:0] = 5'd14 + CE</text>
  <line x1="708" y1="160" x2="736" y2="160" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />
  <rect x="738" y="138" width="132" height="44" fill="#1e293b" stroke="#38bdf8" rx="5" />
  <text class="mono" x="804" y="156" fill="#7dd3fc" text-anchor="middle">Optional FDRE</text>
  <text class="mono" x="804" y="172" fill="#e2e8f0" text-anchor="middle">Fast Output Reg</text>
  <text class="mono" x="494" y="204" fill="#6ee7b7">x 32-bit bus = ONLY 32 LUT6 + 32 FFs (94% Area Saved!)</text>
  <text class="note" x="494" y="220">Bitstream GSR initializes all SRAM/FFs cleanly at config!</text>

  <rect class="box" x="480" y="240" width="406" height="128" stroke="#34d399" />
  <text class="mono" x="494" y="260" fill="#6ee7b7">Four Golden FPGA Reset Rules:</text>
  <text class="note" x="494" y="282">1. Reset ONLY control FSMs, `valid`/`ready` flags, &amp; counters.</text>
  <text class="note" x="494" y="300">2. Leave datapath pipelines completely reset-free (`en`/`valid` qualifies).</text>
  <text class="note" x="494" y="318">3. Prefer **Active-High Synchronous Reset** (`if (rst)`) on Xilinx.</text>
  <text class="note" x="494" y="336">4. Synchronize external async board reset via 2-FF bridge per domain!</text>
  <text class="mono" x="494" y="356" fill="#7dd3fc">Result: Max DSP48/BRAM packing + compact control sets!</text>
</svg>
