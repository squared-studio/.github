<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">FPGA CDC Placement (`ASYNC_REG`) &amp; Correct XDC Exception Constraints</text>
  <text class="sub" x="460" y="48">Maximizing Synchronization Settling Time Inside One Slice While Bounding Async Gray-Code Bus Skew</text>

  <!-- Left Panel: Unconstrained Scattered Synchronizer -->
  <rect class="panel" x="20" y="64" width="430" height="318" stroke="#f87171" />
  <text class="hdr" x="38" y="88" fill="#f87171">1. Broken: Missing `ASYNC_REG` &amp; Blind `set_false_path`</text>

  <rect class="box" x="34" y="102" width="402" height="156" stroke="#f87171" />
  <text class="mono" x="48" y="122" fill="#fca5a5">Placer Scatters Sync Stages Across Distant CLBs:</text>

  <rect x="52" y="142" width="84" height="48" fill="#1e293b" stroke="#f87171" rx="4" />
  <text class="mono" x="94" y="164" text-anchor="middle">sync_ff[0]</text>
  <text class="mono" x="94" y="180" fill="#94a3b8" text-anchor="middle">(SLICE X5Y10)</text>

  <path d="M 136 166 Q 225 220 318 166" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-r)" />
  <text class="mono" x="225" y="206" fill="#fca5a5" text-anchor="middle">Long Route (~1.8 ns!) Eats t_met!</text>

  <rect x="322" y="142" width="96" height="48" fill="#1e293b" stroke="#f87171" rx="4" />
  <text class="mono" x="370" y="164" text-anchor="middle">sync_ff[1]</text>
  <text class="mono" x="370" y="180" fill="#94a3b8" text-anchor="middle">(SLICE X88Y90)</text>

  <text class="note" x="48" y="232">If `clk_b` period is 2.0 ns, 1.8 ns routing leaves ONLY 0.2 ns</text>
  <text class="note" x="48" y="248">for metastability to resolve -&gt; MTBF drops from years to HOURS!</text>

  <rect class="box" x="34" y="266" width="402" height="102" />
  <text class="mono" x="48" y="286" fill="#fca5a5">Multi-Bit `set_false_path` Gray Pointer Bug:</text>
  <text class="note" x="48" y="306">Placing `set_false_path` between `clk_a` &amp; `clk_b` lets the router</text>
  <text class="note" x="48" y="324">give `gray[0]` a 0.3 ns wire and `gray[3]` a 6.0 ns wire!</text>
  <text class="note" x="48" y="342">Skew &gt; 1 dst clock period breaks Gray single-bit guarantee completely!</text>

  <!-- Right Panel: Proper FPGA CDC Flow -->
  <rect class="panel" x="466" y="64" width="434" height="318" stroke="#34d399" />
  <text class="hdr" x="484" y="88" fill="#34d399">2. Golden FPGA CDC: `ASYNC_REG` + `-datapath_only`</text>

  <rect class="box" x="480" y="102" width="406" height="148" stroke="#34d399" />
  <text class="mono" x="494" y="122" fill="#6ee7b7">Tight Co-Location Inside ONE Single CLB Slice:</text>

  <rect x="520" y="138" width="326" height="72" fill="#064e3b" stroke="#34d399" rx="6" />
  <text class="mono" x="683" y="156" fill="#6ee7b7" text-anchor="middle">SINGLE SLICE (X24Y40) — Local Direct Wire (~30 ps!)</text>
  <rect x="542" y="166" width="110" height="34" fill="#0f172a" stroke="#34d399" rx="4" />
  <text class="mono" x="597" y="187" text-anchor="middle">sync_ff[0]</text>
  <line x1="652" y1="183" x2="710" y2="183" stroke="#34d399" stroke-width="2.2" marker-end="url(#arr-g)" />
  <rect x="712" y="166" width="110" height="34" fill="#0f172a" stroke="#34d399" rx="4" />
  <text class="mono" x="767" y="187" text-anchor="middle">sync_ff[1]</text>
  <text class="note" x="494" y="232">(* ASYNC_REG = "TRUE" *) guarantees adjacent slice packing,</text>
  <text class="note" x="494" y="246">prevents LUT shift-reg packing, and preserves debug probes!</text>

  <rect class="box" x="480" y="258" width="406" height="110" stroke="#38bdf8" />
  <text class="mono" x="494" y="278" fill="#7dd3fc">Mandatory XDC Constraint for Async Multi-Bit / FIFO Buses:</text>
  <text class="mono" x="494" y="300" fill="#fcd34d">set_max_delay -datapath_only -from [get_cells src_gray*]</text>
  <text class="mono" x="494" y="317" fill="#fcd34d">  -to [get_cells dst_sync0*] $T_src_period</text>
  <text class="mono" x="494" y="338" fill="#6ee7b7">set_bus_skew -from ... -to ... $T_src_or_dst</text>
  <text class="note" x="494" y="357">Ignores clock skew cleanly while strictly capping wire delay &amp; skew!</text>
</svg>
