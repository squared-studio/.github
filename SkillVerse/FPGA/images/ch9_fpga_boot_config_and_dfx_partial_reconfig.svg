<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">FPGA Boot Configuration Sequence &amp; Dynamic Function eXchange (DFX)</text>
  <text class="sub" x="460" y="48">From Power-On CRAM Frame Loading Through Live Partial Reconfiguration via Decouplers and ICAP</text>

  <!-- Top Flow: Power-On Config Sequence -->
  <rect class="panel" x="20" y="64" width="880" height="128" stroke="#38bdf8" />
  <text class="hdr" x="38" y="86" fill="#38bdf8">1. Cold Boot Configuration Flow (QSPI Flash / JTAG / Slave SelectMAP)</text>

  <rect class="box" x="36" y="102" width="128" height="72" stroke="#f59e0b" />
  <text class="mono" x="100" y="124" fill="#fcd34d" text-anchor="middle">1. POR &amp; Init</text>
  <text class="note" x="100" y="142" text-anchor="middle">VCCINT/AUX stable</text>
  <text class="note" x="100" y="158" text-anchor="middle">Clear CRAM (`INIT_B`)</text>

  <line x1="164" y1="138" x2="188" y2="138" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="190" y="102" width="144" height="72" stroke="#38bdf8" />
  <text class="mono" x="262" y="124" fill="#7dd3fc" text-anchor="middle">2. Sample M[2:0]</text>
  <text class="note" x="262" y="142" text-anchor="middle">Read Boot Mode pins</text>
  <text class="note" x="262" y="158" text-anchor="middle">Match `AA995566` sync</text>

  <line x1="334" y1="138" x2="358" y2="138" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="360" y="102" width="166" height="72" stroke="#a78bfa" />
  <text class="mono" x="443" y="124" fill="#c4b5fd" text-anchor="middle">3. Load CRAM Frames</text>
  <text class="note" x="443" y="142" text-anchor="middle">Write LUT, Routing, BRAM</text>
  <text class="note" x="443" y="158" text-anchor="middle">Verify Hardware CRC32</text>

  <line x1="526" y1="138" x2="550" y2="138" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="552" y="102" width="154" height="72" stroke="#34d399" />
  <text class="mono" x="629" y="124" fill="#6ee7b7" text-anchor="middle">4. Startup Sequencer</text>
  <text class="note" x="629" y="142" text-anchor="middle">Assert `DONE` High</text>
  <text class="note" x="629" y="158" text-anchor="middle">Release GTS (IO) &amp; GSR</text>

  <line x1="706" y1="138" x2="730" y2="138" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />

  <rect class="box" x="732" y="102" width="152" height="72" stroke="#34d399" />
  <text class="mono" x="808" y="124" fill="#6ee7b7" text-anchor="middle">5. User Fabric Live</text>
  <text class="note" x="808" y="142" text-anchor="middle">Multiboot Fallback if</text>
  <text class="note" x="808" y="158" text-anchor="middle">Golden Watchdog trips!</text>

  <!-- Bottom: DFX / Partial Reconfiguration -->
  <rect class="panel" x="20" y="206" width="880" height="178" stroke="#a78bfa" />
  <text class="hdr" x="38" y="228" fill="#a78bfa">2. Dynamic Function eXchange (DFX / Live Partial Reconfiguration via ICAP)</text>

  <rect class="box" x="36" y="242" width="236" height="126" stroke="#38bdf8" />
  <text class="mono" x="154" y="264" fill="#7dd3fc" text-anchor="middle">Static Region (Always Live!)</text>
  <text class="note" x="154" y="286" text-anchor="middle">PCIe Link, DDR4 Memory, Clocks,</text>
  <text class="note" x="154" y="302" text-anchor="middle">Ethernet stay 100% uninterrupted</text>
  <rect x="52" y="316" width="204" height="40" fill="#1e293b" stroke="#f59e0b" rx="4" />
  <text class="mono" x="154" y="335" fill="#fcd34d" text-anchor="middle">ICAPE3 / PCAP Controller</text>
  <text class="mono" x="154" y="350" fill="#94a3b8" text-anchor="middle">Streams Partial .bit (~400 MB/s)</text>

  <line x1="272" y1="304" x2="314" y2="304" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)" />

  <rect class="box" x="316" y="242" width="194" height="126" stroke="#f87171" />
  <text class="mono" x="413" y="264" fill="#fca5a5" text-anchor="middle">DFX Decoupler + Gray</text>
  <text class="note" x="413" y="286" text-anchor="middle">1. Deactivate AXI cleanly</text>
  <text class="note" x="413" y="304" text-anchor="middle">2. Assert `DECOUPLE = 1`</text>
  <text class="note" x="413" y="322" text-anchor="middle">   (Masks random RM toggles!)</text>
  <text class="note" x="413" y="340" text-anchor="middle">3. Reset RP + Release `0`</text>
  <text class="mono" x="413" y="358" fill="#6ee7b7" text-anchor="middle">Zero Static AXI Hang!</text>

  <line x1="510" y1="304" x2="546" y2="304" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)" />

  <rect class="box" x="548" y="242" width="336" height="126" stroke="#34d399" />
  <text class="mono" x="716" y="264" fill="#6ee7b7" text-anchor="middle">Reconfigurable Partition (RP Pblock)</text>
  <rect x="564" y="276" width="144" height="76" fill="#064e3b" stroke="#34d399" rx="5" />
  <text class="mono" x="636" y="300" fill="#6ee7b7" text-anchor="middle">RM_A: Codec H265</text>
  <text class="note" x="636" y="320" text-anchor="middle">(Swapped out live</text>
  <text class="note" x="636" y="336" text-anchor="middle">in milliseconds)</text>
  <text class="mono" x="716" y="318" fill="#fcd34d" text-anchor="middle">&lt;-&gt;</text>
  <rect x="728" y="276" width="140" height="76" fill="#2e1065" stroke="#a78bfa" rx="5" />
  <text class="mono" x="798" y="300" fill="#c4b5fd" text-anchor="middle">RM_B: AI CNN</text>
  <text class="note" x="798" y="320" text-anchor="middle">Same Proxy Pin</text>
  <text class="note" x="798" y="336" text-anchor="middle">Routing Anchors!</text>
</svg>
