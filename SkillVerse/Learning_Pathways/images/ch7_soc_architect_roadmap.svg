<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .phase { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-lime" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#84cc16" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">SoC, Interconnect, and Low-Power Architect Roadmap</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Connecting RISC-V compute, tiered AMBA/OBI interconnects, low-power UPF domains, and SoC sign-off</text>

  <!-- Phase 1 -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#38bdf8"/>
    <text x="14" y="24" class="mono" fill="#38bdf8">PHASE 1 (WEEKS 1–4)</text>
    <text x="14" y="44" class="txt-hdr">ISA, Firmware &amp; MMIO</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#38bdf8"/>
    <text x="20" y="76" class="mono" fill="#7dd3fc">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RISC_V_Assembly Ch 1–7</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• C Ch 1–4, 7 (MMIO)</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• RTL_Design Ch 5–7</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• CSRs, traps &amp; bare-metal boot</text>
    <text x="20" y="210" class="txt-sub">• Memory maps &amp; alignment</text>
    <text x="20" y="226" class="txt-sub">• Hardware/software contract</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#38bdf8" fill="#0d1e33"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#7dd3fc">Goal: Arch Spec Fluency</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Boot flow + register maps</text>
  </g>
  <path d="M 238 242 L 254 242" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Phase 2 -->
  <g transform="translate(256, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#34d399"/>
    <text x="14" y="24" class="mono" fill="#34d399">PHASE 2 (WEEKS 5–9)</text>
    <text x="14" y="44" class="txt-hdr">Non-Coherent Bus Ladder</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#34d399"/>
    <text x="20" y="76" class="mono" fill="#6ee7b7">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• APB_Protocol Ch 1–7</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• OBI Ch 1–10</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• AXI_Protocol Ch 1–10</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Burst ordering &amp; IDs</text>
    <text x="20" y="210" class="txt-sub">• Crossbars &amp; width bridges</text>
    <text x="20" y="226" class="txt-sub">• QoS, AxCACHE &amp; atomics</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#34d399" fill="#0d221c"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#6ee7b7">Build: AXI-to-APB Bridge</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Multi-master crossbar</text>
  </g>
  <path d="M 470 242 L 486 242" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>

  <!-- Phase 3 -->
  <g transform="translate(488, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#f59e0b"/>
    <text x="14" y="24" class="mono" fill="#fcd34d">PHASE 3 (WEEKS 10–15)</text>
    <text x="14" y="44" class="txt-hdr">Cache Coherent Fabrics</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#f59e0b"/>
    <text x="20" y="76" class="mono" fill="#fcd34d">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• ACE_Protocol Ch 1–10</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• CHI_Protocol Ch 1–10</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• MOESI, NoC &amp; DVM</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Snoop filters &amp; directories</text>
    <text x="20" y="210" class="txt-sub">• Credit-based flit NoCs</text>
    <text x="20" y="226" class="txt-sub">• Barriers &amp; deadlock avoidance</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#f59e0b" fill="#1b150b"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#fcd34d">Goal: Coherent SoC Design</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">RN / HN / SN transaction flows</text>
  </g>
  <path d="M 702 242 L 718 242" class="edge" stroke="#84cc16" marker-end="url(#arr-lime)"/>

  <!-- Phase 4 -->
  <g transform="translate(720, 82)">
    <rect x="0" y="0" width="216" height="320" class="phase" stroke="#84cc16"/>
    <text x="14" y="24" class="mono" fill="#bef264">PHASE 4 (WEEKS 16–22)</text>
    <text x="14" y="44" class="txt-hdr">Power, CDC &amp; System Signoff</text>

    <rect x="12" y="58" width="192" height="86" class="inner" stroke="#84cc16"/>
    <text x="20" y="76" class="mono" fill="#bef264">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• UPF_CPF Ch 1–12</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• CDC_RDC Ch 8–12</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• GLS Ch 9–12 &amp; DFT Ch 8</text>

    <rect x="12" y="156" width="192" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Hierarchical UPF &amp; PMC</text>
    <text x="20" y="210" class="txt-sub">• Multi-domain reset trees</text>
    <text x="20" y="226" class="txt-sub">• PG GLS &amp; SoC tape-out</text>

    <rect x="12" y="256" width="192" height="50" class="inner" stroke="#84cc16" fill="#121e14"/>
    <text x="108" y="276" text-anchor="middle" class="mono" fill="#bef264">Capstone: Mini RISC-V SoC</text>
    <text x="108" y="294" text-anchor="middle" class="txt-sub">Core + Bus + UART + UPF</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(24, 420)">
    <rect x="0" y="0" width="912" height="96" class="phase" stroke="#84cc16" fill="#121e14"/>
    <text x="18" y="24" class="txt-hdr" fill="#bef264">The Protocol Ladder Principle: Never Jump Straight to CHI</text>
    <text x="18" y="48" class="mono" fill="#cbd5e1">APB4 (Register Access) → OBI (Simple Pipelined) → AXI4 (Bursts &amp; Out-of-Order) → ACE (Snoops) → CHI (Packet NoC)</text>
    <text x="18" y="68" class="txt-sub">Each protocol layer introduces one orthogonal architectural concept so you master hardware interconnects without overwhelm.</text>
  </g>
</svg>
