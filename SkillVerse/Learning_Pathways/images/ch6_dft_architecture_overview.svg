<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.4; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">SoC DFT Architecture: Scan, Compression, MBIST, and IJTAG</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">How IEEE 1149.1 TAP &amp; 1687 IJTAG orchestrate scan compression, on-chip clocks, and memory BIST across an SoC</text>

  <!-- Outer SoC Die Boundary -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="896" height="416" class="panel" stroke="#334155"/>
    <text x="18" y="24" class="mono" fill="#94a3b8">SOC DIE BOUNDARY (IEEE 1149.1 BOUNDARY SCAN I/O RING)</text>

    <!-- Left: JTAG / IJTAG Control -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="196" height="348" class="panel" stroke="#f59e0b"/>
      <text x="98" y="26" text-anchor="middle" class="txt-hdr" fill="#fcd34d">JTAG / IJTAG Control</text>
      <text x="98" y="44" text-anchor="middle" class="mono" fill="#cbd5e1">TCK TMS TDI TDO TRST</text>

      <rect x="14" y="64" width="168" height="72" class="inner" stroke="#f59e0b"/>
      <text x="98" y="88" text-anchor="middle" class="mono" fill="#fcd34d">IEEE 1149.1 TAP</text>
      <text x="98" y="108" text-anchor="middle" class="txt-sub">16-state FSM + IR/DR</text>
      <text x="98" y="124" text-anchor="middle" class="txt-sub">Drives Boundary Scan</text>

      <rect x="14" y="152" width="168" height="84" class="inner" stroke="#38bdf8"/>
      <text x="98" y="176" text-anchor="middle" class="mono" fill="#7dd3fc">IEEE 1687 IJTAG SIBs</text>
      <text x="98" y="196" text-anchor="middle" class="txt-sub">Hierarchical ICL/PDL</text>
      <text x="98" y="212" text-anchor="middle" class="txt-sub">Selects MBIST / OCC /</text>
      <text x="98" y="226" text-anchor="middle" class="txt-sub">SerDes test instruments</text>

      <rect x="14" y="252" width="168" height="78" class="inner" stroke="#34d399"/>
      <text x="98" y="274" text-anchor="middle" class="mono" fill="#6ee7b7">OCC (Clock Control)</text>
      <text x="98" y="294" text-anchor="middle" class="txt-sub">Slow shift clk vs PLL</text>
      <text x="98" y="310" text-anchor="middle" class="txt-sub">2-pulse at-speed capture</text>
    </g>

    <path d="M 216 140 L 254 140" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>
    <path d="M 216 320 L 254 320" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

    <!-- Top Right: Compressed Scan Chains + ATPG -->
    <g transform="translate(258, 44)">
      <rect x="0" y="0" width="618" height="196" class="panel" stroke="#f43f5e"/>
      <text x="18" y="26" class="txt-hdr" fill="#fda4af">Logic Scan Compression &amp; ATPG Data Path</text>
      <text x="600" y="26" text-anchor="end" class="mono" fill="#fda4af">10x–100x Pin &amp; Cycle Reduction</text>

      <rect x="16" y="46" width="128" height="128" class="inner" stroke="#f43f5e"/>
      <text x="80" y="74" text-anchor="middle" class="mono" fill="#fda4af">Decompressor</text>
      <text x="80" y="96" text-anchor="middle" class="txt-sub">Few scan_in pins</text>
      <text x="80" y="114" text-anchor="middle" class="txt-sub">broadcast into many</text>
      <text x="80" y="132" text-anchor="middle" class="txt-sub">internal chains</text>

      <path d="M 144 82 L 178 82" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>
      <path d="M 144 112 L 178 112" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>
      <path d="M 144 142 L 178 142" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>

      <rect x="182" y="46" width="256" height="128" class="inner" stroke="#38bdf8"/>
      <text x="310" y="68" text-anchor="middle" class="mono" fill="#7dd3fc">Mux-D Scan Chains (SE = 1 Shift / 0 Capture)</text>
      <rect x="196" y="80" width="228" height="20" rx="3" fill="#131d33" stroke="#38bdf8"/>
      <text x="310" y="94" text-anchor="middle" class="mono" fill="#cbd5e1">FF0 → FF1 → FF2 → ... → FFk</text>
      <rect x="196" y="108" width="228" height="20" rx="3" fill="#131d33" stroke="#38bdf8"/>
      <text x="310" y="122" text-anchor="middle" class="mono" fill="#cbd5e1">FF0 → FF1 → FF2 → ... → FFk</text>
      <rect x="196" y="136" width="228" height="20" rx="3" fill="#131d33" stroke="#38bdf8"/>
      <text x="310" y="150" text-anchor="middle" class="mono" fill="#cbd5e1">FF0 → FF1 → FF2 → ... → FFk</text>

      <path d="M 438 82 L 472 82" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>
      <path d="M 438 112 L 472 112" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>
      <path d="M 438 142 L 472 142" class="edge" stroke="#f43f5e" marker-end="url(#arr-rose)"/>

      <rect x="476" y="46" width="126" height="128" class="inner" stroke="#f43f5e"/>
      <text x="539" y="74" text-anchor="middle" class="mono" fill="#fda4af">XOR Compactor</text>
      <text x="539" y="96" text-anchor="middle" class="txt-sub">+ X-Masking logic</text>
      <text x="539" y="114" text-anchor="middle" class="txt-sub">blocks uninitialized</text>
      <text x="539" y="132" text-anchor="middle" class="txt-sub">X corruption</text>
    </g>

    <!-- Bottom Right: MBIST & Core Isolation -->
    <g transform="translate(258, 256)">
      <rect x="0" y="0" width="618" height="136" class="panel" stroke="#34d399"/>
      <text x="18" y="26" class="txt-hdr" fill="#34d399">Embedded Memory BIST (MBIST + BISR) &amp; Core Wrappers</text>

      <rect x="16" y="44" width="286" height="76" class="inner" stroke="#34d399"/>
      <text x="28" y="64" class="mono" fill="#6ee7b7">MBIST Controller + Repair (BISR)</text>
      <text x="28" y="84" class="txt-sub">Runs March-C at-speed on L1/L2/SoC SRAMs;</text>
      <text x="28" y="102" class="txt-sub">maps spare rows/cols via eFuse redundancy</text>

      <rect x="316" y="44" width="286" height="76" class="inner" stroke="#a855f7"/>
      <text x="328" y="64" class="mono" fill="#d8b4fe">IEEE 1500 Core Wrappers &amp; LBIST</text>
      <text x="328" y="84" class="txt-sub">Isolates hierarchical chiplets/IP blocks;</text>
      <text x="328" y="102" class="txt-sub">LBIST supports in-system automotive self-test</text>
    </g>
  </g>
</svg>
