<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .phase { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Formal Verification Engineer 4-Phase Learning Roadmap</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">From temporal logic &amp; SVA properties to SAT/SMT proof engines, abstractions, and formal sign-off</text>

  <!-- Phase 1 -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#38bdf8"/>
    <text x="14" y="24" class="mono" fill="#38bdf8">PHASE 1 (WEEKS 1–3)</text>
    <text x="14" y="44" class="txt-hdr">RTL &amp; Temporal Logic</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#38bdf8"/>
    <text x="20" y="76" class="mono" fill="#7dd3fc">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RTL_Design Ch 1–6</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• Formal_Verif Ch 1–2</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• FSMs &amp; State Space</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• State transition graphs</text>
    <text x="20" y="210" class="txt-sub">• Safety vs Liveness props</text>
    <text x="20" y="226" class="txt-sub">• LTL vs CTL operators</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#38bdf8" fill="#0d1e33"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#7dd3fc">Goal: Spec → Invariants</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Translate English to logic</text>
  </g>
  <path d="M 238 242 L 254 242" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Phase 2 -->
  <g transform="translate(256, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#a855f7"/>
    <text x="14" y="24" class="mono" fill="#d8b4fe">PHASE 2 (WEEKS 4–7)</text>
    <text x="14" y="44" class="txt-hdr">SVA &amp; Formal Testbenches</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#a855f7"/>
    <text x="20" y="76" class="mono" fill="#d8b4fe">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• SystemVerilog Ch 20</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• Formal_Verif Ch 3–5</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• bind &amp; SymbiYosys</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• assert / assume / cover</text>
    <text x="20" y="210" class="txt-sub">• |-&gt; vs |=&gt;, ##[1:N], $past</text>
    <text x="20" y="226" class="txt-sub">• Auxiliary scoreboard glue</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#a855f7" fill="#1b1029"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#d8b4fe">Build: FIFO &amp; Arbiter FV</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Data integrity + no starvation</text>
  </g>
  <path d="M 470 242 L 486 242" class="edge" stroke="#a855f7" marker-end="url(#arr-purple)"/>

  <!-- Phase 3 -->
  <g transform="translate(488, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#34d399"/>
    <text x="14" y="24" class="mono" fill="#34d399">PHASE 3 (WEEKS 8–12)</text>
    <text x="14" y="44" class="txt-hdr">Engines &amp; Protocols</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#34d399"/>
    <text x="20" y="76" class="mono" fill="#6ee7b7">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• Formal_Verif Ch 6–7</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• APB, OBI &amp; AXI_Protocol</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• BMC, k-Induction, IC3</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Cutpoints &amp; black-boxing</text>
    <text x="20" y="210" class="txt-sub">• Counter/FIFO abstractions</text>
    <text x="20" y="226" class="txt-sub">• Helper invariants &amp; CEX</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#34d399" fill="#0d221c"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#6ee7b7">Build: AXI-Lite / OBI FV</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Full protocol compliance</text>
  </g>
  <path d="M 702 242 L 718 242" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

  <!-- Phase 4 -->
  <g transform="translate(720, 82)">
    <rect x="0" y="0" width="216" height="320" class="phase" stroke="#f59e0b"/>
    <text x="14" y="24" class="mono" fill="#fcd34d">PHASE 4 (WEEKS 13–18)</text>
    <text x="14" y="44" class="txt-hdr">Formal Apps &amp; Sign-Off</text>

    <rect x="12" y="58" width="192" height="86" class="inner" stroke="#f59e0b"/>
    <text x="20" y="76" class="mono" fill="#fcd34d">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• Formal_Verif Ch 8</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• CDC_RDC Ch 10–11</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• SEC / Connectivity / X</text>

    <rect x="12" y="156" width="192" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Over-constraint auditing</text>
    <text x="20" y="210" class="txt-sub">• Sequential Equiv (SEC)</text>
    <text x="20" y="226" class="txt-sub">• Hybrid Formal + Sim signoff</text>

    <rect x="12" y="256" width="192" height="50" class="inner" stroke="#f59e0b" fill="#1b150b"/>
    <text x="108" y="276" text-anchor="middle" class="mono" fill="#fcd34d">Capstone: CDC + Bus Signoff</text>
    <text x="108" y="294" text-anchor="middle" class="txt-sub">100% COI + bounded proof</text>
  </g>

  <!-- Bottom Highlight -->
  <g transform="translate(24, 420)">
    <rect x="0" y="0" width="912" height="96" class="phase" stroke="#a855f7" fill="#160f24"/>
    <text x="18" y="24" class="txt-hdr" fill="#d8b4fe">Open-Source Formal Practice Lab (Run Free on Linux / GitHub Actions)</text>
    <text x="18" y="48" class="mono" fill="#cbd5e1">Tools: Yosys + SymbiYosys (sby) + Z3 / Bitwuzla / ABC (PDR)</text>
    <text x="18" y="68" class="txt-sub">You can practice real BMC, k-induction, and IC3/PDR proofs on arbiters, FIFOs, and AXI-Lite modules without commercial licenses.</text>
  </g>
</svg>
