<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13.5px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Three-Tier Silicon Portfolio Ladder &amp; Automated CI</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Building recruiter-ready open-source hardware repositories backed by simulation, formal proofs, and GitHub CI</text>

  <!-- Tier 1 -->
  <g transform="translate(32, 82)">
    <rect x="0" y="0" width="284" height="270" class="panel" stroke="#38bdf8"/>
    <text x="16" y="26" class="mono" fill="#38bdf8">TIER 1 — BUILDING BLOCKS</text>
    <text x="16" y="46" class="txt-hdr">Core RTL &amp; TB Mechanics</text>

    <rect x="14" y="62" width="256" height="122" class="inner" stroke="#38bdf8"/>
    <text x="24" y="82" class="mono" fill="#7dd3fc">Example Projects:</text>
    <text x="24" y="102" class="txt-sub">• Parameterized Sync &amp; Async FIFO</text>
    <text x="24" y="120" class="txt-sub">• Round-Robin Arbiter + Skid Buffer</text>
    <text x="24" y="138" class="txt-sub">• SV Self-Checking TB + SVA</text>
    <text x="24" y="156" class="txt-sub">• SymbiYosys (sby) formal proof</text>

    <rect x="14" y="196" width="256" height="58" class="inner" stroke="#334155"/>
    <text x="24" y="216" class="mono" fill="#cbd5e1">Proves to Interviewers:</text>
    <text x="24" y="236" class="txt-sub">Clean SV style, zero latches, Gray CDC</text>
  </g>
  <path d="M 316 216 L 336 216" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Tier 2 -->
  <g transform="translate(338, 82)">
    <rect x="0" y="0" width="284" height="270" class="panel" stroke="#34d399"/>
    <text x="16" y="26" class="mono" fill="#34d399">TIER 2 — PROTOCOL-WRAPPED IP</text>
    <text x="16" y="46" class="txt-hdr">Industry Bus &amp; VIP Mastery</text>

    <rect x="14" y="62" width="256" height="122" class="inner" stroke="#34d399"/>
    <text x="24" y="82" class="mono" fill="#6ee7b7">Example Projects:</text>
    <text x="24" y="102" class="txt-sub">• APB4 / AXI4-Lite UART + FIFOs</text>
    <text x="24" y="120" class="txt-sub">• AXI4-Stream Packetizer / DMA</text>
    <text x="24" y="138" class="txt-sub">• Full cocotb or UVM Protocol VIP</text>
    <text x="24" y="156" class="txt-sub">• FPGA bitstream + ILA capture</text>

    <rect x="14" y="196" width="256" height="58" class="inner" stroke="#334155"/>
    <text x="24" y="216" class="mono" fill="#cbd5e1">Proves to Interviewers:</text>
    <text x="24" y="236" class="txt-sub">Spec reading, handshakes, coverage</text>
  </g>
  <path d="M 622 216 L 642 216" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

  <!-- Tier 3 -->
  <g transform="translate(644, 82)">
    <rect x="0" y="0" width="284" height="270" class="panel" stroke="#a855f7"/>
    <text x="16" y="26" class="mono" fill="#d8b4fe">TIER 3 — VERIFIED SUBSYSTEM</text>
    <text x="16" y="46" class="txt-hdr">SoC &amp; Full Sign-Off Mindset</text>

    <rect x="14" y="62" width="256" height="122" class="inner" stroke="#a855f7"/>
    <text x="24" y="82" class="mono" fill="#d8b4fe">Example Projects:</text>
    <text x="24" y="102" class="txt-sub">• RV32I Pipelined Core + OBI/AXI</text>
    <text x="24" y="120" class="txt-sub">• Multi-master Crossbar + UART</text>
    <text x="24" y="138" class="txt-sub">• Bare-metal C firmware + traps</text>
    <text x="24" y="156" class="txt-sub">• Yosys synth + UPF/CDC notes</text>

    <rect x="14" y="196" width="256" height="58" class="inner" stroke="#334155"/>
    <text x="24" y="216" class="mono" fill="#cbd5e1">Proves to Interviewers:</text>
    <text x="24" y="236" class="txt-sub">System integration, debug, HW/SW</text>
  </g>

  <!-- Bottom Quality Bar: Every Repo Must Have -->
  <g transform="translate(32, 374)">
    <rect x="0" y="0" width="896" height="122" class="panel" stroke="#f59e0b" fill="#17140d"/>
    <text x="20" y="26" class="txt-hdr" fill="#fcd34d">Every Portfolio Repository Should Ship With Production Engineering Standards</text>
    <text x="20" y="52" class="mono" fill="#38bdf8">1. Block &amp; Timing Diagrams</text>
    <text x="230" y="52" class="txt-sub">Architecture SVG, register map table, and state machine spec in README.md.</text>
    <text x="20" y="74" class="mono" fill="#34d399">2. One-Command Makefile</text>
    <text x="230" y="74" class="txt-sub">`make lint`, `make sim`, `make formal`, `make synth` working out of the box.</text>
    <text x="20" y="96" class="mono" fill="#d8b4fe">3. Green GitHub Actions CI</text>
    <text x="230" y="96" class="txt-sub">Automated Verilator/cocotb/SymbiYosys badge + failure waveform artifacts (git Ch 13).</text>
  </g>
</svg>
