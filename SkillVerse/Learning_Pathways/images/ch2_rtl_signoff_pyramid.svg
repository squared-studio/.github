<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .tier { stroke-width: 1.8; rx: 8px; }
      .panel { fill: #0f172a; stroke-width: 1.6; rx: 10px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="520" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Production RTL Quality &amp; Sign-Off Pyramid</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Passing functional simulation is only Layer 1 — tape-out RTL must clear five additional sign-off gates</text>

  <!-- Pyramid Tiers (Left Side) -->
  <g transform="translate(36, 86)">
    <!-- Tier 6 (Top) -->
    <rect x="135" y="0" width="230" height="52" class="tier" fill="#1e102f" stroke="#a855f7"/>
    <text x="250" y="22" text-anchor="middle" class="mono" fill="#d8b4fe">6. LEC &amp; GLS SIGN-OFF</text>
    <text x="250" y="40" text-anchor="middle" class="txt-sub">RTL == Netlist + SDF timing clean</text>

    <!-- Tier 5 -->
    <rect x="108" y="64" width="284" height="54" class="tier" fill="#231410" stroke="#f59e0b"/>
    <text x="250" y="87" text-anchor="middle" class="mono" fill="#fcd34d">5. SYNTHESIS, SDC &amp; STA PPA</text>
    <text x="250" y="105" text-anchor="middle" class="txt-sub">Setup/Hold slack, Area, Dynamic Power</text>

    <!-- Tier 4 -->
    <rect x="81" y="130" width="338" height="54" class="tier" fill="#22101a" stroke="#f43f5e"/>
    <text x="250" y="153" text-anchor="middle" class="mono" fill="#fda4af">4. UPF POWER INTENT &amp; DFT READY</text>
    <text x="250" y="171" text-anchor="middle" class="txt-sub">Isolation, Level Shifters, Scan/Reset Control</text>

    <!-- Tier 3 -->
    <rect x="54" y="196" width="392" height="54" class="tier" fill="#0d221c" stroke="#34d399"/>
    <text x="250" y="219" text-anchor="middle" class="mono" fill="#6ee7b7">3. CDC &amp; RDC STRUCTURAL SIGN-OFF</text>
    <text x="250" y="237" text-anchor="middle" class="txt-sub">2-FF Sync, Gray FIFOs, Reset Bridges, SGDC</text>

    <!-- Tier 2 -->
    <rect x="27" y="262" width="446" height="54" class="tier" fill="#0d1e33" stroke="#38bdf8"/>
    <text x="250" y="285" text-anchor="middle" class="mono" fill="#7dd3fc">2. RTL LINT &amp; SYNTHESIZABLE STYLE</text>
    <text x="250" y="303" text-anchor="middle" class="txt-sub">No latches, width matches, clean FSM &amp; non-blocking</text>

    <!-- Tier 1 (Base) -->
    <rect x="0" y="328" width="500" height="58" class="tier" fill="#121e14" stroke="#84cc16"/>
    <text x="250" y="352" text-anchor="middle" class="mono" fill="#bef264">1. MICROARCHITECTURE &amp; FUNCTIONAL SPEC</text>
    <text x="250" y="370" text-anchor="middle" class="txt-sub">Protocol handshakes, latency budget, golden behavior</text>
  </g>

  <!-- Right Side: SkillVerse Course Mapping -->
  <g transform="translate(566, 86)">
    <rect x="0" y="0" width="362" height="386" class="panel" stroke="#38bdf8"/>
    <text x="18" y="28" class="txt-hdr" fill="#38bdf8">Where to Master Each Sign-Off Gate</text>

    <text x="18" y="58" class="mono" fill="#d8b4fe">Gate 6 → GLS (Ch 1–7, 9–12)</text>
    <text x="18" y="76" class="txt-sub">Delta-cycle races, SDF annotation, X-prop triage</text>

    <text x="18" y="114" class="mono" fill="#fcd34d">Gate 5 → RTL_Design Ch 9 &amp; Vivado Ch 5–6</text>
    <text x="18" y="132" class="txt-sub">Clock uncertainty, false/multicycle paths, WNS/TNS</text>

    <text x="18" y="170" class="mono" fill="#fda4af">Gate 4 → UPF_CPF (Ch 1–8) &amp; DFT (Ch 1–3)</text>
    <text x="18" y="188" class="txt-sub">Power domains, retention flops, scan testability</text>

    <text x="18" y="226" class="mono" fill="#6ee7b7">Gate 3 → CDC_RDC (Ch 1–12)</text>
    <text x="18" y="244" class="txt-sub">MTBF math, DMUX/MCP, async FIFOs, RDC bridges</text>

    <text x="18" y="282" class="mono" fill="#7dd3fc">Gate 2 → RTL_Design Ch 3 &amp; SystemVerilog</text>
    <text x="18" y="300" class="txt-sub">Verilator -Wall, Verible lint, 2-always FSMs</text>

    <text x="18" y="338" class="mono" fill="#bef264">Gate 1 → RTL_Design Ch 1–7 &amp; Protocols</text>
    <text x="18" y="356" class="txt-sub">Datapaths, valid/ready pipelines, APB/AXI4/OBI</text>
  </g>
</svg>
