<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.4; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Modern Multi-Core SoC Fabric &amp; Power-Domain Topology</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">How OBI, AXI4, ACE/CHI coherent fabrics, APB peripherals, and UPF power domains interlock</text>

  <!-- Top Row: Masters & Accelerators -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="276" height="126" class="panel" stroke="#38bdf8"/>
    <text x="16" y="24" class="mono" fill="#38bdf8">PD_CPU0 (Switchable Power Domain)</text>
    <rect x="14" y="36" width="248" height="74" class="inner" stroke="#38bdf8"/>
    <text x="138" y="56" text-anchor="middle" class="txt-hdr">RISC-V / CPU Cluster 0</text>
    <text x="138" y="76" text-anchor="middle" class="mono" fill="#7dd3fc">Core (OBI) → L1/L2 Cache (MOESI)</text>
    <text x="138" y="94" text-anchor="middle" class="txt-sub">ISO + Retention Flops at boundary</text>
  </g>

  <g transform="translate(342, 78)">
    <rect x="0" y="0" width="276" height="126" class="panel" stroke="#38bdf8"/>
    <text x="16" y="24" class="mono" fill="#38bdf8">PD_CPU1 (Switchable Power Domain)</text>
    <rect x="14" y="36" width="248" height="74" class="inner" stroke="#38bdf8"/>
    <text x="138" y="56" text-anchor="middle" class="txt-hdr">RISC-V / CPU Cluster 1</text>
    <text x="138" y="76" text-anchor="middle" class="mono" fill="#7dd3fc">Core (OBI) → L1/L2 Cache (MOESI)</text>
    <text x="138" y="94" text-anchor="middle" class="txt-sub">DVFS Level Shifters across domain</text>
  </g>

  <g transform="translate(652, 78)">
    <rect x="0" y="0" width="276" height="126" class="panel" stroke="#a855f7"/>
    <text x="16" y="24" class="mono" fill="#d8b4fe">PD_ACCEL (DMA / NPU Domain)</text>
    <rect x="14" y="36" width="248" height="74" class="inner" stroke="#a855f7"/>
    <text x="138" y="56" text-anchor="middle" class="txt-hdr">DMA &amp; Hardware Accelerators</text>
    <text x="138" y="76" text-anchor="middle" class="mono" fill="#d8b4fe">AXI4 / ACE-Lite (I/O Coherent)</text>
    <text x="138" y="94" text-anchor="middle" class="txt-sub">Async CDC bridge into fabric clock</text>
  </g>

  <!-- Arrows down into Coherent NoC -->
  <path d="M 170 204 L 170 238" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>
  <text x="224" y="226" class="mono" fill="#7dd3fc">ACE / CHI RN-F</text>
  <path d="M 480 204 L 480 238" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>
  <text x="534" y="226" class="mono" fill="#7dd3fc">ACE / CHI RN-F</text>
  <path d="M 790 204 L 790 238" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>
  <text x="844" y="226" class="mono" fill="#fcd34d">AXI4 / RN-I</text>

  <!-- Middle Layer: Coherent Interconnect / NoC -->
  <g transform="translate(32, 242)">
    <rect x="0" y="0" width="896" height="92" class="panel" stroke="#f59e0b" fill="#17140d"/>
    <text x="448" y="28" text-anchor="middle" class="txt-hdr" fill="#fcd34d">Always-On Coherent Interconnect / NoC (CCI / CMN — AMBA ACE or CHI)</text>
    <text x="448" y="50" text-anchor="middle" class="mono" fill="#cbd5e1">Home Nodes (HN-F) • Snoop Filters &amp; System Cache • AXI4 / CHI Bridges • QoS &amp; Ordering</text>
    <text x="448" y="72" text-anchor="middle" class="txt-sub">PD_TOP (Always-On Domain) + Power Management Controller (PMC) + Multi-Domain Reset Sequencer</text>
  </g>

  <!-- Arrows down to Targets -->
  <path d="M 180 334 L 180 370" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>
  <text x="234" y="356" class="mono" fill="#6ee7b7">CHI SN-F / AXI4</text>

  <path d="M 480 334 L 480 370" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>
  <text x="530" y="356" class="mono" fill="#7dd3fc">AXI4 Memory</text>

  <path d="M 760 334 L 760 370" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>
  <text x="820" y="356" class="mono" fill="#6ee7b7">AXI-to-APB4</text>

  <!-- Bottom Row: Memory, Boot ROM, Peripherals -->
  <g transform="translate(32, 374)">
    <rect x="0" y="0" width="286" height="134" class="panel" stroke="#34d399"/>
    <text x="16" y="26" class="txt-hdr" fill="#34d399">DDR Memory Subsystem</text>
    <text x="16" y="48" class="mono" fill="#6ee7b7">DDR4/DDR5 Controller + PHY</text>
    <text x="16" y="70" class="txt-sub">• High-bandwidth burst traffic</text>
    <text x="16" y="88" class="txt-sub">• ECC + MBIST + CDC to PHY clk</text>
    <text x="16" y="106" class="txt-sub">• Retention self-refresh in sleep</text>
  </g>

  <g transform="translate(337, 374)">
    <rect x="0" y="0" width="286" height="134" class="panel" stroke="#38bdf8"/>
    <text x="16" y="26" class="txt-hdr" fill="#38bdf8">On-Chip SRAM &amp; Boot ROM</text>
    <text x="16" y="48" class="mono" fill="#7dd3fc">Tightly Coupled / Shared SRAM</text>
    <text x="16" y="70" class="txt-sub">• Bare-metal C bootloader image</text>
    <text x="16" y="88" class="txt-sub">• MBIST / BISR redundancy repair</text>
    <text x="16" y="106" class="txt-sub">• Low-latency AXI4 / OBI target</text>
  </g>

  <g transform="translate(642, 374)">
    <rect x="0" y="0" width="286" height="134" class="panel" stroke="#84cc16"/>
    <text x="16" y="26" class="txt-hdr" fill="#bef264">APB4 Peripheral Subsystem</text>
    <text x="16" y="48" class="mono" fill="#bef264">UART, GPIO, Timers, PMC, PLIC</text>
    <text x="16" y="70" class="txt-sub">• Simple CSR register reads/writes</text>
    <text x="16" y="88" class="txt-sub">• PCLK gating + PPROT security</text>
    <text x="16" y="106" class="txt-sub">• Interrupt lines back to CPU</text>
  </g>
</svg>
