<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .phase { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">FPGA Design &amp; Prototyping Engineer 4-Phase Roadmap</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">From synthesizable RTL and board electronics to Vivado implementation, XDC timing closure, and ILA debug</text>

  <!-- Phase 1 -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#38bdf8"/>
    <text x="14" y="24" class="mono" fill="#38bdf8">PHASE 1 (WEEKS 1–3)</text>
    <text x="14" y="44" class="txt-hdr">RTL &amp; Board Electronics</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#38bdf8"/>
    <text x="20" y="76" class="mono" fill="#7dd3fc">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RTL_Design Ch 1–5</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• SystemVerilog Ch 1–9</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• Electronics Ch 1–5, 9</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Synchronous FPGA style</text>
    <text x="20" y="210" class="txt-sub">• Active-high sync resets</text>
    <text x="20" y="226" class="txt-sub">• Crystal clocks &amp; pull-ups</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#38bdf8" fill="#0d1e33"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#7dd3fc">Build: Debounced LED/PWM</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Clean sync RTL + TB</text>
  </g>
  <path d="M 238 242 L 254 242" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Phase 2 -->
  <g transform="translate(256, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#f59e0b"/>
    <text x="14" y="24" class="mono" fill="#fcd34d">PHASE 2 (WEEKS 4–7)</text>
    <text x="14" y="44" class="txt-hdr">Vivado Flow &amp; Primitives</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#f59e0b"/>
    <text x="20" y="76" class="mono" fill="#fcd34d">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• Vivado Ch 1–7, 9</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• UART_Protocol Ch 1–5</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• RTL_Design Ch 5–6</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• LUT6, FDRE, BRAM, DSP48</text>
    <text x="20" y="210" class="txt-sub">• MMCM / PLL Clock Wizard</text>
    <text x="20" y="226" class="txt-sub">• Synth → P&amp;R → Bitstream</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#f59e0b" fill="#1b150b"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#fcd34d">Build: UART Echo on Board</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">BRAM FIFO + PC terminal</text>
  </g>
  <path d="M 470 242 L 486 242" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>

  <!-- Phase 3 -->
  <g transform="translate(488, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#34d399"/>
    <text x="14" y="24" class="mono" fill="#34d399">PHASE 3 (WEEKS 8–12)</text>
    <text x="14" y="44" class="txt-hdr">XDC Timing, CDC &amp; ILA</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#34d399"/>
    <text x="20" y="76" class="mono" fill="#6ee7b7">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• Vivado Ch 8</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• CDC_RDC Ch 1–8, 12</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• RTL_Design Ch 7, 9</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• WNS / TNS / WHS closure</text>
    <text x="20" y="210" class="txt-sub">• ASYNC_REG + max_delay</text>
    <text x="20" y="226" class="txt-sub">• On-chip ILA &amp; VIO probing</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#34d399" fill="#0d221c"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#6ee7b7">Build: 2-Clock DSP/FIFO</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">WNS &gt;= 0 + ILA capture</text>
  </g>
  <path d="M 702 242 L 718 242" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

  <!-- Phase 4 -->
  <g transform="translate(720, 82)">
    <rect x="0" y="0" width="216" height="320" class="phase" stroke="#a855f7"/>
    <text x="14" y="24" class="mono" fill="#d8b4fe">PHASE 4 (WEEKS 13–18)</text>
    <text x="14" y="44" class="txt-hdr">AXI SoC &amp; Batch Tcl CI</text>

    <rect x="12" y="58" width="192" height="86" class="inner" stroke="#a855f7"/>
    <text x="20" y="76" class="mono" fill="#d8b4fe">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• AXI, APB &amp; OBI Protocols</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• C Ch 7 &amp; RISC_V Ch 1–5</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• Makefile &amp; git Ch 8–13</text>

    <rect x="12" y="156" width="192" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• AXI DMA &amp; IP Integrator</text>
    <text x="20" y="210" class="txt-sub">• Non-project Tcl scripting</text>
    <text x="20" y="226" class="txt-sub">• Bare-metal MMIO drivers</text>

    <rect x="12" y="256" width="192" height="50" class="inner" stroke="#a855f7" fill="#1b1029"/>
    <text x="108" y="276" text-anchor="middle" class="mono" fill="#d8b4fe">Capstone: RISC-V on FPGA</text>
    <text x="108" y="294" text-anchor="middle" class="txt-sub">C firmware + UART boot</text>
  </g>

  <!-- Bottom Banner -->
  <g transform="translate(24, 420)">
    <rect x="0" y="0" width="912" height="96" class="phase" stroke="#f59e0b" fill="#17140d"/>
    <text x="18" y="24" class="txt-hdr" fill="#fcd34d">FPGA Engineering Pro Habit: Non-Project Tcl Scripts Over GUI Clicks</text>
    <text x="18" y="48" class="txt-sub">Never commit giant binary Vivado .xpr / generated IP caches to Git. Version RTL, .xdc constraints, and clean build.tcl scripts</text>
    <text x="18" y="68" class="txt-sub">driven by Makefile &amp; GitHub Actions so bitstreams rebuild identically on any workstation or CI server.</text>
  </g>
</svg>
