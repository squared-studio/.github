<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .phase { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">RTL Design Engineer 4-Phase Learning Roadmap</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Structured progression from synthesizable digital logic to CDC, low-power UPF, and tape-out readiness</text>

  <!-- Phase 1 -->
  <g transform="translate(24, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#38bdf8"/>
    <text x="14" y="24" class="mono" fill="#38bdf8">PHASE 1 (WEEKS 1–4)</text>
    <text x="14" y="44" class="txt-hdr" fill="#f8fafc">Digital &amp; Synthesizable SV</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#38bdf8"/>
    <text x="20" y="76" class="mono" fill="#7dd3fc">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RTL_Design Ch 1–3</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• SystemVerilog Ch 1–9, 13</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• Electronics Ch 8</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• always_comb / always_ff</text>
    <text x="20" y="210" class="txt-sub">• Zero unintended latches</text>
    <text x="20" y="226" class="txt-sub">• Parameterized RTL modules</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#34d399" fill="#0d221c"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#6ee7b7">Build: ALU + RegFile</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Verilator lint-clean</text>
  </g>
  <path d="M 238 242 L 254 242" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Phase 2 -->
  <g transform="translate(256, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#34d399"/>
    <text x="14" y="24" class="mono" fill="#34d399">PHASE 2 (WEEKS 5–9)</text>
    <text x="14" y="44" class="txt-hdr" fill="#f8fafc">Microarchitecture &amp; Flow</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#34d399"/>
    <text x="20" y="76" class="mono" fill="#6ee7b7">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RTL_Design Ch 4–8</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• SystemVerilog Ch 14, 20</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• UART_Protocol Ch 1–8</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Moore vs Mealy FSMs</text>
    <text x="20" y="210" class="txt-sub">• Valid/Ready skid buffers</text>
    <text x="20" y="226" class="txt-sub">• Sync FIFOs &amp; pipelines</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#34d399" fill="#0d221c"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#6ee7b7">Build: Pipelined UART</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">Self-checking SV TB + SVA</text>
  </g>
  <path d="M 470 242 L 486 242" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

  <!-- Phase 3 -->
  <g transform="translate(488, 82)">
    <rect x="0" y="0" width="214" height="320" class="phase" stroke="#f59e0b"/>
    <text x="14" y="24" class="mono" fill="#fcd34d">PHASE 3 (WEEKS 10–15)</text>
    <text x="14" y="44" class="txt-hdr" fill="#f8fafc">Buses, Crossings &amp; RISC-V</text>

    <rect x="12" y="58" width="190" height="86" class="inner" stroke="#f59e0b"/>
    <text x="20" y="76" class="mono" fill="#fcd34d">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• APB, OBI &amp; AXI_Protocol</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• CDC_RDC Ch 1–9</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• RISC_V_Assembly Ch 1–5</text>

    <rect x="12" y="156" width="190" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• Gray-code Async FIFOs</text>
    <text x="20" y="210" class="txt-sub">• APB4 / AXI4-Lite CSRs</text>
    <text x="20" y="226" class="txt-sub">• 5-stage RISC-V hazards</text>

    <rect x="12" y="256" width="190" height="50" class="inner" stroke="#f59e0b" fill="#1b150b"/>
    <text x="107" y="276" text-anchor="middle" class="mono" fill="#fcd34d">Build: APB-UART / Core</text>
    <text x="107" y="294" text-anchor="middle" class="txt-sub">CDC-clean async wrapper</text>
  </g>
  <path d="M 702 242 L 718 242" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>

  <!-- Phase 4 -->
  <g transform="translate(720, 82)">
    <rect x="0" y="0" width="216" height="320" class="phase" stroke="#a855f7"/>
    <text x="14" y="24" class="mono" fill="#d8b4fe">PHASE 4 (WEEKS 16–22)</text>
    <text x="14" y="44" class="txt-hdr" fill="#f8fafc">Synthesis, UPF &amp; Sign-Off</text>

    <rect x="12" y="58" width="192" height="86" class="inner" stroke="#a855f7"/>
    <text x="20" y="76" class="mono" fill="#d8b4fe">SkillVerse Courses:</text>
    <text x="20" y="94" class="mono" fill="#cbd5e1">• RTL_Design Ch 9–10</text>
    <text x="20" y="110" class="mono" fill="#cbd5e1">• UPF_CPF Ch 1–8, 11</text>
    <text x="20" y="126" class="mono" fill="#cbd5e1">• CDC_RDC Ch 10–12 &amp; GLS</text>

    <rect x="12" y="156" width="192" height="90" class="inner" stroke="#334155"/>
    <text x="20" y="176" class="txt-sub" fill="#cbd5e1">Core Skills:</text>
    <text x="20" y="194" class="txt-sub">• SDC timing &amp; PPA trade-offs</text>
    <text x="20" y="210" class="txt-sub">• Power domains &amp; isolation</text>
    <text x="20" y="226" class="txt-sub">• DFT readiness &amp; GLS debug</text>

    <rect x="12" y="256" width="192" height="50" class="inner" stroke="#a855f7" fill="#1b1029"/>
    <text x="108" y="276" text-anchor="middle" class="mono" fill="#d8b4fe">Capstone: AXI DMA / SoC</text>
    <text x="108" y="294" text-anchor="middle" class="txt-sub">Lint + Sim + Synth + CI</text>
  </g>

  <!-- Bottom Career Readiness Summary -->
  <g transform="translate(24, 420)">
    <rect x="0" y="0" width="912" height="96" class="phase" stroke="#38bdf8" fill="#0d1726"/>
    <text x="18" y="24" class="txt-hdr" fill="#38bdf8">Target Outcomes for Entry &amp; Mid-Level RTL Design Roles</text>
    <text x="18" y="48" class="mono" fill="#cbd5e1">✓ Phase 1–2:</text>
    <text x="130" y="48" class="txt-sub">Ready for digital RTL internships and junior FPGA/ASIC block-coding interviews.</text>
    <text x="18" y="68" class="mono" fill="#cbd5e1">✓ Phase 3–4:</text>
    <text x="130" y="68" class="txt-sub">Fluent in multi-clock CDC/RDC sign-off, AXI4/APB4 protocol RTL, SDC timing intuition, and UPF low-power handoff.</text>
  </g>
</svg>
