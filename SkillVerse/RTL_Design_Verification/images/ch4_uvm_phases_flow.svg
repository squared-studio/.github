<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="phArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">UVM Phasing Architecture: Execution Order &amp; Directions</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Deterministic progression through Build, Run-time (Consumes Time), and Cleanup phases</text>

  <!-- 3 Major Phase Groups -->
  <!-- Group 1: Build & Elaboration -->
  <g transform="translate(50, 80)">
    <rect width="230" height="260" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="230" height="35" rx="8" fill="#0284c7"/>
    <text x="115" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Build Phases (0-Time)</text>

    <rect x="15" y="50" width="200" height="32" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="25" y="70" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">build_phase()</text>
    <text x="195" y="70" fill="#38bdf8" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&darr; Top-Down</text>

    <rect x="15" y="90" width="200" height="32" rx="4" fill="#0f172a" stroke="#60a5fa"/>
    <text x="25" y="110" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">connect_phase()</text>
    <text x="195" y="110" fill="#60a5fa" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <rect x="15" y="130" width="200" height="32" rx="4" fill="#0f172a" stroke="#818cf8"/>
    <text x="25" y="150" fill="#f8fafc" font-size="11" font-family="system-ui, sans-serif">end_of_elaboration()</text>
    <text x="195" y="150" fill="#818cf8" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <rect x="15" y="170" width="200" height="32" rx="4" fill="#0f172a" stroke="#a78bfa"/>
    <text x="25" y="190" fill="#f8fafc" font-size="11" font-family="system-ui, sans-serif">start_of_simulation()</text>
    <text x="195" y="190" fill="#a78bfa" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <text x="115" y="235" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Constructs components &amp; binds TLM ports</text>
  </g>

  <!-- Group 2: Run Phase (Time Consuming) -->
  <g transform="translate(315, 80)">
    <rect width="230" height="260" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="230" height="35" rx="8" fill="#059669"/>
    <text x="115" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Run Phase (Time &gt; 0)</text>

    <rect x="15" y="50" width="200" height="45" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="115" y="70" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">task run_phase()</text>
    <text x="115" y="86" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Executes concurrently across all nodes</text>

    <text x="115" y="115" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Pre/Run/Post Subphases:</text>
    <rect x="15" y="125" width="200" height="110" rx="4" fill="#0f172a" stroke="#34d399" stroke-dasharray="3 2"/>
    <text x="25" y="145" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">&bull; pre_reset / reset / post_reset</text>
    <text x="25" y="165" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">&bull; pre_configure / configure</text>
    <text x="25" y="185" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">&bull; pre_main / main / post_main</text>
    <text x="25" y="205" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">&bull; pre_shutdown / shutdown</text>
    <text x="25" y="225" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">Controlled by Objections!</text>
  </g>

  <!-- Group 3: Cleanup Phases -->
  <g transform="translate(580, 80)">
    <rect width="230" height="260" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="230" height="35" rx="8" fill="#d97706"/>
    <text x="115" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Cleanup Phases (0-Time)</text>

    <rect x="15" y="50" width="200" height="32" rx="4" fill="#0f172a" stroke="#fbbf24"/>
    <text x="25" y="70" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">extract_phase()</text>
    <text x="195" y="70" fill="#fbbf24" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <rect x="15" y="90" width="200" height="32" rx="4" fill="#0f172a" stroke="#f59e0b"/>
    <text x="25" y="110" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">check_phase()</text>
    <text x="195" y="110" fill="#f59e0b" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <rect x="15" y="130" width="200" height="32" rx="4" fill="#0f172a" stroke="#ea580c"/>
    <text x="25" y="150" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">report_phase()</text>
    <text x="195" y="150" fill="#ea580c" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Bottom-Up</text>

    <rect x="15" y="170" width="200" height="32" rx="4" fill="#0f172a" stroke="#dc2626"/>
    <text x="25" y="190" fill="#f8fafc" font-size="11" font-family="system-ui, sans-serif">final_phase()</text>
    <text x="195" y="190" fill="#dc2626" font-size="10" text-anchor="end" font-family="system-ui, sans-serif">&uarr; Top-Down</text>

    <text x="115" y="235" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Verifies queues empty &amp; prints PASS/FAIL</text>
  </g>

  <!-- Connectors between groups -->
  <line x1="280" y1="210" x2="310" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#phArr)"/>
  <line x1="545" y1="210" x2="575" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#phArr)"/>
</svg>
