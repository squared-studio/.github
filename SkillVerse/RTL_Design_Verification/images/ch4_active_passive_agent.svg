<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">UVM Agent Operating Modes: Active vs. Passive</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Controlled via `is_active = UVM_ACTIVE` or `UVM_PASSIVE` configuration</text>

  <!-- Left: Active Agent -->
  <g transform="translate(60, 80)">
    <rect width="330" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="330" height="35" rx="10" fill="#0284c7"/>
    <text x="165" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">ACTIVE Agent (Drives &amp; Monitors)</text>
    
    <rect x="25" y="55" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/>
    <text x="85" y="80" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Sequencer</text>
    <text x="85" y="96" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Generates Items</text>

    <rect x="185" y="55" width="120" height="55" rx="6" fill="#0f172a" stroke="#60a5fa"/>
    <text x="245" y="80" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Driver</text>
    <text x="245" y="96" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Drives Pins</text>

    <rect x="25" y="130" width="280" height="55" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="165" y="155" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Monitor (Passive Observer)</text>
    <text x="165" y="172" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Samples pins &amp; broadcasts transactions</text>

    <text x="165" y="215" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Used at Block Level (Simulates Master/Host)</text>
  </g>

  <!-- Right: Passive Agent -->
  <g transform="translate(450, 80)">
    <rect width="330" height="240" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <rect width="330" height="35" rx="10" fill="#475569"/>
    <text x="165" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">PASSIVE Agent (Monitor Only)</text>
    
    <!-- Grayed out Sequencer / Driver -->
    <rect x="25" y="55" width="120" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-dasharray="4 2"/>
    <text x="85" y="85" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">(No Sequencer)</text>

    <rect x="185" y="55" width="120" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-dasharray="4 2"/>
    <text x="245" y="85" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">(No Driver)</text>

    <rect x="25" y="130" width="280" height="55" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="165" y="155" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Monitor (Passive Observer)</text>
    <text x="165" y="172" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Samples pins &amp; broadcasts transactions</text>

    <text x="165" y="215" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Used at SoC Level (Real Core drives bus)</text>
  </g>
</svg>
