<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <linearGradient id="costGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="425" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hardware Bug Cost Escalation Across Design Lifecycle</text>
  <text x="425" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Exponential financial and schedule cost when bugs escape verification</text>

  <!-- Curve background -->
  <path d="M 100 270 Q 300 260 500 200 T 750 90 L 750 280 L 100 280 Z" fill="url(#costGrad)"/>
  <path d="M 100 270 Q 300 260 500 200 T 750 90" fill="none" stroke="#ef4444" stroke-width="4"/>

  <!-- Stages -->
  <!-- Stage 1 -->
  <g transform="translate(80, 190)">
    <rect width="130" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="24" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. RTL Design</text>
    <text x="65" y="44" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1x Cost</text>
    <text x="65" y="64" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Minutes to fix</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(250, 160)">
    <rect width="130" height="80" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="65" y="24" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Block / TB</text>
    <text x="65" y="44" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">10x Cost</text>
    <text x="65" y="64" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Hours to fix</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(420, 120)">
    <rect width="130" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="65" y="24" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. System / Tapeout</text>
    <text x="65" y="44" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">100x Cost</text>
    <text x="65" y="64" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Weeks delay</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(590, 70)">
    <rect width="160" height="90" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2.5"/>
    <text x="80" y="24" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. Post-Silicon / Field</text>
    <text x="80" y="48" fill="#f87171" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1,000x - 10,000x</text>
    <text x="80" y="68" fill="#fca5a5" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">$10M+ Respin / Recall</text>
  </g>

  <!-- Axes -->
  <line x1="80" y1="280" x2="770" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="770" y="300" fill="#94a3b8" font-size="12" text-anchor="end" font-family="system-ui, sans-serif">Development Timeline &rarr;</text>
  <line x1="80" y1="280" x2="80" y2="70" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="85" y="85" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif">Cost to Fix &uarr;</text>

  <!-- Footer note -->
  <text x="425" y="340" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Early verification and proactive planning eliminate severe post-silicon mask re-spins and field recalls</text>
</svg>
