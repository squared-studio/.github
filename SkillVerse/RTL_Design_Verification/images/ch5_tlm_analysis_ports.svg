<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="tlmArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">TLM Analysis Port Broadcast Architecture (1-to-Many)</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Non-blocking broadcast of observed transactions via `write()`</text>

  <!-- Publisher: Monitor -->
  <g transform="translate(60, 120)">
    <rect width="200" height="110" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_monitor</text>
    <rect x="20" y="50" width="160" height="40" rx="4" fill="#047857"/>
    <text x="100" y="74" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_analysis_port #(T) ap;</text>
  </g>

  <!-- Broadcast Fanout Arrows -->
  <path d="M 260 175 L 370 175 L 370 105 L 470 105" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#tlmArr)"/>
  <path d="M 260 175 L 470 175" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#tlmArr)"/>
  <path d="M 260 175 L 370 175 L 370 245 L 470 245" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#tlmArr)"/>

  <!-- Subscriber 1: Scoreboard -->
  <g transform="translate(480, 70)">
    <rect width="280" height="70" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="140" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Scoreboard (uvm_analysis_imp)</text>
    <text x="140" y="48" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">function void write(T t); check_result(t);</text>
  </g>

  <!-- Subscriber 2: Coverage Collector -->
  <g transform="translate(480, 145)">
    <rect width="280" height="60" rx="6" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="140" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Coverage Collector (uvm_subscriber)</text>
    <text x="140" y="44" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">function void write(T t); my_cg.sample();</text>
  </g>

  <!-- Subscriber 3: Transaction Logger / Tracer -->
  <g transform="translate(480, 215)">
    <rect width="280" height="60" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <text x="140" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Tracer / Logger</text>
    <text x="140" y="44" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">function void write(T t); print_to_file(t);</text>
  </g>
</svg>
