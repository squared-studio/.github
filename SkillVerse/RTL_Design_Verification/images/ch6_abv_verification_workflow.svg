<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="abvArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Assertion-Based Verification (ABV) Dual-Engine Flow</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">One SVA specification serving both Dynamic Simulation and Formal Property Verification</text>

  <!-- Central SVA Box -->
  <g transform="translate(290, 80)">
    <rect width="260" height="85" rx="8" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="130" y="28" fill="#ede9fe" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Golden SVA Properties</text>
    <text x="130" y="48" fill="#c4b5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Protocol rules, interface handshakes,</text>
    <text x="130" y="66" fill="#c4b5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">FIFO overflow checks, state invariants</text>
  </g>

  <!-- Left: Dynamic Simulation -->
  <g transform="translate(60, 205)">
    <rect width="320" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="320" height="30" rx="8" fill="#0284c7"/>
    <text x="160" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Dynamic Simulation Engine</text>
    <text x="15" y="48" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Passive monitors evaluate SVA on active stimuli</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Instant pinpointing of bug location (0-latency debug)</text>
    <text x="15" y="82" fill="#34d399" font-size="10" font-family="system-ui, sans-serif">&bull; Assertion coverage metric tracks exercised rules</text>
  </g>

  <!-- Right: Formal Property Verification -->
  <g transform="translate(460, 205)">
    <rect width="320" height="95" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="320" height="30" rx="8" fill="#059669"/>
    <text x="160" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Formal Model Checker Engine</text>
    <text x="15" y="48" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Mathematical engine proves properties for ALL cycles</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Generates counter-example waveform if bug exists</text>
    <text x="15" y="82" fill="#34d399" font-size="10" font-family="system-ui, sans-serif">&bull; Full proof without writing a single test case</text>
  </g>

  <!-- Connectors -->
  <path d="M 370 165 L 370 185 L 220 185 L 220 200" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#abvArr)"/>
  <path d="M 470 165 L 470 185 L 620 185 L 620 200" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#abvArr)"/>
</svg>
