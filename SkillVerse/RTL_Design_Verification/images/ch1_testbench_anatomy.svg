<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="arr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="430" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hardware Verification Testbench Architecture</text>
  <text x="430" y="50" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Closed-loop stimulus generation, monitoring, checking, and coverage collection</text>

  <!-- Big Testbench Box -->
  <rect x="40" y="70" width="780" height="280" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="95" fill="#94a3b8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">Testbench Environment (SystemVerilog / UVM)</text>

  <!-- Clock & Reset Generator -->
  <g transform="translate(60, 115)">
    <rect width="140" height="60" rx="6" fill="#334155" stroke="#94a3b8"/>
    <text x="70" y="26" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Clock &amp; Reset</text>
    <text x="70" y="44" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Generator</text>
  </g>

  <!-- Generator -->
  <g transform="translate(60, 195)">
    <rect width="140" height="70" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="26" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Stimulus Generator</text>
    <text x="70" y="44" fill="#bae6fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Constrained-Random</text>
    <text x="70" y="58" fill="#bae6fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Transaction Creator</text>
  </g>

  <!-- Driver -->
  <g transform="translate(240, 195)">
    <rect width="120" height="70" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="60" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Driver</text>
    <text x="60" y="50" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Pin-Level Strobe</text>
  </g>

  <!-- DUT (Hardware) -->
  <g transform="translate(400, 140)">
    <rect width="140" height="150" rx="8" fill="#831843" stroke="#f472b6" stroke-width="3"/>
    <text x="70" y="35" fill="#fdf2f8" font-size="15" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">DUT</text>
    <text x="70" y="55" fill="#fbcfe8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Design Under Test</text>
    <rect x="15" y="75" width="110" height="55" rx="4" fill="#9d174d"/>
    <text x="70" y="96" fill="#fdf2f8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">RTL Logic</text>
    <text x="70" y="112" fill="#fbcfe8" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Registers &amp; FSMs</text>
  </g>

  <!-- Monitor -->
  <g transform="translate(580, 195)">
    <rect width="120" height="70" rx="6" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="30" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Monitor</text>
    <text x="60" y="50" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Passive Observer</text>
  </g>

  <!-- Scoreboard / Checker -->
  <g transform="translate(710, 115)">
    <rect width="90" height="90" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="45" y="30" fill="#fef3c7" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Scoreboard</text>
    <text x="45" y="50" fill="#fde68a" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">&amp; Golden Model</text>
    <text x="45" y="68" fill="#fde68a" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Result Check</text>
  </g>

  <!-- Coverage Collector -->
  <g transform="translate(710, 240)">
    <rect width="90" height="80" rx="6" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="45" y="28" fill="#ede9fe" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Coverage</text>
    <text x="45" y="46" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Collector</text>
    <text x="45" y="62" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Covergroups</text>
  </g>

  <!-- Connections -->
  <!-- Clock to DUT -->
  <path d="M 200 145 L 400 160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr1)"/>
  <!-- Gen to Driver -->
  <line x1="200" y1="230" x2="235" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr1)"/>
  <!-- Driver to DUT -->
  <line x1="360" y1="230" x2="395" y2="230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr1)"/>
  <!-- DUT to Monitor -->
  <line x1="540" y1="230" x2="575" y2="230" stroke="#34d399" stroke-width="2" marker-end="url(#arr2)"/>
  <!-- Gen to Scoreboard (Reference transaction) -->
  <path d="M 130 195 L 130 100 L 755 100 L 755 110" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Monitor to Scoreboard -->
  <path d="M 640 195 L 640 160 L 705 160" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- Monitor to Coverage -->
  <path d="M 640 265 L 640 280 L 705 280" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
</svg>
