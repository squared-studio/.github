<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Virtual Interface: Bridging Dynamic Classes to Static Hardware</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Connecting OOP verification components (UVM Driver/Monitor) to RTL module ports</text>

  <!-- Left: Dynamic Class Domain -->
  <g transform="translate(60, 80)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="260" height="35" rx="10" fill="#0284c7"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Dynamic OOP Domain (Heap)</text>
    <rect x="20" y="50" width="220" height="60" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="130" y="75" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">class my_driver extends uvm_driver</text>
    <text x="130" y="95" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">virtual bus_if vif;</text>

    <rect x="20" y="125" width="220" height="60" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="130" y="150" fill="#818cf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">class my_monitor extends uvm_monitor</text>
    <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">virtual bus_if vif;</text>

    <text x="130" y="210" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Created dynamically via new() / Factory</text>
  </g>

  <!-- Middle: Virtual Interface Pointer Bridge -->
  <g transform="translate(350, 120)">
    <rect width="140" height="150" rx="8" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="70" y="30" fill="#ede9fe" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Virtual Interface</text>
    <text x="70" y="48" fill="#c4b5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Handle Pointer</text>
    <path d="M 20 70 L 120 70" stroke="#a78bfa" stroke-width="2"/>
    <text x="70" y="95" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">vif points to</text>
    <text x="70" y="110" fill="#f8fafc" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">physical interface</text>
    <text x="70" y="130" fill="#fbbf24" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Passed via config_db</text>
  </g>

  <!-- Right: Static Hardware Domain -->
  <g transform="translate(520, 80)">
    <rect width="260" height="230" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <rect width="260" height="35" rx="10" fill="#db2777"/>
    <text x="130" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Static Hardware Domain (Elaboration)</text>
    <rect x="20" y="50" width="220" height="60" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="130" y="75" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">interface bus_if(clk, rst_n);</text>
    <text x="130" y="95" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">clocking cb; modport ...</text>

    <rect x="20" y="125" width="220" height="60" rx="6" fill="#0f172a" stroke="#f472b6"/>
    <text x="130" y="150" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">module dut_top(...);</text>
    <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Synthesizable Hardware RTL</text>

    <text x="130" y="210" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Instantiated in Top-Level Testbench Module</text>
  </g>

  <!-- Connection arrows -->
  <line x1="320" y1="170" x2="350" y2="170" stroke="#a78bfa" stroke-width="2.5"/>
  <line x1="490" y1="170" x2="520" y2="170" stroke="#a78bfa" stroke-width="2.5"/>
</svg>
