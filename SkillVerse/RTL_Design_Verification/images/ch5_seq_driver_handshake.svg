<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="sqArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="retArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">UVM Sequence-Sequencer-Driver Handshake Protocol</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Two-way synchronization for transaction creation, driving, and completion</text>

  <!-- 3 Lifelines -->
  <!-- 1. Sequence -->
  <rect x="80" y="75" width="160" height="35" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
  <text x="160" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_sequence</text>
  <line x1="160" y1="110" x2="160" y2="340" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 2. Sequencer -->
  <rect x="340" y="75" width="160" height="35" rx="6" fill="#312e81" stroke="#a78bfa"/>
  <text x="420" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_sequencer</text>
  <line x1="420" y1="110" x2="420" y2="340" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 3. Driver -->
  <rect x="600" y="75" width="160" height="35" rx="6" fill="#065f46" stroke="#34d399"/>
  <text x="680" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_driver</text>
  <line x1="680" y1="110" x2="680" y2="340" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Step 1: start_item() -->
  <line x1="160" y1="140" x2="415" y2="140" stroke="#38bdf8" stroke-width="2" marker-end="url(#sqArr)"/>
  <text x="280" y="133" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. start_item(req)</text>

  <!-- Step 2: get_next_item() -->
  <line x1="680" y1="170" x2="425" y2="170" stroke="#34d399" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="550" y="163" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. seq_item_port.get_next_item(req)</text>

  <!-- Step 3: Grant & Randomize -->
  <line x1="420" y1="195" x2="165" y2="195" stroke="#a78bfa" stroke-width="2" marker-end="url(#sqArr)"/>
  <text x="280" y="188" fill="#a78bfa" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">3. Grant / wait_for_grant() unblocks</text>
  <rect x="100" y="210" width="120" height="25" rx="4" fill="#0369a1"/>
  <text x="160" y="227" fill="#ffffff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">req.randomize()</text>

  <!-- Step 4: finish_item() -->
  <line x1="160" y1="245" x2="415" y2="245" stroke="#38bdf8" stroke-width="2" marker-end="url(#sqArr)"/>
  <text x="280" y="240" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. finish_item(req)</text>

  <!-- Step 5: Deliver req to Driver -->
  <line x1="420" y1="265" x2="675" y2="265" stroke="#38bdf8" stroke-width="2" marker-end="url(#sqArr)"/>
  <text x="550" y="260" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">5. get_next_item() unblocks with req</text>

  <!-- Step 6: Drive Pin-Level -->
  <rect x="620" y="280" width="120" height="25" rx="4" fill="#064e3b"/>
  <text x="680" y="297" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">vif.drive_pins(req)</text>

  <!-- Step 7: item_done() -->
  <line x1="680" y1="320" x2="165" y2="320" stroke="#34d399" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="420" y="313" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">6. seq_item_port.item_done() &rarr; finish_item() unblocks</text>
</svg>
