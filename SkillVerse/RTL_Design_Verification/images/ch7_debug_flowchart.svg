<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="dbgArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hardware Simulation Failure Triage &amp; Debug Funnel</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Systematic diagnosis from regression log failure down to RTL root-cause fix</text>

  <!-- Step 1: Log Failure -->
  <g transform="translate(60, 80)">
    <rect width="150" height="60" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="75" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Log Failure</text>
    <text x="75" y="44" fill="#fbcfe8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">UVM_ERROR / SVA</text>
  </g>

  <!-- Step 2: Reproduce with Seed -->
  <g transform="translate(250, 80)">
    <rect width="150" height="60" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="75" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Reproduce</text>
    <text x="75" y="44" fill="#bfdbfe" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Run with exact +seed</text>
  </g>

  <!-- Step 3: Enable Waveform -->
  <g transform="translate(440, 80)">
    <rect width="150" height="60" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Waveform Dump</text>
    <text x="75" y="44" fill="#bae6fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">FSDB / VCD Dump</text>
  </g>

  <!-- Step 4: Isolate Defect Location -->
  <g transform="translate(630, 80)">
    <polygon points="75,5 140,30 75,55 10,30" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="75" y="28" fill="#ede9fe" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">RTL or TB?</text>
    <text x="75" y="42" fill="#c4b5fd" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Root Cause</text>
  </g>

  <!-- Bottom Branches -->
  <!-- RTL Bug Fix -->
  <g transform="translate(480, 190)">
    <rect width="280" height="80" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="140" y="24" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">DUT RTL Logic Bug</text>
    <text x="15" y="45" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Fix RTL design bug</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Add assertion to guard against recurrence</text>
  </g>

  <!-- TB Bug Fix -->
  <g transform="translate(140, 190)">
    <rect width="280" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="140" y="24" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Testbench / Environment Bug</text>
    <text x="15" y="45" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Incorrect scoreboard golden model</text>
    <text x="15" y="62" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Invalid constraint allowing illegal stimuli</text>
  </g>

  <!-- Final: Re-run regression -->
  <g transform="translate(320, 310)">
    <rect width="240" height="40" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="120" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Re-run Full Regression Suite (PASS)</text>
  </g>

  <!-- Connectors -->
  <line x1="210" y1="110" x2="245" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dbgArr)"/>
  <line x1="400" y1="110" x2="435" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dbgArr)"/>
  <line x1="590" y1="110" x2="625" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#dbgArr)"/>

  <path d="M 680 140 L 680 165 L 620 165 L 620 185" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#dbgArr)"/>
  <text x="690" y="160" fill="#f87171" font-size="10" font-family="system-ui, sans-serif">DUT</text>

  <path d="M 660 140 L 660 165 L 280 165 L 280 185" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#dbgArr)"/>
  <text x="460" y="160" fill="#fbbf24" font-size="10" font-family="system-ui, sans-serif">Testbench</text>

  <path d="M 280 270 L 280 290 L 400 290 L 400 305" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#dbgArr)"/>
  <path d="M 620 270 L 620 290 L 480 290 L 480 305" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#dbgArr)"/>
</svg>
