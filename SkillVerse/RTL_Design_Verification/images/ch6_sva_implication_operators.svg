<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">SVA Implication Operators: Overlapping (|->) vs. Non-Overlapping (|=>)</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Precise clock-edge alignment for Antecedent and Consequent evaluation</text>

  <!-- Left: Overlapping |-> -->
  <g transform="translate(60, 80)">
    <rect width="330" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="330" height="35" rx="8" fill="#0284c7"/>
    <text x="165" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Overlapping Implication: `a |-&gt; b`</text>

    <text x="20" y="60" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">If `a` matches at clock T, `b` must match at T:</text>

    <!-- Timing Diagram -->
    <text x="20" y="100" fill="#cbd5e1" font-size="11" font-family="monospace">CLK : __/--\__/--\__/--\__</text>
    <text x="20" y="125" fill="#38bdf8" font-size="11" font-family="monospace">a   : ____/----\__________ (Antecedent)</text>
    <text x="20" y="150" fill="#34d399" font-size="11" font-family="monospace">b   : ____/----\__________ (Consequent)</text>

    <rect x="20" y="175" width="290" height="50" rx="4" fill="#0f172a"/>
    <text x="165" y="195" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Evaluation starts in SAME cycle</text>
    <text x="165" y="212" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Common for bus enables &amp; valid-ready handshakes</text>
  </g>

  <!-- Right: Non-Overlapping |=> -->
  <g transform="translate(450, 80)">
    <rect width="330" height="240" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="330" height="35" rx="8" fill="#4f46e5"/>
    <text x="165" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Non-Overlapping Implication: `a |=&gt; b`</text>

    <text x="20" y="60" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Equivalent to `a |-&gt; ##1 b` (Next clock cycle):</text>

    <!-- Timing Diagram -->
    <text x="20" y="100" fill="#cbd5e1" font-size="11" font-family="monospace">CLK : __/--\__/--\__/--\__</text>
    <text x="20" y="125" fill="#818cf8" font-size="11" font-family="monospace">a   : ____/----\__________ (Antecedent at T)</text>
    <text x="20" y="150" fill="#34d399" font-size="11" font-family="monospace">b   : __________/----\____ (Consequent at T+1)</text>

    <rect x="20" y="175" width="290" height="50" rx="4" fill="#0f172a"/>
    <text x="165" y="195" fill="#818cf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Evaluation occurs in NEXT cycle</text>
    <text x="165" y="212" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Common for request-grant &amp; registered responses</text>
  </g>
</svg>
