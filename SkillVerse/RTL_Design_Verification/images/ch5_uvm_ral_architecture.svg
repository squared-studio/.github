<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="ralArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="ralPred" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">UVM Register Abstraction Layer (RAL) Architecture</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Front-door &amp; back-door access, register adapter, and auto-prediction mirroring</text>

  <!-- Left: Sequence -->
  <g transform="translate(50, 95)">
    <rect width="150" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="75" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Register Sequence</text>
    <text x="75" y="48" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">reg_model.ctrl.write(status, 32'h1)</text>
  </g>

  <!-- Center Top: Register Model -->
  <g transform="translate(260, 85)">
    <rect width="260" height="90" rx="8" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="130" y="24" fill="#ede9fe" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_reg_block (Register Model)</text>
    <rect x="15" y="38" width="230" height="42" rx="4" fill="#1e1b4b"/>
    <text x="130" y="56" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Mirrored Values &amp; Desired Values</text>
    <text x="130" y="72" fill="#fde68a" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Backdoor HDL Read/Write (Direct DPI/VPI)</text>
  </g>

  <!-- Center Bottom: Reg Adapter -->
  <g transform="translate(290, 215)">
    <rect width="200" height="60" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="100" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_reg_adapter</text>
    <text x="100" y="46" fill="#fde68a" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">reg2bus() &amp; bus2reg()</text>
  </g>

  <!-- Right Top: Predictor -->
  <g transform="translate(580, 85)">
    <rect width="220" height="65" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">uvm_reg_predictor</text>
    <text x="110" y="46" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Updates Reg Model mirror value</text>
  </g>

  <!-- Right Bottom: Bus Driver / Monitor & DUT -->
  <g transform="translate(580, 215)">
    <rect width="105" height="60" rx="6" fill="#0369a1" stroke="#38bdf8"/>
    <text x="52" y="26" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Bus Driver</text>
    <text x="52" y="44" fill="#bae6fd" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Pins (APB/AXI)</text>

    <rect x="695" y="215" width="105" height="60" rx="6" fill="#065f46" stroke="#34d399"/>
    <text x="747" y="26" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Bus Monitor</text>
    <text x="747" y="44" fill="#a7f3d0" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Samples bus</text>
  </g>

  <!-- DUT Physical Registers at bottom -->
  <g transform="translate(420, 315)">
    <rect width="380" height="45" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="190" y="28" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">DUT Hardware Physical Registers (Hardware State)</text>
  </g>

  <!-- Connectors -->
  <line x1="200" y1="130" x2="255" y2="130" stroke="#38bdf8" stroke-width="2" marker-end="url(#ralArr)"/>
  <line x1="390" y1="175" x2="390" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#ralArr)"/>
  <line x1="490" y1="245" x2="575" y2="245" stroke="#38bdf8" stroke-width="2" marker-end="url(#ralArr)"/>
  <line x1="630" y1="275" x2="630" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#ralArr)"/>
  <line x1="750" y1="315" x2="750" y2="280" stroke="#34d399" stroke-width="2" marker-end="url(#ralPred)"/>
  <line x1="750" y1="215" x2="750" y2="155" stroke="#34d399" stroke-width="2" marker-end="url(#ralPred)"/>
  <line x1="580" y1="115" x2="525" y2="115" stroke="#34d399" stroke-width="2" marker-end="url(#ralPred)"/>
</svg>
