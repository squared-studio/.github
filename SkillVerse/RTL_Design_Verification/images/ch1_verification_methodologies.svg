<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Modern Hardware Verification Methodologies Matrix</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Complementary verification technologies and their strategic deployment</text>

  <!-- 4 Columns -->
  <!-- Col 1: Static Verification -->
  <g transform="translate(40, 80)">
    <rect width="175" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="175" height="40" rx="8" fill="#0284c7"/>
    <text x="87" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Static Verification</text>
    <text x="15" y="65" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Techniques:</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; RTL Linting</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; CDC / RDC Analysis</text>
    <text x="15" y="125" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Static Timing (STA)</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Power Intent (UPF)</text>
    <line x1="15" y1="160" x2="160" y2="160" stroke="#334155"/>
    <text x="15" y="180" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ No testbench needed</text>
    <text x="15" y="198" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ Fast execution</text>
    <text x="15" y="220" fill="#f87171" font-size="11" font-family="system-ui, sans-serif">- No functional check</text>
  </g>

  <!-- Col 2: Dynamic Simulation -->
  <g transform="translate(240, 80)">
    <rect width="175" height="240" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="175" height="40" rx="8" fill="#4f46e5"/>
    <text x="87" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Dynamic Simulation</text>
    <text x="15" y="65" fill="#818cf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Techniques:</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; SystemVerilog / UVM</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Constrained-Random</text>
    <text x="15" y="125" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; SVA Assertions</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Coverage Metrics</text>
    <line x1="15" y1="160" x2="160" y2="160" stroke="#334155"/>
    <text x="15" y="180" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ Full debug visibility</text>
    <text x="15" y="198" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ Highly flexible</text>
    <text x="15" y="220" fill="#f87171" font-size="11" font-family="system-ui, sans-serif">- Not exhaustive</text>
  </g>

  <!-- Col 3: Formal Verification -->
  <g transform="translate(440, 80)">
    <rect width="175" height="240" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="175" height="40" rx="8" fill="#059669"/>
    <text x="87" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Formal Verification</text>
    <text x="15" y="65" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Techniques:</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Model Checking</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Equivalence Check</text>
    <text x="15" y="125" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; SVA Property Proofs</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Unreachable Code</text>
    <line x1="15" y1="160" x2="160" y2="160" stroke="#334155"/>
    <text x="15" y="180" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ 100% Math Proof</text>
    <text x="15" y="198" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ No test stimulus</text>
    <text x="15" y="220" fill="#f87171" font-size="11" font-family="system-ui, sans-serif">- State explosion</text>
  </g>

  <!-- Col 4: Hardware Emulation -->
  <g transform="translate(640, 80)">
    <rect width="175" height="240" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <rect width="175" height="40" rx="8" fill="#db2777"/>
    <text x="87" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Hardware Emulation</text>
    <text x="15" y="65" fill="#f472b6" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Techniques:</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; FPGA-Based ICE</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Virtual Host Co-Sim</text>
    <text x="15" y="125" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; OS / Driver Boot</text>
    <text x="15" y="145" fill="#cbd5e1" font-size="11" font-family="system-ui, sans-serif">&bull; Real-Time Traffic</text>
    <line x1="15" y1="160" x2="160" y2="160" stroke="#334155"/>
    <text x="15" y="180" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ 10,000x faster</text>
    <text x="15" y="198" fill="#34d399" font-size="11" font-family="system-ui, sans-serif">+ Full SoC validation</text>
    <text x="15" y="220" fill="#f87171" font-size="11" font-family="system-ui, sans-serif">- High equipment cost</text>
  </g>
</svg>
