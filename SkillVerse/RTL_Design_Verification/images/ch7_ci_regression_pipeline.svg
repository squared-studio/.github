<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="ciArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Automated Verification Continuous Integration (CI) Pipeline</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Nightly and push-based regression server cluster workflow</text>

  <!-- 5 Pipeline Steps -->
  <!-- Step 1: Git Push -->
  <g transform="translate(40, 95)">
    <rect width="130" height="160" rx="8" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text x="65" y="30" fill="#60a5fa" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Commit</text>
    <text x="65" y="55" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Developer pushes</text>
    <text x="65" y="70" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">RTL or TB change</text>
    <text x="65" y="100" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Triggers CI runner</text>
    <text x="65" y="130" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">GitLab / Jenkins</text>
  </g>

  <!-- Step 2: Static Checks -->
  <g transform="translate(200, 95)">
    <rect width="130" height="160" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="65" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Static</text>
    <text x="65" y="55" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Verilator / SpyGlass</text>
    <text x="65" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; RTL Linting</text>
    <text x="65" y="95" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; CDC Rules</text>
    <text x="65" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Elaboration</text>
  </g>

  <!-- Step 3: Server Farm Regression -->
  <g transform="translate(360, 95)">
    <rect width="150" height="160" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="75" y="30" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Farm Run</text>
    <text x="75" y="55" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">LSF / Slurm Cluster</text>
    <text x="75" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">10,000+ tests</text>
    <text x="75" y="95" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Random seeds</text>
    <text x="75" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Parallel runners</text>
  </g>

  <!-- Step 4: Coverage Merge -->
  <g transform="translate(540, 95)">
    <rect width="130" height="160" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="65" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. Merge DB</text>
    <text x="65" y="55" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Collect UCDBs</text>
    <text x="65" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Unified Coverage</text>
    <text x="65" y="95" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Code Coverage</text>
    <text x="65" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Functional DB</text>
  </g>

  <!-- Step 5: Dashboard & Alert -->
  <g transform="translate(700, 95)">
    <rect width="130" height="160" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="65" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">5. Dashboard</text>
    <text x="65" y="55" fill="#d1fae5" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Web Dashboard</text>
    <text x="65" y="75" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Pass / Fail %</text>
    <text x="65" y="95" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Trend curves</text>
    <text x="65" y="115" fill="#fde68a" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">&bull; Email alerts</text>
  </g>

  <!-- Connectors -->
  <line x1="170" y1="175" x2="195" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#ciArr)"/>
  <line x1="330" y1="175" x2="355" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#ciArr)"/>
  <line x1="510" y1="175" x2="535" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#ciArr)"/>
  <line x1="670" y1="175" x2="695" y2="175" stroke="#38bdf8" stroke-width="2" marker-end="url(#ciArr)"/>

  <text x="430" y="300" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Automated daily regressions detect broken functionality within hours of check-in</text>
</svg>
