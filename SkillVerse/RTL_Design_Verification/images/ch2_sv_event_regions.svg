<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">SystemVerilog Stratified Event Scheduling Regions</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Eliminating simulation race conditions between design RTL and verification testbench</text>

  <!-- Timeline Flow -->
  <!-- 1. Preponed -->
  <g transform="translate(40, 80)">
    <rect width="140" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="140" height="35" rx="8" fill="#0284c7"/>
    <text x="70" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Preponed</text>
    <text x="12" y="55" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Sampling Zone:</text>
    <text x="12" y="75" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Stable signal values</text>
    <text x="12" y="95" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Concurrent assertion</text>
    <text x="18" y="110" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">pre-state sampling</text>
    <text x="12" y="130" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Clocking block input</text>
    <text x="18" y="145" fill="#38bdf8" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">#1step sampling</text>
    <text x="12" y="180" fill="#34d399" font-size="10" font-family="system-ui, sans-serif">Guarantees zero race</text>
    <text x="12" y="195" fill="#34d399" font-size="10" font-family="system-ui, sans-serif">with clock edge</text>
  </g>

  <!-- 2. Active Region Set (Design) -->
  <g transform="translate(195, 80)">
    <rect width="170" height="230" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <rect width="170" height="35" rx="8" fill="#db2777"/>
    <text x="85" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Active Region Set</text>
    <text x="12" y="55" fill="#f472b6" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Design RTL Execution:</text>
    <text x="12" y="75" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Active: Blocking (=)</text>
    <text x="18" y="90" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Continuous assign</text>
    <text x="12" y="110" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Inactive: #0 delays</text>
    <text x="12" y="130" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; NBA: Non-blocking</text>
    <text x="18" y="145" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">register update (&lt;=)</text>
    <text x="12" y="175" fill="#fbcfe8" font-size="10" font-family="system-ui, sans-serif">Iterates until RTL</text>
    <text x="12" y="190" fill="#fbcfe8" font-size="10" font-family="system-ui, sans-serif">events settle</text>
  </g>

  <!-- 3. Observed -->
  <g transform="translate(380, 80)">
    <rect width="140" height="230" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="140" height="35" rx="8" fill="#d97706"/>
    <text x="70" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Observed</text>
    <text x="12" y="55" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Assertion Check:</text>
    <text x="12" y="80" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Evaluates concurrent</text>
    <text x="18" y="95" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">assertions (SVA)</text>
    <text x="12" y="120" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Uses values from</text>
    <text x="18" y="135" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Preponed region</text>
    <text x="12" y="165" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">Prevents false</text>
    <text x="12" y="180" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">assertion glitches</text>
  </g>

  <!-- 4. Reactive Region Set (TB) -->
  <g transform="translate(535, 80)">
    <rect width="165" height="230" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="165" height="35" rx="8" fill="#4f46e5"/>
    <text x="82" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Reactive Region Set</text>
    <text x="12" y="55" fill="#818cf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Testbench Code:</text>
    <text x="12" y="75" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Reactive: Program blocks</text>
    <text x="18" y="90" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Verification test code</text>
    <text x="12" y="110" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Re-Inactive: #0 in TB</text>
    <text x="12" y="130" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; Re-NBA: Clocking</text>
    <text x="18" y="145" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">block drive updates</text>
    <text x="12" y="175" fill="#c7d2fe" font-size="10" font-family="system-ui, sans-serif">Executes after RTL has</text>
    <text x="12" y="190" fill="#c7d2fe" font-size="10" font-family="system-ui, sans-serif">completely settled!</text>
  </g>

  <!-- 5. Postponed -->
  <g transform="translate(715, 80)">
    <rect width="115" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="115" height="35" rx="8" fill="#059669"/>
    <text x="57" y="22" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Postponed</text>
    <text x="10" y="55" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Final Sampling:</text>
    <text x="10" y="80" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; $strobe outputs</text>
    <text x="10" y="105" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; $monitor logs</text>
    <text x="10" y="130" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">&bull; VCD / FSDB</text>
    <text x="14" y="145" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">waveform dumps</text>
    <text x="10" y="175" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">End of current</text>
    <text x="10" y="190" fill="#a7f3d0" font-size="10" font-family="system-ui, sans-serif">simulation time-step</text>
  </g>

  <!-- Horizontal execution arrow -->
  <path d="M 40 335 L 820 335" stroke="#64748b" stroke-width="2"/>
  <text x="430" y="355" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Single Simulation Time-Step Execution Sequence &rarr;</text>
</svg>
