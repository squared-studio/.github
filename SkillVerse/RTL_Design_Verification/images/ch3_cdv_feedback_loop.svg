<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="loopArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Coverage-Driven Verification (CDV) Closed-Loop Flow</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Iterative feedback loop connecting test execution, coverage measurement, and closure</text>

  <!-- Step 1: Verification Plan -->
  <g transform="translate(60, 90)">
    <rect width="160" height="75" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Verification Plan</text>
    <text x="80" y="48" fill="#bfdbfe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Define goals, features</text>
    <text x="80" y="64" fill="#bfdbfe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">&amp; coverage targets</text>
  </g>

  <!-- Step 2: Develop Testbench & Constraints -->
  <g transform="translate(350, 90)">
    <rect width="160" height="75" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. CRV Testbench</text>
    <text x="80" y="48" fill="#bae6fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Implement randomizer</text>
    <text x="80" y="64" fill="#bae6fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">&amp; covergroups</text>
  </g>

  <!-- Step 3: Run Regressions -->
  <g transform="translate(640, 90)">
    <rect width="160" height="75" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">3. Run Regressions</text>
    <text x="80" y="48" fill="#a7f3d0" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Simulate with diverse</text>
    <text x="80" y="64" fill="#a7f3d0" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">random seeds</text>
  </g>

  <!-- Step 4: Coverage Analysis -->
  <g transform="translate(640, 220)">
    <rect width="160" height="75" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4. Coverage Analysis</text>
    <text x="80" y="48" fill="#fde68a" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Merge coverage DB</text>
    <text x="80" y="64" fill="#fde68a" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">&amp; identify holes</text>
  </g>

  <!-- Step 5: Check Goal Reached -->
  <g transform="translate(350, 220)">
    <polygon points="80,10 150,47 80,84 10,47" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="80" y="45" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">100% Goal?</text>
    <text x="80" y="60" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Achieved?</text>
  </g>

  <!-- Step 6: Sign-off -->
  <g transform="translate(60, 225)">
    <rect width="160" height="65" rx="8" fill="#047857" stroke="#34d399" stroke-width="2.5"/>
    <text x="80" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Verification Sign-off</text>
    <text x="80" y="48" fill="#d1fae5" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Ready for Tapeout / Release</text>
  </g>

  <!-- Forward Arrows -->
  <line x1="220" y1="127" x2="340" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#loopArr)"/>
  <line x1="510" y1="127" x2="630" y2="127" stroke="#38bdf8" stroke-width="2" marker-end="url(#loopArr)"/>
  <line x1="720" y1="165" x2="720" y2="210" stroke="#38bdf8" stroke-width="2" marker-end="url(#loopArr)"/>
  <line x1="640" y1="257" x2="510" y2="257" stroke="#38bdf8" stroke-width="2" marker-end="url(#loopArr)"/>
  <line x1="350" y1="257" x2="230" y2="257" stroke="#34d399" stroke-width="2.5" marker-end="url(#loopArr)"/>
  <text x="290" y="247" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">YES</text>

  <!-- Loopback Arrow for NO (Refine constraints) -->
  <path d="M 430 220 L 430 175" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#loopArr)"/>
  <text x="440" y="200" fill="#ef4444" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">NO (Tune Constraints / Add Seeds)</text>
</svg>
