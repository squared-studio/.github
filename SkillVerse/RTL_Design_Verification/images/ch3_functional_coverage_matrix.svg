<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">SystemVerilog Functional Coverage Model Architecture</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Covergroups, Coverpoints, Bins, and Cross Coverage Combinations</text>

  <!-- Outer Covergroup Box -->
  <rect x="50" y="70" width="740" height="260" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="70" y="96" fill="#38bdf8" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">covergroup bus_cov @(posedge clk);</text>

  <!-- Coverpoint 1 -->
  <g transform="translate(80, 115)">
    <rect width="190" height="185" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="95" y="24" fill="#818cf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">coverpoint op_type</text>
    <rect x="15" y="40" width="160" height="28" rx="4" fill="#312e81"/>
    <text x="25" y="58" fill="#e0e7ff" font-size="10" font-family="system-ui, sans-serif">bins read = {READ};</text>
    <rect x="15" y="75" width="160" height="28" rx="4" fill="#312e81"/>
    <text x="25" y="93" fill="#e0e7ff" font-size="10" font-family="system-ui, sans-serif">bins write = {WRITE};</text>
    <rect x="15" y="110" width="160" height="28" rx="4" fill="#312e81"/>
    <text x="25" y="128" fill="#e0e7ff" font-size="10" font-family="system-ui, sans-serif">bins burst = {BURST};</text>
    <rect x="15" y="145" width="160" height="28" rx="4" fill="#831843"/>
    <text x="25" y="163" fill="#fbcfe8" font-size="10" font-family="system-ui, sans-serif">illegal_bins err = default;</text>
  </g>

  <!-- Coverpoint 2 -->
  <g transform="translate(300, 115)">
    <rect width="190" height="185" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="95" y="24" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">coverpoint burst_size</text>
    <rect x="15" y="40" width="160" height="28" rx="4" fill="#064e3b"/>
    <text x="25" y="58" fill="#d1fae5" font-size="10" font-family="system-ui, sans-serif">bins single = {1};</text>
    <rect x="15" y="75" width="160" height="28" rx="4" fill="#064e3b"/>
    <text x="25" y="93" fill="#d1fae5" font-size="10" font-family="system-ui, sans-serif">bins medium = {[2:15]};</text>
    <rect x="15" y="110" width="160" height="28" rx="4" fill="#064e3b"/>
    <text x="25" y="128" fill="#d1fae5" font-size="10" font-family="system-ui, sans-serif">bins max_len = {16};</text>
    <rect x="15" y="145" width="160" height="28" rx="4" fill="#334155"/>
    <text x="25" y="163" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">ignore_bins zero = {0};</text>
  </g>

  <!-- Cross Coverage -->
  <g transform="translate(520, 115)">
    <rect width="240" height="185" rx="6" fill="#0f172a" stroke="#fbbf24"/>
    <text x="120" y="24" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">cross op_type, burst_size</text>
    <text x="15" y="50" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">Cartesian product of all bins:</text>
    <rect x="15" y="65" width="210" height="95" rx="4" fill="#451a03"/>
    <text x="25" y="85" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">&bull; &lt;READ, single&gt;</text>
    <text x="25" y="102" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">&bull; &lt;READ, medium&gt;, &lt;READ, max&gt;</text>
    <text x="25" y="119" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">&bull; &lt;WRITE, single&gt; ...</text>
    <text x="25" y="136" fill="#fde68a" font-size="10" font-family="system-ui, sans-serif">&bull; &lt;BURST, max_len&gt; (Corner Case!)</text>
    <text x="120" y="175" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Total 9 Cross Bins to Cover</text>
  </g>
</svg>
