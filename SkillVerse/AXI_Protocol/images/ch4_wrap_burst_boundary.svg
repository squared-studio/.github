<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="wrpArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Critical-Word-First Cache Line Refill: WRAP Burst Anatomy</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Example: 4-Beat 32-bit WRAP burst (16 bytes total) starting at critical address 0x1008</text>

  <!-- 4 Cache Beats in Box -->
  <g transform="translate(100, 110)">
    <!-- Word 0 -->
    <rect x="0" y="0" width="150" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="75" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Word 0</text>
    <text x="75" y="52" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">Addr: 0x1000</text>
    <text x="75" y="74" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Beat 2 (Wrapped)</text>

    <!-- Word 1 -->
    <rect x="165" y="0" width="150" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="240" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Word 1</text>
    <text x="240" y="52" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">Addr: 0x1004</text>
    <text x="240" y="74" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Beat 3 (Final)</text>

    <!-- Word 2 (Critical Start) -->
    <rect x="330" y="0" width="150" height="90" rx="6" fill="#78350f" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="405" y="30" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Word 2 (Critical)</text>
    <text x="405" y="52" fill="#fde68a" font-size="11" font-family="monospace" text-anchor="middle">Addr: 0x1008</text>
    <text x="405" y="74" fill="#fde68a" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Beat 0 (Start!)</text>

    <!-- Word 3 -->
    <rect x="495" y="0" width="150" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="570" y="30" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Word 3</text>
    <text x="570" y="52" fill="#cbd5e1" font-size="11" font-family="monospace" text-anchor="middle">Addr: 0x100C</text>
    <text x="570" y="74" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Beat 1</text>
  </g>

  <!-- Wrapping Arrow from Word 3 to Word 0 -->
  <path d="M 670 210 Q 420 290 175 210" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#wrpArr)"/>
  <text x="420" y="275" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Wraps to Lower Boundary (0x1000) when reaching Upper Boundary (0x1010)</text>

  <!-- Math box -->
  <text x="420" y="320" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Lower_Wrap_Boundary = INT(Start_Address / (Number_Bytes * Burst_Length)) * (Number_Bytes * Burst_Length)</text>
</svg>
