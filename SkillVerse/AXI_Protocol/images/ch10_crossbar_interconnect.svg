<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Multi-Master Crossbar Interconnect Switch Matrix</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">N x M Crossbar allowing Master 1 to talk to Slave 2 while Master 2 talks to Slave 1</text>

  <!-- Switch Grid Background -->
  <rect x="260" y="80" width="340" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="430" y="105" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Crossbar Switch Core (2x2 Example)</text>

  <!-- Crosspoint Switches -->
  <circle cx="370" cy="160" r="15" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="370" y="164" fill="#ffffff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SW11</text>

  <circle cx="490" cy="160" r="15" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="490" y="164" fill="#ffffff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SW12</text>

  <circle cx="370" cy="240" r="15" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="370" y="244" fill="#ffffff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SW21</text>

  <circle cx="490" cy="240" r="15" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <text x="490" y="244" fill="#ffffff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SW22</text>

  <!-- Left: Masters -->
  <g transform="translate(60, 135)">
    <rect width="140" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="70" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Master 1 (CPU)</text>
  </g>
  <line x1="200" y1="160" x2="355" y2="160" stroke="#60a5fa" stroke-width="2"/>

  <g transform="translate(60, 215)">
    <rect width="140" height="50" rx="6" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="70" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Master 2 (DMA)</text>
  </g>
  <line x1="200" y1="240" x2="355" y2="240" stroke="#60a5fa" stroke-width="2"/>

  <!-- Right: Slaves -->
  <g transform="translate(660, 135)">
    <rect width="140" height="50" rx="6" fill="#065f46" stroke="#34d399"/>
    <text x="70" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Slave 1 (RAM)</text>
  </g>
  <line x1="505" y1="160" x2="660" y2="160" stroke="#34d399" stroke-width="2"/>

  <g transform="translate(660, 215)">
    <rect width="140" height="50" rx="6" fill="#065f46" stroke="#34d399"/>
    <text x="70" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Slave 2 (Periph)</text>
  </g>
  <line x1="505" y1="240" x2="660" y2="240" stroke="#34d399" stroke-width="2"/>

  <!-- Internal Cross Connections -->
  <line x1="385" y1="160" x2="475" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="385" y1="240" x2="475" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="370" y1="175" x2="370" y2="225" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="490" y1="175" x2="490" y2="225" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Active paths: M1 -> S2 and M2 -> S1 -->
  <path d="M 200 160 L 370 160 L 490 240 L 660 240" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
  <text x="430" y="300" fill="#fde68a" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Simultaneous Non-Blocking Connection: Master 1 &rarr; Slave 2 AND Master 2 &rarr; Slave 1</text>
</svg>
