<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Complete AXI4 Read Transaction Timing Waveform</text>
  <text x="430" y="48" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">4-Beat read burst across Read Address (AR) and Read Data (R) channels</text>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-dasharray="3 3">
    <line x1="160" y1="65" x2="160" y2="310"/>
    <line x1="260" y1="65" x2="260" y2="310"/>
    <line x1="360" y1="65" x2="360" y2="310"/>
    <line x1="460" y1="65" x2="460" y2="310"/>
    <line x1="560" y1="65" x2="560" y2="310"/>
    <line x1="660" y1="65" x2="660" y2="310"/>
    <line x1="760" y1="65" x2="760" y2="310"/>
  </g>

  <!-- Edge Markers -->
  <text x="160" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T1</text>
  <text x="260" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T2</text>
  <text x="360" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T3</text>
  <text x="460" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T4</text>
  <text x="560" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T5</text>
  <text x="660" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T6</text>
  <text x="760" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T7</text>

  <!-- Labels -->
  <text x="40" y="85" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">ACLK</text>
  <text x="40" y="120" fill="#fbbf24" font-size="11" font-family="monospace">ARADDR</text>
  <text x="40" y="155" fill="#fbbf24" font-size="11" font-family="monospace">ARVALID</text>
  <text x="40" y="190" fill="#fbbf24" font-size="11" font-family="monospace">ARREADY</text>
  <text x="40" y="225" fill="#f472b6" font-size="11" font-family="monospace">RDATA</text>
  <text x="40" y="255" fill="#f472b6" font-size="11" font-family="monospace">RLAST</text>
  <text x="40" y="285" fill="#f472b6" font-size="11" font-family="monospace">RVALID</text>
  <text x="40" y="315" fill="#f472b6" font-size="11" font-family="monospace">RREADY</text>

  <!-- Waveforms -->
  <!-- ACLK -->
  <path d="M 110 85 L 160 85 L 160 70 L 210 70 L 210 85 L 260 85 L 260 70 L 310 70 L 310 85 L 360 85 L 360 70 L 410 70 L 410 85 L 460 85 L 460 70 L 510 70 L 510 85 L 560 85 L 560 70 L 610 70 L 610 85 L 660 85 L 660 70 L 710 70 L 710 85 L 760 85 L 760 70 L 810 70" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ARADDR -->
  <path d="M 110 120 L 160 120 L 170 110 L 250 110 L 260 120 L 810 120" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="210" y="118" fill="#fbbf24" font-size="10" text-anchor="middle" font-family="monospace">0x8000</text>

  <!-- ARVALID -->
  <path d="M 110 155 L 160 155 L 160 142 L 260 142 L 260 155 L 810 155" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- ARREADY -->
  <path d="M 110 190 L 160 190 L 160 177 L 260 177 L 260 190 L 810 190" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- RDATA (beats from T3 to T7) -->
  <path d="M 110 225 L 360 225 L 370 215 L 450 215 L 460 225 L 470 215 L 550 215 L 560 225 L 570 215 L 650 215 L 660 225 L 670 215 L 750 215 L 760 225 L 810 225" fill="none" stroke="#f472b6" stroke-width="2"/>
  <text x="410" y="223" fill="#f472b6" font-size="9" text-anchor="middle" font-family="monospace">RD0</text>
  <text x="510" y="223" fill="#f472b6" font-size="9" text-anchor="middle" font-family="monospace">RD1</text>
  <text x="610" y="223" fill="#f472b6" font-size="9" text-anchor="middle" font-family="monospace">RD2</text>
  <text x="710" y="223" fill="#f472b6" font-size="9" text-anchor="middle" font-family="monospace">RD3</text>

  <!-- RLAST (on final beat T6-T7) -->
  <path d="M 110 258 L 660 258 L 660 245 L 760 245 L 760 258 L 810 258" fill="none" stroke="#f472b6" stroke-width="2"/>

  <!-- RVALID -->
  <path d="M 110 288 L 360 288 L 360 275 L 760 275 L 760 288 L 810 288" fill="none" stroke="#f472b6" stroke-width="2"/>

  <!-- RREADY -->
  <path d="M 110 318 L 360 318 L 360 305 L 760 305 L 760 318 L 810 318" fill="none" stroke="#f472b6" stroke-width="2"/>
</svg>
