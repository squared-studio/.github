<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Memory Types and Cache Attributes: The AxCACHE[3:0] Encoding</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">4-Bit attribute vector governing intermediate caching, buffering, and allocation policies</text>

  <!-- 4 Bits Description -->
  <g transform="translate(60, 80)">
    <rect width="165" height="100" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="82" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxCACHE[0]: B</text>
    <text x="82" y="50" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Bufferable</text>
    <text x="82" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Bridge can acknowledge</text>
    <text x="82" y="90" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">before reaching final slave</text>
  </g>

  <g transform="translate(245, 80)">
    <rect width="165" height="100" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="82" y="30" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxCACHE[1]: M</text>
    <text x="82" y="50" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Modifiable</text>
    <text x="82" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Burst can be merged,</text>
    <text x="82" y="90" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">split, or resized</text>
  </g>

  <g transform="translate(430, 80)">
    <rect width="165" height="100" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="82" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxCACHE[2]: RA</text>
    <text x="82" y="50" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Read-Allocate</text>
    <text x="82" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Recommended to allocate</text>
    <text x="82" y="90" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">cache line on read miss</text>
  </g>

  <g transform="translate(615, 80)">
    <rect width="165" height="100" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="82" y="30" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxCACHE[3]: WA</text>
    <text x="82" y="50" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Write-Allocate</text>
    <text x="82" y="75" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Recommended to allocate</text>
    <text x="82" y="90" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">cache line on write miss</text>
  </g>

  <!-- Summary Table at Bottom -->
  <g transform="translate(60, 205)">
    <rect width="720" height="120" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="20" y="28" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Common AxCACHE Configurations:</text>
    <text x="20" y="52" fill="#cbd5e1" font-size="11" font-family="monospace">4'b0000 : Device Non-bufferable (Strict register order, no caching, no buffering)</text>
    <text x="20" y="72" fill="#cbd5e1" font-size="11" font-family="monospace">4'b0001 : Device Bufferable (Write acked at bridge; final delivery guaranteed)</text>
    <text x="20" y="92" fill="#cbd5e1" font-size="11" font-family="monospace">4'b0011 : Normal Non-cacheable Bufferable (Modifiable &amp; bufferable main memory)</text>
    <text x="20" y="112" fill="#34d399" font-size="11" font-family="monospace">4'b1111 : Write-back Read/Write Allocate (Full L1/L2/L3 cache acceleration)</text>
  </g>
</svg>
