<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 5 9 L 9 1 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="430" y="28" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Terminology &amp; Data Hierarchy</text>
  <text x="430" y="47" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">From physical bits and byte lanes to channel handshakes, beats, bursts, and complete transactions</text>

  <!-- Tier 1: Bit, Byte & Byte Lane -->
  <g>
    <rect x="40" y="64" width="780" height="84" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="55" y="83" fill="#38bdf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">TIER 1 — PHYSICAL BUS GRANULARITY: BIT, BYTE &amp; BYTE LANE</text>

    <rect x="55" y="93" width="215" height="45" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="66" y="110" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Bit (1 Physical Wire)</text>
    <text x="66" y="128" fill="#cbd5e1" font-size="10" font-family="monospace">0 or 1 (AWVALID, WDATA[0])</text>

    <rect x="282" y="93" width="523" height="45" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="294" y="110" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Byte (8 Bits) &amp; Byte Lane — DATA_WIDTH/8 Lanes (e.g., 64-bit = 8 Lanes)</text>
    <text x="294" y="128" fill="#cbd5e1" font-size="10" font-family="monospace">Lane n = DATA[8n+7:8n], WSTRB[n] masks byte | Word=4B, Double-word=8B</text>
  </g>

  <line x1="430" y1="148" x2="430" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- Tier 2: Handshake, Transfer & Beat -->
  <g>
    <rect x="40" y="162" width="780" height="84" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="55" y="181" fill="#34d399" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">TIER 2 — SINGLE CLOCK-EDGE EXCHANGE: HANDSHAKE, TRANSFER &amp; BEAT</text>

    <rect x="55" y="191" width="240" height="45" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="66" y="208" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Handshake (posedge ACLK)</text>
    <text x="66" y="226" fill="#cbd5e1" font-size="10" font-family="monospace">VALID=1 &amp; READY=1 (READY=0: Wait)</text>

    <rect x="307" y="191" width="242" height="45" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="318" y="208" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Transfer (Any of 5 Channels)</text>
    <text x="318" y="226" fill="#cbd5e1" font-size="10" font-family="monospace">1 handshake on AW, W, B, AR, or R</text>

    <rect x="561" y="191" width="244" height="45" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="572" y="208" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Beat (Data Transfer on W / R)</text>
    <text x="572" y="226" fill="#cbd5e1" font-size="10" font-family="monospace">1 W/R handshake: 2^AxSIZE bytes</text>
  </g>

  <line x1="430" y1="246" x2="430" y2="258" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- Tier 3: Burst -->
  <g>
    <rect x="40" y="260" width="780" height="84" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="55" y="279" fill="#fbbf24" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">TIER 3 — PAYLOAD SEQUENCE: BURST (1 TO 256 BEATS)</text>

    <rect x="55" y="289" width="285" height="45" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="66" y="306" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Burst Length = AxLEN + 1 Beats</text>
    <text x="66" y="324" fill="#fde68a" font-size="10" font-family="monospace">Aligned Bytes = (AxLEN+1) * 2^AxSIZE</text>

    <rect x="352" y="289" width="453" height="45" rx="6" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <rect x="364" y="297" width="84" height="29" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="406" y="315" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Beat 0</text>

    <text x="458" y="315" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="monospace">→</text>

    <rect x="468" y="297" width="84" height="29" rx="4" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="510" y="315" fill="#f8fafc" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Beat 1</text>

    <text x="577" y="315" fill="#fbbf24" font-size="11" text-anchor="middle" font-family="monospace">→ … →</text>

    <rect x="602" y="297" width="191" height="29" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="697" y="315" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle" font-family="monospace">Beat N (WLAST/RLAST=1)</text>
  </g>

  <line x1="430" y1="344" x2="430" y2="356" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-down)"/>

  <!-- Tier 4: Transaction -->
  <g>
    <rect x="40" y="358" width="780" height="88" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="55" y="377" fill="#818cf8" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">TIER 4 — COMPLETE END-TO-END BUS OPERATION: TRANSACTION</text>

    <rect x="55" y="387" width="368" height="48" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="67" y="405" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Write Transaction (AWLEN + 3 Transfers)</text>
    <text x="67" y="424" fill="#c7d2fe" font-size="10" font-family="monospace">[1 AW Addr] + [1 W Burst (N+1 Beats)] + [1 B Resp]</text>

    <rect x="437" y="387" width="368" height="48" rx="6" fill="#0f172a" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="449" y="405" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">Read Transaction (ARLEN + 2 Transfers)</text>
    <text x="449" y="424" fill="#c7d2fe" font-size="10" font-family="monospace">[1 AR Addr] + [1 R Burst (N+1 Beats w/ RRESP)]</text>
  </g>
</svg>
