<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Width Adaptation: Upsizing and Downsizing</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Converting data widths between wide memory controllers and narrow processor cores</text>

  <!-- Left: Downsizing -->
  <g transform="translate(60, 85)">
    <rect width="330" height="210" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="165" y="28" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Downsizing (128-bit &rarr; 32-bit)</text>
    
    <rect x="20" y="50" width="290" height="35" rx="4" fill="#0369a1"/>
    <text x="165" y="72" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Single 128-Bit Wide Beat</text>

    <text x="165" y="110" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">&darr; Bridge splits into 4 narrower beats &darr;</text>

    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="65" height="30" rx="3" fill="#1e3a8a"/>
      <text x="32" y="19" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="monospace">Beat 0</text>
      <rect x="75" y="0" width="65" height="30" rx="3" fill="#1e3a8a"/>
      <text x="107" y="19" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="monospace">Beat 1</text>
      <rect x="150" y="0" width="65" height="30" rx="3" fill="#1e3a8a"/>
      <text x="182" y="19" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="monospace">Beat 2</text>
      <rect x="225" y="0" width="65" height="30" rx="3" fill="#1e3a8a"/>
      <text x="257" y="19" fill="#93c5fd" font-size="10" text-anchor="middle" font-family="monospace">Beat 3</text>
    </g>

    <text x="165" y="185" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Burst length multiplied by 4 (`AxLEN` expanded)</text>
  </g>

  <!-- Right: Upsizing -->
  <g transform="translate(450, 85)">
    <rect width="330" height="210" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="165" y="28" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Upsizing (32-bit &rarr; 128-bit)</text>
    
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="65" height="30" rx="3" fill="#065f46"/>
      <text x="32" y="19" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="monospace">Beat 0</text>
      <rect x="75" y="0" width="65" height="30" rx="3" fill="#065f46"/>
      <text x="107" y="19" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="monospace">Beat 1</text>
      <rect x="150" y="0" width="65" height="30" rx="3" fill="#065f46"/>
      <text x="182" y="19" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="monospace">Beat 2</text>
      <rect x="225" y="0" width="65" height="30" rx="3" fill="#065f46"/>
      <text x="257" y="19" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="monospace">Beat 3</text>
    </g>

    <text x="165" y="110" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">&darr; Bridge packs 4 beats into 1 wide word &darr;</text>

    <rect x="20" y="125" width="290" height="35" rx="4" fill="#047857"/>
    <text x="165" y="147" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Single 128-Bit Packed Word</text>

    <text x="165" y="185" fill="#34d399" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Utilizes byte strobes (`WSTRB`) to place bytes</text>
  </g>
</svg>
