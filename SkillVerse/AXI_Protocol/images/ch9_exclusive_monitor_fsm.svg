<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="fsmArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">State Machine of the AXI Exclusive Access Monitor</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Per-Master state tracking for reservation addresses</text>

  <!-- State 1: OPEN (Reset / Dormant) -->
  <g transform="translate(100, 110)">
    <circle cx="90" cy="70" r="60" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="90" y="65" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">OPEN</text>
    <text x="90" y="85" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">(No active tag)</text>
  </g>

  <!-- State 2: EXCLUSIVE ACCESS -->
  <g transform="translate(500, 110)">
    <circle cx="90" cy="70" r="60" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
    <text x="90" y="65" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">EXCLUSIVE</text>
    <text x="90" y="85" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Tag: {ID, Addr}</text>
  </g>

  <!-- Transition: OPEN -> EXCLUSIVE on Read Ex -->
  <path d="M 250 145 L 490 145" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#fsmArr)"/>
  <text x="370" y="135" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Exclusive Read (ARLOCK=1)</text>

  <!-- Transition: EXCLUSIVE -> OPEN on Write Ex or Collision -->
  <path d="M 495 210 L 255 210" stroke="#f87171" stroke-width="2.5" marker-end="url(#fsmArr)"/>
  <text x="375" y="230" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Exclusive Write Done OR Other Master writes Addr</text>

  <text x="420" y="295" fill="#64748b" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Any intervening write by any master to the monitored address tag immediately resets the state to OPEN</text>
</svg>
