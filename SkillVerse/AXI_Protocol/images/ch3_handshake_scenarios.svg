<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">The Three AXI Handshake Scenarios (VALID &amp; READY)</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Information transfer occurs strictly on rising clock edge when VALID and READY are both HIGH</text>

  <!-- Scenario 1: VALID before READY -->
  <g transform="translate(40, 80)">
    <rect width="250" height="250" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="125" y="25" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Scenario 1: VALID before READY</text>
    <text x="125" y="42" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">(Slave throttles transfer)</text>

    <!-- Timing ASCII -->
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">CLK   : _/-\_/-\_/-\_/-\_</text>
    <text x="15" y="105" fill="#38bdf8" font-size="11" font-family="monospace">VALID : ___/------------\</text>
    <text x="15" y="135" fill="#34d399" font-size="11" font-family="monospace">READY : _________/------\</text>
    <text x="15" y="165" fill="#fbbf24" font-size="11" font-family="monospace">DATA  : ===&lt;===DATA====&gt;=</text>

    <rect x="15" y="190" width="220" height="48" rx="4" fill="#0f172a"/>
    <text x="125" y="210" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Master asserts data first;</text>
    <text x="125" y="226" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Slave asserts READY later when ready</text>
  </g>

  <!-- Scenario 2: READY before VALID -->
  <g transform="translate(305, 80)">
    <rect width="250" height="250" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="125" y="25" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Scenario 2: READY before VALID</text>
    <text x="125" y="42" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">(Default Ready Slave)</text>

    <!-- Timing ASCII -->
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">CLK   : _/-\_/-\_/-\_/-\_</text>
    <text x="15" y="105" fill="#34d399" font-size="11" font-family="monospace">READY : ---/------------\</text>
    <text x="15" y="135" fill="#38bdf8" font-size="11" font-family="monospace">VALID : _________/------\</text>
    <text x="15" y="165" fill="#fbbf24" font-size="11" font-family="monospace">DATA  : ---------&lt;DATA-&gt;=</text>

    <rect x="15" y="190" width="220" height="48" rx="4" fill="#0f172a"/>
    <text x="125" y="210" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Slave is immediately receptive;</text>
    <text x="125" y="226" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Master triggers single-cycle transfer</text>
  </g>

  <!-- Scenario 3: Simultaneous -->
  <g transform="translate(570, 80)">
    <rect width="250" height="250" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="125" y="25" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Scenario 3: Simultaneous</text>
    <text x="125" y="42" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">(Zero Wait State)</text>

    <!-- Timing ASCII -->
    <text x="15" y="75" fill="#cbd5e1" font-size="11" font-family="monospace">CLK   : _/-\_/-\_/-\_/-\_</text>
    <text x="15" y="105" fill="#38bdf8" font-size="11" font-family="monospace">VALID : _____/----------\</text>
    <text x="15" y="135" fill="#34d399" font-size="11" font-family="monospace">READY : _____/----------\</text>
    <text x="15" y="165" fill="#fbbf24" font-size="11" font-family="monospace">DATA  : =====&lt;===DATA==&gt;=</text>

    <rect x="15" y="190" width="220" height="48" rx="4" fill="#0f172a"/>
    <text x="125" y="210" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Both asserted on same edge;</text>
    <text x="125" y="226" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="system-ui, sans-serif">Immediate transfer without latency</text>
  </g>
</svg>
