<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="430" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">High-Performance AXI System Interconnect Topology</text>
  <text x="430" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Point-to-point concurrent communication between multiple masters and slaves via crossbar</text>

  <!-- Left: Masters -->
  <g transform="translate(40, 85)">
    <rect width="180" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Master 1</text>
    <text x="90" y="48" fill="#93c5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">CPU Core Cluster</text>
  </g>

  <g transform="translate(40, 180)">
    <rect width="180" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Master 2</text>
    <text x="90" y="48" fill="#93c5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">DMA Controller</text>
  </g>

  <g transform="translate(40, 275)">
    <rect width="180" height="70" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Master 3</text>
    <text x="90" y="48" fill="#93c5fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">GPU / NPU Engine</text>
  </g>

  <!-- Center: Interconnect Matrix -->
  <g transform="translate(300, 75)">
    <rect width="260" height="280" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect width="260" height="40" rx="12" fill="#0284c7"/>
    <text x="130" y="26" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Crossbar Interconnect</text>
    
    <rect x="20" y="60" width="220" height="45" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="130" y="87" fill="#bae6fd" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Address Decoding &amp; Routing</text>

    <rect x="20" y="120" width="220" height="45" rx="6" fill="#0f172a" stroke="#818cf8"/>
    <text x="130" y="147" fill="#c7d2fe" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Channel Arbitration &amp; QoS</text>

    <rect x="20" y="180" width="220" height="45" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="130" y="207" fill="#a7f3d0" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Width &amp; Rate Adaptation (CDC)</text>

    <text x="130" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Full-Duplex Crossbar Switch Fabric</text>
  </g>

  <!-- Right: Slaves -->
  <g transform="translate(640, 85)">
    <rect width="180" height="70" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Slave 1</text>
    <text x="90" y="48" fill="#a7f3d0" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">DDR5 / LPDDR5 Memory</text>
  </g>

  <g transform="translate(640, 180)">
    <rect width="180" height="70" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Slave 2</text>
    <text x="90" y="48" fill="#a7f3d0" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">On-Chip SRAM (TCM)</text>
  </g>

  <g transform="translate(640, 275)">
    <rect width="180" height="70" rx="8" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI-to-APB Bridge</text>
    <text x="90" y="48" fill="#fde68a" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Peripheral Subsystem</text>
  </g>

  <!-- Connections -->
  <line x1="220" y1="120" x2="295" y2="120" stroke="#38bdf8" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="220" y1="215" x2="295" y2="215" stroke="#38bdf8" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="220" y1="310" x2="295" y2="310" stroke="#38bdf8" stroke-width="2" marker-end="url(#m1)"/>

  <line x1="560" y1="120" x2="635" y2="120" stroke="#34d399" stroke-width="2" marker-end="url(#m2)"/>
  <line x1="560" y1="215" x2="635" y2="215" stroke="#34d399" stroke-width="2" marker-end="url(#m2)"/>
  <line x1="560" y1="310" x2="635" y2="310" stroke="#34d399" stroke-width="2" marker-end="url(#m2)"/>
</svg>
