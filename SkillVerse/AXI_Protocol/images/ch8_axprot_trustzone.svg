<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Access Protection (AxPROT[2:0]) &amp; ARM TrustZone</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">3-Bit hardware security vector enforcing privilege, security domain, and access type</text>

  <!-- 3 Bit Columns -->
  <!-- Bit 0 -->
  <g transform="translate(60, 85)">
    <rect width="220" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxPROT[0]: Privilege</text>
    <rect x="15" y="50" width="190" height="40" rx="4" fill="#0369a1"/>
    <text x="25" y="75" fill="#ffffff" font-size="11" font-family="monospace">0 = Normal (User)</text>
    <rect x="15" y="100" width="190" height="40" rx="4" fill="#1e3a8a"/>
    <text x="25" y="125" fill="#ffffff" font-size="11" font-family="monospace">1 = Privileged (OS)</text>
    <text x="110" y="170" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Blocks unprivileged user-mode</text>
    <text x="110" y="185" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">apps from touching kernel regs</text>
  </g>

  <!-- Bit 1 -->
  <g transform="translate(310, 85)">
    <rect width="220" height="200" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="110" y="30" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxPROT[1]: Security</text>
    <rect x="15" y="50" width="190" height="40" rx="4" fill="#065f46"/>
    <text x="25" y="75" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="monospace">0 = SECURE (TrustZone)</text>
    <rect x="15" y="100" width="190" height="40" rx="4" fill="#78350f"/>
    <text x="25" y="125" fill="#fde68a" font-size="11" font-family="monospace">1 = Non-Secure (Normal)</text>
    <text x="110" y="170" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Notice: 0 is Secure!</text>
    <text x="110" y="185" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Firewalls reject 1 targeting crypto</text>
  </g>

  <!-- Bit 2 -->
  <g transform="translate(560, 85)">
    <rect width="220" height="200" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="110" y="30" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">AxPROT[2]: Type</text>
    <rect x="15" y="50" width="190" height="40" rx="4" fill="#451a03"/>
    <text x="25" y="75" fill="#ffffff" font-size="11" font-family="monospace">0 = Data Access</text>
    <rect x="15" y="100" width="190" height="40" rx="4" fill="#312e81"/>
    <text x="25" y="125" fill="#ffffff" font-size="11" font-family="monospace">1 = Instruction Fetch</text>
    <text x="110" y="170" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Prevents execution from</text>
    <text x="110" y="185" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">data buffer peripherals (XN)</text>
  </g>
</svg>
