<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="430" y="30" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Complete AXI4 Write Transaction Timing Waveform</text>
  <text x="430" y="48" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">4-Beat write burst across Write Address (AW), Write Data (W), and Write Response (B) channels</text>

  <!-- Grid lines -->
  <g stroke="#334155" stroke-dasharray="3 3">
    <line x1="160" y1="65" x2="160" y2="350"/>
    <line x1="260" y1="65" x2="260" y2="350"/>
    <line x1="360" y1="65" x2="360" y2="350"/>
    <line x1="460" y1="65" x2="460" y2="350"/>
    <line x1="560" y1="65" x2="560" y2="350"/>
    <line x1="660" y1="65" x2="660" y2="350"/>
    <line x1="760" y1="65" x2="760" y2="350"/>
  </g>

  <!-- Edge Markers -->
  <text x="160" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T1</text>
  <text x="260" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T2</text>
  <text x="360" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T3</text>
  <text x="460" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T4</text>
  <text x="560" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T5</text>
  <text x="660" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T6</text>
  <text x="760" y="62" fill="#64748b" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">T7</text>

  <!-- Labels -->
  <text x="40" y="85" fill="#f8fafc" font-size="11" font-weight="bold" font-family="system-ui, sans-serif">ACLK</text>
  <text x="40" y="115" fill="#38bdf8" font-size="11" font-family="monospace">AWADDR</text>
  <text x="40" y="145" fill="#38bdf8" font-size="11" font-family="monospace">AWVALID</text>
  <text x="40" y="175" fill="#38bdf8" font-size="11" font-family="monospace">AWREADY</text>
  <text x="40" y="205" fill="#818cf8" font-size="11" font-family="monospace">WDATA</text>
  <text x="40" y="235" fill="#818cf8" font-size="11" font-family="monospace">WLAST</text>
  <text x="40" y="265" fill="#818cf8" font-size="11" font-family="monospace">WVALID</text>
  <text x="40" y="295" fill="#818cf8" font-size="11" font-family="monospace">WREADY</text>
  <text x="40" y="325" fill="#34d399" font-size="11" font-family="monospace">BVALID</text>
  <text x="40" y="355" fill="#34d399" font-size="11" font-family="monospace">BREADY</text>

  <!-- Waveforms -->
  <!-- ACLK -->
  <path d="M 110 85 L 160 85 L 160 70 L 210 70 L 210 85 L 260 85 L 260 70 L 310 70 L 310 85 L 360 85 L 360 70 L 410 70 L 410 85 L 460 85 L 460 70 L 510 70 L 510 85 L 560 85 L 560 70 L 610 70 L 610 85 L 660 85 L 660 70 L 710 70 L 710 85 L 760 85 L 760 70 L 810 70" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- AWADDR -->
  <path d="M 110 115 L 160 115 L 170 105 L 250 105 L 260 115 L 810 115" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="210" y="113" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="monospace">0x4000</text>

  <!-- AWVALID -->
  <path d="M 110 148 L 160 148 L 160 135 L 260 135 L 260 148 L 810 148" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- AWREADY -->
  <path d="M 110 178 L 160 178 L 160 165 L 260 165 L 260 178 L 810 178" fill="none" stroke="#38bdf8" stroke-width="2"/>

  <!-- WDATA (4 beats: T2-T3, T3-T4, T4-T5, T5-T6) -->
  <path d="M 110 205 L 260 205 L 270 195 L 350 195 L 360 205 L 370 195 L 450 195 L 460 205 L 470 195 L 550 195 L 560 205 L 570 195 L 650 195 L 660 205 L 810 205" fill="none" stroke="#818cf8" stroke-width="2"/>
  <text x="310" y="203" fill="#818cf8" font-size="9" text-anchor="middle" font-family="monospace">D0</text>
  <text x="410" y="203" fill="#818cf8" font-size="9" text-anchor="middle" font-family="monospace">D1</text>
  <text x="510" y="203" fill="#818cf8" font-size="9" text-anchor="middle" font-family="monospace">D2</text>
  <text x="610" y="203" fill="#818cf8" font-size="9" text-anchor="middle" font-family="monospace">D3</text>

  <!-- WLAST (asserted on D3 at T5-T6) -->
  <path d="M 110 238 L 560 238 L 560 225 L 660 225 L 660 238 L 810 238" fill="none" stroke="#818cf8" stroke-width="2"/>

  <!-- WVALID -->
  <path d="M 110 268 L 260 268 L 260 255 L 660 255 L 660 268 L 810 268" fill="none" stroke="#818cf8" stroke-width="2"/>

  <!-- WREADY -->
  <path d="M 110 298 L 260 298 L 260 285 L 660 285 L 660 298 L 810 298" fill="none" stroke="#818cf8" stroke-width="2"/>

  <!-- BVALID (at T6-T7) -->
  <path d="M 110 328 L 660 328 L 660 315 L 760 315 L 760 328 L 810 328" fill="none" stroke="#34d399" stroke-width="2"/>

  <!-- BREADY -->
  <path d="M 110 358 L 660 358 L 660 345 L 760 345 L 760 358 L 810 358" fill="none" stroke="#34d399" stroke-width="2"/>
</svg>
