<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Out-of-Order Transaction Completion with IDs</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Transactions with DIFFERENT IDs can complete in any order; SAME ID must complete in order</text>

  <!-- Flow diagram -->
  <g transform="translate(60, 85)">
    <rect width="200" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="100" y="28" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">1. Issued by Master</text>
    
    <rect x="15" y="45" width="170" height="40" rx="4" fill="#0284c7"/>
    <text x="25" y="68" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">Trans 1: ARID = 1</text>
    <text x="25" y="80" fill="#bae6fd" font-size="9" font-family="system-ui, sans-serif">To Slow DDR (Latency 80ns)</text>

    <rect x="15" y="100" width="170" height="40" rx="4" fill="#047857"/>
    <text x="25" y="123" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">Trans 2: ARID = 2</text>
    <text x="25" y="135" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif">To Fast SRAM (Latency 5ns)</text>

    <text x="100" y="175" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Master sends Trans 1</text>
    <text x="100" y="190" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">before Trans 2</text>
  </g>

  <!-- Middle Interconnect -->
  <g transform="translate(320, 130)">
    <rect width="200" height="120" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text x="100" y="35" fill="#ede9fe" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Interconnect Crossbar</text>
    <text x="100" y="60" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Fast SRAM completes</text>
    <text x="100" y="76" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">much earlier than DDR</text>
    <text x="100" y="100" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Different IDs: Allowed to pass!</text>
  </g>

  <!-- Right: Return to Master -->
  <g transform="translate(580, 85)">
    <rect width="200" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="28" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2. Returned to Master</text>
    
    <rect x="15" y="45" width="170" height="40" rx="4" fill="#047857"/>
    <text x="25" y="68" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">Trans 2: RID = 2</text>
    <text x="25" y="80" fill="#a7f3d0" font-size="9" font-family="system-ui, sans-serif">Returns FIRST! (Cycle 15)</text>

    <rect x="15" y="100" width="170" height="40" rx="4" fill="#0284c7"/>
    <text x="25" y="123" fill="#ffffff" font-size="11" font-weight="bold" font-family="monospace">Trans 1: RID = 1</text>
    <text x="25" y="135" fill="#bae6fd" font-size="9" font-family="system-ui, sans-serif">Returns LATER! (Cycle 85)</text>

    <text x="100" y="175" fill="#34d399" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">No Head-of-Line Blocking!</text>
    <text x="100" y="190" fill="#34d399" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">DDR latency does not stall SRAM</text>
  </g>

  <!-- Connectors -->
  <line x1="260" y1="190" x2="315" y2="190" stroke="#a78bfa" stroke-width="2"/>
  <line x1="520" y1="190" x2="575" y2="190" stroke="#a78bfa" stroke-width="2"/>
</svg>
