<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Quality of Service (AxQOS[3:0]) Dynamic Interconnect Arbitration</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">4-Bit priority rating prioritizing latency-critical traffic over best-effort transfers</text>

  <!-- Left: Requesters with QoS -->
  <!-- Master A: Real-Time Display -->
  <g transform="translate(60, 90)">
    <rect width="220" height="65" rx="6" fill="#831843" stroke="#f472b6" stroke-width="2"/>
    <text x="110" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Display Refresh Engine</text>
    <text x="110" y="48" fill="#fbcfe8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">AxQOS = 4'b1110 (High!)</text>
  </g>

  <!-- Master B: DMA Bulk Copy -->
  <g transform="translate(60, 185)">
    <rect width="220" height="65" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="110" y="26" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Background DMA Copy</text>
    <text x="110" y="48" fill="#93c5fd" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">AxQOS = 4'b0010 (Low)</text>
  </g>

  <!-- Center: QoS Arbiter -->
  <g transform="translate(340, 110)">
    <rect width="180" height="120" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text x="90" y="35" fill="#ede9fe" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">QoS Interconnect</text>
    <text x="90" y="55" fill="#c4b5fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Arbiter Matrix</text>
    <rect x="20" y="70" width="140" height="35" rx="4" fill="#047857"/>
    <text x="90" y="92" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Grants Display First!</text>
  </g>

  <!-- Right: Shared DDR -->
  <g transform="translate(580, 135)">
    <rect width="200" height="70" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="100" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Shared DDR5 Memory</text>
    <text x="100" y="50" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Zero display buffer underflow</text>
  </g>

  <!-- Connections -->
  <line x1="280" y1="122" x2="335" y2="150" stroke="#f472b6" stroke-width="2.5"/>
  <line x1="280" y1="217" x2="335" y2="185" stroke="#60a5fa" stroke-width="2"/>
  <line x1="520" y1="170" x2="575" y2="170" stroke="#34d399" stroke-width="2.5"/>

  <text x="420" y="285" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Default QoS is 4'b0000. Higher values guarantee bandwidth and lower arbitration latency.</text>
</svg>
