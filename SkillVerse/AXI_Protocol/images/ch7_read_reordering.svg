<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AXI Read Data Interleaving and Reordering</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">Read data beats from different IDs can interleave arbitrarily on the R channel</text>

  <!-- Stream of beats -->
  <g transform="translate(60, 110)">
    <!-- Beat 1: ID 2 -->
    <rect x="0" y="0" width="160" height="70" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace">Beat 0: RID = 2</text>
    <text x="80" y="50" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SRAM Data Beat</text>

    <!-- Beat 2: ID 1 -->
    <rect x="180" y="0" width="160" height="70" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace" transform="translate(180,0)">Beat 0: RID = 1</text>
    <text x="80" y="50" fill="#bae6fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif" transform="translate(180,0)">DDR Data Beat</text>

    <!-- Beat 3: ID 2 -->
    <rect x="360" y="0" width="160" height="70" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace" transform="translate(360,0)">Beat 1: RID = 2</text>
    <text x="80" y="50" fill="#a7f3d0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif" transform="translate(360,0)">RLAST = 1 (Done)</text>

    <!-- Beat 4: ID 1 -->
    <rect x="540" y="0" width="160" height="70" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="30" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="monospace" transform="translate(540,0)">Beat 1: RID = 1</text>
    <text x="80" y="50" fill="#bae6fd" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif" transform="translate(540,0)">DDR Next Beat</text>
  </g>

  <text x="420" y="240" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">The Master uses the RID tag to de-multiplex incoming data beats to the correct internal FIFO</text>
  <text x="420" y="265" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Beats with RID=2 are reassembled into Transaction 2; beats with RID=1 are reassembled into Transaction 1</text>
</svg>
