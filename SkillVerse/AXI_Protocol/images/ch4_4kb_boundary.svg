<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0f172a"/>
  <text x="420" y="32" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">The AXI 4KB Address Boundary Rule</text>
  <text x="420" y="52" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">A single burst transaction must NEVER cross a 4KB (0x1000) address boundary</text>

  <!-- Two 4KB Pages -->
  <!-- Page 1 -->
  <g transform="translate(80, 80)">
    <rect width="320" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="30" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Page N (4KB Aperture)</text>
    <text x="160" y="50" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Mapped to Slave A (e.g. SRAM 1)</text>
    <rect x="180" y="70" width="120" height="40" rx="4" fill="#0284c7"/>
    <text x="240" y="95" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Start: 0x0FF0</text>
  </g>

  <!-- 4KB Boundary Line -->
  <line x1="420" y1="70" x2="420" y2="250" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3"/>
  <text x="420" y="275" fill="#ef4444" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">4KB Boundary (0x1000)</text>

  <!-- Page 2 -->
  <g transform="translate(440, 80)">
    <rect width="320" height="150" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="160" y="30" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Page N+1 (4KB Aperture)</text>
    <text x="160" y="50" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Mapped to Slave B (e.g. Flash / Regs)</text>
    <rect x="20" y="70" width="120" height="40" rx="4" fill="#831843"/>
    <text x="80" y="95" fill="#fbcfe8" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Next: 0x1004</text>
  </g>

  <!-- Cross Burst Arrow (Illegal) -->
  <path d="M 240 90 L 500 90" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 2"/>
  <text x="370" y="80" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">ILLEGAL BURST!</text>

  <!-- Explanation note -->
  <text x="420" y="305" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Why? Subordinate address decoders sample address ONLY on beat 0. Crossing 4KB would route beats to wrong slave!</text>
</svg>
