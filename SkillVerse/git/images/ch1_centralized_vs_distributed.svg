<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .box-server { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .box-client { fill: #131d33; stroke: #475569; stroke-width: 1.5; rx: 6; }
      .box-peer { fill: #0f2438; stroke: #38bdf8; stroke-width: 1.8; rx: 6; }
      .box-git-srv { fill: #1a2333; stroke: #34d399; stroke-width: 2; rx: 8; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .txt-detail { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #cbd5e1; }
      .txt-alert { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; }
      .edge { stroke: #64748b; stroke-width: 1.5; fill: none; }
      .edge-active { stroke: #38bdf8; stroke-width: 1.8; fill: none; stroke-dasharray: 4,4; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" class="title">Centralized (CVCS) vs. Distributed (DVCS) Architecture</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Structural comparison between single-server repositories and decentralized peer nodes</text>

  <!-- Left Panel: Centralized VCS -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="425" height="375" class="panel"/>
    <text x="212" y="28" text-anchor="middle" class="txt-hdr" style="fill: #f59e0b;">Centralized VCS (e.g., SVN, CVS)</text>
    <text x="212" y="46" text-anchor="middle" class="txt-sub">Single central repository holds the only historical database</text>

    <!-- Central Server Box -->
    <g transform="translate(112, 65)">
      <rect x="0" y="0" width="200" height="75" class="box-server"/>
      <text x="100" y="24" text-anchor="middle" class="txt-hdr" style="fill: #f59e0b; font-size: 13px;">Central Version Server</text>
      <text x="100" y="44" text-anchor="middle" class="txt-detail">• Master Database &amp; History</text>
      <text x="100" y="60" text-anchor="middle" class="txt-detail">• Sole Source of Version Truth</text>
    </g>

    <!-- Connectors to clients -->
    <path d="M 150 140 L 75 220" class="edge" marker-end="url(#arr-gray)"/>
    <path d="M 212 140 L 212 220" class="edge" marker-end="url(#arr-gray)"/>
    <path d="M 275 140 L 350 220" class="edge" marker-end="url(#arr-gray)"/>

    <!-- Client Workstations -->
    <!-- Client 1 -->
    <g transform="translate(15, 225)">
      <rect x="0" y="0" width="120" height="60" class="box-client"/>
      <text x="60" y="22" text-anchor="middle" class="txt-hdr" style="fill: #cbd5e1; font-size: 11px;">Client Node 1</text>
      <text x="60" y="40" text-anchor="middle" class="txt-sub">Working Copy Only</text>
      <text x="60" y="52" text-anchor="middle" class="txt-detail" style="fill: #94a3b8;">(No Local History)</text>
    </g>

    <!-- Client 2 -->
    <g transform="translate(152, 225)">
      <rect x="0" y="0" width="120" height="60" class="box-client"/>
      <text x="60" y="22" text-anchor="middle" class="txt-hdr" style="fill: #cbd5e1; font-size: 11px;">Client Node 2</text>
      <text x="60" y="40" text-anchor="middle" class="txt-sub">Working Copy Only</text>
      <text x="60" y="52" text-anchor="middle" class="txt-detail" style="fill: #94a3b8;">(No Local History)</text>
    </g>

    <!-- Client 3 -->
    <g transform="translate(290, 225)">
      <rect x="0" y="0" width="120" height="60" class="box-client"/>
      <text x="60" y="22" text-anchor="middle" class="txt-hdr" style="fill: #cbd5e1; font-size: 11px;">Client Node 3</text>
      <text x="60" y="40" text-anchor="middle" class="txt-sub">Working Copy Only</text>
      <text x="60" y="52" text-anchor="middle" class="txt-detail" style="fill: #94a3b8;">(No Local History)</text>
    </g>

    <!-- Vulnerabilities Card -->
    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="385" height="52" class="box-client" style="stroke: #f43f5e; fill: #1c131a;"/>
      <text x="192" y="20" text-anchor="middle" class="txt-alert" style="fill: #f43f5e;">Vulnerability: Single Point of Failure (SPOF)</text>
      <text x="192" y="38" text-anchor="middle" class="txt-detail" style="fill: #cbd5e1;">Server outage blocks all commits, branching, and historical diffs.</text>
    </g>
  </g>

  <!-- Right Panel: Distributed VCS -->
  <g transform="translate(495, 75)">
    <rect x="0" y="0" width="425" height="375" class="panel"/>
    <text x="212" y="28" text-anchor="middle" class="txt-hdr" style="fill: #38bdf8;">Distributed VCS (Git)</text>
    <text x="212" y="46" text-anchor="middle" class="txt-sub">Every peer node holds an independent, full-fledged repository</text>

    <!-- Remote Central Hub Box -->
    <g transform="translate(112, 65)">
      <rect x="0" y="0" width="200" height="75" class="box-git-srv"/>
      <text x="100" y="24" text-anchor="middle" class="txt-hdr" style="fill: #34d399; font-size: 13px;">Remote Server (e.g., GitHub)</text>
      <text x="100" y="44" text-anchor="middle" class="txt-detail">• Synchronization Hub</text>
      <text x="100" y="60" text-anchor="middle" class="txt-detail">• Pull Requests &amp; CI/CD Pipelines</text>
    </g>

    <!-- Bi-directional connections -->
    <path d="M 150 140 L 75 205" class="edge-active" marker-end="url(#arr-blue)"/>
    <path d="M 212 140 L 212 205" class="edge-active" marker-end="url(#arr-blue)"/>
    <path d="M 275 140 L 350 205" class="edge-active" marker-end="url(#arr-blue)"/>

    <!-- Peer Nodes -->
    <!-- Peer 1 -->
    <g transform="translate(15, 210)">
      <rect x="0" y="0" width="120" height="80" class="box-peer"/>
      <text x="60" y="20" text-anchor="middle" class="txt-hdr" style="fill: #38bdf8; font-size: 11px;">Developer Node A</text>
      <text x="60" y="38" text-anchor="middle" class="txt-detail">• Working Tree</text>
      <text x="60" y="54" text-anchor="middle" class="txt-detail">• Staging Area</text>
      <text x="60" y="70" text-anchor="middle" class="txt-detail" style="fill: #34d399;">• Full Git DB &amp; DAG</text>
    </g>

    <!-- Peer 2 -->
    <g transform="translate(152, 210)">
      <rect x="0" y="0" width="120" height="80" class="box-peer"/>
      <text x="60" y="20" text-anchor="middle" class="txt-hdr" style="fill: #38bdf8; font-size: 11px;">Developer Node B</text>
      <text x="60" y="38" text-anchor="middle" class="txt-detail">• Working Tree</text>
      <text x="60" y="54" text-anchor="middle" class="txt-detail">• Staging Area</text>
      <text x="60" y="70" text-anchor="middle" class="txt-detail" style="fill: #34d399;">• Full Git DB &amp; DAG</text>
    </g>

    <!-- Peer 3 -->
    <g transform="translate(290, 210)">
      <rect x="0" y="0" width="120" height="80" class="box-peer"/>
      <text x="60" y="20" text-anchor="middle" class="txt-hdr" style="fill: #38bdf8; font-size: 11px;">Developer Node C</text>
      <text x="60" y="38" text-anchor="middle" class="txt-detail">• Working Tree</text>
      <text x="60" y="54" text-anchor="middle" class="txt-detail">• Staging Area</text>
      <text x="60" y="70" text-anchor="middle" class="txt-detail" style="fill: #34d399;">• Full Git DB &amp; DAG</text>
    </g>

    <!-- Advantages Card -->
    <g transform="translate(20, 305)">
      <rect x="0" y="0" width="385" height="52" class="box-client" style="stroke: #34d399; fill: #0d2320;"/>
      <text x="192" y="20" text-anchor="middle" class="txt-alert" style="fill: #34d399;">Strength: Total Offline Autonomy &amp; Redundancy</text>
      <text x="192" y="38" text-anchor="middle" class="txt-detail" style="fill: #cbd5e1;">Every clone is a full backup; commit, branch, and inspect history offline.</text>
    </g>
  </g>
</svg>
