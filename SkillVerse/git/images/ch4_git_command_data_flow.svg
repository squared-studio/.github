<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .zone-col { fill: #0f172a; stroke-width: 1.8; rx: 8; }
      .zone-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 14px; }
      .zone-desc { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .cmd-label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; }
      .flag-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 9px; fill: #cbd5e1; }
      .path-fwd { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .path-rev { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
      .path-sync { stroke: #34d399; stroke-width: 2; fill: none; }
      .path-long { stroke: #a855f7; stroke-width: 1.8; fill: none; stroke-dasharray: 6,4; }
      .badge-cmd { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="14"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" class="title">Comprehensive Git Command Data Flow Matrix</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Visualizing data movement across Working Tree, Staging Area, Local Repository, and Remote Server</text>

  <!-- 4 Zones at Top (y=75, h=70) -->
  <!-- Zone 1: Working Tree -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="195" height="70" class="zone-col" style="stroke: #f59e0b; fill: #161a24;"/>
    <text x="97" y="26" text-anchor="middle" class="zone-title" style="fill: #f59e0b;">Working Directory</text>
    <text x="97" y="44" text-anchor="middle" class="zone-desc">Filesystem &amp; Editors</text>
    <text x="97" y="58" text-anchor="middle" class="zone-desc" style="fill:#fbbf24;">(Modified / Untracked)</text>
  </g>

  <!-- Zone 2: Staging Area -->
  <g transform="translate(268, 75)">
    <rect x="0" y="0" width="195" height="70" class="zone-col" style="stroke: #38bdf8; fill: #0d1e33;"/>
    <text x="97" y="26" text-anchor="middle" class="zone-title" style="fill: #38bdf8;">Staging Area (Index)</text>
    <text x="97" y="44" text-anchor="middle" class="zone-desc">.git/index cache</text>
    <text x="97" y="58" text-anchor="middle" class="zone-desc" style="fill:#7dd3fc;">(Prepared Snapshot)</text>
  </g>

  <!-- Zone 3: Local Repo -->
  <g transform="translate(496, 75)">
    <rect x="0" y="0" width="195" height="70" class="zone-col" style="stroke: #34d399; fill: #0b221c;"/>
    <text x="97" y="26" text-anchor="middle" class="zone-title" style="fill: #34d399;">Local Repo (HEAD)</text>
    <text x="97" y="44" text-anchor="middle" class="zone-desc">.git/objects/ &amp; refs</text>
    <text x="97" y="58" text-anchor="middle" class="zone-desc" style="fill:#6ee7b7;">(Committed DAG)</text>
  </g>

  <!-- Zone 4: Remote Repo -->
  <g transform="translate(725, 75)">
    <rect x="0" y="0" width="195" height="70" class="zone-col" style="stroke: #a855f7; fill: #1a1226;"/>
    <text x="97" y="26" text-anchor="middle" class="zone-title" style="fill: #a855f7;">Remote (origin)</text>
    <text x="97" y="44" text-anchor="middle" class="zone-desc">GitHub / GitLab Cloud</text>
    <text x="97" y="58" text-anchor="middle" class="zone-desc" style="fill:#d8b4fe;">(Shared Central)</text>
  </g>

  <!-- Flow 1: git add (Working -> Staging) -->
  <g transform="translate(0, 160)">
    <path d="M 235 20 L 260 20" class="path-fwd" marker-end="url(#arr-blue)"/>
    <g transform="translate(195, 8)">
      <rect x="0" y="0" width="105" height="24" class="badge-cmd" style="stroke:#38bdf8; fill:#0c2540;"/>
      <text x="52" y="16" text-anchor="middle" class="cmd-label" style="fill:#38bdf8;">git add &lt;file&gt;</text>
    </g>
    <text x="140" y="42" class="flag-txt">Stages modified/new files into index</text>
  </g>

  <!-- Flow 2: git restore  - staged (Staging -> Working) -->
  <g transform="translate(0, 215)">
    <path d="M 268 20 L 243 20" class="path-rev" marker-end="url(#arr-red)"/>
    <g transform="translate(170, 8)">
      <rect x="0" y="0" width="160" height="24" class="badge-cmd" style="stroke:#f43f5e; fill:#260c14;"/>
      <text x="80" y="16" text-anchor="middle" class="cmd-label" style="fill:#f43f5e;">git restore --staged &lt;file&gt;</text>
    </g>
    <text x="175" y="42" class="flag-txt">Unstages file; preserves working copy changes</text>
  </g>

  <!-- Flow 3: git commit (Staging -> Local Repo) -->
  <g transform="translate(0, 270)">
    <path d="M 463 20 L 488 20" class="path-sync" marker-end="url(#arr-green)"/>
    <g transform="translate(415, 8)">
      <rect x="0" y="0" width="130" height="24" class="badge-cmd" style="stroke:#34d399; fill:#072b1e;"/>
      <text x="65" y="16" text-anchor="middle" class="cmd-label" style="fill:#34d399;">git commit -m "..."</text>
    </g>
    <text x="420" y="42" class="flag-txt">Writes new commit node; advances branch</text>
  </g>

  <!-- Flow 4: git reset  - soft (Local Repo -> Staging) -->
  <g transform="translate(0, 325)">
    <path d="M 496 20 L 471 20" class="path-rev" marker-end="url(#arr-red)"/>
    <g transform="translate(405, 8)">
      <rect x="0" y="0" width="150" height="24" class="badge-cmd" style="stroke:#f43f5e; fill:#260c14;"/>
      <text x="75" y="16" text-anchor="middle" class="cmd-label" style="fill:#f43f5e;">git reset --soft HEAD~1</text>
    </g>
    <text x="390" y="42" class="flag-txt">Moves HEAD back; keeps changes staged</text>
  </g>

  <!-- Flow 5: git push (Local Repo -> Remote) -->
  <g transform="translate(0, 160)">
    <path d="M 691 20 L 717 20" class="path-fwd" marker-end="url(#arr-blue)"/>
    <g transform="translate(650, 8)">
      <rect x="0" y="0" width="105" height="24" class="badge-cmd" style="stroke:#38bdf8; fill:#0c2540;"/>
      <text x="52" y="16" text-anchor="middle" class="cmd-label" style="fill:#38bdf8;">git push origin</text>
    </g>
    <text x="640" y="42" class="flag-txt">Uploads local commits to remote branch</text>
  </g>

  <!-- Flow 6: git fetch (Remote -> Local Repo) -->
  <g transform="translate(0, 215)">
    <path d="M 725 20 L 699 20" class="path-sync" marker-end="url(#arr-green)"/>
    <g transform="translate(648, 8)">
      <rect x="0" y="0" width="110" height="24" class="badge-cmd" style="stroke:#34d399; fill:#072b1e;"/>
      <text x="55" y="16" text-anchor="middle" class="cmd-label" style="fill:#34d399;">git fetch origin</text>
    </g>
    <text x="635" y="42" class="flag-txt">Downloads objects into refs/remotes/origin/*</text>
  </g>

  <!-- Flow 7: git pull (Remote directly to Working + Local Repo) -->
  <g transform="translate(0, 380)">
    <path d="M 822 0 L 822 55 L 137 55 L 137 0" class="path-long" marker-end="url(#arr-purple)"/>
    <g transform="translate(365, 43)">
      <rect x="0" y="0" width="230" height="24" class="badge-cmd" style="stroke:#a855f7; fill:#1e102f;"/>
      <text x="115" y="16" text-anchor="middle" class="cmd-label" style="fill:#d8b4fe;">git pull (fetch + merge/rebase)</text>
    </g>
  </g>

  <!-- Bottom Helper Bar (y=455) -->
  <g transform="translate(40, 455)">
    <rect x="0" y="0" width="880" height="50" class="zone-col" style="stroke:#334155; fill:#0b1120;"/>
    <text x="20" y="20" class="cmd-label" style="fill:#f59e0b; font-size:11px;">git restore &lt;file&gt;</text>
    <text x="145" y="20" class="flag-txt" style="font-size:10px;">: Discard unstaged working tree changes (reverts file to match staged index)</text>

    <text x="20" y="38" class="cmd-label" style="fill:#f43f5e; font-size:11px;">git reset --hard</text>
    <text x="145" y="38" class="flag-txt" style="font-size:10px;">: Destructive! Discards all uncommitted changes in both index and working tree to match HEAD</text>
  </g>
</svg>
