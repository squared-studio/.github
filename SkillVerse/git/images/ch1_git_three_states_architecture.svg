<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .col-box { fill: #0f172a; stroke-width: 2; rx: 10; }
      .col-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 16px; }
      .col-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .inner-card { fill: #131d33; stroke: #334155; stroke-width: 1; rx: 6; }
      .txt-bold { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 12px; fill: #f8fafc; }
      .txt-dim { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .cmd-pill { fill: #1e293b; stroke: #475569; stroke-width: 1.2; rx: 5; }
      .cmd-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; }
      .edge-fwd { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .edge-rev { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .diff-banner { fill: #1e2230; stroke: #a855f7; stroke-width: 1.2; rx: 6; }
    </style>
    <marker id="arr-fwd" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-rev" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="490" class="bg" rx="14"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" class="title">Git Architecture: The Three Main Areas &amp; Object Transitions</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">How files transition between the Working Tree, the Staging Area (Index), and the Git Repository (.git)</text>

  <!-- Column 1: Working Directory (x=45, w=260, h=330) -->
  <g transform="translate(45, 80)">
    <rect x="0" y="0" width="260" height="300" class="col-box" style="stroke: #f59e0b; fill: #0f172a;"/>
    <text x="130" y="28" text-anchor="middle" class="col-title" style="fill: #f59e0b;">Working Directory</text>
    <text x="130" y="46" text-anchor="middle" class="col-sub">Active Sandbox / Local Filesystem</text>

    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #fbbf24;">Untracked &amp; Modified</text>
      <text x="12" y="42" class="txt-dim">Actual files on your hard drive</text>
      <text x="12" y="58" class="txt-dim">Edits made in editor or IDE</text>
    </g>

    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #94a3b8;">File Status Check</text>
      <text x="12" y="42" class="txt-dim">View changed/untracked items:</text>
      <text x="12" y="58" class="cmd-txt" style="fill: #f59e0b;">git status</text>
    </g>

    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="230" height="52" class="inner-card" style="stroke: #b45309;"/>
      <text x="12" y="20" class="txt-bold" style="font-size: 11px;">State: "Modified / Dirty"</text>
      <text x="12" y="38" class="txt-dim">Not yet saved into Git's ledger</text>
    </g>
  </g>

  <!-- Connectors Col 1 -> Col 2 -->
  <!-- git add -->
  <path d="M 305 170 L 345 170" class="edge-fwd" marker-end="url(#arr-fwd)"/>
  <g transform="translate(305, 140)">
    <rect x="0" y="0" width="40" height="22" class="cmd-pill" style="stroke: #38bdf8; fill: #0b1a2d;"/>
    <text x="20" y="15" text-anchor="middle" class="cmd-txt" style="fill: #38bdf8; font-size:10px;">add</text>
  </g>

  <!-- git restore / checkout -->
  <path d="M 345 220 L 305 220" class="edge-rev" marker-end="url(#arr-rev)"/>
  <g transform="translate(295, 226)">
    <rect x="0" y="0" width="60" height="20" class="cmd-pill" style="stroke: #f43f5e; fill: #240c14;"/>
    <text x="30" y="14" text-anchor="middle" class="cmd-txt" style="fill: #f43f5e; font-size:9px;">restore</text>
  </g>

  <!-- Column 2: Staging Area / Index (x=350, w=260, h=330) -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="260" height="300" class="col-box" style="stroke: #38bdf8; fill: #0f1c30;"/>
    <text x="130" y="28" text-anchor="middle" class="col-title" style="fill: #38bdf8;">Staging Area (Index)</text>
    <text x="130" y="46" text-anchor="middle" class="col-sub">Drafting Table / Next Commit Payload</text>

    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #38bdf8;">The Index File</text>
      <text x="12" y="42" class="txt-dim">Stored binary at .git/index</text>
      <text x="12" y="58" class="txt-dim">Tracks exact file SHAs to commit</text>
    </g>

    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #94a3b8;">Selective Staging</text>
      <text x="12" y="42" class="txt-dim">Stage individual file chunks:</text>
      <text x="12" y="58" class="cmd-txt" style="fill: #38bdf8;">git add -p</text>
    </g>

    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="230" height="52" class="inner-card" style="stroke: #0284c7;"/>
      <text x="12" y="20" class="txt-bold" style="font-size: 11px;">State: "Staged"</text>
      <text x="12" y="38" class="txt-dim">Snapshot prepared for serialization</text>
    </g>
  </g>

  <!-- Connectors Col 2 -> Col 3 -->
  <!-- git commit -->
  <path d="M 610 170 L 650 170" class="edge-fwd" marker-end="url(#arr-fwd)"/>
  <g transform="translate(605, 140)">
    <rect x="0" y="0" width="50" height="22" class="cmd-pill" style="stroke: #34d399; fill: #0d2320;"/>
    <text x="25" y="15" text-anchor="middle" class="cmd-txt" style="fill: #34d399; font-size:10px;">commit</text>
  </g>

  <!-- git reset -->
  <path d="M 650 220 L 610 220" class="edge-rev" marker-end="url(#arr-rev)"/>
  <g transform="translate(600, 226)">
    <rect x="0" y="0" width="60" height="20" class="cmd-pill" style="stroke: #f43f5e; fill: #240c14;"/>
    <text x="30" y="14" text-anchor="middle" class="cmd-txt" style="fill: #f43f5e; font-size:9px;">reset</text>
  </g>

  <!-- Column 3: Git Repository / Object Store (x=655, w=260, h=330) -->
  <g transform="translate(655, 80)">
    <rect x="0" y="0" width="260" height="300" class="col-box" style="stroke: #34d399; fill: #0d2320;"/>
    <text x="130" y="28" text-anchor="middle" class="col-title" style="fill: #34d399;">Git Directory (.git)</text>
    <text x="130" y="46" text-anchor="middle" class="col-sub">Immutable History &amp; Object Store</text>

    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #34d399;">Object Database (DAG)</text>
      <text x="12" y="42" class="txt-dim">Permanent tree, commit &amp; blob objects</text>
      <text x="12" y="58" class="txt-dim">Referenced by cryptographic SHA</text>
    </g>

    <g transform="translate(15, 145)">
      <rect x="0" y="0" width="230" height="70" class="inner-card"/>
      <text x="12" y="24" class="txt-bold" style="fill: #94a3b8;">HEAD Pointer</text>
      <text x="12" y="42" class="txt-dim">Tracks currently checked out branch</text>
      <text x="12" y="58" class="cmd-txt" style="fill: #34d399;">git log --oneline</text>
    </g>

    <g transform="translate(15, 230)">
      <rect x="0" y="0" width="230" height="52" class="inner-card" style="stroke: #059669;"/>
      <text x="12" y="20" class="txt-bold" style="font-size: 11px;">State: "Committed"</text>
      <text x="12" y="38" class="txt-dim">Safely recorded in permanent database</text>
    </g>
  </g>

  <!-- Diff Inspection Banner at Bottom (y=400) -->
  <g transform="translate(45, 400)">
    <rect x="0" y="0" width="870" height="65" class="diff-banner"/>
    <text x="20" y="24" class="txt-bold" style="fill: #a855f7; font-size: 13px;">Diff Inspection Matrix:</text>
    
    <text x="20" y="48" class="cmd-txt" style="fill: #fbbf24;">git diff</text>
    <text x="85" y="48" class="txt-dim">Compare Working Directory vs. Staging Area (Unstaged changes)</text>

    <text x="470" y="24" class="cmd-txt" style="fill: #38bdf8;">git diff --staged</text>
    <text x="615" y="24" class="txt-dim">Compare Staging Area vs. HEAD commit</text>

    <text x="470" y="48" class="cmd-txt" style="fill: #34d399;">git diff HEAD</text>
    <text x="575" y="48" class="txt-dim">Compare Working Directory directly vs. HEAD</text>
  </g>
</svg>
