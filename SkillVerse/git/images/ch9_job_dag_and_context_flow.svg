<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.6; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Passing State Across Steps &amp; Jobs (Contexts &amp; DAG)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Environment files ($GITHUB_OUTPUT, $GITHUB_ENV, $GITHUB_PATH) and cross-job needs outputs</text>

  <!-- Job A: prepare (Left) -->
  <g transform="translate(32, 82)">
    <rect x="0" y="0" width="380" height="310" class="panel" stroke="#38bdf8"/>
    <text x="16" y="26" class="mono" fill="#38bdf8">JOB: prepare (Runner VM #1)</text>

    <!-- Step 1 inside Job A -->
    <g transform="translate(16, 42)">
      <rect x="0" y="0" width="348" height="92" class="inner" stroke="#34d399"/>
      <text x="12" y="20" class="mono" fill="#34d399">Step A1 (id: meta)</text>
      <text x="12" y="40" class="mono" fill="#cbd5e1">echo "tag=v1.4.2" &gt;&gt; "$GITHUB_OUTPUT"</text>
      <text x="12" y="58" class="mono" fill="#cbd5e1">echo "MODE=rel"   &gt;&gt; "$GITHUB_ENV"</text>
      <text x="12" y="76" class="mono" fill="#cbd5e1">echo "$PWD/bin"   &gt;&gt; "$GITHUB_PATH"</text>
    </g>

    <path d="M 190 134 L 190 156" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

    <!-- Step 2 inside Job A -->
    <g transform="translate(16, 158)">
      <rect x="0" y="0" width="348" height="74" class="inner" stroke="#38bdf8"/>
      <text x="12" y="20" class="mono" fill="#38bdf8">Step A2 (same VM — sees Step A1 state)</text>
      <text x="12" y="40" class="mono" fill="#7dd3fc">steps.meta.outputs.tag  -&gt; "v1.4.2"</text>
      <text x="12" y="58" class="mono" fill="#7dd3fc">$MODE in env; $PWD/bin in PATH</text>
    </g>

    <!-- Job outputs export -->
    <g transform="translate(16, 246)">
      <rect x="0" y="0" width="348" height="50" class="inner" stroke="#f59e0b" fill="#17140d"/>
      <text x="12" y="20" class="mono" fill="#fcd34d">outputs:  # Exported out of VM #1</text>
      <text x="12" y="38" class="mono" fill="#cbd5e1">  release_tag: ${{ steps.meta.outputs.tag }}</text>
    </g>
  </g>

  <!-- Arrow from prepare to deploy (success) -->
  <path d="M 412 240 L 494 170" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>
  <g transform="translate(416, 175)">
    <rect x="0" y="0" width="76" height="22" rx="4" fill="#0d2922" stroke="#34d399"/>
    <text x="38" y="15" text-anchor="middle" class="mono" fill="#6ee7b7" font-size="9.5">success()</text>
  </g>

  <!-- Arrow from prepare to notify (failure) -->
  <path d="M 412 270 L 494 330" class="edge" stroke="#f43f5e" stroke-dasharray="5,4" marker-end="url(#arr-rose)"/>
  <g transform="translate(416, 304)">
    <rect x="0" y="0" width="76" height="22" rx="4" fill="#281018" stroke="#f43f5e"/>
    <text x="38" y="15" text-anchor="middle" class="mono" fill="#fda4af" font-size="9.5">failure()</text>
  </g>

  <!-- Job B: deploy (Top Right) -->
  <g transform="translate(498, 82)">
    <rect x="0" y="0" width="430" height="172" class="panel" stroke="#34d399"/>
    <text x="16" y="26" class="mono" fill="#34d399">JOB: deploy (Runner VM #2)</text>
    <text x="414" y="26" text-anchor="end" class="mono" fill="#6ee7b7">needs: prepare</text>

    <rect x="16" y="42" width="398" height="58" class="inner" stroke="#34d399"/>
    <text x="28" y="62" class="mono" fill="#cbd5e1">if: success()  # Default implicit condition</text>
    <text x="28" y="82" class="mono" fill="#6ee7b7">TAG=${{ needs.prepare.outputs.release_tag }}</text>

    <rect x="16" y="110" width="398" height="48" class="inner" stroke="#334155"/>
    <text x="28" y="130" class="txt-sub" fill="#f59e0b">Note: $GITHUB_ENV &amp; $GITHUB_PATH do NOT cross jobs!</text>
    <text x="28" y="146" class="txt-sub">Only job outputs &amp; artifacts cross VM boundaries.</text>
  </g>

  <!-- Job C: notify (Bottom Right) -->
  <g transform="translate(498, 270)">
    <rect x="0" y="0" width="430" height="122" class="panel" stroke="#f43f5e"/>
    <text x="16" y="26" class="mono" fill="#f43f5e">JOB: notify_failure (Runner VM #3)</text>
    <text x="414" y="26" text-anchor="end" class="mono" fill="#fda4af">needs: [prepare, deploy]</text>

    <rect x="16" y="42" width="398" height="64" class="inner" stroke="#f43f5e"/>
    <text x="28" y="62" class="mono" fill="#fda4af">if: failure() || always()</text>
    <text x="28" y="80" class="txt-sub">Runs even when an upstream job fails</text>
    <text x="28" y="96" class="mono" fill="#cbd5e1">Check: needs.deploy.result == 'failure'</text>
  </g>

  <!-- Bottom Context Precedence Bar -->
  <g transform="translate(32, 412)">
    <rect x="0" y="0" width="896" height="104" class="panel" stroke="#a855f7" fill="#120f20"/>
    <text x="18" y="26" class="txt-hdr" fill="#d8b4fe">Key Expression Contexts &amp; Environment Summary</text>
    <text x="18" y="50" class="mono" fill="#38bdf8">github.*</text>
    <text x="108" y="50" class="txt-sub">Event payload, ref, sha, actor</text>
    <text x="330" y="50" class="mono" fill="#34d399">vars.* / env.*</text>
    <text x="456" y="50" class="txt-sub">Non-secret config &amp; env bindings</text>
    <text x="690" y="50" class="mono" fill="#f59e0b">secrets.*</text>
    <text x="774" y="50" class="txt-sub">Encrypted credentials</text>

    <text x="18" y="76" class="mono" fill="#d8b4fe">needs.*</text>
    <text x="108" y="76" class="txt-sub">Upstream results &amp; outputs</text>
    <text x="330" y="76" class="mono" fill="#7dd3fc">runner.*</text>
    <text x="456" y="76" class="txt-sub">OS, arch, temp, tool_cache</text>
    <text x="690" y="76" class="mono" fill="#bef264">$GITHUB_STEP_SUMMARY</text>
    <text x="844" y="76" class="txt-sub">Markdown UI</text>
  </g>
</svg>
