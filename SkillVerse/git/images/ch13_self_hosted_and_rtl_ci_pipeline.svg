<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.4; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Ephemeral Self-Hosted Runners &amp; Hardware/RTL CI Pipeline</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Scaling isolated on-prem / Kubernetes ARC runners for proprietary EDA licenses and RTL verification flows</text>

  <!-- Top Section: Ephemeral Self-Hosted Runner Architecture -->
  <g transform="translate(32, 78)">
    <rect x="0" y="0" width="896" height="206" class="panel" stroke="#a855f7"/>
    <text x="18" y="24" class="txt-hdr" fill="#d8b4fe">1. Ephemeral Self-Hosted Runner Architecture (K8s ARC / Private Lab)</text>
    <text x="878" y="24" text-anchor="end" class="mono" fill="#f43f5e">PRIVATE REPOS ONLY for self-hosted</text>

    <!-- GitHub Control Plane -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="214" height="146" class="inner" stroke="#38bdf8"/>
      <text x="107" y="24" text-anchor="middle" class="txt-hdr" fill="#38bdf8">GitHub Control Plane</text>
      <text x="14" y="48" class="mono" fill="#cbd5e1">runs-on:</text>
      <text x="14" y="64" class="mono" fill="#7dd3fc">  [self-hosted, linux,</text>
      <text x="14" y="80" class="mono" fill="#7dd3fc">   x64, eda-64g]</text>
      <text x="14" y="106" class="txt-sub">Queues job &amp; generates</text>
      <text x="14" y="122" class="txt-sub">single-use JIT token</text>
    </g>

    <path d="M 232 115 L 274 115" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>
    <text x="253" y="105" text-anchor="middle" class="mono" fill="#7dd3fc" font-size="9">poll</text>

    <!-- Ephemeral Runner Pool -->
    <g transform="translate(278, 42)">
      <rect x="0" y="0" width="352" height="146" class="inner" stroke="#a855f7"/>
      <text x="176" y="24" text-anchor="middle" class="txt-hdr" fill="#d8b4fe">Ephemeral Runner Pod / VM (--ephemeral)</text>
      <text x="16" y="48" class="txt-sub">1. Spins up clean pod or VM for ONE job only</text>
      <text x="16" y="66" class="txt-sub">2. Outbound HTTPS (443) only — zero open inbound ports</text>
      <text x="16" y="84" class="txt-sub">3. Executes RTL sim inside pinned EDA container</text>
      <text x="16" y="102" class="txt-sub">4. Uploads logs/waveforms, then DESTROYS pod</text>
      <text x="16" y="126" class="mono" fill="#34d399">✓ Zero stale file or secret persistence across runs</text>
    </g>

    <path d="M 630 115 L 672 115" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>
    <text x="651" y="105" text-anchor="middle" class="mono" fill="#fcd34d" font-size="9">LAN</text>

    <!-- Private Lab Resources -->
    <g transform="translate(676, 42)">
      <rect x="0" y="0" width="202" height="146" class="inner" stroke="#f59e0b"/>
      <text x="101" y="24" text-anchor="middle" class="txt-hdr" fill="#fcd34d">On-Prem Resources</text>
      <text x="14" y="50" class="mono" fill="#cbd5e1">• FlexLM License Server</text>
      <text x="14" y="70" class="mono" fill="#cbd5e1">• High-RAM / 64-core Nodes</text>
      <text x="14" y="90" class="mono" fill="#cbd5e1">• Local PDK / Artifactory</text>
      <text x="14" y="110" class="mono" fill="#cbd5e1">• HIL FPGA / JTAG Boards</text>
      <text x="14" y="132" class="txt-sub">Reachable via internal VPC</text>
    </g>
  </g>

  <!-- Bottom Section: Hardware / RTL CI Pipeline -->
  <g transform="translate(32, 302)">
    <rect x="0" y="0" width="896" height="214" class="panel" stroke="#34d399"/>
    <text x="18" y="24" class="txt-hdr" fill="#34d399">2. Hardware / RTL &amp; Verification CI Pipeline</text>
    <text x="878" y="24" text-anchor="end" class="mono" fill="#6ee7b7">Triggered on RTL/TB PRs (paths: ['rtl/**', 'tb/**'])</text>

    <!-- Stage 1 -->
    <g transform="translate(18, 44)">
      <rect x="0" y="0" width="186" height="106" class="inner" stroke="#38bdf8"/>
      <text x="93" y="22" text-anchor="middle" class="mono" fill="#38bdf8">1. RTL LINT &amp; FORMAT</text>
      <text x="12" y="44" class="mono" fill="#cbd5e1">verible-verilog-lint</text>
      <text x="12" y="62" class="mono" fill="#cbd5e1">verilator --lint-only</text>
      <text x="12" y="80" class="mono" fill="#7dd3fc">  -Wall --Werror-WIDTH</text>
      <text x="12" y="96" class="txt-sub">Fails fast on latches/width</text>
    </g>
    <path d="M 204 97 L 234 97" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

    <!-- Stage 2 -->
    <g transform="translate(238, 44)">
      <rect x="0" y="0" width="210" height="106" class="inner" stroke="#34d399"/>
      <text x="105" y="22" text-anchor="middle" class="mono" fill="#34d399">2. SIMULATION MATRIX</text>
      <text x="12" y="44" class="mono" fill="#cbd5e1">Verilator C++ TB + SVA</text>
      <text x="12" y="62" class="mono" fill="#cbd5e1">cocotb + pytest (sharded)</text>
      <text x="12" y="80" class="mono" fill="#6ee7b7">Icarus / Questa / VCS</text>
      <text x="12" y="96" class="txt-sub">Randomized seeds logged</text>
    </g>
    <path d="M 448 97 L 478 97" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

    <!-- Stage 3 -->
    <g transform="translate(482, 44)">
      <rect x="0" y="0" width="194" height="106" class="inner" stroke="#f59e0b"/>
      <text x="97" y="22" text-anchor="middle" class="mono" fill="#fcd34d">3. SYNTH &amp; FORMAL</text>
      <text x="12" y="44" class="mono" fill="#cbd5e1">yosys -p "synth ..." </text>
      <text x="12" y="62" class="mono" fill="#cbd5e1">sby -f props.sby (BMC)</text>
      <text x="12" y="80" class="mono" fill="#fcd34d">Vivado batch / CDC check</text>
      <text x="12" y="96" class="txt-sub">Verifies synthesizability</text>
    </g>
    <path d="M 676 97 L 706 97" class="edge" stroke="#a855f7" marker-end="url(#arr-purple)"/>

    <!-- Stage 4 -->
    <g transform="translate(710, 44)">
      <rect x="0" y="0" width="168" height="106" class="inner" stroke="#a855f7"/>
      <text x="84" y="22" text-anchor="middle" class="mono" fill="#d8b4fe">4. TRIAGE &amp; GATE</text>
      <text x="12" y="44" class="mono" fill="#cbd5e1">if: failure():</text>
      <text x="12" y="62" class="mono" fill="#fda4af">  upload *.fst / logs</text>
      <text x="12" y="80" class="mono" fill="#6ee7b7">Coverage -&gt; Step Summary</text>
      <text x="12" y="96" class="txt-sub">PR status check passes</text>
    </g>

    <rect x="18" y="162" width="860" height="38" class="inner" stroke="#334155"/>
    <text x="448" y="185" text-anchor="middle" class="txt-sub" fill="#cbd5e1">Tip: Run lightweight Verilator lint &amp; unit tests on GitHub-hosted runners; route heavy commercial EDA / licensed sims to ephemeral self-hosted runners.</text>
  </g>
</svg>
