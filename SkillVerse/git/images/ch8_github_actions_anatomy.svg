<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .box { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.5; rx: 8px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Anatomy of GitHub Actions</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Hierarchy from repository Event to Workflows, Jobs, ephemeral Runners, and sequential Steps</text>

  <!-- 1. Event (Left) -->
  <g transform="translate(32, 195)">
    <rect x="0" y="0" width="160" height="145" class="box" stroke="#f59e0b" fill="#18140d"/>
    <text x="80" y="26" text-anchor="middle" class="mono" fill="#f59e0b">EVENT</text>
    <text x="80" y="48" text-anchor="middle" class="txt-hdr">Trigger Activity</text>
    <text x="16" y="72" class="mono" fill="#fcd34d">• push</text>
    <text x="16" y="90" class="mono" fill="#fcd34d">• pull_request</text>
    <text x="16" y="108" class="mono" fill="#fcd34d">• workflow_dispatch</text>
    <text x="16" y="126" class="mono" fill="#fcd34d">• schedule / release</text>
  </g>

  <path d="M 192 268 L 228 268" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>

  <!-- 2. Workflow Container -->
  <g transform="translate(232, 78)">
    <rect x="0" y="0" width="696" height="430" class="box" stroke="#38bdf8"/>
    <text x="20" y="28" class="mono" fill="#38bdf8">WORKFLOW — .github/workflows/ci.yml</text>
    <text x="676" y="28" text-anchor="end" class="txt-sub">Automated YAML process triggered by matching events</text>

    <!-- Job 1 (Parallel) -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="318" height="186" class="inner" stroke="#34d399"/>
      <text x="14" y="24" class="mono" fill="#34d399">JOB 1: lint</text>
      <text x="304" y="24" text-anchor="end" class="mono" fill="#6ee7b7">runs-on: ubuntu-latest</text>

      <!-- Runner pill -->
      <rect x="14" y="34" width="290" height="24" rx="4" fill="#0f2922" stroke="#34d399" stroke-width="1"/>
      <text x="159" y="50" text-anchor="middle" class="txt-sub" fill="#a7f3d0">Fresh Ephemeral Linux VM (4 vCPU, 16 GB RAM)</text>

      <!-- Steps inside Job 1 -->
      <rect x="14" y="68" width="290" height="32" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="88" class="mono" fill="#cbd5e1">Step 1  uses: actions/checkout@v4</text>

      <rect x="14" y="106" width="290" height="32" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="126" class="mono" fill="#cbd5e1">Step 2  run: ./scripts/lint.sh</text>

      <rect x="14" y="144" width="290" height="30" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="163" class="mono" fill="#94a3b8">Step 3  run: check-formatting</text>
    </g>

    <!-- Job 2 (Parallel) -->
    <g transform="translate(20, 252)">
      <rect x="0" y="0" width="318" height="158" class="inner" stroke="#34d399"/>
      <text x="14" y="24" class="mono" fill="#34d399">JOB 2: test</text>
      <text x="304" y="24" text-anchor="end" class="mono" fill="#6ee7b7">runs-on: ubuntu-latest</text>

      <rect x="14" y="34" width="290" height="24" rx="4" fill="#0f2922" stroke="#34d399" stroke-width="1"/>
      <text x="159" y="50" text-anchor="middle" class="txt-sub" fill="#a7f3d0">Separate VM — Runs in Parallel with Job 1</text>

      <rect x="14" y="68" width="290" height="34" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="89" class="mono" fill="#cbd5e1">Step 1  uses: actions/checkout@v4</text>

      <rect x="14" y="110" width="290" height="34" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="131" class="mono" fill="#cbd5e1">Step 2  run: pytest &amp;&amp; upload-artifact</text>
    </g>

    <!-- Dependency Arrows -->
    <path d="M 338 140 C 362 140, 355 210, 382 210" class="edge" stroke="#a855f7" marker-end="url(#arr-purple)"/>
    <path d="M 338 330 C 362 330, 355 250, 382 250" class="edge" stroke="#a855f7" marker-end="url(#arr-purple)"/>

    <!-- Job 3 (Dependent) -->
    <g transform="translate(386, 102)">
      <rect x="0" y="0" width="290" height="270" class="inner" stroke="#a855f7"/>
      <text x="14" y="24" class="mono" fill="#d8b4fe">JOB 3: package</text>
      <text x="276" y="24" text-anchor="end" class="mono" fill="#a855f7">needs: [lint, test]</text>

      <rect x="14" y="34" width="262" height="26" rx="4" fill="#1e102f" stroke="#a855f7" stroke-width="1"/>
      <text x="145" y="51" text-anchor="middle" class="txt-sub" fill="#e9d5ff">Waits until lint &amp; test both succeed</text>

      <rect x="14" y="72" width="262" height="36" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="94" class="mono" fill="#cbd5e1">Step 1  download-artifact@v4</text>

      <rect x="14" y="116" width="262" height="36" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="138" class="mono" fill="#cbd5e1">Step 2  build &amp; sign image</text>

      <rect x="14" y="160" width="262" height="36" rx="5" fill="#131d33" stroke="#334155"/>
      <text x="24" y="182" class="mono" fill="#cbd5e1">Step 3  push to ghcr.io</text>

      <!-- Legend note -->
      <rect x="14" y="208" width="262" height="48" rx="6" fill="#080c14" stroke="#334155"/>
      <text x="24" y="227" class="txt-sub" fill="#cbd5e1">Steps share filesystem &amp; workspace</text>
      <text x="24" y="244" class="txt-sub" fill="#94a3b8">Jobs are isolated VMs (no shared disk)</text>
    </g>
  </g>
</svg>
