<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stage-card { fill: #0f172a; stroke-width: 1.8; rx: 8; }
      .stage-num { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 700; font-size: 13px; }
      .stage-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      .cmd-box { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 5; }
      .cmd-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .meta-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #94a3b8; }
      .flow-arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" class="title">Repository Lifecycle: From Local Initialization to Remote Sync</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Step-by-step pipeline creating a repository, staging content, sealing commits, and linking remotes</text>

  <!-- Stage 1: Init -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="160" height="230" class="stage-card" style="stroke: #f59e0b; fill: #0f172a;"/>
    <rect x="12" y="12" width="28" height="22" rx="4" fill="#78350f"/>
    <text x="26" y="27" text-anchor="middle" class="stage-num" style="fill: #fcd34d;">01</text>
    <text x="50" y="28" class="stage-title">Initialize</text>

    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="140" height="32" class="cmd-box"/>
      <text x="8" y="20" class="cmd-txt" style="fill: #fbbf24;">git init</text>
    </g>

    <text x="12" y="105" class="desc-txt">• Creates .git folder</text>
    <text x="12" y="125" class="meta-txt">Scaffolds HEAD, config,</text>
    <text x="12" y="140" class="meta-txt">hooks/ and objects/</text>
    <text x="12" y="165" class="desc-txt">• Default branch set</text>
    <text x="12" y="180" class="meta-txt">(main or master)</text>
    <text x="12" y="205" class="desc-txt">• Repository empty</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 200 200 L 220 200" class="flow-arrow" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Authoring & Staging -->
  <g transform="translate(225, 85)">
    <rect x="0" y="0" width="160" height="230" class="stage-card" style="stroke: #38bdf8; fill: #0f172a;"/>
    <rect x="12" y="12" width="28" height="22" rx="4" fill="#0c4a6e"/>
    <text x="26" y="27" text-anchor="middle" class="stage-num" style="fill: #7dd3fc;">02</text>
    <text x="50" y="28" class="stage-title">Stage Files</text>

    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="140" height="32" class="cmd-box"/>
      <text x="8" y="20" class="cmd-txt" style="fill: #38bdf8;">git add .</text>
    </g>

    <text x="12" y="105" class="desc-txt">• Writes blob objects</text>
    <text x="12" y="125" class="meta-txt">Hashes file content into</text>
    <text x="12" y="140" class="meta-txt">SHA-1 / SHA-256 keys</text>
    <text x="12" y="165" class="desc-txt">• Updates .git/index</text>
    <text x="12" y="180" class="meta-txt">Builds the staged tree</text>
    <text x="12" y="205" class="desc-txt">• Ready for commit</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 385 200 L 405 200" class="flow-arrow" marker-end="url(#arr-gray)"/>

  <!-- Stage 3: Initial Commit -->
  <g transform="translate(410, 85)">
    <rect x="0" y="0" width="160" height="230" class="stage-card" style="stroke: #34d399; fill: #0f172a;"/>
    <rect x="12" y="12" width="28" height="22" rx="4" fill="#064e3b"/>
    <text x="26" y="27" text-anchor="middle" class="stage-num" style="fill: #6ee7b7;">03</text>
    <text x="50" y="28" class="stage-title">First Commit</text>

    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="140" height="32" class="cmd-box"/>
      <text x="8" y="20" class="cmd-txt" style="fill: #34d399; font-size:10px;">git commit -m "..."</text>
    </g>

    <text x="12" y="105" class="desc-txt">• Freezes snapshot</text>
    <text x="12" y="125" class="meta-txt">Generates root tree and</text>
    <text x="12" y="140" class="meta-txt">commit object metadata</text>
    <text x="12" y="165" class="desc-txt">• Moves branch ref</text>
    <text x="12" y="180" class="meta-txt">refs/heads/main now</text>
    <text x="12" y="195" class="meta-txt">points to this commit</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 570 200 L 590 200" class="flow-arrow" marker-end="url(#arr-gray)"/>

  <!-- Stage 4: Remote Association -->
  <g transform="translate(595, 85)">
    <rect x="0" y="0" width="160" height="230" class="stage-card" style="stroke: #a855f7; fill: #0f172a;"/>
    <rect x="12" y="12" width="28" height="22" rx="4" fill="#581c87"/>
    <text x="26" y="27" text-anchor="middle" class="stage-num" style="fill: #d8b4fe;">04</text>
    <text x="50" y="28" class="stage-title">Link Remote</text>

    <g transform="translate(10, 48)">
      <rect x="0" y="0" width="140" height="32" class="cmd-box"/>
      <text x="6" y="20" class="cmd-txt" style="fill: #a855f7; font-size:10px;">remote add origin</text>
    </g>

    <text x="12" y="105" class="desc-txt">• Updates .git/config</text>
    <text x="12" y="125" class="meta-txt">Defines remote 'origin'</text>
    <text x="12" y="140" class="meta-txt">with HTTPS or SSH URL</text>
    <text x="12" y="165" class="desc-txt">• Configures fetch ref</text>
    <text x="12" y="180" class="meta-txt">+refs/heads/*:</text>
    <text x="12" y="195" class="meta-txt">refs/remotes/origin/*</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 755 200 L 775 200" class="flow-arrow" marker-end="url(#arr-gray)"/>

  <!-- Stage 5: Push Upstream -->
  <g transform="translate(780, 85)">
    <rect x="0" y="0" width="140" height="230" class="stage-card" style="stroke: #ec4899; fill: #0f172a;"/>
    <rect x="12" y="12" width="28" height="22" rx="4" fill="#831843"/>
    <text x="26" y="27" text-anchor="middle" class="stage-num" style="fill: #f472b6;">05</text>
    <text x="50" y="28" class="stage-title">Push -u</text>

    <g transform="translate(8, 48)">
      <rect x="0" y="0" width="124" height="32" class="cmd-box"/>
      <text x="5" y="20" class="cmd-txt" style="fill: #ec4899; font-size:10px;">push -u origin</text>
    </g>

    <text x="10" y="105" class="desc-txt">• Uploads objects</text>
    <text x="10" y="125" class="meta-txt">Transfers packfile to</text>
    <text x="10" y="140" class="meta-txt">remote hosting server</text>
    <text x="10" y="165" class="desc-txt">• Sets upstream</text>
    <text x="10" y="180" class="meta-txt">Future git pull / push</text>
    <text x="10" y="195" class="meta-txt">require no extra args</text>
  </g>

  <!-- Pro-Tip Summary Box at Bottom (y=340) -->
  <g transform="translate(40, 335)">
    <rect x="0" y="0" width="880" height="115" class="stage-card" style="stroke: #334155; fill: #0b1120;"/>
    <text x="20" y="26" class="stage-title" style="fill: #38bdf8; font-size:14px;">Anatomy of the Generated .git Directory</text>
    
    <g transform="translate(20, 42)">
      <text x="0" y="16" class="cmd-txt" style="fill: #fbbf24;">.git/HEAD</text>
      <text x="120" y="16" class="desc-txt">: Symref pointing to active branch (ref: refs/heads/main)</text>

      <text x="0" y="38" class="cmd-txt" style="fill: #38bdf8;">.git/config</text>
      <text x="120" y="38" class="desc-txt">: Repository-specific configuration, branch tracking, and remote URLs</text>

      <text x="0" y="60" class="cmd-txt" style="fill: #34d399;">.git/objects/</text>
      <text x="120" y="60" class="desc-txt">: Content-addressable object store containing compressed blobs, trees, commits, tags</text>
    </g>
  </g>
</svg>
