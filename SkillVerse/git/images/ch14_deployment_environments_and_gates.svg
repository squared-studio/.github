<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .panel { fill: #0f172a; stroke-width: 1.8; rx: 10px; }
      .inner { fill: #0b1120; stroke-width: 1.3; rx: 6px; }
      .txt-hdr { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
      .txt-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 600; }
      .edge { stroke-width: 2; fill: none; }
    </style>
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="520" class="bg" rx="14"/>
  <text x="480" y="32" text-anchor="middle" class="title">Multi-Environment Promotion Pipeline &amp; Protection Gates</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Build-once-deploy-many artifact promotion across GitHub Environments with approval &amp; branch policies</text>

  <!-- Stage 1: Build Once -->
  <g transform="translate(28, 92)">
    <rect x="0" y="0" width="184" height="254" class="panel" stroke="#38bdf8"/>
    <text x="92" y="26" text-anchor="middle" class="mono" fill="#38bdf8">1. BUILD &amp; ATTEST</text>
    <text x="92" y="44" text-anchor="middle" class="txt-sub">Build immutable artifact once</text>

    <rect x="14" y="62" width="156" height="86" class="inner" stroke="#38bdf8"/>
    <text x="24" y="82" class="mono" fill="#7dd3fc">• Compile &amp; test</text>
    <text x="24" y="100" class="mono" fill="#7dd3fc">• Push digest@sha256</text>
    <text x="24" y="118" class="mono" fill="#7dd3fc">• Sign SLSA attestation</text>
    <text x="24" y="136" class="mono" fill="#34d399">• Outputs: digest</text>

    <rect x="14" y="164" width="156" height="74" class="inner" stroke="#334155"/>
    <text x="24" y="184" class="txt-hdr" font-size="11.5" fill="#cbd5e1">Never Rebuild!</text>
    <text x="24" y="202" class="txt-sub">Staging &amp; Prod deploy</text>
    <text x="24" y="218" class="txt-sub">the exact tested digest.</text>
  </g>

  <path d="M 212 218 L 240 218" class="edge" stroke="#38bdf8" marker-end="url(#arr-cyan)"/>

  <!-- Stage 2: Dev -->
  <g transform="translate(244, 92)">
    <rect x="0" y="0" width="184" height="254" class="panel" stroke="#34d399"/>
    <text x="92" y="26" text-anchor="middle" class="mono" fill="#34d399">2. ENVIRONMENT: dev</text>
    <text x="92" y="44" text-anchor="middle" class="txt-sub">Auto-deploy on main push</text>

    <rect x="14" y="62" width="156" height="86" class="inner" stroke="#34d399"/>
    <text x="24" y="82" class="mono" fill="#6ee7b7">environment: dev</text>
    <text x="24" y="100" class="mono" fill="#cbd5e1">url: dev.app.io</text>
    <text x="24" y="118" class="mono" fill="#cbd5e1">OIDC role: dev-deploy</text>
    <text x="24" y="136" class="mono" fill="#34d399">No manual gate</text>

    <rect x="14" y="164" width="156" height="74" class="inner" stroke="#334155"/>
    <text x="24" y="184" class="txt-hdr" font-size="11.5" fill="#cbd5e1">Dev Verification</text>
    <text x="24" y="202" class="txt-sub">Health check +</text>
    <text x="24" y="218" class="txt-sub">integration smoke suite</text>
  </g>

  <path d="M 428 218 L 456 218" class="edge" stroke="#f59e0b" marker-end="url(#arr-amber)"/>

  <!-- Stage 3: Staging -->
  <g transform="translate(460, 92)">
    <rect x="0" y="0" width="206" height="254" class="panel" stroke="#f59e0b"/>
    <text x="103" y="26" text-anchor="middle" class="mono" fill="#fcd34d">3. ENVIRONMENT: staging</text>
    <text x="103" y="44" text-anchor="middle" class="txt-sub">Branch policy + E2E validation</text>

    <rect x="14" y="62" width="178" height="86" class="inner" stroke="#f59e0b"/>
    <text x="24" y="82" class="mono" fill="#fcd34d">environment: staging</text>
    <text x="24" y="100" class="mono" fill="#cbd5e1">Allowed: main / release/*</text>
    <text x="24" y="118" class="mono" fill="#cbd5e1">OIDC role: stage-deploy</text>
    <text x="24" y="136" class="mono" fill="#f59e0b">Scoped staging secrets</text>

    <rect x="14" y="164" width="178" height="74" class="inner" stroke="#334155"/>
    <text x="24" y="184" class="txt-hdr" font-size="11.5" fill="#cbd5e1">Pre-Prod Validation</text>
    <text x="24" y="202" class="txt-sub">Load tests, DB migrations</text>
    <text x="24" y="218" class="txt-sub">dry-run &amp; soak timer</text>
  </g>

  <path d="M 666 218 L 694 218" class="edge" stroke="#34d399" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Production -->
  <g transform="translate(698, 92)">
    <rect x="0" y="0" width="234" height="254" class="panel" stroke="#a855f7"/>
    <text x="117" y="26" text-anchor="middle" class="mono" fill="#d8b4fe">4. ENVIRONMENT: production</text>
    <text x="117" y="44" text-anchor="middle" class="txt-sub">Protected release &amp; canary</text>

    <rect x="14" y="62" width="206" height="94" class="inner" stroke="#f43f5e" fill="#1e1018"/>
    <text x="24" y="82" class="mono" fill="#fda4af">Protection Rules (Before Job):</text>
    <text x="24" y="100" class="mono" fill="#cbd5e1">✓ Required Reviewers (1-6)</text>
    <text x="24" y="118" class="mono" fill="#cbd5e1">✓ Wait Timer (optional soak)</text>
    <text x="24" y="136" class="mono" fill="#cbd5e1">✓ Main branch / SemVer tag</text>

    <rect x="14" y="168" width="206" height="70" class="inner" stroke="#34d399"/>
    <text x="24" y="188" class="mono" fill="#6ee7b7">Canary / Blue-Green Rollout</text>
    <text x="24" y="206" class="txt-sub">SLO health probe -&gt; promote or</text>
    <text x="24" y="222" class="txt-sub">instant rollback to prior digest</text>
  </g>

  <!-- Bottom Concurrency & Rollback Strip -->
  <g transform="translate(28, 368)">
    <rect x="0" y="0" width="904" height="126" class="panel" stroke="#38bdf8" fill="#0d1726"/>
    <text x="20" y="26" class="txt-hdr" fill="#38bdf8">Environment Isolation &amp; Safe Deployment Guarantees</text>
    <text x="20" y="50" class="mono" fill="#fcd34d">1. Environment Secrets Isolation:</text>
    <text x="260" y="50" class="txt-sub">Production OIDC role &amp; secrets remain completely unreachable until Required Reviewers approve.</text>
    <text x="20" y="72" class="mono" fill="#6ee7b7">2. Serialized Concurrency Queue:</text>
    <text x="260" y="72" class="txt-sub">Use concurrency: { group: deploy-production, cancel-in-progress: false } so live deploys never abort mid-flight.</text>
    <text x="20" y="94" class="mono" fill="#d8b4fe">3. Deployment History &amp; Rollback:</text>
    <text x="260" y="94" class="txt-sub">GitHub Deployments logs every release URL, commit SHA, approver identity, and enables fast re-deploy of N-1.</text>
  </g>
</svg>
