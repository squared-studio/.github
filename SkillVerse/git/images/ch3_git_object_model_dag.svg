<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .obj-card { fill: #0f172a; stroke-width: 1.8; rx: 8; }
      .txt-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 13px; }
      .txt-sha { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; }
      .txt-field { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #94a3b8; }
      .txt-val { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; fill: #cbd5e1; }
      .edge-ptr { stroke: #38bdf8; stroke-width: 1.6; fill: none; }
      .edge-parent { stroke: #f43f5e; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
      .edge-tree { stroke: #34d399; stroke-width: 1.6; fill: none; }
      .edge-blob { stroke: #f59e0b; stroke-width: 1.6; fill: none; }
      .edge-tag { stroke: #ec4899; stroke-width: 1.6; fill: none; }
    </style>
    <marker id="arr-ptr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-parent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-tree" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arr-blob" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arr-tag" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" rx="14"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" class="title">The Git Object Model: Directed Acyclic Graph (DAG)</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Content-addressed storage: Commits, Trees, Blobs, and Annotated Tags linked by cryptographic hashes</text>

  <!-- Tag Object (x=40, y=80, w=170, h=110) -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="170" height="110" class="obj-card" style="stroke: #ec4899; fill: #1c111e;"/>
    <text x="12" y="22" class="txt-title" style="fill: #ec4899;">TAG OBJECT</text>
    <text x="12" y="38" class="txt-sha" style="fill: #f472b6;">sha: 9f14d2...</text>
    <text x="12" y="56" class="txt-field">object: <tspan class="txt-val" style="fill:#38bdf8;">e4a71b (commit)</tspan></text>
    <text x="12" y="72" class="txt-field">type: <tspan class="txt-val">commit</tspan></text>
    <text x="12" y="88" class="txt-field">tag: <tspan class="txt-val">v1.0.0</tspan></text>
    <text x="12" y="102" class="txt-field">tagger: <tspan class="txt-val">Alice &lt;a@dev&gt;</tspan></text>
  </g>

  <!-- Arrow Tag -> Commit 2 -->
  <path d="M 210 135 L 255 135" class="edge-tag" marker-end="url(#arr-tag)"/>

  <!-- Commit 1 (Parent) (x=260, y=280, w=210, h=130) -->
  <g transform="translate(260, 280)">
    <rect x="0" y="0" width="210" height="130" class="obj-card" style="stroke: #38bdf8; fill: #0f1c30;"/>
    <text x="12" y="22" class="txt-title" style="fill: #38bdf8;">COMMIT: Parent (C1)</text>
    <text x="12" y="38" class="txt-sha" style="fill: #7dd3fc;">sha: a82c09...</text>
    <text x="12" y="56" class="txt-field">tree: <tspan class="txt-val" style="fill:#34d399;">7b10fa</tspan></text>
    <text x="12" y="72" class="txt-field">parent: <tspan class="txt-val">none (root)</tspan></text>
    <text x="12" y="88" class="txt-field">author: <tspan class="txt-val">Alice &lt;a@dev&gt;</tspan></text>
    <text x="12" y="104" class="txt-field">msg: <tspan class="txt-val" style="fill:#fcd34d;">"feat: initial setup"</tspan></text>
  </g>

  <!-- Commit 2 (Child) (x=260, y=80, w=210, h=140) -->
  <g transform="translate(260, 80)">
    <rect x="0" y="0" width="210" height="140" class="obj-card" style="stroke: #38bdf8; fill: #0f1c30;"/>
    <text x="12" y="22" class="txt-title" style="fill: #38bdf8;">COMMIT: Active (C2)</text>
    <text x="12" y="38" class="txt-sha" style="fill: #7dd3fc;">sha: e4a71b...</text>
    <text x="12" y="56" class="txt-field">tree: <tspan class="txt-val" style="fill:#34d399;">c39a04</tspan></text>
    <text x="12" y="72" class="txt-field">parent: <tspan class="txt-val" style="fill:#f43f5e;">a82c09 (C1)</tspan></text>
    <text x="12" y="88" class="txt-field">author: <tspan class="txt-val">Alice &lt;a@dev&gt;</tspan></text>
    <text x="12" y="104" class="txt-field">committer: <tspan class="txt-val">Alice &lt;a@dev&gt;</tspan></text>
    <text x="12" y="122" class="txt-field">msg: <tspan class="txt-val" style="fill:#fcd34d;">"feat: add auth service"</tspan></text>
  </g>

  <!-- Arrow Child -> Parent (Commit 2 -> Commit 1) -->
  <path d="M 365 220 L 365 272" class="edge-parent" marker-end="url(#arr-parent)"/>
  <rect x="375" y="235" width="68" height="20" rx="3" fill="#240c14" stroke="#f43f5e" stroke-width="1"/>
  <text x="409" y="249" text-anchor="middle" class="txt-sha" style="fill:#f43f5e; font-size:9px;">parent ptr</text>

  <!-- Arrow Commit 2 -> Root Tree (c39a04) -->
  <path d="M 470 135 L 515 135" class="edge-tree" marker-end="url(#arr-tree)"/>

  <!-- Root Tree (x=520, y=80, w=190, h=140) -->
  <g transform="translate(520, 80)">
    <rect x="0" y="0" width="190" height="140" class="obj-card" style="stroke: #34d399; fill: #0d2320;"/>
    <text x="12" y="22" class="txt-title" style="fill: #34d399;">ROOT TREE (Directory)</text>
    <text x="12" y="38" class="txt-sha" style="fill: #6ee7b7;">sha: c39a04...</text>
    <text x="12" y="58" class="txt-field">100644 blob <tspan class="txt-val" style="fill:#fbbf24;">4d812f</tspan> README</text>
    <text x="12" y="78" class="txt-field">040000 tree <tspan class="txt-val" style="fill:#34d399;">fa192b</tspan> src/</text>
    <text x="12" y="98" class="txt-field">100644 blob <tspan class="txt-val" style="fill:#fbbf24;">18b6ee</tspan> .gitignore</text>
    <text x="12" y="122" class="txt-field" style="fill:#6ee7b7; font-size:9px;">• Stores filenames &amp; modes</text>
  </g>

  <!-- Subtree src/ (x=520, y=260, w=190, h=110) -->
  <g transform="translate(520, 260)">
    <rect x="0" y="0" width="190" height="110" class="obj-card" style="stroke: #34d399; fill: #0d2320;"/>
    <text x="12" y="22" class="txt-title" style="fill: #34d399;">SUBTREE: src/</text>
    <text x="12" y="38" class="txt-sha" style="fill: #6ee7b7;">sha: fa192b...</text>
    <text x="12" y="58" class="txt-field">100644 blob <tspan class="txt-val" style="fill:#fbbf24;">5a02e1</tspan> main.py</text>
    <text x="12" y="78" class="txt-field">100644 blob <tspan class="txt-val" style="fill:#fbbf24;">99c3df</tspan> auth.py</text>
    <text x="12" y="98" class="txt-field" style="fill:#6ee7b7; font-size:9px;">• Hierarchical folder structure</text>
  </g>

  <!-- Arrow Root Tree -> Subtree src/ -->
  <path d="M 615 220 L 615 252" class="edge-tree" marker-end="url(#arr-tree)"/>

  <!-- Arrow Root Tree -> Blob README.md -->
  <path d="M 710 115 L 755 115" class="edge-blob" marker-end="url(#arr-blob)"/>

  <!-- Arrow Subtree -> Blob auth.py -->
  <path d="M 710 310 L 755 310" class="edge-blob" marker-end="url(#arr-blob)"/>

  <!-- Blobs Column (x=760) -->
  <!-- Blob 1: README.md -->
  <g transform="translate(760, 80)">
    <rect x="0" y="0" width="160" height="90" class="obj-card" style="stroke: #f59e0b; fill: #1c1810;"/>
    <text x="12" y="22" class="txt-title" style="fill: #f59e0b;">BLOB: README.md</text>
    <text x="12" y="38" class="txt-sha" style="fill: #fcd34d;">sha: 4d812f...</text>
    <text x="12" y="58" class="txt-field" style="fill:#cbd5e1;">"# Project Hub"</text>
    <text x="12" y="74" class="txt-field" style="fill:#94a3b8; font-size:9px;">Pure file payload (no name)</text>
  </g>

  <!-- Blob 2: auth.py -->
  <g transform="translate(760, 260)">
    <rect x="0" y="0" width="160" height="100" class="obj-card" style="stroke: #f59e0b; fill: #1c1810;"/>
    <text x="12" y="22" class="txt-title" style="fill: #f59e0b;">BLOB: auth.py</text>
    <text x="12" y="38" class="txt-sha" style="fill: #fcd34d;">sha: 99c3df...</text>
    <text x="12" y="58" class="txt-field" style="fill:#cbd5e1;">"def login(): ..."</text>
    <text x="12" y="74" class="txt-field" style="fill:#cbd5e1;">"    verify_token()"</text>
    <text x="12" y="90" class="txt-field" style="fill:#94a3b8; font-size:9px;">Zlib compressed content</text>
  </g>

  <!-- Bottom Bar: Cryptographic Immutability -->
  <g transform="translate(40, 430)">
    <rect x="0" y="0" width="880" height="65" class="obj-card" style="stroke: #334155; fill: #0b1120;"/>
    <text x="20" y="24" class="txt-title" style="fill: #38bdf8;">The Merkle Tree Integrity Guarantee:</text>
    <text x="20" y="46" class="txt-val" style="fill: #cbd5e1;">Modifying a single byte in any Blob changes its SHA hash &#8594; triggers a new Tree SHA &#8594; triggers a new Commit SHA.</text>
    <text x="20" y="58" class="txt-field" style="fill: #94a3b8;">History in Git cannot be silently altered without invalidating all subsequent descendants in the DAG.</text>
  </g>
</svg>
