<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .byte-cell { stroke: #38bdf8; stroke-width: 1.8; rx: 4; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Memory Byte Ordering: Little-Endian vs Big-Endian Architectures</text>

  <!-- Number representation banner -->
  <g transform="translate(260, 55)">
    <rect width="440" height="45" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
    <text x="220" y="28" text-anchor="middle" class="code-txt" fill="#fbbf24" style="font-size:15px;">32-Bit Hex Value: 0x12345678</text>
  </g>

  <!-- Left: Little-Endian -->
  <g transform="translate(45, 120)">
    <rect width="420" height="295" class="card"/>
    <text x="20" y="28" class="sec-title" style="fill:#34d399;">Little-Endian (x86, ARM Cortex-M, RISC-V)</text>
    <text x="20" y="48" class="sublabel">Least Significant Byte (LSB) stored at LOWEST address:</text>

    <!-- Byte sequence -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="85" height="50" class="byte-cell" fill="#34d399" fill-opacity="0.25"/>
      <text x="42" y="26" text-anchor="middle" class="code-txt" fill="#34d399">0x78 (LSB)</text>
      <text x="42" y="42" text-anchor="middle" class="sublabel">@ 0x1000</text>

      <rect x="90" y="0" width="85" height="50" class="byte-cell" fill="#38bdf8" fill-opacity="0.25"/>
      <text x="132" y="26" text-anchor="middle" class="code-txt">0x56</text>
      <text x="132" y="42" text-anchor="middle" class="sublabel">@ 0x1001</text>

      <rect x="180" y="0" width="85" height="50" class="byte-cell" fill="#fbbf24" fill-opacity="0.25"/>
      <text x="222" y="26" text-anchor="middle" class="code-txt">0x34</text>
      <text x="222" y="42" text-anchor="middle" class="sublabel">@ 0x1002</text>

      <rect x="270" y="0" width="85" height="50" class="byte-cell" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="312" y="26" text-anchor="middle" class="code-txt" fill="#f43f5e">0x12 (MSB)</text>
      <text x="312" y="42" text-anchor="middle" class="sublabel">@ 0x1003</text>
    </g>

    <rect x="15" y="145" width="390" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="170" class="label" font-weight="bold">Little-Endian Hardware Advantage:</text>
    <text x="25" y="192" class="sublabel">• Casting 32-bit int* to 8-bit char* references</text>
    <text x="25" y="208" class="sublabel">  the identical memory address (&amp;x == &amp;x_lsb).</text>
    <text x="25" y="228" class="sublabel">• Dominates 99% of personal computing &amp; microcontrollers.</text>
  </g>

  <!-- Right: Big-Endian -->
  <g transform="translate(495, 120)">
    <rect width="420" height="295" class="card"/>
    <text x="20" y="28" class="sec-title" style="fill:#38bdf8;">Big-Endian (Network Byte Order, TCP/IP)</text>
    <text x="20" y="48" class="sublabel">Most Significant Byte (MSB) stored at LOWEST address:</text>

    <!-- Byte sequence -->
    <g transform="translate(25, 65)">
      <rect x="0" y="0" width="85" height="50" class="byte-cell" fill="#f43f5e" fill-opacity="0.25"/>
      <text x="42" y="26" text-anchor="middle" class="code-txt" fill="#f43f5e">0x12 (MSB)</text>
      <text x="42" y="42" text-anchor="middle" class="sublabel">@ 0x1000</text>

      <rect x="90" y="0" width="85" height="50" class="byte-cell" fill="#fbbf24" fill-opacity="0.25"/>
      <text x="132" y="26" text-anchor="middle" class="code-txt">0x34</text>
      <text x="132" y="42" text-anchor="middle" class="sublabel">@ 0x1001</text>

      <rect x="180" y="0" width="85" height="50" class="byte-cell" fill="#38bdf8" fill-opacity="0.25"/>
      <text x="222" y="26" text-anchor="middle" class="code-txt">0x56</text>
      <text x="222" y="42" text-anchor="middle" class="sublabel">@ 0x1002</text>

      <rect x="270" y="0" width="85" height="50" class="byte-cell" fill="#34d399" fill-opacity="0.25"/>
      <text x="312" y="26" text-anchor="middle" class="code-txt" fill="#34d399">0x78 (LSB)</text>
      <text x="312" y="42" text-anchor="middle" class="sublabel">@ 0x1003</text>
    </g>

    <rect x="15" y="145" width="390" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="170" class="label" font-weight="bold">Standard Network Protocol Order:</text>
    <text x="25" y="192" class="sublabel">• Human-readable in memory dumps (left-to-right).</text>
    <text x="25" y="210" class="code-txt" fill="#38bdf8">uint32_t net = htonl(host_val);  // Host to Network</text>
    <text x="25" y="232" class="code-txt" fill="#38bdf8">uint32_t host = ntohl(net_val);  // Network to Host</text>
    <text x="25" y="254" class="sublabel">Always swap bytes when sending raw binary packets!</text>
  </g>
</svg>