<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Linear Arena / Bump Allocator for Deterministic Embedded Performance</text>

  <!-- Left: Arena Buffer Graphic -->
  <g transform="translate(45, 55)">
    <rect width="470" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">Contiguous Pre-Allocated Pool Buffer</text>

    <!-- Buffer Strip -->
    <g transform="translate(25, 50)">
      <!-- Block 1: Alloc A -->
      <rect x="0" y="0" width="100" height="60" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
      <text x="50" y="28" text-anchor="middle" class="code-txt" fill="#38bdf8">Alloc 1</text>
      <text x="50" y="46" text-anchor="middle" class="sublabel">64 Bytes</text>

      <!-- Block 2: Alloc B -->
      <rect x="100" y="0" width="120" height="60" fill="#34d399" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
      <text x="160" y="28" text-anchor="middle" class="code-txt" fill="#34d399">Alloc 2</text>
      <text x="160" y="46" text-anchor="middle" class="sublabel">128 Bytes</text>

      <!-- Free Unallocated space -->
      <rect x="220" y="0" width="200" height="60" fill="#0b1120" stroke="#1e293b" stroke-dasharray="3,3"/>
      <text x="320" y="35" text-anchor="middle" class="sublabel" style="fill:#64748b;">Remaining Free Pool Space</text>

      <!-- Bump Offset Pointer -->
      <line x1="220" y1="65" x2="220" y2="105" stroke="#fbbf24" stroke-width="2.5"/>
      <polygon points="216,70 220,60 224,70" fill="#fbbf24"/>
      <text x="220" y="125" text-anchor="middle" class="code-txt" fill="#fbbf24">arena-&gt;offset (Bump Pointer)</text>
    </g>

    <rect x="20" y="200" width="430" height="135" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="224" class="code-txt" fill="#34d399">Instant O(1) Allocation Implementation:</text>
    <text x="30" y="246" class="code-txt">void* arena_alloc(Arena *a, size_t size) {</text>
    <text x="50" y="266" class="code-txt">void *ptr = a-&gt;buffer + a-&gt;offset;</text>
    <text x="50" y="286" class="code-txt">a-&gt;offset += (size + 7) &amp; ~7; // 8B alignment</text>
    <text x="50" y="306" class="code-txt">return ptr;   // Zero overhead, no heap search!</text>
    <text x="30" y="324" class="code-txt">}</text>
  </g>

  <!-- Right: Benefits -->
  <g transform="translate(535, 55)">
    <rect width="380" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">Why Arenas Dominate Embedded &amp; Games</text>

    <rect x="15" y="42" width="350" height="300" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <g transform="translate(25, 65)">
      <text x="0" y="0" class="code-txt" fill="#38bdf8">1. Blazing O(1) Speed:</text>
      <text x="0" y="20" class="sublabel">Allocation is literally 2 CPU instructions</text>
      <text x="0" y="36" class="sublabel">(pointer add + store); 100x faster than malloc.</text>

      <line x1="0" y1="50" x2="330" y2="50" stroke="#1e293b"/>

      <text x="0" y="70" class="code-txt" fill="#34d399">2. Zero Fragmentation:</text>
      <text x="0" y="90" class="sublabel">Memory is packed strictly contiguous;</text>
      <text x="0" y="106" class="sublabel">impossible to fragment the heap.</text>

      <line x1="0" y1="120" x2="330" y2="120" stroke="#1e293b"/>

      <text x="0" y="140" class="code-txt" fill="#fbbf24">3. Instant O(1) Deallocation:</text>
      <text x="0" y="160" class="sublabel">Freeing thousands of objects takes 1 cycle:</text>
      <text x="0" y="180" class="code-txt" style="font-size:11px;">arena-&gt;offset = 0; // Wipe all allocations</text>

      <line x1="0" y1="195" x2="330" y2="195" stroke="#1e293b"/>

      <text x="0" y="215" class="code-txt" fill="#f43f5e">4. Guaranteed Cache Locality:</text>
      <text x="0" y="235" class="sublabel">Objects created together live side-by-side</text>
      <text x="0" y="251" class="sublabel">in cache lines, maximizing hardware throughput.</text>
    </g>
  </g>
</svg>