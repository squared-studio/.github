<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .mmio-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.8; rx: 4; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Embedded C Memory-Mapped I/O (MMIO) &amp; Register Struct Mapping</text>

  <!-- Left: Physical Address Map -->
  <g transform="translate(45, 55)">
    <rect width="400" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">32-Bit Microcontroller Address Map</text>

    <!-- Address bars -->
    <g transform="translate(25, 45)">
      <!-- System ROM/Flash -->
      <rect x="0" y="0" width="350" height="40" class="mmio-box" stroke="#818cf8"/>
      <text x="175" y="24" text-anchor="middle" class="code-txt" fill="#818cf8">Flash Memory (Code) @ 0x08000000</text>

      <!-- Internal SRAM -->
      <rect x="0" y="50" width="350" height="40" class="mmio-box" stroke="#34d399"/>
      <text x="175" y="74" text-anchor="middle" class="code-txt" fill="#34d399">SRAM (Variables) @ 0x20000000</text>

      <!-- Peripheral MMIO Region -->
      <rect x="0" y="100" width="350" height="130" class="mmio-box" stroke="#fbbf24" fill="#fbbf24" fill-opacity="0.1"/>
      <text x="175" y="125" text-anchor="middle" class="code-txt" fill="#fbbf24">Peripheral Region @ 0x40000000</text>
      
      <!-- Sub-peripherals -->
      <g transform="translate(15, 135)">
        <rect x="0" y="0" width="320" height="25" fill="#1e293b" stroke="#64748b"/>
        <text x="160" y="17" text-anchor="middle" class="sublabel">Timer 2 @ 0x40000000</text>
        <rect x="0" y="30" width="320" height="25" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="160" y="47" text-anchor="middle" class="code-txt" fill="#38bdf8">UART 1 @ 0x40013800</text>
        <rect x="0" y="60" width="320" height="25" fill="#1e293b" stroke="#64748b"/>
        <text x="160" y="77" text-anchor="middle" class="sublabel">GPIO Port A @ 0x48000000</text>
      </g>
    </g>

    <text x="25" y="315" class="sublabel">Hardware registers occupy fixed memory addresses;</text>
    <text x="25" y="333" class="sublabel">reading/writing addresses directly reads/writes physical pins!</text>
  </g>

  <!-- Right: C Struct Overlay -->
  <g transform="translate(475, 55)">
    <rect width="440" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">C Pointer Struct Casting Pattern (CMSIS)</text>

    <!-- Struct Definition -->
    <rect x="15" y="42" width="410" height="150" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="64" class="code-txt">typedef struct {</text>
    <text x="45" y="84" class="code-txt" fill="#f43f5e">volatile uint32_t SR;   // Offset 0x00: Status</text>
    <text x="45" y="104" class="code-txt" fill="#f43f5e">volatile uint32_t DR;   // Offset 0x04: Data</text>
    <text x="45" y="124" class="code-txt" fill="#f43f5e">volatile uint32_t BRR;  // Offset 0x08: Baud Rate</text>
    <text x="45" y="144" class="code-txt" fill="#f43f5e">volatile uint32_t CR1;  // Offset 0x0C: Control</text>
    <text x="25" y="166" class="code-txt">} UART_TypeDef;</text>

    <!-- Macro pointer cast -->
    <rect x="15" y="205" width="410" height="130" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="228" class="code-txt" fill="#fbbf24">#define UART1 ((UART_TypeDef*)0x40013800UL)</text>
    <text x="25" y="255" class="sublabel">// Transmit byte over serial wire:</text>
    <text x="25" y="275" class="code-txt">while (!(UART1-&gt;SR &amp; (1U &lt;&lt; 7))); // Wait for TXE</text>
    <text x="25" y="295" class="code-txt" fill="#34d399">UART1-&gt;DR = 'A'; // Hardware sends 'A' over TX pin!</text>
  </g>
</svg>