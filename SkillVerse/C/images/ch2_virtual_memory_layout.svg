<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
    </style>
    <marker id="arr-mem-down" viewBox="0 0 8 8" refX="4" refY="7" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 4 7 L 7 0 z" fill="#f43f5e" />
    </marker>
    <marker id="arr-mem-up" viewBox="0 0 8 8" refX="4" refY="1" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 7 L 4 0 L 7 7 z" fill="#34d399" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">Standard Virtual Memory Architecture of a Running C Process</text>

  <!-- Left: Memory Stack Graphic -->
  <g transform="translate(60, 55)">
    <!-- Address boundaries -->
    <text x="0" y="15" class="code-txt" fill="#94a3b8">0xFFFFFFFF (High Memory)</text>
    <text x="0" y="355" class="code-txt" fill="#94a3b8">0x00000000 (Low Memory)</text>

    <!-- Memory Segments Box -->
    <g transform="translate(200, 5)">
      <!-- Kernel Space -->
      <rect x="0" y="0" width="260" height="40" rx="3" fill="#334155" stroke="#475569" stroke-width="1.5"/>
      <text x="130" y="25" text-anchor="middle" class="label" font-weight="bold">Kernel Space (Protected)</text>

      <!-- User Stack (Grows Down) -->
      <rect x="0" y="44" width="260" height="65" rx="3" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.8"/>
      <text x="130" y="70" text-anchor="middle" class="code-txt" fill="#f43f5e">Stack (Local Auto Vars)</text>
      <text x="130" y="88" text-anchor="middle" class="sublabel">Grows Downward (High → Low)</text>
      <!-- Down arrow -->
      <line x1="130" y1="92" x2="130" y2="104" stroke="#f43f5e" stroke-width="2" marker-end="url(#arr-mem-down)"/>

      <!-- Unmapped / Gap -->
      <rect x="0" y="113" width="260" height="50" rx="3" fill="#0b1120" stroke="#1e293b" stroke-dasharray="3,3"/>
      <text x="130" y="142" text-anchor="middle" class="sublabel" style="font-style:italic;">Dynamic Memory Growth Gap</text>

      <!-- Heap (Grows Up) -->
      <rect x="0" y="167" width="260" height="65" rx="3" fill="#34d399" fill-opacity="0.2" stroke="#34d399" stroke-width="1.8"/>
      <!-- Up arrow -->
      <line x1="130" y1="183" x2="130" y2="171" stroke="#34d399" stroke-width="2" marker-end="url(#arr-mem-up)"/>
      <text x="130" y="200" text-anchor="middle" class="code-txt" fill="#34d399">Heap (malloc / calloc / realloc)</text>
      <text x="130" y="218" text-anchor="middle" class="sublabel">Grows Upward via brk() / mmap()</text>

      <!-- BSS Segment -->
      <rect x="0" y="236" width="260" height="35" rx="3" fill="#fbbf24" fill-opacity="0.18" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="130" y="258" text-anchor="middle" class="code-txt" fill="#fbbf24">.bss (Uninitialized Globals = 0)</text>

      <!-- Data Segment -->
      <rect x="0" y="275" width="260" height="35" rx="3" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="130" y="297" text-anchor="middle" class="code-txt" fill="#38bdf8">.data (Initialized Globals/Static)</text>

      <!-- Text / Code Segment -->
      <rect x="0" y="314" width="260" height="35" rx="3" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5"/>
      <text x="130" y="336" text-anchor="middle" class="code-txt" fill="#818cf8">.text (Machine Code Instructions)</text>
    </g>
  </g>

  <!-- Right: Explanatory Card -->
  <g transform="translate(545, 55)">
    <rect width="385" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">Segment Characteristics &amp; Lifetime</text>

    <rect x="15" y="42" width="355" height="300" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <g transform="translate(25, 65)">
      <text x="0" y="0" class="code-txt" fill="#f43f5e">Stack Segment:</text>
      <text x="0" y="18" class="sublabel">• Automatic allocation upon function entry</text>
      <text x="0" y="34" class="sublabel">• Extremely fast pointer bump (rsp)</text>
      <text x="0" y="50" class="sublabel">• Destroyed automatically on function return</text>

      <line x1="0" y1="62" x2="330" y2="62" stroke="#1e293b"/>

      <text x="0" y="80" class="code-txt" fill="#34d399">Heap Segment:</text>
      <text x="0" y="98" class="sublabel">• Manual allocation via malloc() / calloc()</text>
      <text x="0" y="114" class="sublabel">• Persists until explicitly freed via free()</text>
      <text x="0" y="130" class="sublabel">• Subject to memory leaks &amp; fragmentation</text>

      <line x1="0" y1="142" x2="330" y2="142" stroke="#1e293b"/>

      <text x="0" y="160" class="code-txt" fill="#fbbf24">.bss &amp; .data Segments:</text>
      <text x="0" y="178" class="sublabel">• Global and static variables live here</text>
      <text x="0" y="194" class="sublabel">• Lifetime equals entire process execution</text>
      <text x="0" y="210" class="sublabel">• .bss requires 0 disk space in executable file</text>

      <line x1="0" y1="222" x2="330" y2="222" stroke="#1e293b"/>

      <text x="0" y="240" class="code-txt" fill="#818cf8">.text Segment:</text>
      <text x="0" y="258" class="sublabel">• Read-only executable instructions</text>
      <text x="0" y="274" class="sublabel">• Shared across processes (fork/exec)</text>
    </g>
  </g>
</svg>