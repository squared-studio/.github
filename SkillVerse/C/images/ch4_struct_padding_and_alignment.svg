<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .byte-char { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.5; }
      .byte-int { fill: #34d399; stroke: #059669; stroke-width: 1.5; }
      .byte-dbl { fill: #818cf8; stroke: #4f46e5; stroke-width: 1.5; }
      .byte-pad { fill: #f43f5e; fill-opacity: 0.25; stroke: #f43f5e; stroke-dasharray: 2,2; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">C Struct Memory Alignment, Hardware Padding &amp; Optimization</text>

  <!-- Left: Unoptimized Struct (24 Bytes) -->
  <g transform="translate(30, 55)">
    <rect width="430" height="360" class="card"/>
    <text x="20" y="28" class="sec-title" style="fill:#f43f5e;">1. Unoptimized Struct (Wastes 11 Bytes!)</text>

    <!-- C Code Snippet -->
    <rect x="15" y="42" width="400" height="75" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="62" class="code-txt">struct BadStruct {</text>
    <text x="45" y="80" class="code-txt">char a;     // 1 byte</text>
    <text x="45" y="96" class="code-txt">int b;      // 4 bytes (must align to 4-byte boundary)</text>
    <text x="45" y="112" class="code-txt">char c;     // 1 byte</text>
    <text x="200" y="80" class="code-txt">double d;   // 8 bytes</text>
    <text x="200" y="96" class="code-txt">};  // Total: 24 Bytes!</text>

    <!-- Memory Map (3 rows of 8 bytes) -->
    <g transform="translate(20, 140)">
      <!-- Row 0 (Bytes 0-7) -->
      <text x="-5" y="18" text-anchor="end" class="sublabel">0-7:</text>
      <rect x="0" y="0" width="45" height="25" class="byte-char"/><text x="22" y="17" text-anchor="middle" class="sublabel" fill="#fff">a</text>
      <rect x="47" y="0" width="140" height="25" class="byte-pad"/><text x="117" y="17" text-anchor="middle" class="sublabel" fill="#f43f5e">3B Padding</text>
      <rect x="190" y="0" width="185" height="25" class="byte-int"/><text x="282" y="17" text-anchor="middle" class="sublabel" fill="#fff">int b (4 Bytes)</text>

      <!-- Row 1 (Bytes 8-15) -->
      <text x="-5" y="53" text-anchor="end" class="sublabel">8-15:</text>
      <rect x="0" y="35" width="45" height="25" class="byte-char"/><text x="22" y="52" text-anchor="middle" class="sublabel" fill="#fff">c</text>
      <rect x="47" y="35" width="328" height="25" class="byte-pad"/><text x="210" y="52" text-anchor="middle" class="sublabel" fill="#f43f5e">7 Bytes Padding (Align to 8B boundary!)</text>

      <!-- Row 2 (Bytes 16-23) -->
      <text x="-5" y="88" text-anchor="end" class="sublabel">16-23:</text>
      <rect x="0" y="70" width="375" height="25" class="byte-dbl"/><text x="187" y="87" text-anchor="middle" class="sublabel" fill="#fff">double d (8 Bytes)</text>
    </g>

    <!-- Size Footprint -->
    <rect x="15" y="270" width="400" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="292" class="code-txt" fill="#f43f5e">sizeof(struct BadStruct) == 24 Bytes</text>
    <text x="25" y="312" class="sublabel">Payload: 14 Bytes | Wasted Waste: 10 Bytes (42% overhead!)</text>
  </g>

  <!-- Right: Optimized Struct (16 Bytes) -->
  <g transform="translate(485, 55)">
    <rect width="445" height="360" class="card"/>
    <text x="20" y="28" class="sec-title" style="fill:#34d399;">2. Optimized Order (Reordered by Decreasing Size)</text>

    <!-- C Code Snippet -->
    <rect x="15" y="42" width="415" height="75" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="62" class="code-txt">struct GoodStruct {</text>
    <text x="45" y="80" class="code-txt">double d;   // 8 bytes (largest first)</text>
    <text x="45" y="96" class="code-txt">int b;      // 4 bytes</text>
    <text x="45" y="112" class="code-txt">char a;     // 1 byte</text>
    <text x="200" y="80" class="code-txt">char c;     // 1 byte</text>
    <text x="200" y="96" class="code-txt">};  // Total: 16 Bytes!</text>

    <!-- Memory Map (2 rows of 8 bytes) -->
    <g transform="translate(25, 140)">
      <!-- Row 0 (Bytes 0-7) -->
      <text x="-5" y="18" text-anchor="end" class="sublabel">0-7:</text>
      <rect x="0" y="0" width="375" height="25" class="byte-dbl"/><text x="187" y="17" text-anchor="middle" class="sublabel" fill="#fff">double d (8 Bytes)</text>

      <!-- Row 1 (Bytes 8-15) -->
      <text x="-5" y="53" text-anchor="end" class="sublabel">8-15:</text>
      <rect x="0" y="35" width="185" height="25" class="byte-int"/><text x="92" y="52" text-anchor="middle" class="sublabel" fill="#fff">int b (4B)</text>
      <rect x="190" y="35" width="45" height="25" class="byte-char"/><text x="212" y="52" text-anchor="middle" class="sublabel" fill="#fff">a</text>
      <rect x="238" y="35" width="45" height="25" class="byte-char"/><text x="260" y="52" text-anchor="middle" class="sublabel" fill="#fff">c</text>
      <rect x="286" y="35" width="89" height="25" class="byte-pad"/><text x="330" y="52" text-anchor="middle" class="sublabel" fill="#f43f5e">2B Pad</text>
    </g>

    <!-- Size Footprint -->
    <rect x="15" y="270" width="415" height="65" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="292" class="code-txt" fill="#34d399">sizeof(struct GoodStruct) == 16 Bytes (33% smaller!)</text>
    <text x="25" y="312" class="sublabel">Rule: Arrange struct members from largest to smallest size!</text>
  </g>
</svg>