<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .wire { stroke: #64748b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .wire-hi { stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .stage-box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 6; }
      .file-box { fill: #0f172a; stroke: #34d399; stroke-width: 1.5; rx: 4; }
    </style>
    <marker id="arr-pipe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">The 4-Stage C Compilation &amp; Build Pipeline (GCC / Clang)</text>

  <!-- Flowchart Stages -->
  <g transform="translate(30, 60)">
    <!-- Stage 1: Preprocessor -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="200" height="110" class="stage-box"/>
      <text x="100" y="26" text-anchor="middle" class="sec-title">1. Preprocessor (cpp)</text>
      <text x="100" y="48" text-anchor="middle" class="sublabel">• Strips C/C++ comments</text>
      <text x="100" y="66" text-anchor="middle" class="sublabel">• Expands #include headers</text>
      <text x="100" y="84" text-anchor="middle" class="sublabel">• Substitutes #define macros</text>
      <text x="100" y="100" text-anchor="middle" class="code-txt" style="font-size:10px;">gcc -E main.c -o main.i</text>
    </g>

    <line x1="200" y1="55" x2="245" y2="55" class="wire-hi" marker-end="url(#arr-pipe)"/>

    <!-- Stage 2: Compiler -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="200" height="110" class="stage-box"/>
      <text x="100" y="26" text-anchor="middle" class="sec-title">2. Compiler (cc1)</text>
      <text x="100" y="48" text-anchor="middle" class="sublabel">• Lexical &amp; syntax parsing</text>
      <text x="100" y="66" text-anchor="middle" class="sublabel">• Abstract Syntax Tree (AST)</text>
      <text x="100" y="84" text-anchor="middle" class="sublabel">• Optimizations (-O2, -O3)</text>
      <text x="100" y="100" text-anchor="middle" class="code-txt" style="font-size:10px;">gcc -S main.i -o main.s</text>
    </g>

    <line x1="450" y1="55" x2="495" y2="55" class="wire-hi" marker-end="url(#arr-pipe)"/>

    <!-- Stage 3: Assembler -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="190" height="110" class="stage-box"/>
      <text x="95" y="26" text-anchor="middle" class="sec-title">3. Assembler (as)</text>
      <text x="95" y="48" text-anchor="middle" class="sublabel">• Opcode mnemonic encoding</text>
      <text x="95" y="66" text-anchor="middle" class="sublabel">• Emits relocatable symbols</text>
      <text x="95" y="84" text-anchor="middle" class="sublabel">• Generates ELF object code</text>
      <text x="95" y="100" text-anchor="middle" class="code-txt" style="font-size:10px;">as main.s -o main.o</text>
    </g>

    <line x1="690" y1="55" x2="735" y2="55" class="wire-hi" marker-end="url(#arr-pipe)"/>

    <!-- Stage 4: Linker -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="165" height="110" class="stage-box"/>
      <text x="82" y="26" text-anchor="middle" class="sec-title">4. Linker (ld)</text>
      <text x="82" y="48" text-anchor="middle" class="sublabel">• Resolves extern symbols</text>
      <text x="82" y="66" text-anchor="middle" class="sublabel">• Merges static libs (.a)</text>
      <text x="82" y="84" text-anchor="middle" class="sublabel">• Links shared libs (.so)</text>
      <text x="82" y="100" text-anchor="middle" class="code-txt" style="font-size:10px;">ld -o program *.o</text>
    </g>

    <!-- Artifacts / Intermediate Files Row -->
    <g transform="translate(0, 130)">
      <!-- File 1: main.c -->
      <rect x="25" y="0" width="150" height="42" class="file-box"/>
      <text x="100" y="18" text-anchor="middle" class="code-txt">main.c</text>
      <text x="100" y="32" text-anchor="middle" class="sublabel">Raw C Source Code</text>

      <!-- File 2: main.i -->
      <rect x="275" y="0" width="150" height="42" class="file-box"/>
      <text x="350" y="18" text-anchor="middle" class="code-txt">main.i</text>
      <text x="350" y="32" text-anchor="middle" class="sublabel">Preprocessed Source</text>

      <!-- File 3: main.s -->
      <rect x="520" y="0" width="150" height="42" class="file-box"/>
      <text x="595" y="18" text-anchor="middle" class="code-txt">main.s</text>
      <text x="595" y="32" text-anchor="middle" class="sublabel">Assembly (x86/ARM/RISC-V)</text>

      <!-- File 4: main.o -->
      <rect x="745" y="0" width="155" height="42" class="file-box"/>
      <text x="822" y="18" text-anchor="middle" class="code-txt">a.out / prog.elf</text>
      <text x="822" y="32" text-anchor="middle" class="sublabel">Executable Binary Image</text>
    </g>
  </g>

  <!-- Bottom Detailed Cards: ELF Sections & Symbols -->
  <g transform="translate(30, 255)">
    <rect width="435" height="155" class="card"/>
    <text x="20" y="28" class="sec-title">ELF Object File Anatomy (.o &amp; Executable)</text>
    <rect x="15" y="42" width="405" height="98" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="65" class="code-txt" fill="#38bdf8">.text  :</text><text x="85" y="65" class="sublabel">Compiled machine code instructions (Read-Only + Execute)</text>
    <text x="25" y="85" class="code-txt" fill="#34d399">.data  :</text><text x="85" y="85" class="sublabel">Initialized global &amp; static variables (Read-Write)</text>
    <text x="25" y="105" class="code-txt" fill="#fbbf24">.bss   :</text><text x="85" y="105" class="sublabel">Uninitialized global variables (zeroed out by crt0 startup)</text>
    <text x="25" y="125" class="code-txt" fill="#f43f5e">.rodata:</text><text x="85" y="125" class="sublabel">Read-only constants &amp; literal strings (e.g. "Hello
")</text>
  </g>

  <g transform="translate(495, 255)">
    <rect width="435" height="155" class="card"/>
    <text x="20" y="28" class="sec-title">Practical Toolchain Commands</text>
    <rect x="15" y="42" width="405" height="98" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="25" y="65" class="code-txt">gcc -Wall -Wextra -O2 main.c -o app</text>
    <text x="25" y="85" class="code-txt" fill="#fbbf24">objdump -d app            # Disassemble text section</text>
    <text x="25" y="105" class="code-txt" fill="#38bdf8">readelf -S app            # Inspect ELF section headers</text>
    <text x="25" y="125" class="code-txt" fill="#34d399">nm app                    # Print symbol table (T, D, B, U)</text>
  </g>
</svg>