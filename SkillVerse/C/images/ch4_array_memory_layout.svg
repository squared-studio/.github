<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #131d33; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .sec-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      .label { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .sublabel { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-txt { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; fill: #34d399; font-weight: 600; }
      .cell-row0 { fill: #1e293b; stroke: #38bdf8; stroke-width: 1.8; }
      .cell-row1 { fill: #1e293b; stroke: #34d399; stroke-width: 1.8; }
      .cell-row2 { fill: #1e293b; stroke: #fbbf24; stroke-width: 1.8; }
    </style>
  </defs>

  <rect width="960" height="440" class="bg" rx="14"/>
  <text x="480" y="36" text-anchor="middle" class="title">2D Array Contiguous Row-Major Memory Layout in C</text>

  <!-- Left: Conceptual 2D Matrix -->
  <g transform="translate(45, 55)">
    <rect width="360" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">Conceptual 2D Matrix View: mat[3][3]</text>

    <g transform="translate(45, 60)">
      <!-- Row 0 -->
      <rect x="0" y="0" width="80" height="50" class="cell-row0"/>
      <text x="40" y="30" text-anchor="middle" class="code-txt" fill="#38bdf8">mat[0][0]</text>
      <rect x="85" y="0" width="80" height="50" class="cell-row0"/>
      <text x="125" y="30" text-anchor="middle" class="code-txt" fill="#38bdf8">mat[0][1]</text>
      <rect x="170" y="0" width="80" height="50" class="cell-row0"/>
      <text x="210" y="30" text-anchor="middle" class="code-txt" fill="#38bdf8">mat[0][2]</text>
      <text x="-25" y="30" class="label" fill="#38bdf8">Row 0</text>

      <!-- Row 1 -->
      <rect x="0" y="60" width="80" height="50" class="cell-row1"/>
      <text x="40" y="90" text-anchor="middle" class="code-txt" fill="#34d399">mat[1][0]</text>
      <rect x="85" y="60" width="80" height="50" class="cell-row1"/>
      <text x="125" y="90" text-anchor="middle" class="code-txt" fill="#34d399">mat[1][1]</text>
      <rect x="170" y="60" width="80" height="50" class="cell-row1"/>
      <text x="210" y="90" text-anchor="middle" class="code-txt" fill="#34d399">mat[1][2]</text>
      <text x="-25" y="90" class="label" fill="#34d399">Row 1</text>

      <!-- Row 2 -->
      <rect x="0" y="120" width="80" height="50" class="cell-row2"/>
      <text x="40" y="150" text-anchor="middle" class="code-txt" fill="#fbbf24">mat[2][0]</text>
      <rect x="85" y="120" width="80" height="50" class="cell-row2"/>
      <text x="125" y="150" text-anchor="middle" class="code-txt" fill="#fbbf24">mat[2][1]</text>
      <rect x="170" y="120" width="80" height="50" class="cell-row2"/>
      <text x="210" y="150" text-anchor="middle" class="code-txt" fill="#fbbf24">mat[2][2]</text>
      <text x="-25" y="150" class="label" fill="#fbbf24">Row 2</text>
    </g>

    <text x="20" y="295" class="sublabel">Programmers view multi-dimensional arrays as grids,</text>
    <text x="20" y="315" class="sublabel">but physical computer memory is strictly 1-dimensional!</text>
  </g>

  <!-- Right: Physical Linear Memory Strip -->
  <g transform="translate(425, 55)">
    <rect width="490" height="360" class="card"/>
    <text x="20" y="28" class="sec-title">Physical 1D Contiguous Memory Layout (Row-Major)</text>

    <!-- Linear Cells -->
    <g transform="translate(20, 55)">
      <!-- Row 0 elements -->
      <rect x="0" y="0" width="48" height="50" class="cell-row0"/><text x="24" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[0][0]</text>
      <rect x="50" y="0" width="48" height="50" class="cell-row0"/><text x="74" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[0][1]</text>
      <rect x="100" y="0" width="48" height="50" class="cell-row0"/><text x="124" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[0][2]</text>

      <!-- Row 1 elements -->
      <rect x="150" y="0" width="48" height="50" class="cell-row1"/><text x="174" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[1][0]</text>
      <rect x="200" y="0" width="48" height="50" class="cell-row1"/><text x="224" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[1][1]</text>
      <rect x="250" y="0" width="48" height="50" class="cell-row1"/><text x="274" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[1][2]</text>

      <!-- Row 2 elements -->
      <rect x="300" y="0" width="48" height="50" class="cell-row2"/><text x="324" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[2][0]</text>
      <rect x="350" y="0" width="48" height="50" class="cell-row2"/><text x="374" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[2][1]</text>
      <rect x="400" y="0" width="48" height="50" class="cell-row2"/><text x="424" y="30" text-anchor="middle" class="code-txt" style="font-size:10px;">[2][2]</text>
    </g>

    <!-- Address Formula Box -->
    <rect x="20" y="145" width="450" height="95" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="172" class="code-txt" fill="#38bdf8">Address(mat[i][j]) = Base + (i · COLS + j) · sizeof(T)</text>
    <text x="30" y="196" class="sublabel">• In row-major order, consecutive row elements are contiguous.</text>
    <text x="30" y="214" class="sublabel">• Nested loops iterating row-by-row maximize CPU L1/L2 cache hits!</text>
    <text x="30" y="230" class="code-txt" style="font-size:11px; fill:#fbbf24;">for (int i=0; i&lt;R; i++) for (int j=0; j&lt;C; j++)  // Optimal</text>

    <!-- Cache warning -->
    <rect x="20" y="255" width="450" height="75" rx="6" fill="#0b1120" stroke="#1e293b"/>
    <text x="30" y="278" class="code-txt" fill="#f43f5e">Cache Thrashing Anti-Pattern:</text>
    <text x="30" y="298" class="sublabel">Iterating column-first jumps across memory strides,</text>
    <text x="30" y="314" class="sublabel">evicting CPU cache lines and dropping performance by 10x!</text>
  </g>
</svg>