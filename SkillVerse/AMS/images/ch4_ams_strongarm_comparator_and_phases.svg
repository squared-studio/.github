<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .wire { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">StrongARM Dynamic Comparator: 3-Phase Operation &amp; Kickback Noise</text>
  <text class="sub" x="460" y="48">Zero Static Power Consumption, Fast Positive-Feedback Regeneration, and Input Kickback Mitigation</text>

  <!-- Left Panel: StrongARM Stack -->
  <rect class="panel" x="20" y="64" width="420" height="328" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. Dynamic StrongARM Latch Architecture</text>
  <rect class="box" x="34" y="100" width="392" height="278" />

  <!-- VDD reset switches + cross-coupled latch -->
  <line x1="66" y1="118" x2="394" y2="118" stroke="#f87171" stroke-width="2" />
  <text class="mono" x="72" y="113" fill="#fca5a5">VDD (Precharge Switches MP_rst clocked by CLK=0)</text>

  <rect x="84" y="132" width="124" height="58" fill="#1e293b" stroke="#a78bfa" rx="5" />
  <text class="mono" x="146" y="152" fill="#c4b5fd" text-anchor="middle">PMOS Cross-Coupled</text>
  <text class="mono" x="146" y="170" fill="#e2e8f0" text-anchor="middle">MP1 / MP2 + Reset</text>

  <rect x="252" y="132" width="124" height="58" fill="#1e293b" stroke="#f59e0b" rx="5" />
  <text class="mono" x="314" y="152" fill="#fcd34d" text-anchor="middle">Output SR Latch</text>
  <text class="mono" x="314" y="170" fill="#e2e8f0" text-anchor="middle">Holds Q / Q_n</text>

  <line x1="208" y1="160" x2="252" y2="160" stroke="#34d399" stroke-width="1.8" />
  <text class="mono" x="230" y="152" fill="#6ee7b7" text-anchor="middle" font-size="9">OUT+/-</text>

  <rect x="84" y="200" width="124" height="50" fill="#1e293b" stroke="#38bdf8" rx="5" />
  <text class="mono" x="146" y="220" fill="#7dd3fc" text-anchor="middle">NMOS Cross-Coupled</text>
  <text class="mono" x="146" y="238" fill="#e2e8f0" text-anchor="middle">MN3 / MN4 (Regen)</text>

  <line x1="146" y1="190" x2="146" y2="200" stroke="#94a3b8" stroke-width="1.6" />

  <rect x="84" y="260" width="124" height="46" fill="#1e293b" stroke="#34d399" rx="5" />
  <text class="mono" x="146" y="280" fill="#6ee7b7" text-anchor="middle">Input Pair M1 / M2</text>
  <text class="mono" x="146" y="297" fill="#e2e8f0" text-anchor="middle">VIN+    ,    VIN-</text>

  <line x1="146" y1="250" x2="146" y2="260" stroke="#94a3b8" stroke-width="1.6" />

  <rect x="108" y="316" width="76" height="34" fill="#1e293b" stroke="#f87171" rx="5" />
  <text class="mono" x="146" y="337" fill="#fca5a5" text-anchor="middle">Tail CLK</text>
  <line x1="146" y1="306" x2="146" y2="316" stroke="#94a3b8" stroke-width="1.6" />
  <line x1="66" y1="358" x2="394" y2="358" stroke="#64748b" stroke-width="2" />
  <line x1="146" y1="350" x2="146" y2="358" stroke="#94a3b8" stroke-width="1.6" />

  <!-- Kickback callout -->
  <rect x="232" y="220" width="182" height="122" fill="#1e293b" stroke="#f87171" rx="5" />
  <text class="mono" x="323" y="240" fill="#fca5a5" text-anchor="middle">Kickback &amp; Offset Fixes</text>
  <text class="note" x="242" y="260">- C_gd couples VDD-&gt;0</text>
  <text class="note" x="242" y="276">  drain swings to VIN+/-</text>
  <text class="note" x="242" y="294">- Fix: Isolation switch or</text>
  <text class="note" x="242" y="310">  neutralization cap</text>
  <text class="note" x="242" y="328">- Double-tail separates</text>

  <!-- Right Panel: 3-Phase Waveforms -->
  <rect class="panel" x="456" y="64" width="444" height="328" />
  <text class="hdr" x="474" y="88" fill="#34d399">2. Phase Timing: Reset -&gt; Integration -&gt; Regeneration</text>
  <rect class="box" x="470" y="100" width="416" height="214" />

  <!-- Phase shaded columns -->
  <rect x="520" y="110" width="105" height="190" fill="rgba(148,163,184,0.08)" />
  <rect x="625" y="110" width="115" height="190" fill="rgba(56,189,248,0.10)" />
  <rect x="740" y="110" width="136" height="190" fill="rgba(52,211,153,0.10)" />
  <text class="mono" x="572" y="124" fill="#cbd5e1" text-anchor="middle" font-size="9.5">P1: Reset</text>
  <text class="mono" x="682" y="124" fill="#7dd3fc" text-anchor="middle" font-size="9.5">P2: Integrate</text>
  <text class="mono" x="808" y="124" fill="#6ee7b7" text-anchor="middle" font-size="9.5">P3: Regen</text>

  <!-- CLK trace -->
  <text class="mono" x="480" y="156" fill="#f59e0b">CLK</text>
  <polyline points="520,164 625,164 625,138 876,138" fill="none" stroke="#f59e0b" stroke-width="2" />

  <!-- Di+ / Di- drain nodes (start high VDD, integrate linearly, then diverge) -->
  <text class="mono" x="480" y="206" fill="#38bdf8">Di+/-</text>
  <polyline points="520,188 625,188 710,224 745,232" fill="none" stroke="#38bdf8" stroke-width="1.8" />
  <polyline points="520,188 625,188 710,214 745,212" fill="none" stroke="#7dd3fc" stroke-width="1.8" stroke-dasharray="4,2" />

  <!-- OUT+ / OUT- exponential regeneration -->
  <text class="mono" x="480" y="274" fill="#34d399">OUT+/-</text>
  <path d="M 520 248 L 710 248 Q 748 248 776 232 L 876 232" fill="none" stroke="#34d399" stroke-width="2.2" />
  <path d="M 520 248 L 710 248 Q 748 250 776 290 L 876 290" fill="none" stroke="#f87171" stroke-width="2.2" />
  <text class="mono" x="820" y="226" fill="#6ee7b7" font-size="9">OUT+ = VDD</text>
  <text class="mono" x="820" y="284" fill="#fca5a5" font-size="9">OUT- = 0V</text>

  <rect class="box" x="470" y="322" width="416" height="56" />
  <text class="mono" x="484" y="342" fill="#fcd34d">Decision Time: t_d = tau_reg * ln(VDD / (2 * A_0 * dV_in))</text>
  <text class="note" x="484" y="362">Tiny dV_in -&gt; metastable delay! Always size latch + SR reset for max t_d.</text>
</svg>
