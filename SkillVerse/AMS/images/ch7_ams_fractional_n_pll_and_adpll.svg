<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">Fractional-N Charge-Pump PLL vs. All-Digital PLL (ADPLL)</text>
  <text class="sub" x="460" y="48">Mixed-Signal Analog Loop Filter + MASH Delta-Sigma Divider vs. Digital TDC + DLF + DCO Synthesis</text>

  <!-- Top Panel: Analog Fractional-N Charge-Pump PLL -->
  <rect class="panel" x="20" y="64" width="880" height="164" stroke="#38bdf8" />
  <text class="hdr" x="36" y="86" fill="#38bdf8">1. Analog Fractional-N Charge-Pump PLL Architecture</text>

  <text class="mono" x="36" y="132" fill="#7dd3fc">F_ref</text>
  <line x1="74" y1="128" x2="108" y2="128" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="110" y="102" width="88" height="54" stroke="#38bdf8" />
  <text class="mono" x="154" y="124" fill="#7dd3fc" text-anchor="middle">PFD</text>
  <text class="mono" x="154" y="142" fill="#94a3b8" text-anchor="middle">UP / DN</text>

  <line x1="198" y1="128" x2="236" y2="128" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="238" y="102" width="112" height="54" stroke="#f59e0b" />
  <text class="mono" x="294" y="124" fill="#fcd34d" text-anchor="middle">Charge Pump</text>
  <text class="mono" x="294" y="142" fill="#94a3b8" text-anchor="middle">+/- I_CP</text>

  <line x1="350" y1="128" x2="388" y2="128" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="390" y="102" width="128" height="54" stroke="#34d399" />
  <text class="mono" x="454" y="124" fill="#6ee7b7" text-anchor="middle">Loop Filter</text>
  <text class="mono" x="454" y="142" fill="#94a3b8" text-anchor="middle">R1 + C1 || C2</text>

  <line x1="518" y1="128" x2="556" y2="128" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />
  <text class="mono" x="537" y="120" fill="#fcd34d" text-anchor="middle" font-size="9">Vctrl</text>

  <rect class="box" x="558" y="102" width="136" height="54" stroke="#a78bfa" />
  <text class="mono" x="626" y="124" fill="#c4b5fd" text-anchor="middle">LC / Ring VCO</text>
  <text class="mono" x="626" y="142" fill="#94a3b8" text-anchor="middle">f_out = f_0 + Kv*Vctrl</text>

  <line x1="694" y1="128" x2="858" y2="128" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />
  <text class="mono" x="870" y="132" fill="#6ee7b7">F_out</text>

  <!-- Feedback Loop: MMD + MASH 1-1-1 DSM -->
  <circle cx="726" cy="128" r="3.5" fill="#38bdf8" />
  <polyline points="726,128 726,192 528,192" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr)" />

  <rect class="box" x="372" y="168" width="154" height="48" stroke="#38bdf8" />
  <text class="mono" x="449" y="188" fill="#7dd3fc" text-anchor="middle">Multi-Modulus Div</text>
  <text class="mono" x="449" y="205" fill="#94a3b8" text-anchor="middle">/ (N_int + dN[n])</text>

  <rect class="box" x="180" y="168" width="152" height="48" stroke="#a78bfa" />
  <text class="mono" x="256" y="188" fill="#c4b5fd" text-anchor="middle">MASH 1-1-1 DSM</text>
  <text class="mono" x="256" y="205" fill="#94a3b8" text-anchor="middle">Frac F_word -&gt; +60dB/d</text>
  <line x1="332" y1="192" x2="370" y2="192" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arr-p)" />

  <polyline points="372,192 154,192 154,158" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr)" />

  <!-- Bottom Panel: All-Digital PLL (ADPLL) -->
  <rect class="panel" x="20" y="242" width="880" height="150" stroke="#34d399" />
  <text class="hdr" x="36" y="264" fill="#34d399">2. All-Digital PLL (ADPLL) Scaling in FinFET Process</text>

  <text class="mono" x="36" y="308" fill="#7dd3fc">F_ref</text>
  <line x1="74" y1="304" x2="108" y2="304" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="110" y="278" width="142" height="52" stroke="#38bdf8" />
  <text class="mono" x="181" y="299" fill="#7dd3fc" text-anchor="middle">TDC / Bang-Bang PD</text>
  <text class="mono" x="181" y="317" fill="#94a3b8" text-anchor="middle">Phase Err phi_e[k]</text>

  <line x1="252" y1="304" x2="294" y2="304" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="296" y="278" width="194" height="52" stroke="#34d399" />
  <text class="mono" x="393" y="299" fill="#6ee7b7" text-anchor="middle">Digital Loop Filter (RTL)</text>
  <text class="mono" x="393" y="317" fill="#94a3b8" text-anchor="middle">Kp + Ki/(1 - z^-1) + IIR</text>

  <line x1="490" y1="304" x2="532" y2="304" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="534" y="278" width="160" height="52" stroke="#a78bfa" />
  <text class="mono" x="614" y="299" fill="#c4b5fd" text-anchor="middle">DCO (Cap Bank)</text>
  <text class="mono" x="614" y="317" fill="#94a3b8" text-anchor="middle">Switched Varactors</text>

  <line x1="694" y1="304" x2="858" y2="304" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />
  <text class="mono" x="870" y="308" fill="#6ee7b7">F_out</text>

  <polyline points="726,304 726,364 181,364 181,332" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr)" />
  <rect class="box" x="380" y="346" width="210" height="34" stroke="#f59e0b" />
  <text class="mono" x="485" y="367" fill="#fcd34d" text-anchor="middle">Phase Accumulator + FCW</text>
</svg>
