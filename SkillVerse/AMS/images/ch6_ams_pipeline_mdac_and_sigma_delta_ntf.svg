<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">1.5-Bit/Stage Pipeline MDAC Residue &amp; Sigma-Delta Noise Shaping</text>
  <text class="sub" x="460" y="48">Digital Redundancy Against Comparator Offsets vs. Oversampling &amp; NTF Spectral Shaping</text>

  <!-- Left Panel: 1.5-bit/Stage Pipeline MDAC -->
  <rect class="panel" x="20" y="64" width="430" height="328" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. Pipeline 1.5-Bit/Stage Residue Plot</text>
  <rect class="box" x="34" y="100" width="402" height="206" />

  <!-- Axes -->
  <line x1="235" y1="112" x2="235" y2="288" stroke="#64748b" stroke-width="1.2" />
  <line x1="60" y1="200" x2="412" y2="200" stroke="#64748b" stroke-width="1.2" />
  <line x1="60" y1="136" x2="412" y2="136" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="60" y1="264" x2="412" y2="264" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
  <text class="mono" x="42" y="139" font-size="9">+Vref</text>
  <text class="mono" x="42" y="267" font-size="9">-Vref</text>

  <!-- Threshold markers at -Vref/4 and +Vref/4 -->
  <line x1="190" y1="120" x2="190" y2="282" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" />
  <line x1="280" y1="120" x2="280" y2="282" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" />
  <text class="mono" x="190" y="297" fill="#fcd34d" text-anchor="middle" font-size="9">-Vref/4</text>
  <text class="mono" x="280" y="297" fill="#fcd34d" text-anchor="middle" font-size="9">+Vref/4</text>

  <!-- Gain=2 segments (00, 01, 10) -->
  <line x1="80" y1="264" x2="190" y2="168" stroke="#34d399" stroke-width="2.4" />
  <line x1="190" y1="232" x2="280" y2="168" stroke="#34d399" stroke-width="2.4" />
  <line x1="280" y1="232" x2="390" y2="136" stroke="#34d399" stroke-width="2.4" />
  <text class="mono" x="128" y="158" fill="#6ee7b7" font-size="9.5">Code 00</text>
  <text class="mono" x="235" y="158" fill="#6ee7b7" font-size="9.5" text-anchor="middle">01</text>
  <text class="mono" x="340" y="158" fill="#6ee7b7" font-size="9.5">10</text>
  <text class="mono" x="125" y="280" fill="#7dd3fc" font-size="9.5">Vres = 2*Vin - D*Vref</text>

  <rect class="box" x="34" y="314" width="402" height="64" />
  <text class="mono" x="46" y="334" fill="#fcd34d">Digital Redundancy Benefit (0.5-bit margin):</text>
  <text class="note" x="46" y="352">Comparator offset up to +/-Vref/4 pushes Vres cleanly</text>
  <text class="note" x="46" y="368">within +/-Vref; next stage corrects it completely!</text>

  <!-- Right Panel: Sigma-Delta NTF -->
  <rect class="panel" x="466" y="64" width="434" height="328" />
  <text class="hdr" x="484" y="88" fill="#a78bfa">2. Sigma-Delta Modulator &amp; Noise Shaping</text>

  <rect class="box" x="480" y="100" width="406" height="206" />
  <!-- Plot axes (log frequency) -->
  <line x1="520" y1="116" x2="520" y2="276" stroke="#64748b" stroke-width="1.3" />
  <line x1="520" y1="276" x2="866" y2="276" stroke="#64748b" stroke-width="1.3" />

  <!-- Signal Bandwidth shaded zone -->
  <rect x="520" y="118" width="76" height="158" fill="rgba(52,211,153,0.12)" />
  <line x1="596" y1="118" x2="596" y2="276" stroke="#34d399" stroke-width="1.2" stroke-dasharray="3,2" />
  <text class="mono" x="558" y="294" fill="#6ee7b7" text-anchor="middle" font-size="9.5">f_BW</text>
  <text class="mono" x="836" y="294" fill="#94a3b8" text-anchor="middle" font-size="9.5">f_s / 2</text>

  <!-- Unshaped white quantization noise (dashed) -->
  <line x1="520" y1="226" x2="860" y2="226" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3" />
  <text class="mono" x="780" y="218" fill="#94a3b8" font-size="9">Flat Nyquist Noise</text>

  <!-- Signal tone -->
  <line x1="556" y1="276" x2="556" y2="132" stroke="#38bdf8" stroke-width="2.6" />
  <circle cx="556" cy="132" r="3.5" fill="#38bdf8" />
  <text class="mono" x="564" y="138" fill="#7dd3fc" font-size="9.5">Signal (STF=1)</text>

  <!-- Noise-shaped NTF (1 - z^-1)^L curve -->
  <path d="M 522 273 Q 586 268 650 228 T 860 156" fill="none" stroke="#a78bfa" stroke-width="2.6" />
  <text class="mono" x="742" y="168" fill="#c4b5fd" font-size="10">NTF(z) = (1 - z^-1)^L</text>
  <text class="mono" x="630" y="255" fill="#6ee7b7" font-size="9.5">20*L dB/dec Slope</text>

  <rect class="box" x="480" y="314" width="406" height="64" />
  <text class="mono" x="492" y="334" fill="#c4b5fd">SQNR Gain: + (6*L + 3) dB per octave of OSR (= fs/2*BW)</text>
  <text class="note" x="492" y="354">Decimation Digital Filter removes all out-of-band</text>
  <text class="note" x="492" y="370">high-frequency quantization noise cleanly after sampling.</text>
</svg>
