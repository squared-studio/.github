<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">Synchronous Buck Converter Power Stage &amp; CCM vs. DCM/PFM Modes</text>
  <text class="sub" x="460" y="48">Half-Bridge Switching with Dead-Time Shoot-Through Protection, LC Filtering, and Light-Load PFM</text>

  <!-- Left Panel: Power Stage -->
  <rect class="panel" x="20" y="64" width="440" height="328" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. Synchronous Buck Power Stage &amp; Control</text>
  <rect class="box" x="34" y="100" width="412" height="214" />

  <!-- VIN rail -->
  <text class="mono" x="52" y="122" fill="#f87171">VIN (3.3V - 5.0V)</text>
  <line x1="164" y1="118" x2="230" y2="118" stroke="#f87171" stroke-width="2" />

  <!-- HS FET & LS FET -->
  <rect x="174" y="132" width="76" height="42" fill="#1e293b" stroke="#f59e0b" rx="5" />
  <text class="mono" x="212" y="156" fill="#fcd34d" text-anchor="middle">HS PMOS/NMOS</text>
  <line x1="212" y1="118" x2="212" y2="132" stroke="#f87171" stroke-width="1.8" />
  <line x1="212" y1="174" x2="212" y2="218" stroke="#34d399" stroke-width="2" />

  <circle cx="212" cy="196" r="4" fill="#34d399" />
  <text class="mono" x="224" y="191" fill="#6ee7b7">SW Node</text>

  <rect x="174" y="218" width="76" height="42" fill="#1e293b" stroke="#a78bfa" rx="5" />
  <text class="mono" x="212" y="242" fill="#c4b5fd" text-anchor="middle">LS Sync NMOS</text>
  <line x1="212" y1="260" x2="212" y2="286" stroke="#64748b" stroke-width="1.8" />
  <line x1="174" y1="286" x2="424" y2="286" stroke="#64748b" stroke-width="2" />

  <!-- LC Output Filter -->
  <line x1="212" y1="196" x2="286" y2="196" stroke="#34d399" stroke-width="2" />
  <rect x="286" y="182" width="66" height="28" fill="#0f172a" stroke="#38bdf8" rx="4" />
  <text class="mono" x="319" y="200" fill="#7dd3fc" text-anchor="middle">Inductor L</text>
  <line x1="352" y1="196" x2="424" y2="196" stroke="#34d399" stroke-width="2" />
  <text class="mono" x="406" y="186" fill="#6ee7b7">VOUT</text>
  <line x1="382" y1="196" x2="382" y2="232" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="368" y1="232" x2="396" y2="232" stroke="#34d399" stroke-width="2.5" />
  <line x1="368" y1="242" x2="396" y2="242" stroke="#34d399" stroke-width="2.5" />
  <text class="mono" x="404" y="242" fill="#6ee7b7" font-size="9.5">C_out</text>
  <line x1="382" y1="242" x2="382" y2="286" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Dead-time Gate Driver block -->
  <rect x="44" y="160" width="102" height="72" fill="#1e293b" stroke="#f87171" rx="5" />
  <text class="mono" x="95" y="182" fill="#fca5a5" text-anchor="middle">PWM/PFM</text>
  <text class="mono" x="95" y="198" fill="#fca5a5" text-anchor="middle">Dead-Time</text>
  <text class="mono" x="95" y="214" fill="#e2e8f0" text-anchor="middle">Gate Driver</text>
  <line x1="146" y1="176" x2="174" y2="154" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="146" y1="216" x2="174" y2="238" stroke="#a78bfa" stroke-width="1.5" />

  <rect class="box" x="34" y="322" width="412" height="56" />
  <text class="mono" x="46" y="342" fill="#6ee7b7">Ideal Buck: VOUT = D * VIN  (where D = t_on / T_sw)</text>
  <text class="mono" x="46" y="361" fill="#fca5a5">Dead-time prevents HS + LS simultaneous ON (shoot-through!)</text>

  <!-- Right Panel: CCM vs DCM Waveforms -->
  <rect class="panel" x="476" y="64" width="424" height="328" />
  <text class="hdr" x="494" y="88" fill="#34d399">2. Inductor Current Waveforms: CCM vs. DCM/PFM</text>

  <!-- CCM Plot -->
  <rect class="box" x="490" y="100" width="396" height="110" stroke="#38bdf8" />
  <text class="mono" x="502" y="120" fill="#7dd3fc">A. Continuous Conduction Mode (PWM Heavy Load)</text>
  <line x1="514" y1="188" x2="866" y2="188" stroke="#64748b" stroke-width="1.2" />
  <text class="mono" x="500" y="190" font-size="8.5">0A</text>
  <line x1="514" y1="158" x2="866" y2="158" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
  <polyline points="520,174 580,140 650,174 710,140 780,174 840,140 860,152" fill="none" stroke="#38bdf8" stroke-width="2.4" />
  <text class="mono" x="720" y="134" fill="#6ee7b7" font-size="9.5">Delta I_L = (VIN-VOUT)*D / (f_sw*L)</text>

  <!-- DCM / PFM Plot -->
  <rect class="box" x="490" y="218" width="396" height="106" stroke="#a78bfa" />
  <text class="mono" x="502" y="238" fill="#c4b5fd">B. Discontinuous / Pulse-Frequency Mode (Light Load)</text>
  <line x1="514" y1="296" x2="866" y2="296" stroke="#64748b" stroke-width="1.2" />
  <polyline points="520,296 565,254 615,296 710,296 755,254 805,296 860,296" fill="none" stroke="#a78bfa" stroke-width="2.4" />
  <text class="mono" x="662" y="284" fill="#fcd34d" text-anchor="middle" font-size="9.5">Zero-Current Switch Idle</text>
  <text class="note" x="740" y="314" font-size="9.5">Skips pulses to save switching loss</text>

  <rect class="box" x="490" y="330" width="396" height="48" />
  <text class="mono" x="502" y="349" fill="#fcd34d">Avg Model (Verilog-A/SV-RNM): Faster 1000x than SPICE!</text>
  <text class="note" x="502" y="366">Verify dead-time, zero-cross detect &amp; mode handoff in cycle-by-cycle SPICE.</text>
</svg>
