<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .wire { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
      .fet { stroke: #38bdf8; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="420" />
  <text class="title" x="460" y="28">gm/ID Sizing Methodology &amp; CMOS Current Mirror Topologies</text>
  <text class="sub" x="460" y="48">Trading Transconductance Efficiency Against Transit Frequency, Output Resistance, and Headroom</text>

  <!-- Left Panel: gm/ID vs fT curve -->
  <rect class="panel" x="20" y="64" width="380" height="338" />
  <text class="hdr" x="36" y="88" fill="#38bdf8">1. Universal gm/ID Sizing Curve</text>
  <rect class="box" x="34" y="100" width="352" height="205" />

  <!-- Regions shading -->
  <rect x="76" y="114" width="110" height="156" fill="rgba(167,139,250,0.08)" />
  <rect x="186" y="114" width="92" height="156" fill="rgba(52,211,153,0.10)" />
  <rect x="278" y="114" width="92" height="156" fill="rgba(245,158,11,0.08)" />
  <text class="mono" x="131" y="128" fill="#c4b5fd" text-anchor="middle" font-size="9.5">Strong Inv.</text>
  <text class="mono" x="232" y="128" fill="#6ee7b7" text-anchor="middle" font-size="9.5">Moderate Inv.</text>
  <text class="mono" x="324" y="128" fill="#fcd34d" text-anchor="middle" font-size="9.5">Weak Inv.</text>

  <!-- Axes -->
  <line x1="76" y1="114" x2="76" y2="270" stroke="#64748b" stroke-width="1.3" />
  <line x1="76" y1="270" x2="372" y2="270" stroke="#64748b" stroke-width="1.3" />
  <text class="mono" x="224" y="290" text-anchor="middle">gm / ID  (V^-1)   [5 -&gt; 25]</text>
  <text class="mono" x="42" y="190" fill="#34d399" font-size="9.5">fT</text>
  <text class="mono" x="40" y="206" fill="#38bdf8" font-size="9.5">g_ds</text>

  <!-- fT curve (drops as gm/ID increases) -->
  <path d="M 84 142 Q 160 156 226 196 T 364 260" fill="none" stroke="#34d399" stroke-width="2.4" />
  <!-- Intrinsic gain Av = gm*ro curve (rises with gm/ID) -->
  <path d="M 84 252 Q 165 224 235 186 T 364 142" fill="none" stroke="#38bdf8" stroke-width="2.4" />
  <text class="mono" x="108" y="156" fill="#34d399" font-size="9.5">fT (Speed)</text>
  <text class="mono" x="292" y="152" fill="#38bdf8" font-size="9.5">gm*ro (Gain)</text>
  <circle cx="232" cy="193" r="4" fill="#f59e0b" />
  <text class="mono" x="232" y="218" fill="#fcd34d" text-anchor="middle" font-size="9.5">Sweet Spot: 12-16 V^-1</text>

  <rect class="box" x="34" y="314" width="352" height="74" />
  <text class="mono" x="46" y="334" fill="#7dd3fc">V_ov ~ 2 / (gm/ID)  [Strong Inv.]</text>
  <text class="mono" x="46" y="353" fill="#6ee7b7">W = (ID / (I_D / W)_char) at chosen gm/ID</text>
  <text class="note" x="46" y="373">Invariant across short-channel velocity saturation</text>

  <!-- Right Panel: Three Current Mirror Topologies -->
  <rect class="panel" x="414" y="64" width="486" height="338" />
  <text class="hdr" x="430" y="88" fill="#34d399">2. Current Mirror Evolution: Output Impedance &amp; Headroom</text>

  <!-- Card A: Simple Mirror -->
  <rect class="box" x="428" y="102" width="146" height="222" stroke="#94a3b8" />
  <text class="mono" x="501" y="122" fill="#e2e8f0" text-anchor="middle">A. Simple Mirror</text>
  <!-- NMOS M1 (left, diode connected) & M2 (right) -->
  <line class="wire" x1="462" y1="138" x2="462" y2="195" />
  <text class="mono" x="462" y="135" font-size="9" text-anchor="middle">I_IN</text>
  <line class="wire" x1="462" y1="242" x2="462" y2="262" />
  <line class="wire" x1="538" y1="150" x2="538" y2="195" />
  <text class="mono" x="538" y="144" font-size="9" fill="#38bdf8" text-anchor="middle">I_OUT</text>
  <line class="wire" x1="538" y1="242" x2="538" y2="262" />
  <line class="wire" x1="446" y1="262" x2="554" y2="262" />
  <!-- M1 gate-drain tie -->
  <rect x="454" y="195" width="18" height="47" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="463" y="222" font-size="10" text-anchor="middle">M1</text>
  <rect x="528" y="195" width="18" height="47" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="537" y="222" font-size="10" text-anchor="middle">M2</text>
  <polyline points="462,174 500,174 500,218 528,218" fill="none" stroke="#f59e0b" stroke-width="1.5" />
  <line x1="500" y1="218" x2="472" y2="218" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="438" y="286" fill="#fca5a5" font-size="9.5">Rout = r_o2</text>
  <text class="mono" x="438" y="302" fill="#6ee7b7" font-size="9.5">Vmin = Vov</text>
  <text class="note" x="438" y="317" font-size="9.5">Error from CLM</text>

  <!-- Card B: Standard Cascode -->
  <rect class="box" x="584" y="102" width="148" height="222" stroke="#38bdf8" />
  <text class="mono" x="658" y="122" fill="#7dd3fc" text-anchor="middle">B. Std Cascode</text>
  <line class="wire" x1="620" y1="138" x2="620" y2="262" />
  <line class="wire" x1="696" y1="148" x2="696" y2="262" />
  <line class="wire" x1="604" y1="262" x2="712" y2="262" />
  <rect x="611" y="158" width="18" height="36" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="620" y="180" font-size="9" text-anchor="middle">M3</text>
  <rect x="687" y="158" width="18" height="36" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="696" y="180" font-size="9" text-anchor="middle">M4</text>
  <rect x="611" y="210" width="18" height="36" fill="#1e293b" stroke="#a78bfa" rx="3" />
  <text class="mono" x="620" y="232" font-size="9" text-anchor="middle">M1</text>
  <rect x="687" y="210" width="18" height="36" fill="#1e293b" stroke="#a78bfa" rx="3" />
  <text class="mono" x="696" y="232" font-size="9" text-anchor="middle">M2</text>
  <polyline points="620,145 658,145 658,176 687,176" fill="none" stroke="#f59e0b" stroke-width="1.3" />
  <line x1="658" y1="176" x2="629" y2="176" stroke="#f59e0b" stroke-width="1.3" />
  <polyline points="620,200 658,200 658,228 687,228" fill="none" stroke="#34d399" stroke-width="1.3" />
  <line x1="658" y1="228" x2="629" y2="228" stroke="#34d399" stroke-width="1.3" />
  <text class="mono" x="594" y="286" fill="#6ee7b7" font-size="9.5">Rout ~ gm4*ro4*ro2</text>
  <text class="mono" x="594" y="302" fill="#fca5a5" font-size="9.5">Vmin = Vth + 2*Vov</text>
  <text class="note" x="594" y="317" font-size="9.5">Wastes 1x Vth</text>

  <!-- Card C: Wide-Swing Cascode -->
  <rect class="box" x="742" y="102" width="144" height="222" stroke="#34d399" />
  <text class="mono" x="814" y="122" fill="#6ee7b7" text-anchor="middle">C. Wide-Swing</text>
  <line class="wire" x1="776" y1="138" x2="776" y2="262" />
  <line class="wire" x1="852" y1="148" x2="852" y2="262" />
  <line class="wire" x1="760" y1="262" x2="868" y2="262" />
  <rect x="767" y="158" width="18" height="36" fill="#1e293b" stroke="#34d399" rx="3" />
  <text class="mono" x="776" y="180" font-size="9" text-anchor="middle">M3</text>
  <rect x="843" y="158" width="18" height="36" fill="#1e293b" stroke="#34d399" rx="3" />
  <text class="mono" x="852" y="180" font-size="9" text-anchor="middle">M4</text>
  <rect x="767" y="210" width="18" height="36" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="776" y="232" font-size="9" text-anchor="middle">M1</text>
  <rect x="843" y="210" width="18" height="36" fill="#1e293b" stroke="#38bdf8" rx="3" />
  <text class="mono" x="852" y="232" font-size="9" text-anchor="middle">M2</text>
  <text class="mono" x="814" y="170" fill="#fcd34d" font-size="8.5" text-anchor="middle">Vb = Vth+2Vov</text>
  <line x1="785" y1="176" x2="843" y2="176" stroke="#f59e0b" stroke-width="1.3" />
  <polyline points="776,144 804,144 804,228 843,228" fill="none" stroke="#38bdf8" stroke-width="1.3" />
  <line x1="804" y1="228" x2="785" y2="228" stroke="#38bdf8" stroke-width="1.3" />
  <text class="mono" x="752" y="286" fill="#6ee7b7" font-size="9.5">Rout ~ gm4*ro4*ro2</text>
  <text class="mono" x="752" y="302" fill="#6ee7b7" font-size="9.5">Vmin = 2*Vov</text>
  <text class="note" x="752" y="317" font-size="9.5">Optimal low-VDD</text>

  <!-- Summary note -->
  <rect class="box" x="428" y="334" width="458" height="54" />
  <text class="mono" x="440" y="354" fill="#fcd34d">Matching Rule: Delta I_D / I_D = Delta(Vth)*gm/ID + Delta(beta)/beta</text>
  <text class="note" x="440" y="374">Bias mirrors at LOWER gm/ID (larger Vov, larger W*L) to suppress Vth mismatch variance!</text>
</svg>
