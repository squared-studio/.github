<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">ADC Architecture Landscape &amp; Charge-Redistribution SAR Operation</text>
  <text class="sub" x="460" y="48">Resolution vs. Sampling Rate Trade-Offs and Binary-Search Capacitive DAC Conversion</text>

  <!-- Left Panel: ADC Speed vs ENOB Map -->
  <rect class="panel" x="20" y="64" width="410" height="328" />
  <text class="hdr" x="36" y="88" fill="#38bdf8">1. ADC Topology Landscape (ENOB vs. f_s)</text>
  <rect class="box" x="34" y="100" width="382" height="222" />

  <line x1="74" y1="116" x2="74" y2="296" stroke="#64748b" stroke-width="1.3" />
  <line x1="74" y1="296" x2="400" y2="296" stroke="#64748b" stroke-width="1.3" />
  <text class="mono" x="237" y="314" text-anchor="middle">Sampling Rate (kSPS -&gt; GSPS)</text>
  <text class="mono" x="42" y="138" font-size="9">20b</text>
  <text class="mono" x="42" y="196" font-size="9">12b</text>
  <text class="mono" x="42" y="256" font-size="9">6b</text>

  <!-- Bubbles -->
  <ellipse cx="122" cy="148" rx="40" ry="26" fill="rgba(167,139,250,0.22)" stroke="#a78bfa" stroke-width="1.5" />
  <text class="mono" x="122" y="145" fill="#c4b5fd" text-anchor="middle" font-size="9.5">Sigma-Delta</text>
  <text class="mono" x="122" y="159" fill="#94a3b8" text-anchor="middle" font-size="8.5">(16-24b Audio/Sensor)</text>

  <ellipse cx="210" cy="196" rx="52" ry="32" fill="rgba(52,211,153,0.22)" stroke="#34d399" stroke-width="1.8" />
  <text class="mono" x="210" y="193" fill="#6ee7b7" text-anchor="middle" font-size="10">SAR / TI-SAR</text>
  <text class="mono" x="210" y="209" fill="#94a3b8" text-anchor="middle" font-size="8.5">(8-14b, Lowest pJ/conv)</text>

  <ellipse cx="288" cy="212" rx="44" ry="24" fill="rgba(56,189,248,0.22)" stroke="#38bdf8" stroke-width="1.5" />
  <text class="mono" x="288" y="209" fill="#7dd3fc" text-anchor="middle" font-size="9.5">Pipeline</text>
  <text class="mono" x="288" y="223" fill="#94a3b8" text-anchor="middle" font-size="8.5">(10-14b, 100MSPS+)</text>

  <ellipse cx="352" cy="256" rx="40" ry="24" fill="rgba(245,158,11,0.22)" stroke="#f59e0b" stroke-width="1.5" />
  <text class="mono" x="352" y="253" fill="#fcd34d" text-anchor="middle" font-size="9.5">Flash</text>
  <text class="mono" x="352" y="267" fill="#94a3b8" text-anchor="middle" font-size="8.5">(4-8b, GSPS)</text>

  <rect class="box" x="34" y="330" width="382" height="48" />
  <text class="mono" x="46" y="350" fill="#6ee7b7">Walden FoM = Power / (2^ENOB * min(fs, 2*ERBW))</text>
  <text class="note" x="46" y="368">SAR + Time-Interleaving dominates modern FinFET SoCs!</text>

  <!-- Right Panel: SAR Loop + Waveform -->
  <rect class="panel" x="446" y="64" width="454" height="328" />
  <text class="hdr" x="464" y="88" fill="#34d399">2. Capacitive SAR ADC Binary-Search Loop</text>

  <rect class="box" x="460" y="100" width="426" height="122" />
  <!-- Top plate + Cap array + Comp + SAR Logic -->
  <text class="mono" x="472" y="128" fill="#38bdf8">VIN</text>
  <rect x="504" y="116" width="128" height="46" fill="#1e293b" stroke="#34d399" rx="5" />
  <text class="mono" x="568" y="136" fill="#6ee7b7" text-anchor="middle">Binary CDAC</text>
  <text class="mono" x="568" y="152" fill="#e2e8f0" text-anchor="middle">8C  4C  2C  C  C</text>

  <line x1="632" y1="138" x2="674" y2="138" stroke="#f59e0b" stroke-width="1.8" />
  <text class="mono" x="653" y="130" fill="#fcd34d" text-anchor="middle" font-size="9">V_top</text>

  <polygon points="674,118 726,144 674,170" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
  <text class="mono" x="682" y="148" fill="#7dd3fc">CMP</text>
  <line x1="726" y1="144" x2="762" y2="144" stroke="#38bdf8" stroke-width="1.8" />

  <rect x="762" y="118" width="110" height="52" fill="#1e293b" stroke="#a78bfa" rx="5" />
  <text class="mono" x="817" y="140" fill="#c4b5fd" text-anchor="middle">SAR FSM</text>
  <text class="mono" x="817" y="156" fill="#e2e8f0" text-anchor="middle">D[N-1:0]</text>
  <polyline points="817,170 817,196 568,196 568,162" fill="none" stroke="#a78bfa" stroke-width="1.6" />
  <text class="mono" x="692" y="210" fill="#c4b5fd" text-anchor="middle" font-size="9.5">Async Self-Timed Bit-Trial Feedback</text>

  <!-- Binary Search Waveform -->
  <rect class="box" x="460" y="232" width="426" height="146" />
  <text class="mono" x="472" y="250" fill="#fcd34d">V_top Settling Toward VCM (= 0 Diff) Across Bit Trials:</text>
  <line x1="484" y1="312" x2="866" y2="312" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4,3" />
  <text class="mono" x="870" y="315" fill="#94a3b8" font-size="9">VCM</text>
  <polyline points="484,264 532,264 532,334 596,334 596,292 660,292 660,318 724,318 724,306 788,306 788,313 854,313" fill="none" stroke="#34d399" stroke-width="2.2" />
  <text class="mono" x="508" y="356" fill="#7dd3fc" font-size="9">Track</text>
  <text class="mono" x="564" y="356" fill="#fcd34d" font-size="9">MSB=1</text>
  <text class="mono" x="628" y="356" fill="#fcd34d" font-size="9">B2=0</text>
  <text class="mono" x="692" y="356" fill="#fcd34d" font-size="9">B1=1</text>
  <text class="mono" x="756" y="356" fill="#fcd34d" font-size="9">B0=0</text>
  <text class="mono" x="822" y="356" fill="#6ee7b7" font-size="9">Done</text>
</svg>
