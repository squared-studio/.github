<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">UVM-MS Mixed-Signal Verification &amp; Model-vs-Schematic (MVS) Correlation</text>
  <text class="sub" x="460" y="48">Driving Analog Real Stimuli, Mixed-Signal SVA Checkers, and Proving Equivalence Between RNM and SPICE</text>

  <!-- Left Panel: UVM-MS Environment -->
  <rect class="panel" x="20" y="64" width="466" height="328" stroke="#38bdf8" />
  <text class="hdr" x="38" y="88" fill="#38bdf8">1. UVM-MS Testbench Architecture</text>

  <rect class="box" x="36" y="102" width="434" height="72" stroke="#a78bfa" />
  <text class="mono" x="253" y="122" fill="#c4b5fd" text-anchor="middle">UVM Virtual Sequencer &amp; Mixed-Signal Scoreboard</text>
  <text class="note" x="253" y="142" text-anchor="middle">Coordinates Digital APB/SPI Trim Sequences + Analog Real Sweeps</text>
  <text class="mono" x="253" y="160" fill="#6ee7b7" text-anchor="middle">Checks ENOB, Lock Time, Droop &amp; Functional Coverage</text>

  <rect class="box" x="36" y="186" width="206" height="84" stroke="#34d399" />
  <text class="mono" x="139" y="206" fill="#6ee7b7" text-anchor="middle">Digital RAL / APB Agent</text>
  <text class="note" x="139" y="226" text-anchor="middle">Writes PLL FCW, LDO Vref,</text>
  <text class="note" x="139" y="242" text-anchor="middle">DAC codes, Calib FSM</text>
  <text class="mono" x="139" y="259" fill="#94a3b8" text-anchor="middle">(Standard Digital UVM)</text>

  <rect class="box" x="264" y="186" width="206" height="84" stroke="#f59e0b" />
  <text class="mono" x="367" y="206" fill="#fcd34d" text-anchor="middle">Analog UVM-MS Agent</text>
  <text class="note" x="367" y="226" text-anchor="middle">Drives real waveforms (sin,</text>
  <text class="note" x="367" y="242" text-anchor="middle">steps, PVT supply noise)</text>
  <text class="mono" x="367" y="259" fill="#94a3b8" text-anchor="middle">Virtual Interface (`real`/`EEnet`)</text>

  <line x1="139" y1="174" x2="139" y2="184" stroke="#34d399" stroke-width="1.6" marker-end="url(#arr-g)" />
  <line x1="367" y1="174" x2="367" y2="184" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arr)" />

  <rect class="box" x="36" y="284" width="434" height="94" stroke="#38bdf8" />
  <text class="mono" x="253" y="306" fill="#7dd3fc" text-anchor="middle">Mixed-Signal DUT (Config Swappable via SV `config`)</text>
  <text class="mono" x="253" y="328" fill="#e2e8f0" text-anchor="middle">RTL Digital Block  &lt;==&gt;  Analog Block (SV-RNM or SPICE)</text>
  <text class="mono" x="253" y="352" fill="#fca5a5" text-anchor="middle">SVA Analog Monitors: assert((V_ldo &gt; 0.85) &amp;&amp; (V_ldo &lt; 0.95));</text>
  <text class="note" x="253" y="370" text-anchor="middle">Zero testbench changes needed when swapping SV-RNM &lt;-&gt; SPICE!</text>

  <!-- Right Panel: MVS Correlation Flow -->
  <rect class="panel" x="502" y="64" width="398" height="328" stroke="#34d399" />
  <text class="hdr" x="520" y="88" fill="#34d399">2. Automated Model-vs-Schematic (MVS) Loop</text>

  <rect class="box" x="522" y="104" width="358" height="58" stroke="#38bdf8" />
  <text class="mono" x="701" y="126" fill="#7dd3fc" text-anchor="middle">1. Apply Identical Directed Vector Suite</text>
  <text class="note" x="701" y="146" text-anchor="middle">Run Test Suite on SV-RNM Model AND Extracted SPICE</text>

  <line x1="701" y1="162" x2="701" y2="182" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="522" y="184" width="358" height="66" stroke="#f59e0b" />
  <text class="mono" x="701" y="204" fill="#fcd34d" text-anchor="middle">2. Tolerance Comparator (Not Bit-Exact!)</text>
  <text class="note" x="701" y="224" text-anchor="middle">Compare DC voltage (+/-1 mV), Current (+/-2%),</text>
  <text class="note" x="701" y="240" text-anchor="middle">Settling Time (+/-5%), Phase Noise &amp; Digital Outputs</text>

  <line x1="701" y1="250" x2="701" y2="270" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-g)" />

  <rect class="box" x="522" y="272" width="168" height="104" stroke="#34d399" />
  <text class="mono" x="606" y="294" fill="#6ee7b7" text-anchor="middle">PASS (&lt; Tol)</text>
  <text class="note" x="606" y="314" text-anchor="middle">Model Certified for</text>
  <text class="note" x="606" y="330" text-anchor="middle">Full-Chip Overnight</text>
  <text class="note" x="606" y="346" text-anchor="middle">UVM Regressions</text>
  <text class="mono" x="606" y="366" fill="#6ee7b7" text-anchor="middle">Sign-off Valid!</text>

  <rect class="box" x="712" y="272" width="168" height="104" stroke="#f87171" />
  <text class="mono" x="796" y="294" fill="#fca5a5" text-anchor="middle">FAIL (&gt; Tol)</text>
  <text class="note" x="796" y="314" text-anchor="middle">Update RNM Pole,</text>
  <text class="note" x="796" y="330" text-anchor="middle">Offset, or Pin Map;</text>
  <text class="note" x="796" y="346" text-anchor="middle">Re-run MVS Check</text>
  <text class="mono" x="796" y="366" fill="#fca5a5" text-anchor="middle">Blocks SoC Freeze</text>
</svg>
