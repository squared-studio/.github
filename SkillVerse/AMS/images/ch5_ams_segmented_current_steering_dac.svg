<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">Segmented Current-Steering DAC with DEM / DWA Scrambling</text>
  <text class="sub" x="460" y="48">Combining Unary Thermometer MSBs, Binary LSBs, and Dynamic Element Matching for 80+ dB SFDR</text>

  <!-- Main Architecture Box -->
  <rect class="panel" x="20" y="64" width="880" height="248" />

  <!-- Digital Input Split -->
  <rect class="box" x="36" y="110" width="110" height="148" stroke="#38bdf8" />
  <text class="hdr" x="91" y="134" fill="#38bdf8" text-anchor="middle">N-Bit Input</text>
  <rect x="48" y="148" width="86" height="42" fill="#1e293b" stroke="#34d399" rx="4" />
  <text class="mono" x="91" y="167" fill="#6ee7b7" text-anchor="middle">M MSBs</text>
  <text class="mono" x="91" y="182" fill="#94a3b8" text-anchor="middle">(e.g. 6-bit)</text>
  <rect x="48" y="202" width="86" height="42" fill="#1e293b" stroke="#a78bfa" rx="4" />
  <text class="mono" x="91" y="221" fill="#c4b5fd" text-anchor="middle">L LSBs</text>
  <text class="mono" x="91" y="236" fill="#94a3b8" text-anchor="middle">(e.g. 8-bit)</text>

  <!-- Top path: Thermometer Decoder + DEM/DWA -->
  <line x1="134" y1="169" x2="176" y2="169" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr)" />
  <rect class="box" x="178" y="102" width="148" height="88" stroke="#34d399" />
  <text class="mono" x="252" y="124" fill="#6ee7b7" text-anchor="middle">Thermometer</text>
  <text class="mono" x="252" y="140" fill="#6ee7b7" text-anchor="middle">+ DWA / DEM</text>
  <text class="note" x="252" y="160" text-anchor="middle">2^M - 1 = 63 lines</text>
  <text class="note" x="252" y="177" text-anchor="middle">Rotates mismatches</text>

  <!-- Retiming Latch Array -->
  <line x1="326" y1="146" x2="364" y2="146" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr)" />
  <line x1="134" y1="223" x2="364" y2="223" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="366" y="96" width="122" height="168" stroke="#f59e0b" />
  <text class="mono" x="427" y="120" fill="#fcd34d" text-anchor="middle">High-Speed</text>
  <text class="mono" x="427" y="136" fill="#fcd34d" text-anchor="middle">Sync Latch</text>
  <text class="note" x="427" y="162" text-anchor="middle">CLK-aligned</text>
  <text class="note" x="427" y="179" text-anchor="middle">High-Cross-Pt</text>
  <text class="note" x="427" y="196" text-anchor="middle">Switch Drivers</text>
  <text class="mono" x="427" y="230" fill="#fca5a5" text-anchor="middle">&lt; 100 fs skew</text>

  <!-- Current Cell Array -->
  <line x1="488" y1="146" x2="526" y2="146" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr)" />
  <line x1="488" y1="223" x2="526" y2="223" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arr)" />

  <rect class="box" x="528" y="96" width="212" height="82" stroke="#34d399" />
  <text class="mono" x="634" y="118" fill="#6ee7b7" text-anchor="middle">63x Unary Current Cells</text>
  <text class="mono" x="634" y="138" fill="#e2e8f0" text-anchor="middle">Each = 2^L * I_LSB (Cascode)</text>
  <text class="note" x="634" y="158" text-anchor="middle">Common-centroid matrix layout</text>

  <rect class="box" x="528" y="186" width="212" height="78" stroke="#a78bfa" />
  <text class="mono" x="634" y="208" fill="#c4b5fd" text-anchor="middle">L Binary-Weighted Cells</text>
  <text class="mono" x="634" y="228" fill="#e2e8f0" text-anchor="middle">I_LSB, 2*I_LSB ... 2^(L-1)*I_LSB</text>
  <text class="note" x="634" y="248" text-anchor="middle">Reduced area vs pure unary</text>

  <!-- Differential Output Resistors -->
  <line x1="740" y1="140" x2="782" y2="160" stroke="#38bdf8" stroke-width="2" />
  <line x1="740" y1="222" x2="782" y2="202" stroke="#38bdf8" stroke-width="2" />
  <rect class="box" x="782" y="122" width="102" height="118" stroke="#38bdf8" />
  <text class="mono" x="833" y="146" fill="#7dd3fc" text-anchor="middle">Diff Load</text>
  <text class="mono" x="833" y="170" fill="#e2e8f0" text-anchor="middle">I_OUT+ (RL)</text>
  <text class="mono" x="833" y="190" fill="#e2e8f0" text-anchor="middle">I_OUT- (RL)</text>
  <text class="mono" x="833" y="218" fill="#6ee7b7" text-anchor="middle">Vdiff = dI * RL</text>

  <!-- Bottom Notes Bar -->
  <rect class="panel" x="20" y="324" width="880" height="62" />
  <text class="mono" x="36" y="348" fill="#6ee7b7">Why 6-MSB + 8-LSB = 14-Bit?</text>
  <text class="note" x="235" y="348">Pure unary = 16,383 cells (huge!). Pure binary = massive glitch/DNL. 6+8 segmentation uses only 63 + 8 = 71 switches!</text>
  <text class="mono" x="36" y="370" fill="#fcd34d">DEM / DWA Effect:</text>
  <text class="note" x="175" y="370">Converts harmonic mismatch spurs into shaped high-frequency noise (raises SFDR by 12-20 dB).</text>
</svg>
