<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .hdr { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .wire { stroke: #94a3b8; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">Two-Stage Miller OTA vs. Folded-Cascode OTA Topologies</text>
  <text class="sub" x="460" y="48">Comparing Rail-to-Rail Output Swing &amp; Compensation (Miller) Against Single-Stage Bandwidth (Folded Cascode)</text>

  <!-- Left Panel: Two-Stage Miller OTA -->
  <rect class="panel" x="20" y="64" width="430" height="328" />
  <text class="hdr" x="36" y="88" fill="#38bdf8">1. Two-Stage Miller OTA (with Nulling Resistor Rz)</text>
  <rect class="box" x="34" y="100" width="402" height="214" />

  <!-- Stage 1 & Stage 2 conceptual blocks -->
  <rect x="48" y="116" width="166" height="182" fill="#1e293b" stroke="#38bdf8" rx="6" />
  <text class="mono" x="131" y="136" fill="#7dd3fc" text-anchor="middle">Stage 1: Diff Pair</text>
  <text class="mono" x="131" y="156" fill="#e2e8f0" text-anchor="middle">M1 / M2 (NMOS/PMOS)</text>
  <text class="mono" x="131" y="176" fill="#e2e8f0" text-anchor="middle">+ Current Mirror Load</text>
  <rect x="64" y="192" width="134" height="52" fill="#0f172a" stroke="#334155" rx="4" />
  <text class="mono" x="131" y="212" fill="#94a3b8" text-anchor="middle">Gain1 = gm1 * (ro2||ro4)</text>
  <text class="mono" x="131" y="230" fill="#fcd34d" text-anchor="middle">High-Z Node (V1)</text>
  <text class="mono" x="131" y="274" fill="#cbd5e1" text-anchor="middle">IN+ , IN- -&gt; gm1</text>

  <!-- Miller Feedback Path (Rz + Cc) -->
  <line x1="214" y1="216" x2="256" y2="216" stroke="#38bdf8" stroke-width="1.8" />
  <circle cx="235" cy="216" r="3" fill="#f59e0b" />
  <line x1="235" y1="216" x2="235" y2="152" stroke="#f59e0b" stroke-width="1.6" />
  <rect x="252" y="140" width="42" height="24" fill="#0f172a" stroke="#f59e0b" rx="3" />
  <text class="mono" x="273" y="156" fill="#fcd34d" text-anchor="middle">Rz</text>
  <line x1="294" y1="152" x2="314" y2="152" stroke="#f59e0b" stroke-width="1.6" />
  <rect x="314" y="140" width="38" height="24" fill="#0f172a" stroke="#34d399" rx="3" />
  <text class="mono" x="333" y="156" fill="#6ee7b7" text-anchor="middle">Cc</text>
  <polyline points="352,152 384,152 384,216" fill="none" stroke="#34d399" stroke-width="1.6" />

  <!-- Stage 2: CS Output -->
  <rect x="256" y="182" width="166" height="116" fill="#1e293b" stroke="#34d399" rx="6" />
  <text class="mono" x="339" y="202" fill="#6ee7b7" text-anchor="middle">Stage 2: CS + Load</text>
  <text class="mono" x="339" y="222" fill="#e2e8f0" text-anchor="middle">Gain2 = -gm6 * (ro6||ro7)</text>
  <text class="mono" x="339" y="242" fill="#7dd3fc" text-anchor="middle">Output Swing: VDD-2Vov</text>
  <text class="mono" x="339" y="262" fill="#fca5a5" text-anchor="middle">Pole p2 ~ gm6 / CL</text>
  <circle cx="384" cy="216" r="3" fill="#34d399" />
  <line x1="384" y1="216" x2="432" y2="216" stroke="#34d399" stroke-width="1.6" />
  <text class="mono" x="415" y="208" fill="#6ee7b7">OUT</text>

  <rect class="box" x="34" y="322" width="402" height="58" />
  <text class="mono" x="46" y="342" fill="#7dd3fc">Av0 = Gain1 * Gain2 (70-90 dB) | UGF = gm1 / Cc</text>
  <text class="mono" x="46" y="362" fill="#fcd34d">Set Rz &gt; 1/gm6 to flip RHP zero into LHP pole-canceler</text>

  <!-- Right Panel: Folded-Cascode OTA -->
  <rect class="panel" x="470" y="64" width="430" height="328" />
  <text class="hdr" x="486" y="88" fill="#34d399">2. Folded-Cascode OTA (Single-Pole Dominated by CL)</text>
  <rect class="box" x="484" y="100" width="402" height="214" />

  <!-- Differential Input Fold -->
  <rect x="500" y="120" width="144" height="176" fill="#1e293b" stroke="#a78bfa" rx="6" />
  <text class="mono" x="572" y="140" fill="#c4b5fd" text-anchor="middle">Input Diff Pair</text>
  <text class="mono" x="572" y="160" fill="#e2e8f0" text-anchor="middle">PMOS M1 / M2</text>
  <text class="mono" x="572" y="180" fill="#94a3b8" text-anchor="middle">(or NMOS pair)</text>
  <text class="mono" x="572" y="210" fill="#fcd34d" text-anchor="middle">Allows ICMR down</text>
  <text class="mono" x="572" y="228" fill="#fcd34d" text-anchor="middle">to VSS (PMOS in)</text>
  <text class="mono" x="572" y="264" fill="#cbd5e1" text-anchor="middle">I_tail divided -&gt;</text>

  <!-- Folding Node -->
  <line x1="644" y1="205" x2="704" y2="205" stroke="#f59e0b" stroke-width="2" />
  <circle cx="674" cy="205" r="4" fill="#f59e0b" />
  <text class="mono" x="674" y="192" fill="#fcd34d" text-anchor="middle">Fold Node</text>
  <text class="mono" x="674" y="224" fill="#fca5a5" text-anchor="middle">Low-Z ~ 1/gm_cas</text>

  <!-- Cascode Output Stack -->
  <rect x="704" y="120" width="166" height="176" fill="#1e293b" stroke="#34d399" rx="6" />
  <text class="mono" x="787" y="140" fill="#6ee7b7" text-anchor="middle">Cascode Output Branch</text>
  <text class="mono" x="787" y="162" fill="#e2e8f0" text-anchor="middle">Active Cascode Load</text>
  <text class="mono" x="787" y="182" fill="#7dd3fc" text-anchor="middle">Rout ~ gm*ro^2</text>
  <text class="mono" x="787" y="212" fill="#6ee7b7" text-anchor="middle">CL IS Dominant Pole!</text>
  <text class="mono" x="787" y="232" fill="#94a3b8" text-anchor="middle">(Self-compensating</text>
  <text class="mono" x="787" y="248" fill="#94a3b8" text-anchor="middle">with larger CL)</text>
  <text class="mono" x="787" y="274" fill="#fca5a5" text-anchor="middle">Higher I_total, lower swing</text>

  <rect class="box" x="484" y="322" width="402" height="58" />
  <text class="mono" x="496" y="342" fill="#6ee7b7">Av0 = gm1 * Rout (55-75 dB) | UGF = gm1 / CL</text>
  <text class="mono" x="496" y="362" fill="#c4b5fd">No RHP zero! Ideal for high-speed SC &amp; Gain-Boosting</text>
</svg>
