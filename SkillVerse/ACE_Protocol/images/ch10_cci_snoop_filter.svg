<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Coherent Interconnect Snoop Filter Directory Architecture</text>

  <!-- Without Snoop Filter (Broadcast storm) -->
  <rect x="40" y="70" width="380" height="240" fill="#1e293b" stroke="#f87171" rx="8"/>
  <text x="230" y="95" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Without Snoop Filter: Broadcast Storm</text>
  <text x="230" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Every read/write request must broadcast snoops</text>
  <text x="230" y="150" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">to ALL 8 processor cores in the system!</text>
  <rect x="60" y="180" width="340" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="230" y="205" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Wasted L1 Tag lookups; high battery power drain!</text>
  <text x="230" y="255" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Cores stalled checking addresses they do not own</text>

  <!-- With Snoop Filter Directory -->
  <rect x="480" y="70" width="380" height="240" fill="#1e293b" stroke="#4ade80" rx="8"/>
  <text x="670" y="95" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">With Directory-Based Snoop Filter</text>
  <text x="670" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Interconnect maintains central directory of cached tags</text>
  
  <rect x="500" y="155" width="340" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="670" y="180" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Lookup: Address 0x8000_1000</text>
  <text x="670" y="200" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Directory: "Cached only in Core 2!"</text>

  <rect x="500" y="230" width="340" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="670" y="255" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop directed ONLY to Core 2 (Saves 85% Power!)</text>
</svg>