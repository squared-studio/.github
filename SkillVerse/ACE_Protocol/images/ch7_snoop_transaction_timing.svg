<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cycle-by-Cycle Snoop Handshake Timing (AC $ightarrow$ CR $ightarrow$ CD)</text>

  <g font-family="monospace" font-size="12">
    <!-- Cycles -->
    <text x="50" y="80" fill="#64748b">Cycle :</text>
    <text x="170" y="80" fill="#94a3b8">C1 (Snoop Req)</text>
    <text x="350" y="80" fill="#94a3b8">C2 (Lookup)</text>
    <text x="530" y="80" fill="#94a3b8">C3 (CR Resp)</text>
    <text x="710" y="80" fill="#94a3b8">C4 (CD Data)</text>

    <!-- AC Channel -->
    <text x="50" y="125" fill="#facc15">ACVALID:</text>
    <path d="M 140 135 L 210 135 L 210 115 L 390 115 L 390 135 L 820 135" fill="none" stroke="#facc15" stroke-width="2.5"/>

    <text x="50" y="155" fill="#facc15">ACREADY:</text>
    <path d="M 140 165 L 210 165 L 210 145 L 390 145 L 390 165 L 820 165" fill="none" stroke="#facc15" stroke-width="2"/>

    <text x="50" y="185" fill="#facc15">ACADDR :</text>
    <rect x="210" y="170" width="180" height="20" fill="#334155" rx="3"/>
    <text x="300" y="185" fill="#f8fafc" text-anchor="middle">0x8000_1040</text>

    <!-- CR Channel -->
    <text x="50" y="230" fill="#4ade80">CRVALID:</text>
    <path d="M 140 240 L 490 240 L 490 220 L 670 220 L 670 240 L 820 240" fill="none" stroke="#4ade80" stroke-width="2.5"/>

    <text x="50" y="260" fill="#4ade80">CRRESP :</text>
    <rect x="490" y="245" width="180" height="20" fill="#15803d" fill-opacity="0.3" stroke="#4ade80" rx="3"/>
    <text x="580" y="260" fill="#4ade80" text-anchor="middle">DataTransfer=1</text>

    <!-- CD Channel -->
    <text x="50" y="305" fill="#c084fc">CDVALID:</text>
    <path d="M 140 315 L 670 315 L 670 295 L 820 295" fill="none" stroke="#c084fc" stroke-width="2.5"/>

    <text x="50" y="330" fill="#c084fc">CDDATA :</text>
    <rect x="670" y="315" width="150" height="20" fill="#7e22ce" fill-opacity="0.3" stroke="#c084fc" rx="3"/>
    <text x="745" y="330" fill="#c084fc" text-anchor="middle">Cacheline Bytes</text>
  </g>
</svg>