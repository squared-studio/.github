<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <rect width="900" height="300" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE Barrier Encodings and Architectural Properties</text>

  <rect x="40" y="65" width="820" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
  <text x="120" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">AxBAR[1:0]</text>
  <text x="280" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Barrier Type</text>
  <text x="460" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Domain Scope</text>
  <text x="700" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Ordering Semantics</text>

  <!-- 00 -->
  <rect x="40" y="105" width="820" height="35" fill="#0f172a" stroke="#334155"/>
  <text x="120" y="128" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">2'b00</text>
  <text x="280" y="128" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Normal Access</text>
  <text x="460" y="128" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Determined by AxDOMAIN</text>
  <text x="700" y="128" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Standard load/store memory transaction</text>

  <!-- 01 -->
  <rect x="40" y="145" width="820" height="35" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="168" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">2'b01</text>
  <text x="280" y="168" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Memory Barrier</text>
  <text x="460" y="168" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Inner / Outer Domain</text>
  <text x="700" y="168" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Orders memory accesses; allows non-dependent code</text>

  <!-- 10 -->
  <rect x="40" y="185" width="820" height="35" fill="#0f172a" stroke="#334155"/>
  <text x="120" y="208" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">2'b10</text>
  <text x="280" y="208" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Synchronization Barrier</text>
  <text x="460" y="208" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Inner / Outer Domain</text>
  <text x="700" y="208" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Full system flush: all prior transfers must complete!</text>

  <!-- 11 -->
  <rect x="40" y="225" width="820" height="35" fill="#1e293b" stroke="#334155"/>
  <text x="120" y="248" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">2'b11</text>
  <text x="280" y="248" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Reserved</text>
  <text x="460" y="248" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">N/A</text>
  <text x="700" y="248" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Reserved for future AMBA extensions</text>
</svg>