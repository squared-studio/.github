<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <rect width="920" height="360" fill="#0f172a" rx="10"/>
  <text x="460" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE ReadShared Transaction: Peer Cache Forwarding (Dirty Owner)</text>

  <!-- Core 0 (Requester) -->
  <rect x="40" y="70" width="200" height="260" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="140" y="100" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 (Requester)</text>
  <text x="140" y="125" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">State: Invalid (I)</text>
  <rect x="55" y="145" width="170" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="140" y="170" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">1. Issues ReadShared</text>
  <rect x="55" y="220" width="170" height="50" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="140" y="242" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">4. Receives RDATA</text>
  <text x="140" y="260" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">New State: Shared Clean</text>

  <!-- CCI Interconnect -->
  <rect x="340" y="70" width="240" height="260" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="6"/>
  <text x="460" y="100" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">CCI Interconnect</text>
  <text x="460" y="125" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Snoop Filter: Core 1 has line!</text>
  <rect x="360" y="145" width="200" height="40" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="460" y="170" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">2. Drives AC (Snoop)</text>
  <rect x="360" y="220" width="200" height="50" fill="#0f172a" stroke="#c084fc" rx="4"/>
  <text x="460" y="242" fill="#c084fc" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Forwards CDDATA $ightarrow$ RDATA</text>
  <text x="460" y="260" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Does NOT write to RAM yet!</text>

  <!-- Core 1 (Snooped Peer) -->
  <rect x="680" y="70" width="200" height="260" fill="#1e293b" stroke="#f87171" stroke-width="2" rx="6"/>
  <text x="780" y="100" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 1 (Snooped)</text>
  <text x="780" y="125" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">State: Unique Dirty (UD)</text>
  <rect x="695" y="145" width="170" height="40" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="780" y="170" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">3. Receives ACADDR</text>
  <rect x="695" y="220" width="170" height="70" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="780" y="240" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Forwards CDDATA (Dirty)</text>
  <text x="780" y="258" fill="#4ade80" font-size="9" text-anchor="middle" font-family="sans-serif">CRRESP = PassDirty, IsShared</text>
  <text x="780" y="278" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">New State: Shared Dirty</text>

  <!-- Interconnect arrows -->
  <line x1="240" y1="165" x2="340" y2="165" stroke="#38bdf8" stroke-width="2"/>
  <line x1="580" y1="165" x2="680" y2="165" stroke="#facc15" stroke-width="2"/>
  <line x1="680" y1="245" x2="580" y2="245" stroke="#c084fc" stroke-width="2"/>
  <line x1="340" y1="245" x2="240" y2="245" stroke="#4ade80" stroke-width="2"/>
</svg>