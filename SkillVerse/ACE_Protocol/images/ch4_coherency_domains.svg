<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <rect width="880" height="340" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">The Four ACE Coherency Domains (AxDOMAIN[1:0])</text>

  <!-- System Domain (Outer Most) -->
  <rect x="40" y="60" width="800" height="250" fill="#1e293b" stroke="#facc15" stroke-dasharray="4" rx="10"/>
  <text x="140" y="85" fill="#facc15" font-size="13" font-weight="bold" font-family="sans-serif">System Domain (AxDOMAIN = 2'b11)</text>
  <text x="650" y="85" fill="#94a3b8" font-size="10" font-family="sans-serif">Includes Main DDR, PCIe, Non-coherent masters</text>

  <!-- Outer Shareable Domain -->
  <rect x="70" y="100" width="740" height="190" fill="#0f172a" stroke="#c084fc" stroke-width="2" rx="8"/>
  <text x="190" y="125" fill="#c084fc" font-size="13" font-weight="bold" font-family="sans-serif">Outer Shareable Domain (AxDOMAIN = 2'b10)</text>
  <text x="650" y="125" fill="#94a3b8" font-size="10" font-family="sans-serif">Cluster 0 + Cluster 1 + Coherent GPU</text>

  <!-- Inner Shareable Domain -->
  <rect x="100" y="140" width="450" height="130" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="250" y="165" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Inner Shareable Domain (AxDOMAIN = 2'b01)</text>
  
  <rect x="120" y="180" width="190" height="70" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="215" y="210" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 &amp; Core 1</text>
  <text x="215" y="230" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">SMP Operating System Kernel</text>

  <!-- Non-shareable Domain Box -->
  <rect x="580" y="140" width="230" height="130" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="695" y="165" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Non-Shareable (2'b00)</text>
  <text x="695" y="200" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Private Core Local Memory</text>
  <text x="695" y="220" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">NEVER SNOOPED!</text>
  <text x="695" y="240" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Zero bus snooping overhead</text>
</svg>