<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE WriteUnique Transaction (Uncached / Partial Line Write)</text>

  <rect x="50" y="80" width="200" height="220" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="150" y="110" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 (Master)</text>
  <text x="150" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Writes partial word to X</text>
  <text x="150" y="170" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">AWSNOOP = WriteUnique</text>
  <text x="150" y="210" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Streams WDATA beats</text>
  <text x="150" y="250" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Receives BVALID = OKAY</text>

  <rect x="350" y="80" width="200" height="220" fill="#1e293b" stroke="#c084fc" rx="6"/>
  <text x="450" y="110" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">CCI Interconnect</text>
  <text x="450" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">1. Broadcasts AC (MakeInvalid)</text>
  <text x="450" y="180" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">2. Waits for all CR responses</text>
  <text x="450" y="215" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">3. Updates Main Memory</text>
  <text x="450" y="250" fill="#c084fc" font-size="10" text-anchor="middle" font-family="sans-serif">4. Asserts BVALID to Core 0</text>

  <rect x="650" y="80" width="200" height="220" fill="#1e293b" stroke="#f87171" rx="6"/>
  <text x="750" y="110" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 1 (Peer Cache)</text>
  <text x="750" y="145" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Holds line in Shared (SC)</text>
  <text x="750" y="180" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Receives AC (MakeInvalid)</text>
  <text x="750" y="210" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Invalidates line $ightarrow$ I</text>
  <text x="750" y="250" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">CRRESP = 0 (No data)</text>
</svg>