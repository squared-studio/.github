<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <rect width="920" height="420" fill="#0f172a" rx="10"/>
  <rect x="15" y="15" width="890" height="390" fill="none" stroke="#1e293b" stroke-width="2" rx="8"/>
  <text x="460" y="45" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">AMBA ACE Hardware Cache-Coherent System Topology</text>

  <!-- Cluster 0 (ACE Master) -->
  <rect x="40" y="80" width="220" height="150" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="150" y="105" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">CPU Cluster 0 (ACE)</text>
  <rect x="55" y="125" width="85" height="45" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="97" y="152" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 0 (L1)</text>
  <rect x="155" y="125" width="85" height="45" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="197" y="152" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 1 (L1)</text>
  <rect x="55" y="180" width="185" height="35" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="147" y="202" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared L2 Cache</text>

  <!-- Cluster 1 (ACE Master) -->
  <rect x="40" y="250" width="220" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="150" y="275" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">CPU Cluster 1 (ACE)</text>
  <rect x="55" y="295" width="85" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="97" y="320" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 2 (L1)</text>
  <rect x="155" y="295" width="85" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="197" y="320" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 3 (L1)</text>
  <rect x="55" y="345" width="185" height="35" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="147" y="367" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared L2 Cache</text>

  <!-- Coherent Interconnect (CCI) -->
  <rect x="330" y="80" width="260" height="310" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" rx="8"/>
  <text x="460" y="110" fill="#c084fc" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Coherent Interconnect</text>
  <text x="460" y="130" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(e.g. CoreLink CCI-500 / CCN)</text>

  <rect x="350" y="150" width="220" height="60" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="460" y="175" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop Filter Directory</text>
  <text x="460" y="195" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Tracks L1/L2 tags across clusters</text>

  <rect x="350" y="225" width="220" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="460" y="250" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Coherency Crossbar</text>
  <text x="460" y="270" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Snoop generation &amp; response routing</text>

  <rect x="350" y="300" width="220" height="60" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="460" y="325" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">DVM Sync Engine</text>
  <text x="460" y="345" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">TLB &amp; Branch Predictor Broadcast</text>

  <!-- ACE Links -->
  <line x1="260" y1="155" x2="330" y2="155" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="295" y="145" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="sans-serif">Full ACE</text>
  <line x1="260" y1="320" x2="330" y2="320" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="295" y="310" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="sans-serif">Full ACE</text>

  <!-- I/O Coherent Master (ACE-Lite) -->
  <rect x="670" y="80" width="210" height="90" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="6"/>
  <text x="775" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">GPU / DMA Engine</text>
  <text x="775" y="130" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">(ACE-Lite Master - Uncached)</text>
  <text x="775" y="150" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Snoops CPU Caches directly</text>
  <line x1="590" y1="125" x2="670" y2="125" stroke="#4ade80" stroke-width="2.5"/>
  <text x="630" y="115" fill="#4ade80" font-size="9" text-anchor="middle" font-family="sans-serif">ACE-Lite</text>

  <!-- Memory Controller (Main DDR) -->
  <rect x="670" y="210" width="210" height="85" fill="#1e293b" stroke="#facc15" stroke-width="2" rx="6"/>
  <text x="775" y="240" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">DDR Memory Subsystem</text>
  <text x="775" y="265" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Main RAM (AXI4 Slave)</text>
  <line x1="590" y1="250" x2="670" y2="250" stroke="#facc15" stroke-width="2"/>
  <text x="630" y="240" fill="#facc15" font-size="9" text-anchor="middle" font-family="sans-serif">AXI4</text>

  <!-- Downstream Peripherals -->
  <rect x="670" y="315" width="210" height="75" fill="#1e293b" stroke="#64748b" rx="6"/>
  <text x="775" y="345" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Non-Coherent Peripherals</text>
  <text x="775" y="368" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">PCIe / APB Subsystem</text>
  <line x1="590" y1="350" x2="670" y2="350" stroke="#64748b" stroke-width="2"/>
</svg>