<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">The 5 ACE Cache Line States (MOESI Model)</text>

  <!-- State Invalid (I) -->
  <circle cx="120" cy="180" r="45" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
  <text x="120" y="175" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Invalid</text>
  <text x="120" y="195" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(I)</text>

  <!-- State Unique Clean (UC) -->
  <circle cx="370" cy="100" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="370" y="95" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique Clean</text>
  <text x="370" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(UC)</text>

  <!-- State Unique Dirty (UD) -->
  <circle cx="680" cy="100" r="45" fill="#1e293b" stroke="#f87171" stroke-width="2.5"/>
  <text x="680" y="95" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique Dirty</text>
  <text x="680" y="115" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(UD / Modified)</text>

  <!-- State Shared Clean (SC) -->
  <circle cx="370" cy="260" r="45" fill="#1e293b" stroke="#4ade80" stroke-width="2.5"/>
  <text x="370" y="255" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared Clean</text>
  <text x="370" y="275" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(SC)</text>

  <!-- State Shared Dirty (SD) -->
  <circle cx="680" cy="260" r="45" fill="#1e293b" stroke="#facc15" stroke-width="2.5"/>
  <text x="680" y="255" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared Dirty</text>
  <text x="680" y="275" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(SD / Owner)</text>

  <!-- Transitions -->
  <!-- I to UC (ReadClean) -->
  <path d="M 160 160 Q 250 100 325 100" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text x="240" y="110" fill="#38bdf8" font-size="9" text-anchor="middle" font-family="sans-serif">ReadClean</text>

  <!-- UC to UD (Local Write hit) -->
  <path d="M 415 100 L 635 100" fill="none" stroke="#f87171" stroke-width="2"/>
  <text x="525" y="90" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Write Hit (Zero Bus Traffic!)</text>

  <!-- I to SC (ReadShared) -->
  <path d="M 160 200 Q 250 260 325 260" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="240" y="255" fill="#4ade80" font-size="9" text-anchor="middle" font-family="sans-serif">ReadShared</text>

  <!-- UD to SD (Snoop ReadShared hit) -->
  <path d="M 680 145 L 680 215" fill="none" stroke="#facc15" stroke-width="2"/>
  <text x="735" y="180" fill="#facc15" font-size="9" text-anchor="middle" font-family="sans-serif">Snooped by Peer</text>

  <!-- SD/SC to I (Snoop Invalidate) -->
  <path d="M 640 270 Q 400 340 160 205" fill="none" stroke="#f87171" stroke-dasharray="3" stroke-width="1.5"/>
  <text x="400" y="335" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Snoop CleanInvalid / MakeInvalid (Evicted to Invalid)</text>
</svg>