<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE-Lite One-Way I/O Coherency Architecture</text>

  <!-- ACE-Lite Master -->
  <rect x="40" y="70" width="220" height="230" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="150" y="100" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE-Lite Master</text>
  <text x="150" y="120" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(e.g. DMA, PCIe, GPU)</text>

  <rect x="55" y="140" width="190" height="40" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="150" y="165" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">5 AXI Channels (AW, W, B, AR, R)</text>

  <rect x="55" y="195" width="190" height="50" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="150" y="217" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">ZERO Snoop Channels!</text>
  <text x="150" y="235" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">(No AC, CR, CD wires required)</text>

  <text x="150" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Drives ARSNOOP=ReadOnce</text>

  <!-- Interconnect -->
  <rect x="340" y="70" width="220" height="230" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="8"/>
  <text x="450" y="100" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Coherent Fabric (CCI)</text>
  <text x="450" y="140" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Snoops CPU cluster</text>
  <text x="450" y="165" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Extracts latest data</text>
  <text x="450" y="195" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Returns data to DMA on RDATA</text>

  <!-- CPU Cluster -->
  <rect x="640" y="70" width="220" height="230" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="750" y="100" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">CPU Core Cluster</text>
  <text x="750" y="140" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Holds Dirty Buffer in L1</text>
  <text x="750" y="170" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Snooped by CCI over AC</text>
  <text x="750" y="200" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">Supplies data over CD</text>
  <text x="750" y="240" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Zero software cache flushes!</text>

  <!-- Connectors -->
  <line x1="260" y1="160" x2="340" y2="160" stroke="#4ade80" stroke-width="2"/>
  <line x1="560" y1="160" x2="640" y2="160" stroke="#facc15" stroke-width="2"/>
</svg>