<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Interconnect Snoop Decision Tree by Coherency Domain</text>

  <!-- Step 1 -->
  <rect x="50" y="80" width="180" height="60" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="140" y="105" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Master Request</text>
  <text x="140" y="125" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Checks ARDOMAIN[1:0]</text>

  <!-- Branch -->
  <line x1="230" y1="110" x2="310" y2="110" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Decision Box -->
  <polygon points="400,70 480,110 400,150 320,110" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="400" y="115" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Domain?</text>

  <!-- Non-shareable branch -->
  <line x1="400" y1="70" x2="400" y2="50" stroke="#f87171" stroke-width="2"/>
  <line x1="400" y1="50" x2="560" y2="50" stroke="#f87171" stroke-width="2"/>
  <rect x="560" y="25" width="280" height="50" fill="#1e293b" stroke="#f87171" rx="4"/>
  <text x="700" y="47" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Non-Shareable (00): DO NOT SNOOP</text>
  <text x="700" y="65" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Route directly to Memory; zero peer cache snoops</text>

  <!-- Shareable branch -->
  <line x1="480" y1="110" x2="560" y2="110" stroke="#4ade80" stroke-width="2"/>
  <rect x="560" y="85" width="280" height="50" fill="#1e293b" stroke="#4ade80" rx="4"/>
  <text x="700" y="107" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Inner Shareable (01): SNOOP INNER</text>
  <text x="700" y="125" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Broadcast snoops only to sibling cores in cluster</text>

  <!-- Outer shareable branch -->
  <line x1="400" y1="150" x2="400" y2="190" stroke="#c084fc" stroke-width="2"/>
  <line x1="400" y1="190" x2="560" y2="190" stroke="#c084fc" stroke-width="2"/>
  <rect x="560" y="165" width="280" height="50" fill="#1e293b" stroke="#c084fc" rx="4"/>
  <text x="700" y="187" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Outer Shareable (10): SNOOP ALL</text>
  <text x="700" y="205" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Broadcast snoops to other clusters &amp; coherent GPU</text>

  <text x="440" y="270" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Domain filtering protects private threads from cache snoop traffic storms.</text>
</svg>