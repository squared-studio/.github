<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE Memory Barrier Execution and Completion Flow</text>

  <!-- Step 1 -->
  <rect x="40" y="80" width="180" height="180" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="130" y="110" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">1. Barrier Request</text>
  <text x="130" y="145" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">CPU executes DMB/DSB</text>
  <text x="130" y="175" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">AxBAR[1:0] != 0</text>
  <text x="130" y="205" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Stalls post-barrier</text>
  <text x="130" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">instructions in core</text>

  <line x1="220" y1="170" x2="270" y2="170" stroke="#38bdf8" stroke-width="2"/>

  <!-- Step 2 -->
  <rect x="270" y="80" width="360" height="180" fill="#1e293b" stroke="#facc15" stroke-width="2" rx="6"/>
  <text x="450" y="110" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">2. Interconnect Barrier Resolution</text>
  <rect x="290" y="130" width="320" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="450" y="155" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Tracks all outstanding transactions issued prior to barrier</text>
  <rect x="290" y="185" width="320" height="45" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="450" y="205" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">All prior stores commit to target memory endpoints</text>
  <text x="450" y="222" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">All prior peer snoops finish resolution</text>

  <line x1="630" y1="170" x2="680" y2="170" stroke="#4ade80" stroke-width="2"/>

  <!-- Step 3 -->
  <rect x="680" y="80" width="180" height="180" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="770" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">3. Barrier Complete</text>
  <text x="770" y="145" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">RRESP / BRESP = OKAY</text>
  <text x="770" y="175" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Interconnect acknowledges</text>
  <text x="770" y="205" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">CPU pipeline unblocks</text>
  <text x="770" y="225" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">Post-barrier code executes</text>
</svg>