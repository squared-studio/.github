<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <rect width="900" height="300" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE 5-State Cache Line Attribute Matrix</text>

  <rect x="40" y="65" width="820" height="35" fill="#1e293b" stroke="#38bdf8" rx="4"/>
  <text x="130" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE Cache State</text>
  <text x="280" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Valid?</text>
  <text x="390" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique / Shared?</text>
  <text x="540" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Clean / Dirty?</text>
  <text x="730" y="88" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Memory Update Responsibility</text>

  <!-- Invalid -->
  <rect x="40" y="105" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="130" y="125" fill="#94a3b8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Invalid (I)</text>
  <text x="280" y="125" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">No</text>
  <text x="390" y="125" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">N/A</text>
  <text x="540" y="125" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">N/A</text>
  <text x="730" y="125" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">None</text>

  <!-- Unique Clean -->
  <rect x="40" y="140" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="160" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique Clean (UC)</text>
  <text x="280" y="160" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Yes</text>
  <text x="390" y="160" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique (1 copy)</text>
  <text x="540" y="160" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Clean</text>
  <text x="730" y="160" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">None (Memory is up-to-date)</text>

  <!-- Unique Dirty -->
  <rect x="40" y="175" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="130" y="195" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique Dirty (UD)</text>
  <text x="280" y="195" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Yes</text>
  <text x="390" y="195" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Unique (1 copy)</text>
  <text x="540" y="195" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Dirty</text>
  <text x="730" y="195" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Must write back to RAM upon eviction</text>

  <!-- Shared Clean -->
  <rect x="40" y="210" width="820" height="30" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="230" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared Clean (SC)</text>
  <text x="280" y="230" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Yes</text>
  <text x="390" y="230" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Shared (&gt;=1 copy)</text>
  <text x="540" y="230" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Clean</text>
  <text x="730" y="230" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">None (Another master or RAM holds copy)</text>

  <!-- Shared Dirty -->
  <rect x="40" y="245" width="820" height="30" fill="#0f172a" stroke="#334155"/>
  <text x="130" y="265" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Shared Dirty (SD)</text>
  <text x="280" y="265" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Yes</text>
  <text x="390" y="265" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Shared (&gt;=1 copy)</text>
  <text x="540" y="265" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Dirty (Owner)</text>
  <text x="730" y="265" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Sole owner responsible for memory writeback!</text>
</svg>