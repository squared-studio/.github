<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cache Line Eviction: WriteBack vs. Evict</text>

  <rect x="50" y="70" width="360" height="200" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="6"/>
  <text x="230" y="100" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Dirty Line Eviction: WriteBack</text>
  <text x="230" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Cache state is Unique Dirty (UD) or Shared Dirty (SD)</text>
  <text x="230" y="160" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">AWSNOOP = WriteBack</text>
  <text x="230" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Master transmits entire dirty line on WDATA to memory</text>
  <text x="230" y="225" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Line transitions to Invalid (I)</text>

  <rect x="470" y="70" width="360" height="200" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="6"/>
  <text x="650" y="100" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Clean Line Eviction: Evict</text>
  <text x="650" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Cache state is Unique Clean (UC)</text>
  <text x="650" y="160" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">AWSNOOP = Evict (Address only!)</text>
  <text x="650" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Zero data payload transmitted! (Memory already matches)</text>
  <text x="650" y="225" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Notifies Interconnect Snoop Filter that line is gone</text>
</svg>