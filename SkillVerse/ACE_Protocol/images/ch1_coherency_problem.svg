<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">The Cache Coherency Problem in Multi-Core Systems</text>

  <!-- Core 0 with Cache -->
  <rect x="50" y="70" width="220" height="150" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="160" y="95" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 (CPU)</text>
  <rect x="70" y="115" width="180" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="160" y="140" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">L1 Cache: [X = 42] (Dirty)</text>
  <text x="160" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 0 writes 42 to X</text>
  <text x="160" y="205" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">(Write-back cached in L1)</text>

  <!-- Core 1 with Stale Cache -->
  <rect x="610" y="70" width="220" height="150" fill="#1e293b" stroke="#f87171" rx="6"/>
  <text x="720" y="95" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 1 (CPU)</text>
  <rect x="630" y="115" width="180" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="720" y="140" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">L1 Cache: [X = 10] (Stale!)</text>
  <text x="720" y="185" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Core 1 reads stale X = 10!</text>
  <text x="720" y="205" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">DATA INCONSISTENCY BUG!</text>

  <!-- Main Memory (Stale) -->
  <rect x="330" y="190" width="220" height="60" fill="#0f172a" stroke="#facc15" stroke-width="2" rx="6"/>
  <text x="440" y="215" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Main RAM: [X = 10]</text>
  <text x="440" y="235" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">(Memory has not received update yet)</text>

  <!-- Solution Box -->
  <rect x="50" y="260" width="780" height="45" fill="#1e293b" stroke="#4ade80" rx="4"/>
  <text x="440" y="288" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">AMBA ACE Solution: Hardware Snooping intercepts accesses and forwards dirty line [X=42] directly!</text>
</svg>