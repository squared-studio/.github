<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <rect width="900" height="340" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop Response (CRRESP[4:0]) Bitfield Architecture</text>

  <rect x="40" y="65" width="820" height="35" fill="#1e293b" stroke="#4ade80" rx="4"/>
  <text x="110" y="88" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bit</text>
  <text x="250" y="88" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Mnemonic</text>
  <text x="560" y="88" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Architectural Meaning &amp; Hardware Action</text>

  <!-- Bit 0 -->
  <rect x="40" y="105" width="820" height="35" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="128" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[0]</text>
  <text x="250" y="128" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">DataTransfer</text>
  <text x="560" y="128" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 = Master has data and will supply it on the CD channel.</text>

  <!-- Bit 1 -->
  <rect x="40" y="145" width="820" height="35" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="168" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[1]</text>
  <text x="250" y="168" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Error</text>
  <text x="560" y="168" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 = Master encountered an unrecoverable cache parity/ECC error.</text>

  <!-- Bit 2 -->
  <rect x="40" y="185" width="820" height="35" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="208" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[2]</text>
  <text x="250" y="208" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">PassDirty</text>
  <text x="560" y="208" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 = Master is passing responsibility for writing dirty data back to memory.</text>

  <!-- Bit 3 -->
  <rect x="40" y="225" width="820" height="35" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="248" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[3]</text>
  <text x="250" y="248" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">IsShared</text>
  <text x="560" y="248" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 = Master is retaining a valid copy of the cache line in Shared state.</text>

  <!-- Bit 4 -->
  <rect x="40" y="265" width="820" height="35" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="288" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[4]</text>
  <text x="250" y="288" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">WasUnique</text>
  <text x="560" y="288" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">1 = Cache line was in a Unique state (UC or UD) before the snoop.</text>
</svg>