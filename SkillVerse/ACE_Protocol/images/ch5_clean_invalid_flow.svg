<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE CleanInvalid Transaction (Cache Maintenance)</text>

  <rect x="50" y="70" width="200" height="180" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="150" y="100" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Initiator (DMA / OS)</text>
  <text x="150" y="140" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Issues CleanInvalid</text>
  <text x="150" y="165" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Flushes CPU caches</text>
  <text x="150" y="190" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">prior to DMA transmission</text>

  <rect x="340" y="70" width="200" height="180" fill="#1e293b" stroke="#c084fc" rx="6"/>
  <text x="440" y="100" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">CCI Interconnect</text>
  <text x="440" y="140" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Snoops CPU cores</text>
  <text x="440" y="165" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">If dirty, writes to RAM</text>
  <text x="440" y="190" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Forces CPU line to INVALID</text>

  <rect x="630" y="70" width="200" height="180" fill="#1e293b" stroke="#f87171" rx="6"/>
  <text x="730" y="100" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">CPU Core Cache</text>
  <text x="730" y="135" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Flushes dirty byte to CCI</text>
  <text x="730" y="170" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Line $ightarrow$ INVALID (I)</text>
  <text x="730" y="210" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">CRRESP = PassDirty</text>

  <text x="440" y="275" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Guarantees main memory contains fresh data and peer caches do not hold stale lines.</text>
</svg>