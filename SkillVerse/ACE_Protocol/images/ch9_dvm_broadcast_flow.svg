<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" fill="#0f172a" rx="10"/>
  <text x="460" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Distributed Virtual Memory (DVM) Invalidation Broadcast Flow</text>

  <rect x="40" y="70" width="220" height="230" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="150" y="100" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 0 (OS Page Fault)</text>
  <text x="150" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Updates Virtual Page Table</text>
  <rect x="55" y="150" width="190" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="150" y="175" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Issues TLBI (DVM Message)</text>
  <text x="150" y="220" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">DVM Sync $ightarrow$ Waits for complete</text>

  <rect x="330" y="70" width="260" height="230" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="6"/>
  <text x="460" y="100" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">CCI DVM Controller</text>
  <rect x="350" y="130" width="220" height="45" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="460" y="155" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Broadcasts DVM Snoop on AC</text>
  <rect x="350" y="190" width="220" height="45" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="460" y="215" fill="#4ade80" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Collects Sync Acknowledgments</text>
  <text x="460" y="265" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Returns DVM Complete to Core 0</text>

  <rect x="660" y="70" width="220" height="230" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="770" y="100" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Core 1 (MMU / TLB)</text>
  <text x="770" y="130" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Receives DVM Snoop on AC</text>
  <rect x="675" y="150" width="190" height="40" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="770" y="175" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Invalidates Local TLB Entry</text>
  <text x="770" y="220" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">Responds CR = OKAY (Done)</text>

  <!-- Connectors -->
  <line x1="260" y1="170" x2="330" y2="170" stroke="#38bdf8" stroke-width="2"/>
  <line x1="590" y1="150" x2="660" y2="150" stroke="#facc15" stroke-width="2"/>
  <line x1="660" y1="210" x2="590" y2="210" stroke="#4ade80" stroke-width="2"/>
</svg>