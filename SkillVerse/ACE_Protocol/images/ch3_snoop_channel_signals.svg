<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACE Snoop Channels: Signal Flow and Flow Control</text>

  <!-- AC Channel -->
  <rect x="40" y="70" width="260" height="220" fill="#1e293b" stroke="#facc15" rx="6"/>
  <text x="170" y="95" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop Address (AC)</text>
  <text x="170" y="115" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Interconnect $ightarrow$ Master</text>
  <rect x="55" y="130" width="230" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="170" y="152" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">ACADDR[ADDR_WIDTH-1:0]</text>
  <rect x="55" y="175" width="230" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="170" y="197" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">ACSNOOP[3:0] (Snoop Type)</text>
  <rect x="55" y="220" width="230" height="35" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="170" y="242" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">ACVALID &amp; ACREADY Handshake</text>

  <!-- CR Channel -->
  <rect x="320" y="70" width="260" height="220" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="450" y="95" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop Response (CR)</text>
  <text x="450" y="115" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Master $ightarrow$ Interconnect</text>
  <rect x="335" y="130" width="230" height="60" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="450" y="155" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRRESP[4:0]</text>
  <text x="450" y="175" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">DataTransfer, PassDirty, IsShared</text>
  <rect x="335" y="200" width="230" height="55" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="450" y="225" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">CRVALID &amp; CRREADY</text>
  <text x="450" y="245" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">CRVALID must not wait for CDREADY</text>

  <!-- CD Channel -->
  <rect x="600" y="70" width="260" height="220" fill="#1e293b" stroke="#c084fc" rx="6"/>
  <text x="730" y="95" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Snoop Data (CD)</text>
  <text x="730" y="115" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Master $ightarrow$ Interconnect</text>
  <rect x="615" y="130" width="230" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="730" y="152" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">CDDATA[DATA_WIDTH-1:0]</text>
  <rect x="615" y="175" width="230" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="730" y="197" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">CDLAST (Last Beat Flag)</text>
  <rect x="615" y="220" width="230" height="35" fill="#0f172a" stroke="#c084fc" rx="4"/>
  <text x="730" y="242" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">CDVALID &amp; CDREADY Handshake</text>
</svg>