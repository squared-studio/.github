<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .scope-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .scope-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .scope-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .wire-stack { stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arr-func" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">Bash Function Execution Stack &amp; Variable Scoping</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Managing positional parameters, local encapsulation, and dual return channels</text>

  <!-- Left: Global Script Scope (x = 40, width = 280, height = 370) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="280" height="380" class="scope-box" style="stroke: #f59e0b; fill: #17150a;"/>
    <text x="140" y="28" text-anchor="middle" class="scope-title" style="fill: #f59e0b;">GLOBAL SCRIPT SCOPE</text>
    <text x="140" y="48" text-anchor="middle" class="scope-sub">Default Variable Visibility</text>

    <!-- Global Variables -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="250" height="85" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" class="code-key" style="fill:#fbbf24;">GLOBAL VARIABLES</text>
      <text x="12" y="42" class="code-key" style="fill:#cbd5e1;">DB_HOST="db.prod.internal"</text>
      <text x="12" y="60" class="code-key" style="fill:#cbd5e1;">LOG_LEVEL="INFO"</text>
      <text x="12" y="76" class="desc-txt" style="font-size:10px; fill:#94a3b8;">Visible to ALL functions and scripts</text>
    </g>

    <!-- Script Positional Params -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="250" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" class="code-key" style="fill:#fbbf24;">SCRIPT ARGUMENTS</text>
      <text x="12" y="42" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#fcd34d;">$0</tspan> : Script name (e.g. ./deploy.sh)</text>
      <text x="12" y="62" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#fcd34d;">$1, $2</tspan> : First / Second script args</text>
      <text x="12" y="82" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#fcd34d;">${10}</tspan> : Double digits require braces</text>
      <text x="12" y="100" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#fcd34d;">$#</tspan> : Total count of arguments</text>
    </g>

    <text x="140" y="315" text-anchor="middle" class="desc-txt" style="font-size:11px; fill:#fca5a5;">Without 'local', function variables</text>
    <text x="140" y="335" text-anchor="middle" class="desc-txt" style="font-size:11px; fill:#fca5a5;">bleed into the global namespace!</text>
  </g>

  <!-- Wire: Global -> Function Call -->
  <path d="M 320 220 L 368 220" class="wire-stack" marker-end="url(#arr-func)"/>

  <!-- Middle: Function Call Stack (x = 370, width = 310, height = 370) -->
  <g transform="translate(370, 75)">
    <rect x="0" y="0" width="310" height="380" class="scope-box" style="stroke: #34d399; fill: #0b1f1a;"/>
    <text x="155" y="28" text-anchor="middle" class="scope-title" style="fill: #34d399;">FUNCTION FRAME</text>
    <text x="155" y="48" text-anchor="middle" class="scope-sub">Isolated Local Scope &amp; Parameters</text>

    <!-- Local Variables -->
    <g transform="translate(15, 68)">
      <rect x="0" y="0" width="280" height="85" rx="6" fill="#0f172a" stroke="#34d399;"/>
      <text x="12" y="22" class="code-key" style="fill:#34d399;">ENCAPSULATED (local)</text>
      <text x="12" y="42" class="code-key" style="fill:#6ee7b7;">local payload="$1"</text>
      <text x="12" y="60" class="code-key" style="fill:#6ee7b7;">local status=0</text>
      <text x="12" y="76" class="desc-txt" style="font-size:10px; fill:#a7f3d0;">Destroyed upon function exit</text>
    </g>

    <!-- Function-Specific Positional Params -->
    <g transform="translate(15, 170)">
      <rect x="0" y="0" width="280" height="110" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="22" class="code-key" style="fill:#38bdf8;">FUNCTION PARAMETERS</text>
      <text x="12" y="42" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#7dd3fc;">$1, $2</tspan> : Parameters passed to function</text>
      <text x="12" y="62" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#7dd3fc;">"$@"</tspan> : Exact array of args (preserves spaces)</text>
      <text x="12" y="82" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#7dd3fc;">"$*"</tspan> : Single concatenated string ($IFS)</text>
      <text x="12" y="100" class="desc-txt" style="font-size:11px;"><tspan class="code-key" style="fill:#7dd3fc;">shift</tspan> : Pops $1, shifts remaining left</text>
    </g>

    <!-- Dual Return Channels -->
    <g transform="translate(15, 295)">
      <rect x="0" y="0" width="280" height="65" rx="6" fill="#1e1b4b; stroke:#a855f7;"/>
      <text x="12" y="22" class="code-key" style="fill:#c084fc;">TWO RETURN MECHANISMS</text>
      <text x="12" y="42" class="desc-txt" style="font-size:11px;">1. Exit Code: <tspan class="code-key" style="fill:#fbbf24;">return 0..255 ($?)</tspan></text>
      <text x="12" y="58" class="desc-txt" style="font-size:11px;">2. Data: <tspan class="code-key" style="fill:#38bdf8;">echo "$val" &amp; subshell capture</tspan></text>
    </g>
  </g>

  <!-- Right: Return Value Capture (x = 700, width = 220, height = 370) -->
  <g transform="translate(705, 75)">
    <rect x="0" y="0" width="215" height="380" class="scope-box" style="stroke: #a855f7; fill: #1c1033;"/>
    <text x="107" y="28" text-anchor="middle" class="scope-title" style="fill: #a855f7;">CALLER CAPTURE</text>
    <text x="107" y="48" text-anchor="middle" class="scope-sub">Receiving Output</text>

    <!-- Method A -->
    <g transform="translate(12, 70)">
      <rect x="0" y="0" width="190" height="95" rx="6" fill="#0f172a" stroke="#a855f7"/>
      <text x="10" y="22" class="code-key" style="fill:#e9d5ff;">Channel 1: Status</text>
      <text x="10" y="42" class="desc-txt" style="font-size:11px;">check_health</text>
      <text x="10" y="60" class="code-key" style="fill:#fcd34d;">if [ $? -eq 0 ]; then</text>
      <text x="10" y="78" class="desc-txt" style="font-size:11px;">  echo "OK"</text>
    </g>

    <!-- Method B -->
    <g transform="translate(12, 185)">
      <rect x="0" y="0" width="190" height="110" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="10" y="22" class="code-key" style="fill:#7dd3fc;">Channel 2: Text / Data</text>
      <text x="10" y="42" class="desc-txt" style="font-size:11px;">Using Command Sub:</text>
      <text x="10" y="64" class="code-key" style="fill:#38bdf8; font-size:11px;">result=$(calc_hash)</text>
      <text x="10" y="86" class="desc-txt" style="font-size:11px;">Captures everything</text>
      <text x="10" y="100" class="desc-txt" style="font-size:11px;">function sent to stdout!</text>
    </g>
  </g>
</svg>
