<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .stage-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .stage-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .stage-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .wire-pipe { stroke: #38bdf8; stroke-width: 2.2; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arr-pipe" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">The Unix Text Processing Triad: Grep, Sed &amp; Awk</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Architecting high-throughput data pipelines using Unix stream processing primitives</text>

  <!-- 3 Stages Pipeline (y = 75 to 270) -->

  <!-- Stage 1: GREP (Line Filter) -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="260" height="195" class="stage-box" style="stroke:#38bdf8; fill:#0c1f36;"/>
    <text x="130" y="26" text-anchor="middle" class="stage-title" style="fill:#38bdf8;">1. GREP: LINE FILTER</text>
    <text x="130" y="44" text-anchor="middle" class="stage-sub">Global Regular Expression Print</text>

    <g transform="translate(15, 60)">
      <text x="0" y="16" class="code-key" style="fill:#7dd3fc;">Role: Select / Discard Lines</text>
      <text x="0" y="38" class="desc-txt">• <tspan class="code-key" style="fill:#38bdf8;">grep -E</tspan> Extended Regex (ERE)</text>
      <text x="0" y="58" class="desc-txt">• <tspan class="code-key" style="fill:#38bdf8;">grep -v</tspan> Invert match (exclude)</text>
      <text x="0" y="78" class="desc-txt">• <tspan class="code-key" style="fill:#38bdf8;">grep -P</tspan> PCRE Perl lookaheads</text>
      <text x="0" y="98" class="desc-txt">• Fast C search algorithm (Boyer-Moore)</text>
      <text x="0" y="118" class="code-key" style="font-size:11px; fill:#34d399;">grep -E "ERROR|WARN" app.log</text>
    </g>
  </g>

  <!-- Pipe 1 -> 2 -->
  <path d="M 300 172 L 348 172" class="wire-pipe" marker-end="url(#arr-pipe)"/>
  <rect x="312" y="160" width="25" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="324" y="174" text-anchor="middle" class="code-key" style="fill:#38bdf8; font-size:12px;">|</text>

  <!-- Stage 2: SED (Stream Editor) -->
  <g transform="translate(350, 75)">
    <rect x="0" y="0" width="260" height="195" class="stage-box" style="stroke:#f59e0b; fill:#1c150b;"/>
    <text x="130" y="26" text-anchor="middle" class="stage-title" style="fill:#f59e0b;">2. SED: STREAM EDITOR</text>
    <text x="130" y="44" text-anchor="middle" class="stage-sub">Transformations &amp; Substitutions</text>

    <g transform="translate(15, 60)">
      <text x="0" y="16" class="code-key" style="fill:#fcd34d;">Role: In-Flight String Mutator</text>
      <text x="0" y="38" class="desc-txt">• <tspan class="code-key" style="fill:#f59e0b;">s/old/new/g</tspan> Pattern substitution</text>
      <text x="0" y="58" class="desc-txt">• <tspan class="code-key" style="fill:#f59e0b;">/pattern/d</tspan> Delete matching lines</text>
      <text x="0" y="78" class="desc-txt">• Pattern Space vs Hold Space buffers</text>
      <text x="0" y="98" class="desc-txt">• Capture backreferences: \1, \2</text>
      <text x="0" y="118" class="code-key" style="font-size:11px; fill:#34d399;">sed 's/.*ERROR: //g'</text>
    </g>
  </g>

  <!-- Pipe 2 -> 3 -->
  <path d="M 610 172 L 658 172" class="wire-pipe" marker-end="url(#arr-pipe)"/>
  <rect x="622" y="160" width="25" height="20" rx="3" fill="#1e293b" stroke="#334155"/>
  <text x="634" y="174" text-anchor="middle" class="code-key" style="fill:#38bdf8; font-size:12px;">|</text>

  <!-- Stage 3: AWK (Field Language) -->
  <g transform="translate(660, 75)">
    <rect x="0" y="0" width="260" height="195" class="stage-box" style="stroke:#34d399; fill:#0c241c;"/>
    <text x="130" y="26" text-anchor="middle" class="stage-title" style="fill:#34d399;">3. AWK: COLUMN ENGINE</text>
    <text x="130" y="44" text-anchor="middle" class="stage-sub">Record &amp; Field Programming</text>

    <g transform="translate(15, 60)">
      <text x="0" y="16" class="code-key" style="fill:#6ee7b7;">Role: Tabular Math &amp; Reports</text>
      <text x="0" y="38" class="desc-txt">• Field variables: $1, $2, ... $NF</text>
      <text x="0" y="58" class="desc-txt">• BEGIN { ... } and END { ... }</text>
      <text x="0" y="78" class="desc-txt">• Associative array counting</text>
      <text x="0" y="98" class="desc-txt">• Floating-point math &amp; printf</text>
      <text x="0" y="118" class="code-key" style="font-size:11px; fill:#34d399;">awk '{cnt[$1]++} END{...}'</text>
    </g>
  </g>

  <!-- Bottom: Process Substitution Architecture (y = 295 to 455) -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="880" height="165" class="card" style="stroke:#a855f7;"/>
    <text x="25" y="26" class="title" style="font-size:15px; fill:#c084fc;">Process Substitution: Connecting Streams without Temporary Disk Files</text>

    <g transform="translate(25, 42)">
      <!-- Syntax -->
      <text x="0" y="20" class="code-key" style="fill:#38bdf8; font-size:13px;">diff &lt;(sort prod_users.txt) &lt;(sort staging_users.txt)</text>
      <text x="0" y="44" class="desc-txt">The shell executes the inner commands in subshells and mounts their outputs as file descriptors (<tspan class="code-key" style="fill:#34d399;">/dev/fd/63</tspan>, <tspan class="code-key" style="fill:#34d399;">/dev/fd/62</tspan>).</text>
      <text x="0" y="66" class="desc-txt">The outer command reads them as if they were regular files on disk, with <tspan style="color:#38bdf8; font-weight:600;">zero disk writes</tspan> and <tspan style="color:#38bdf8; font-weight:600;">zero cleanup required</tspan>!</text>

      <!-- Write-side substitution -->
      <text x="0" y="92" class="code-key" style="fill:#a855f7; font-size:12px;">tar -czf - data/ | tee &gt;(sha256sum &gt; hash.txt) &gt; backup.tar.gz</text>
      <text x="0" y="110" class="desc-txt">Splits tar stream simultaneously into a cryptographic hash calculator and disk backup via <tspan class="code-key" style="fill:#c084fc;">&gt;(command)</tspan>.</text>
    </g>
  </g>
</svg>
