<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .flag-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .flag-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .flag-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">The Production Bash Guardrails: set -euo pipefail</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Turning loose dynamic scripting into deterministic, fail-safe systems engineering</text>

  <!-- 3 Guardrail Flag Cards (y = 75 to 310) -->

  <!-- Flag 1: set -e -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="270" height="235" class="flag-box" style="stroke: #f43f5e; fill: #240c14;"/>
    <text x="135" y="28" text-anchor="middle" class="flag-title" style="fill: #f43f5e;">1. set -e (errexit)</text>
    <text x="135" y="48" text-anchor="middle" class="flag-sub">Immediate Error Termination</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#fb7185;">Halt on Non-Zero Exit</text>
      <text x="0" y="38" class="desc-txt">• Script terminates as soon as any</text>
      <text x="0" y="54" class="desc-txt">  simple command returns failure.</text>
      <text x="0" y="74" class="desc-txt" style="fill:#34d399;">• Prevents cascading corruption</text>
      <text x="0" y="90" class="desc-txt">  (e.g. cd /tmp &amp;&amp; rm -rf * fails to</text>
      <text x="0" y="106" class="desc-txt">  cd, then wipes root directory!)</text>
      <text x="0" y="130" class="code-key" style="font-size:11px; fill:#fcd34d;">cmd || true (Explicit override)</text>
    </g>
  </g>

  <!-- Flag 2: set -u -->
  <g transform="translate(345, 75)">
    <rect x="0" y="0" width="270" height="235" class="flag-box" style="stroke: #f59e0b; fill: #1c150b;"/>
    <text x="135" y="28" text-anchor="middle" class="flag-title" style="fill: #f59e0b;">2. set -u (nounset)</text>
    <text x="135" y="48" text-anchor="middle" class="flag-sub">Disallow Uninitialized Variables</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#fcd34d;">Catch Typos &amp; Empty Vars</text>
      <text x="0" y="38" class="desc-txt">• Throws error when referencing an</text>
      <text x="0" y="54" class="desc-txt">  unbound or unset variable.</text>
      <text x="0" y="74" class="desc-txt" style="fill:#34d399;">• Saves scripts from catastrophic</text>
      <text x="0" y="90" class="desc-txt">  <tspan class="code-key" style="fill:#f43f5e;">rm -rf "$TARGET_DIR/*"</tspan> when</text>
      <text x="0" y="106" class="desc-txt">  TARGET_DIR is misspelled/empty!</text>
      <text x="0" y="130" class="code-key" style="font-size:11px; fill:#38bdf8;">"${VAR:-default}" (Fallback)</text>
    </g>
  </g>

  <!-- Flag 3: set -o pipefail -->
  <g transform="translate(650, 75)">
    <rect x="0" y="0" width="270" height="235" class="flag-box" style="stroke: #38bdf8; fill: #0c1f36;"/>
    <text x="135" y="28" text-anchor="middle" class="flag-title" style="fill: #38bdf8;">3. pipefail</text>
    <text x="135" y="48" text-anchor="middle" class="flag-sub">Audit Pipeline Intermediates</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#7dd3fc;">Expose Hidden Pipe Errors</text>
      <text x="0" y="38" class="desc-txt">• Default shell returns exit code of</text>
      <text x="0" y="54" class="desc-txt">  the <tspan style="font-weight:600;">LAST</tspan> command in pipe.</text>
      <text x="0" y="74" class="desc-txt">• <tspan class="code-key" style="fill:#f43f5e;">curl bad_url | grep ok</tspan> would</text>
      <text x="0" y="90" class="desc-txt">  exit 0 even if curl crashed 404!</text>
      <text x="0" y="110" class="desc-txt" style="fill:#34d399;">• pipefail returns exit code of the</text>
      <text x="0" y="126" class="desc-txt">  first failing command in chain.</text>
    </g>
  </g>

  <!-- Bottom: The Defensive Script Preamble (y = 330 to 455) -->
  <g transform="translate(40, 325)">
    <rect x="0" y="0" width="880" height="135" class="card" style="stroke:#34d399;"/>
    <text x="25" y="26" class="title" style="font-size:15px; fill:#6ee7b7;">Production Script Boilerplate Header</text>

    <g transform="translate(25, 42)">
      <!-- Code Snippet -->
      <text x="0" y="18" class="code-key" style="fill:#34d399; font-size:13px;">#!/usr/bin/env bash</text>
      <text x="0" y="38" class="code-key" style="fill:#38bdf8; font-size:13px;">set -euo pipefail</text>
      <text x="0" y="58" class="code-key" style="fill:#fbbf24; font-size:13px;">IFS=$'\n\t'</text>
      <text x="0" y="78" class="desc-txt" style="font-size:11px; fill:#94a3b8;"># Strict Error Detection | Unset Var Protection | Pipeline Auditing | Safe IFS</text>

      <!-- Right Description -->
      <g transform="translate(400, 0)">
        <text x="0" y="18" class="desc-txt" style="fill:#cbd5e1;">• Use <tspan class="code-key" style="fill:#38bdf8;">#!/usr/bin/env bash</tspan> for portable environment pathing.</text>
        <text x="0" y="38" class="desc-txt" style="fill:#cbd5e1;">• Set <tspan class="code-key" style="fill:#38bdf8;">IFS=$'\n\t'</tspan> to eliminate accidental space splitting in for-loops.</text>
        <text x="0" y="58" class="desc-txt" style="fill:#cbd5e1;">• Run static linting with <tspan class="code-key" style="fill:#34d399;">shellcheck script.sh</tspan> before deployment!</text>
      </g>
    </g>
  </g>
</svg>
