<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #080c14; }
      .card { fill: #0f172a; stroke: #1e293b; stroke-width: 1.5; rx: 10; }
      .title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 20px; fill: #f8fafc; }
      .subtitle { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .test-box { fill: #131d33; stroke-width: 2; rx: 8; }
      .test-title { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 15px; }
      .test-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .code-key { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 12px; font-weight: 700; }
      .desc-txt { font-family: 'Inter', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="960" height="480" class="bg" rx="14"/>

  <!-- Title (y = 30 and y = 50) -->
  <text x="480" y="32" text-anchor="middle" class="title">Bash Condition Testing Matrix: [ ... ] vs [[ ... ]] vs (( ... ))</text>
  <text x="480" y="52" text-anchor="middle" class="subtitle">Selecting the correct test construct to guarantee safety, expressiveness, and performance</text>

  <!-- 3 Main Columns (y = 75 to 330) -->

  <!-- Column 1: [ ... ] POSIX Test -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="270" height="255" class="test-box" style="stroke: #f59e0b; fill: #17150a;"/>
    <text x="135" y="28" text-anchor="middle" class="test-title" style="fill: #f59e0b;">1. POSIX TEST: [ ... ]</text>
    <text x="135" y="48" text-anchor="middle" class="test-sub">Alias for `/usr/bin/test` binary</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#fcd34d;">Syntax: [ "$a" = "$b" ]</text>
      <text x="0" y="38" class="desc-txt">• Portable across all POSIX shells</text>
      <text x="0" y="58" class="desc-txt">• Mandatory spacing around brackets</text>
      <text x="0" y="78" class="desc-txt" style="fill:#fca5a5;">• Unquoted vars cause syntax crash</text>
      <text x="0" y="98" class="desc-txt" style="fill:#fca5a5;">• Word splitting and pathname globbing</text>
      <text x="0" y="118" class="desc-txt" style="fill:#fca5a5;">• Uses -eq, -ne for numbers</text>
      <text x="0" y="138" class="desc-txt" style="fill:#fca5a5;">• No regex support</text>
    </g>

    <text x="135" y="235" text-anchor="middle" class="test-sub" style="fill:#fbbf24;">Use when strict /bin/sh portability is needed</text>
  </g>

  <!-- Column 2: [[ ... ]] Extended Bash Test -->
  <g transform="translate(345, 75)">
    <rect x="0" y="0" width="270" height="255" class="test-box" style="stroke: #34d399; fill: #0b1f1a;"/>
    <text x="135" y="28" text-anchor="middle" class="test-title" style="fill: #34d399;">2. BASH TEST: [[ ... ]]</text>
    <text x="135" y="48" text-anchor="middle" class="test-sub">Shell Keyword (Recommended)</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#6ee7b7;">Syntax: [[ $a == $b ]]</text>
      <text x="0" y="38" class="desc-txt" style="fill:#34d399;">• Safe with unquoted variables!</text>
      <text x="0" y="58" class="desc-txt" style="fill:#34d399;">• No word splitting or glob expansion</text>
      <text x="0" y="78" class="desc-txt" style="fill:#34d399;">• Regex matching with =~ operator</text>
      <text x="0" y="98" class="desc-txt">• Glob wildcard pattern matching (== *)</text>
      <text x="0" y="118" class="desc-txt">• Logical operators: &amp;&amp; and || inside</text>
      <text x="0" y="138" class="desc-txt">• String comparisons: &lt;, &gt;, ==, !=</text>
    </g>

    <text x="135" y="235" text-anchor="middle" class="test-sub" style="fill:#34d399; font-weight:600;">Standard for all modern Bash scripts</text>
  </g>

  <!-- Column 3: (( ... )) Arithmetic Evaluation -->
  <g transform="translate(650, 75)">
    <rect x="0" y="0" width="270" height="255" class="test-box" style="stroke: #38bdf8; fill: #0b1a2e;"/>
    <text x="135" y="28" text-anchor="middle" class="test-title" style="fill: #38bdf8;">3. ARITHMETIC: (( ... ))</text>
    <text x="135" y="48" text-anchor="middle" class="test-sub">C-Style Mathematical Expressions</text>

    <g transform="translate(15, 65)">
      <text x="0" y="16" class="code-key" style="fill:#7dd3fc;">Syntax: (( count &gt; 10 ))</text>
      <text x="0" y="38" class="desc-txt">• Standard math operators: &gt;, &lt;, &gt;=, &lt;=</text>
      <text x="0" y="58" class="desc-txt">• Equality: ==, !=</text>
      <text x="0" y="78" class="desc-txt">• Variables do not need $ prefix</text>
      <text x="0" y="98" class="desc-txt">• Increment/Decrement: (( i++ )), (( ++i ))</text>
      <text x="0" y="118" class="desc-txt">• Bitwise ops: &lt;&lt;, &gt;&gt;, &amp;, |, ^</text>
      <text x="0" y="138" class="desc-txt">• Returns 0 (true) if non-zero value!</text>
    </g>

    <text x="135" y="235" text-anchor="middle" class="test-sub" style="fill:#38bdf8; font-weight:600;">Ideal for counters, math, and loop limits</text>
  </g>

  <!-- Bottom: Exit Status Truth Logic (y = 350 to 455) -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="880" height="110" class="card"/>
    <text x="25" y="26" class="title" style="font-size:14px; fill:#a855f7;">The Unix Truth Paradox: 0 is TRUE, Non-Zero is FALSE</text>

    <g transform="translate(25, 42)">
      <text x="0" y="18" class="desc-txt">Unlike C or Python where <tspan class="code-key">0</tspan> represents false, in Unix shells <tspan class="code-key" style="fill:#34d399;">0 represents SUCCESS (True)</tspan> because commands execute with error code 0.</text>
      <text x="0" y="38" class="desc-txt">Any non-zero exit status (<tspan class="code-key" style="fill:#f43f5e;">1 to 255</tspan>) indicates failure or error, which evaluates to <tspan class="code-key" style="fill:#f43f5e;">FALSE</tspan> in <tspan class="code-key">if</tspan> statements.</text>
      <text x="0" y="58" class="desc-txt">Short-circuit chaining: <tspan class="code-key" style="fill:#38bdf8;">command_a &amp;&amp; command_b</tspan> (runs B only if A succeeds) | <tspan class="code-key" style="fill:#f59e0b;">command_a || fallback</tspan> (runs fallback if A fails).</text>
    </g>
  </g>
</svg>
