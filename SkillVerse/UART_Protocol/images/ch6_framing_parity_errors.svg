<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Error Detection: Framing Error &amp; Parity Error</text>

  <!-- Framing Error -->
  <rect x="40" y="65" width="380" height="230" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8"/>
  <text x="230" y="95" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Framing Error (FE)</text>
  <text x="230" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Stop bit sampled as '0' instead of expected '1'</text>

  <!-- Waveform showing missing stop bit -->
  <line x1="60" y1="165" x2="220" y2="165" stroke="#38bdf8" stroke-width="2"/>
  <text x="140" y="155" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="sans-serif">Data Bits (D0..D7)</text>
  <!-- Stop bit area stays LOW -->
  <line x1="220" y1="165" x2="340" y2="165" stroke="#f87171" stroke-width="3"/>
  <rect x="220" y="145" width="120" height="40" fill="#f87171" fill-opacity="0.2"/>
  <text x="280" y="170" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Sample = 0 (FE!)</text>

  <text x="230" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Common Causes: Baud rate mismatch &gt; 3%,</text>
  <text x="230" y="245" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">electrical noise, line cut, disconnected cable</text>
  <text x="230" y="275" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Status Register: LSR[3] = 1</text>

  <!-- Parity Error -->
  <rect x="460" y="65" width="380" height="230" fill="#1e293b" stroke="#facc15" stroke-width="1.5" rx="8"/>
  <text x="650" y="95" fill="#facc15" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Parity Error (PE)</text>
  <text x="650" y="120" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Calculated checksum differs from received parity bit</text>

  <rect x="480" y="140" width="340" height="60" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="650" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Even Parity Example: Data = 8'b0100_0001 (Two 1s)</text>
  <text x="650" y="180" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Expected Parity = 0 | Received Parity = 1 $ightarrow$ MISMATCH!</text>

  <text x="650" y="225" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Detects: Single-bit flipped during transmission</text>
  <text x="650" y="245" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Limitation: Blind to 2-bit simultaneous bit flips</text>
  <text x="650" y="275" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Status Register: LSR[2] = 1</text>
</svg>