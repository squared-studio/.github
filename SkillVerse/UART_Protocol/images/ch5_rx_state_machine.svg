<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <rect width="880" height="340" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Receiver (RX) Finite State Machine</text>

  <!-- State IDLE -->
  <circle cx="120" cy="180" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="120" y="180" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">IDLE</text>
  <text x="120" y="200" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Wait Falling Edge</text>

  <!-- Arc IDLE to START_CHECK -->
  <path d="M 165 180 Q 220 130 275 180" fill="none" stroke="#facc15" stroke-width="2"/>
  <text x="220" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">rx_sync == 0</text>

  <!-- State START_CHECK -->
  <circle cx="320" cy="180" r="45" fill="#1e293b" stroke="#f87171" stroke-width="2.5"/>
  <text x="320" y="175" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CHECK</text>
  <text x="320" y="195" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">START</text>
  <text x="320" y="215" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Tick 7..9 (Mid)</text>

  <!-- Arc START to SAMPLE_DATA -->
  <path d="M 365 180 Q 420 130 475 180" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="420" y="145" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">rx == 0 (Valid)</text>

  <!-- Glitch reject abort back to IDLE -->
  <path d="M 300 220 Q 220 270 145 220" fill="none" stroke="#f87171" stroke-dasharray="3" stroke-width="2"/>
  <text x="220" y="270" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">rx == 1 (Noise Glitch)</text>

  <!-- State SAMPLE_DATA -->
  <circle cx="520" cy="180" r="45" fill="#1e293b" stroke="#4ade80" stroke-width="2.5"/>
  <text x="520" y="175" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">SAMPLE</text>
  <text x="520" y="195" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">DATA</text>
  <text x="520" y="215" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">Sample mid-bit</text>

  <!-- Loop on DATA -->
  <path d="M 505 137 C 490 90 550 90 535 137" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="520" y="90" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">bits &lt; 8</text>

  <!-- Arc DATA to CHECK_STOP -->
  <path d="M 565 180 Q 640 130 715 180" fill="none" stroke="#facc15" stroke-width="2"/>
  <text x="640" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">8 bits sampled</text>

  <!-- State CHECK_STOP -->
  <circle cx="760" cy="180" r="45" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
  <text x="760" y="175" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">CHECK</text>
  <text x="760" y="195" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">STOP</text>
  <text x="760" y="215" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">rx == 1 ? FE=0 : FE=1</text>

  <!-- Return from CHECK_STOP to IDLE -->
  <path d="M 740 220 Q 440 330 140 220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <text x="440" y="300" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="sans-serif">Push byte to RX FIFO $ightarrow$ Assert RX_READY IRQ $ightarrow$ Return IDLE</text>
</svg>