<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Hardware Flow Control: RTS / CTS Handshaking</text>

  <!-- Device A (Transmitter) -->
  <rect x="40" y="70" width="220" height="250" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="150" y="105" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Device A (DTE)</text>
  <rect x="60" y="130" width="180" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="150" y="160" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">TX Shift Register</text>
  <rect x="60" y="200" width="180" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="150" y="230" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">CTS Input Monitor</text>
  <text x="150" y="285" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Transmits only when CTS = 0</text>

  <!-- Lines -->
  <!-- TXD -->
  <line x1="260" y1="150" x2="640" y2="150" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="635,145 645,150 635,155" fill="#4ade80"/>
  <text x="450" y="140" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">TXD (Data Stream)</text>

  <!-- RTS / CTS handshakes -->
  <line x1="640" y1="210" x2="260" y2="210" stroke="#facc15" stroke-width="2.5"/>
  <polygon points="265,205 255,210 265,215" fill="#facc15"/>
  <text x="450" y="200" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">RTS_n of B $ightarrow$ CTS_n of A (Active-LOW)</text>

  <!-- Device B (Receiver) -->
  <rect x="640" y="70" width="220" height="250" fill="#1e293b" stroke="#f472b6" stroke-width="2" rx="8"/>
  <text x="750" y="105" fill="#f472b6" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Device B (DCE)</text>
  <rect x="660" y="130" width="180" height="70" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="750" y="155" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">RX FIFO</text>
  <text x="750" y="180" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Watermark: High at 75% Full</text>

  <rect x="660" y="220" width="180" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="750" y="245" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">Auto-RTS Generator</text>
  <text x="750" y="285" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Deasserts RTS when FIFO &gt; 12/16</text>

  <!-- Explanation footer -->
  <text x="450" y="340" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Hardware backpressure stops transmitter in real-time, preventing buffer overrun loss.</text>
</svg>