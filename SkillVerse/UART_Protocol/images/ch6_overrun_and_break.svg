<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Error Detection: Overrun Error &amp; Break Indicator</text>

  <!-- Overrun Error -->
  <rect x="40" y="65" width="380" height="210" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8"/>
  <text x="230" y="95" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Overrun Error (OE)</text>
  
  <rect x="60" y="120" width="340" height="50" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="230" y="140" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">RX FIFO Full / Register Unread</text>
  <text x="230" y="160" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">New byte arrives $ightarrow$ Previous data overwritten or dropped!</text>

  <text x="230" y="200" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Root Cause: CPU interrupt latency too high to service UART</text>
  <text x="230" y="225" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Remedy: Enable Hardware Flow Control or DMA</text>
  <text x="230" y="255" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Status Register: LSR[1] = 1</text>

  <!-- Break Condition -->
  <rect x="460" y="65" width="380" height="210" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" rx="8"/>
  <text x="650" y="95" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Break Indicator (BI)</text>

  <line x1="480" y1="145" x2="820" y2="145" stroke="#c084fc" stroke-width="3"/>
  <text x="650" y="135" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Line held LOW (0) for &gt; 1 full frame (&gt; 10-12 bits)</text>

  <text x="650" y="190" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Use Case: Attention signal, console reset, LIN bus frame sync</text>
  <text x="650" y="215" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Triggered deliberately by software setting LCR[6] = 1</text>
  <text x="650" y="255" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Status Register: LSR[4] = 1</text>
</svg>