<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Physical Layer Comparison: TTL/CMOS vs. RS-232 Inverted Signaling</text>

  <!-- TTL / CMOS Section -->
  <rect x="40" y="65" width="380" height="230" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="230" y="95" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Logic (TTL / 3.3V CMOS)</text>
  
  <line x1="80" y1="140" x2="380" y2="140" stroke="#64748b" stroke-dasharray="2"/>
  <text x="65" y="145" fill="#64748b" font-size="10" font-family="sans-serif">3.3V</text>
  <line x1="80" y1="200" x2="380" y2="200" stroke="#64748b" stroke-dasharray="2"/>
  <text x="65" y="205" fill="#64748b" font-size="10" font-family="sans-serif">0.0V</text>

  <!-- TTL Waveform: 1 -> 0 -> 1 -->
  <line x1="100" y1="140" x2="160" y2="140" stroke="#38bdf8" stroke-width="3"/>
  <line x1="160" y1="140" x2="160" y2="200" stroke="#38bdf8" stroke-width="3"/>
  <line x1="160" y1="200" x2="260" y2="200" stroke="#38bdf8" stroke-width="3"/>
  <line x1="260" y1="200" x2="260" y2="140" stroke="#38bdf8" stroke-width="3"/>
  <line x1="260" y1="140" x2="340" y2="140" stroke="#38bdf8" stroke-width="3"/>

  <text x="130" y="130" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">1 (Mark)</text>
  <text x="210" y="220" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">0 (Space)</text>
  <text x="300" y="130" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">1 (Mark)</text>

  <text x="230" y="260" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">High = Logic 1 | Low = Logic 0</text>
  <text x="230" y="280" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Single-ended, distance &lt; 0.5 meters</text>

  <!-- RS-232 Section -->
  <rect x="460" y="65" width="380" height="230" fill="#1e293b" stroke="#f87171" stroke-width="1.5" rx="8"/>
  <text x="650" y="95" fill="#f87171" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">RS-232 Physical Standard (Inverted Bipolar)</text>

  <line x1="500" y1="130" x2="800" y2="130" stroke="#64748b" stroke-dasharray="2"/>
  <text x="480" y="135" fill="#64748b" font-size="10" font-family="sans-serif">+12V</text>
  <line x1="500" y1="170" x2="800" y2="170" stroke="#475569" stroke-dasharray="1"/>
  <text x="480" y="175" fill="#475569" font-size="10" font-family="sans-serif">0V</text>
  <line x1="500" y1="210" x2="800" y2="210" stroke="#64748b" stroke-dasharray="2"/>
  <text x="480" y="215" fill="#64748b" font-size="10" font-family="sans-serif">-12V</text>

  <!-- Inverted Waveform: -12V for 1, +12V for 0 -->
  <line x1="520" y1="210" x2="580" y2="210" stroke="#f87171" stroke-width="3"/>
  <line x1="580" y1="210" x2="580" y2="130" stroke="#f87171" stroke-width="3"/>
  <line x1="580" y1="130" x2="680" y2="130" stroke="#f87171" stroke-width="3"/>
  <line x1="680" y1="130" x2="680" y2="210" stroke="#f87171" stroke-width="3"/>
  <line x1="680" y1="210" x2="760" y2="210" stroke="#f87171" stroke-width="3"/>

  <text x="550" y="235" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">-12V = 1 (Mark)</text>
  <text x="630" y="120" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">+12V = 0 (Space)</text>
  <text x="720" y="235" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">-12V = 1 (Mark)</text>

  <text x="650" y="260" fill="#facc15" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">LOGIC INVERTED: Negative = 1, Positive = 0</text>
  <text x="650" y="280" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Immunity to noise, supports up to 15 meters</text>
</svg>