<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="100%" height="100%">
  <rect width="840" height="280" fill="#0f172a" rx="10"/>
  <text x="420" y="35" fill="#f8fafc" font-size="17" font-weight="bold" text-anchor="middle" font-family="sans-serif">False Start Bit Glitch Rejection Mechanism</text>

  <!-- Spurious Glitch (Noise) -->
  <text x="40" y="80" fill="#f87171" font-size="13" font-weight="bold" font-family="sans-serif">Case A: Noise Glitch</text>
  <line x1="180" y1="75" x2="240" y2="75" stroke="#f87171" stroke-width="2.5"/>
  <line x1="240" y1="75" x2="240" y2="115" stroke="#f87171" stroke-width="2.5"/>
  <line x1="240" y1="115" x2="280" y2="115" stroke="#f87171" stroke-width="2.5"/>
  <line x1="280" y1="115" x2="280" y2="75" stroke="#f87171" stroke-width="2.5"/>
  <line x1="280" y1="75" x2="450" y2="75" stroke="#f87171" stroke-width="2.5"/>

  <!-- Sampling at Tick 8 -->
  <line x1="380" y1="60" x2="380" y2="130" stroke="#facc15" stroke-dasharray="3" stroke-width="2"/>
  <text x="380" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Tick 8 Sample: Line is '1' (HIGH)</text>
  <rect x="490" y="65" width="280" height="40" fill="#1e293b" stroke="#f87171" rx="4"/>
  <text x="630" y="90" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">REJECTED: False Start! Reset to IDLE.</text>

  <!-- Valid Start Bit -->
  <text x="40" y="195" fill="#4ade80" font-size="13" font-weight="bold" font-family="sans-serif">Case B: Valid Start</text>
  <line x1="180" y1="190" x2="240" y2="190" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="240" y1="190" x2="240" y2="230" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="240" y1="230" x2="450" y2="230" stroke="#4ade80" stroke-width="2.5"/>

  <!-- Sampling at Tick 8 -->
  <line x1="380" y1="175" x2="380" y2="245" stroke="#4ade80" stroke-dasharray="3" stroke-width="2"/>
  <circle cx="380" cy="230" r="5" fill="#4ade80"/>
  <text x="380" y="260" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">Tick 8 Sample: Line is '0' (LOW)</text>
  <rect x="490" y="180" width="280" height="40" fill="#1e293b" stroke="#4ade80" rx="4"/>
  <text x="630" y="205" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">CONFIRMED: Valid Start! Sample data bits.</text>
</svg>