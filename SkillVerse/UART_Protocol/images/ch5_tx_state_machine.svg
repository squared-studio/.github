<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <rect width="880" height="340" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Transmitter (TX) Finite State Machine</text>

  <!-- State IDLE -->
  <circle cx="120" cy="180" r="45" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
  <text x="120" y="180" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">IDLE</text>
  <text x="120" y="200" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">TX = 1</text>

  <!-- Arc IDLE to START -->
  <path d="M 165 180 Q 220 130 275 180" fill="none" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">tx_start_req</text>

  <!-- State START -->
  <circle cx="320" cy="180" r="45" fill="#1e293b" stroke="#f87171" stroke-width="2.5"/>
  <text x="320" y="180" fill="#f87171" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">START</text>
  <text x="320" y="200" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">TX = 0 (16 ticks)</text>

  <!-- Arc START to DATA -->
  <path d="M 365 180 Q 420 130 475 180" fill="none" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">tick_count == 15</text>

  <!-- State DATA -->
  <circle cx="520" cy="180" r="45" fill="#1e293b" stroke="#4ade80" stroke-width="2.5"/>
  <text x="520" y="175" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">DATA</text>
  <text x="520" y="195" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Shift D0..D7</text>

  <!-- Loop on DATA -->
  <path d="M 505 137 C 490 90 550 90 535 137" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="520" y="90" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">bit_idx &lt; 7</text>

  <!-- Arc DATA to STOP -->
  <path d="M 565 180 Q 640 130 715 180" fill="none" stroke="#facc15" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="145" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">bit_idx == 7 &amp;&amp; tick == 15</text>

  <!-- State STOP -->
  <circle cx="760" cy="180" r="45" fill="#1e293b" stroke="#c084fc" stroke-width="2.5"/>
  <text x="760" y="180" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">STOP</text>
  <text x="760" y="200" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">TX = 1 (1-2 bits)</text>

  <!-- Return from STOP to IDLE -->
  <path d="M 740 220 Q 440 330 140 220" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="145,215 135,220 145,225" fill="#38bdf8"/>
  <text x="440" y="300" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="sans-serif">stop_ticks_done $ightarrow$ Return to IDLE</text>
</svg>