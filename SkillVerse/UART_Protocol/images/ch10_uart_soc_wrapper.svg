<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <rect width="900" height="380" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Complete SoC UART Peripheral Wrapper Architecture</text>

  <!-- Bus Interface -->
  <rect x="40" y="80" width="180" height="260" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="130" y="115" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bus Interface</text>
  <text x="130" y="135" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(APB4 / AXI4-Lite)</text>
  
  <rect x="60" y="160" width="140" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="130" y="182" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Address Decoder</text>
  <rect x="60" y="210" width="140" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="130" y="232" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Read/Write Control</text>
  <rect x="60" y="260" width="140" height="35" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="130" y="282" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Interrupt Gen (IRQ)</text>

  <!-- CDC Boundary -->
  <line x1="260" y1="70" x2="260" y2="350" stroke="#f87171" stroke-dasharray="4" stroke-width="2"/>
  <text x="260" y="60" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">CDC Boundary</text>

  <!-- 16550 Register Bank & Core -->
  <rect x="300" y="80" width="320" height="260" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="460" y="115" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">16550 UART Core</text>

  <rect x="320" y="140" width="130" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="385" y="165" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="sans-serif">Baud Rate Gen</text>

  <rect x="470" y="140" width="130" height="40" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="535" y="165" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Reg File (LCR..)</text>

  <rect x="320" y="200" width="130" height="60" fill="#0f172a" stroke="#c084fc" rx="4"/>
  <text x="385" y="225" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">TX Engine</text>
  <text x="385" y="245" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">TX FIFO + PISO</text>

  <rect x="470" y="200" width="130" height="60" fill="#0f172a" stroke="#f472b6" rx="4"/>
  <text x="535" y="225" fill="#f472b6" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">RX Engine</text>
  <text x="535" y="245" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Oversample + FIFO</text>

  <rect x="320" y="280" width="280" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="460" y="305" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Modem Flow Control (RTS/CTS/DTR/DSR)</text>

  <!-- Physical IO Pads -->
  <rect x="680" y="80" width="180" height="260" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" rx="8"/>
  <text x="770" y="115" fill="#e2e8f0" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">I/O Pad Ring</text>

  <rect x="700" y="145" width="140" height="30" fill="#0f172a" stroke="#4ade80" rx="3"/>
  <text x="770" y="165" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">UART_TX Pad</text>

  <rect x="700" y="190" width="140" height="30" fill="#0f172a" stroke="#f472b6" rx="3"/>
  <text x="770" y="210" fill="#f472b6" font-size="11" text-anchor="middle" font-family="sans-serif">UART_RX Pad</text>

  <rect x="700" y="235" width="140" height="30" fill="#0f172a" stroke="#facc15" rx="3"/>
  <text x="770" y="255" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">UART_RTS Pad</text>

  <rect x="700" y="280" width="140" height="30" fill="#0f172a" stroke="#facc15" rx="3"/>
  <text x="770" y="300" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">UART_CTS Pad</text>

  <!-- Connectors -->
  <line x1="450" y1="230" x2="700" y2="160" stroke="#4ade80" stroke-width="2"/>
  <line x1="700" y1="205" x2="600" y2="230" stroke="#f472b6" stroke-width="2"/>
</svg>