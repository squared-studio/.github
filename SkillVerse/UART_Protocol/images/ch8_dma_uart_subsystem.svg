<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Zero-CPU Overhead DMA-Driven UART Subsystem</text>

  <!-- CPU Core -->
  <rect x="40" y="80" width="140" height="90" fill="#1e293b" stroke="#64748b" rx="6"/>
  <text x="110" y="120" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">CPU Core</text>
  <text x="110" y="145" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">100% Free / Idle</text>

  <!-- DMA Controller -->
  <rect x="250" y="80" width="190" height="180" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="6"/>
  <text x="345" y="110" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">DMA Controller</text>
  <rect x="270" y="130" width="150" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="345" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Channel 0 (UART RX)</text>
  <rect x="270" y="180" width="150" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="345" y="205" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Channel 1 (UART TX)</text>

  <!-- System RAM -->
  <rect x="520" y="80" width="150" height="180" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="6"/>
  <text x="595" y="110" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">System RAM</text>
  <rect x="535" y="130" width="120" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="595" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Circular RX Ring</text>
  <rect x="535" y="190" width="120" height="50" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="595" y="220" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">TX Packet Buffer</text>

  <!-- UART Peripheral -->
  <rect x="740" y="80" width="100" height="180" fill="#1e293b" stroke="#facc15" stroke-width="2" rx="6"/>
  <text x="790" y="110" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART</text>
  <text x="790" y="160" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">DREQ_RX</text>
  <text x="790" y="210" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">DREQ_TX</text>

  <!-- Lines -->
  <line x1="740" y1="150" x2="440" y2="150" stroke="#facc15" stroke-width="2"/>
  <polygon points="445,145 435,150 445,155" fill="#facc15"/>
  <text x="690" y="140" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">DMA Req</text>

  <line x1="440" y1="170" x2="520" y2="170" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="515,165 525,170 515,175" fill="#38bdf8"/>
  <text x="480" y="165" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">Direct Copy</text>

  <text x="440" y="295" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">DMA streams megabytes of UART data directly into RAM without per-byte CPU interrupts.</text>
</svg>