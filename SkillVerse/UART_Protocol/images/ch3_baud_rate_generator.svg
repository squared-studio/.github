<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Baud Rate Generator Architecture with Fractional Accumulator</text>

  <!-- Input System Clock -->
  <rect x="40" y="100" width="120" height="60" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="100" y="125" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">System Clock</text>
  <text x="100" y="145" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">f_sys (e.g. 50MHz)</text>
  <line x1="160" y1="130" x2="230" y2="130" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Integer Divider Block -->
  <rect x="230" y="80" width="190" height="150" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="6"/>
  <text x="325" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Integer Prescaler</text>
  <rect x="250" y="130" width="150" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="325" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Modulo-N Counter</text>
  <text x="325" y="205" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">N = f_sys / (16 * Baud)</text>

  <line x1="420" y1="130" x2="490" y2="130" stroke="#4ade80" stroke-width="2.5"/>

  <!-- Fractional Accumulator -->
  <rect x="490" y="80" width="200" height="150" fill="#1e293b" stroke="#facc15" stroke-width="2" rx="6"/>
  <text x="590" y="110" fill="#facc15" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Fractional Rate Multiplier</text>
  <rect x="510" y="130" width="160" height="40" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="590" y="155" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Phase Accumulator</text>
  <text x="590" y="205" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Dithers divisor between N &amp; N+1</text>

  <line x1="690" y1="130" x2="760" y2="130" stroke="#facc15" stroke-width="2.5"/>

  <!-- 16x Baud Tick Output -->
  <rect x="760" y="100" width="90" height="60" fill="#1e293b" stroke="#c084fc" rx="6"/>
  <text x="805" y="125" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">16x Baud</text>
  <text x="805" y="145" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Tick Pulse</text>

  <rect x="140" y="260" width="600" height="40" fill="#0f172a" stroke="#64748b" rx="5"/>
  <text x="440" y="285" fill="#f8fafc" font-size="12" text-anchor="middle" font-family="sans-serif">Baud Clock Frequency: f_baud = f_sys / (16 * (Div_Int + Div_Frac / 64))</text>
</svg>