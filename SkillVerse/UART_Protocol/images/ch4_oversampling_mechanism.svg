<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">16x Oversampling and Majority-Voting Center Sampling</text>

  <!-- Incoming RX Line -->
  <text x="50" y="85" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">RX Line</text>
  <line x1="120" y1="80" x2="200" y2="80" stroke="#38bdf8" stroke-width="3"/>
  <line x1="200" y1="80" x2="200" y2="140" stroke="#38bdf8" stroke-width="3"/>
  <line x1="200" y1="140" x2="800" y2="140" stroke="#38bdf8" stroke-width="3"/>
  <text x="160" y="70" fill="#94a3b8" font-size="10" font-family="sans-serif">Idle (1)</text>
  <text x="210" y="105" fill="#f87171" font-size="11" font-weight="bold" font-family="sans-serif">Falling Edge (Start Bit)</text>

  <!-- 16x Ticks -->
  <text x="50" y="200" fill="#cbd5e1" font-size="13" font-weight="bold" font-family="sans-serif">16x Ticks</text>
  <!-- Draw 16 ticks from x=200 to x=760 (spacing = 35) -->
  <g stroke="#64748b" stroke-width="1.5">
    <line x1="200" y1="185" x2="200" y2="215"/>
    <line x1="235" y1="185" x2="235" y2="215"/>
    <line x1="270" y1="185" x2="270" y2="215"/>
    <line x1="305" y1="185" x2="305" y2="215"/>
    <line x1="340" y1="185" x2="340" y2="215"/>
    <line x1="375" y1="185" x2="375" y2="215"/>
    <line x1="410" y1="185" x2="410" y2="215"/>
    <line x1="445" y1="185" x2="445" y2="215"/>
    <line x1="480" y1="185" x2="480" y2="215"/>
    <line x1="515" y1="185" x2="515" y2="215"/>
    <line x1="550" y1="185" x2="550" y2="215"/>
    <line x1="585" y1="185" x2="585" y2="215"/>
    <line x1="620" y1="185" x2="620" y2="215"/>
    <line x1="655" y1="185" x2="655" y2="215"/>
    <line x1="690" y1="185" x2="690" y2="215"/>
    <line x1="725" y1="185" x2="725" y2="215"/>
    <line x1="760" y1="185" x2="760" y2="215"/>
  </g>

  <!-- Tick labels -->
  <text x="200" y="230" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">0</text>
  <text x="235" y="230" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">1</text>
  <text x="445" y="230" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">7</text>
  <text x="480" y="230" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">8</text>
  <text x="515" y="230" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">9</text>
  <text x="760" y="230" fill="#94a3b8" font-size="9" text-anchor="middle" font-family="sans-serif">15</text>

  <!-- Highlight Majority Voting Window -->
  <rect x="430" y="125" width="100" height="90" fill="#4ade80" fill-opacity="0.2" stroke="#4ade80" stroke-width="2" rx="4"/>
  <text x="480" y="260" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Majority Voting Window (Ticks 7, 8, 9)</text>
  <text x="480" y="280" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">2 out of 3 match decides bit value; eliminates glitch noise</text>

  <!-- Next bit boundary -->
  <line x1="760" y1="120" x2="760" y2="220" stroke="#f87171" stroke-dasharray="3"/>
  <text x="760" y="250" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Next Bit Starts (Tick 16 $ightarrow$ 0)</text>
</svg>