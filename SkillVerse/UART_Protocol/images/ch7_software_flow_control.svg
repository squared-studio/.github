<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="100%">
  <rect width="880" height="300" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Software Flow Control: In-Band XON / XOFF Protocol</text>

  <rect x="40" y="70" width="180" height="200" fill="#1e293b" stroke="#38bdf8" rx="6"/>
  <text x="130" y="110" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Sender (Terminal)</text>
  <text x="130" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Transmitting</text>
  <text x="130" y="190" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Text / Data</text>

  <rect x="660" y="70" width="180" height="200" fill="#1e293b" stroke="#4ade80" rx="6"/>
  <text x="750" y="110" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Receiver (Host)</text>
  <text x="750" y="170" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">RX Buffer</text>
  <text x="750" y="190" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">Nearly Full!</text>

  <!-- XOFF Transmission -->
  <line x1="660" y1="130" x2="220" y2="130" stroke="#f87171" stroke-width="2.5"/>
  <polygon points="225,125 215,130 225,135" fill="#f87171"/>
  <rect x="360" y="110" width="160" height="35" fill="#0f172a" stroke="#f87171" rx="4"/>
  <text x="440" y="132" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">XOFF (0x13 / DC3)</text>
  <text x="440" y="160" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">"PAUSE TRANSMISSION"</text>

  <!-- XON Transmission -->
  <line x1="660" y1="210" x2="220" y2="210" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="225,205 215,210 225,215" fill="#4ade80"/>
  <rect x="360" y="190" width="160" height="35" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="440" y="212" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">XON (0x11 / DC1)</text>
  <text x="440" y="240" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">"RESUME TRANSMISSION"</text>

  <text x="440" y="280" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Tradeoff: No extra pins needed, but cannot safely transmit binary data without escaping.</text>
</svg>