<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="100%" height="100%">
  <rect width="880" height="320" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Accumulated Phase Error Over 10-Bit Frame</text>

  <!-- Baseline ideal ticks -->
  <text x="50" y="100" fill="#4ade80" font-size="12" font-weight="bold" font-family="sans-serif">Ideal RX Sampling</text>
  <line x1="180" y1="95" x2="840" y2="95" stroke="#4ade80" stroke-width="2"/>
  <!-- 10 sample ticks at 50% centers -->
  <circle cx="210" cy="95" r="4" fill="#4ade80"/>
  <circle cx="270" cy="95" r="4" fill="#4ade80"/>
  <circle cx="330" cy="95" r="4" fill="#4ade80"/>
  <circle cx="390" cy="95" r="4" fill="#4ade80"/>
  <circle cx="450" cy="95" r="4" fill="#4ade80"/>
  <circle cx="510" cy="95" r="4" fill="#4ade80"/>
  <circle cx="570" cy="95" r="4" fill="#4ade80"/>
  <circle cx="630" cy="95" r="4" fill="#4ade80"/>
  <circle cx="690" cy="95" r="4" fill="#4ade80"/>
  <circle cx="750" cy="95" r="4" fill="#4ade80"/>
  <text x="750" y="80" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">Stop Bit Center</text>

  <!-- Mismatched baud rate: Fast clock (+3.5% error) -->
  <text x="50" y="165" fill="#f87171" font-size="12" font-weight="bold" font-family="sans-serif">TX Faster (+3.5%)</text>
  <line x1="180" y1="160" x2="840" y2="160" stroke="#f87171" stroke-width="2"/>
  <circle cx="210" cy="160" r="4" fill="#f87171"/>
  <circle cx="268" cy="160" r="4" fill="#f87171"/>
  <circle cx="325" cy="160" r="4" fill="#f87171"/>
  <circle cx="382" cy="160" r="4" fill="#f87171"/>
  <circle cx="438" cy="160" r="4" fill="#f87171"/>
  <circle cx="493" cy="160" r="4" fill="#f87171"/>
  <circle cx="548" cy="160" r="4" fill="#f87171"/>
  <circle cx="602" cy="160" r="4" fill="#f87171"/>
  <circle cx="655" cy="160" r="4" fill="#f87171"/>
  <circle cx="708" cy="160" r="5" fill="#f87171" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="750" y1="95" x2="708" y2="160" stroke="#f87171" stroke-dasharray="3"/>
  <text x="710" y="185" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">Severe Phase Shift (-42%)</text>

  <!-- Threshold limit box -->
  <rect x="60" y="220" width="760" height="70" fill="#1e293b" stroke="#facc15" stroke-width="1.5" rx="6"/>
  <text x="440" y="245" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Maximum Acceptable Baud Rate Error Budget: +-2.5% to +-3.0%</text>
  <text x="440" y="268" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">At Stop bit (bit 10), accumulated shift must not exceed +-50% of T_bit, or framing errors occur.</text>
</svg>