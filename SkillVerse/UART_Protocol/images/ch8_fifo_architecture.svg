<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <rect width="900" height="360" fill="#0f172a" rx="10"/>
  <text x="450" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">16550 UART Hardware FIFO Architecture &amp; Watermarks</text>

  <!-- TX FIFO Block -->
  <rect x="50" y="80" width="370" height="240" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="235" y="110" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Transmitter FIFO (16 to 128 Bytes)</text>
  
  <rect x="70" y="130" width="330" height="60" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="235" y="155" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">Circular Buffer Memory Array</text>
  <text x="235" y="175" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Write Pointer (CPU/DMA) $ightarrow$ Read Pointer (TX Shift)</text>

  <rect x="70" y="210" width="150" height="40" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="145" y="235" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">Empty Interrupt (THRE)</text>

  <rect x="250" y="210" width="150" height="40" fill="#0f172a" stroke="#4ade80" rx="4"/>
  <text x="325" y="235" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">TX FIFO Reset (FCR[2])</text>

  <text x="235" y="295" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">CPU writes bulk bursts up to FIFO depth in a single loop</text>

  <!-- RX FIFO Block -->
  <rect x="480" y="80" width="370" height="240" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" rx="8"/>
  <text x="665" y="110" fill="#f472b6" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Receiver FIFO &amp; Timeout Timer</text>

  <rect x="500" y="130" width="330" height="60" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="665" y="155" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">RX Storage Array (8-bit Data + 3-bit Errors)</text>
  <text x="665" y="175" fill="#f472b6" font-size="10" text-anchor="middle" font-family="sans-serif">Errors (FE, PE, BI) stored alongside each byte!</text>

  <rect x="500" y="210" width="160" height="40" fill="#0f172a" stroke="#facc15" rx="4"/>
  <text x="580" y="230" fill="#facc15" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Trigger Thresholds</text>
  <text x="580" y="245" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">1, 4, 8, or 14 Bytes</text>

  <rect x="680" y="210" width="150" height="40" fill="#0f172a" stroke="#38bdf8" rx="4"/>
  <text x="755" y="230" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">Character Timeout</text>
  <text x="755" y="245" fill="#cbd5e1" font-size="9" text-anchor="middle" font-family="sans-serif">Fires if line idle &gt; 4 chars</text>

  <text x="665" y="295" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">Guarantees partial bursts are never stranded in FIFO</text>
</svg>