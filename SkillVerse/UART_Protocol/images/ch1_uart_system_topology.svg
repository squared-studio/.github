<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <rect width="900" height="420" fill="#0f172a" rx="10"/>
  <rect x="15" y="15" width="870" height="390" fill="none" stroke="#1e293b" stroke-width="2" rx="8"/>
  <text x="450" y="45" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART System-on-Chip (SoC) Integration Topology</text>
  
  <!-- Host System -->
  <rect x="40" y="80" width="160" height="300" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="120" y="115" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Host System</text>
  <rect x="55" y="140" width="130" height="50" fill="#0f172a" stroke="#64748b" rx="5"/>
  <text x="120" y="170" fill="#f8fafc" font-size="13" text-anchor="middle" font-family="sans-serif">CPU Core / DMA</text>
  <rect x="55" y="210" width="130" height="50" fill="#0f172a" stroke="#64748b" rx="5"/>
  <text x="120" y="240" fill="#f8fafc" font-size="13" text-anchor="middle" font-family="sans-serif">Interrupt Controller</text>
  <rect x="55" y="280" width="130" height="70" fill="#0f172a" stroke="#64748b" rx="5"/>
  <text x="120" y="310" fill="#f8fafc" font-size="13" text-anchor="middle" font-family="sans-serif">System Bus</text>
  <text x="120" y="330" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">(APB / AXI4-Lite)</text>

  <!-- Bus Arrows -->
  <line x1="200" y1="315" x2="270" y2="315" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="270" y1="235" x2="200" y2="235" stroke="#facc15" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="235" y="225" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">IRQ Line</text>

  <!-- UART Controller IP -->
  <rect x="270" y="80" width="340" height="300" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="8"/>
  <text x="440" y="115" fill="#4ade80" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">UART Controller IP Core</text>

  <!-- Sub-blocks inside UART IP -->
  <rect x="290" y="140" width="140" height="60" fill="#0f172a" stroke="#38bdf8" rx="5"/>
  <text x="360" y="165" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Bus Slave Interface</text>
  <text x="360" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">&amp; Control Registers</text>

  <rect x="450" y="140" width="140" height="60" fill="#0f172a" stroke="#facc15" rx="5"/>
  <text x="520" y="165" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Baud Rate Gen</text>
  <text x="520" y="185" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">(16x Clock Divider)</text>

  <rect x="290" y="220" width="140" height="70" fill="#0f172a" stroke="#c084fc" rx="5"/>
  <text x="360" y="245" fill="#c084fc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">TX Subsystem</text>
  <text x="360" y="265" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">TX FIFO + PISO Shift</text>

  <rect x="290" y="300" width="140" height="70" fill="#0f172a" stroke="#f472b6" rx="5"/>
  <text x="360" y="325" fill="#f472b6" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">RX Subsystem</text>
  <text x="360" y="345" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Oversampler + RX FIFO</text>

  <rect x="450" y="220" width="140" height="150" fill="#0f172a" stroke="#64748b" rx="5"/>
  <text x="520" y="280" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Flow Control Logic</text>
  <text x="520" y="305" fill="#94a3b8" font-size="10" text-anchor="middle" font-family="sans-serif">RTS / CTS Handshake</text>

  <!-- Physical Transceiver -->
  <rect x="660" y="120" width="80" height="220" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" rx="6"/>
  <text x="700" y="210" fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle" transform="rotate(-90 700 210)" font-family="sans-serif">Transceiver (MAX232 / RS-485)</text>

  <!-- Signals: UART to Transceiver -->
  <line x1="430" y1="245" x2="660" y2="245" stroke="#c084fc" stroke-width="2"/>
  <text x="635" y="240" fill="#c084fc" font-size="10" text-anchor="end" font-family="sans-serif">TX (TTL)</text>
  <line x1="660" y1="325" x2="430" y2="325" stroke="#f472b6" stroke-width="2"/>
  <text x="635" y="320" fill="#f472b6" font-size="10" text-anchor="end" font-family="sans-serif">RX (TTL)</text>

  <!-- External World / Device -->
  <rect x="790" y="150" width="80" height="160" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="5"/>
  <text x="830" y="225" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">External</text>
  <text x="830" y="245" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Device / PC</text>

  <!-- Lines from Transceiver to External -->
  <line x1="740" y1="200" x2="790" y2="200" stroke="#f87171" stroke-width="2"/>
  <text x="765" y="195" fill="#f87171" font-size="9" text-anchor="middle" font-family="sans-serif">TXD (+-12V)</text>
  <line x1="790" y1="260" x2="740" y2="260" stroke="#f87171" stroke-width="2"/>
  <text x="765" y="255" fill="#f87171" font-size="9" text-anchor="middle" font-family="sans-serif">RXD (+-12V)</text>
</svg>