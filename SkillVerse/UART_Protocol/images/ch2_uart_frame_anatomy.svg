<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" fill="#0f172a" rx="10"/>
  <text x="460" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Anatomy of a Standard UART Packet Frame (8-N-1)</text>

  <!-- Frame Timeline -->
  <!-- Level 1 line (MARK/Idle) -->
  <line x1="40" y1="120" x2="120" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <text x="80" y="110" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">Idle (1)</text>

  <!-- Start bit: Drop to 0 -->
  <line x1="120" y1="120" x2="120" y2="190" stroke="#f87171" stroke-width="3"/>
  <line x1="120" y1="190" x2="190" y2="190" stroke="#f87171" stroke-width="3"/>
  <rect x="120" y="190" width="70" height="30" fill="#f87171" fill-opacity="0.2"/>
  <text x="155" y="210" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">START</text>
  <text x="155" y="235" fill="#f87171" font-size="10" text-anchor="middle" font-family="sans-serif">(0)</text>

  <!-- D0 (1) -->
  <line x1="190" y1="190" x2="190" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <line x1="190" y1="120" x2="260" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <rect x="190" y="120" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="225" y="140" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D0 (LSB)</text>
  <text x="225" y="165" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(1)</text>

  <!-- D1 (0) -->
  <line x1="260" y1="120" x2="260" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <line x1="260" y1="190" x2="330" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <rect x="260" y="190" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="295" y="210" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D1</text>
  <text x="295" y="235" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(0)</text>

  <!-- D2 (1) -->
  <line x1="330" y1="190" x2="330" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <line x1="330" y1="120" x2="400" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <rect x="330" y="120" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="365" y="140" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D2</text>
  <text x="365" y="165" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(1)</text>

  <!-- D3 (1) -->
  <line x1="400" y1="120" x2="470" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <rect x="400" y="120" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="435" y="140" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D3</text>
  <text x="435" y="165" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(1)</text>

  <!-- D4 (0) -->
  <line x1="470" y1="120" x2="470" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <line x1="470" y1="190" x2="540" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <rect x="470" y="190" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="505" y="210" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D4</text>
  <text x="505" y="235" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(0)</text>

  <!-- D5 (0) -->
  <line x1="540" y1="190" x2="610" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <rect x="540" y="190" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="575" y="210" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D5</text>
  <text x="575" y="235" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(0)</text>

  <!-- D6 (1) -->
  <line x1="610" y1="190" x2="610" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <line x1="610" y1="120" x2="680" y2="120" stroke="#38bdf8" stroke-width="3"/>
  <rect x="610" y="120" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="645" y="140" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D6</text>
  <text x="645" y="165" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(1)</text>

  <!-- D7 (0) MSB -->
  <line x1="680" y1="120" x2="680" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <line x1="680" y1="190" x2="750" y2="190" stroke="#38bdf8" stroke-width="3"/>
  <rect x="680" y="190" width="70" height="30" fill="#38bdf8" fill-opacity="0.2"/>
  <text x="715" y="210" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">D7 (MSB)</text>
  <text x="715" y="235" fill="#38bdf8" font-size="10" text-anchor="middle" font-family="sans-serif">(0)</text>

  <!-- Parity / Stop bit (1) -->
  <line x1="750" y1="190" x2="750" y2="120" stroke="#4ade80" stroke-width="3"/>
  <line x1="750" y1="120" x2="820" y2="120" stroke="#4ade80" stroke-width="3"/>
  <rect x="750" y="120" width="70" height="30" fill="#4ade80" fill-opacity="0.2"/>
  <text x="785" y="140" fill="#4ade80" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">STOP</text>
  <text x="785" y="165" fill="#4ade80" font-size="10" text-anchor="middle" font-family="sans-serif">(1)</text>

  <!-- Next Idle -->
  <line x1="820" y1="120" x2="890" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <text x="855" y="110" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">Idle (1)</text>

  <!-- Dimension line for 1 bit period -->
  <line x1="120" y1="270" x2="190" y2="270" stroke="#facc15" stroke-width="1.5"/>
  <line x1="120" y1="265" x2="120" y2="275" stroke="#facc15" stroke-width="1.5"/>
  <line x1="190" y1="265" x2="190" y2="275" stroke="#facc15" stroke-width="1.5"/>
  <text x="155" y="290" fill="#facc15" font-size="11" text-anchor="middle" font-family="sans-serif">T_bit = 1/Baud</text>

  <!-- Dimension line for Full Packet -->
  <line x1="120" y1="310" x2="820" y2="310" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="120" y1="305" x2="120" y2="315" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="820" y1="305" x2="820" y2="315" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="470" y="328" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">10-Bit Frame (1 Start + 8 Data + 1 Stop = 10 * T_bit)</text>
</svg>