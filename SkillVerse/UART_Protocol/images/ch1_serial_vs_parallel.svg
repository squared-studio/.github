<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <rect width="880" height="340" fill="#0f172a" rx="10"/>
  <text x="440" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">Parallel Bus vs. Asynchronous Serial Communication</text>
  
  <!-- Parallel -->
  <rect x="40" y="60" width="380" height="250" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="230" y="90" fill="#38bdf8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Parallel Bus (e.g. 8-Bit Bus + Clock)</text>
  <rect x="60" y="120" width="70" height="150" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="95" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">Transmitter</text>
  <rect x="330" y="120" width="70" height="150" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="365" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">Receiver</text>

  <!-- 8 data lines + clock -->
  <line x1="130" y1="135" x2="330" y2="135" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="155" x2="330" y2="155" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="175" x2="330" y2="175" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="195" x2="330" y2="195" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="215" x2="330" y2="215" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="235" x2="330" y2="235" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="130" y1="255" x2="330" y2="255" stroke="#facc15" stroke-width="2"/>
  <text x="230" y="250" fill="#facc15" font-size="10" text-anchor="middle" font-family="sans-serif">Clock Wire</text>

  <text x="230" y="295" fill="#f87171" font-size="11" text-anchor="middle" font-family="sans-serif">Drawbacks: High pin count, trace length skew, crosstalk</text>

  <!-- Serial -->
  <rect x="460" y="60" width="380" height="250" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" rx="8"/>
  <text x="650" y="90" fill="#4ade80" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">Asynchronous Serial (UART)</text>
  <rect x="480" y="120" width="70" height="150" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="515" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">TX Node</text>
  <rect x="750" y="120" width="70" height="150" fill="#0f172a" stroke="#64748b" rx="4"/>
  <text x="785" y="200" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="sans-serif">RX Node</text>

  <line x1="550" y1="165" x2="750" y2="165" stroke="#4ade80" stroke-width="2.5"/>
  <polygon points="745,160 755,165 745,170" fill="#4ade80"/>
  <text x="650" y="155" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">TXD Wire (Single bitstream)</text>

  <line x1="750" y1="225" x2="550" y2="225" stroke="#f472b6" stroke-width="2.5"/>
  <polygon points="555,220 545,225 555,230" fill="#f472b6"/>
  <text x="650" y="220" fill="#f472b6" font-size="11" text-anchor="middle" font-family="sans-serif">RXD Wire (Return bitstream)</text>

  <text x="650" y="295" fill="#4ade80" font-size="11" text-anchor="middle" font-family="sans-serif">Advantages: Only 2 wires, no clock skew, long distance</text>
</svg>