<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" fill="#0f172a" rx="10"/>
  <text x="460" y="35" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">RS-485 Multi-Drop Half-Duplex Differential Bus Architecture</text>

  <!-- Bus Termination Resistors -->
  <rect x="70" y="150" width="20" height="60" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
  <text x="60" y="185" fill="#facc15" font-size="10" text-anchor="end" font-family="sans-serif">120 Ohm</text>
  <rect x="830" y="150" width="20" height="60" fill="#0f172a" stroke="#facc15" stroke-width="2"/>
  <text x="860" y="185" fill="#facc15" font-size="10" font-family="sans-serif">120 Ohm</text>

  <!-- Bus Lines A (Non-inverting) and B (Inverting) -->
  <line x1="80" y1="160" x2="840" y2="160" stroke="#38bdf8" stroke-width="3"/>
  <text x="460" y="150" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Line A (D+)</text>
  
  <line x1="80" y1="200" x2="840" y2="200" stroke="#f87171" stroke-width="3"/>
  <text x="460" y="220" fill="#f87171" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Line B (D-)</text>

  <!-- Node 1 (Master) -->
  <rect x="140" y="70" width="130" height="60" fill="#1e293b" stroke="#4ade80" stroke-width="2" rx="6"/>
  <text x="205" y="95" fill="#4ade80" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Node 1 (Master)</text>
  <text x="205" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Transceiver (DE=1)</text>
  <line x1="180" y1="130" x2="180" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <line x1="230" y1="130" x2="230" y2="200" stroke="#f87171" stroke-width="2"/>

  <!-- Node 2 (Slave 1) -->
  <rect x="390" y="240" width="130" height="60" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="6"/>
  <text x="455" y="265" fill="#c084fc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Node 2 (Slave 1)</text>
  <text x="455" y="285" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Transceiver (DE=0)</text>
  <line x1="430" y1="240" x2="430" y2="200" stroke="#f87171" stroke-width="2"/>
  <line x1="480" y1="240" x2="480" y2="160" stroke="#38bdf8" stroke-width="2"/>

  <!-- Node 32 (Slave N) -->
  <rect x="670" y="70" width="130" height="60" fill="#1e293b" stroke="#f472b6" stroke-width="2" rx="6"/>
  <text x="735" y="95" fill="#f472b6" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Node 32 (Slave N)</text>
  <text x="735" y="115" fill="#cbd5e1" font-size="10" text-anchor="middle" font-family="sans-serif">Transceiver (DE=0)</text>
  <line x1="710" y1="130" x2="710" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <line x1="760" y1="130" x2="760" y2="200" stroke="#f87171" stroke-width="2"/>

  <text x="460" y="325" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Supports up to 32 unit loads, 1200 meters length, and differential common-mode noise rejection.</text>
</svg>