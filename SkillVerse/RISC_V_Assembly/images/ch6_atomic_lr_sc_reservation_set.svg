<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RV32A Extension: Load-Reserved / Store-Conditional (LR/SC)</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Lock-free atomic synchronization and reservation set tracking across multi-core systems</text>

  <!-- Step 1: LR.W -->
  <g transform="translate(60, 100)">
    <rect width="240" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="240" height="32" rx="8" fill="#0369a1"/>
    <text x="120" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">1. lr.w rd, (rs1)</text>

    <text x="15" y="55" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">Load-Reserved Action:</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="10" font-family="sans-serif">• Loads word from address (rs1)</text>
    <text x="15" y="92" fill="#cbd5e1" font-size="10" font-family="sans-serif">• CPU hardware registers a</text>
    <text x="15" y="108" fill="#fbbf24" font-size="10" font-weight="bold" font-family="sans-serif">  Reservation Set on address</text>

    <!-- State Box -->
    <rect x="15" y="130" width="210" height="50" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="120" y="150" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">Hardware Reservation Valid</text>
    <text x="120" y="168" fill="#bae6fd" font-size="9" font-family="sans-serif" text-anchor="middle">Monitors snooping bus transactions</text>

    <text x="120" y="210" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">Computes new value in registers</text>
  </g>

  <!-- Arrow -->
  <path d="M 300 200 L 350 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: SC.W -->
  <g transform="translate(360, 100)">
    <rect width="240" height="230" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="240" height="32" rx="8" fill="#b45309"/>
    <text x="120" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">2. sc.w rd, rs2, (rs1)</text>

    <text x="15" y="55" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">Store-Conditional Action:</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="10" font-family="sans-serif">• Checks if reservation is intact.</text>
    <text x="15" y="95" fill="#cbd5e1" font-size="10" font-family="sans-serif">Has another core or interrupt</text>
    <text x="15" y="112" fill="#cbd5e1" font-size="10" font-family="sans-serif">written to this memory block?</text>

    <!-- Decision Diamond -->
    <rect x="25" y="135" width="190" height="40" rx="4" fill="#0f172a" stroke="#fbbf24"/>
    <text x="120" y="158" fill="#fde047" font-size="10" font-family="sans-serif" text-anchor="middle">Reservation Still Valid?</text>

    <text x="120" y="205" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">Atomic commit point</text>
  </g>

  <!-- Split paths -->
  <path d="M 600 170 L 650 140" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 600 230 L 650 260" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Step 3: Outcomes -->
  <g transform="translate(660, 100)">
    <!-- Success -->
    <rect width="240" height="105" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="120" y="24" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">SUCCESS: rd = 0</text>
    <text x="15" y="48" fill="#a7f3d0" font-size="10" font-family="sans-serif">• Memory word written atomically.</text>
    <text x="15" y="68" fill="#a7f3d0" font-size="10" font-family="sans-serif">• Reservation invalidated.</text>
    <text x="15" y="88" fill="#fff" font-size="10" font-family="monospace">bnez rd, retry # Does NOT branch</text>

    <!-- Failure -->
    <g transform="translate(0, 120)">
      <rect width="240" height="110" rx="6" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5"/>
      <text x="120" y="24" fill="#f43f5e" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">FAILURE: rd != 0 (e.g. 1)</text>
      <text x="15" y="48" fill="#fda4af" font-size="10" font-family="sans-serif">• Store ABORTED; memory untouched.</text>
      <text x="15" y="68" fill="#fda4af" font-size="10" font-family="sans-serif">• Reservation was broken by peer.</text>
      <text x="15" y="92" fill="#fff" font-size="10" font-family="monospace">bnez rd, retry # Loops back to lr</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Atomic Memory Operations (AMO):</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• For simple fetch-and-modify operations, RV32A provides single-instruction AMOs: <tspan font-family="monospace" fill="#38bdf8">amoadd.w</tspan>, <tspan font-family="monospace" fill="#38bdf8">amoswap.w</tspan>, <tspan font-family="monospace" fill="#38bdf8">amoxor.w</tspan>.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• AMOs execute directly inside the memory controller or L2 cache without loop retry overhead.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Memory Ordering: LR/SC and AMOs support acquire (<tspan font-family="monospace">.aq</tspan>) and release (<tspan font-family="monospace">.rl</tspan>) bits for lock-free memory consistency.</text>
  </g>
</svg>
