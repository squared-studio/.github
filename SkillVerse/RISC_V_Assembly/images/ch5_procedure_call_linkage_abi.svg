<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V ABI Calling Convention: Caller-Callee Handshake</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Passing arguments in a0-a7, handling return values in a0-a1, and preserving registers across call boundary</text>

  <!-- Caller Side -->
  <g transform="translate(60, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#0369a1"/>
    <text x="125" y="21" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Caller Environment</text>

    <text x="15" y="55" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">1. Pass Arguments:</text>
    <rect x="15" y="65" width="220" height="50" rx="3" fill="#082f49" stroke="#38bdf8"/>
    <text x="25" y="83" fill="#bae6fd" font-size="10" font-family="monospace">a0 = arg 1, a1 = arg 2</text>
    <text x="25" y="101" fill="#bae6fd" font-size="10" font-family="monospace">a2..a7 = args 3..8</text>

    <text x="15" y="130" fill="#fbbf24" font-size="10" font-weight="bold" font-family="sans-serif">2. Spill 9+ Args to Stack:</text>
    <rect x="15" y="140" width="220" height="30" rx="3" fill="#451a03" stroke="#fbbf24"/>
    <text x="25" y="159" fill="#fde047" font-size="10" font-family="monospace">sw arg9, 0(sp)</text>

    <text x="125" y="195" fill="#f43f5e" font-size="10" font-family="sans-serif" text-anchor="middle">Must save t0-t6 if needed later!</text>
    <text x="125" y="212" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">jal ra, callee_func</text>
  </g>

  <!-- Center: Link Register Handshake -->
  <g transform="translate(345, 100)">
    <rect width="270" height="230" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="270" height="32" rx="8" fill="#b45309"/>
    <text x="135" y="21" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Hardware Call / Return Link</text>

    <!-- Link Register ra -->
    <rect x="20" y="50" width="230" height="50" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="135" y="70" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">x1 / ra (Link Register)</text>
    <text x="135" y="88" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">Hardware captures return address PC+4</text>

    <!-- Arrow down -->
    <path d="M 135 105 L 135 125" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

    <!-- Stack Pointer sp -->
    <rect x="20" y="130" width="230" height="50" rx="4" fill="#0f172a" stroke="#34d399"/>
    <text x="135" y="150" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">x2 / sp (Stack Pointer)</text>
    <text x="135" y="168" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">16-Byte Aligned Boundary</text>

    <text x="135" y="205" fill="#fde047" font-size="10" font-family="monospace" text-anchor="middle">ret -&gt; jalr x0, 0(ra)</text>
  </g>

  <!-- Callee Side -->
  <g transform="translate(650, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#047857"/>
    <text x="125" y="21" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Callee Subroutine</text>

    <text x="15" y="55" fill="#34d399" font-size="10" font-weight="bold" font-family="sans-serif">1. Callee Responsibilities:</text>
    <rect x="15" y="65" width="220" height="50" rx="3" fill="#064e3b" stroke="#34d399"/>
    <text x="25" y="83" fill="#a7f3d0" font-size="9" font-family="monospace">Preserve s0..s11 if used</text>
    <text x="25" y="101" fill="#a7f3d0" font-size="9" font-family="monospace">Preserve ra if non-leaf</text>

    <text x="15" y="130" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">2. Return Results:</text>
    <rect x="15" y="140" width="220" height="40" rx="3" fill="#082f49" stroke="#38bdf8"/>
    <text x="25" y="158" fill="#7dd3fc" font-size="10" font-family="monospace">a0 = return value (primary)</text>
    <text x="25" y="172" fill="#7dd3fc" font-size="10" font-family="monospace">a1 = return value (64-bit high)</text>

    <text x="125" y="205" fill="#34d399" font-size="10" font-family="sans-serif" text-anchor="middle">Reclaims frame via addi sp, sp, N</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 310 215 L 340 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 615 215 L 645 215" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Leaf Procedure Optimization:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• A <tspan font-weight="bold">Leaf Function</tspan> is a subroutine that makes NO child function calls.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Because it never executes <tspan font-family="monospace">call</tspan>, its <tspan font-family="monospace">ra</tspan> register is never overwritten! It can use scratch registers <tspan font-family="monospace">t0-t6</tspan> and <tspan font-family="monospace">a0-a7</tspan> without allocating ANY stack frame.</text>
    <text x="25" y="88" fill="#34d399" font-size="10" font-family="sans-serif">Zero stack overhead: Leaf procedures execute entirely in CPU registers with instant return.</text>
  </g>
</svg>
