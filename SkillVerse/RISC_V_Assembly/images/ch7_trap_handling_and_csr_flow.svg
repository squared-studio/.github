<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V Trap Lifecycle: Hardware Entry &amp; Software Handler</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Synchronous Exceptions &amp; Asynchronous Interrupts: mepc, mcause, mtvec, and mret</text>

  <!-- Step 1: Trap Event -->
  <g transform="translate(50, 100)">
    <rect width="210" height="230" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="210" height="32" rx="8" fill="#9f1239"/>
    <text x="105" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">1. Trap Triggered</text>

    <text x="15" y="55" fill="#fda4af" font-size="11" font-weight="bold" font-family="sans-serif">Exception or Interrupt:</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="10" font-family="sans-serif">• Timer Interrupt (MTIE)</text>
    <text x="15" y="93" fill="#cbd5e1" font-size="10" font-family="sans-serif">• External UART IRQ</text>
    <text x="15" y="111" fill="#cbd5e1" font-size="10" font-family="sans-serif">• Syscall (<tspan font-family="monospace">ecall</tspan>)</text>
    <text x="15" y="129" fill="#cbd5e1" font-size="10" font-family="sans-serif">• Illegal Instruction</text>

    <rect x="15" y="150" width="180" height="60" rx="4" fill="#4c0519" stroke="#f43f5e"/>
    <text x="105" y="172" fill="#fca5a5" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">CPU Freezes Pipeline</text>
    <text x="105" y="190" fill="#fecdd3" font-size="9" font-family="sans-serif" text-anchor="middle">Saves current PC into mepc</text>
  </g>

  <!-- Arrow -->
  <path d="M 260 215 L 300 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Hardware Updates CSRs -->
  <g transform="translate(310, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#0369a1"/>
    <text x="125" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">2. Hardware Updates CSRs</text>

    <g transform="translate(15, 48)">
      <rect width="220" height="32" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="15" y="20" fill="#38bdf8" font-size="10" font-family="monospace">mepc &lt;- Faulting / Next PC</text>

      <rect y="40" width="220" height="32" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="15" y="60" fill="#38bdf8" font-size="10" font-family="monospace">mcause &lt;- Exception Code</text>

      <rect y="80" width="220" height="32" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="15" y="100" fill="#38bdf8" font-size="10" font-family="monospace">mtval &lt;- Faulting Address</text>

      <rect y="120" width="220" height="45" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="15" y="138" fill="#7dd3fc" font-size="9" font-family="monospace">mstatus.MIE &lt;- 0 (Disable IRQs)</text>
      <text x="15" y="152" fill="#7dd3fc" font-size="9" font-family="monospace">mstatus.MPIE &lt;- Old MIE</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M 560 215 L 600 215" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 3: Vector Jump & Handler -->
  <g transform="translate(610, 100)">
    <rect width="300" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="300" height="32" rx="8" fill="#047857"/>
    <text x="150" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">3. Jump to mtvec &amp; Execute ISR</text>

    <text x="15" y="52" fill="#a7f3d0" font-size="10" font-family="monospace">PC &lt;- mtvec.BASE</text>

    <!-- Code Block -->
    <rect x="15" y="60" width="270" height="110" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="25" y="80" fill="#fff" font-size="9" font-family="monospace">trap_handler:</text>
    <text x="35" y="96" fill="#a7f3d0" font-size="9" font-family="monospace">addi sp, sp, -128 # Save GPRs</text>
    <text x="35" y="112" fill="#a7f3d0" font-size="9" font-family="monospace">csrr a0, mcause   # Inspect cause</text>
    <text x="35" y="128" fill="#a7f3d0" font-size="9" font-family="monospace">call c_interrupt_dispatcher</text>
    <text x="35" y="144" fill="#a7f3d0" font-size="9" font-family="monospace">addi sp, sp, 128  # Restore GPRs</text>
    <text x="35" y="160" fill="#fde047" font-size="10" font-weight="bold" font-family="monospace">mret              # Return from trap</text>

    <text x="150" y="195" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">mret restores PC from mepc</text>
    <text x="150" y="210" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">and restores interrupts (MIE &lt;- MPIE)</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(50, 350)">
    <rect width="860" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">mtvec Modes (Direct vs. Vectored):</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan font-weight="bold" fill="#38bdf8">Direct Mode (mtvec[1:0] = 0)</tspan>: ALL exceptions and interrupts jump to the exact same base address (<tspan font-family="monospace">mtvec.BASE</tspan>).</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan font-weight="bold" fill="#34d399">Vectored Mode (mtvec[1:0] = 1)</tspan>: Asynchronous interrupts jump directly to an indexed vector table: <tspan font-family="monospace">PC &lt;- mtvec.BASE + (mcause.code * 4)</tspan>.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Vectored mode avoids software dispatch latency, achieving sub-microsecond interrupt response times.</text>
  </g>
</svg>
