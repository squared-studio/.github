<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V Pseudo-Instruction Assembler Translation</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">How human-friendly mnemonics map directly to canonical hardware base instructions</text>

  <!-- Table Container -->
  <g transform="translate(60, 95)">
    <rect width="840" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Table Header -->
    <rect width="840" height="30" fill="#0369a1" rx="6"/>
    <text x="140" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Pseudo-Instruction (Source)</text>
    <text x="440" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Base Hardware Equivalent</text>
    <text x="710" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Description &amp; Role</text>

    <!-- Row 1: nop -->
    <g transform="translate(15, 40)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">nop</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">addi x0, x0, 0</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">No-operation pipeline stall</text>
    </g>

    <!-- Row 2: li -->
    <g transform="translate(15, 72)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">li rd, 0x12345678</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">lui rd, 0x12346; addi rd, rd, 0x678</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">Load 32-bit immediate</text>
    </g>

    <!-- Row 3: mv -->
    <g transform="translate(15, 104)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">mv rd, rs</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">addi rd, rs, 0</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">Copy register to register</text>
    </g>

    <!-- Row 4: not & neg -->
    <g transform="translate(15, 136)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">not rd, rs</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">xori rd, rs, -1</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">One's complement invert</text>
    </g>

    <!-- Row 5: j & ret -->
    <g transform="translate(15, 168)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">ret</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">jalr x0, 0(ra)</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">Return from subroutine</text>
    </g>

    <!-- Row 6: call -->
    <g transform="translate(15, 200)">
      <rect width="810" height="26" fill="#0f172a" rx="3"/>
      <text x="125" y="18" fill="#38bdf8" font-size="11" font-family="monospace">call symbol</text>
      <path d="M 240 13 L 280 13" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="425" y="18" fill="#34d399" font-size="11" font-family="monospace">auipc ra, off_hi; jalr ra, off_lo(ra)</text>
      <text x="695" y="18" fill="#cbd5e1" font-size="10" font-family="sans-serif">PC-relative ±2GB function call</text>
    </g>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">The Elegance of RISC-V Pseudo-Instructions:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Hardware decoders do not know or care about pseudo-ops like <tspan font-family="monospace" fill="#38bdf8">ret</tspan> or <tspan font-family="monospace" fill="#38bdf8">mv</tspan>; the GNU assembler automatically expands them at compile time.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• This dramatically reduces the physical silicon area of the CPU core by eliminating specialized execution hardware.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Programmers enjoy a high-level assembly dialect without burdening the processor's control logic.</text>
  </g>
</svg>
