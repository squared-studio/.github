<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Integer Comparison: SLT (Signed) vs. SLTU (Unsigned)</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">How RISC-V evaluates magnitude without condition flags or status registers</text>

  <!-- Left: SLT (Signed) -->
  <g transform="translate(60, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="390" height="30" rx="8" fill="#0369a1"/>
    <text x="195" y="20" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">slt rd, rs1, rs2 (Set Less Than - Signed)</text>

    <text x="20" y="55" fill="#38bdf8" font-size="11" font-family="monospace">li t0, -1   # 0xFFFFFFFF (-1 signed)</text>
    <text x="20" y="73" fill="#38bdf8" font-size="11" font-family="monospace">li t1, 1    # 0x00000001 (+1 signed)</text>
    <text x="20" y="91" fill="#f8fafc" font-size="11" font-family="monospace">slt t2, t0, t1 # Is -1 &lt; 1 ?</text>

    <!-- Visual Box -->
    <rect x="20" y="110" width="350" height="50" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="195" y="132" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Result: t2 = 1 (TRUE)</text>
    <text x="195" y="148" fill="#bae6fd" font-size="10" font-family="sans-serif" text-anchor="middle">Interprets 0xFFFFFFFF as -1</text>

    <rect x="20" y="170" width="350" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="190" fill="#cbd5e1" font-size="10" font-family="sans-serif">Branch Equivalent: <tspan font-family="monospace" fill="#38bdf8">blt rs1, rs2, label</tspan></text>
    <text x="25" y="208" fill="#94a3b8" font-size="9" font-family="sans-serif">Two's complement signed range: -2,147,483,648 to +2,147,483,647</text>
  </g>

  <!-- Right: SLTU (Unsigned) -->
  <g transform="translate(510, 95)">
    <rect width="390" height="240" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="390" height="30" rx="8" fill="#047857"/>
    <text x="195" y="20" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">sltu rd, rs1, rs2 (Set Less Than - Unsigned)</text>

    <text x="20" y="55" fill="#34d399" font-size="11" font-family="monospace">li t0, -1   # 0xFFFFFFFF (4,294,967,295 unsigned)</text>
    <text x="20" y="73" fill="#34d399" font-size="11" font-family="monospace">li t1, 1    # 0x00000001 (1 unsigned)</text>
    <text x="20" y="91" fill="#f8fafc" font-size="11" font-family="monospace">sltu t2, t0, t1 # Is 4.29B &lt; 1 ?</text>

    <!-- Visual Box -->
    <rect x="20" y="110" width="350" height="50" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="195" y="132" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Result: t2 = 0 (FALSE)</text>
    <text x="195" y="148" fill="#6ee7b7" font-size="10" font-family="sans-serif" text-anchor="middle">Interprets 0xFFFFFFFF as largest 32-bit positive int</text>

    <rect x="20" y="170" width="350" height="50" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="190" fill="#cbd5e1" font-size="10" font-family="sans-serif">Branch Equivalent: <tspan font-family="monospace" fill="#34d399">bltu rs1, rs2, label</tspan></text>
    <text x="25" y="208" fill="#94a3b8" font-size="9" font-family="sans-serif">Unsigned range: 0 to 4,294,967,295 (Pointer / Memory Addresses)</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">No Condition Flags (NZCV) in RISC-V:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Unlike ARM and x86, RISC-V does NOT have an implicit status register for Zero, Negative, or Carry flags.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• All comparisons produce explicit boolean 0 or 1 values in a general-purpose register (<tspan font-family="monospace">rd</tspan>), or fuse comparison into the branch instruction directly (<tspan font-family="monospace">blt</tspan>, <tspan font-family="monospace">bge</tspan>).</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Benefit: Eliminates complex inter-instruction data hazards on condition codes in out-of-order execution pipelines.</text>
  </g>
</svg>
