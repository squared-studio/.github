<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RV32M Extension: Integer Multiplication &amp; Division Datapath</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Producing 64-bit products from 32-bit registers (mul vs. mulh, mulhu, mulhsu) and division units</text>

  <!-- Left: Inputs -->
  <g transform="translate(60, 110)">
    <rect width="180" height="60" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="26" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">rs1 (32 bits)</text>
    <text x="90" y="44" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle">Multiplicand / Dividend</text>

    <rect y="80" width="180" height="60" rx="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="90" y="106" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">rs2 (32 bits)</text>
    <text x="90" y="124" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle">Multiplier / Divisor</text>
  </g>

  <!-- Connectors -->
  <path d="M 240 140 L 320 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 240 180 L 320 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Center: Multiplier / Divider Block -->
  <g transform="translate(330, 95)">
    <rect width="280" height="240" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="140" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Hardware Math Accelerator</text>

    <!-- Multiplier Block -->
    <rect x="20" y="45" width="240" height="85" rx="6" fill="#451a03" stroke="#f59e0b"/>
    <text x="130" y="68" fill="#fde047" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">32x32 Booth Multiplier</text>
    <text x="130" y="88" fill="#cbd5e1" font-size="10" font-family="sans-serif" text-anchor="middle">Calculates full 64-bit Product:</text>
    <text x="130" y="106" fill="#fde047" font-size="10" font-family="monospace" text-anchor="middle">P[63:0] = rs1 * rs2</text>

    <!-- Divider Block -->
    <rect x="20" y="140" width="240" height="80" rx="6" fill="#064e3b" stroke="#34d399"/>
    <text x="130" y="162" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Radix-4 Divider Unit</text>
    <text x="130" y="180" fill="#a7f3d0" font-size="10" font-family="sans-serif" text-anchor="middle">Computes Quotient &amp; Remainder:</text>
    <text x="130" y="198" fill="#34d399" font-size="10" font-family="monospace" text-anchor="middle">div = rs1 / rs2; rem = rs1 % rs2</text>
  </g>

  <!-- Connectors -->
  <path d="M 610 135 L 670 135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 610 220 L 670 220" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Instruction Routing -->
  <g transform="translate(680, 95)">
    <rect width="220" height="240" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="220" height="30" rx="8" fill="#0369a1"/>
    <text x="110" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Instruction Selector (rd)</text>

    <!-- mul -->
    <rect x="15" y="45" width="190" height="30" rx="3" fill="#082f49" stroke="#38bdf8"/>
    <text x="105" y="64" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">mul: Lower 32 bits P[31:0]</text>

    <!-- mulh variants -->
    <rect x="15" y="82" width="190" height="48" rx="3" fill="#082f49" stroke="#38bdf8"/>
    <text x="105" y="100" fill="#38bdf8" font-size="10" font-family="monospace" text-anchor="middle">mulh: Signed Upper P[63:32]</text>
    <text x="105" y="118" fill="#7dd3fc" font-size="9" font-family="monospace" text-anchor="middle">mulhu (unsign), mulhsu (mixed)</text>

    <!-- div & rem -->
    <rect x="15" y="140" width="190" height="32" rx="3" fill="#064e3b" stroke="#34d399"/>
    <text x="105" y="160" fill="#34d399" font-size="10" font-family="monospace" text-anchor="middle">div / divu: Quotient</text>

    <rect x="15" y="180" width="190" height="32" rx="3" fill="#064e3b" stroke="#34d399"/>
    <text x="105" y="200" fill="#34d399" font-size="10" font-family="monospace" text-anchor="middle">rem / remu: Remainder</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">Divide-by-Zero Semantics in RISC-V:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Unlike x86 (which triggers a hardware `#DE` divide fault trap), RISC-V does <tspan font-weight="bold">NOT trap on divide-by-zero</tspan>!</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Dividing by zero yields all bits set: <tspan font-family="monospace">x / 0 = -1 (0xFFFFFFFF)</tspan>, and the remainder is the dividend: <tspan font-family="monospace">x % 0 = x</tspan>.</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">This intentional choice simplifies pipeline exception recovery in deeply pipelined microarchitectures.</text>
  </g>
</svg>
