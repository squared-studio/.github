<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V Bare-Metal Boot Sequence &amp; CRT0 Startup</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">From hardware reset vector through stack init, .data copy, .bss zeroing, to C main()</text>

  <!-- 5 Sequential Stages -->
  <!-- Stage 1 -->
  <g transform="translate(40, 110)">
    <rect width="150" height="190" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="150" height="30" rx="6" fill="#0369a1"/>
    <text x="75" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">1. Reset Vector</text>

    <text x="15" y="55" fill="#38bdf8" font-size="10" font-family="monospace">PC = 0x80000000</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="9" font-family="sans-serif">Power-on reset trap.</text>
    <text x="15" y="93" fill="#cbd5e1" font-size="9" font-family="sans-serif">CPU starts in M-Mode.</text>
    <text x="15" y="115" fill="#fde047" font-size="10" font-family="monospace">csrw mie, 0</text>
    <text x="15" y="133" fill="#94a3b8" font-size="9" font-family="sans-serif">Interrupts disabled</text>
    <rect x="15" y="155" width="120" height="22" rx="3" fill="#0f172a"/>
    <text x="75" y="170" fill="#38bdf8" font-size="9" font-family="sans-serif" text-anchor="middle">Hardware Reset</text>
  </g>

  <!-- Arrow -->
  <path d="M 190 200 L 220 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(225, 110)">
    <rect width="150" height="190" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="150" height="30" rx="6" fill="#047857"/>
    <text x="75" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">2. Pointers Setup</text>

    <text x="15" y="55" fill="#34d399" font-size="10" font-family="monospace">la sp, _stack_top</text>
    <text x="15" y="75" fill="#cbd5e1" font-size="9" font-family="sans-serif">Initialize Stack Pointer</text>
    <text x="15" y="93" fill="#34d399" font-size="10" font-family="monospace">la gp, __global_pointer$</text>
    <text x="15" y="111" fill="#cbd5e1" font-size="9" font-family="sans-serif">Global pointer for</text>
    <text x="15" y="127" fill="#cbd5e1" font-size="9" font-family="sans-serif">small data relaxation</text>
    <rect x="15" y="155" width="120" height="22" rx="3" fill="#0f172a"/>
    <text x="75" y="170" fill="#34d399" font-size="9" font-family="sans-serif" text-anchor="middle">ABI Pointers Init</text>
  </g>

  <!-- Arrow -->
  <path d="M 375 200 L 405 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(410, 110)">
    <rect width="150" height="190" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="150" height="30" rx="6" fill="#b45309"/>
    <text x="75" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">3. Memory Init</text>

    <text x="15" y="55" fill="#fbbf24" font-size="10" font-family="sans-serif">Copy .data section:</text>
    <text x="15" y="73" fill="#cbd5e1" font-size="9" font-family="monospace">Flash ROM -&gt; RAM</text>
    <text x="15" y="98" fill="#fbbf24" font-size="10" font-family="sans-serif">Zero-fill .bss section:</text>
    <text x="15" y="116" fill="#cbd5e1" font-size="9" font-family="monospace">RAM = 0x00</text>
    <text x="15" y="138" fill="#94a3b8" font-size="8" font-family="sans-serif">Ensures C variables valid</text>
    <rect x="15" y="155" width="120" height="22" rx="3" fill="#0f172a"/>
    <text x="75" y="170" fill="#fbbf24" font-size="9" font-family="sans-serif" text-anchor="middle">RAM Sections Ready</text>
  </g>

  <!-- Arrow -->
  <path d="M 560 200 L 590 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4 -->
  <g transform="translate(595, 110)">
    <rect width="150" height="190" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <rect width="150" height="30" rx="6" fill="#4338ca"/>
    <text x="75" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">4. Trap Vector Setup</text>

    <text x="15" y="55" fill="#a5b4fc" font-size="10" font-family="monospace">la t0, trap_vector</text>
    <text x="15" y="73" fill="#a5b4fc" font-size="10" font-family="monospace">csrw mtvec, t0</text>
    <text x="15" y="98" fill="#cbd5e1" font-size="9" font-family="sans-serif">Enables ISR trapping</text>
    <text x="15" y="116" fill="#fde047" font-size="9" font-family="monospace">csrsi mstatus, 0x08</text>
    <text x="15" y="134" fill="#cbd5e1" font-size="9" font-family="sans-serif">Enables global IRQ</text>
    <rect x="15" y="155" width="120" height="22" rx="3" fill="#0f172a"/>
    <text x="75" y="170" fill="#a5b4fc" font-size="9" font-family="sans-serif" text-anchor="middle">Hardware Traps Live</text>
  </g>

  <!-- Arrow -->
  <path d="M 745 200 L 775 200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5 -->
  <g transform="translate(780, 110)">
    <rect width="140" height="190" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="140" height="30" rx="6" fill="#047857"/>
    <text x="70" y="20" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">5. Jump to main()</text>

    <text x="15" y="55" fill="#34d399" font-size="11" font-family="monospace">call main</text>
    <text x="15" y="80" fill="#cbd5e1" font-size="9" font-family="sans-serif">Execution passes</text>
    <text x="15" y="98" fill="#cbd5e1" font-size="9" font-family="sans-serif">to user C code.</text>
    <text x="15" y="125" fill="#f43f5e" font-size="10" font-family="monospace">hang: wfi; j hang</text>
    <text x="15" y="142" fill="#94a3b8" font-size="8" font-family="sans-serif">Trap if main returns</text>
    <rect x="15" y="155" width="110" height="22" rx="3" fill="#0f172a"/>
    <text x="70" y="170" fill="#34d399" font-size="9" font-family="sans-serif" text-anchor="middle">Application Running</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(40, 345)">
    <rect width="880" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#fbbf24" font-size="13" font-weight="bold" font-family="sans-serif">The Role of the Global Pointer (gp Relaxation):</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• RISC-V linkers use the Global Pointer (<tspan font-family="monospace" fill="#38bdf8">gp</tspan>) to optimize data accesses: any global variable within <tspan font-weight="bold">±2KB of gp</tspan> is accessed in a SINGLE instruction:</text>
    <text x="40" y="68" fill="#34d399" font-size="10" font-family="monospace">lw t0, offset(gp)   # 1 instruction (instead of lui + lw)</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="11" font-family="sans-serif">• The startup code MUST initialize <tspan font-family="monospace">gp</tspan> before referencing any global data symbols.</text>
  </g>
</svg>
