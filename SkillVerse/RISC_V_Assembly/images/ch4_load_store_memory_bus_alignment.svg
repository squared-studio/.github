<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V Load/Store Memory Access &amp; Extension Hardware</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">Byte, Halfword, and Word Transfers: Sign Extension vs. Zero Extension</text>

  <!-- Left: Memory Word (4 Bytes) -->
  <g transform="translate(60, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#0369a1"/>
    <text x="125" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Physical 32-bit Memory Word</text>

    <!-- 4 Bytes -->
    <g transform="translate(15, 48)">
      <rect width="220" height="35" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="110" y="22" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">Byte 3 [31:24] = 0x12</text>

      <rect y="42" width="220" height="35" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="110" y="64" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">Byte 2 [23:16] = 0x34</text>

      <rect y="84" width="220" height="35" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="110" y="106" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">Byte 1 [15:8]  = 0x8A (Negative)</text>

      <rect y="126" width="220" height="35" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="110" y="148" fill="#7dd3fc" font-size="10" font-family="monospace" text-anchor="middle">Byte 0 [7:0]   = 0xBC</text>
    </g>

    <text x="125" y="218" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">Little-Endian Byte Organization</text>
  </g>

  <!-- Middle: Load Variations -->
  <g transform="translate(345, 100)">
    <rect width="270" height="230" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <rect width="270" height="32" rx="8" fill="#b45309"/>
    <text x="135" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Instruction &amp; Extension Type</text>

    <!-- lb -->
    <g transform="translate(15, 45)">
      <rect width="240" height="38" rx="4" fill="#0f172a" stroke="#f43f5e"/>
      <text x="15" y="16" fill="#f43f5e" font-size="10" font-weight="bold" font-family="monospace">lb rd, 1(rs1)  # Byte 1</text>
      <text x="15" y="30" fill="#fda4af" font-size="9" font-family="sans-serif">Signed: Replicates bit 7 (1)</text>
    </g>

    <!-- lbu -->
    <g transform="translate(15, 88)">
      <rect width="240" height="38" rx="4" fill="#0f172a" stroke="#34d399"/>
      <text x="15" y="16" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace">lbu rd, 1(rs1) # Byte 1</text>
      <text x="15" y="30" fill="#a7f3d0" font-size="9" font-family="sans-serif">Unsigned: Zero-extends [31:8]</text>
    </g>

    <!-- lh / lhu -->
    <g transform="translate(15, 131)">
      <rect width="240" height="38" rx="4" fill="#0f172a" stroke="#38bdf8"/>
      <text x="15" y="16" fill="#38bdf8" font-size="10" font-weight="bold" font-family="monospace">lh / lhu rd, 0(rs1)</text>
      <text x="15" y="30" fill="#bae6fd" font-size="9" font-family="sans-serif">16-bit Halfword transfer</text>
    </g>

    <!-- lw -->
    <g transform="translate(15, 174)">
      <rect width="240" height="38" rx="4" fill="#0f172a" stroke="#fbbf24"/>
      <text x="15" y="16" fill="#fbbf24" font-size="10" font-weight="bold" font-family="monospace">lw rd, 0(rs1)</text>
      <text x="15" y="30" fill="#fde047" font-size="9" font-family="sans-serif">Full 32-bit Word copy</text>
    </g>
  </g>

  <!-- Right: Result in 32-bit GPR (rd) -->
  <g transform="translate(650, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="250" height="32" rx="8" fill="#047857"/>
    <text x="125" y="21" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Destination Register (rd)</text>

    <!-- lb result -->
    <g transform="translate(15, 48)">
      <rect width="220" height="35" rx="3" fill="#4c0519" stroke="#f43f5e"/>
      <text x="110" y="15" fill="#fca5a5" font-size="9" font-family="sans-serif" text-anchor="middle">lb result (Sign Extended):</text>
      <text x="110" y="28" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">0xFFFFFF8A</text>
    </g>

    <!-- lbu result -->
    <g transform="translate(15, 90)">
      <rect width="220" height="35" rx="3" fill="#064e3b" stroke="#34d399"/>
      <text x="110" y="15" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">lbu result (Zero Extended):</text>
      <text x="110" y="28" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">0x0000008A</text>
    </g>

    <!-- lw result -->
    <g transform="translate(15, 132)">
      <rect width="220" height="35" rx="3" fill="#082f49" stroke="#38bdf8"/>
      <text x="110" y="15" fill="#bae6fd" font-size="9" font-family="sans-serif" text-anchor="middle">lw result (Exact Word):</text>
      <text x="110" y="28" fill="#fff" font-size="10" font-family="monospace" text-anchor="middle">0x12348ABC</text>
    </g>

    <text x="125" y="218" fill="#34d399" font-size="10" font-family="sans-serif" text-anchor="middle">Zero Latency ALU Bypass</text>
  </g>

  <!-- Connectors -->
  <path d="M 310 215 L 340 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 615 215 L 645 215" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Stores and Memory Bus Lanes:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Store instructions (<tspan font-family="monospace" fill="#38bdf8">sb</tspan>, <tspan font-family="monospace" fill="#38bdf8">sh</tspan>, <tspan font-family="monospace" fill="#38bdf8">sw</tspan>) only take data from the <tspan font-weight="bold">least-significant bits</tspan> of <tspan font-family="monospace">rs2</tspan> and write them to memory.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Memory bus byte-enable strobes (e.g. AXI <tspan font-family="monospace">WSTRB</tspan>) assert high only for targeted byte lanes (1 byte for <tspan font-family="monospace">sb</tspan>, 2 bytes for <tspan font-family="monospace">sh</tspan>, 4 bytes for <tspan font-family="monospace">sw</tspan>).</text>
    <text x="25" y="88" fill="#94a3b8" font-size="10" font-family="sans-serif">Unaligned memory accesses: In base RV32I, unaligned loads/stores can trigger misaligned address traps or be handled in hardware.</text>
  </g>
</svg>
