<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0b1120" rx="8"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="480" y="38" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">RISC-V Modular ISA Architecture &amp; Standard Extensions</text>
  <text x="480" y="62" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">A frozen, minimalist base integer core paired with optional, composable hardware accelerators</text>

  <!-- Central Base ISA -->
  <g transform="translate(60, 100)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="250" height="34" rx="8" fill="#0369a1"/>
    <text x="125" y="23" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">Base Integer ISA</text>

    <rect x="20" y="50" width="210" height="42" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="125" y="68" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">RV32I (32-bit Base)</text>
    <text x="125" y="84" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">40 Base Instructions (Fixed)</text>

    <rect x="20" y="102" width="210" height="42" rx="4" fill="#082f49" stroke="#38bdf8"/>
    <text x="125" y="120" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">RV64I (64-bit Base)</text>
    <text x="125" y="136" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">XLEN = 64, Widened GPRs</text>

    <rect x="20" y="154" width="210" height="42" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="125" y="172" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">RV32E (Embedded Base)</text>
    <text x="125" y="188" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">16 GPRs for area-critical silicon</text>

    <text x="125" y="218" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">Permanently Frozen Core</text>
  </g>

  <!-- Connectors -->
  <path d="M 310 150 L 370 120" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 180 L 370 170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 210 L 370 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 310 240 L 370 270" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right: Standard Extensions Grid -->
  <g transform="translate(380, 100)">
    <rect width="520" height="230" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <rect width="520" height="34" rx="8" fill="#047857"/>
    <text x="260" y="23" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">Standard Modular Extensions</text>

    <!-- Row 1 -->
    <g transform="translate(15, 48)">
      <rect width="155" height="50" rx="4" fill="#064e3b" stroke="#34d399"/>
      <text x="77" y="20" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'M' Extension</text>
      <text x="77" y="38" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">Integer Mult &amp; Divide</text>

      <rect x="170" y="0" width="155" height="50" rx="4" fill="#064e3b" stroke="#34d399"/>
      <text x="247" y="20" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'A' Extension</text>
      <text x="247" y="38" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">Atomic Memory Ops</text>

      <rect x="340" y="0" width="155" height="50" rx="4" fill="#064e3b" stroke="#34d399"/>
      <text x="417" y="20" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'F' &amp; 'D' Extensions</text>
      <text x="417" y="38" fill="#a7f3d0" font-size="9" font-family="sans-serif" text-anchor="middle">Single / Double Float (IEEE)</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(15, 108)">
      <rect width="155" height="50" rx="4" fill="#451a03" stroke="#fbbf24"/>
      <text x="77" y="20" fill="#fbbf24" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'C' Extension</text>
      <text x="77" y="38" fill="#fde047" font-size="9" font-family="sans-serif" text-anchor="middle">Compressed 16-bit Code</text>

      <rect x="170" y="0" width="155" height="50" rx="4" fill="#451a03" stroke="#fbbf24"/>
      <text x="247" y="20" fill="#fbbf24" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'B' Extension</text>
      <text x="247" y="38" fill="#fde047" font-size="9" font-family="sans-serif" text-anchor="middle">Bit Manipulation Instructions</text>

      <rect x="340" y="0" width="155" height="50" rx="4" fill="#451a03" stroke="#fbbf24"/>
      <text x="417" y="20" fill="#fbbf24" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">'V' Extension</text>
      <text x="417" y="38" fill="#fde047" font-size="9" font-family="sans-serif" text-anchor="middle">Scalable Vector Processor</text>
    </g>

    <!-- Bottom summary badge -->
    <rect x="15" y="168" width="490" height="48" rx="4" fill="#0f172a" stroke="#38bdf8"/>
    <text x="260" y="188" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">RV32G = RV32I + M + A + F + D + Zicsr + Zifencei</text>
    <text x="260" y="204" fill="#94a3b8" font-size="10" font-family="sans-serif" text-anchor="middle">The General-Purpose Standard Profile for Unix / Linux Operating Systems</text>
  </g>

  <!-- Bottom Explanatory Box -->
  <g transform="translate(60, 350)">
    <rect width="840" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="26" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">Why RISC-V's Modularity Changed Computer Architecture:</text>
    <text x="25" y="48" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#34d399" font-weight="bold">No Architectural Bloat</tspan>: Unlike x86 (which carries 40 years of legacy baggage), a micro-controller only implements RV32I or RV32EC.</text>
    <text x="25" y="68" fill="#cbd5e1" font-size="11" font-family="sans-serif">• <tspan fill="#fbbf24" font-weight="bold">Custom Accelerator Space</tspan>: Four designated custom opcode spaces (<tspan font-family="monospace">custom-0</tspan> through <tspan font-family="monospace">custom-3</tspan>) allow designers to add proprietary instructions without breaking standard software.</text>
    <text x="25" y="88" fill="#cbd5e1" font-size="11" font-family="sans-serif">• Open specification licensed under Creative Commons; completely royalty-free for academic and commercial ASIC/FPGA silicon.</text>
  </g>
</svg>
