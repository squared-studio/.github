<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="retArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg12)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CHI Protocol-Level Retry &amp; PCrd (Protocol Credit) Flow</text>

  <!-- Lifelines -->
  <g transform="translate(180, 60)">
    <rect width="140" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">RN-F (Requestor)</text>
    <line x1="70" y1="40" x2="70" y2="340" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  </g>
  <g transform="translate(530, 60)">
    <rect width="140" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="70" y="25" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">HN-F (Home Node)</text>
    <line x1="70" y1="40" x2="70" y2="340" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Step 1: REQ (ReadShared) -->
  <path d="M 250 130 L 600 130" stroke="#38bdf8" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="425" y="122" fill="#38bdf8" font-size="11" text-anchor="middle">1. REQ (ReadShared) [HN-F Tracker Full!]</text>

  <!-- Step 2: RetryAck -->
  <path d="M 600 175 L 250 175" stroke="#f87171" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="425" y="167" fill="#fca5a5" font-size="11" text-anchor="middle">2. RSP (RetryAck, PCrdType = TrackerCredit)</text>

  <!-- Step 3: PCrdGrant (Later when tracker entry frees up) -->
  <path d="M 600 235 L 250 235" stroke="#34d399" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="425" y="227" fill="#34d399" font-size="11" text-anchor="middle">3. RSP (PCrdGrant, Credit Allocated to RN-F)</text>

  <!-- Step 4: Re-issue REQ with Credit -->
  <path d="M 250 295 L 600 295" stroke="#38bdf8" stroke-width="2" marker-end="url(#retArr)"/>
  <text x="425" y="287" fill="#38bdf8" font-size="11" text-anchor="middle">4. REQ (ReadShared, AllowRetry=0, Consuming PCrd)</text>
</svg>