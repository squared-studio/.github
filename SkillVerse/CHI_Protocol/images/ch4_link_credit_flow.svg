<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <marker id="flitArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="crdArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg5)"/>
  <text x="425" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Link Layer Credit-Based Flow Control (LCRDV Mechanism)</text>

  <!-- Transmitter (TX) -->
  <g transform="translate(80, 80)">
    <rect width="240" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="120" y="32" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Transmitter (TX)</text>
    
    <rect x="25" y="60" width="190" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="85" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Link Credit Counter</text>
    <text x="120" y="115" fill="#38bdf8" font-size="24" font-weight="bold" text-anchor="middle" font-family="monospace">Credits: 3</text>
    
    <rect x="25" y="150" width="190" height="100" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="120" y="175" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">TX Rules:</text>
    <text x="120" y="198" fill="#dbeafe" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• If Credit > 0: Send Flit</text>
    <text x="120" y="218" fill="#dbeafe" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• Decrement counter on send</text>
    <text x="120" y="238" fill="#dbeafe" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• Increment on LCRDV pulse</text>
  </g>

  <!-- Receiver (RX) -->
  <g transform="translate(530, 80)">
    <rect width="240" height="280" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="120" y="32" fill="#34d399" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Receiver (RX)</text>
    
    <rect x="25" y="60" width="190" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="120" y="85" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Input Buffer Queue</text>
    <text x="120" y="112" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">[ Slot 0 ][ Slot 1 ][ Slot 2 ]</text>
    
    <rect x="25" y="150" width="190" height="100" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="120" y="175" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">RX Rules:</text>
    <text x="120" y="198" fill="#d1fae5" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• Guaranteed buffer space</text>
    <text x="120" y="218" fill="#d1fae5" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• Never backpressures / stalls</text>
    <text x="120" y="238" fill="#d1fae5" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">• Emits LCRDV when buffer frees</text>
  </g>

  <!-- Middle Interconnect Wires -->
  <!-- Forward Path: TXFLITV & TXFLIT -->
  <path d="M 320 160 L 530 160" stroke="#38bdf8" stroke-width="3" marker-end="url(#flitArr)"/>
  <text x="425" y="150" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">TXFLITV &amp; TXFLIT (Data/Command)</text>

  <!-- Return Path: RXLCRDV (Credit return) -->
  <path d="M 530 260 L 320 260" stroke="#34d399" stroke-width="3" marker-end="url(#crdArr)"/>
  <text x="425" y="285" fill="#34d399" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">RXLCRDV (Link Credit Return Pulse)</text>
</svg>