<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="wArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="wdatArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg8)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CHI WriteUnique Flow: DBIDResp &amp; Non-CopyBack Write</text>

  <!-- Lifelines -->
  <g transform="translate(150, 60)">
    <rect width="140" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="70" y="25" fill="#38bdf8" font-size="13" font-weight="bold" text-anchor="middle">RN-F (Requestor)</text>
    <line x1="70" y1="40" x2="70" y2="340" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  </g>
  <g transform="translate(560, 60)">
    <rect width="140" height="40" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="70" y="25" fill="#818cf8" font-size="13" font-weight="bold" text-anchor="middle">HN-F (Home Node)</text>
    <line x1="70" y1="40" x2="70" y2="340" stroke="#475569" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <!-- Step 1: WriteUniquePtl/Full -->
  <path d="M 220 130 L 630 130" stroke="#38bdf8" stroke-width="2" marker-end="url(#wArr)"/>
  <text x="425" y="122" fill="#38bdf8" font-size="11" text-anchor="middle">1. REQ (WriteUniquePtl, TxnID=0x4)</text>

  <!-- Step 2: DBIDResp (Data Buffer ID Response) -->
  <path d="M 630 180 L 220 180" stroke="#818cf8" stroke-width="2" marker-end="url(#wArr)"/>
  <text x="425" y="172" fill="#a5b4fc" font-size="11" text-anchor="middle">2. RSP (DBIDResp, DBID=0xA) [Write Credit Granted]</text>

  <!-- Step 3: NCBDAT (Non-CopyBack Write Data) -->
  <path d="M 220 235 L 630 235" stroke="#ec4899" stroke-width="2.5" marker-end="url(#wdatArr)"/>
  <text x="425" y="227" fill="#f472b6" font-size="11" text-anchor="middle">3. DAT (NCBWrData, TxnID=0xA, Payload)</text>

  <!-- Step 4: Comp Response -->
  <path d="M 630 290 L 220 290" stroke="#34d399" stroke-width="2" marker-end="url(#wArr)"/>
  <text x="425" y="282" fill="#34d399" font-size="11" text-anchor="middle">4. RSP (Comp, TxnID=0x4) [Transaction Committed]</text>
</svg>