<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg15" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <marker id="dvmArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg15)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CHI Distributed Virtual Memory (DVM) Message Routing via MN</text>

  <!-- Initiator RN-F -->
  <g transform="translate(50, 160)">
    <rect width="150" height="90" rx="8" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">RN-F (DVM Master)</text>
    <text x="75" y="55" fill="#d1fae5" font-size="10" text-anchor="middle">Executes TLBI instruction</text>
    <text x="75" y="75" fill="#a7f3d0" font-size="10" text-anchor="middle">Issues DVM Op Flit</text>
  </g>

  <!-- Central Miscellaneous Node (MN) -->
  <g transform="translate(340, 130)">
    <rect width="170" height="150" rx="10" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="85" y="28" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">MN (Misc Node)</text>
    <text x="85" y="48" fill="#c7d2fe" font-size="10" text-anchor="middle">DVM Orchestrator</text>
    <text x="85" y="80" fill="#e0e7ff" font-size="10" text-anchor="middle">• Broadcasts SnpDVMOp</text>
    <text x="85" y="100" fill="#e0e7ff" font-size="10" text-anchor="middle">• Tracks all peer acks</text>
    <text x="85" y="125" fill="#fde68a" font-size="10" font-weight="bold" text-anchor="middle">Sync Completion</text>
  </g>

  <!-- Peer RN-Fs -->
  <g transform="translate(650, 70)">
    <rect width="150" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">RN-F 1</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Flushes local TLB</text>
  </g>
  <g transform="translate(650, 160)">
    <rect width="150" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">RN-F 2</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Flushes local TLB</text>
  </g>
  <g transform="translate(650, 250)">
    <rect width="150" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="75" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">RN-F 3</text>
    <text x="75" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">Flushes local TLB</text>
  </g>

  <!-- Connectors -->
  <path d="M 200 205 L 340 205" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#dvmArr)"/>
  <path d="M 510 170 L 650 105" stroke="#818cf8" stroke-width="2" marker-end="url(#dvmArr)"/>
  <path d="M 510 205 L 650 205" stroke="#818cf8" stroke-width="2" marker-end="url(#dvmArr)"/>
  <path d="M 510 240 L 650 285" stroke="#818cf8" stroke-width="2" marker-end="url(#dvmArr)"/>
</svg>