<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
    <marker id="marr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="routeArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg2)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">2D Mesh Network-on-Chip (NoC) & Dimension-Order Routing</text>

  <!-- Grid of Routers (XP - Crosspoints) -->
  <!-- Row 0 -->
  <g transform="translate(140, 70)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (0,0)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">RN-F 0</text>
  </g>
  <g transform="translate(375, 70)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (1,0)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">HN-F 0</text>
  </g>
  <g transform="translate(610, 70)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (2,0)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SN-F 0</text>
  </g>

  <!-- Row 1 -->
  <g transform="translate(140, 230)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (0,1)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">RN-F 1</text>
  </g>
  <g transform="translate(375, 230)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (1,1)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">HN-F 1</text>
  </g>
  <g transform="translate(610, 230)">
    <rect width="100" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="26" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">XP (2,1)</text>
    <text x="50" y="44" fill="#e2e8f0" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">SN-F 1</text>
  </g>

  <!-- Horizontal Mesh Links -->
  <line x1="240" y1="105" x2="375" y2="105" stroke="#475569" stroke-width="4"/>
  <line x1="475" y1="105" x2="610" y2="105" stroke="#475569" stroke-width="4"/>
  <line x1="240" y1="265" x2="375" y2="265" stroke="#475569" stroke-width="4"/>
  <line x1="475" y1="265" x2="610" y2="265" stroke="#475569" stroke-width="4"/>

  <!-- Vertical Mesh Links -->
  <line x1="190" y1="140" x2="190" y2="230" stroke="#475569" stroke-width="4"/>
  <line x1="425" y1="140" x2="425" y2="230" stroke="#475569" stroke-width="4"/>
  <line x1="660" y1="140" x2="660" y2="230" stroke="#475569" stroke-width="4"/>

  <!-- X-First Routing Highlight (Pink Path) from RN-F 1 (0,1) to SN-F 0 (2,0) -->
  <path d="M 190 265 L 425 265 L 660 265 L 660 140" fill="none" stroke="#ec4899" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#routeArr)"/>
  
  <rect x="230" y="340" width="390" height="60" rx="8" fill="#1e1e38" stroke="#ec4899" stroke-width="1.5"/>
  <text x="425" y="362" fill="#f472b6" font-size="13" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Dimension-Order Routing (X-First then Y):</text>
  <text x="425" y="383" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="system-ui, sans-serif">Traverses X-dimension fully before turning into Y-dimension (Deadlock-Free)</text>
</svg>