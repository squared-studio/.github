<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="chiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  <text x="425" y="35" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Evolution from AMBA ACE to AMBA 5 CHI</text>
  
  <!-- Left Side: ACE Architecture -->
  <g transform="translate(40, 70)">
    <rect width="360" height="310" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
    <rect width="360" height="40" rx="10" fill="url(#aceGrad)"/>
    <text x="180" y="26" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AMBA 4 ACE: Dedicated Signal Buses</text>
    
    <rect x="25" y="60" width="310" height="45" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="180" y="87" fill="#f1f5f9" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">5 AXI Channels + 3 Dedicated Snoop Channels</text>
    
    <g transform="translate(25, 120)">
      <rect width="310" height="30" rx="4" fill="#475569"/>
      <text x="155" y="20" fill="#f8fafc" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">AW, W, B, AR, R (Primary Master-to-Slave)</text>
      <rect y="40" width="310" height="30" rx="4" fill="#475569"/>
      <text x="155" y="60" fill="#f8fafc" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif">AC, CR, CD (Interconnect-to-Master Snoop)</text>
    </g>
    
    <rect x="25" y="210" width="310" height="80" rx="6" fill="#2d1515" stroke="#f87171" stroke-width="1"/>
    <text x="35" y="235" fill="#fca5a5" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Scaling Bottlenecks:</text>
    <text x="35" y="255" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• 100s of discrete physical wires per master interface</text>
    <text x="35" y="275" fill="#fecaca" font-size="11" font-family="system-ui, sans-serif">• Severe routing congestion beyond 4-8 cores</text>
  </g>

  <!-- Right Side: CHI Architecture -->
  <g transform="translate(450, 70)">
    <rect width="360" height="310" rx="10" fill="#1e1e2e" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="360" height="40" rx="10" fill="url(#chiGrad)"/>
    <text x="180" y="26" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">AMBA 5 CHI: Packetized Layered NoC</text>
    
    <!-- Protocol Layer -->
    <rect x="25" y="55" width="310" height="42" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="180" y="75" fill="#93c5fd" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Protocol Layer</text>
    <text x="180" y="90" fill="#dbeafe" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Transaction definitions, Coherency states, Packet generation</text>
    
    <!-- Network Layer -->
    <rect x="25" y="105" width="310" height="42" rx="6" fill="#1d4ed8" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="180" y="125" fill="#bfdbfe" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Network Layer</text>
    <text x="180" y="140" fill="#eff6ff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">NodeID routing, Virtual Networks (VNET), Packet-to-Flit</text>
    
    <!-- Link Layer -->
    <rect x="25" y="155" width="310" height="42" rx="6" fill="#2563eb" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="180" y="175" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Link Layer</text>
    <text x="180" y="190" fill="#eff6ff" font-size="10" text-anchor="middle" font-family="system-ui, sans-serif">Credit-based flow control (LCRDV), Flit framing, Link handshakes</text>
    
    <rect x="25" y="210" width="310" height="80" rx="6" fill="#172554" stroke="#60a5fa" stroke-width="1"/>
    <text x="35" y="235" fill="#93c5fd" font-size="12" font-weight="bold" font-family="system-ui, sans-serif">Architectural Breakthrough:</text>
    <text x="35" y="255" fill="#dbeafe" font-size="11" font-family="system-ui, sans-serif">• Packetized links scale seamlessly to 128+ cores</text>
    <text x="35" y="275" fill="#dbeafe" font-size="11" font-family="system-ui, sans-serif">• 2D Mesh and Ring topologies with modular routers</text>
  </g>
</svg>