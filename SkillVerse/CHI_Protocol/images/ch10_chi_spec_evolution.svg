<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg16)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Architectural Evolution of AMBA CHI: Issue A through Issue G</text>

  <!-- Timeline Cards -->
  <g transform="translate(40, 65)">
    <!-- CHI-A & CHI-B -->
    <rect width="220" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="220" height="30" rx="8" fill="#0284c7"/>
    <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Issue A &amp; B (Core CHI)</text>
    <text x="15" y="55" fill="#e0f2fe" font-size="10">• Layered NoC Architecture</text>
    <text x="15" y="75" fill="#e0f2fe" font-size="10">• REQ, RSP, DAT, SNP flits</text>
    <text x="15" y="95" fill="#e0f2fe" font-size="10">• Link Credit flow control</text>
    <text x="15" y="115" fill="#e0f2fe" font-size="10">• Direct Cache Transfer (DCT)</text>
    <text x="15" y="135" fill="#e0f2fe" font-size="10">• Far-Memory Atomics</text>
  </g>

  <g transform="translate(310, 65)">
    <!-- CHI-C & CHI-D -->
    <rect width="220" height="150" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <rect width="220" height="30" rx="8" fill="#059669"/>
    <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Issue C &amp; D (Scale &amp; QoS)</text>
    <text x="15" y="55" fill="#d1fae5" font-size="10">• MPAM (Partitioning &amp; QoS)</text>
    <text x="15" y="75" fill="#d1fae5" font-size="10">• Memory Tagging (MTE)</text>
    <text x="15" y="95" fill="#d1fae5" font-size="10">• 512-bit Data bus scaling</text>
    <text x="15" y="115" fill="#d1fae5" font-size="10">• Reduced latency read flows</text>
    <text x="15" y="135" fill="#d1fae5" font-size="10">• Expanded NodeID space</text>
  </g>

  <g transform="translate(580, 65)">
    <!-- CHI-E / F / G -->
    <rect width="220" height="150" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <rect width="220" height="30" rx="8" fill="#db2777"/>
    <text x="110" y="20" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Issue E, F &amp; G (Confidential)</text>
    <text x="15" y="55" fill="#fce7f3" font-size="10">• Realm Management (CCA)</text>
    <text x="15" y="75" fill="#fce7f3" font-size="10">• CXL Coherent Interop</text>
    <text x="15" y="95" fill="#fce7f3" font-size="10">• Memory Encryption support</text>
    <text x="15" y="115" fill="#fce7f3" font-size="10">• High-frequency Mesh opt</text>
    <text x="15" y="135" fill="#fce7f3" font-size="10">• Distributed SLC topologies</text>
  </g>

  <!-- Summary Banner -->
  <g transform="translate(40, 240)">
    <rect width="760" height="140" rx="10" fill="#1e1e38" stroke="#818cf8" stroke-width="1.5"/>
    <text x="380" y="32" fill="#c7d2fe" font-size="14" font-weight="bold" text-anchor="middle">Enterprise Dominance: The Ubiquitous Backbone</text>
    <text x="380" y="65" fill="#e0e7ff" font-size="11" text-anchor="middle">From smartphone multi-cluster chips to 256-core Neoverse cloud servers,</text>
    <text x="380" y="85" fill="#e0e7ff" font-size="11" text-anchor="middle">AMBA CHI is the world standard protocol powering high-performance heterogeneous silicon.</text>
    <text x="380" y="115" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">Scales natively from intra-die Mesh to off-chip CXL server fabrics</text>
  </g>
</svg>