<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg11)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">Point of Serialization (PoS) Resolving Cross-Snoop Races</text>

  <!-- Central Home Node Arbiter -->
  <g transform="translate(275, 80)">
    <rect width="300" height="280" rx="12" fill="#1e1e38" stroke="#818cf8" stroke-width="2"/>
    <text x="150" y="30" fill="#a5b4fc" font-size="15" font-weight="bold" text-anchor="middle">HN-F Serializing Arbiter</text>
    
    <rect x="25" y="60" width="250" height="80" rx="6" fill="#312e81" stroke="#6366f1"/>
    <text x="135" y="85" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">Address Lock Table</text>
    <text x="135" y="110" fill="#c7d2fe" font-size="10" text-anchor="middle">Addr 0x8000: LOCKED by RN-F 0 (Winner)</text>
    <text x="135" y="125" fill="#fca5a5" font-size="10" text-anchor="middle">RN-F 1: Stalled or Retried (Loser)</text>

    <rect x="25" y="160" width="250" height="90" rx="6" fill="#1e293b" stroke="#94a3b8"/>
    <text x="135" y="185" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle">Hazard Resolution Rule:</text>
    <text x="135" y="208" fill="#e2e8f0" font-size="10" text-anchor="middle">• Winner completes snoop invalidation</text>
    <text x="135" y="226" fill="#e2e8f0" font-size="10" text-anchor="middle">• Loser snoop pipeline must invalidate</text>
  </g>

  <!-- Left: RN-F 0 -->
  <g transform="translate(40, 150)">
    <rect width="180" height="120" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">RN-F 0 (Core 0)</text>
    <text x="90" y="55" fill="#a7f3d0" font-size="11" text-anchor="middle">Issues CleanUnique</text>
    <text x="90" y="80" fill="#facc15" font-size="12" font-weight="bold" text-anchor="middle">STATUS: WINNER</text>
    <text x="90" y="102" fill="#d1fae5" font-size="10" text-anchor="middle">Promoted to Unique (M)</text>
  </g>

  <!-- Right: RN-F 1 -->
  <g transform="translate(630, 150)">
    <rect width="180" height="120" rx="8" fill="#991b1b" stroke="#f87171" stroke-width="2"/>
    <text x="90" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">RN-F 1 (Core 1)</text>
    <text x="90" y="55" fill="#fecaca" font-size="11" text-anchor="middle">Issues CleanUnique</text>
    <text x="90" y="80" fill="#fca5a5" font-size="12" font-weight="bold" text-anchor="middle">STATUS: SNOOPED</text>
    <text x="90" y="102" fill="#fecaca" font-size="10" text-anchor="middle">Forced Invalidated (I)</text>
  </g>

  <line x1="220" y1="200" x2="275" y2="200" stroke="#34d399" stroke-width="3"/>
  <line x1="575" y1="200" x2="630" y2="200" stroke="#f87171" stroke-width="3"/>
</svg>