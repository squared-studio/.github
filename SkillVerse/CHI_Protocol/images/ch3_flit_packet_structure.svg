<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg4)"/>
  <text x="425" y="32" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">CHI Flit Types and Anatomy: REQ, RSP, DAT, SNP</text>

  <!-- REQ Flit -->
  <g transform="translate(50, 60)">
    <rect width="750" height="65" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="15" y="24" fill="#38bdf8" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">REQ Flit</text>
    <g transform="translate(100, 10)">
      <rect x="0" y="0" width="70" height="45" fill="#0284c7" stroke="#38bdf8"/><text x="35" y="27" fill="#fff" font-size="10" text-anchor="middle">QoS / VNET</text>
      <rect x="75" y="0" width="70" height="45" fill="#0369a1" stroke="#38bdf8"/><text x="110" y="27" fill="#fff" font-size="10" text-anchor="middle">TgtID</text>
      <rect x="150" y="0" width="70" height="45" fill="#0369a1" stroke="#38bdf8"/><text x="185" y="27" fill="#fff" font-size="10" text-anchor="middle">SrcID</text>
      <rect x="225" y="0" width="60" height="45" fill="#075985" stroke="#38bdf8"/><text x="255" y="27" fill="#fff" font-size="10" text-anchor="middle">TxnID</text>
      <rect x="290" y="0" width="70" height="45" fill="#0c4a6e" stroke="#38bdf8"/><text x="325" y="27" fill="#fff" font-size="10" text-anchor="middle">Opcode</text>
      <rect x="365" y="0" width="180" height="45" fill="#0284c7" stroke="#38bdf8"/><text x="455" y="27" fill="#fff" font-size="10" text-anchor="middle">Address[47:0] / Size</text>
      <rect x="550" y="0" width="85" height="45" fill="#0369a1" stroke="#38bdf8"/><text x="592" y="27" fill="#fff" font-size="10" text-anchor="middle">MemAttr/Order</text>
    </g>
  </g>

  <!-- RSP Flit -->
  <g transform="translate(50, 145)">
    <rect width="750" height="65" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="15" y="24" fill="#34d399" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">RSP Flit</text>
    <g transform="translate(100, 10)">
      <rect x="0" y="0" width="70" height="45" fill="#059669" stroke="#34d399"/><text x="35" y="27" fill="#fff" font-size="10" text-anchor="middle">QoS / VNET</text>
      <rect x="75" y="0" width="70" height="45" fill="#047857" stroke="#34d399"/><text x="110" y="27" fill="#fff" font-size="10" text-anchor="middle">TgtID</text>
      <rect x="150" y="0" width="70" height="45" fill="#047857" stroke="#34d399"/><text x="185" y="27" fill="#fff" font-size="10" text-anchor="middle">SrcID</text>
      <rect x="225" y="0" width="60" height="45" fill="#065f46" stroke="#34d399"/><text x="255" y="27" fill="#fff" font-size="10" text-anchor="middle">TxnID</text>
      <rect x="290" y="0" width="70" height="45" fill="#064e3b" stroke="#34d399"/><text x="325" y="27" fill="#fff" font-size="10" text-anchor="middle">Opcode</text>
      <rect x="365" y="0" width="130" height="45" fill="#059669" stroke="#34d399"/><text x="430" y="27" fill="#fff" font-size="10" text-anchor="middle">Resp / DBID</text>
      <rect x="500" y="0" width="135" height="45" fill="#047857" stroke="#34d399"/><text x="567" y="27" fill="#fff" font-size="10" text-anchor="middle">PCrdType / FwdState</text>
    </g>
  </g>

  <!-- SNP Flit -->
  <g transform="translate(50, 230)">
    <rect width="750" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="15" y="24" fill="#f59e0b" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">SNP Flit</text>
    <g transform="translate(100, 10)">
      <rect x="0" y="0" width="70" height="45" fill="#d97706" stroke="#f59e0b"/><text x="35" y="27" fill="#fff" font-size="10" text-anchor="middle">QoS / VNET</text>
      <rect x="75" y="0" width="70" height="45" fill="#b45309" stroke="#f59e0b"/><text x="110" y="27" fill="#fff" font-size="10" text-anchor="middle">TgtID</text>
      <rect x="150" y="0" width="70" height="45" fill="#b45309" stroke="#f59e0b"/><text x="185" y="27" fill="#fff" font-size="10" text-anchor="middle">SrcID</text>
      <rect x="225" y="0" width="60" height="45" fill="#92400e" stroke="#f59e0b"/><text x="255" y="27" fill="#fff" font-size="10" text-anchor="middle">TxnID</text>
      <rect x="290" y="0" width="70" height="45" fill="#78350f" stroke="#f59e0b"/><text x="325" y="27" fill="#fff" font-size="10" text-anchor="middle">SnpOpcode</text>
      <rect x="365" y="0" width="180" height="45" fill="#d97706" stroke="#f59e0b"/><text x="455" y="27" fill="#fff" font-size="10" text-anchor="middle">Address[47:3]</text>
      <rect x="550" y="0" width="85" height="45" fill="#b45309" stroke="#f59e0b"/><text x="592" y="27" fill="#fff" font-size="10" text-anchor="middle">FwdNID / TxnID</text>
    </g>
  </g>

  <!-- DAT Flit -->
  <g transform="translate(50, 315)">
    <rect width="750" height="65" rx="6" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="15" y="24" fill="#ec4899" font-size="13" font-weight="bold" font-family="system-ui, sans-serif">DAT Flit</text>
    <g transform="translate(100, 10)">
      <rect x="0" y="0" width="70" height="45" fill="#db2777" stroke="#ec4899"/><text x="35" y="27" fill="#fff" font-size="10" text-anchor="middle">QoS / VNET</text>
      <rect x="75" y="0" width="70" height="45" fill="#be185d" stroke="#ec4899"/><text x="110" y="27" fill="#fff" font-size="10" text-anchor="middle">TgtID</text>
      <rect x="150" y="0" width="70" height="45" fill="#be185d" stroke="#ec4899"/><text x="185" y="27" fill="#fff" font-size="10" text-anchor="middle">SrcID</text>
      <rect x="225" y="0" width="60" height="45" fill="#9d174d" stroke="#ec4899"/><text x="255" y="27" fill="#fff" font-size="10" text-anchor="middle">TxnID</text>
      <rect x="290" y="0" width="70" height="45" fill="#831843" stroke="#ec4899"/><text x="325" y="27" fill="#fff" font-size="10" text-anchor="middle">DataID</text>
      <rect x="365" y="0" width="270" height="45" fill="#db2777" stroke="#ec4899"/><text x="500" y="27" fill="#fff" font-size="10" text-anchor="middle">Data Payload (128 / 256 / 512 bits) + BE / Check</text>
    </g>
  </g>
</svg>