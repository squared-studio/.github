<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.8px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">Static Low-Power Checking &amp; Power-Aware Logic Equivalence (PA-LEC)</text>
  <text class="subtitle" x="460" y="48">Proving Zero Structural Violations and PG-Netlist Equivalence Before Tape-Out Without Exhaustive Vectors</text>

  <!-- Left Panel: Static LP Structural Checkers -->
  <rect class="panel" x="20" y="64" width="430" height="308" stroke="#f59e0b" />
  <text class="ptitle" x="36" y="88" fill="#f59e0b">1. Static Low-Power Sign-Off (VC LP / Conformal LP)</text>

  <rect class="box" x="36" y="104" width="398" height="58" />
  <text class="mono" x="48" y="123" fill="#fcd34d">Inputs: Netlist + UPF'/CPF' + Liberty (.lib PG pins)</text>
  <text class="note" x="48" y="142">Exhaustively traverses 100% of structural net paths across</text>
  <text class="note" x="48" y="156">every legal power state transition without needing simulation.</text>

  <rect class="box" x="36" y="174" width="398" height="184" stroke="#38bdf8" />
  <text class="mono" x="48" y="194" fill="#7dd3fc">Mandatory Sign-Off Rule Categories:</text>
  <text class="note" x="48" y="214">1. ISO_MISSING / ISO_REDUNDANT on OFF-&gt;ON boundaries</text>
  <text class="note" x="48" y="232">2. LS_MISSING / LS_DIRECTION mismatch across PST voltages</text>
  <text class="note" x="48" y="250">3. ISO_SUPPLY_OFF: ISO cell powered by switchable rail!</text>
  <text class="note" x="48" y="268">4. CTRL_UNDRIVEN: iso_en / save / pwr_en powered by off rail</text>
  <text class="note" x="48" y="286">5. AON_BUF_VIOLATION: regular buffer inside switched island</text>
  <text class="note" x="48" y="304">6. PG_UNCONNECTED: floating VDD/VSS/nwell pins on SRFF/ELS</text>
  <text class="note" x="48" y="328" fill="#6ee7b7">Tape-out gate: Zero unwaived errors across RTL, Synth, and P&amp;R!</text>

  <!-- Right Panel: Power-Aware LEC -->
  <rect class="panel" x="470" y="64" width="430" height="308" stroke="#34d399" />
  <text class="ptitle" x="486" y="88" fill="#34d399">2. Power-Aware Logic Equivalence (PA-LEC)</text>

  <!-- Golden vs Revised Compare -->
  <rect class="box" x="486" y="104" width="186" height="72" stroke="#38bdf8" />
  <text class="badge" x="579" y="125" fill="#7dd3fc">Golden Reference</text>
  <text class="note" x="579" y="143" text-anchor="middle">RTL + Golden UPF</text>
  <text class="note" x="579" y="160" text-anchor="middle">(Virtual LP behavior)</text>

  <rect class="box" x="698" y="104" width="186" height="72" stroke="#a78bfa" />
  <text class="badge" x="791" y="125" fill="#c4b5fd">Revised Netlist</text>
  <text class="note" x="791" y="143" text-anchor="middle">PG-Netlist + UPF''</text>
  <text class="note" x="791" y="160" text-anchor="middle">(Inserted ISO/LS/SRFF)</text>

  <line x1="579" y1="176" x2="645" y2="212" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrSky)" />
  <line x1="791" y1="176" x2="725" y2="212" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrGreen)" />

  <rect class="box" x="546" y="216" width="278" height="46" stroke="#34d399" />
  <text class="badge" x="685" y="236" fill="#34d399">Formality / Conformal PA-LEC</text>
  <text class="note" x="685" y="253" text-anchor="middle">Formal Boolean Proof Across Power Modes</text>

  <rect class="box" x="486" y="274" width="398" height="84" />
  <text class="mono" x="498" y="294" fill="#6ee7b7">Why Normal LEC Fails on Low-Power Netlists:</text>
  <text class="note" x="498" y="313">Standard LEC ignores PG pins and treats isolation clamps and</text>
  <text class="note" x="498" y="329">retention pins as mismatched combinational/sequential logic.</text>
  <text class="note" x="498" y="345">PA-LEC models corruption + checks isolation enable polarity!</text>
</svg>
