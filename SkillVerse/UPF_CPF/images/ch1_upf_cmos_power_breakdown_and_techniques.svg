<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.8px; fill: #94a3b8; }
    </style>
    <marker id="arrCyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399" />
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="420" />
  <text class="title" x="460" y="28">CMOS Power Dissipation Components &amp; Low-Power Architectural Countermeasures</text>
  <text class="subtitle" x="460" y="48">Mapping Dynamic, Short-Circuit, and Static Leakage Equations Directly to Silicon Power-Reduction Techniques</text>

  <!-- Formula Banner -->
  <rect class="box" x="20" y="64" width="880" height="40" stroke="#38bdf8" />
  <text class="mono" x="460" y="88" text-anchor="middle" fill="#f8fafc">P_total = P_dynamic (alpha * C_L * V_DD^2 * f)  +  P_short_circuit (I_sc * V_DD * t_sc * f)  +  P_static (I_leak * V_DD)</text>

  <!-- Row 1: Dynamic Power -->
  <rect class="panel" x="20" y="118" width="270" height="140" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="142" fill="#38bdf8">1. Dynamic Switching Power</text>
  <rect class="box" x="34" y="152" width="242" height="36" />
  <text class="mono" x="44" y="174" fill="#7dd3fc">P_dyn = alpha * C_L * V_DD^2 * f</text>
  <text class="note" x="36" y="206">Driven by capacitive charging/discharging</text>
  <text class="note" x="36" y="223">Dominates at high frequency &amp; nominal VDD</text>
  <text class="note" x="36" y="240" fill="#fbbf24">Quadratic dependence on V_DD!</text>

  <line x1="290" y1="188" x2="328" y2="188" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)" />

  <rect class="panel" x="332" y="118" width="568" height="140" stroke="#34d399" />
  <text class="ptitle" x="348" y="142" fill="#34d399">Dynamic Power Reduction Techniques</text>

  <rect class="box" x="348" y="152" width="172" height="92" />
  <text class="label" x="358" y="172" fill="#6ee7b7">Clock Gating (ICG)</text>
  <text class="note" x="358" y="191">Targets: alpha, f</text>
  <text class="note" x="358" y="208">Halts idle flop &amp; clock</text>
  <text class="note" x="358" y="224">tree switching activity</text>

  <rect class="box" x="530" y="152" width="172" height="92" />
  <text class="label" x="540" y="172" fill="#6ee7b7">DVFS Scaling</text>
  <text class="note" x="540" y="191">Targets: V_DD^2, f</text>
  <text class="note" x="540" y="208">Scales supply voltage</text>
  <text class="note" x="540" y="224">&amp; clock per workload</text>

  <rect class="box" x="712" y="152" width="172" height="92" />
  <text class="label" x="722" y="172" fill="#6ee7b7">Multi-Voltage Islands</text>
  <text class="note" x="722" y="191">Targets: V_DD^2</text>
  <text class="note" x="722" y="208">Runs slow peripherals</text>
  <text class="note" x="722" y="224">at fixed lower rail</text>

  <!-- Row 2: Static Leakage Power -->
  <rect class="panel" x="20" y="270" width="270" height="134" stroke="#f59e0b" />
  <text class="ptitle" x="36" y="294" fill="#f59e0b">2. Static Leakage Power</text>
  <rect class="box" x="34" y="304" width="242" height="36" />
  <text class="mono" x="44" y="326" fill="#fcd34d">P_stat = (I_sub + I_gate + I_junc) * V_DD</text>
  <text class="note" x="36" y="358">Flows even when clocks are stopped</text>
  <text class="note" x="36" y="375">Subthreshold leakage grows exponentially</text>
  <text class="note" x="36" y="392" fill="#f87171">with lower V_th &amp; higher temperature</text>

  <line x1="290" y1="337" x2="328" y2="337" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmber)" />

  <rect class="panel" x="332" y="270" width="568" height="134" stroke="#a78bfa" />
  <text class="ptitle" x="348" y="294" fill="#a78bfa">Static Leakage Mitigation (UPF/CPF Controlled)</text>

  <rect class="box" x="348" y="304" width="172" height="86" />
  <text class="label" x="358" y="324" fill="#c4b5fd">Power Gating</text>
  <text class="note" x="358" y="343">MTCMOS header/footer</text>
  <text class="note" x="358" y="360">cuts V_DD to ~0V during</text>
  <text class="note" x="358" y="376">idle; cuts ~95% leakage</text>

  <rect class="box" x="530" y="304" width="172" height="86" />
  <text class="label" x="540" y="324" fill="#c4b5fd">Multi-V_th Libraries</text>
  <text class="note" x="540" y="343">LVT on critical paths;</text>
  <text class="note" x="540" y="360">SVT/HVT on paths with</text>
  <text class="note" x="540" y="376">positive timing slack</text>

  <rect class="box" x="712" y="304" width="172" height="86" />
  <text class="label" x="722" y="324" fill="#c4b5fd">Retention &amp; Biasing</text>
  <text class="note" x="722" y="343">SRFF/RBB raises V_th</text>
  <text class="note" x="722" y="360">or preserves state while</text>
  <text class="note" x="722" y="376">main core is powered off</text>
</svg>
