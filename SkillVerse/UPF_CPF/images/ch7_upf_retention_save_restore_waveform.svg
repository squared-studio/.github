<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .grid { stroke: #334155; stroke-width: 1; stroke-dasharray: 4,4; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .sig { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 700; fill: #e2e8f0; }
      .phase { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">Retention Save, Shutdown, Wakeup &amp; Restore Timing Waveform</text>
  <text class="subtitle" x="460" y="48">Cycle-Accurate Protocol Invariants Guaranteeing Zero State Loss Across Power-Down and Wakeup Transitions</text>

  <rect class="panel" x="20" y="64" width="880" height="308" stroke="#38bdf8" />

  <!-- Phase column header guides (x starts at 150, total span 730 -> 8 phases ~ 90px each) -->
  <!-- T0=150, T1=230, T2=315, T3=400, T4=510, T5=600, T6=690, T7=780, T8=870 -->
  <line class="grid" x1="230" y1="74" x2="230" y2="335" />
  <line class="grid" x1="315" y1="74" x2="315" y2="335" />
  <line class="grid" x1="400" y1="74" x2="400" y2="335" />
  <line class="grid" x1="510" y1="74" x2="510" y2="335" />
  <line class="grid" x1="600" y1="74" x2="600" y2="335" />
  <line class="grid" x1="690" y1="74" x2="690" y2="335" />
  <line class="grid" x1="780" y1="74" x2="780" y2="335" />

  <!-- Phase Labels -->
  <text class="phase" x="190" y="88" fill="#34d399">ACTIVE</text>
  <text class="phase" x="272" y="88" fill="#38bdf8">1.CLK OFF</text>
  <text class="phase" x="357" y="88" fill="#c4b5fd">2.SAVE</text>
  <text class="phase" x="455" y="88" fill="#f87171">3.ISO + OFF (SLEEP)</text>
  <text class="phase" x="555" y="88" fill="#f59e0b">4.PWR ON</text>
  <text class="phase" x="645" y="88" fill="#c4b5fd">5.RESTORE</text>
  <text class="phase" x="735" y="88" fill="#38bdf8">6.DE-ISO</text>
  <text class="phase" x="825" y="88" fill="#34d399">ACTIVE</text>

  <!-- 1. CLK_EN -->
  <text class="sig" x="34" y="122">clk_gate_en</text>
  <path d="M150,108 L230,108 L230,128 L780,128 L780,108 L875,108" fill="none" stroke="#34d399" stroke-width="2" />

  <!-- 2. SAVE -->
  <text class="sig" x="34" y="162">ret_save</text>
  <path d="M150,168 L315,168 L315,148 L385,148 L385,168 L875,168" fill="none" stroke="#a78bfa" stroke-width="2" />

  <!-- 3. ISO_EN -->
  <text class="sig" x="34" y="202">iso_en</text>
  <path d="M150,208 L400,208 L400,188 L690,188 L690,208 L875,208" fill="none" stroke="#f59e0b" stroke-width="2" />

  <!-- 4. PWR_SW_EN -->
  <text class="sig" x="34" y="242">pwr_sw_en</text>
  <path d="M150,228 L425,228 L425,248 L510,248 L510,228 L875,228" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- 5. VDD_SW -->
  <text class="sig" x="34" y="282">VDD_SW</text>
  <path d="M150,268 L430,268 L450,288 L510,288 L555,268 L875,268" fill="none" stroke="#f87171" stroke-width="2.2" />
  <text class="mono" x="455" y="302" text-anchor="middle" fill="#fca5a5">0V (Non-ret flops ='X')</text>
  <text class="mono" x="565" y="262" text-anchor="middle" fill="#fcd34d">Ramp Up</text>

  <!-- 6. RESTORE -->
  <text class="sig" x="34" y="322">ret_restore</text>
  <path d="M150,328 L600,328 L600,308 L670,308 L670,328 L875,328" fill="none" stroke="#c4b5fd" stroke-width="2" />

  <!-- Footer invariants -->
  <text class="note" x="34" y="358" fill="#6ee7b7">Key Rules: (A) CLK must stop BEFORE SAVE &amp; stay OFF until after RESTORE.  (B) ISO asserts BEFORE VDD_SW drops &amp; clears AFTER RESTORE completes.</text>
</svg>
