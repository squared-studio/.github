<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .state { fill: #172554; stroke: #38bdf8; stroke-width: 1.5; rx: 8; ry: 8; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .stitle { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="400" />
  <text class="title" x="460" y="28">UPF 2.1+ Abstract Power State Modeling (add_power_state) vs. Si2 CPF</text>
  <text class="subtitle" x="460" y="48">Replacing Rigid Global PSTs with Composable Supply-Set Expressions, Logic Expressions, and Legal/Illegal Constraints</text>

  <!-- Left Panel: UPF 2.1+ add_power_state -->
  <rect class="panel" x="20" y="64" width="465" height="316" stroke="#34d399" />
  <text class="ptitle" x="36" y="88" fill="#34d399">Composable Supply Set &amp; Domain Power States</text>

  <!-- States Diagram -->
  <rect class="state" x="40" y="104" width="128" height="48" stroke="#34d399" />
  <text class="stitle" x="104" y="124" fill="#34d399">ACTIVE_HP</text>
  <text class="note" x="104" y="141" text-anchor="middle">pwr==0.95 &amp;&amp; NORMAL</text>

  <line x1="168" y1="128" x2="206" y2="128" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrSky)" />

  <rect class="state" x="210" y="104" width="128" height="48" stroke="#38bdf8" />
  <text class="stitle" x="274" y="124" fill="#38bdf8">RUN_LP</text>
  <text class="note" x="274" y="141" text-anchor="middle">pwr==0.75 &amp;&amp; NORMAL</text>

  <line x1="338" y1="128" x2="366" y2="128" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrAmb)" />

  <rect class="state" x="370" y="104" width="100" height="48" stroke="#f87171" />
  <text class="stitle" x="420" y="124" fill="#f87171">SLEEP_OFF</text>
  <text class="note" x="420" y="141" text-anchor="middle">!ctrl &amp;&amp; CORRUPT</text>

  <!-- Tcl Code Box -->
  <rect class="box" x="36" y="166" width="434" height="200" />
  <text class="mono" x="48" y="186" fill="#6ee7b7">add_power_state SS_GPU \</text>
  <text class="mono" x="48" y="203">  -state HP   {-supply_expr {power == `{FULL_ON, 0.95}}</text>
  <text class="mono" x="48" y="220">               -simstate NORMAL} \</text>
  <text class="mono" x="48" y="237">  -state OFF  {-supply_expr {power == `{OFF}}</text>
  <text class="mono" x="48" y="254">               -simstate CORRUPT}</text>
  <line x1="48" y1="268" x2="456" y2="268" stroke="#334155" stroke-width="1" />
  <text class="mono" x="48" y="286" fill="#7dd3fc">add_power_state PD_GPU \</text>
  <text class="mono" x="48" y="303">  -state GPU_RET {-logic_expr {ret_en &amp;&amp; !pwr_en} \</text>
  <text class="mono" x="48" y="320">                  -supply_expr {primary == OFF} \</text>
  <text class="mono" x="48" y="337">                  -legal}</text>
  <text class="mono" x="48" y="356" fill="#fca5a5">  -illegal_state  {-logic_expr {clk_en &amp;&amp; !pwr_en}}</text>

  <!-- Right Panel: CPF Parallel & Bottom-Up Refinement -->
  <rect class="panel" x="502" y="64" width="398" height="316" stroke="#f59e0b" />
  <text class="ptitle" x="518" y="88" fill="#f59e0b">Si2 CPF Equivalent &amp; Refinement Rules</text>

  <rect class="box" x="518" y="102" width="366" height="128" />
  <text class="mono" x="530" y="122" fill="#fcd34d"># Si2 CPF 2.0 Nominal Conditions &amp; Modes</text>
  <text class="mono" x="530" y="140">create_nominal_condition -name NC_HP -voltage 0.95</text>
  <text class="mono" x="530" y="157">create_nominal_condition -name NC_OFF -voltage 0.0</text>
  <text class="mono" x="530" y="177" fill="#fcd34d">create_power_mode -name PM_TURBO \</text>
  <text class="mono" x="530" y="194">  -domain_conditions {PD_TOP@NC_08 PD_GPU@NC_HP}</text>
  <text class="mono" x="530" y="211">  -condition {u_pmc/mode == 2'b11}</text>

  <rect class="box" x="518" y="242" width="366" height="124" stroke="#a78bfa" />
  <text class="mono" x="530" y="262" fill="#c4b5fd">UPF -update Refinement Pattern:</text>
  <text class="note" x="530" y="280">IP authors define abstract supply_expr states without</text>
  <text class="note" x="530" y="296">knowing SoC PMC pin names; SoC integrators bind</text>
  <text class="note" x="530" y="312">actual RTL control signals using:</text>
  <text class="mono" x="530" y="332" fill="#7dd3fc">add_power_state SS_GPU -update \</text>
  <text class="mono" x="530" y="350">  -state OFF {-logic_expr {!u_pmc/gpu_pwr_en}}</text>
</svg>
