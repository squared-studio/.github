<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .hdr { fill: #172554; stroke: #38bdf8; stroke-width: 1; }
      .row { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .colh { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #7dd3fc; }
      .cat { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #f59e0b; }
      .upf { font-family: Consolas, 'Courier New', monospace; font-size: 10.8px; fill: #6ee7b7; }
      .cpf { font-family: Consolas, 'Courier New', monospace; font-size: 10.8px; fill: #c4b5fd; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="420" />
  <text class="title" x="460" y="28">IEEE 1801 UPF to Si2 CPF Migration &amp; Command Mapping Matrix</text>
  <text class="subtitle" x="460" y="48">Side-by-Side Construct Equivalence for Multi-Vendor IP Reuse and Legacy CPF-to-UPF Translation</text>

  <rect class="panel" x="20" y="64" width="880" height="338" stroke="#38bdf8" />

  <!-- Header Row -->
  <rect class="hdr" x="34" y="78" width="852" height="32" rx="4" />
  <text class="colh" x="48" y="99">Concept</text>
  <text class="colh" x="195" y="99">IEEE 1801 UPF (2.1 / 3.1)</text>
  <text class="colh" x="505" y="99">Si2 CPF (1.1 / 2.0)</text>
  <text class="colh" x="745" y="99">Key Semantic Delta</text>

  <!-- Row 1 -->
  <rect class="row" x="34" y="114" width="852" height="34" />
  <text class="cat" x="48" y="135">Power Domains</text>
  <text class="upf" x="195" y="135">create_power_domain PD -elements</text>
  <text class="cpf" x="505" y="135">create_power_domain -name PD</text>
  <text class="note" x="745" y="135">CPF uses -default flag</text>

  <!-- Row 2 -->
  <rect class="row" x="34" y="150" width="852" height="34" />
  <text class="cat" x="48" y="171">Power Rails</text>
  <text class="upf" x="195" y="171">create_supply_set / create_supply_net</text>
  <text class="cpf" x="505" y="171">create_power_nets / update_power_dom</text>
  <text class="note" x="745" y="171">UPF splits design/impl</text>

  <!-- Row 3 -->
  <rect class="row" x="34" y="186" width="852" height="34" />
  <text class="cat" x="48" y="207">Power States</text>
  <text class="upf" x="195" y="207">add_power_state / create_pst</text>
  <text class="cpf" x="505" y="207">create_nominal_condition + mode</text>
  <text class="note" x="745" y="207">CPF binds modes inline</text>

  <!-- Row 4 -->
  <rect class="row" x="34" y="222" width="852" height="34" />
  <text class="cat" x="48" y="243">Power Switches</text>
  <text class="upf" x="195" y="243">create_power_switch + map_power_sw</text>
  <text class="cpf" x="505" y="243">create_power_switch_rule + update</text>
  <text class="note" x="745" y="243">UPF splits logical vs cell</text>

  <!-- Row 5 -->
  <rect class="row" x="34" y="258" width="852" height="34" />
  <text class="cat" x="48" y="279">Isolation</text>
  <text class="upf" x="195" y="279">set_isolation + map_isolation_cell</text>
  <text class="cpf" x="505" y="279">create_isolation_rule + update</text>
  <text class="note" x="745" y="279">CPF uses -from/-to args</text>

  <!-- Row 6 -->
  <rect class="row" x="34" y="294" width="852" height="34" />
  <text class="cat" x="48" y="315">Level Shifters</text>
  <text class="upf" x="195" y="315">set_level_shifter + map_level_shifter</text>
  <text class="cpf" x="505" y="315">create_level_shifter_rule + update</text>
  <text class="note" x="745" y="315">Check ELS precedence</text>

  <!-- Row 7 -->
  <rect class="row" x="34" y="330" width="852" height="34" />
  <text class="cat" x="48" y="351">State Retention</text>
  <text class="upf" x="195" y="351">set_retention + map_retention_cell</text>
  <text class="cpf" x="505" y="351">create_state_retention_rule + update</text>
  <text class="note" x="745" y="351">Save/Restore polarity</text>

  <!-- Footer -->
  <text class="note" x="48" y="385" fill="#fcd34d">Hierarchy Macro Reuse:  UPF uses load_upf -scope &lt;inst&gt;   &lt;--&gt;   CPF uses set_instance &lt;inst&gt; -model &lt;macro&gt; / include</text>
</svg>
