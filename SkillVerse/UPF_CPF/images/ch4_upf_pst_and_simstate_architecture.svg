<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 410" width="920" height="410">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .hdr { fill: #172554; stroke: #38bdf8; stroke-width: 1; }
      .row { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .cell { font-family: Consolas, 'Courier New', monospace; font-size: 11px; text-anchor: middle; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="410" />
  <text class="title" x="460" y="28">Power State Table (PST) Matrix &amp; Simulator simstate Semantics</text>
  <text class="subtitle" x="460" y="48">Defining Legal System-Wide Supply Combinations and Governing RTL Corruption Behavior During Power Shutdown</text>

  <!-- Left Panel: Power State Table Matrix -->
  <rect class="panel" x="20" y="64" width="510" height="326" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="88" fill="#38bdf8">SoC Power State Table (add_pst_state Matrix)</text>

  <!-- Table Header -->
  <rect class="hdr" x="36" y="102" width="478" height="32" rx="4" />
  <text class="cell" x="92" y="122" fill="#7dd3fc" font-weight="700">System Mode</text>
  <text class="cell" x="198" y="122" fill="#7dd3fc" font-weight="700">VDD_AON</text>
  <text class="cell" x="296" y="122" fill="#7dd3fc" font-weight="700">VDD_CPU</text>
  <text class="cell" x="394" y="122" fill="#7dd3fc" font-weight="700">VDD_GPU</text>
  <text class="cell" x="476" y="122" fill="#7dd3fc" font-weight="700">ISO/RET</text>

  <!-- Row 1: TURBO -->
  <rect class="row" x="36" y="138" width="478" height="32" />
  <text class="cell" x="92" y="158" fill="#34d399" font-weight="700">TURBO</text>
  <text class="cell" x="198" y="158">0.80V</text>
  <text class="cell" x="296" y="158">1.00V</text>
  <text class="cell" x="394" y="158">0.95V</text>
  <text class="cell" x="476" y="158" fill="#94a3b8">OFF</text>

  <!-- Row 2: RUN -->
  <rect class="row" x="36" y="172" width="478" height="32" />
  <text class="cell" x="92" y="192" fill="#38bdf8" font-weight="700">RUN_NOM</text>
  <text class="cell" x="198" y="192">0.80V</text>
  <text class="cell" x="296" y="192">0.80V</text>
  <text class="cell" x="394" y="192">0.70V</text>
  <text class="cell" x="476" y="192" fill="#94a3b8">OFF</text>

  <!-- Row 3: CPU_IDLE -->
  <rect class="row" x="36" y="206" width="478" height="32" />
  <text class="cell" x="92" y="226" fill="#fcd34d" font-weight="700">GPU_ONLY</text>
  <text class="cell" x="198" y="226">0.80V</text>
  <text class="cell" x="296" y="226" fill="#f87171">OFF</text>
  <text class="cell" x="394" y="226">0.70V</text>
  <text class="cell" x="476" y="226" fill="#fcd34d">CPU ISO+RET</text>

  <!-- Row 4: DEEP_SLEEP -->
  <rect class="row" x="36" y="240" width="478" height="32" />
  <text class="cell" x="92" y="260" fill="#c4b5fd" font-weight="700">DEEP_SLP</text>
  <text class="cell" x="198" y="260">0.80V</text>
  <text class="cell" x="296" y="260" fill="#f87171">OFF</text>
  <text class="cell" x="394" y="260" fill="#f87171">OFF</text>
  <text class="cell" x="476" y="260" fill="#c4b5fd">ALL RET</text>

  <!-- PST Rule Footer -->
  <rect class="box" x="36" y="284" width="478" height="92" stroke="#475569" />
  <text class="mono" x="48" y="304" fill="#7dd3fc">create_pst soc_pst -supplies {VDD_AON VDD_CPU VDD_GPU}</text>
  <text class="mono" x="48" y="323">add_pst_state TURBO   -pst soc_pst -state {S_08 S_10 S_095}</text>
  <text class="mono" x="48" y="341">add_pst_state DEEP_SLP -pst soc_pst -state {S_08 OFF  OFF}</text>
  <text class="note" x="48" y="364" fill="#fbbf24">Drives synthesis MCMM corners + verifies legal LS/ISO crossings.</text>

  <!-- Right Panel: Simulator simstate Semantics -->
  <rect class="panel" x="548" y="64" width="352" height="326" stroke="#a78bfa" />
  <text class="ptitle" x="564" y="88" fill="#a78bfa">IEEE 1801 Simulator simstate Values</text>

  <rect class="box" x="564" y="102" width="320" height="82" stroke="#34d399" />
  <text class="mono" x="576" y="122" fill="#34d399">1. NORMAL</text>
  <text class="note" x="576" y="140">Both power &amp; ground supplies are ON</text>
  <text class="note" x="576" y="156">within operating voltage tolerance.</text>
  <text class="note" x="576" y="172" fill="#6ee7b7">RTL evaluates normally.</text>

  <rect class="box" x="564" y="196" width="320" height="86" stroke="#f87171" />
  <text class="mono" x="576" y="216" fill="#f87171">2. CORRUPT</text>
  <text class="note" x="576" y="234">Supply net or set transitions to OFF.</text>
  <text class="note" x="576" y="250">All non-retained sequential elements, memories,</text>
  <text class="note" x="576" y="266" fill="#fca5a5">and combinational outputs become 'X'.</text>

  <rect class="box" x="564" y="294" width="320" height="82" stroke="#f59e0b" />
  <text class="mono" x="576" y="314" fill="#f59e0b">3. CORRUPT_ON_ACTIVITY</text>
  <text class="note" x="576" y="332">Used for retention / standby states: state is</text>
  <text class="note" x="576" y="348">preserved if clock/data stay idle, but any</text>
  <text class="note" x="576" y="364" fill="#fcd34d">toggle triggers immediate 'X' corruption.</text>
</svg>
