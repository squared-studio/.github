<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .ff { fill: #172554; stroke: #38bdf8; stroke-width: 1.8; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.8px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f87171" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#34d399" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">2-FF Level Synchronizer Architecture, ASYNC_REG Placement &amp; Latency</text>
  <text class="subtitle" x="460" y="48">Isolating Metastability Resolution Inside Adjacent Synchronizer Flip-Flops with Zero Combinational Logic</text>

  <!-- Schematic Banner -->
  <rect class="panel" x="20" y="64" width="880" height="162" stroke="#38bdf8" />
  <text class="ptitle" x="36" y="88" fill="#38bdf8">Canonical 2-FF Synchronizer Boundary (Zero Gates Before or Between Stages)</text>

  <!-- Launch FF in src_clk -->
  <rect class="ff" x="42" y="106" width="136" height="66" stroke="#f59e0b" />
  <text class="badge" x="110" y="128" fill="#fcd34d">FF_LAUNCH</text>
  <text class="note" x="110" y="145" text-anchor="middle">Domain: src_clk</text>
  <text class="mono" x="110" y="162" text-anchor="middle" fill="#fcd34d">src_reg_q</text>

  <!-- CDC crossing wire -->
  <line x1="178" y1="139" x2="296" y2="139" stroke="#f87171" stroke-width="2.2" marker-end="url(#arrRed)" />
  <line x1="238" y1="98" x2="238" y2="190" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5,4" />
  <text class="mono" x="238" y="206" text-anchor="middle" fill="#fca5a5">CDC Boundary (NO Logic!)</text>

  <!-- ASYNC_REG Placement Bounding Box around Sync Stages -->
  <rect x="300" y="96" width="380" height="88" fill="#064e3b" opacity="0.35" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3" rx="8" />
  <text class="mono" x="490" y="112" text-anchor="middle" fill="#6ee7b7">(* ASYNC_REG = "TRUE" *)  Adjacent Placement Box</text>

  <rect class="ff" x="316" y="120" width="128" height="54" stroke="#34d399" />
  <text class="badge" x="380" y="142" fill="#6ee7b7">FF_SYNC_1</text>
  <text class="note" x="380" y="160" text-anchor="middle">Resolves metastability</text>

  <line x1="444" y1="147" x2="532" y2="147" stroke="#34d399" stroke-width="2" marker-end="url(#arrGreen)" />
  <text class="mono" x="488" y="138" text-anchor="middle" fill="#6ee7b7">min route</text>

  <rect class="ff" x="536" y="120" width="128" height="54" stroke="#34d399" />
  <text class="badge" x="600" y="142" fill="#6ee7b7">FF_SYNC_2</text>
  <text class="note" x="600" y="160" text-anchor="middle">Clean dst_clk output</text>

  <!-- Output to dst logic -->
  <line x1="680" y1="139" x2="732" y2="139" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrGreen)" />
  <rect class="box" x="736" y="112" width="144" height="56" stroke="#38bdf8" />
  <text class="badge" x="808" y="135" fill="#7dd3fc">DST Logic</text>
  <text class="note" x="808" y="153" text-anchor="middle">dst_sync_q</text>

  <!-- Bottom Left: Physical Attributes & Constraints -->
  <rect class="panel" x="20" y="240" width="430" height="134" stroke="#a78bfa" />
  <text class="ptitle" x="36" y="264" fill="#a78bfa">Placement Attributes &amp; 3-FF Rule</text>
  <text class="note" x="36" y="285" fill="#e2e8f0">1. ASYNC_REG / dont_touch prevents P&amp;R from splitting FF_SYNC_1 &amp; 2</text>
  <text class="note" x="36" y="302">   across distant die corners (every 100ps wire steals 100ps of t_met!).</text>
  <text class="note" x="36" y="320" fill="#7dd3fc">2. Use 3-FF (or 4-FF) sync when dst_clk &gt; 1.0 GHz or for radiation-</text>
  <text class="note" x="36" y="336">   hardened / ultra-low-voltage near-threshold nodes where tau is large.</text>
  <text class="note" x="36" y="355" fill="#fcd34d">3. Always add synchronizer module to SDC set_max_delay on input path.</text>

  <!-- Bottom Right: 1-to-2 Cycle Latency Uncertainty -->
  <rect class="panel" x="470" y="240" width="430" height="134" stroke="#f59e0b" />
  <text class="ptitle" x="486" y="264" fill="#f59e0b">Fundamental 1-to-2 Cycle Latency Uncertainty</text>
  <text class="note" x="486" y="285" fill="#e2e8f0">When src_reg_q flips right near a dst_clk rising edge:</text>
  <text class="note" x="486" y="303" fill="#6ee7b7">- If FF_SYNC_1 resolves to NEW value: arrives at dst logic in 2 dst cycles.</text>
  <text class="note" x="486" y="320" fill="#fcd34d">- If FF_SYNC_1 resolves to OLD value: arrives at dst logic in 3 dst cycles.</text>
  <text class="note" x="486" y="340" fill="#fca5a5">Rule: Input signal MUST stay stable for &gt;= 2 dst_clk periods (or it misses!).</text>
  <text class="note" x="486" y="356">Two independent signals NEVER stay aligned cycle-for-cycle across 2-FFs!</text>
</svg>
