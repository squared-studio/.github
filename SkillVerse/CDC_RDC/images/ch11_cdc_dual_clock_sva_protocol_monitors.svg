<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.5px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.3px; fill: #94a3b8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">Formal &amp; Dynamic SVA Protocol Assertions for CDC &amp; RDC Sign-Off</text>
  <text class="subtitle" x="460" y="48">Proving Functional Stability Contracts That Static Structural Tools Cannot Verify Without Dynamic Behavior</text>

  <!-- Card 1: Gray Code Assertion -->
  <rect class="panel" x="20" y="64" width="430" height="148" stroke="#34d399" />
  <text class="ptitle" x="36" y="88" fill="#34d399">1. Gray Pointer Unit-Distance Check (Formal/Sim)</text>
  <rect class="box" x="36" y="100" width="398" height="98" />
  <text class="mono" x="48" y="120" fill="#6ee7b7">property p_gray_single_bit_change;</text>
  <text class="mono" x="48" y="138">  @(posedge wclk) disable iff (!wrst_n)</text>
  <text class="mono" x="48" y="156">  !$isunknown($past(wgray)) |-&gt; $onehot0(wgray ^ $past(wgray));</text>
  <text class="mono" x="48" y="174">endproperty</text>
  <text class="note" x="48" y="191">Catches non-power-of-2 rollover or multi-bit pointer jumps instantly.</text>

  <!-- Card 2: MCP / DMUX Data Stability Assertion -->
  <rect class="panel" x="470" y="64" width="430" height="148" stroke="#38bdf8" />
  <text class="ptitle" x="486" y="88" fill="#38bdf8">2. MCP / DMUX Payload Stability Contract</text>
  <rect class="box" x="486" y="100" width="398" height="98" />
  <text class="mono" x="498" y="120" fill="#7dd3fc">property p_mcp_data_stable_while_busy;</text>
  <text class="mono" x="498" y="138">  @(posedge src_clk) disable iff (!src_rst_n)</text>
  <text class="mono" x="498" y="156">  (src_busy) |-&gt; $stable(src_data);</text>
  <text class="mono" x="498" y="174">endproperty</text>
  <text class="note" x="498" y="191">Proves source never mutates payload before dst_ack returns!</text>

  <!-- Card 3: Minimum Pulse Width Retention / Toggle -->
  <rect class="panel" x="20" y="226" width="430" height="148" stroke="#f59e0b" />
  <text class="ptitle" x="36" y="250" fill="#f59e0b">3. Level-Sync Minimum Hold Window Check</text>
  <rect class="box" x="36" y="262" width="398" height="98" />
  <text class="mono" x="48" y="282" fill="#fcd34d">property p_src_held_until_sampled;</text>
  <text class="mono" x="48" y="300">  @(posedge src_clk) $changed(src_lvl) |-&gt;</text>
  <text class="mono" x="48" y="318">  strong(##[1:$] $rose(dst_clk) ##1 $rose(dst_clk));</text>
  <text class="mono" x="48" y="336">  // Or assert $stable(src_lvl) across &gt;= 2 dst_clk edges!</text>
  <text class="note" x="48" y="353">Flags fast pulses vanishing between slow destination clock edges.</text>

  <!-- Card 4: RDC Isolation Coverage Protocol -->
  <rect class="panel" x="470" y="226" width="430" height="148" stroke="#a78bfa" />
  <text class="ptitle" x="486" y="250" fill="#a78bfa">4. RDC Isolation Sequence Safety Check</text>
  <rect class="box" x="486" y="262" width="398" height="98" />
  <text class="mono" x="498" y="282" fill="#c4b5fd">property p_rdc_iso_before_sw_reset;</text>
  <text class="mono" x="498" y="300">  @(posedge sys_clk) disable iff (!por_rst_n)</text>
  <text class="mono" x="498" y="318">  (!subsys_rst_n) |-&gt; (rdc_iso_en == 1'b1);</text>
  <text class="mono" x="498" y="336">endproperty</text>
  <text class="note" x="498" y="353">Proves async subsystem reset never fires while un-isolated!</text>
</svg>
