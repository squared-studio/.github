<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" width="920" height="390">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .box { fill: #0f172a; stroke: #334155; stroke-width: 1.2; rx: 6; ry: 6; }
      .ff { fill: #172554; stroke: #38bdf8; stroke-width: 1.5; rx: 6; ry: 6; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .ptitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 700; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.8px; fill: #e2e8f0; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #94a3b8; }
      .badge { font-family: Consolas, 'Courier New', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrSky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f59e0b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="390" />
  <text class="title" x="460" y="28">Dynamic CDC Simulation: Random Metastability Jitter Injection (CDC-FX)</text>
  <text class="subtitle" x="460" y="48">Modeling Non-Deterministic 0/+1 Cycle Resolution Skew in Functional RTL Simulation to Catch Protocol &amp; Coherency Bugs</text>

  <!-- Schematic Banner -->
  <rect class="panel" x="20" y="64" width="880" height="172" stroke="#f59e0b" />
  <text class="ptitle" x="36" y="88" fill="#f59e0b">How Dynamic CDC Instrumentation Emulates Real Metastable Delay Variance</text>

  <rect class="ff" x="40" y="116" width="110" height="58" stroke="#38bdf8" />
  <text class="badge" x="95" y="138" fill="#7dd3fc">src_reg</text>
  <text class="note" x="95" y="156" text-anchor="middle">Toggles async</text>

  <line x1="150" y1="145" x2="216" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSky)" />

  <!-- Delay / Metastability Injector Box -->
  <rect class="box" x="220" y="102" width="234" height="86" stroke="#f59e0b" />
  <text class="badge" x="337" y="122" fill="#fcd34d">Virtual Random Jitter Injector</text>
  <text class="note" x="337" y="140" text-anchor="middle">When src_reg flips inside dst window:</text>
  <text class="mono" x="337" y="158" text-anchor="middle" fill="#6ee7b7">$urandom%2 ? NEW_VAL : OLD_VAL</text>
  <text class="note" x="337" y="176" text-anchor="middle">(Randomizes +0 vs +1 dst_clk cycle!)</text>

  <line x1="454" y1="145" x2="508" y2="145" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrAmb)" />

  <rect class="ff" x="512" y="116" width="144" height="58" stroke="#34d399" />
  <text class="badge" x="584" y="138" fill="#6ee7b7">FF_SYNC_1 -&gt; 2</text>
  <text class="note" x="584" y="156" text-anchor="middle">Propagates jitter</text>

  <line x1="656" y1="145" x2="704" y2="145" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrSky)" />

  <rect class="box" x="708" y="110" width="174" height="72" stroke="#f87171" />
  <text class="badge" x="795" y="132" fill="#fca5a5">UVM Scoreboard</text>
  <text class="note" x="795" y="150" text-anchor="middle">Immediately catches</text>
  <text class="note" x="795" y="166" text-anchor="middle">FIFO / Coherency bugs!</text>

  <text class="note" x="36" y="218" fill="#fcd34d">Crucial Insight: Zero-delay RTL NEVER sees metastability! Without random +0/+1 jitter injection, skewed 2-FF buses pass simulation 100% and fail on silicon!</text>

  <!-- Bottom Two Cards -->
  <rect class="panel" x="20" y="250" width="430" height="124" stroke="#a78bfa" />
  <text class="ptitle" x="36" y="274" fill="#a78bfa">What Random Jitter Injection Exposes</text>
  <text class="note" x="36" y="294">1. Binary Multi-Bit Skews: Bit[1] picks +0 while Bit[0] picks +1</text>
  <text class="note" x="36" y="310">   producing illegal binary values (01 -&gt; 00 -&gt; 10) right in simulation.</text>
  <text class="note" x="36" y="328">2. DMUX Instability Bugs: If src_data updates too early before +1 sync,</text>
  <text class="note" x="36" y="344">   jitter proves destination grabs corrupted mixed bytes!</text>
  <text class="note" x="36" y="360">3. Reconvergence Skews &amp; Gray Counter Non-Unit Jumps.</text>

  <rect class="panel" x="470" y="250" width="430" height="124" stroke="#34d399" />
  <text class="ptitle" x="486" y="274" fill="#34d399">Why Use Random 0/1 Resolution Instead of 'X'?</text>
  <text class="note" x="486" y="294">If an injector blindly drove 'X' out of FF_SYNC_1, FF_SYNC_2 would</text>
  <text class="note" x="486" y="310">falsely latch 'X' and crash the testbench (even on valid 2-FF syncs!).</text>
  <text class="note" x="486" y="328" fill="#6ee7b7">In real silicon, FF_SYNC_1 resolves cleanly to either OLD (0) or NEW (1)</text>
  <text class="note" x="486" y="344" fill="#6ee7b7">before FF_SYNC_2 clocks—random 0/+1 jitter models exact physics!</text>
  <text class="note" x="486" y="360" fill="#7dd3fc">(Only flag 'X' when t_met margin itself is violated.)</text>
</svg>
