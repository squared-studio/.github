<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .panel { fill: #1e293b; stroke-width: 1.5; rx: 10; ry: 10; }
      .hdr { fill: #172554; stroke: #38bdf8; stroke-width: 1; }
      .row { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .colh { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #7dd3fc; }
      .pat { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11.2px; font-weight: 700; fill: #6ee7b7; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 10.6px; fill: #fcd34d; }
      .note { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10.5px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="440" />
  <text class="title" x="480" y="28">Master CDC &amp; RDC Synchronizer Selection Matrix</text>
  <text class="subtitle" x="480" y="48">Choosing the Optimal Hardware Architecture by Bit Width, Rate, Coherency, and Timing Requirements</text>

  <rect class="panel" x="20" y="64" width="920" height="356" stroke="#38bdf8" />

  <rect class="hdr" x="34" y="78" width="892" height="32" rx="4" />
  <text class="colh" x="48" y="99">Signal / Crossing Scenario</text>
  <text class="colh" x="278" y="99">Recommended Topology</text>
  <text class="colh" x="514" y="99">Latency</text>
  <text class="colh" x="636" y="99">Key Requirement / Constraint</text>

  <rect class="row" x="34" y="114" width="892" height="38" />
  <text class="pat" x="48" y="137">1-Bit Level / Status Flag</text>
  <text class="mono" x="278" y="137">2-FF (or 3-FF) Sync</text>
  <text class="note" x="514" y="137">2–3 dst clks</text>
  <text class="note" x="636" y="137">Stable &gt;= 2 dst cycles; NO combo before FF1</text>

  <rect class="row" x="34" y="154" width="892" height="38" />
  <text class="pat" x="48" y="177">1-Bit Pulse (Known Spacing)</text>
  <text class="mono" x="278" y="177">Open-Loop Toggle Sync</text>
  <text class="note" x="514" y="177">3 dst clks</text>
  <text class="note" x="636" y="177">Spacing &gt;= 2 dst cycles between input pulses</text>

  <rect class="row" x="34" y="194" width="892" height="38" />
  <text class="pat" x="48" y="217">1-Bit Pulse (Burst / Any Ratio)</text>
  <text class="mono" x="278" y="217">Closed-Loop REQ-ACK Sync</text>
  <text class="note" x="514" y="217">~5–6 cycles RT</text>
  <text class="note" x="636" y="217">Honor src_busy backpressure; zero drops</text>

  <rect class="row" x="34" y="234" width="892" height="38" />
  <text class="pat" x="48" y="257">Monotonic +/-1 Counter / Ptr</text>
  <text class="mono" x="278" y="257">Gray Encode -&gt; 2-FF Array</text>
  <text class="note" x="514" y="257">2–3 dst clks</text>
  <text class="note" x="636" y="257">Power-of-2 wrap; bus skew &lt; 1 src period</text>

  <rect class="row" x="34" y="274" width="892" height="38" />
  <text class="pat" x="48" y="297">Sporadic Wide Bus (CSR / Cmd)</text>
  <text class="mono" x="278" y="297">DMUX / Closed-Loop MCP</text>
  <text class="note" x="514" y="297">~3–6 cycles</text>
  <text class="note" x="636" y="297">Data stable until ACK; set_max_delay path</text>

  <rect class="row" x="34" y="314" width="892" height="38" />
  <text class="pat" x="48" y="337">High-Throughput Stream / AXI</text>
  <text class="mono" x="278" y="337">Dual-Clock Async FIFO</text>
  <text class="note" x="514" y="337">1 word / clk</text>
  <text class="note" x="636" y="337">Power-of-2 depth &gt;= 2*RT sync delay</text>

  <rect class="row" x="34" y="354" width="892" height="38" />
  <text class="pat" x="48" y="377">Async Reset Domain Crossing</text>
  <text class="mono" x="278" y="377">Reset Bridge + RDC Iso/ICG</text>
  <text class="note" x="514" y="377">2 clks deassert</text>
  <text class="note" x="636" y="377">Per-clock bridge + isolate before soft reset</text>

  <text class="note" x="48" y="410" fill="#fca5a5">Important: Static / boot-only registers (strap pins, version IDs) require signed quasi_static verification—never un-verified direct paths!</text>
</svg>
